<!DOCTYPE html>
<html lang="en" class="mn-root">
<head>
<script src="local-store-idb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#120C08">
<title>Future Self</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3" defer></script>
<script src="main-sync.js?v=2" defer></script>
<script src="main-backup.js?v=1" defer></script>
<script src="photo-store.js" defer></script>
<script src="topbar.js?v=4" defer></script>

<script src="futureself-data.js?v=1" defer></script>
<script src="main-hero.js?v=1" defer></script>
<script src="futureself-ui.js?v=1" defer></script>
<script src="palaestra-music.js?v=4" defer></script>

<link rel="stylesheet" href="main-theme.css?v=1">
</head>
<body class="mn">

<main>
  <div class="mn-shell">

    <!-- MAIN'S NAV — the same three entries in the same order as
         index.html and weeklyreview.html. #today is a tab of
         index.html, so it carries the hash.

         Self-Care left this row on 2026-08-25. It is its own page now
         — The Asclepion, asclepion.html — reached from the circle
         menu rather than from Main. -->
    <nav class="mn-tabs mn-join-near" id="mnTabs" aria-label="Main">
      <button type="button" class="mn-tab" data-act="go" data-href="index.html">Main</button>
      <button type="button" class="mn-tab" data-act="go" data-href="routine.html">Daily Routine</button>
      <button type="button" class="mn-tab active" aria-current="page">Future Self</button>
      <button type="button" class="mn-tab" data-act="go" data-href="weeklyreview.html">Weekly Review</button>
    </nav>

    <!-- A one-time offer to bring the retired Vision answers across.
         Hides itself once there is nothing to import. -->
    <div id="fsVisionBanner" hidden style="padding-top:var(--mn-6)"></div>

    <section class="mn-section" id="fsQuoteSection">
      <div id="fsQuoteMoment"></div>
      <p class="mn-label" id="fsPeriod" style="text-align:center;margin-top:22px"></p>
      <div class="mn-row" style="justify-content:center;margin-top:18px">
        <button type="button" class="mn-btn mn-btn--sm mn-btn--ghost" data-act="edit-hero">Edit the cover</button>
      </div>
    </section>

    <section class="mn-section" id="fsFocus"></section>
    <section class="mn-section" id="fsBoard"></section>
    <section class="mn-section" id="fsIdentity"></section>
    <section class="mn-section" id="fsTraits"></section>
    <section class="mn-section" id="fsAreas"></section>
    <section class="mn-section" id="fsDay"></section>
    <section class="mn-section" id="fsMemories"></section>
    <section class="mn-section" id="fsBecoming"></section>
    <section class="mn-section" id="fsStandards"></section>
    <section class="mn-section" id="fsMoreLess"></section>
    <section class="mn-section" id="fsEvidence"></section>
    <section class="mn-section" id="fsQuotes"></section>
    <section class="mn-section" id="fsNotes"></section>
    <section class="mn-section" id="fsLetters"></section>

    <section class="mn-section">
      <hr class="mn-rule">
      <div class="mn-row" style="justify-content:center;margin-top:var(--mn-5)">
        <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="index.html">Today</button>
        <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="weeklyreview.html">Weekly review</button>
      </div>
    </section>

  </div>
</main>

<button class="pal-fab pal-fab--music" id="palFabMusic" type="button"
        data-pal-music="" data-pal-music-toggle data-pal-label=""
        aria-controls="palMusic" aria-expanded="false" aria-label="Music">&#9834;</button>

<div class="mn-sheetbg" id="mnSheetBg" role="dialog" aria-modal="true" aria-label="Editor">
  <div class="mn-sheet" id="mnSheet"></div>
</div>
<div class="mn-toast" id="mnToast" role="status" aria-live="polite"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  LocalStoreIDB.ready().then(function () {
    if (window.MainBackup) { try { window.MainBackup.boot(); } catch (e) {} }

    // Mounted once, before anything renders, outside every render host.
    if (window.MainHero) {
      window.MainHero.mount({
        variant: 'full',
        dateText: 'The next three years',
        medal: { lead: 'This season', main: '—' }
      });
    }

    if (window.FutureSelfUI) {
      try { window.FutureSelfUI.boot(); } catch (err) { bootError('Future Self', err); }
    }

    if (window.PalMusic) {
      window.PalMusic.init({
        shelves: ['playlists', 'podcasts', 'watch', 'immersive', 'creepypasta', 'trueHorror', 'spicy', 'reading', 'anime', 'games'],
        defaultShelf: 'playlists'
      });
    }

    // ONE row: `futureself`. This page deliberately does NOT mount
    // `goals` — its only contact with system:vision is a one-time,
    // read-only import, the same shape as palaestra-data.js's importer.
    if (window.MainSync) {
      window.MainSync.mount(['futureself'], {
        onApplied: function () { if (window.FutureSelfUI) window.FutureSelfUI.renderAll(); },
        onPulled: function (row, allPulled) {
          if (!allPulled) return;
          try {
            var n = window.FutureSelfData.seedIfEmpty();
            window.FutureSelfData.migrateSystemVision();
            if (window.FutureSelfUI) window.FutureSelfUI.renderAll();
          } catch (e) {}
        }
      });
    }

    // Offline, or no Supabase at all: seed after a grace period rather
    // than never.
    setTimeout(function () {
      try {
        if (window.FutureSelfData.isEmpty() && !window.FutureSelfData.seeded()) {
          window.FutureSelfData.seedIfEmpty();
          if (window.FutureSelfUI) window.FutureSelfUI.renderAll();
        }
      } catch (e) {}
    }, 5000);
  });
});

function bootError(what, err) {
  try {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:3200;background:#3a0d0d;color:#ffdada;padding:14px 16px;font:13px/1.5 monospace;white-space:pre-wrap;';
    bar.textContent = what + ' failed to load: ' + (err && err.message ? err.message : err);
    document.body.appendChild(bar);
  } catch (e) {}
}
</script>
</body>
</html>
