<!DOCTYPE html>
<html lang="en" class="mn-root">
<head>
<!-- FIRST, AND NEVER DEFERRED. local-store-idb.js replaces
     window.localStorage wholesale before any other script runs; every
     data file below keeps using plain localStorage unchanged. Every
     boot path is then gated on LocalStoreIDB.ready(). -->
<script src="local-store-idb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#120C08">
<title>Main — Today</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3" defer></script>
<script src="main-sync.js?v=1" defer></script>
<script src="main-backup.js?v=1" defer></script>
<script src="photo-store.js" defer></script>
<script src="topbar.js?v=3" defer></script>

<!-- palaestra-data.js is loaded for ONE thing: pal:levels, the effort
     level shared with the Fitness Studio. Today reads and writes it
     through Pal.getLevel / hasLevel / setLevel so there is exactly one
     copy of that answer. Pal.LEVELS is NOT redefined here. -->
<script src="palaestra-data.js?v=5" defer></script>

<!-- mainselfcare-data.js and selfcare-ui.js were dropped here on
     2026-08-25 when Self-Care became its own page. Both files are
     still in the repo and their `mainselfcare:` keys are still synced
     under the goals row — what keeps a key synced is the prefix list
     in main-sync.js, not whether its data file is loaded. Same
     treatment system-data.js and fitness-data.js already have. -->
<script src="today-data.js?v=1" defer></script>
<script src="main-hero.js?v=1" defer></script>
<script src="today-ui.js?v=1" defer></script>
<script src="palaestra-music.js?v=4" defer></script>

<link rel="stylesheet" href="main-theme.css?v=1">
</head>
<body class="mn">

<main>
  <div class="mn-shell">

    <!-- MAIN'S NAV. The same three entries in the same order on all
         three Main documents, so this row never moves under you.
         One is a tab of THIS page (data-tab); two are other
         documents (data-act="go", which flushes pending writes before
         navigating — see today-ui.js's go()). It is a nav, not a
         tablist: a real tablist cannot contain links to other pages.

         SELF-CARE LEFT THIS ROW on 2026-08-25 and became its own
         page, The Asclepion (asclepion.html + asclepion-session.html
         + asclepion-journal.html), reached from the circle menu.

         Its data was NOT migrated. `mainselfcare:` is orphaned but
         intact and MUST STAY in main-sync.js's goals row — dropping a
         prefix deletes its keys on every device at the next push.
         mainselfcare-data.js and selfcare-ui.js are still on disk,
         simply no longer loaded, the same treatment system-data.js
         and fitness-data.js already had. -->
    <div id="mnTabsAnchor"></div>
    <nav class="mn-tabs mn-join-near" id="mnTabs" aria-label="Main">
      <button type="button" class="mn-tab active" data-tab="today" aria-current="page">Today</button>
      <button type="button" class="mn-tab" data-act="go" data-href="futureself.html">Future Self</button>
      <button type="button" class="mn-tab" data-act="go" data-href="weeklyreview.html">Weekly Review</button>
    </nav>

    <!-- ==================== TODAY ==================== -->
    <div class="mn-tabpanel active" data-mainpanel="today">

      <!-- BAND A — the one decision -->
      <section class="mn-section" id="mnEffortSection">
        <div class="mn-section__head">
          <h2 class="mn-plate mn-plate--lg">Today&rsquo;s effort</h2>
          <div class="mn-section__aside"><span class="mn-label" id="mnDate"></span></div>
        </div>
        <hr class="mn-rule">
        <div class="mn-levels" id="mnEffort"></div>
        <p class="mn-small" id="mnEffortHint" style="margin-top:16px"></p>
      </section>

      <!-- BAND B — the morning -->
      <section class="mn-section">
        <div class="mn-section__head">
          <h2 class="mn-plate mn-plate--lg">Morning</h2>
          <div class="mn-section__aside" id="mnMorningMeta"></div>
        </div>
        <hr class="mn-rule">
        <div class="mn-card mn-card--raised" id="mnMorning"></div>
      </section>

      <!-- BAND C — the evening -->
      <section class="mn-section">
        <div class="mn-section__head">
          <h2 class="mn-plate mn-plate--lg">Evening</h2>
          <div class="mn-section__aside" id="mnEveningMeta"></div>
        </div>
        <hr class="mn-rule">
        <div class="mn-card mn-card--raised" id="mnEvening"></div>
        <p class="mn-small" style="margin-top:14px">
          The inbox, the lab notebook and the journal are written in Obsidian and sorted in bulk on Sunday.
          They are listed here so the evening is complete, not so it is done here.
        </p>
      </section>

      <!-- BAND D — the record -->
      <section class="mn-section">
        <div class="mn-section__head">
          <h2 class="mn-plate mn-plate--lg">The record</h2>
          <div class="mn-section__aside">
            <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="weeklyreview.html">Weekly review</button>
            <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="futureself.html">Future self</button>
          </div>
        </div>
        <hr class="mn-rule">
        <div id="mnRecord"></div>
      </section>

    </div>

  </div><!-- /mn-shell -->
</main>

<!-- The music dock's opener. It reads every shelf of the Entertainment
     Studio (vault:media:*) read-only — it never writes a vault key and
     never opens a second sync mount for one. -->
<button class="pal-fab pal-fab--music" id="palFabMusic" type="button"
        data-pal-music="" data-pal-music-toggle data-pal-label=""
        aria-controls="palMusic" aria-expanded="false" aria-label="Music">&#9834;</button>

<!-- Today's layer-2 surface. The .modal-bg chrome that used to sit
     below this belonged to Self-Care's three editors and went with it
     on 2026-08-25. -->
<div class="mn-sheetbg" id="mnSheetBg" role="dialog" aria-modal="true" aria-label="Editor">
  <div class="mn-sheet" id="mnSheet"></div>
</div>

<div class="mn-toast" id="mnToast" role="status" aria-live="polite"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  LocalStoreIDB.ready().then(function () {

    // The local snapshot floor, taken BEFORE the opening cloud pull and
    // pinned. `mainbak:` matches none of the synced prefixes, so nothing
    // in the sync path can reach it — main-sync.js asserts that at mount.
    if (window.MainBackup) { try { window.MainBackup.boot(); } catch (e) {} }

    // The date in the section head. Everything else is rendered by
    // today-ui.js.
    try {
      var dt = new Date();
      var el = document.getElementById('mnDate');
      if (el) el.textContent = dt.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {}

    // THE HERO MOUNTS ONCE, before anything renders and outside every
    // render host. A <video> created by a renderer would be re-created
    // on every repaint and re-download 7.5 MB each time.
    if (window.MainHero) {
      window.MainHero.mount({
        variant: 'full',
        dateText: new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
        scenes: [{ key: 'today', label: 'Today' }],
        medal: { lead: 'Today', main: '—' }
      });
    }

    if (window.TodayUI) { try { window.TodayUI.boot(); } catch (err) { bootError('Today', err); } }

    if (window.PalMusic) {
      window.PalMusic.init({
        // Every shelf of the Entertainment Studio, not just Playlists.
        shelves: ['playlists', 'podcasts', 'watch', 'immersive', 'creepypasta', 'trueHorror', 'spicy', 'reading', 'anime', 'games'],
        defaultShelf: 'playlists'
      });
    }

    // ---- sync ------------------------------------------------------
    // Two rows. main-sync.js owns which prefixes belong to which, and
    // sets handoff:true on both — read its header before changing
    // anything about this.
    if (window.MainSync) {
      window.MainSync.mount(['goals', 'palaestra'], {
        onApplied: function () {
          // A repaint at a moment nobody chose. It must not scroll, and
          // it must not replay the hero — setScene is guarded by key.
          if (window.TodayUI) window.TodayUI.renderAll();
        },
        onPulled: function (row, allPulled) {
          // Seeding waits for the cloud to have had its say. A seeder
          // that runs first concludes the device is empty and writes
          // the defaults over real data still on its way in.
          if (!allPulled) return;
          try {
            if (window.TodayData) {
              var n = window.TodayData.seedIfEmpty();
              if (n && window.TodayUI) window.TodayUI.renderAll();
            }
          } catch (e) {}
        }
      });
    }

    // If sync never mounts at all — offline, no Supabase — the page
    // still has to be usable, so seed after a grace period rather than
    // never. Same 5s guard the removed tabs each used.
    setTimeout(function () {
      try {
        if (window.TodayData && window.TodayData.isEmpty() && !window.TodayData.seeded()) {
          if (window.TodayData.seedIfEmpty() && window.TodayUI) window.TodayUI.renderAll();
        }
      } catch (e) {}
    }, 5000);
  });
});

// A silent top-level throw would otherwise leave this page as static
// chrome with no interactivity and no visible clue why.
function bootError(what, err) {
  try {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:3200;background:#3a0d0d;color:#ffdada;padding:14px 16px;font:13px/1.5 monospace;white-space:pre-wrap;';
    bar.textContent = what + ' failed to load: ' + (err && err.message ? err.message : err);
    document.body.appendChild(bar);
  } catch (e) {}
}
</script>
</body>
</html>
