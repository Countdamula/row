<style>
/* =============================================================
   Learning Dashboard — a standalone page, genuinely separate from the
   pre-existing learning.html ("Learning & Knowledge Hub" — Topics +
   Resources gallery, gold theme). This is a much larger system (Home /
   Learning Dashboard / Active Topics / Daily Notes / Knowledge Maps /
   Personal Frameworks / Master Notes / Research Library / Analytics /
   Settings) with its own explicit palette — crimson/pink on near-black —
   a literal instruction given up front, same "one-off aesthetic
   exception" category as every other themed page in this app (CLAUDE.md
   §6 / DO NOT MODIFY rule 2), scoped entirely to this file's own --lhd-*
   tokens. Vanilla HTML/CSS/JS, no build step, no framework — this repo
   has none anywhere (see CLAUDE.md §1) — but built to *read* like a
   premium Notion/Linear/Raycast/Arc-style tool: glassmorphic cards,
   glowing accents, hand-rolled charts/animations (this app's own
   established "no charting/animation library" convention).
   ============================================================= */
:root, [data-lhd-theme="dark"] {
  --lhd-bg: #0D0D0D;
  --lhd-bg-deep: #060606;
  --lhd-surface: #171717;
  --lhd-surface-2: #1c1c1c;
  --lhd-surface-hover: #212121;
  --lhd-border: rgba(255,255,255,0.08);
  --lhd-border-strong: rgba(255,255,255,0.16);
  --lhd-text: #FFFFFF;
  --lhd-text-dim: rgba(255,255,255,0.66);
  --lhd-text-mute: rgba(255,255,255,0.40);
  --lhd-accent: #E11D48;
  --lhd-accent2: #F472B6;
  --lhd-accent-rgb: 225,29,72;
  --lhd-accent2-rgb: 244,114,182;
  --lhd-good: #34D399;
  --lhd-warn: #F59E0B;
  --lhd-bad: #FB7185;
  --lhd-info: #60A5FA;
  --lhd-shadow: 0 24px 60px rgba(0,0,0,0.55);
  color-scheme: dark;
}
[data-lhd-theme="light"] {
  --lhd-bg: #F4F4F6;
  --lhd-bg-deep: #E9E9EC;
  --lhd-surface: #FFFFFF;
  --lhd-surface-2: #FAFAFB;
  --lhd-surface-hover: #F0EFF2;
  --lhd-border: rgba(20,20,25,0.09);
  --lhd-border-strong: rgba(20,20,25,0.16);
  --lhd-text: #121215;
  --lhd-text-dim: rgba(18,18,21,0.68);
  --lhd-text-mute: rgba(18,18,21,0.46);
  --lhd-accent: #E11D48;
  --lhd-accent2: #db2f83;
  --lhd-accent-rgb: 225,29,72;
  --lhd-accent2-rgb: 219,47,131;
  --lhd-good: #059669;
  --lhd-warn: #b45309;
  --lhd-bad: #dc2626;
  --lhd-info: #2563eb;
  --lhd-shadow: 0 24px 50px rgba(20,20,30,0.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--lhd-bg); }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--lhd-text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}
::selection { background: rgba(var(--lhd-accent-rgb), 0.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--lhd-border-strong); border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }
a { color: inherit; }
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }

/* ---------- ambient background glow ---------- */
.lhd-bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(700px 500px at 12% -6%, rgba(var(--lhd-accent-rgb), 0.16), transparent 60%),
    radial-gradient(600px 480px at 100% 8%, rgba(var(--lhd-accent2-rgb), 0.10), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(var(--lhd-accent-rgb), 0.06), transparent 60%);
}

/* ---------- app shell ---------- */
.lhd-app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.lhd-sidebar {
  width: 250px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: rgba(15,15,16,0.6);
  border-right: 1px solid var(--lhd-border);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
[data-lhd-theme="light"] .lhd-sidebar { background: rgba(255,255,255,0.72); }
.lhd-sb-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 62px 18px 20px;
  border-bottom: 1px solid var(--lhd-border);
}
.lhd-sb-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(155deg, var(--lhd-accent) 0%, var(--lhd-accent2) 100%);
  box-shadow: 0 6px 18px rgba(var(--lhd-accent-rgb), 0.4);
  font-size: 16px;
}
.lhd-sb-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.lhd-sb-title { font-size: 14.5px; font-weight: 800; }
.lhd-sb-subtitle { font-size: 10px; color: var(--lhd-text-mute); letter-spacing: 0.04em; text-transform: uppercase; }

.lhd-sb-nav { flex: 1 1 auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.lhd-sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px;
  text-decoration: none; color: var(--lhd-text-dim);
  font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.lhd-sb-item:hover { background: var(--lhd-surface-hover); color: var(--lhd-text); }
.lhd-sb-item:active { transform: scale(0.98); }
.lhd-sb-item.active {
  background: linear-gradient(180deg, rgba(var(--lhd-accent-rgb),0.22) 0%, rgba(var(--lhd-accent-rgb),0.08) 100%);
  color: #fff; border-color: rgba(var(--lhd-accent-rgb), 0.3);
}
[data-lhd-theme="light"] .lhd-sb-item.active { color: var(--lhd-accent); }
.lhd-sb-item.active::before {
  content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px;
  background: linear-gradient(180deg, var(--lhd-accent), var(--lhd-accent2));
  box-shadow: 0 0 10px rgba(var(--lhd-accent-rgb), 0.7);
}
.lhd-sb-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.lhd-sb-footer { padding: 12px 18px 18px; border-top: 1px solid var(--lhd-border); }
.lhd-sb-streak {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--lhd-text-mute);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.lhd-sb-streak b { color: var(--lhd-accent2); font-size: 13px; }

.lhd-workspace { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

.lhd-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 26px; padding-left: 60px;
  background: rgba(13,13,13,0.55);
  backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid var(--lhd-border);
}
[data-lhd-theme="light"] .lhd-header { background: rgba(244,244,246,0.7); }
.lhd-sb-toggle { display: none; }
.lhd-search-wrap {
  flex: 1 1 auto; max-width: 420px;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 13px; border-radius: 11px;
  background: var(--lhd-surface); border: 1px solid var(--lhd-border);
  color: var(--lhd-text-mute); cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.lhd-search-wrap:hover { border-color: var(--lhd-border-strong); }
.lhd-search-wrap span.lhd-kbd {
  margin-left: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 10.5px; padding: 2px 6px; border-radius: 6px;
  background: var(--lhd-surface-2); border: 1px solid var(--lhd-border-strong); color: var(--lhd-text-mute);
}
.lhd-search-label { font-size: 13px; }
.lhd-header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.lhd-icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--lhd-surface); border: 1px solid var(--lhd-border); color: var(--lhd-text-dim);
  cursor: pointer; font-size: 15px; transition: all 0.15s ease;
}
.lhd-icon-btn:hover { background: var(--lhd-surface-hover); border-color: var(--lhd-border-strong); color: var(--lhd-text); transform: translateY(-1px); }
.lhd-header-title { font-size: 13.5px; font-weight: 700; color: var(--lhd-text-mute); display: none; }

.lhd-main { flex: 1 1 auto; padding: 26px 30px 70px; max-width: 1320px; width: 100%; margin: 0 auto; }
.lhd-section { display: none; animation: lhdFadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
.lhd-section.active { display: block; }
@keyframes lhdFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.lhd-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.lhd-page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lhd-accent2); margin-bottom: 6px; }
.lhd-page-title { font-size: 25px; font-weight: 800; }
.lhd-page-subtext { font-size: 13px; color: var(--lhd-text-mute); margin-top: 4px; max-width: 560px; }

/* ---------- shared components ---------- */
.lhd-card {
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--lhd-border);
  border-radius: 16px;
  backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
  transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1), border-color 0.2s ease, box-shadow 0.22s ease;
}
[data-lhd-theme="light"] .lhd-card { background: var(--lhd-surface); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset; }
.lhd-card.lhd-hoverable:hover { transform: translateY(-4px); border-color: rgba(var(--lhd-accent-rgb), 0.35); box-shadow: var(--lhd-shadow), 0 0 0 1px rgba(var(--lhd-accent-rgb),0.15); }
.lhd-card-pad { padding: 18px; }

.lhd-grid { display: grid; gap: 16px; }
.lhd-grid-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.lhd-grid-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.lhd-grid-2 { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }

.lhd-btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  padding: 9px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 700;
  border: 1px solid var(--lhd-border-strong); background: var(--lhd-surface); color: var(--lhd-text);
  cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
}
.lhd-btn:hover { background: var(--lhd-surface-hover); transform: translateY(-1px); }
.lhd-btn:active { transform: translateY(0) scale(0.98); }
.lhd-btn-primary {
  background: linear-gradient(135deg, var(--lhd-accent) 0%, var(--lhd-accent2) 100%);
  border-color: transparent; color: #fff;
  box-shadow: 0 8px 22px rgba(var(--lhd-accent-rgb), 0.35);
}
.lhd-btn-primary:hover { box-shadow: 0 10px 28px rgba(var(--lhd-accent-rgb), 0.5); filter: brightness(1.05); }
.lhd-btn-ghost { background: transparent; border-color: transparent; color: var(--lhd-text-mute); }
.lhd-btn-ghost:hover { background: var(--lhd-surface-hover); color: var(--lhd-text); }
.lhd-btn-danger { border-color: rgba(251,113,133,0.4); color: var(--lhd-bad); background: rgba(251,113,133,0.08); }
.lhd-btn-danger:hover { background: rgba(251,113,133,0.16); }
.lhd-btn-sm { padding: 6px 11px; font-size: 11.5px; border-radius: 8px; }
.lhd-btn-icon-sm {
  width: 28px; height: 28px; border-radius: 8px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--lhd-surface-2); border: 1px solid var(--lhd-border); color: var(--lhd-text-dim); cursor: pointer;
}
.lhd-btn-icon-sm:hover { background: var(--lhd-surface-hover); color: var(--lhd-text); }

.lhd-chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.lhd-chip {
  padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--lhd-surface); border: 1px solid var(--lhd-border); color: var(--lhd-text-dim);
  cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
}
.lhd-chip:hover { border-color: var(--lhd-border-strong); }
.lhd-chip.active {
  background: linear-gradient(135deg, rgba(var(--lhd-accent-rgb),0.9), rgba(var(--lhd-accent2-rgb),0.85));
  border-color: transparent; color: #fff;
}
.lhd-tag {
  display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
  background: var(--lhd-surface-2); border: 1px solid var(--lhd-border); color: var(--lhd-text-mute);
}

.lhd-progress-bar { height: 7px; border-radius: 999px; background: var(--lhd-surface-2); overflow: hidden; position: relative; }
.lhd-progress-fill {
  height: 100%; border-radius: 999px; width: 0%;
  background: linear-gradient(90deg, var(--lhd-accent), var(--lhd-accent2));
  box-shadow: 0 0 10px rgba(var(--lhd-accent-rgb), 0.6);
  transition: width 0.7s cubic-bezier(0.16,1,0.3,1);
}

input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="color"], select, textarea {
  width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px;
  background: var(--lhd-surface-2); border: 1px solid var(--lhd-border-strong); border-radius: 10px;
  color: var(--lhd-text); padding: 9px 12px; outline: none; transition: border-color 0.15s ease, background 0.15s ease;
}
textarea { resize: vertical; min-height: 70px; line-height: 1.55; font-family: inherit; }
input:focus, select:focus, textarea:focus { border-color: var(--lhd-accent); background: var(--lhd-surface); }
::placeholder { color: var(--lhd-text-mute); }
label.lhd-field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--lhd-text-mute); margin-bottom: 6px; }
.lhd-field { margin-bottom: 14px; }
.lhd-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lhd-checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--lhd-text-dim); cursor: pointer; }
.lhd-checkbox-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--lhd-accent); cursor: pointer; }

.lhd-empty { text-align: center; padding: 50px 20px; color: var(--lhd-text-mute); }
.lhd-empty-icon { font-size: 34px; margin-bottom: 10px; opacity: 0.7; }
.lhd-empty-title { font-size: 14px; font-weight: 700; color: var(--lhd-text-dim); margin-bottom: 4px; }
.lhd-empty-sub { font-size: 12.5px; }

/* ---------- skeleton loading ---------- */
.lhd-skel { border-radius: 12px; background: linear-gradient(100deg, var(--lhd-surface) 30%, var(--lhd-surface-hover) 50%, var(--lhd-surface) 70%); background-size: 200% 100%; animation: lhdShimmer 1.4s ease-in-out infinite; }
@keyframes lhdShimmer { to { background-position: -200% 0; } }

/* ---------- modal ---------- */
.lhd-modal-bg {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(5,5,5,0.62); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; transition: opacity 0.2s ease;
}
.lhd-modal-bg.show { display: flex; opacity: 1; }
.lhd-modal {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  background: rgba(20,20,21,0.92); border: 1px solid var(--lhd-border-strong); border-radius: 18px;
  padding: 24px; box-shadow: var(--lhd-shadow);
  transform: translateY(10px) scale(0.98); transition: transform 0.22s cubic-bezier(0.16,1,0.3,1);
  backdrop-filter: blur(20px) saturate(1.4);
}
[data-lhd-theme="light"] .lhd-modal { background: #fff; }
.lhd-modal-bg.show .lhd-modal { transform: translateY(0) scale(1); }
.lhd-modal-wide { max-width: 880px; }
.lhd-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.lhd-modal-title { font-size: 17px; font-weight: 800; }
.lhd-modal-close { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--lhd-border); background: var(--lhd-surface-2); color: var(--lhd-text-dim); cursor: pointer; font-size: 14px; }
.lhd-modal-close:hover { background: var(--lhd-surface-hover); color: var(--lhd-text); }
.lhd-modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--lhd-border); }
.lhd-modal-actions-split { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--lhd-border); }

/* ---------- topic detail full page ---------- */
.lhd-topic-page-bg {
  position: fixed; inset: 0; z-index: 2900; background: var(--lhd-bg);
  display: none; overflow-y: auto;
}
.lhd-topic-page-bg.show { display: block; }
.lhd-tp-header { padding: 22px 30px; border-bottom: 1px solid var(--lhd-border); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; background: rgba(13,13,13,0.85); backdrop-filter: blur(14px); z-index: 5; }
[data-lhd-theme="light"] .lhd-tp-header { background: rgba(244,244,246,0.88); }
.lhd-tp-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; box-shadow: 0 8px 22px rgba(0,0,0,0.3); }
.lhd-tp-title-wrap { flex: 1 1 auto; min-width: 0; }
.lhd-tp-title { font-size: 21px; font-weight: 800; }
.lhd-tp-meta { font-size: 12px; color: var(--lhd-text-mute); margin-top: 3px; }
.lhd-tp-body { padding: 24px 30px 80px; max-width: 1100px; margin: 0 auto; }
.lhd-tp-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--lhd-border); padding-bottom: 12px; }
.lhd-tp-tab { padding: 8px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--lhd-text-mute); background: transparent; border: 1px solid transparent; cursor: pointer; }
.lhd-tp-tab:hover { background: var(--lhd-surface-hover); color: var(--lhd-text); }
.lhd-tp-tab.active { background: rgba(var(--lhd-accent-rgb),0.16); color: #fff; border-color: rgba(var(--lhd-accent-rgb),0.3); }
[data-lhd-theme="light"] .lhd-tp-tab.active { color: var(--lhd-accent); }
.lhd-tp-panel { display: none; }
.lhd-tp-panel.active { display: block; animation: lhdFadeUp 0.3s ease both; }

/* ---------- stat tiles ---------- */
.lhd-stat-tile { padding: 18px; }
.lhd-stat-icon { font-size: 20px; margin-bottom: 10px; opacity: 0.9; }
.lhd-stat-value { font-size: 26px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.lhd-stat-label { font-size: 11.5px; color: var(--lhd-text-mute); margin-top: 3px; font-weight: 600; }

/* ---------- topic dashboard card ---------- */
.lhd-topic-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.lhd-tc-top { display: flex; align-items: center; gap: 12px; }
.lhd-tc-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.lhd-tc-title { font-size: 15.5px; font-weight: 800; }
.lhd-tc-week { font-size: 11px; color: var(--lhd-text-mute); font-weight: 600; }
.lhd-tc-pct { margin-left: auto; font-size: 20px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.lhd-tc-question { font-size: 12px; color: var(--lhd-text-dim); background: var(--lhd-surface-2); border-radius: 10px; padding: 10px 12px; border-left: 2px solid var(--lhd-accent); }
.lhd-tc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.lhd-tc-hours { font-size: 11.5px; color: var(--lhd-text-mute); }
.lhd-tc-resume { font-size: 12px; font-weight: 800; color: var(--lhd-accent2); display: inline-flex; align-items: center; gap: 4px; }

/* ---------- home ---------- */
.lhd-home-hero {
  padding: 26px 26px; margin-bottom: 22px;
  background: linear-gradient(135deg, rgba(var(--lhd-accent-rgb),0.16), rgba(var(--lhd-accent2-rgb),0.06));
  border: 1px solid rgba(var(--lhd-accent-rgb),0.25);
}
.lhd-home-hero-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--lhd-accent2); }
.lhd-home-hero-title { font-size: 26px; font-weight: 800; margin-top: 6px; }
.lhd-home-hero-sub { font-size: 13px; color: var(--lhd-text-dim); margin-top: 8px; max-width: 560px; }
.lhd-quick-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.lhd-checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--lhd-border); }
.lhd-checklist-item:last-child { border-bottom: none; }
.lhd-check-circle {
  width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--lhd-border-strong);
  flex-shrink: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent; transition: all 0.15s ease;
}
.lhd-check-circle.done { background: linear-gradient(135deg, var(--lhd-accent), var(--lhd-accent2)); border-color: transparent; color: #fff; }
.lhd-checklist-text { font-size: 13px; flex: 1 1 auto; }
.lhd-checklist-item.lhd-done .lhd-checklist-text { color: var(--lhd-text-mute); text-decoration: line-through; }

.lhd-recent-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; border-radius: 10px; }
.lhd-recent-row:hover { background: var(--lhd-surface-hover); }
.lhd-recent-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.lhd-recent-title { font-size: 13px; font-weight: 700; }
.lhd-recent-time { font-size: 11px; color: var(--lhd-text-mute); }

/* ---------- timer ---------- */
.lhd-timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0 4px; }
.lhd-timer-ring-wrap { position: relative; width: 168px; height: 168px; }
.lhd-timer-ring-wrap svg { transform: rotate(-90deg); }
.lhd-timer-track { fill: none; stroke: var(--lhd-surface-2); stroke-width: 8; }
.lhd-timer-fill { fill: none; stroke: url(#lhdTimerGrad); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
.lhd-timer-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lhd-timer-digits { font-size: 27px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; transition: color 0.2s ease; }
.lhd-timer-digits.flash { color: var(--lhd-accent2); animation: lhdDigitFlash 0.5s ease; }
@keyframes lhdDigitFlash { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.14); } }
.lhd-timer-fill.lhd-pulsing { animation: lhdRingPulse 2s ease-in-out infinite; }
@keyframes lhdRingPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.lhd-timer-phase { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lhd-text-mute); margin-top: 2px; }
.lhd-timer-controls { display: flex; gap: 8px; }
.lhd-timer-mode-row { display: flex; gap: 6px; }

/* ---------- command palette ---------- */
.lhd-cmdk-bg { align-items: flex-start !important; padding-top: 12vh !important; }
.lhd-cmdk { max-width: 620px; padding: 0; overflow: hidden; }
.lhd-cmdk-input-wrap { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--lhd-border); }
.lhd-cmdk-input { border: none !important; background: transparent !important; font-size: 15px !important; padding: 0 !important; }
.lhd-cmdk-input:focus { border: none !important; }
.lhd-cmdk-results { max-height: 50vh; overflow-y: auto; padding: 8px; }
.lhd-cmdk-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.lhd-cmdk-item.sel { background: rgba(var(--lhd-accent-rgb),0.18); }
.lhd-cmdk-item-icon { font-size: 15px; width: 20px; text-align: center; }
.lhd-cmdk-item-label { font-weight: 600; }
.lhd-cmdk-item-tag { margin-left: auto; font-size: 10px; color: var(--lhd-text-mute); text-transform: uppercase; letter-spacing: 0.05em; }
.lhd-cmdk-empty { padding: 30px; text-align: center; color: var(--lhd-text-mute); font-size: 13px; }

/* ---------- knowledge map canvas ---------- */
.lhd-map-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.lhd-map-canvas-wrap { position: relative; height: 560px; border-radius: 16px; overflow: hidden; background: var(--lhd-surface); border: 1px solid var(--lhd-border); background-image: radial-gradient(var(--lhd-border-strong) 1px, transparent 1px); background-size: 22px 22px; }
.lhd-map-canvas { position: absolute; inset: 0; transform-origin: 0 0; cursor: grab; }
.lhd-map-canvas.panning { cursor: grabbing; }
.lhd-map-node {
  position: absolute; min-width: 120px; max-width: 220px; padding: 10px 14px; border-radius: 12px;
  background: var(--lhd-surface-2); border: 2px solid var(--lhd-border-strong); font-size: 12.5px; font-weight: 700;
  cursor: grab; user-select: none; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: box-shadow 0.15s ease;
}
.lhd-map-node:hover { box-shadow: 0 0 0 3px rgba(var(--lhd-accent-rgb),0.25), 0 6px 18px rgba(0,0,0,0.35); }
.lhd-map-node.connecting { outline: 2px dashed var(--lhd-accent2); }
.lhd-map-svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.lhd-map-edge-label { font-size: 10px; fill: var(--lhd-text-mute); }
.lhd-map-zoom-label { font-family: ui-monospace, monospace; font-size: 11px; color: var(--lhd-text-mute); min-width: 40px; text-align: center; }

/* ---------- research library / rows ---------- */
.lhd-research-group { margin-bottom: 26px; }
.lhd-research-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.lhd-research-group-title { font-size: 13px; font-weight: 800; }
.lhd-research-group-count { font-size: 11px; color: var(--lhd-text-mute); font-family: ui-monospace, monospace; }
.lhd-research-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; }
.lhd-research-status-dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
.lhd-research-title { font-size: 13px; font-weight: 700; }
.lhd-research-meta { font-size: 11.5px; color: var(--lhd-text-mute); margin-top: 2px; }
.lhd-research-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }

/* ---------- frameworks ---------- */
.lhd-fw-card { padding: 20px; cursor: pointer; }
.lhd-fw-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
.lhd-fw-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
.lhd-fw-desc { font-size: 12.5px; color: var(--lhd-text-mute); line-height: 1.5; }
.lhd-fw-sections-count { font-size: 11px; color: var(--lhd-text-mute); margin-top: 12px; }
.lhd-pf-section { background: var(--lhd-surface-2); border: 1px solid var(--lhd-border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.lhd-pf-section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.lhd-pf-section-title-input { font-weight: 700; border: none !important; background: transparent !important; padding: 0 !important; font-size: 13px !important; }
.lhd-pf-section-body { border: none !important; background: transparent !important; padding: 0 !important; font-size: 12.5px !important; min-height: 50px; }

/* ---------- master notes ---------- */
.lhd-mn-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
.lhd-mn-list { display: flex; flex-direction: column; gap: 4px; max-height: 74vh; overflow-y: auto; padding-right: 4px; }
.lhd-mn-list-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--lhd-text-dim); }
.lhd-mn-list-item:hover { background: var(--lhd-surface-hover); }
.lhd-mn-list-item.active { background: rgba(var(--lhd-accent-rgb),0.16); color: #fff; }
[data-lhd-theme="light"] .lhd-mn-list-item.active { color: var(--lhd-accent); }
.lhd-mn-list-item-topic { font-size: 10px; color: var(--lhd-text-mute); font-weight: 500; margin-top: 2px; }
.lhd-mn-reading { padding: 26px 30px; min-height: 400px; }
.lhd-mn-reading h3 { font-size: 22px; margin-bottom: 14px; }
.lhd-mn-reading h4 { font-size: 17px; margin: 20px 0 8px; }
.lhd-mn-reading h5 { font-size: 14px; margin: 16px 0 6px; color: var(--lhd-accent2); }
.lhd-mn-reading p { font-size: 13.5px; line-height: 1.75; color: var(--lhd-text-dim); margin: 0 0 12px; }
.lhd-mn-reading ul, .lhd-mn-reading ol { font-size: 13.5px; line-height: 1.75; color: var(--lhd-text-dim); padding-left: 22px; margin: 0 0 12px; }
.lhd-mn-reading blockquote { border-left: 3px solid var(--lhd-accent); padding: 4px 0 4px 16px; margin: 0 0 14px; color: var(--lhd-text-mute); font-style: italic; }
.lhd-mn-reading code { background: var(--lhd-surface-2); padding: 1px 6px; border-radius: 5px; font-family: ui-monospace, monospace; font-size: 12px; }
.lhd-backlink { color: var(--lhd-accent2); font-weight: 700; cursor: pointer; border-bottom: 1px dashed rgba(var(--lhd-accent2-rgb),0.5); }
.lhd-mn-toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.lhd-mn-toc { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--lhd-border); }
.lhd-mn-toc-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lhd-text-mute); margin-bottom: 8px; }
.lhd-mn-toc-item { font-size: 12px; color: var(--lhd-text-dim); padding: 4px 0; cursor: pointer; }
.lhd-mn-toc-item:hover { color: var(--lhd-accent2); }
.lhd-mn-backlinks { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--lhd-border); }
.lhd-mn-search { margin-bottom: 10px; }

/* ---------- analytics ---------- */
.lhd-chart-card { padding: 20px; }
.lhd-chart-title { font-size: 13px; font-weight: 800; margin-bottom: 16px; }
.lhd-bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 140px; }
.lhd-bar-col { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
.lhd-bar { width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--lhd-accent2), var(--lhd-accent)); min-height: 3px; transition: height 0.6s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 0 12px rgba(var(--lhd-accent-rgb),0.35); }
.lhd-bar-label { font-size: 10px; color: var(--lhd-text-mute); font-weight: 600; }
.lhd-donut-wrap { display: flex; align-items: center; gap: 22px; }
.lhd-donut { width: 128px; height: 128px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
.lhd-donut::before { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: var(--lhd-surface); }
[data-lhd-theme="light"] .lhd-donut::before { background: #fff; }
.lhd-donut-center { position: relative; z-index: 1; text-align: center; }
.lhd-donut-pct { font-size: 22px; font-weight: 800; }
.lhd-donut-sub { font-size: 10px; color: var(--lhd-text-mute); }
.lhd-status-breakdown { display: flex; flex-direction: column; gap: 8px; }
.lhd-status-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.lhd-status-dot { width: 9px; height: 9px; border-radius: 999px; }
.lhd-status-count { margin-left: auto; font-weight: 700; font-family: ui-monospace, monospace; }

/* ---------- settings ---------- */
.lhd-settings-section { padding: 22px; margin-bottom: 16px; }
.lhd-settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--lhd-border); gap: 16px; }
.lhd-settings-row:last-child { border-bottom: none; }
.lhd-settings-label { font-size: 13px; font-weight: 700; }
.lhd-settings-desc { font-size: 11.5px; color: var(--lhd-text-mute); margin-top: 2px; }
.lhd-toggle { width: 42px; height: 24px; border-radius: 999px; background: var(--lhd-surface-2); border: 1px solid var(--lhd-border-strong); position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.2s ease; }
.lhd-toggle.on { background: linear-gradient(135deg, var(--lhd-accent), var(--lhd-accent2)); border-color: transparent; }
.lhd-toggle-knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: #fff; transition: transform 0.2s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.lhd-toggle.on .lhd-toggle-knob { transform: translateX(18px); }
.lhd-swatch-row { display: flex; gap: 8px; }
.lhd-swatch { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s ease; }
.lhd-swatch:hover { transform: scale(1.1); }
.lhd-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--lhd-accent); }

/* ---------- boot error banner ---------- */
#lhdBootErrorBanner { position: fixed; top: 0; left: 0; right: 0; z-index: 99999; background: #3a0a0a; color: #ffdede; padding: 14px 18px; font: 12.5px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 50vh; overflow: auto; border-bottom: 3px solid var(--lhd-bad); display: none; }
#lhdSyncStatus { font-size: 10.5px; color: var(--lhd-text-mute); font-family: ui-monospace, monospace; }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .lhd-sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 2500; transform: translateX(-100%); width: 260px; }
  .lhd-sidebar.lhd-sb-open { transform: translateX(0); }
  .lhd-sb-toggle { display: inline-flex; }
  .lhd-header { padding-left: 60px; }
  .lhd-search-label { display: none; }
  .lhd-search-wrap { max-width: 44px; padding: 9px; justify-content: center; }
  .lhd-search-wrap .lhd-kbd { display: none; }
  .lhd-mn-layout { grid-template-columns: 1fr; }
  .lhd-mn-list { max-height: 220px; }
}
@media (max-width: 620px) {
  .lhd-main { padding: 18px 14px 60px; }
  .lhd-field-row { grid-template-columns: 1fr; }
  .lhd-tp-header, .lhd-tp-body { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>

<div class="lhd-bg-glow"></div>
<div class="lhd-app">

  <aside class="lhd-sidebar" id="lhdSidebar">
    <div class="lhd-sb-brand">
      <span class="lhd-sb-mark">🧠</span>
      <span class="lhd-sb-brand-text">
        <span class="lhd-sb-title">Learning Dashboard</span>
        <span class="lhd-sb-subtitle">Personal Learning OS</span>
      </span>
    </div>
    <nav class="lhd-sb-nav" id="lhdSbNav"></nav>
    <div class="lhd-sb-footer">
      <div class="lhd-sb-streak">🔥 <b id="lhdSbStreak">0</b> day streak</div>
      <div id="lhdSyncStatus" style="margin-top:6px;">Changes save automatically</div>
    </div>
  </aside>

  <div class="lhd-workspace">
    <header class="lhd-header">
      <button type="button" class="lhd-icon-btn lhd-sb-toggle" id="lhdSbToggleBtn" aria-label="Toggle sidebar">☰</button>
      <div class="lhd-search-wrap" id="lhdSearchTrigger">
        <span>🔎</span>
        <span class="lhd-search-label">Search or jump to…</span>
        <span class="lhd-kbd">Ctrl K</span>
      </div>
      <span class="lhd-header-title" id="lhdHeaderTitle"></span>
      <div class="lhd-header-actions">
        <button type="button" class="lhd-icon-btn" id="lhdTimerQuickBtn" title="Study timer">⏱️</button>
        <button type="button" class="lhd-icon-btn" id="lhdThemeToggleBtn" title="Toggle theme">🌙</button>
        <button type="button" class="lhd-icon-btn" id="lhdNewTopicBtn" title="New topic">➕</button>
      </div>
    </header>

    <main class="lhd-main" id="lhdMain">
      <!-- sections rendered by JS -->
      <section class="lhd-section" id="lhd-sec-home"></section>
      <section class="lhd-section" id="lhd-sec-dashboard"></section>
      <section class="lhd-section" id="lhd-sec-topics"></section>
      <section class="lhd-section" id="lhd-sec-daily"></section>
      <section class="lhd-section" id="lhd-sec-maps"></section>
      <section class="lhd-section" id="lhd-sec-frameworks"></section>
      <section class="lhd-section" id="lhd-sec-masternotes"></section>
      <section class="lhd-section" id="lhd-sec-research"></section>
      <section class="lhd-section" id="lhd-sec-analytics"></section>
      <section class="lhd-section" id="lhd-sec-settings"></section>
    </main>
  </div>
</div>

<!-- Topic detail full-page overlay -->
<div class="lhd-topic-page-bg" id="lhdTopicPageBg">
  <div class="lhd-tp-header">
    <button type="button" class="lhd-icon-btn" id="lhdTpBackBtn">←</button>
    <span class="lhd-tp-icon" id="lhdTpIcon"></span>
    <div class="lhd-tp-title-wrap">
      <div class="lhd-tp-title" id="lhdTpTitle"></div>
      <div class="lhd-tp-meta" id="lhdTpMeta"></div>
    </div>
    <button type="button" class="lhd-btn lhd-btn-primary" id="lhdTpStudyBtn">📝 Daily Study Session</button>
    <button type="button" class="lhd-icon-btn" id="lhdTpEditBtn" title="Edit topic">✎</button>
  </div>
  <div class="lhd-tp-body">
    <div class="lhd-tp-tabs" id="lhdTpTabs"></div>
    <div id="lhdTpPanels"></div>
  </div>
</div>

<!-- Generic form modal -->
<div class="lhd-modal-bg" id="lhdFormModalBg">
  <div class="lhd-modal" id="lhdFormModal">
    <div class="lhd-modal-head">
      <div class="lhd-modal-title" id="lhdFormModalTitle">—</div>
      <button type="button" class="lhd-modal-close" id="lhdFormModalCloseBtn">✕</button>
    </div>
    <div id="lhdFormModalBody"></div>
    <div class="lhd-modal-actions-split" id="lhdFormModalActions">
      <button type="button" class="lhd-btn lhd-btn-danger" id="lhdFormModalDeleteBtn" style="display:none;">Delete</button>
      <div style="display:flex; gap:9px; margin-left:auto;">
        <button type="button" class="lhd-btn lhd-btn-ghost" id="lhdFormModalCancelBtn">Cancel</button>
        <button type="button" class="lhd-btn lhd-btn-primary" id="lhdFormModalSubmitBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Daily Study Widget modal -->
<div class="lhd-modal-bg" id="lhdDailyModalBg">
  <div class="lhd-modal lhd-modal-wide">
    <div class="lhd-modal-head">
      <div class="lhd-modal-title">📝 Daily Study Session</div>
      <button type="button" class="lhd-modal-close" id="lhdDailyCloseBtn">✕</button>
    </div>
    <div id="lhdDailyBody"></div>
    <div class="lhd-modal-actions">
      <button type="button" class="lhd-btn lhd-btn-ghost" id="lhdDailyOpenObsidianBtn">📓 Open in Obsidian</button>
      <button type="button" class="lhd-btn lhd-btn-primary" id="lhdDailySaveBtn">Save Session</button>
    </div>
  </div>
</div>

<!-- Study Timer -->
<div class="lhd-modal-bg" id="lhdTimerModalBg">
  <div class="lhd-modal" style="max-width:380px;">
    <div class="lhd-modal-head">
      <div class="lhd-modal-title">⏱️ Study Timer</div>
      <button type="button" class="lhd-modal-close" id="lhdTimerCloseBtn">✕</button>
    </div>
    <div class="lhd-field"><label class="lhd-field-label">Topic</label><select id="lhdTimerTopicSelect"></select></div>
    <div class="lhd-timer-mode-row" style="margin-bottom:14px;">
      <span class="lhd-chip active" id="lhdTimerModeStopwatch" data-timer-mode="stopwatch">Stopwatch</span>
      <span class="lhd-chip" id="lhdTimerModePomodoro" data-timer-mode="pomodoro">Pomodoro</span>
    </div>
    <div class="lhd-timer-wrap">
      <div class="lhd-timer-ring-wrap">
        <svg width="168" height="168" viewBox="0 0 168 168">

<script>
(function () {

function $(id) { return document.getElementById(id); }

function showBootErrorBanner(err, context) {
  try {
    var banner = $('lhdBootErrorBanner');
    if (!banner) return;
    var detail = (context ? '[' + context + '] ' : '') + (err && err.stack ? err.stack : String(err));
    banner.style.display = 'block';
    banner.textContent = '⚠ Learning Dashboard failed to load correctly:\n' + detail + '\n';
    var btn = document.createElement('button');
    btn.textContent = 'Copy error details';
    btn.style.cssText = 'margin-top:8px;padding:6px 12px;background:#ff5757;color:#3a0a0a;border:0;border-radius:4px;font-weight:bold;cursor:pointer;';
    btn.addEventListener('click', function () {
      try { navigator.clipboard.writeText(detail); btn.textContent = 'Copied!'; } catch (e) {}
    });
    banner.appendChild(btn);
  } catch (e2) {}
}
function runSafely(fn, context) {

}

// =====================================================================
// STATE

var state = {

  activeMnId: null,
  activeMnQuery: '',
  activeMapId: null,
  mapConnectFrom: null,

  timer: { running: false, mode: 'stopwatch', startedAt: 0, elapsedMs: 0, topicId: null, phase: 'work', phaseSecs: 0, phaseElapsedMs: 0 },

};

var SECTIONS = [

  { key: 'dashboard', icon: '🧠', label: 'Learning Dashboard' },
  { key: 'topics', icon: '📚', label: 'Active Topics' },
  { key: 'daily', icon: '📝', label: 'Daily Notes' },
  { key: 'maps', icon: '🗺️', label: 'Knowledge Maps' },
  { key: 'frameworks', icon: '💡', label: 'Personal Frameworks' },
  { key: 'masternotes', icon: '🎓', label: 'Master Notes' },
  { key: 'research', icon: '📂', label: 'Research Library' },
  { key: 'analytics', icon: '📊', label: 'Analytics' },
  { key: 'settings', icon: '⚙️', label: 'Settings' }
];

function esc(s) { return D.escapeHtml(s); }
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtTimeAgo(ts) {
  if (!ts) return 'never';
  var diff = Date.now() - ts;
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';

}

function applyTheme(theme) {

// =====================================================================
// GENERIC FORM MODAL — one reusable builder for every add/edit modal in
// this feature (Topic/Research/Framework/Note/Project/Question/Map),
// instead of a near-duplicate modal per entity type. A field descriptor:
// {key, label, type: 'text'|'textarea'|'select'|'number'|'color'|'checkbox',
//  options: [{value,label}], placeholder, rows, half: true}
// =====================================================================
function buildFieldHtml(f, values) {
  var val = values && values[f.key] != null ? values[f.key] : (f.type === 'checkbox' ? false : '');
  var id = 'lhdField_' + f.key;
  var wrapStyle = f.half ? 'flex:1 1 0; min-width:140px;' : '';
  var inner = '';
  if (f.type === 'textarea') {
    inner = '<textarea id="' + id + '" placeholder="' + esc(f.placeholder || '') + '" rows="' + (f.rows || 4) + '">' + esc(val) + '</textarea>';
  } else if (f.type === 'select') {
    inner = '<select id="' + id + '">' + (f.options || []).map(function (o) {
      return '<option value="' + esc(o.value) + '"' + (o.value === val ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('') + '</select>';
  } else if (f.type === 'checkbox') {
    return '<label class="lhd-checkbox-row" style="' + wrapStyle + '"><input type="checkbox" id="' + id + '"' + (val ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
  } else if (f.type === 'color') {
    inner = '<div class="lhd-swatch-row">' + D.TOPIC_COLORS.map(function (c) {
      return '<button type="button" class="lhd-swatch' + (c === val ? ' active' : '') + '" data-color-field="' + id + '" data-color="' + c + '" style="background:' + c + ';"></button>';
    }).join('') + '<input type="hidden" id="' + id + '" value="' + esc(val || D.TOPIC_COLORS[0]) + '"></div>';
  } else {
    inner = '<input type="' + f.type + '" id="' + id + '" placeholder="' + esc(f.placeholder || '') + '" value="' + esc(val) + '">';
  }
  return '<div class="lhd-field" style="' + wrapStyle + '">' + (f.type !== 'checkbox' ? '<label class="lhd-field-label">' + esc(f.label) + '</label>' : '') + inner + '</div>';
}
function openFormModal(opts) {
  // Always reset to the plain field-form layout first — openFrameworkDetail()
  // repurposes this same modal shell for a richer, non-field layout (wide +
  // hidden action row) and re-applies those two overrides itself right after
  // calling this function; resetting here guarantees a later *ordinary*
  // openFormModal() call (Topic/Research/etc.) can never inherit that state,
  // even if the framework detail modal was last dismissed via the plain ✕/
  // backdrop-click path instead of closeFrameworkDetail().
  $('lhdFormModal').classList.remove('lhd-modal-wide');
  $('lhdFormModalActions').style.display = 'flex';
  $('lhdFormModalTitle').textContent = opts.title;
  var rows = [];
  var i = 0;
  while (i < opts.fields.length) {
    var f = opts.fields[i];
    if (f.half) {
      var group = [f];
      var j = i + 1;
      while (j < opts.fields.length && opts.fields[j].half) { group.push(opts.fields[j]); j++; }
      rows.push('<div style="display:flex; gap:12px;">' + group.map(function (gf) { return buildFieldHtml(gf, opts.values); }).join('') + '</div>');
      i = j;
    } else {
      rows.push(buildFieldHtml(f, opts.values));
      i++;
    }
  }
  $('lhdFormModalBody').innerHTML = rows.join('');
  bindFormDraft($('lhdFormModalBody'), 'lhdField_', 'lhd', opts.title);
  Array.prototype.forEach.call(document.querySelectorAll('#lhdFormModalBody .lhd-swatch'), function (btn) {
    btn.addEventListener('click', function () {
      var fieldId = btn.getAttribute('data-color-field');
      $(fieldId).value = btn.getAttribute('data-color');
      var siblings = btn.parentElement.querySelectorAll('.lhd-swatch');
      Array.prototype.forEach.call(siblings, function (s) { s.classList.remove('active'); });
      btn.classList.add('active');
    });
  });
  $('lhdFormModalDeleteBtn').style.display = opts.onDelete ? 'inline-flex' : 'none';
  $('lhdFormModalSubmitBtn').textContent = opts.submitLabel || 'Save';
  $('lhdFormModalSubmitBtn').onclick = function () {
    var out = {};
    opts.fields.forEach(function (f) {
      var el = $('lhdField_' + f.key);
      if (!el) return;
      if (f.type === 'checkbox') out[f.key] = el.checked;
      else if (f.type === 'number') out[f.key] = el.value === '' ? 0 : parseFloat(el.value);
      else out[f.key] = el.value;
    });
    if (opts.validate) {
      var err = opts.validate(out);
      if (err) { alert(err); return; }
    }
    closeFormModal(true);          // saved for real: the draft has done its job
    opts.onSubmit(out);
  };
  $('lhdFormModalDeleteBtn').onclick = function () {
    if (!opts.onDelete) return;
    if (!confirm(opts.deleteConfirm || 'Delete this?')) return;
    closeFormModal(true);
    opts.onDelete();
  };
  $('lhdFormModalBg').classList.add('show');
}
// ---------------------------------------------------------------------
// FORM DRAFTS
//
// Everything typed into this dialog lived only in the DOM until Save was
// pressed, so a refresh — or a phone deciding to discard a backgrounded
// tab — took the whole form with it, including the long-form master-note
// body. AthDraft writes every keystroke to the REAL localStorage (via a
// hidden iframe, because local-store-idb.js's writes are not durable at
// unload) under `athdraft:`, a prefix sync.js cannot see.
//
// The fields already carry id="lhdField_<key>"; data-f is derived from
// that here rather than by editing buildFieldHtml, so no field type has to
// change. The fingerprint of the OPENING values keeps two records that
// share a title apart — "Edit topic" is the same string for every topic.
// ---------------------------------------------------------------------
var formDraft = null;
function bindFormDraft(body, idPrefix, ns, title) {
  formDraft = null;
  if (!window.AthDraft || !body) return;
  var fields = body.querySelectorAll('[id^="' + idPrefix + '"]');
  if (!fields.length) return;          // a repurposed, non-field layout
  Array.prototype.forEach.call(fields, function (el) {
    el.setAttribute('data-f', el.id.slice(idPrefix.length));
  });
  formDraft = AthDraft.bind(
    'modal:' + ns + ':' + (title || '') + ':' + AthDraft.fingerprint(body), body,
    { onRestore: function (when) {
        AthDraft.banner(body, when, function () {
          if (formDraft) formDraft.clear();
          formDraft = null;
        });
      } }
  );
}
/* Cancel, Escape, the ✕, the backdrop and a successful save are all
   DECISIONS to be done with the form, so the draft goes with them. A
   refresh is not a decision, and its draft has to survive. */
function closeFormModal(discard) {
  if (formDraft) { if (discard) formDraft.clear(); else formDraft.save(); }
  formDraft = null;
  $('lhdFormModalBg').classList.remove('show');
}
$('lhdFormModalCloseBtn').addEventListener('click', function () { closeFormModal(true); });
$('lhdFormModalCancelBtn').addEventListener('click', function () { closeFormModal(true); });
$('lhdFormModalBg').addEventListener('click', function (e) { if (e.target === $('lhdFormModalBg')) closeFormModal(true); });

// =====================================================================
// TOPIC add/edit + delete
// =====================================================================
function topicFormFields() {
  return [
    { key: 'title', label: 'Title', type: 'text', placeholder: 'e.g. Artificial Intelligence' },
    { key: 'icon', label: 'Icon (emoji)', type: 'text', placeholder: '🧠', half: true },
    { key: 'status', label: 'Status', type: 'select', half: true, options: D.TOPIC_STATUSES.map(function (s) { return { value: s, label: s.charAt(0).toUpperCase() + s.slice(1) }; }) },
    { key: 'currentWeek', label: 'Current Week', type: 'select', half: true, options: [1, 2, 3, 4].map(function (w) { return { value: String(w), label: 'Week ' + w + ' — ' + D.weekInfo(w).stage }; }) },
    { key: 'estimatedHours', label: 'Estimated Hours', type: 'number', placeholder: '20', half: true },
    { key: 'completionPct', label: 'Completion %', type: 'number', placeholder: '0' },
    { key: 'currentQuestion', label: 'Current Question', type: 'text', placeholder: "What am I trying to answer right now?" },
    { key: 'description', label: 'Description', type: 'textarea', rows: 3 },
    { key: 'color', label: 'Color', type: 'color' }
  ];
}
function openTopicModal(topic) {
  var values = topic ? Object.assign({}, topic, { currentWeek: String(topic.currentWeek) }) : { status: 'active', currentWeek: '1', color: D.TOPIC_COLORS[0] };
  openFormModal({
    title: topic ? 'Edit Topic' : 'New Topic',
    fields: topicFormFields(),
    values: values,
    submitLabel: topic ? 'Save Changes' : 'Create Topic',
    validate: function (v) { if (!v.title.trim()) return 'Give this topic a title first.'; return null; },
    onSubmit: function (v) {
      v.currentWeek = parseInt(v.currentWeek, 10) || 1;
      if (topic) { D.Topics.update(topic.id, v); }
      else { v.order = D.nextOrder(D.topicsSorted()); D.Topics.add(v); }
      renderAllSections();
      if (state.activeTopicPageId && topic && state.activeTopicPageId === topic.id) renderTopicPage();
    },
    onDelete: topic ? function () {
      D.Topics.remove(topic.id);
      closeTopicPage();
      renderAllSections();
    } : null,
    deleteConfirm: 'Delete "' + (topic ? topic.title : '') + '"? Its research/notes/frameworks/master notes stay, just unlinked from this topic.'
  });
}

// =====================================================================
// HOME
// =====================================================================
function renderHome() {
  var cur = D.currentTopic();
  var settings = D.getSettings();
  var todayLog = cur ? D.dailyLogFor(cur.id, D.todayISO()) : null;
  var hoursToday = todayLog ? Math.round((todayLog.minutes || 0) / 6) / 10 : 0;

  var html = '';
  html += '<div class="lhd-card lhd-home-hero">';
  html += '<div class="lhd-home-hero-eyebrow">Today’s Study Goal</div>';
  html += '<div class="lhd-home-hero-title">' + (settings.defaultSessionMinutes || 25) + ' minutes on ' + (cur ? esc(cur.title) : 'a topic') + '</div>';
  html += '<div class="lhd-home-hero-sub">' + (cur ? esc(cur.currentQuestion || cur.description || 'No current question set yet — open the topic to add one.') : 'Create your first topic to get started.') + '</div>';
  html += '<div class="lhd-quick-actions">';
  html += '<button class="lhd-btn lhd-btn-primary" id="lhdHomeStartSession">📝 Start Study Session</button>';
  html += '<button class="lhd-btn" id="lhdHomeOpenTimer">⏱️ Study Timer</button>';
  html += '<button class="lhd-btn" id="lhdHomeNewTopic">➕ New Topic</button>';
  html += '</div></div>';

  html += '<div class="lhd-grid lhd-grid-4" style="margin-bottom:22px;">';
  html += statTile('📆', String(D.currentStreak()), 'Day Streak');
  html += statTile('⏱️', D.totalHoursLogged() + 'h', 'Hours Studied');
  html += statTile('📚', String(D.activeTopics().length), 'Active Topics');
  html += statTile('🎓', String(D.MasterNotes.list().length), 'Master Notes');
  html += '</div>';

  html += '<div class="lhd-grid lhd-grid-2">';

  // Current topic + week/stage card
  html += '<div class="lhd-card lhd-card-pad">';
  html += '<div class="lhd-chart-title">Current Topic & Stage</div>';
  if (cur) {
    var wk = D.weekInfo(cur.currentWeek);
    html += '<div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">';
    html += '<span class="lhd-tc-icon" style="background:' + cur.color + '22; color:' + cur.color + ';">' + esc(cur.icon) + '</span>';
    html += '<div><div style="font-weight:800; font-size:14.5px;">' + esc(cur.title) + '</div><div style="font-size:11.5px; color:var(--lhd-text-mute);">Week ' + cur.currentWeek + ' · ' + esc(wk.stage) + '</div></div>';
    html += '<div style="margin-left:auto; font-size:22px; font-weight:800; font-family:ui-monospace,monospace;">' + cur.completionPct + '%</div>';
    html += '</div>';
    html += '<div class="lhd-progress-bar" style="margin-bottom:14px;"><div class="lhd-progress-fill" style="width:' + cur.completionPct + '%;"></div></div>';
    html += '<button class="lhd-btn lhd-btn-sm" data-open-topic="' + cur.id + '">Resume →</button>';
  } else { html += emptyState('🧠', 'No topics yet', 'Create your first topic to see it here.'); }
  html += '</div>';

  // Today's checklist card
  html += '<div class="lhd-card lhd-card-pad">';
  html += '<div class="lhd-chart-title">Today’s Checklist' + (hoursToday ? ' · ' + hoursToday + 'h logged today' : '') + '</div>';
  if (cur) {
    html += D.MEDIA_CHECKLIST.map(function (m) {
      var done = todayLog && todayLog.media[m.key];
      return checklistRow(m.icon + ' ' + m.label, !!done, m.key);
    }).join('');
  } else { html += emptyState('✅', 'Nothing to check off yet', 'Add a topic to get a daily checklist.'); }
  html += '</div>';

  html += '</div>'; // end grid-2

  html += '<div class="lhd-grid lhd-grid-2" style="margin-top:16px;">';
  // Recently studied
  html += '<div class="lhd-card lhd-card-pad">';
  html += '<div class="lhd-chart-title">Recently Studied Topics</div>';
  var recent = D.recentlyStudiedTopics(5);
  if (recent.length) {
    html += recent.map(function (t) {
      return '<div class="lhd-recent-row" data-open-topic="' + t.id + '">' +
        '<span class="lhd-recent-icon" style="background:' + t.color + '22; color:' + t.color + ';">' + esc(t.icon) + '</span>' +
        '<div><div class="lhd-recent-title">' + esc(t.title) + '</div><div class="lhd-recent-time">' + fmtTimeAgo(t.lastStudiedAt) + '</div></div>' +
        '</div>';
    }).join('');
  } else { html += emptyState('🕓', 'Nothing studied yet', 'Your recently studied topics will show up here.'); }
  html += '</div>';

  // Progress overview
  html += '<div class="lhd-card lhd-card-pad">';
  html += '<div class="lhd-chart-title">Progress Overview</div>';

  if (topics.length) {
    html += topics.map(function (t) {
      return '<div style="margin-bottom:12px;">' +

        '<div class="lhd-progress-bar"><div class="lhd-progress-fill" style="width:' + t.completionPct + '%; background:linear-gradient(90deg,' + t.color + ',var(--lhd-accent2));"></div></div>' +
        '</div>';
    }).join('');
  } else { html += emptyState('📈', 'No progress yet', ''); }
  html += '</div>';

  $('lhd-sec-home').innerHTML = html;
  wireCommonRowActions($('lhd-sec-home'));
  var startBtn = $('lhdHomeStartSession'); if (startBtn) startBtn.addEventListener('click', function () { openDailyWidget(cur ? cur.id : null); });
  var timerBtn = $('lhdHomeOpenTimer'); if (timerBtn) timerBtn.addEventListener('click', openTimerQuickModal);

  Array.prototype.forEach.call($('lhd-sec-home').querySelectorAll('[data-checklist-key]'), function (el) {

}
function statTile(icon, value, label) {
  return '<div class="lhd-card lhd-stat-tile"><div class="lhd-stat-icon">' + icon + '</div><div class="lhd-stat-value">' + value + '</div><div class="lhd-stat-label">' + esc(label) + '</div></div>';
}
function emptyState(icon, title, sub) {
  return '<div class="lhd-empty"><div class="lhd-empty-icon">' + icon + '</div><div class="lhd-empty-title">' + esc(title) + '</div><div class="lhd-empty-sub">' + esc(sub || '') + '</div></div>';
}
function checklistRow(label, done, key) {
  return '<div class="lhd-checklist-item' + (done ? ' lhd-done' : '') + '">' +
    '<span class="lhd-check-circle' + (done ? ' done' : '') + '" data-checklist-key="' + key + '">' + (done ? '✓' : '') + '</span>' +
    '<span class="lhd-checklist-text">' + label + '</span></div>';

function toggleTodayChecklist(topicId, key) {

// =====================================================================
// DAILY STUDY WIDGET (modal) — topic selector, media checklist, critical
// thinking questions, output checklist, Obsidian hand-off. Backed by one
// DailyLog per topic+date, upserted on Save.
// =====================================================================
var dailyWidgetTopicId = null;
function openDailyWidget(topicId) {
  var topics = D.topicsSorted();
  if (!topics.length) { alert('Create a topic first.'); return; }
  dailyWidgetTopicId = topicId && D.Topics.get(topicId) ? topicId : topics[0].id;
  renderDailyWidget();
  $('lhdDailyModalBg').classList.add('show');
}
function closeDailyWidget() { $('lhdDailyModalBg').classList.remove('show'); }
function renderDailyWidget() {
  var t = D.Topics.get(dailyWidgetTopicId);
  var log = D.dailyLogFor(dailyWidgetTopicId, D.todayISO()) || { media: {}, criticalQuestions: {}, outputs: {}, minutes: 0 };
  var wk = D.weekInfo(t.currentWeek);
  var html = '';
  html += '<div class="lhd-field"><label class="lhd-field-label">Topic</label><select id="lhdDailyTopicSelect">' +
    D.topicsSorted().map(function (x) { return '<option value="' + x.id + '"' + (x.id === dailyWidgetTopicId ? ' selected' : '') + '>' + esc(x.icon) + ' ' + esc(x.title) + '</option>'; }).join('') + '</select></div>';
  html += '<div style="font-size:11.5px; color:var(--lhd-text-mute); margin:-6px 0 16px;">Week ' + t.currentWeek + ' · ' + esc(wk.stage) + ' — this week\'s outputs: ' + wk.outputs.join(', ') + '</div>';

  html += '<div class="lhd-field-label" style="margin-bottom:8px;">Media Checklist</div>';
  html += '<div class="lhd-chip-row" style="margin-bottom:18px;">';
  D.MEDIA_CHECKLIST.forEach(function (m) {
    html += '<span class="lhd-chip' + (log.media[m.key] ? ' active' : '') + '" data-daily-media="' + m.key + '">' + m.icon + ' ' + m.label + '</span>';
  });
  html += '</div>';

  html += '<div class="lhd-field-label" style="margin-bottom:8px;">Critical Thinking Questions</div>';
  D.CRITICAL_QUESTIONS.forEach(function (q) {
    html += '<div class="lhd-field"><label class="lhd-field-label" style="text-transform:none; font-weight:600; color:var(--lhd-text-dim);">' + esc(q.label) + '</label>' +
      '<textarea rows="2" id="lhdDailyCq_' + q.key + '">' + esc(log.criticalQuestions[q.key] || '') + '</textarea></div>';
  });

  html += '<div class="lhd-field-label" style="margin-bottom:8px; margin-top:6px;">Output Checklist</div>';
  D.OUTPUT_FIELDS.forEach(function (o) {
    html += '<div class="lhd-field"><label class="lhd-field-label" style="text-transform:none; font-weight:600; color:var(--lhd-text-dim);">' + esc(o.label) + '</label>' +
      '<textarea rows="2" id="lhdDailyOut_' + o.key + '">' + esc(log.outputs[o.key] || '') + '</textarea></div>';
  });

  html += '<div class="lhd-field"><label class="lhd-field-label">Minutes Studied</label><input type="number" id="lhdDailyMinutes" value="' + (log.minutes || 0) + '"></div>';

  $('lhdDailyBody').innerHTML = html;
  $('lhdDailyTopicSelect').addEventListener('change', function (e) { dailyWidgetTopicId = e.target.value; renderDailyWidget(); });
  Array.prototype.forEach.call($('lhdDailyBody').querySelectorAll('[data-daily-media]'), function (chip) {
    chip.addEventListener('click', function () { chip.classList.toggle('active'); });
  });
}
function saveDailyWidget() {
  var media = {};
  D.MEDIA_CHECKLIST.forEach(function (m) {
    var chip = document.querySelector('[data-daily-media="' + m.key + '"]');
    media[m.key] = chip ? chip.classList.contains('active') : false;
  });
  var cq = {};
  D.CRITICAL_QUESTIONS.forEach(function (q) { cq[q.key] = $('lhdDailyCq_' + q.key).value; });
  var out = {};
  D.OUTPUT_FIELDS.forEach(function (o) { out[o.key] = $('lhdDailyOut_' + o.key).value; });
  var minutes = parseInt($('lhdDailyMinutes').value, 10) || 0;
  D.upsertDailyLog(dailyWidgetTopicId, D.todayISO(), { media: media, criticalQuestions: cq, outputs: out, minutes: minutes });
  D.markStudied(dailyWidgetTopicId);
  closeDailyWidget();
  renderAllSections();
  if (state.activeTopicPageId === dailyWidgetTopicId) renderTopicPage();
}
$('lhdDailyCloseBtn').addEventListener('click', closeDailyWidget);
$('lhdDailyModalBg').addEventListener('click', function (e) { if (e.target === $('lhdDailyModalBg')) closeDailyWidget(); });
$('lhdDailySaveBtn').addEventListener('click', saveDailyWidget);
$('lhdDailyOpenObsidianBtn').addEventListener('click', function () {
  var t = D.Topics.get(dailyWidgetTopicId);
  var settings = D.getSettings();
  var vaultNote = settings.obsidianVaultPath
    ? 'Vault path on file: ' + settings.obsidianVaultPath
    : 'No Obsidian vault path is set yet — add one in Settings so this can deep-link straight into your vault.';
  var noteName = (t ? t.title : 'Daily Note') + ' — ' + D.todayISO();
  try {
    window.open('obsidian://new?name=' + encodeURIComponent(noteName) + (settings.obsidianVaultPath ? '&vault=' + encodeURIComponent(settings.obsidianVaultPath) : ''), '_blank');
  } catch (e) {}
  alert('Opening "' + noteName + '" via the obsidian:// URI scheme (needs the Obsidian app installed).\n' + vaultNote);
});

// =====================================================================
// DAILY NOTES — a chronological feed of every DailyLog's real output
// across every topic, filterable by topic + date. This is the "database"
// the Daily Study Widget writes into.
// =====================================================================
var dailyFeedTopicFilter = 'all';
function renderDailyNotesFeed() {
  var logs = D.DailyLogs.list().slice().sort(function (a, b) { return b.date < a.date ? -1 : (b.date > a.date ? 1 : b.createdAt - a.createdAt); });
  if (dailyFeedTopicFilter !== 'all') logs = logs.filter(function (l) { return l.topicId === dailyFeedTopicFilter; });

  var html = '';
  html += '<div class="lhd-page-head"><div><div class="lhd-page-eyebrow">Journal</div><div class="lhd-page-title">Daily Notes</div>' +
    '<div class="lhd-page-subtext">Every day’s raw notes, quotes, and questions, across every topic — the Daily Study Widget writes here.</div></div>' +
    '<button class="lhd-btn lhd-btn-primary" id="lhdDailyFeedNewBtn">📝 New Study Session</button></div>';

  html += '<div class="lhd-chip-row" style="margin-bottom:18px;">';
  html += '<span class="lhd-chip' + (dailyFeedTopicFilter === 'all' ? ' active' : '') + '" data-daily-filter="all">All Topics</span>';
  D.topicsSorted().forEach(function (t) {
    html += '<span class="lhd-chip' + (dailyFeedTopicFilter === t.id ? ' active' : '') + '" data-daily-filter="' + t.id + '">' + esc(t.icon) + ' ' + esc(t.title) + '</span>';
  });
  html += '</div>';

  if (!logs.length) {
    html += emptyState('📝', 'No daily notes yet', 'Start a study session to log your first entry.');
  } else {
    logs.forEach(function (l) {
      var t = D.Topics.get(l.topicId);
      var outputLines = D.OUTPUT_FIELDS.filter(function (o) { return (l.outputs[o.key] || '').trim(); });
      var qLines = D.CRITICAL_QUESTIONS.filter(function (q) { return (l.criticalQuestions[q.key] || '').trim(); });
      html += '<div class="lhd-card lhd-card-pad" style="margin-bottom:12px;">';
      html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">';
      html += '<span class="lhd-tc-icon" style="width:32px; height:32px; font-size:14px; background:' + (t ? t.color : '#666') + '22; color:' + (t ? t.color : 'var(--lhd-text-mute)') + ';">' + (t ? esc(t.icon) : '❔') + '</span>';
      html += '<div><div style="font-weight:800; font-size:13px;">' + (t ? esc(t.title) : 'Unlinked Topic') + '</div><div style="font-size:11px; color:var(--lhd-text-mute);">' + fmtDate(l.date) + (l.minutes ? ' · ' + l.minutes + ' min' : '') + '</div></div>';
      html += '<button class="lhd-btn-icon-sm" style="margin-left:auto;" data-open-daily="' + (t ? t.id : '') + '" data-date="' + l.date + '" title="Edit">✎</button>';
      html += '</div>';
      if (outputLines.length) {
        html += outputLines.map(function (o) { return '<div style="font-size:12.5px; margin-bottom:6px;"><b style="color:var(--lhd-accent2);">' + o.label + ':</b> ' + esc(l.outputs[o.key]) + '</div>'; }).join('');
      }
      if (qLines.length) {
        html += qLines.map(function (q) { return '<div style="font-size:12.5px; color:var(--lhd-text-mute); margin-bottom:4px;"><i>' + q.label + '</i> — ' + esc(l.criticalQuestions[q.key]) + '</div>'; }).join('');
      }
      if (!outputLines.length && !qLines.length) html += '<div style="font-size:12px; color:var(--lhd-text-mute);">No notes written for this session yet.</div>';
      html += '</div>';
    });
  }

  $('lhd-sec-daily').innerHTML = html;
  $('lhdDailyFeedNewBtn').addEventListener('click', function () { openDailyWidget(D.currentTopic() ? D.currentTopic().id : null); });
  Array.prototype.forEach.call($('lhd-sec-daily').querySelectorAll('[data-daily-filter]'), function (el) {
    el.addEventListener('click', function () { dailyFeedTopicFilter = el.getAttribute('data-daily-filter'); renderDailyNotesFeed(); });
  });
  Array.prototype.forEach.call($('lhd-sec-daily').querySelectorAll('[data-open-daily]'), function (el) {
    el.addEventListener('click', function () { if (el.getAttribute('data-open-daily')) openDailyWidget(el.getAttribute('data-open-daily')); });
  });
}

// =====================================================================
// RESEARCH LIBRARY — grouped by category. Also reused (filtered by
// topicId) inside a Topic's own Research/Sources tabs — see
// buildResearchGroups(list, compact).
// =====================================================================
var researchCategoryFilter = 'all';
var researchTopicFilter = 'all';
var researchSearchQuery = '';
var RESEARCH_STATUS_COLOR = { 'to-review': 'var(--lhd-warn)', 'in-progress': 'var(--lhd-info)', 'done': 'var(--lhd-good)' };

function buildResearchGroups(list, compact, topicIdForNew) {
  if (!list.length) return emptyState('📂', 'Nothing here yet', 'Add a research item to get started.');
  var byCat = {};
  D.RESEARCH_CATEGORIES.forEach(function (c) { byCat[c] = []; });
  list.forEach(function (r) { (byCat[r.category] || (byCat[r.category] = [])).push(r); });
  var html = '';
  D.RESEARCH_CATEGORIES.forEach(function (cat) {
    var items = byCat[cat] || [];
    if (!items.length) return;
    html += '<div class="lhd-research-group"><div class="lhd-research-group-head"><span class="lhd-research-group-title">' + esc(cat) + '</span><span class="lhd-research-group-count">' + items.length + '</span></div>';
    items.forEach(function (r) {
      var t = D.Topics.get(r.topicId);
      html += '<div class="lhd-card lhd-research-row">';
      html += '<span class="lhd-research-status-dot" style="background:' + RESEARCH_STATUS_COLOR[r.status] + ';"></span>';
      html += '<div style="flex:1 1 auto; min-width:0;"><div class="lhd-research-title">' + esc(r.title || 'Untitled') + '</div>' +
        '<div class="lhd-research-meta">' + (r.author ? esc(r.author) + ' · ' : '') + (t ? esc(t.title) : 'Unlinked') + (r.notes && !compact ? ' — ' + esc(r.notes) : '') + '</div></div>';
      if (r.url) html += '<button class="lhd-btn-icon-sm" data-open-url="' + esc(r.url) + '" title="Open link">↗</button>';
      html += '<div class="lhd-research-actions"><button class="lhd-btn-icon-sm" data-edit-research="' + r.id + '" title="Edit">✎</button></div>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}
function researchFormFields(defaultTopicId) {
  return [
    { key: 'title', label: 'Title', type: 'text' },
    { key: 'author', label: 'Author / Creator', type: 'text', half: true },
    { key: 'category', label: 'Category', type: 'select', half: true, options: D.RESEARCH_CATEGORIES.map(function (c) { return { value: c, label: c }; }) },
    { key: 'topicId', label: 'Topic', type: 'select', half: true, options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) },
    { key: 'status', label: 'Status', type: 'select', half: true, options: D.RESEARCH_STATUSES.map(function (s) { return { value: s, label: s }; }) },
    { key: 'url', label: 'URL', type: 'url', placeholder: 'https://…' },
    { key: 'notes', label: 'Notes', type: 'textarea', rows: 3 }
  ];
}
function openResearchModal(item, defaultTopicId) {
  var values = item ? item : { category: 'Bookmarks', status: 'to-review', topicId: defaultTopicId || '' };
  openFormModal({
    title: item ? 'Edit Research Item' : 'New Research Item',
    fields: researchFormFields(),
    values: values,
    submitLabel: item ? 'Save Changes' : 'Add Item',
    validate: function (v) { if (!v.title.trim()) return 'Give this item a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;

      if (state.activeTopicPageId) renderTopicPage();

  });
}
function wireResearchRowActions(root, defaultTopicId) {

    el.addEventListener('click', function () { openResearchModal(D.Research.get(el.getAttribute('data-edit-research')), defaultTopicId); });

    el.addEventListener('click', function () {

}
function renderResearchSection() {
  var list = D.Research.list().slice().sort(function (a, b) { return a.order - b.order; });
  if (researchTopicFilter !== 'all') list = list.filter(function (r) { return r.topicId === researchTopicFilter; });
  if (researchSearchQuery) {

    list = list.filter(function (r) { return (r.title + ' ' + r.author + ' ' + r.notes).toLowerCase().indexOf(q) !== -1; });

    '<button class="lhd-btn lhd-btn-primary" id="lhdResearchNewBtn">➕ Add Item</button></div>';

  html += '<div class="lhd-field" style="max-width:320px;"><input type="text" id="lhdResearchSearch" placeholder="Search research…" value="' + esc(researchSearchQuery) + '"></div>';
  html += '<div class="lhd-chip-row" style="margin: 12px 0 20px;">';
  html += '<span class="lhd-chip' + (researchTopicFilter === 'all' ? ' active' : '') + '" data-research-topic-filter="all">All Topics</span>';

  html += buildResearchGroups(list, false);

  $('lhd-sec-research').innerHTML = html;
  $('lhdResearchNewBtn').addEventListener('click', function () { openResearchModal(null); });
  $('lhdResearchSearch').addEventListener('input', function (e) { researchSearchQuery = e.target.value; renderResearchSection(); });
  Array.prototype.forEach.call($('lhd-sec-research').querySelectorAll('[data-research-topic-filter]'), function (el) {
    el.addEventListener('click', function () { researchTopicFilter = el.getAttribute('data-research-topic-filter'); renderResearchSection(); });
  });
  wireResearchRowActions($('lhd-sec-research'));
}

// =====================================================================
// KNOWLEDGE MAPS — node-based visual maps. Zoomable (slider + ctrl+wheel),
// pannable (drag empty canvas), clickable/draggable nodes, a "Connect"
// mode to draw labeled edges between two nodes. No canvas/WebGL library —

// established "no charting/animation library" convention.
// =====================================================================
state.mapPanX = 0; state.mapPanY = 0;
function mapFormFields() {
  return [
    { key: 'title', label: 'Map Title', type: 'text' },
    { key: 'topicId', label: 'Topic', type: 'select', options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) }
  ];
}
function openMapModal(map, defaultTopicId) {
  var values = map ? map : { topicId: defaultTopicId || '' };
  openFormModal({
    title: map ? 'Rename Map' : 'New Knowledge Map',
    fields: mapFormFields(),
    values: values,
    submitLabel: map ? 'Save Changes' : 'Create Map',
    validate: function (v) { if (!v.title.trim()) return 'Give this map a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;
      if (map) D.Maps.update(map.id, v);
      else { v.order = D.nextOrder(D.Maps.list()); v.nodes = []; v.edges = []; var created = D.Maps.add(v); state.activeMapId = created.id; }
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    },
    onDelete: map ? function () {
      D.Maps.remove(map.id);
