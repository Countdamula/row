      html += '<div class="lhd-research-row" style="border-bottom:' + (i < filtered.length - 1 ? '1px solid var(--lhd-border)' : 'none') + '; border-radius:0; margin-bottom:0;" data-open-topic="' + t.id + '">';
      html += '<span class="lhd-tc-icon" style="width:32px; height:32px; font-size:15px; background:' + t.color + '22; color:' + t.color + ';">' + esc(t.icon) + '</span>';
      html += '<div style="flex:1 1 auto; min-width:0;"><div class="lhd-research-title">' + esc(t.title) + '</div>' +
        '<div class="lhd-research-meta">Week ' + t.currentWeek + ' · ' + t.completionPct + '% · ' + D.hoursLoggedForTopic(t.id) + 'h logged</div></div>';
      html += '<span class="lhd-tag">' + t.status + '</span>';
      html += '<div class="lhd-research-actions"><button class="lhd-btn-icon-sm" data-edit-topic="' + t.id + '" title="Edit">✎</button></div>';
      html += '</div>';
    });
    html += '</div>';
  }

  $('lhd-sec-topics').innerHTML = html;
  wireCommonRowActions($('lhd-sec-topics'));
  $('lhdTopicsNewBtn').addEventListener('click', function () { openTopicModal(null); });
  $('lhdTopicsSearch').addEventListener('input', function (e) { topicsSearchQuery = e.target.value; renderTopicsList(); });
  Array.prototype.forEach.call($('lhd-sec-topics').querySelectorAll('[data-edit-topic]'), function (el) {
    el.addEventListener('click', function (e) { e.stopPropagation(); openTopicModal(D.Topics.get(el.getAttribute('data-edit-topic'))); });
  });
}

// =====================================================================
// DAILY STUDY WIDGET (modal) — topic selector, media checklist, critical
// thinking questions, output checklist, Obsidian hand-off. Backed by one
// DailyLog per topic+date, upserted on Save.
// =====================================================================
var dailyWidgetTopicId = null;
function openDailyWidget(topicId) {
  var topics = D.topicsSorted();
  if (!topics.length) { alert('Create a topic first.'); return; }
  dailyWidgetTopicId = topicId && D.Topics.get(topicId) ? topicId : topics[0].id;
  renderDailyWidget();
  $('lhdDailyModalBg').classList.add('show');
}
function closeDailyWidget() { $('lhdDailyModalBg').classList.remove('show'); }
function renderDailyWidget() {
  var t = D.Topics.get(dailyWidgetTopicId);
  var log = D.dailyLogFor(dailyWidgetTopicId, D.todayISO()) || { media: {}, criticalQuestions: {}, outputs: {}, minutes: 0 };
  var wk = D.weekInfo(t.currentWeek);
  var html = '';
  html += '<div class="lhd-field"><label class="lhd-field-label">Topic</label><select id="lhdDailyTopicSelect">' +
    D.topicsSorted().map(function (x) { return '<option value="' + x.id + '"' + (x.id === dailyWidgetTopicId ? ' selected' : '') + '>' + esc(x.icon) + ' ' + esc(x.title) + '</option>'; }).join('') + '</select></div>';
  html += '<div style="font-size:11.5px; color:var(--lhd-text-mute); margin:-6px 0 16px;">Week ' + t.currentWeek + ' · ' + esc(wk.stage) + ' — this week\'s outputs: ' + wk.outputs.join(', ') + '</div>';

  html += '<div class="lhd-field-label" style="margin-bottom:8px;">Media Checklist</div>';
  html += '<div class="lhd-chip-row" style="margin-bottom:18px;">';
  D.MEDIA_CHECKLIST.forEach(function (m) {
    html += '<span class="lhd-chip' + (log.media[m.key] ? ' active' : '') + '" data-daily-media="' + m.key + '">' + m.icon + ' ' + m.label + '</span>';
  });
  html += '</div>';

  html += '<div class="lhd-field-label" style="margin-bottom:8px;">Critical Thinking Questions</div>';
  D.CRITICAL_QUESTIONS.forEach(function (q) {
    html += '<div class="lhd-field"><label class="lhd-field-label" style="text-transform:none; font-weight:600; color:var(--lhd-text-dim);">' + esc(q.label) + '</label>' +
      '<textarea rows="2" id="lhdDailyCq_' + q.key + '">' + esc(log.criticalQuestions[q.key] || '') + '</textarea></div>';
  });

  html += '<div class="lhd-field-label" style="margin-bottom:8px; margin-top:6px;">Output Checklist</div>';
  D.OUTPUT_FIELDS.forEach(function (o) {
    html += '<div class="lhd-field"><label class="lhd-field-label" style="text-transform:none; font-weight:600; color:var(--lhd-text-dim);">' + esc(o.label) + '</label>' +
      '<textarea rows="2" id="lhdDailyOut_' + o.key + '">' + esc(log.outputs[o.key] || '') + '</textarea></div>';
  });

  html += '<div class="lhd-field"><label class="lhd-field-label">Minutes Studied</label><input type="number" id="lhdDailyMinutes" value="' + (log.minutes || 0) + '"></div>';

  $('lhdDailyBody').innerHTML = html;
  $('lhdDailyTopicSelect').addEventListener('change', function (e) { dailyWidgetTopicId = e.target.value; renderDailyWidget(); });
  Array.prototype.forEach.call($('lhdDailyBody').querySelectorAll('[data-daily-media]'), function (chip) {
    chip.addEventListener('click', function () { chip.classList.toggle('active'); });
  });
}
function saveDailyWidget() {
  var media = {};
  D.MEDIA_CHECKLIST.forEach(function (m) {
    var chip = document.querySelector('[data-daily-media="' + m.key + '"]');
    media[m.key] = chip ? chip.classList.contains('active') : false;
  });
  var cq = {};
  D.CRITICAL_QUESTIONS.forEach(function (q) { cq[q.key] = $('lhdDailyCq_' + q.key).value; });
  var out = {};
  D.OUTPUT_FIELDS.forEach(function (o) { out[o.key] = $('lhdDailyOut_' + o.key).value; });
  var minutes = parseInt($('lhdDailyMinutes').value, 10) || 0;
  D.upsertDailyLog(dailyWidgetTopicId, D.todayISO(), { media: media, criticalQuestions: cq, outputs: out, minutes: minutes });
  D.markStudied(dailyWidgetTopicId);
  closeDailyWidget();
  renderAllSections();
  if (state.activeTopicPageId === dailyWidgetTopicId) renderTopicPage();
}
$('lhdDailyCloseBtn').addEventListener('click', closeDailyWidget);
$('lhdDailyModalBg').addEventListener('click', function (e) { if (e.target === $('lhdDailyModalBg')) closeDailyWidget(); });
$('lhdDailySaveBtn').addEventListener('click', saveDailyWidget);
$('lhdDailyOpenObsidianBtn').addEventListener('click', function () {
  var t = D.Topics.get(dailyWidgetTopicId);
  var settings = D.getSettings();
  var vaultNote = settings.obsidianVaultPath
    ? 'Vault path on file: ' + settings.obsidianVaultPath
    : 'No Obsidian vault path is set yet — add one in Settings so this can deep-link straight into your vault.';
  var noteName = (t ? t.title : 'Daily Note') + ' — ' + D.todayISO();
  try {
    window.open('obsidian://new?name=' + encodeURIComponent(noteName) + (settings.obsidianVaultPath ? '&vault=' + encodeURIComponent(settings.obsidianVaultPath) : ''), '_blank');
  } catch (e) {}
  alert('Opening "' + noteName + '" via the obsidian:// URI scheme (needs the Obsidian app installed).\n' + vaultNote);
});

// =====================================================================
// DAILY NOTES — a chronological feed of every DailyLog's real output
// across every topic, filterable by topic + date. This is the "database"
// the Daily Study Widget writes into.
// =====================================================================
var dailyFeedTopicFilter = 'all';
function renderDailyNotesFeed() {
  var logs = D.DailyLogs.list().slice().sort(function (a, b) { return b.date < a.date ? -1 : (b.date > a.date ? 1 : b.createdAt - a.createdAt); });
  if (dailyFeedTopicFilter !== 'all') logs = logs.filter(function (l) { return l.topicId === dailyFeedTopicFilter; });

  var html = '';
  html += '<div class="lhd-page-head"><div><div class="lhd-page-eyebrow">Journal</div><div class="lhd-page-title">Daily Notes</div>' +
    '<div class="lhd-page-subtext">Every day’s raw notes, quotes, and questions, across every topic — the Daily Study Widget writes here.</div></div>' +
    '<button class="lhd-btn lhd-btn-primary" id="lhdDailyFeedNewBtn">📝 New Study Session</button></div>';

  html += '<div class="lhd-chip-row" style="margin-bottom:18px;">';
  html += '<span class="lhd-chip' + (dailyFeedTopicFilter === 'all' ? ' active' : '') + '" data-daily-filter="all">All Topics</span>';
  D.topicsSorted().forEach(function (t) {
    html += '<span class="lhd-chip' + (dailyFeedTopicFilter === t.id ? ' active' : '') + '" data-daily-filter="' + t.id + '">' + esc(t.icon) + ' ' + esc(t.title) + '</span>';
  });
  html += '</div>';

  if (!logs.length) {
    html += emptyState('📝', 'No daily notes yet', 'Start a study session to log your first entry.');
  } else {
    logs.forEach(function (l) {
      var t = D.Topics.get(l.topicId);
      var outputLines = D.OUTPUT_FIELDS.filter(function (o) { return (l.outputs[o.key] || '').trim(); });
      var qLines = D.CRITICAL_QUESTIONS.filter(function (q) { return (l.criticalQuestions[q.key] || '').trim(); });
      html += '<div class="lhd-card lhd-card-pad" style="margin-bottom:12px;">';
      html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">';
      html += '<span class="lhd-tc-icon" style="width:32px; height:32px; font-size:14px; background:' + (t ? t.color : '#666') + '22; color:' + (t ? t.color : 'var(--lhd-text-mute)') + ';">' + (t ? esc(t.icon) : '❔') + '</span>';
      html += '<div><div style="font-weight:800; font-size:13px;">' + (t ? esc(t.title) : 'Unlinked Topic') + '</div><div style="font-size:11px; color:var(--lhd-text-mute);">' + fmtDate(l.date) + (l.minutes ? ' · ' + l.minutes + ' min' : '') + '</div></div>';
      html += '<button class="lhd-btn-icon-sm" style="margin-left:auto;" data-open-daily="' + (t ? t.id : '') + '" data-date="' + l.date + '" title="Edit">✎</button>';
      html += '</div>';
      if (outputLines.length) {
        html += outputLines.map(function (o) { return '<div style="font-size:12.5px; margin-bottom:6px;"><b style="color:var(--lhd-accent2);">' + o.label + ':</b> ' + esc(l.outputs[o.key]) + '</div>'; }).join('');
      }
      if (qLines.length) {
        html += qLines.map(function (q) { return '<div style="font-size:12.5px; color:var(--lhd-text-mute); margin-bottom:4px;"><i>' + q.label + '</i> — ' + esc(l.criticalQuestions[q.key]) + '</div>'; }).join('');
      }
      if (!outputLines.length && !qLines.length) html += '<div style="font-size:12px; color:var(--lhd-text-mute);">No notes written for this session yet.</div>';
      html += '</div>';
    });
  }

  $('lhd-sec-daily').innerHTML = html;
  $('lhdDailyFeedNewBtn').addEventListener('click', function () { openDailyWidget(D.currentTopic() ? D.currentTopic().id : null); });
  Array.prototype.forEach.call($('lhd-sec-daily').querySelectorAll('[data-daily-filter]'), function (el) {
    el.addEventListener('click', function () { dailyFeedTopicFilter = el.getAttribute('data-daily-filter'); renderDailyNotesFeed(); });
  });
  Array.prototype.forEach.call($('lhd-sec-daily').querySelectorAll('[data-open-daily]'), function (el) {
    el.addEventListener('click', function () { if (el.getAttribute('data-open-daily')) openDailyWidget(el.getAttribute('data-open-daily')); });
  });
}

// =====================================================================
// DATABASE 01 — SOURCE NOTES. One book chapter / article / video / podcast
// episode / paper / lecture per note, captured raw before trying to fully
// understand it. Grouped by Source Type; also reused (filtered by
// topicId) inside a Topic's own Source Notes tab — see
// buildSourceNoteGroups(list, compact). Superseded the old flat Research
// Library row (openResearchModal/D.Research) — see learning-dashboard-data.js's
// migrateLegacyLhubCollections() for how existing Research items became
// Source Notes.
// =====================================================================
var sourceTopicFilter = 'all';
var sourceSearchQuery = '';
var SOURCE_STATUS_COLOR = { Capturing: 'var(--lhd-warn)', Processing: 'var(--lhd-info)', Completed: 'var(--lhd-good)' };

function buildSourceNoteGroups(list, compact) {
  if (!list.length) return emptyState('📥', 'Nothing captured yet', 'Add a Source Note for the next book, article, video, or paper you\'re studying.');
  var byType = {};
  D.SOURCE_TYPES.forEach(function (c) { byType[c] = []; });
  list.forEach(function (r) { (byType[r.sourceType] || (byType[r.sourceType] = [])).push(r); });
  var html = '';
  D.SOURCE_TYPES.forEach(function (cat) {
    var items = byType[cat] || [];
    if (!items.length) return;
    html += '<div class="lhd-research-group"><div class="lhd-research-group-head"><span class="lhd-research-group-title">' + esc(cat) + '</span><span class="lhd-research-group-count">' + items.length + '</span></div>';
    items.forEach(function (r) {
      var t = D.Topics.get(r.topicId);
      html += '<div class="lhd-card lhd-research-row lhd-hoverable" data-open-source="' + r.id + '">';
      html += '<span class="lhd-research-status-dot" style="background:' + SOURCE_STATUS_COLOR[r.status] + ';"></span>';
      html += '<div style="flex:1 1 auto; min-width:0;"><div class="lhd-research-title">' + esc(r.title || 'Untitled') + '</div>' +
        '<div class="lhd-research-meta">' + (r.author ? esc(r.author) + ' · ' : '') + (t ? esc(t.title) : 'Unlinked') + (r.subTopic ? ' · ' + esc(r.subTopic) : '') +
        (!compact ? ' · ' + r.mainIdeas.length + ' main idea' + (r.mainIdeas.length === 1 ? '' : 's') : '') + '</div></div>';
      html += '<span class="lhd-tag">' + esc(r.status) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}
function sourceNoteQuickFields() {
  return [
    { key: 'title', label: 'Title', type: 'text' },
    { key: 'author', label: 'Author / Creator', type: 'text', half: true },
    { key: 'sourceType', label: 'Source Type', type: 'select', half: true, options: D.SOURCE_TYPES.map(function (c) { return { value: c, label: c }; }) },
    { key: 'topicId', label: 'Topic', type: 'select', half: true, options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) },
    { key: 'subTopic', label: 'Sub-Topic', type: 'text', half: true },
    { key: 'status', label: 'Status', type: 'select', half: true, options: D.SOURCE_STATUSES.map(function (s) { return { value: s, label: s }; }) },
    { key: 'url', label: 'URL (optional)', type: 'url', placeholder: 'https://…' }
  ];
}
function openSourceNoteQuickModal(item, defaultTopicId) {
  var values = item ? item : { sourceType: 'Book', status: 'Capturing', dateAdded: D.todayISO(), topicId: defaultTopicId || '' };
  openFormModal({
    title: item ? 'Edit Source Note' : 'New Source Note',
    fields: sourceNoteQuickFields(),
    values: values,
    submitLabel: item ? 'Save Changes' : 'Capture Source',
    validate: function (v) { if (!v.title.trim()) return 'Give this source a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;
      var saved;
      if (item) saved = D.SourceNotes.update(item.id, v);
      else { v.order = D.nextOrder(D.SourceNotes.list()); v.dateAdded = v.dateAdded || D.todayISO(); saved = D.SourceNotes.add(v); }
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
      if (!item) openSourceNoteDetail(saved.id);
    },
    onDelete: item ? function () { D.SourceNotes.remove(item.id); renderAllSections(); if (state.activeTopicPageId) renderTopicPage(); } : null,
    deleteConfirm: 'Delete "' + (item ? item.title : '') + '"?'
  });
}
function wireSourceNoteRowActions(root) {
  Array.prototype.forEach.call(root.querySelectorAll('[data-open-source]'), function (el) {
    el.addEventListener('click', function () { openSourceNoteDetail(el.getAttribute('data-open-source')); });
  });
}
function renderSourceNotesSection() {
  var list = D.SourceNotes.list().slice().sort(function (a, b) { return a.order - b.order; });
  if (sourceTopicFilter !== 'all') list = list.filter(function (r) { return r.topicId === sourceTopicFilter; });
  if (sourceSearchQuery) {
    var q = sourceSearchQuery.toLowerCase();
    list = list.filter(function (r) { return (r.title + ' ' + r.author + ' ' + r.whyExploring).toLowerCase().indexOf(q) !== -1; });
  }

  var html = '';
  html += '<div class="lhd-page-head"><div><div class="lhd-page-eyebrow">Database 01 · Capture</div><div class="lhd-page-title">Source Notes</div>' +
    '<div class="lhd-page-subtext">One book chapter, article, video, podcast episode, paper, or lecture per note — captured raw, before you try to fully understand it.</div></div>' +
    '<button class="lhd-btn lhd-btn-primary" id="lhdSourceNewBtn">➕ New Source Note</button></div>';

  html += '<div class="lhd-field" style="max-width:320px;"><input type="text" id="lhdSourceSearch" placeholder="Search source notes…" value="' + esc(sourceSearchQuery) + '"></div>';
  html += '<div class="lhd-chip-row" style="margin: 12px 0 20px;">';
  html += '<span class="lhd-chip' + (sourceTopicFilter === 'all' ? ' active' : '') + '" data-source-topic-filter="all">All Topics</span>';
  D.topicsSorted().forEach(function (t) { html += '<span class="lhd-chip' + (sourceTopicFilter === t.id ? ' active' : '') + '" data-source-topic-filter="' + t.id + '">' + esc(t.icon) + ' ' + esc(t.title) + '</span>'; });
  html += '</div>';

  html += buildSourceNoteGroups(list, false);

  $('lhd-sec-sourcenotes').innerHTML = html;
  $('lhdSourceNewBtn').addEventListener('click', function () { openSourceNoteQuickModal(null); });
  $('lhdSourceSearch').addEventListener('input', function (e) { sourceSearchQuery = e.target.value; renderSourceNotesSection(); });
  Array.prototype.forEach.call($('lhd-sec-sourcenotes').querySelectorAll('[data-source-topic-filter]'), function (el) {
    el.addEventListener('click', function () { sourceTopicFilter = el.getAttribute('data-source-topic-filter'); renderSourceNotesSection(); });
  });
  wireSourceNoteRowActions($('lhd-sec-sourcenotes'));
}

// ---- Source Note detail workspace (full template) — repurposes the
// generic form modal's body directly for a richer, non-field layout, same
// "repurpose the modal" pattern Framework detail already established. ----
var srcDetailId = null;
function openSourceNoteDetail(id) {
  srcDetailId = id;
  var s = D.SourceNotes.get(id);
  if (!s) return;
  openFormModal({ title: '', fields: [], values: {}, onSubmit: function () {} });
  $('lhdFormModal').classList.add('lhd-modal-wide');
  $('lhdFormModalTitle').textContent = s.title;
  $('lhdFormModalActions').style.display = 'none';
  renderSourceNoteDetailBody();
}
function closeSourceNoteDetail() {
  srcDetailId = null;
  $('lhdFormModal').classList.remove('lhd-modal-wide');
  $('lhdFormModalActions').style.display = 'flex';
  closeFormModal();
}
function saveSourceNoteField(patch) { D.SourceNotes.update(srcDetailId, patch); }
function compileSourceIntoEvergreen(s) {
  var summary = s.mainIdeas.map(function (mi) { return (mi.title ? '**' + mi.title + '**: ' : '') + mi.summary; }).filter(function (x) { return x.trim(); }).join('\n\n');
  var existing = (s.relatedEvergreenIds || []).map(function (id) { return D.EvergreenNotes.get(id); }).filter(Boolean);
  if (existing.length && confirm('Append this source\'s main ideas into "' + existing[0].title + '"?')) {
    var target = existing[0];
    D.EvergreenNotes.update(target.id, {
      myUnderstanding: (target.myUnderstanding ? target.myUnderstanding + '\n\n' : '') + '_From [[' + s.title + ']]:_\n' + summary,
      relatedSourceNoteIds: target.relatedSourceNoteIds.indexOf(s.id) === -1 ? target.relatedSourceNoteIds.concat([s.id]) : target.relatedSourceNoteIds
    });
    closeSourceNoteDetail();
    state.activeEvId = target.id;
    renderAllSections();
    switchSection('evergreennotes');
    return;
  }
  var created = D.EvergreenNotes.add({
    title: s.title, conceptName: s.title, topicId: s.topicId, subTopic: s.subTopic,
    relatedSourceNoteIds: [s.id], myUnderstanding: summary, order: D.nextOrder(D.EvergreenNotes.list())
  });
  D.SourceNotes.update(s.id, { relatedEvergreenIds: (s.relatedEvergreenIds || []).concat([created.id]), status: 'Completed' });
  closeSourceNoteDetail();
  state.activeEvId = created.id;
  renderAllSections();
  switchSection('evergreennotes');
}
function renderSourceNoteDetailBody() {
  var s = D.SourceNotes.get(srcDetailId);
  if (!s) { closeSourceNoteDetail(); return; }
  var t = D.Topics.get(s.topicId);
  var html = '';
  html += '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;">' +
    '<span class="lhd-tag">' + esc(s.sourceType) + '</span><span class="lhd-tag">' + esc(s.status) + '</span>' +
    (t ? '<span class="lhd-tag">' + esc(t.title) + '</span>' : '') + (s.subTopic ? '<span class="lhd-tag">' + esc(s.subTopic) + '</span>' : '') +
    '<div style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;">' +
    '<button class="lhd-btn lhd-btn-sm" id="lhdSrcCompileBtn">🔗 Compile into Evergreen Note</button>' +
    '<button class="lhd-btn lhd-btn-sm" id="lhdSrcEditMetaBtn">✎ Edit Details</button>' +
    '<button class="lhd-btn lhd-btn-sm lhd-btn-danger" id="lhdSrcDeleteBtn">Delete</button></div></div>';

  html += '<div class="lhd-field"><label class="lhd-field-label">Why I\'m Exploring This</label><textarea id="lhdSrcWhy" rows="2" placeholder="Why did this catch my attention?">' + esc(s.whyExploring) + '</textarea></div>';

  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px;"><label class="lhd-field-label" style="margin:0;">Main Ideas</label><button class="lhd-btn lhd-btn-sm" id="lhdSrcAddIdeaBtn">+ Add Main Idea</button></div>';
  s.mainIdeas.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (mi) {
    html += '<div class="lhd-pf-section" data-mi-id="' + mi.id + '">';
    html += '<div class="lhd-pf-section-head"><input type="text" class="lhd-pf-section-title-input" value="' + esc(mi.title) + '" data-mi-field="title" placeholder="Main idea title">' +
      '<button class="lhd-btn-icon-sm" data-mi-del="1" style="margin-left:auto;">✕</button></div>';
    html += '<label class="lhd-field-label" style="margin-top:8px;">Summary</label><textarea class="lhd-pf-section-body" rows="2" data-mi-field="summary">' + esc(mi.summary) + '</textarea>';
    html += '<label class="lhd-field-label" style="margin-top:8px;">Important Quotes</label><textarea class="lhd-pf-section-body" rows="2" data-mi-field="quotes">' + esc(mi.quotes) + '</textarea>';
    html += '<label class="lhd-field-label" style="margin-top:8px;">Important Information</label><textarea class="lhd-pf-section-body" rows="2" data-mi-field="info">' + esc(mi.info) + '</textarea>';
    html += '<label class="lhd-field-label" style="margin-top:8px;">My Reaction</label><textarea class="lhd-pf-section-body" rows="2" data-mi-field="reaction">' + esc(mi.reaction) + '</textarea>';
    html += '</div>';
  });

  html += '<div class="lhd-field-label" style="margin-top:20px;">Questions Raised, Asked &amp; Answered</div>';
  html += '<div class="lhd-field"><label class="lhd-field-label">What is missing?</label><textarea rows="2" data-qr-field="missing">' + esc(s.questionsRaised.missing) + '</textarea></div>';
  html += '<div class="lhd-field"><label class="lhd-field-label">What\'s beneath this?</label><textarea rows="2" data-qr-field="beneath">' + esc(s.questionsRaised.beneath) + '</textarea></div>';
  html += '<div class="lhd-field"><label class="lhd-field-label">What assumptions exist?</label><textarea rows="2" data-qr-field="assumptions">' + esc(s.questionsRaised.assumptions) + '</textarea></div>';
  html += '<div class="lhd-field"><label class="lhd-field-label">What contradicts this?</label><textarea rows="2" data-qr-field="contradicts">' + esc(s.questionsRaised.contradicts) + '</textarea></div>';
  html += '<div class="lhd-field"><label class="lhd-field-label">What are the implications?</label><textarea rows="2" data-qr-field="implications">' + esc(s.questionsRaised.implications) + '</textarea></div>';

// =====================================================================
// PERSONAL FRAMEWORKS — a grid of cards, each opening into its own detail
// modal with generated/editable/reorderable sections (the same "+ Generate
// Section" pattern business.html's Platform Detail pages already use).
// =====================================================================
function frameworkFormFields(defaultTopicId) {
  return [
    { key: 'title', label: 'Title', type: 'text' },
    { key: 'icon', label: 'Icon', type: 'text', half: true, placeholder: '💡' },
    { key: 'topicId', label: 'Topic', type: 'select', half: true, options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) },
    { key: 'description', label: 'Description', type: 'textarea', rows: 2 },
    { key: 'color', label: 'Color', type: 'color' }
  ];
}
function openFrameworkModal(fw, defaultTopicId) {
  var values = fw ? fw : { color: D.TOPIC_COLORS[1], topicId: defaultTopicId || '' };
  openFormModal({
    title: fw ? 'Edit Framework' : 'New Framework',
    fields: frameworkFormFields(),
    values: values,
    submitLabel: fw ? 'Save Changes' : 'Create Framework',
    validate: function (v) { if (!v.title.trim()) return 'Give this framework a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;
      if (fw) D.Frameworks.update(fw.id, v);
      else { v.order = D.nextOrder(D.Frameworks.list()); v.sections = []; D.Frameworks.add(v); }
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    },
    onDelete: fw ? function () { D.Frameworks.remove(fw.id); closeFrameworkDetail(); renderAllSections(); if (state.activeTopicPageId) renderTopicPage(); } : null,
    deleteConfirm: 'Delete "' + (fw ? fw.title : '') + '"?'
  });
}
function renderFrameworksGrid(list, mount, defaultTopicId) {
  if (!list.length) { mount.innerHTML = emptyState('💡', 'No frameworks yet', 'Turn a recurring decision into a reusable framework.'); return; }
  var html = '<div class="lhd-grid lhd-grid-3">';
  list.forEach(function (f, i) {
    html += '<div class="lhd-card lhd-hoverable lhd-fw-card" style="animation:lhdFadeUp .4s both; animation-delay:' + (i * 0.04) + 's;" data-open-framework="' + f.id + '">';
    html += '<div class="lhd-fw-icon" style="background:' + f.color + '22; color:' + f.color + ';">' + esc(f.icon) + '</div>';
    html += '<div class="lhd-fw-title">' + esc(f.title) + '</div>';
    html += '<div class="lhd-fw-desc">' + esc(f.description || 'No description yet.') + '</div>';
    html += '<div class="lhd-fw-sections-count">' + f.sections.length + ' section' + (f.sections.length === 1 ? '' : 's') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  mount.innerHTML = html;
  Array.prototype.forEach.call(mount.querySelectorAll('[data-open-framework]'), function (el) {
    el.addEventListener('click', function () { openFrameworkDetail(el.getAttribute('data-open-framework'), defaultTopicId); });
  });
}
function renderFrameworksSection() {
  var html = '<div class="lhd-page-head"><div><div class="lhd-page-eyebrow">Mental Models</div><div class="lhd-page-title">Personal Frameworks</div>' +
    '<div class="lhd-page-subtext">The repeatable decision-making tools you have built from what you have learned.</div></div>' +
    '<button class="lhd-btn lhd-btn-primary" id="lhdFwNewBtn">➕ New Framework</button></div><div id="lhdFwGridMount"></div>';
  $('lhd-sec-frameworks').innerHTML = html;
  renderFrameworksGrid(D.Frameworks.list().slice().sort(function (a, b) { return a.order - b.order; }), $('lhdFwGridMount'), null);
  $('lhdFwNewBtn').addEventListener('click', function () { openFrameworkModal(null); });
}

var fwDetailId = null;
function openFrameworkDetail(id) {
  fwDetailId = id;
  var f = D.Frameworks.get(id);
  openFormModal({
    title: '',
    fields: [],
    values: {},
    onSubmit: function () {}
  });
  // Repurpose the generic modal's body directly for a richer, non-field layout.
  $('lhdFormModal').classList.add('lhd-modal-wide');
  $('lhdFormModalTitle').textContent = f.icon + ' ' + f.title;
  $('lhdFormModalActions').style.display = 'none';
  renderFrameworkDetailBody();
}
function closeFrameworkDetail() {
  fwDetailId = null;
  $('lhdFormModal').classList.remove('lhd-modal-wide');
  $('lhdFormModalActions').style.display = 'flex';
  closeFormModal();
}
function renderFrameworkDetailBody() {
  var f = D.Frameworks.get(fwDetailId);
  if (!f) { closeFrameworkDetail(); return; }
  var t = D.Topics.get(f.topicId);
  var html = '<div style="font-size:12.5px; color:var(--lhd-text-mute); margin-bottom:14px;">' + esc(f.description || '') + (t ? ' · Linked to ' + esc(t.title) : '') + '</div>';
  html += '<div style="display:flex; gap:8px; margin-bottom:16px;">' +
    '<button class="lhd-btn lhd-btn-sm" id="lhdFwGenSectionBtn">+ Generate Section</button>' +
    '<button class="lhd-btn lhd-btn-sm" id="lhdFwEditMetaBtn">✎ Edit Details</button>' +
    '<button class="lhd-btn lhd-btn-sm lhd-btn-danger" id="lhdFwDeleteBtn" style="margin-left:auto;">Delete</button></div>';
  f.sections.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (sec, i) {
    html += '<div class="lhd-pf-section" data-sec-id="' + sec.id + '">';
    html += '<div class="lhd-pf-section-head"><input type="text" class="lhd-pf-section-title-input" value="' + esc(sec.title) + '" data-sec-field="title">' +
      '<div style="display:flex; gap:4px; margin-left:auto;">' +
      '<button class="lhd-btn-icon-sm" data-sec-move="up" ' + (i === 0 ? 'disabled style="opacity:.35;"' : '') + '>▲</button>' +
      '<button class="lhd-btn-icon-sm" data-sec-move="down">▼</button>' +
      '<button class="lhd-btn-icon-sm" data-sec-del="1">✕</button></div></div>';
    html += '<textarea class="lhd-pf-section-body" rows="3" data-sec-field="body">' + esc(sec.body) + '</textarea>';
    html += '</div>';
  });
  $('lhdFormModalBody').innerHTML = html;
  $('lhdFwGenSectionBtn').addEventListener('click', function () {
    var sections = f.sections.concat([{ id: D.uid('sec'), title: 'New Section', body: '', order: D.nextOrder(f.sections) }]);
    D.Frameworks.update(f.id, { sections: sections });
    renderFrameworkDetailBody();
  });
  $('lhdFwEditMetaBtn').addEventListener('click', function () { closeFrameworkDetail(); openFrameworkModal(f); });
  $('lhdFwDeleteBtn').addEventListener('click', function () {
    if (!confirm('Delete "' + f.title + '"?')) return;
    D.Frameworks.remove(f.id); closeFrameworkDetail(); renderAllSections(); if (state.activeTopicPageId) renderTopicPage();
  });
  Array.prototype.forEach.call($('lhdFormModalBody').querySelectorAll('[data-sec-field]'), function (el) {
    el.addEventListener('blur', function () {
      var secId = el.closest('.lhd-pf-section').getAttribute('data-sec-id');
      var patch = {}; patch[el.getAttribute('data-sec-field')] = el.value;
      var sections = f.sections.map(function (s) { return s.id === secId ? Object.assign({}, s, patch) : s; });
      D.Frameworks.update(f.id, { sections: sections });
    });
  });
  Array.prototype.forEach.call($('lhdFormModalBody').querySelectorAll('[data-sec-move]'), function (el) {
    el.addEventListener('click', function () {
      var secId = el.closest('.lhd-pf-section').getAttribute('data-sec-id');
      var sorted = f.sections.slice().sort(function (a, b) { return a.order - b.order; });
      var idx = sorted.findIndex(function (s) { return s.id === secId; });
      var dir = el.getAttribute('data-sec-move') === 'up' ? -1 : 1;
      var swapIdx = idx + dir;
      if (swapIdx < 0 || swapIdx >= sorted.length) return;
      var tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
      D.Frameworks.update(f.id, { sections: sorted });
      renderFrameworkDetailBody();
    });
  });
  Array.prototype.forEach.call($('lhdFormModalBody').querySelectorAll('[data-sec-del]'), function (el) {
    el.addEventListener('click', function () {
      var secId = el.closest('.lhd-pf-section').getAttribute('data-sec-id');
      D.Frameworks.update(f.id, { sections: f.sections.filter(function (s) { return s.id !== secId; }) });
      renderFrameworkDetailBody();
    });
  });
}

// =====================================================================
// DATABASE 02 — EVERGREEN KNOWLEDGE NOTES. The most important layer: many
// Source Notes compiled into one owned concept. A note list on the left,
// a structured reading pane on the right (Core Idea / My Understanding /
// Mental Model / Principles / Examples / Contradictions / Questions /
// Applications / a Connections mini-gallery), with a table of contents
// and a "linked from" backlinks panel scanning across all of a note's
// free-text fields (see learning-dashboard-data.js's evergreenScanText()).
// Superseded the old flat Master Notes single-body page (openMasterNoteModal/
// D.MasterNotes) — see migrateLegacyLhubCollections() for how existing
// Master Notes became Evergreen Notes.
// =====================================================================
function evergreenNoteFormFields() {
  return [
    { key: 'title', label: 'Title', type: 'text' },
    { key: 'conceptName', label: 'Concept Name', type: 'text', half: true },
    { key: 'topicId', label: 'Topic', type: 'select', half: true, options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) },
    { key: 'subTopic', label: 'Sub-Topic', type: 'text', half: true },
    { key: 'masteryLevel', label: 'Mastery Level', type: 'select', half: true, options: D.MASTERY_LEVELS.map(function (m) { return { value: m, label: m }; }) },
    { key: 'tags', label: 'Tags (comma-separated)', type: 'text' }
  ];
}
function openEvergreenNoteModal(note, defaultTopicId) {
  var values = note ? Object.assign({}, note, { tags: note.tags.join(', ') }) : { topicId: defaultTopicId || '', masteryLevel: 'Beginner' };
  openFormModal({
    title: note ? 'Edit Evergreen Note Details' : 'New Evergreen Knowledge Note',
    fields: evergreenNoteFormFields(),
    values: values,
    submitLabel: note ? 'Save Changes' : 'Create Evergreen Note',
    validate: function (v) { if (!v.title.trim()) return 'Give this concept a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;
      v.tags = v.tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      v.conceptName = v.conceptName || v.title;
      var saved;
      if (note) saved = D.EvergreenNotes.update(note.id, v);
      else { v.order = D.nextOrder(D.EvergreenNotes.list()); saved = D.EvergreenNotes.add(v); }
      state.activeEvId = saved.id;
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    },
    onDelete: note ? function () {
      D.EvergreenNotes.remove(note.id);
      if (state.activeEvId === note.id) state.activeEvId = null;
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    } : null,
    deleteConfirm: 'Delete "' + (note ? note.title : '') + '"? Backlinks/relations pointing to it will just no longer resolve.'
  });
}
function renderEvergreenList(list, mount, onSelect) {
  if (!list.length) { mount.innerHTML = '<div style="padding:14px; font-size:12px; color:var(--lhd-text-mute);">No evergreen notes yet.</div>'; return; }
  mount.innerHTML = list.map(function (n) {
    var t = D.Topics.get(n.topicId);
    return '<div class="lhd-mn-list-item' + (n.id === state.activeEvId ? ' active' : '') + '" data-ev-id="' + n.id + '">' + esc(n.title) +
      '<div class="lhd-mn-list-item-topic">' + (t ? esc(t.title) : 'Unlinked') + ' · ' + esc(n.masteryLevel) + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(mount.querySelectorAll('[data-ev-id]'), function (el) {
    el.addEventListener('click', function () { onSelect(el.getAttribute('data-ev-id')); });
  });
}
function evergreenReadBlock(label, body) {
  if (!body) return '';
  return '<h5>' + esc(label) + '</h5><div>' + D.renderMarkdownLite(body) + '</div>';
}
function renderEvergreenReading(mount, editable) {
  var note = state.activeEvId ? D.EvergreenNotes.get(state.activeEvId) : null;
  if (!note) { mount.innerHTML = emptyState('🌲', 'Select an Evergreen Note', 'Or create a new one from the button above.'); return; }
  var backlinks = D.backlinksTo(note.id);
  var html = '';
  html += '<div class="lhd-mn-toolbar"><span class="lhd-tag">' + esc(note.masteryLevel) + '</span>' +
    (editable ? '' : '<button class="lhd-btn lhd-btn-sm" id="lhdEvEditBtn">✎ Edit</button>') +
    '<button class="lhd-btn lhd-btn-sm" id="lhdEvDetailsBtn">⚙ Details</button></div>';
  if (editable) {
    var fields = [
      ['coreIdea', 'Core Idea — explain this simply'], ['myUnderstanding', 'My Understanding — what does this mean to me?'],
      ['mentalModel', 'Mental Model — how does this concept work?'], ['examples', 'Examples — real-world examples'],
      ['questionsUnresolved', 'Questions — things I still don\'t understand'], ['applications', 'Applications — how can I use this?']
    ];
    fields.forEach(function (pair) {
      html += '<div class="lhd-field"><label class="lhd-field-label">' + esc(pair[1]) + '</label><textarea rows="3" data-ev-field="' + pair[0] + '">' + esc(note[pair[0]]) + '</textarea></div>';
    });
    html += '<div class="lhd-field"><label class="lhd-field-label">Principles (one per line)</label><textarea rows="3" data-ev-field="principles">' + esc(note.principles.join('\n')) + '</textarea></div>';
    html += '<div class="lhd-field"><label class="lhd-field-label">Contradictions — where does this idea fail?</label><textarea rows="2" data-ev-field="contra-whereFails">' + esc(note.contradictions.whereFails) + '</textarea></div>';
    html += '<div class="lhd-field"><label class="lhd-field-label">Limitations</label><textarea rows="2" data-ev-field="contra-limitations">' + esc(note.contradictions.limitations) + '</textarea></div>';
    html += '<div class="lhd-field"><label class="lhd-field-label">Opposing viewpoints</label><textarea rows="2" data-ev-field="contra-opposingViewpoints">' + esc(note.contradictions.opposingViewpoints) + '</textarea></div>';
    html += '<div style="display:flex; gap:8px;"><button class="lhd-btn lhd-btn-primary lhd-btn-sm" id="lhdEvSaveBtn">Save</button><button class="lhd-btn lhd-btn-ghost lhd-btn-sm" id="lhdEvCancelEditBtn">Cancel</button></div>';
  } else {
    html += '<div class="lhd-mn-reading-body">';
    html += evergreenReadBlock('Core Idea', note.coreIdea);
    html += evergreenReadBlock('My Understanding', note.myUnderstanding);
    html += evergreenReadBlock('Mental Model', note.mentalModel);
    if (note.principles.length) html += '<h5>Principles</h5><ol>' + note.principles.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>';
    html += evergreenReadBlock('Examples', note.examples);
    if (note.contradictions.whereFails || note.contradictions.limitations || note.contradictions.opposingViewpoints) {
      html += '<h5>Contradictions</h5>';
      if (note.contradictions.whereFails) html += '<p><strong>Where it fails:</strong> ' + esc(note.contradictions.whereFails) + '</p>';
      if (note.contradictions.limitations) html += '<p><strong>Limitations:</strong> ' + esc(note.contradictions.limitations) + '</p>';
      if (note.contradictions.opposingViewpoints) html += '<p><strong>Opposing viewpoints:</strong> ' + esc(note.contradictions.opposingViewpoints) + '</p>';
    }
    html += evergreenReadBlock('Questions', note.questionsUnresolved);
    if (note.applications) html += '<h5>Applications</h5><blockquote>' + esc(note.applications) + '</blockquote>';
    html += '</div>';
    if (note.tags.length) html += '<div class="lhd-chip-row" style="margin-top:16px;">' + note.tags.map(function (t) { return '<span class="lhd-tag">#' + esc(t) + '</span>'; }).join('') + '</div>';

    var relatedIds = (note.relatedEvergreenIds || []).concat(backlinks.map(function (b) { return b.id; }));
    var seen = {}; var relatedNotes = [];
    relatedIds.forEach(function (id) { if (seen[id] || id === note.id) return; seen[id] = true; var n = D.EvergreenNotes.get(id); if (n) relatedNotes.push(n); });
    html += '<div class="lhd-mn-backlinks"><div class="lhd-mn-toc-title">Connections (' + relatedNotes.length + ')</div>' +
      (relatedNotes.length ? '<div class="lhd-chip-row">' + relatedNotes.map(function (n) { return '<span class="lhd-chip" data-ev-id="' + n.id + '">' + esc(n.title) + '</span>'; }).join('') + '</div>' : '<div style="font-size:12px; color:var(--lhd-text-mute);">No connections yet — link Source Notes here or add a Connection Note.</div>') + '</div>';
  }
  mount.innerHTML = html;
  var editBtn = $('lhdEvEditBtn'); if (editBtn) editBtn.addEventListener('click', function () { renderEvergreenReading(mount, true); });
  var detailsBtn = $('lhdEvDetailsBtn'); if (detailsBtn) detailsBtn.addEventListener('click', function () { openEvergreenNoteModal(note); });
  var saveBtn = $('lhdEvSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    var patch = { contradictions: Object.assign({}, note.contradictions) };
    Array.prototype.forEach.call(mount.querySelectorAll('[data-ev-field]'), function (el) {
      var key = el.getAttribute('data-ev-field');
      if (key === 'principles') patch.principles = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      else if (key.indexOf('contra-') === 0) patch.contradictions[key.slice(7)] = el.value;
      else patch[key] = el.value;
    });
    D.EvergreenNotes.update(note.id, patch);
    renderEvergreenReading(mount, false);
  });
  var cancelBtn = $('lhdEvCancelEditBtn'); if (cancelBtn) cancelBtn.addEventListener('click', function () { renderEvergreenReading(mount, false); });
  Array.prototype.forEach.call(mount.querySelectorAll('[data-ev-id]'), function (el) {
    el.addEventListener('click', function () { state.activeEvId = el.getAttribute('data-ev-id'); renderEvergreenNotesSection(); });
  });
  Array.prototype.forEach.call(mount.querySelectorAll('.lhd-backlink'), function (el) {
    el.addEventListener('click', function () {
      var title = el.getAttribute('data-backlink-title');
      var match = D.EvergreenNotes.list().find(function (n) { return n.title.toLowerCase() === title.toLowerCase(); });
      if (match) { state.activeEvId = match.id; renderEvergreenNotesSection(); }
      else if (confirm('No Evergreen Note titled "' + title + '" exists yet. Create it?')) {

// =====================================================================
// DATABASE 07 — AI TUTOR SYSTEM. Turn learning into mastery: pick a mode
// (Beginner/Intermediate/Expert Teacher, Socratic Tutor, Debate Partner,
// Examiner, Project Coach), get a generated prompt (editable, copyable —
// paste into Claude/ChatGPT yourself, or run it inline with a real
// Anthropic call when a key is set), then log a quiz + a Mastery Score
// (Understanding/Explanation Ability/Application Ability/Confidence),
// Knowledge Gaps, and Next Learning Steps.
//
// Reads the shared Anthropic key from `customization:settings` (see
// D.getAiPrefs()) — the same shared-key pattern design-library.html
// already established — rather than storing a third duplicate key.
// =====================================================================
function callAnthropic(prompt, apiKey) {
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-5-20250929', max_tokens: 1100, messages: [{ role: 'user', content: prompt }] })
  }).then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) { return data && data.content && data.content[0] && data.content[0].text ? data.content[0].text : null; })
    .catch(function () { return null; });
}
function copyBtnFeedback(btn, text) {
  try { navigator.clipboard.writeText(text); } catch (e) {}
  var original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function () { btn.textContent = original; }, 1400);
}

// =====================================================================
// KNOWLEDGE MAPS — node-based visual maps. Zoomable (slider + ctrl+wheel),
// pannable (drag empty canvas), clickable/draggable nodes, a "Connect"
// mode to draw labeled edges between two nodes. No canvas/WebGL library —
// plain absolutely-positioned divs + an SVG line layer, this app's own
// established "no charting/animation library" convention.
// =====================================================================
state.mapPanX = 0; state.mapPanY = 0;
function mapFormFields() {
  return [
    { key: 'title', label: 'Map Title', type: 'text' },
    { key: 'topicId', label: 'Topic', type: 'select', options: [{ value: '', label: 'Unlinked' }].concat(D.topicsSorted().map(function (t) { return { value: t.id, label: t.title }; })) }
  ];
}
function openMapModal(map, defaultTopicId) {
  var values = map ? map : { topicId: defaultTopicId || '' };
  openFormModal({
    title: map ? 'Rename Map' : 'New Knowledge Map',
    fields: mapFormFields(),
    values: values,
    submitLabel: map ? 'Save Changes' : 'Create Map',
    validate: function (v) { if (!v.title.trim()) return 'Give this map a title first.'; return null; },
    onSubmit: function (v) {
      v.topicId = v.topicId || null;
      if (map) D.Maps.update(map.id, v);
      else { v.order = D.nextOrder(D.Maps.list()); v.nodes = []; v.edges = []; var created = D.Maps.add(v); state.activeMapId = created.id; }
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    },
    onDelete: map ? function () {
      D.Maps.remove(map.id);
      if (state.activeMapId === map.id) state.activeMapId = null;
      renderAllSections();
      if (state.activeTopicPageId) renderTopicPage();
    } : null,
    deleteConfirm: 'Delete the map "' + (map ? map.title : '') + '"? This removes all its nodes and connections.'
  });
}
function mapMutate(mapId, fn) {
  var m = D.Maps.get(mapId);
  if (!m) return;
  fn(m);
  D.Maps.update(mapId, { nodes: m.nodes, edges: m.edges });
}
function renderMapWorkspace(list, mount, defaultTopicId) {

function wireMapWorkspace(map, mount, defaultTopicId) {
  $('lhdMapSelect').addEventListener('change', function (e) { state.activeMapId = e.target.value; state.mapZoom = 1; state.mapPanX = 0; state.mapPanY = 0; renderMapWorkspace(D.mapsForTopic ? getActiveMapList(defaultTopicId) : [], mount, defaultTopicId); });
  $('lhdMapAddNodeBtn').addEventListener('click', function () {
    var label = prompt('Node label?', 'New Idea');
    if (!label) return;
    mapMutate(map.id, function (m) {
      var count = m.nodes.length;
      m.nodes.push({ id: D.uid('n'), x: 60 + (count % 5) * 170, y: 50 + Math.floor(count / 5) * 120, label: label, color: D.TOPIC_COLORS[count % D.TOPIC_COLORS.length] });
    });
    drawMapCanvas(D.Maps.get(map.id));
  });
  $('lhdMapConnectBtn').addEventListener('click', function (e) {
    state.mapConnectFrom = null;
    var btn = e.currentTarget;
    var active = btn.classList.toggle('active');
    if (!active) { $('lhdMapCanvas').classList.remove('connect-mode'); }
  });
  $('lhdMapRenameBtn').addEventListener('click', function () { openMapModal(map, defaultTopicId); });
  $('lhdMapZoomInBtn').addEventListener('click', function () { setMapZoom(state.mapZoom + 0.1); });
  $('lhdMapZoomOutBtn').addEventListener('click', function () { setMapZoom(state.mapZoom - 0.1); });
  $('lhdMapResetViewBtn').addEventListener('click', function () { state.mapZoom = 1; state.mapPanX = 0; state.mapPanY = 0; applyMapTransform(); });

  var wrap = $('lhdMapCanvasWrap');
  wrap.addEventListener('wheel', function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setMapZoom(state.mapZoom + (e.deltaY < 0 ? 0.08 : -0.08));
  }, { passive: false });

  var panning = false, panStart = { x: 0, y: 0 }, panOrigin = { x: 0, y: 0 };
  wrap.addEventListener('mousedown', function (e) {
    if (e.target.closest('.lhd-map-node')) return;
    panning = true;
    panStart = { x: e.clientX, y: e.clientY };
    panOrigin = { x: state.mapPanX, y: state.mapPanY };
    $('lhdMapCanvas').classList.add('panning');
  });
  window.addEventListener('mousemove', function (e) {
    if (!panning) return;
    state.mapPanX = panOrigin.x + (e.clientX - panStart.x);
    state.mapPanY = panOrigin.y + (e.clientY - panStart.y);
    applyMapTransform();
  });
  window.addEventListener('mouseup', function () { panning = false; var c = $('lhdMapCanvas'); if (c) c.classList.remove('panning'); });
}
function setMapZoom(z) {
  state.mapZoom = Math.max(0.4, Math.min(2.2, Math.round(z * 100) / 100));
  var label = $('lhdMapZoomLabel'); if (label) label.textContent = Math.round(state.mapZoom * 100) + '%';
  applyMapTransform();
}
function applyMapTransform() {
  var c = $('lhdMapCanvas');
  if (c) c.style.transform = 'translate(' + state.mapPanX + 'px,' + state.mapPanY + 'px) scale(' + state.mapZoom + ')';
}
function drawMapCanvas(map) {
  var canvas = $('lhdMapCanvas');
  if (!canvas || !map) return;
  applyMapTransform();
  var nodesHtml = map.nodes.map(function (n) {
    return '<div class="lhd-map-node" data-node-id="' + n.id + '" style="left:' + n.x + 'px; top:' + n.y + 'px; border-color:' + n.color + '; color:' + n.color + ';">' + esc(n.label) + '</div>';
  }).join('');
  canvas.innerHTML = '<svg class="lhd-map-svg" id="lhdMapSvg"></svg>' + nodesHtml;
  drawMapEdges(map);
  Array.prototype.forEach.call(canvas.querySelectorAll('.lhd-map-node'), function (nodeEl) { wireMapNode(nodeEl, map); });
}
function nodeCenterEstimate(nodeEl) {
  var w = nodeEl.offsetWidth || 130, h = nodeEl.offsetHeight || 40;
  return { w: w, h: h };
}
function drawMapEdges(map) {
  var svg = $('lhdMapSvg');
  if (!svg) return;
  var byId = {}; map.nodes.forEach(function (n) { byId[n.id] = n; });
  var html = '<defs><marker id="lhdArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="rgba(244,114,182,0.65)"></path></marker></defs>';
  map.edges.forEach(function (e) {
    var a = byId[e.from], b = byId[e.to];
    if (!a || !b) return;
    var ax = a.x + 65, ay = a.y + 20, bx = b.x + 65, by = b.y + 20;
    var mx = (ax + bx) / 2, my = (ay + by) / 2;
    html += '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '" stroke="rgba(244,114,182,0.55)" stroke-width="1.6" marker-end="url(#lhdArrow)" data-edge-id="' + e.id + '" style="pointer-events:stroke; cursor:pointer;"></line>';
    if (e.label) html += '<text class="lhd-map-edge-label" x="' + mx + '" y="' + (my - 6) + '" text-anchor="middle" style="pointer-events:none;">' + esc(e.label) + '</text>';
  });
  svg.innerHTML = html;
  Array.prototype.forEach.call(svg.querySelectorAll('[data-edge-id]'), function (lineEl) {
    lineEl.style.pointerEvents = 'stroke';
    lineEl.addEventListener('click', function () {
      if (confirm('Remove this connection?')) {
        mapMutate(map.id, function (m) { m.edges = m.edges.filter(function (e) { return e.id !== lineEl.getAttribute('data-edge-id'); }); });
        drawMapCanvas(D.Maps.get(map.id));
      }
    });
  });
}
function wireMapNode(nodeEl, map) {
  var dragging = false, start = { x: 0, y: 0 }, orig = { x: 0, y: 0 };
  nodeEl.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    var connectBtn = $('lhdMapConnectBtn');
    if (connectBtn && connectBtn.classList.contains('active')) return; // clicks handle connect mode instead
    dragging = true;
    start = { x: e.clientX, y: e.clientY };
    var n = map.nodes.filter(function (x) { return x.id === nodeEl.getAttribute('data-node-id'); })[0];
    orig = { x: n.x, y: n.y };
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var dx = (e.clientX - start.x) / state.mapZoom;
    var dy = (e.clientY - start.y) / state.mapZoom;
    nodeEl.style.left = (orig.x + dx) + 'px';
    nodeEl.style.top = (orig.y + dy) + 'px';
    drawMapEdgesLive(map, nodeEl.getAttribute('data-node-id'), orig.x + dx, orig.y + dy);
  });
  window.addEventListener('mouseup', function (e) {
    if (!dragging) return;
    dragging = false;
    var dx = (e.clientX - start.x) / state.mapZoom;
    var dy = (e.clientY - start.y) / state.mapZoom;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return; // treat as a click, not a drag
    mapMutate(map.id, function (m) {
      var n = m.nodes.filter(function (x) { return x.id === nodeEl.getAttribute('data-node-id'); })[0];
      if (n) { n.x = orig.x + dx; n.y = orig.y + dy; }
    });
  });
  nodeEl.addEventListener('click', function (e) {
    var connectBtn = $('lhdMapConnectBtn');
    if (connectBtn && connectBtn.classList.contains('active')) {
      var id = nodeEl.getAttribute('data-node-id');
      if (!state.mapConnectFrom) {
        state.mapConnectFrom = id;
        nodeEl.classList.add('connecting');
      } else if (state.mapConnectFrom !== id) {
        var label = prompt('Label this connection (optional):', '') || '';
        mapMutate(map.id, function (m) { m.edges.push({ id: D.uid('e'), from: state.mapConnectFrom, to: id, label: label }); });
        state.mapConnectFrom = null;
        connectBtn.classList.remove('active');
        drawMapCanvas(D.Maps.get(map.id));
      }
      return;
    }
  });
  nodeEl.addEventListener('dblclick', function () {
    var n = map.nodes.filter(function (x) { return x.id === nodeEl.getAttribute('data-node-id'); })[0];
    var choice = prompt('Rename node (or type DELETE to remove it):', n.label);
    if (choice == null) return;
    if (choice.trim().toUpperCase() === 'DELETE') {
      mapMutate(map.id, function (m) {
        m.nodes = m.nodes.filter(function (x) { return x.id !== n.id; });
        m.edges = m.edges.filter(function (e) { return e.from !== n.id && e.to !== n.id; });
      });
    } else {
      mapMutate(map.id, function (m) { var nn = m.nodes.filter(function (x) { return x.id === n.id; })[0]; if (nn) nn.label = choice; });
    }
    drawMapCanvas(D.Maps.get(map.id));
  });
}
function drawMapEdgesLive(map, movedNodeId, x, y) {
  var svg = $('lhdMapSvg');
  if (!svg) return;
  var byId = {}; map.nodes.forEach(function (n) { byId[n.id] = n.id === movedNodeId ? Object.assign({}, n, { x: x, y: y }) : n; });
  Array.prototype.forEach.call(svg.querySelectorAll('line[data-edge-id]'), function (lineEl) {
    var edge = map.edges.filter(function (e) { return e.id === lineEl.getAttribute('data-edge-id'); })[0];
    if (!edge || (edge.from !== movedNodeId && edge.to !== movedNodeId)) return;
    var a = byId[edge.from], b = byId[edge.to];
    if (!a || !b) return;
    lineEl.setAttribute('x1', a.x + 65); lineEl.setAttribute('y1', a.y + 20);
    lineEl.setAttribute('x2', b.x + 65); lineEl.setAttribute('y2', b.y + 20);
  });
}
function getActiveMapList(topicFilter) {
  var all = D.Maps.list().slice().sort(function (a, b) { return a.order - b.order; });

function buildWeeklyBarChart() {
  var data = D.weeklyActivityMinutes();
  var max = Math.max.apply(null, data.map(function (d) { return d.minutes; }).concat([1]));
  var html = '<div class="lhd-bar-chart">';
  data.forEach(function (d) {
    var pct = Math.round((d.minutes / max) * 100);
    var day = new Date(d.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 1);
    html += '<div class="lhd-bar-col"><div class="lhd-bar" style="height:' + Math.max(pct, d.minutes > 0 ? 4 : 0) + '%;" title="' + d.minutes + ' min"></div><div class="lhd-bar-label">' + day + '</div></div>';
  });
  html += '</div>';
  return html;
}
function buildCompletionDonut() {
  var pct = D.monthlyCompletionTrend();
  var deg = Math.round(pct * 3.6);
  var style = 'background: conic-gradient(var(--lhd-accent) 0deg ' + deg + 'deg, var(--lhd-surface-2) ' + deg + 'deg 360deg);';
  return '<div class="lhd-donut" style="' + style + '"><div class="lhd-donut-center"><div class="lhd-donut-pct">' + pct + '%</div><div class="lhd-donut-sub">avg. complete</div></div></div>';
}
function buildStatusBreakdown() {

    return '<div class="lhd-status-row"><span class="lhd-status-dot" style="background:' + colors[s] + ';"></span>' + s.charAt(0).toUpperCase() + s.slice(1) + '<span class="lhd-status-count">' + count + '</span></div>';

function applyAccentColor(hex) {
  document.documentElement.style.setProperty('--lhd-accent', hex);
  var rgb = hexToRgb(hex);
  if (rgb) document.documentElement.style.setProperty('--lhd-accent-rgb', rgb.r + ',' + rgb.g + ',' + rgb.b);
}
function hexToRgb(hex) {
  var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
}

// =====================================================================
// Small reusable chip-toggle picker — used by Connection Notes/MOC below
// to link records from other databases without a bespoke multi-select
// per relation (the generic form-modal's field types don't include one).
// =====================================================================
function chipPickerHtml(items, selectedIds, dataAttr) {
  if (!items.length) return '<span style="font-size:12px; color:var(--lhd-text-mute);">Nothing to link yet.</span>';
  return items.map(function (it) {
    return '<span class="lhd-chip' + (selectedIds.indexOf(it.id) !== -1 ? ' active' : '') + '" ' + dataAttr + '="' + it.id + '">' + esc(it.title || it.text) + '</span>';
  }).join('');
}
function wireChipPicker(mountEl, dataAttr, onToggle) {
  Array.prototype.forEach.call(mountEl.querySelectorAll('[' + dataAttr + ']'), function (el) {
    el.addEventListener('click', function () { onToggle(el.getAttribute(dataAttr)); });
  });
}

// =====================================================================
// STUDY TIMER — timestamp-diff based (Date.now() diffs, not a naive tick
// counter) so a backgrounded/throttled tab can't drift, same precedent
// gym.html's own workout timer and selfcare.html's breathing pacer
// already established. Stopwatch counts up; Pomodoro counts down through
// alternating work/break phases with a synthesized beep at each switch
// (Web Audio, no bundled audio asset — same "no binary assets" precedent
// this app's own DO NOT MODIFY discipline already follows).
// =====================================================================
var RING_CIRC = 2 * Math.PI * 76;
var audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function playBeep() {
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.52);
  } catch (e) {}
}
function fmtClock(ms) {
  var totalSec = Math.max(0, Math.floor(ms / 1000));
  var m = Math.floor(totalSec / 60), s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function openTimerQuickModal(topicId) {
  var topics = D.topicsSorted();
  var sel = $('lhdTimerTopicSelect');
  sel.innerHTML = topics.length
    ? topics.map(function (t) { return '<option value="' + t.id + '">' + esc(t.icon) + ' ' + esc(t.title) + '</option>'; }).join('')
    : '<option value="">No topics yet</option>';
  var useId = topicId || state.timer.topicId || (topics.length ? topics[0].id : null);
  if (useId) sel.value = useId;
  state.timer.topicId = sel.value || null;
  renderTimerUI();
  $('lhdTimerModalBg').classList.add('show');
}
function closeTimerModal() { $('lhdTimerModalBg').classList.remove('show'); }
function setTimerMode(mode) {
  if (state.timer.running) return;
  state.timer.mode = mode;
  resetTimerState();
  $('lhdTimerModeStopwatch').classList.toggle('active', mode === 'stopwatch');
  $('lhdTimerModePomodoro').classList.toggle('active', mode === 'pomodoro');
  renderTimerUI();
}
function resetTimerState() {
  var settings = D.getSettings();
  state.timer.elapsedMs = 0;
  state.timer.phaseStartElapsedMs = 0;
  state.timer.phase = 'work';
  state.timer.phaseSecs = (state.timer.mode === 'pomodoro' ? settings.pomodoroWork : 0) * 60;
}
function startTimer() {
  ensureAudio();
  if (state.timer.mode === 'pomodoro' && !state.timer.phaseSecs) resetTimerState();
  state.timer.startedAt = Date.now();
  state.timer.running = true;
  $('lhdTimerStartBtn').style.display = 'none';
  $('lhdTimerPauseBtn').style.display = 'inline-flex';
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}
function pauseTimer() {
  state.timer.elapsedMs += Date.now() - state.timer.startedAt;
  state.timer.running = false;
  clearInterval(state.timerInterval);
  $('lhdTimerStartBtn').style.display = 'inline-flex';
  $('lhdTimerPauseBtn').style.display = 'none';
  renderTimerUI();
}
function resetTimerBtn() {
  clearInterval(state.timerInterval);
  state.timer.running = false;
  resetTimerState();
  $('lhdTimerStartBtn').style.display = 'inline-flex';
  $('lhdTimerPauseBtn').style.display = 'none';
  renderTimerUI();
}
function currentTotalElapsedMs() {
  return state.timer.elapsedMs + (state.timer.running ? (Date.now() - state.timer.startedAt) : 0);
}
function tickTimer() {
  var totalMs = currentTotalElapsedMs();
  var settings = D.getSettings();
  if (state.timer.mode === 'pomodoro') {
    var phaseElapsed = totalMs - state.timer.phaseStartElapsedMs;
    var phaseMs = state.timer.phaseSecs * 1000;
    if (phaseElapsed >= phaseMs) {
      state.timer.phase = state.timer.phase === 'work' ? 'break' : 'work';
      state.timer.phaseSecs = (state.timer.phase === 'work' ? settings.pomodoroWork : settings.pomodoroBreak) * 60;
      state.timer.phaseStartElapsedMs = totalMs;
      if (settings.notificationsEnabled) playBeep();
      $('lhdTimerDigits').classList.add('flash');
      setTimeout(function () { var el = $('lhdTimerDigits'); if (el) el.classList.remove('flash'); }, 500);
    }
  }
  renderTimerUI();
}
function renderTimerUI() {
  var totalMs = currentTotalElapsedMs();
  var settings = D.getSettings();
  if (state.timer.mode === 'pomodoro') {
    var phaseElapsed = totalMs - state.timer.phaseStartElapsedMs;
    var remainMs = Math.max(0, state.timer.phaseSecs * 1000 - phaseElapsed);
    $('lhdTimerDigits').textContent = fmtClock(remainMs);
    $('lhdTimerPhase').textContent = state.timer.running ? (state.timer.phase === 'work' ? 'Focus' : 'Break') : 'Ready';
    var frac = state.timer.phaseSecs ? Math.min(1, phaseElapsed / (state.timer.phaseSecs * 1000)) : 0;
    $('lhdTimerRingFill').setAttribute('stroke-dashoffset', String(RING_CIRC * frac));
    $('lhdTimerRingFill').classList.remove('lhd-pulsing');
  } else {
    $('lhdTimerDigits').textContent = fmtClock(totalMs);
    $('lhdTimerPhase').textContent = state.timer.running ? 'Studying' : (totalMs ? 'Paused' : 'Ready');
    $('lhdTimerRingFill').setAttribute('stroke-dashoffset', '0');
    $('lhdTimerRingFill').classList.toggle('lhd-pulsing', state.timer.running);
  }
}
function stopAndLogTimer() {
  var totalMs = currentTotalElapsedMs();
  var minutes = Math.round(totalMs / 60000);
  clearInterval(state.timerInterval);
  state.timer.running = false;
  $('lhdTimerStartBtn').style.display = 'inline-flex';
  $('lhdTimerPauseBtn').style.display = 'none';
  if (minutes < 1) { resetTimerState(); renderTimerUI(); return; }
  var topicId = $('lhdTimerTopicSelect').value;
  if (!topicId) { alert('Pick a topic first so this session has somewhere to log to.'); return; }
  D.Sessions.add({ topicId: topicId, date: D.todayISO(), minutes: minutes, mode: state.timer.mode });
  D.markStudied(topicId);
  resetTimerState();
  renderTimerUI();
  closeTimerModal();
  renderAllSections();
  if (state.activeTopicPageId === topicId) renderTopicPage();
}
$('lhdTimerCloseBtn').addEventListener('click', function () { if (!state.timer.running) closeTimerModal(); else if (confirm('A session is still running — pause and close?')) { pauseTimer(); closeTimerModal(); } });
$('lhdTimerModalBg').addEventListener('click', function (e) { if (e.target === $('lhdTimerModalBg') && !state.timer.running) closeTimerModal(); });
$('lhdTimerTopicSelect').addEventListener('change', function (e) { state.timer.topicId = e.target.value; });
$('lhdTimerModeStopwatch').addEventListener('click', function () { setTimerMode('stopwatch'); });
$('lhdTimerModePomodoro').addEventListener('click', function () { setTimerMode('pomodoro'); });
$('lhdTimerStartBtn').addEventListener('click', startTimer);
$('lhdTimerPauseBtn').addEventListener('click', pauseTimer);
$('lhdTimerResetBtn').addEventListener('click', resetTimerBtn);
$('lhdTimerStopSaveBtn').addEventListener('click', stopAndLogTimer);

// =====================================================================
// GLOBAL SEARCH SYSTEM — the Ctrl+K command palette doubles as the app's
// "search everything" surface: pages/topics/frameworks/evergreen notes
// (always listed) plus, once a query is typed, D.globalSearch(query)
// results across Source Notes/Questions/Connections/MOCs/Projects/Tutor
// Sessions — simple substring match, same "not a real search index"
// simplification precedent this palette already used before the
// rebuild, just now spanning every database instead of three.
// =====================================================================
var CMDK_COLLECTION_META = {
  sourceNotes: { icon: '📥', tag: 'Source Note', open: function (id) { switchSection('sourcenotes'); setTimeout(function () { openSourceNoteDetail(id); }, 60); } },
  questions: { icon: '❔', tag: 'Question', open: function (id) { openQuestionModal(D.Questions.get(id)); } },
  connectionNotes: { icon: '🔗', tag: 'Connection', open: function (id) { switchSection('connections'); setTimeout(function () { openConnectionDetail(id); }, 60); } },
  mocs: { icon: '🗂️', tag: 'MOC', open: function (id) { switchSection('mocs'); setTimeout(function () { openMocDetail(id); }, 60); } },
  projects: { icon: '🚀', tag: 'Project', open: function (id) { switchSection('projects'); setTimeout(function () { openProjectDetail(id); }, 60); } },
  tutorSessions: { icon: '🎓', tag: 'Tutor Session', open: function (id) { state.activeTutorSessionId = id; switchSection('tutor'); } }
};
function commandItems() {
  var items = SECTIONS.map(function (s) { return { icon: s.icon, label: s.label, tag: 'Page', action: function () { switchSection(s.key); } }; });
  D.topicsSorted().forEach(function (t) { items.push({ icon: t.icon, label: t.title, tag: 'Topic', action: function () { openTopicPage(t.id); } }); });
  D.Frameworks.list().forEach(function (f) { items.push({ icon: f.icon, label: f.title, tag: 'Framework', action: function () { switchSection('frameworks'); setTimeout(function () { openFrameworkDetail(f.id); }, 60); } }); });
  D.EvergreenNotes.list().forEach(function (n) { items.push({ icon: '🌲', label: n.title, tag: 'Evergreen Note', action: function () { state.activeEvId = n.id; switchSection('evergreennotes'); } }); });
  items.push({ icon: '➕', label: 'New Topic', tag: 'Action', action: function () { openTopicModal(null); } });
  items.push({ icon: '📝', label: 'Start Daily Study Session', tag: 'Action', action: function () { openDailyWidget(D.currentTopic() ? D.currentTopic().id : null); } });
  items.push({ icon: '⏱️', label: 'Open Study Timer', tag: 'Action', action: function () { openTimerQuickModal(); } });
  return items;
}
function globalSearchCommandItems(query) {
  return D.globalSearch(query).filter(function (r) { return CMDK_COLLECTION_META[r.collection]; }).map(function (r) {
    var meta = CMDK_COLLECTION_META[r.collection];
    return { icon: meta.icon, label: r.title, sub: r.snippet, tag: meta.tag, action: function () { meta.open(r.id); } };
  });
}
function openCmdk() {
  $('lhdCmdkInput').value = '';
  state.cmdkSelIndex = 0;
  renderCmdkResults('');
  $('lhdCmdkBg').classList.add('show');
  setTimeout(function () { $('lhdCmdkInput').focus(); }, 30);
}
function closeCmdk() { $('lhdCmdkBg').classList.remove('show'); }
function renderCmdkResults(query) {
  var q = query.trim().toLowerCase();
  var all = commandItems();
  var results = q ? all.filter(function (i) { return i.label.toLowerCase().indexOf(q) !== -1; }).concat(globalSearchCommandItems(q)) : all.slice(0, 12);
  if (state.cmdkSelIndex >= results.length) state.cmdkSelIndex = 0;
  var mount = $('lhdCmdkResults');
  if (!results.length) { mount.innerHTML = '<div class="lhd-cmdk-empty">No matches for “' + esc(query) + '”</div>'; return; }
  mount.innerHTML = results.map(function (r, i) {
    return '<div class="lhd-cmdk-item' + (i === state.cmdkSelIndex ? ' sel' : '') + '" data-cmdk-index="' + i + '"><span class="lhd-cmdk-item-icon">' + r.icon + '</span><span class="lhd-cmdk-item-label">' + esc(r.label) + '</span><span class="lhd-cmdk-item-tag">' + r.tag + '</span></div>';
  }).join('');
  Array.prototype.forEach.call(mount.querySelectorAll('[data-cmdk-index]'), function (el) {
    el.addEventListener('click', function () { runCmdkResult(results, parseInt(el.getAttribute('data-cmdk-index'), 10)); });
    el.addEventListener('mouseenter', function () { state.cmdkSelIndex = parseInt(el.getAttribute('data-cmdk-index'), 10); renderCmdkResults($('lhdCmdkInput').value); });
  });
  state.cmdkResultsCache = results;
}
function runCmdkResult(results, idx) {
  var item = results[idx];
  if (!item) return;
  closeCmdk();
  item.action();
}
$('lhdCmdkInput').addEventListener('input', function (e) { state.cmdkSelIndex = 0; renderCmdkResults(e.target.value); });
$('lhdCmdkInput').addEventListener('keydown', function (e) {
  var results = state.cmdkResultsCache || [];
  if (e.key === 'ArrowDown') { e.preventDefault(); state.cmdkSelIndex = Math.min(results.length - 1, state.cmdkSelIndex + 1); renderCmdkResults($('lhdCmdkInput').value); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); state.cmdkSelIndex = Math.max(0, state.cmdkSelIndex - 1); renderCmdkResults($('lhdCmdkInput').value); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmdkResult(results, state.cmdkSelIndex); }
  else if (e.key === 'Escape') { closeCmdk(); }
});
$('lhdCmdkBg').addEventListener('click', function (e) { if (e.target === $('lhdCmdkBg')) closeCmdk(); });
$('lhdSearchTrigger').addEventListener('click', openCmdk);
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openCmdk(); }
});

// =====================================================================
// HEADER wiring
// =====================================================================
$('lhdSbToggleBtn').addEventListener('click', function () {
  var sidebar = $('lhdSidebar');
  if (sidebar.classList.contains('lhd-sb-open')) closeSidebarMobile(); else openSidebarMobile();
});
$('lhdThemeToggleBtn').addEventListener('click', toggleTheme);
$('lhdTimerQuickBtn').addEventListener('click', function () { openTimerQuickModal(); });
$('lhdNewTopicBtn').addEventListener('click', function () { openTopicModal(null); });

// =====================================================================
// BOOT — same empty-storage seed-race-safety contract as
// dreamboard.html/aitech.html/business.html: seeding is deferred until
// either real cloud data arrives via onApplied, or a 5s window elapses
// with nothing (or the Supabase SDK never loaded at all, in which case
// there is no cloud to race against). Wrapped in try/catch with a
// visible boot-error banner, same precedent business.html/gym.html/
// mainpillar.html already established for this exact failure class.
// =====================================================================
var remoteAppliedOnce = false;
function maybeSeedAfterSyncAttempt() {
  // Runs once, after the initial cloud-sync pull has had a real chance to
  // answer (5s timeout, or immediately if there is no cloud to race
  // against) — same seed-race reasoning as seedIfEmpty() below, extended
  // to the one-time migrations (learning:* folder + legacy Research/
  // MasterNotes) since those also shouldn't run against a pre-sync-pull
  // snapshot of this page's own lhub: data.
  D.runOneTimeMigrations();
  if (!remoteAppliedOnce && D.isEmptyEverywhere()) D.seedIfEmpty();
  renderAllSections();
  if (state.activeTopicPageId) renderTopicPage();
}
function hashSection() {
  var h = (window.location.hash || '').replace(/^#/, '');
  return SECTIONS.some(function (s) { return s.key === h; }) ? h : 'home';
}
function boot() {
  D = window.LearningHubData;
  if (!D) { showBootErrorBanner('LearningHubData did not load — check that learning-dashboard-data.js loaded correctly.', 'boot'); return; }

  var settings = D.getSettings();
  applyTheme(settings.theme);
  applyAccentColor(settings.accentColor);

  renderSidebarNav();
  switchSection(hashSection());

  window.addEventListener('hashchange', function () { switchSection(hashSection()); });

  if (typeof window.initCloudSync === 'function') {
    window.initCloudSync({
      appKey: 'learninghub',
      syncedPrefixes: ['lhub:'],
      onApplied: function () {
        remoteAppliedOnce = true;
        runSafely(function () {
          renderAllSections();
          if (state.activeTopicPageId) renderTopicPage();
        }, 'onApplied');
      }
    });
    setTimeout(maybeSeedAfterSyncAttempt, 5000);
  } else {
    maybeSeedAfterSyncAttempt();
  }

  window.addEventListener('lhub:save', function (e) {
    var el = $('lhdSyncStatus');
    if (!el) return;
    if (e.detail && e.detail.ok === false) { el.textContent = "Couldn't save — your browser's storage may be full"; el.style.color = 'var(--lhd-bad)'; return; }
    el.textContent = 'Saved — syncing…'; el.style.color = '';
    clearTimeout(window.__lhdSyncStatusTimer);
    window.__lhdSyncStatusTimer = setTimeout(function () { if (el) el.textContent = 'Changes save automatically'; }, 2200);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); }); }, { once: true });
} else {
  LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); });
}

})();
</script>
