  // The prefix is 'pmdraft:', NOT 'prm:', and that is the whole design:
  //
  //   · sync.js's matches() tests syncedKeys + syncedPrefixes only, so a
  //     pmdraft: write never reaches schedulePush(). Were these prm: keys,
  //     every 400ms of typing would re-serialise and upsert the ENTIRE prm:
  //     row — precisely the cost the rich editor's 1200ms debounce exists
  //     to avoid, except on every surface at once.
  //   · applyRemote's delete sweep walks listAllKeys(), which is itself
  //     filtered through matches(), so a remote apply can never take a
  //     draft with it.
  //   · local-store-idb.js persists EVERY key to IndexedDB regardless of
  //     prefix, so drafts survive a refresh anyway — which is the point.
  //   · Half-finished text has no business appearing on another device.
  //     Device-local is the correct scope here, not a compromise.
  //
  // Written through localStorage directly rather than promptarium-data.js's
  // storeSet, because a draft is not a record and must not raise prm:save.
  // ============================================================
  var DRAFT_PREFIX = 'pmdraft:';
  var DRAFT_TTL = 7 * 86400000;   // a draft older than a week is litter, not work

  function draftKey(id) { return DRAFT_PREFIX + id; }
  function draftGet(id) {
    try {
      var raw = localStorage.getItem(draftKey(id));
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !d.fields) return null;
      if (Date.now() - (d.at || 0) > DRAFT_TTL) { draftClear(id); return null; }
      return d;
    } catch (e) { return null; }
  }
  function draftSet(id, fields) {
    // An all-empty draft is not a draft. Writing one would put a restore
    // notice on a surface with nothing to restore.
    var any = false;
    for (var k in fields) {
      if (String(fields[k] == null ? '' : fields[k]).trim() !== '') { any = true; break; }
    }
    if (!any) { draftClear(id); return; }
    try {
      localStorage.setItem(draftKey(id), JSON.stringify({ at: Date.now(), id: id, fields: fields }));
    } catch (e) {}
  }
  function draftClear(id) {
    try { localStorage.removeItem(draftKey(id)); } catch (e) {}
  }

  /* One shared debounce. Only one surface — capture or modal, never both —
     is open at a time, so a single timer is all this needs. The pending
     writer is kept so §FLUSH can force it out on the way to a reload
     rather than losing the last 400ms of typing to its own debounce. */
  var draftTimer = null, draftPending = null;
  function draftRun() {
    var fn = draftPending; draftPending = null;
    if (fn) { try { fn(); } catch (e) {} }
  }
  function draftSchedule(writeFn) {
    draftPending = writeFn;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () { draftTimer = null; draftRun(); }, 400);
  }
  function draftFlushNow() { clearTimeout(draftTimer); draftTimer = null; draftRun(); }

  /* The restore notice. Built on .pm-banner so it inherits the amber rule
     the page already uses for "read this before you carry on". */
  function draftNoticeHTML(at) {
    // fmtAgo already reads as a phrase ("just now", "4m ago"), so the
    // sentence is built to take either without a seam.
    return '<div class="pm-banner" data-draftnotice="1">' +
      '<b>⟲ Restored</b> what you had unsaved here ' + esc(D().fmtAgo(at)) + '.' +
      '<span class="pm-spacer"></span>' +
      '<button type="button" class="pm-btn pm-btn-sm" data-draftdiscard="1">Discard it</button>' +
    '</div>';
  }

  // ============================================================
  // §CODEX GATE
  //
  // sync.js pushes by REPLACING the whole row: pushNow() collects every
  // matching localStorage key and upserts it as the row's entire data
  // column. So if this page wrote any cdx: key before the codex row had
  // been pulled down here, the 250ms debounce would overwrite the Codex's
  // whole row with a partial set — taking cdx:trilogies, cdx:chapters and
  // cdx:scenes with it. The manuscripts.
  //
  // Hence: EVERY cdx: mutation on this page goes through codexWrite().
  // The invariant to check in review is that `C().Prompts.` and
  // `C().PromptNotes.` appear nowhere except inside a codexWrite callback.
  // ============================================================
  var gate = { mounted: false, applied: false, graceOver: false, unlocked: false };

  function cdxKeyCount() {
    var n = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('cdx:') === 0) n++;
      }
    } catch (e) {}
    return n;
  }
  function codexWritable() {
    return gate.mounted
      && (gate.applied || gate.graceOver)
      && navigator.onLine !== false
      && (cdxKeyCount() > 0 || gate.unlocked);
  }
  /* Why the gate is shut, in words, for the Fiction page banner. */
  function gateReason() {
    if (!gate.mounted) return 'Cloud sync did not start on this page, so the fiction library cannot be reached. Fiction prompts are read-only.';
    if (!gate.applied && !gate.graceOver) return 'Still loading the fiction library…';
    if (navigator.onLine === false) return 'You are offline. Fiction prompts are read-only until the connection returns, so a partial write cannot overwrite the fiction library.';
    if (cdxKeyCount() === 0 && !gate.unlocked) return 'None of the fiction library has arrived on this device yet. Fiction prompts stay read-only until it loads — an empty library and a failed load look identical from here, and guessing wrong would overwrite your manuscripts.';
    return '';
  }
  function codexWrite(fn) {
    if (!codexWritable()) { toast('The fiction library has not finished loading', true); return false; }
    try { fn(); } catch (e) {
      try { console.error('[Promptarium] codex write failed', e); } catch (e2) {}
      toast('That fiction edit did not save', true);
      return false;
    }
    return true;
  }

  // ============================================================
  // §PV — the unified view layer.
  //
  // Every renderer, filter and sort below works on ONE normalized shape,
  // so a fiction prompt and a native prompt are the same object to the UI.
  // Nothing outside this section touches window.CodexData.
  // ============================================================
  function cdxPromptList() {
    var c = C();
    if (!c || !c.Prompts) return [];
    try { return c.Prompts.list(); } catch (e) { return []; }
  }
  function normPrm(p) {
    return {
      uid: 'prm:' + p.id, src: 'prm', id: p.id, raw: p,
      collection: p.collection || 'inbox',
      title: p.title, icon: p.icon, text: p.text, category: p.category,
      tags: p.tags || [], purposeTags: p.purposeTags || [],
      modelHint: p.modelHint, creator: p.creator, sourceUrl: p.sourceUrl,
      status: p.status, rating: p.rating || 0, pinned: !!p.pinned,
      useCount: p.useCount || 0, lastUsedAt: p.lastUsedAt || '',
      order: p.order || 0, createdAt: p.createdAt, updatedAt: p.updatedAt || p.createdAt,
      editable: true
    };
  }
  function normCdx(p) {
    var m = D().fictionMetaFor(p.id);
    return {
      uid: 'cdx:' + p.id, src: 'cdx', id: p.id, raw: p,
      collection: 'fiction',
      title: p.title, icon: p.icon, text: p.text, category: p.category,
      tags: p.tags || [], purposeTags: m.purposeTags || [],
      modelHint: p.modelHint, creator: m.creator, sourceUrl: m.sourceUrl,
      status: m.status, rating: m.rating || 0,
      pinned: !!p.favorite,          // the Codex's own ★ field — shared both ways
      useCount: p.useCount || 0, lastUsedAt: p.lastUsedAt || '',
      order: p.order || 0, createdAt: p.createdAt, updatedAt: p.updatedAt || p.createdAt,
      scope: p.scope, scopeId: p.scopeId,
      editable: codexWritable()
    };
  }
  function pvAll() {
    var out = D().Prompts.list().map(normPrm);
    cdxPromptList().forEach(function (p) { out.push(normCdx(p)); });
    return out;
  }
  function pvGet(uid) {
    var all = pvAll();
    for (var i = 0; i < all.length; i++) if (all[i].uid === uid) return all[i];
    return null;
  }

  /* Splits a patch by destination. The Codex's promptModel is a whitelist
     that is re-run on every update, so anything outside CDX_PROMPT_FIELDS
     would be silently stripped the next time the Codex touched the record
     — those keys go to the prm:fictionMeta sidecar instead. */
  var META_FIELDS = ['rating', 'purposeTags', 'creator', 'sourceUrl', 'status'];
  function pvPatch(uid, patch) {
    var d = D(), v = pvGet(uid);
    if (!v) return false;
    if (v.src === 'prm') { d.Prompts.update(v.id, patch); return true; }

    var meta = {}, cdx = {};
    Object.keys(patch).forEach(function (k) {
      if (META_FIELDS.indexOf(k) >= 0) meta[k] = patch[k];
      else if (k === 'pinned') cdx.favorite = !!patch[k];
      else cdx[k] = patch[k];
    });
    if (Object.keys(meta).length) d.setFictionMeta(v.id, meta);
    if (!Object.keys(cdx).length) return true;
    if (!d.assertCodexFields(cdx, 'pvPatch(' + uid + ')')) return false;
    return codexWrite(function () { C().Prompts.update(v.id, cdx); });
  }
  function pvRemove(uid) {
    var d = D(), v = pvGet(uid);
    if (!v) return false;
    if (v.src === 'prm') { d.removePrompt(v.id); return true; }
    var ok = codexWrite(function () { C().removePrompt(v.id); });
    if (ok) d.dropFictionMeta(v.id);
    return ok;
  }
  /* Copy is a READ, so it must work even while the gate is shut. Only the
     usage counter is a write, and it is best-effort — never block a copy
     on it. */

    var v = pvGet(uid);

  // ============================================================
  // §RICH — the contenteditable editor shared by the collection article and
  // the collection notes database.
  //
  // THE PROBLEM THIS SECTION EXISTS FOR: refreshCurrentView() replaces a
  // whole view's innerHTML, and it is fired by cloud-sync onApplied (both
  // rows), online/offline, the 3s boot grace timer, modal saves and
  // __pmRefresh — i.e. at moments nobody chose. One landing mid-sentence
  // would destroy the buffer, the caret and any IME composition. So while an
  // editor holds focus, the repaint is DEFERRED to its blur rather than
  // cancelled: nothing that calls refreshCurrentView needs to repaint while
  // you are mid-paragraph, and deferring by a few seconds costs nothing
  // while repainting costs the paragraph.
  // ============================================================
  var richFocus = { el: null, key: '', offset: -1, composing: false };
  var richTimer = null;
  var refreshPending = false;
  var pendingSwaps = [];
  var RICH_MAX = 900000;   // ~900KB of HTML per field

  function caretOffset(root) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return -1;
    try {
      var r0 = sel.getRangeAt(0);
      if (!root.contains(r0.endContainer)) return -1;
      var r = document.createRange();
      r.selectNodeContents(root);
      r.setEnd(r0.endContainer, r0.endOffset);
      return r.toString().length;
    } catch (e) { return -1; }
  }
  function setCaret(root, n) {
    if (n < 0) return;
    try {
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), seen = 0, node;
      while ((node = w.nextNode())) {
        if (seen + node.length >= n) {
          var r = document.createRange();
          r.setStart(node, Math.max(0, n - seen)); r.collapse(true);
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          return;
        }
        seen += node.length;
      }
      root.focus();
    } catch (e) {}
  }
  function markEmpty(el) {
    var t = (el.textContent || '').replace(/\s+/g, '');
    var hasMedia = !!el.querySelector('img,hr,pre');
    el.classList.toggle('is-empty', !t && !hasMedia);
  }

  /* key format: "art:<collectionId>:<field>" | "note:<noteId>"

     `force` is passed only by pmFlushAll (§FLUSH). Normally a commit during
     an IME composition is wrong — the buffer holds half a character. On the
     way out of the page it is the opposite: half a character beats none, and
     there is no later blur to catch it. */
  function commitRich(el, force) {
    if (!el || (richFocus.composing && !force)) return;
    var d = D(), key = el.getAttribute('data-rich');
    if (!key) return;
    var isPlain = el.getAttribute('data-plain') === '1';
    var value = isPlain ? (el.textContent || '').replace(/\s+/g, ' ').trim() : el.innerHTML;
    if (!isPlain && value.length > RICH_MAX) {
      toast('That is too large to save — link the image instead of pasting it', true);
      return;
    }
    var parts = key.split(':');
    if (parts[0] === 'art') {
      // parts[2] must be a real articleModel field ('title' | 'subtitle' |
      // 'bodyHtml'); the model whitelists, so anything else vanishes.
      var patch = {};
      if (['title', 'subtitle', 'bodyHtml'].indexOf(parts[2]) < 0) return;
      patch[parts[2]] = value;
      d.setArticle(parts[1], patch);
    } else if (parts[0] === 'note') {

      d.CollectionNotes.update(parts[1], p2);

    el.dataset.rev = 'local';   // this node is already current; skip its next repaint
    markEmpty(el);
  }
  function scheduleCommit(el) {
    clearTimeout(richTimer);
    // 1200ms, not per-keystroke: every storeSet trips sync.js's schedulePush,
    // which re-serialises and upserts the ENTIRE prm: row. Saving on each
    // letter would upload the whole library on every letter.
    richTimer = setTimeout(function () { commitRich(el); }, 1200);
  }
  function flushRich(force) {
    clearTimeout(richTimer);

    applyPendingSwaps();

  }
  function richHasFocus() {
    return !!(richFocus.el && document.contains(richFocus.el));
  }
  /* What refreshCurrentView has to defer around. A repaint replaces a whole
     view's innerHTML, so ANY field being typed into inside #pmApp loses its
     text, its caret and its IME composition — not just a [data-rich] one.
     The inline note fields were never covered, so a cloud apply landing
     mid-sentence in a note quietly destroyed it. Every one of these has a
     blur handler that runs the deferred repaint, so nothing stalls. */

    var a = document.activeElement;

  // ============================================================
  // §FLUSH — commit everything the DOM is still holding, on the way out.
  //
  // Three tiers of uncommitted state exist on this page:
  //   · [data-rich] commits on a 1200ms debounce, or on blur
  //   · note titles and bodies commit on blur ONLY
  //   · the capture and modal surfaces have no record behind them at all,
  //     and are handled by §DRAFT rather than here
  // A reload does not blur anything and does not wait for a debounce, so
  // without this the last thing you typed is the thing you lose.
  //
  // REGISTRATION ORDER IS LOAD-BEARING. sync.js installs its own
  // flushOnUnload inside initCloudSync, which §BOOT calls at parse time.
  // Listeners for one event on one target fire in registration order, so
  // these must be registered ABOVE that call — not inside boot(), which
  // runs at DOMContentLoaded and would therefore land after sync.js and
  // miss the final push with the very edit this function exists to save.
  //
  // beforeunload alone is not enough: mobile Safari frequently never fires
  // it. pagehide and visibilitychange are the ones that survive a swipe
  // away or a tab discard, so all three are wired and pmFlushAll is written
  // to be safely re-entrant.
  // ============================================================
  function pmFlushAll() {
    try { flushRich(true); } catch (e) {}
    // Whatever inline field holds focus right now. commitNoteField and
    // commitCNoteTitle are the same code the blur handlers run, so this
    // adds no new write path — only a new moment to run the existing one.
    try {
      clearTimeout(inlineTimer); inlineTimer = null;
      commitInline(document.activeElement);
      // A field whose autosave was still pending when focus moved elsewhere.
      if (inlineEl && inlineEl !== document.activeElement && document.contains(inlineEl)) commitInline(inlineEl);
    } catch (e) {}
    try { draftFlushNow(); } catch (e) {}
  }
  window.addEventListener('beforeunload', pmFlushAll);
  window.addEventListener('pagehide', pmFlushAll);
  document.addEventListener('visibilitychange', function () {

  });

  function applyPendingSwaps() {
    if (!pendingSwaps.length) return;
    var d = D(), q = pendingSwaps.slice();
    pendingSwaps.length = 0;
    q.forEach(function (s) { swapNoteImage(s.key, s.from, s.to); });
  }
  /* Runs against the COMMITTED body, never a live buffer, and re-checks that
     the record and the image still exist — the upload may outlive both. */
  function swapNoteImage(key, fromSrc, toUrl) {
    var d = D(), parts = key.split(':');
    if (parts[0] === 'note') {
      var n = d.CollectionNotes.get(parts[1]);
      if (!n || n.bodyHtml.indexOf(fromSrc) < 0) return;
      d.CollectionNotes.update(n.id, { bodyHtml: n.bodyHtml.split(fromSrc).join(toUrl), updatedAt: d.nowISO() });
    } else if (parts[0] === 'art') {
      var a = d.articleFor(parts[1]);
      if (!a || a.bodyHtml.indexOf(fromSrc) < 0) return;
      d.setArticle(parts[1], { bodyHtml: a.bodyHtml.split(fromSrc).join(toUrl) });
    }
  }

  function insertRich(html) {

    var d = D();

    //    a junk text/html wrapper.
    if (!plain && dt.items) {

        var it = dt.items[i];

          reader.onload = function (ev) {
            d.compressImageDataUrl(ev.target.result, 1400, 0.82).then(function (small) {
              el.focus();

              commitRich(el);                       // survives an immediate reload
              markEmpty(el);
              if (!window.PhotoStore || !PhotoStore.upload) return;
              PhotoStore.upload(small, function (url) {
                if (!url) return;                   // offline / no bucket → base64 stays
                // Never touch a focused editor's DOM: queue and drain on blur.

            });

          reader.readAsDataURL(file);

    var html = !plain && dt.getData ? dt.getData('text/html') : '';

    } else {

        return '<p>' + d.esc(p).replace(/\n/g, '<br>') + '</p>';

    scheduleCommit(el);
  }

  /* Bound once per view host. `on()` already de-duplicates by

  function wireRich(host) {
    on(host, '[data-rich]', 'focus', function () {
      richFocus.el = this;

        else document.execCommand(cmd);

  }

  function rteBarHTML() {
    return '<div class="pm-rte-bar">' +
      [['bold', 'B'], ['italic', 'I'], ['h2', 'H2'], ['h3', 'H3'],
       ['insertUnorderedList', '•'], ['insertOrderedList', '1.'],

      .filter(function (c) { return c[0] !== 'formatBlock'; })
      .map(function (c) {

      }).join('') + '</div>';

  // ============================================================
  // §STAGE — the hero video controller.
  //
  // The element itself is static markup (see the comment on #pmStage); this
  // only decides whether it gets a src at all, and keeps it playing.
  // ============================================================
  var STAGE_SRC = 'images_by_admin/promptarium/hero.mp4';
  var mqNarrow = window.matchMedia('(max-width:720px)');
  var mqMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  function stageAllowed() { return !mqNarrow.matches && !mqMotion.matches; }

  function mountStage() {
    var v = $('pmStageVid'), root = document.documentElement;
    if (!v) return;
    if (!stageAllowed()) {
      // Not "hidden" — actively detached, so a phone never spends the
      // bandwidth. The hero falls back to the orb + gradient it had before.
      root.classList.remove('pm-video-on', 'pm-video-live');
      if (v.getAttribute('src')) { try { v.pause(); } catch (e) {} v.removeAttribute('src'); v.load(); }
      return;
    }
    root.classList.add('pm-video-on');
    if (!v.getAttribute('src')) {
      v.addEventListener('playing', function () { root.classList.add('pm-video-live'); });
      v.addEventListener('error', function () { root.classList.remove('pm-video-on', 'pm-video-live'); });
      v.preload = 'auto';
      v.src = STAGE_SRC;
    }
    v.play().catch(function () {});
  }
  function resumeStage() {
    var v = $('pmStageVid');
    if (v && v.getAttribute('src') && v.paused) v.play().catch(function () {});
  }

    mqNarrow.addEventListener('change', mountStage);

  });

  // ============================================================
  // §BEAM — the sprung angular velocity behind the cards' border comets.
  // The ring itself is entirely CSS (see §MATERIAL); this only decides
  // what angle it is at, and only while a pointer is on a card.
  //
  // The spring is on the SPEED, not the angle. That is the whole character
  // of the effect: point at a card and the comets wind UP to 240°/s over
  // about half a second rather than snapping to it, take your pointer away
  // and they coast down to a stop instead of freezing. A spring on the
  // angle would give an ease, not a flywheel.
  //
  // Registered once, on document, and keyed off nothing but the DOM — so
  // it survives every innerHTML repaint without re-binding, and a card
  // destroyed mid-coast is dropped by the isConnected check.
  // ============================================================
  var BEAM_SEL = '.pm-card,.pm-tile,.pm-prompt,.pm-step,.pm-cnote,.pm-slab,.pm-row,.pm-filters';
  var BEAM_PARKED = 40;      // matches the CSS resting angle exactly
  var BEAM_HOVER = 240;      // deg/s, the component's own hover speed
  var BEAM_K = 30, BEAM_D = 11;

  function Spring(value, k, d) { this.x = value; this.v = 0; this.target = value; this.k = k; this.d = d; }
  Spring.prototype.step = function (dt) {
    var a = this.k * (this.target - this.x) - this.d * this.v;
    this.v += a * dt; this.x += this.v * dt;
    return this.x;
  };

  function beamFrame(now) {
    var dt = beamLast ? Math.min(0.05, Math.max(0, (now - beamLast) / 1000)) : 0;
    beamLast = now;
    beams.forEach(function (b, el) {
      if (!el.isConnected) { beams.delete(el); return; }
      var speed = b.spring.step(dt);
      b.angle = (b.angle + speed * dt) % 360;
      el.style.setProperty('--pm-beam-a', b.angle.toFixed(2) + 'deg');
      // Come to rest, then hand the card back to the CSS resting state.
      // The angle it stopped at is kept: the original seeds every panel to
      // a different phase, and a grid where the cards you have touched sit
      // at their own angles is that, earned rather than declared.
      if (b.spring.target === 0 && speed < 2 && Math.abs(b.spring.v) < 2) beams.delete(el);
    });
    beamRaf = beams.size ? requestAnimationFrame(beamFrame) : 0;
    if (!beamRaf) beamLast = 0;
  }
  function beamRun() { if (!beamRaf) { beamLast = 0; beamRaf = requestAnimationFrame(beamFrame); } }

  function beamSurge(el) {
    if (mqMotion.matches) return;
    var b = beams.get(el);
    if (!b) {
      // Reads the angle it was left at, so a card re-entered mid-coast
      // picks the lap up where it was rather than jumping back to parked.
      var cur = parseFloat(el.style.getPropertyValue('--pm-beam-a')) || BEAM_PARKED;
      b = { angle: cur, spring: new Spring(0, BEAM_K, BEAM_D) };
      beams.set(el, b);
    }
    b.spring.target = BEAM_HOVER;

  function beamSettle(el) {
    var b = beams.get(el);
    if (b) { b.spring.target = 0; beamRun(); }
  }
  function beamHost(t) { return (t && t.closest) ? t.closest(BEAM_SEL) : null; }
  function beamEdge(e, fn) {
    var el = beamHost(e.target);
    // relatedTarget inside the same card is a move BETWEEN its children,
    // not a crossing of its boundary.
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;

  }

  document.addEventListener('mouseout',  function (e) { beamEdge(e, beamSettle); });
  document.addEventListener('focusin',   function (e) { beamEdge(e, beamSurge); });
  document.addEventListener('focusout',  function (e) { beamEdge(e, beamSettle); });

  // ============================================================
  // §PARALLAX — the house technique: ONE rAF-throttled scroll handler that
  // writes a single number, and every visual expressed in CSS off it.
  //
  // --p is written on documentElement rather than on .pm-head (as vault.html
  // does) because layer 1 is the video, which lives outside #pmApp and so
  // cannot inherit from the header.
  // ============================================================
  var parPx = 1;
  function measurePar() {
    var head = document.querySelector('.pm-view.is-on .pm-head');
    parPx = head ? Math.max(1, head.offsetHeight) : Math.round(window.innerHeight * 0.6);
    var root = document.documentElement;
    root.style.setProperty('--pm-par-px', parPx + 'px');
    root.classList.toggle('pm-par', !!head && !mqMotion.matches);
    onParScroll();
  }
  var parQueued = false;
  function onParScroll() {
    if (parQueued) return;
    parQueued = true;
    requestAnimationFrame(function () {
      parQueued = false;
      if (mqMotion.matches) { document.documentElement.style.setProperty('--p', '0'); return; }
      var p = Math.min(1, Math.max(0, (window.scrollY || 0) / parPx));
      document.documentElement.style.setProperty('--p', p.toFixed(4));

  window.addEventListener('scroll', onParScroll, { passive: true });
  window.addEventListener('resize', measurePar);
  if (mqMotion.addEventListener) mqMotion.addEventListener('change', measurePar);

  // ============================================================
  // §BACK — history back, with a depth counter because there is no API for
  // "is there a previous entry".
  // ============================================================
  var histDepth = 0, histBooted = false;
  function stampDepth() {
    if (!histBooted) {
      histBooted = true; histDepth = 0;
      try { history.replaceState({ d: 0 }, ''); } catch (e) {}
      return;
    }
    var cur = (history.state && typeof history.state.d === 'number') ? history.state.d : null;
    if (cur === null) { histDepth += 1; try { history.replaceState({ d: histDepth }, ''); } catch (e) {} }
    else { histDepth = cur; }   // went back/forward into an entry already stamped
  }
  function cameFromThisSite() {
    try {
      var u = new URL(document.referrer);
      return u.origin === location.origin && u.pathname !== location.pathname;
    } catch (e) { return false; }
  }
  function updateBack() {
    var b = $('pmBack');
    if (!b) return;
    // Hidden only where there genuinely is nothing behind you: the Overview
    // of a fresh tab that was not opened from another page of the dashboard.
    b.hidden = (histDepth === 0 && S.route.name === 'home' && !cameFromThisSite());
  }

  // ============================================================
  // §ROUTER — real hash routes, so Back works.
  //   #/            overview          #/flows        chains
  //   #/library     everything        #/flow/<id>    one chain
  //   #/c/<id>      one collection    #/tags         purpose tags
  //   #/pinned      favourites        #/settings     settings
  //   #/inbox       quick capture
  // ============================================================
  var S = { route: { name: 'home' } };

  function parseHash() {
    var raw = String(location.hash || '').replace(/^#/, '');
    if (!raw || raw === '/') return { name: 'home' };
    var p = raw.replace(/^\//, '').split('/');
    if (p[0] === 'library')  return { name: 'library' };
    if (p[0] === 'pinned')   return { name: 'pinned' };
    if (p[0] === 'inbox')    return { name: 'inbox' };
    if (p[0] === 'flows')    return { name: 'flows' };
    if (p[0] === 'tags')     return { name: 'tags' };
    if (p[0] === 'settings') return { name: 'settings' };
    if (p[0] === 'c' && p[1])    return { name: 'collection', id: p[1] };
    if (p[0] === 'flow' && p[1]) return { name: 'flow', id: p[1] };
    return { name: 'home' };
  }
  function go(hash) { if (hash) location.hash = hash; }

  var VIEW_OF = {
    home: 'pmViewHome', library: 'pmViewLibrary', collection: 'pmViewLibrary',
    pinned: 'pmViewLibrary', inbox: 'pmViewLibrary', flows: 'pmViewFlows',
    flow: 'pmViewFlow', tags: 'pmViewTags', settings: 'pmViewSettings'
  };
  function showView(name) {
    var want = VIEW_OF[name] || 'pmViewHome';
    ['pmViewHome', 'pmViewLibrary', 'pmViewFlows', 'pmViewFlow', 'pmViewTags', 'pmViewSettings']
      .forEach(function (id) { var el = $(id); if (el) el.classList.toggle('is-on', id === want); });
    return $(want);
  }

  var lastSection = null;
  function render() {
    // Navigation always wins over the edit lock: commit the buffer and go.
    flushRich();
    stampDepth();
    S.route = parseHash();
    var host = showView(S.route.name);
    if (!host) return;
    /* Structured filters persist across sections — they are badged and
       visible, and carrying them is the point. A free-text search is not:
       arriving at Favorites still filtered by something you typed in the
       library reads as "Favorites is empty", which is a lie. */
    var section = S.route.name + (S.route.id ? ':' + S.route.id : '');
    if (lastSection !== null && lastSection !== section) pmUi.q = '';
    lastSection = section;
    D().setUiState({ lastRoute: location.hash || '#/' });
    switch (S.route.name) {
      case 'library': case 'collection': case 'pinned': case 'inbox': renderLibraryView(host); break;
      case 'flows':    renderFlowsView(host); break;
      case 'flow':     renderFlowView(host); break;
      case 'tags':     renderTagsView(host); break;
      case 'settings': renderSettingsView(host); break;
      default:         renderHomeView(host);
    }
    renderRail();
    updateBack();
    window.scrollTo({ top: 0, behavior: 'auto' });
    measurePar();          // the header was just rebuilt — re-read its height
  }
  /* A cloud apply or a background save must repaint in place — scrolling
     to the top belongs to NAVIGATION only. Bouncing the page to the top
     mid-edit is exactly the bug this split exists to prevent. */
  function refreshCurrentView() {
    /* A rich editor is the only thing on this page holding unsaved state in
       the DOM. Repainting under it destroys the buffer, the caret and any IME
       composition — and cloud sync fires this at times nobody chose. So defer
       to the editor's blur. document.contains() is the self-heal: a lock left
       behind by a node removed without a blur is simply ignored. */
    if (viewIsBeingEdited()) { refreshPending = true; return; }
    refreshPending = false;
    var host = showView(S.route.name);
    if (!host) return;
    var y = window.scrollY;
    switch (S.route.name) {
      case 'library': case 'collection': case 'pinned': case 'inbox': renderLibraryView(host); break;
      case 'flows':    renderFlowsView(host); break;
      case 'flow':     renderFlowView(host); break;
      case 'tags':     renderTagsView(host); break;
      case 'settings': renderSettingsView(host); break;
      default:         renderHomeView(host);
    }
    renderRail();
    updateBack();
    window.scrollTo(0, y);
    measurePar();
  }

  // ============================================================
  // §RAIL
  // ============================================================
  function setRailFolded(folded) {
    $('pmRail').classList.toggle('is-folded', folded);
    document.body.classList.toggle('pm-rail-folded', folded);
    D().setUiState({ railFolded: !!folded });
  }
  function renderRail() {
    var d = D(), r = S.route, inbox = d.inboxCount();
    var items = [
      { ico: '◆', label: 'Overview',        hash: '/',         on: r.name === 'home' },
      { ico: '🔍', label: 'Prompt Library',  hash: '/library',  on: r.name === 'library' },
      { ico: '★', label: 'Favorites & Pinned', hash: '/pinned', on: r.name === 'pinned', accent: true },
      { ico: '📥', label: 'Quick Capture Inbox', hash: '/inbox', on: r.name === 'inbox', badge: inbox },
      { sep: true }
    ];
    d.collectionList().forEach(function (c) {
      items.push({ ico: c.icon, label: c.label, hash: '/c/' + c.id, on: r.name === 'collection' && r.id === c.id });
    });
    items.push({ sep: true });
    items.push({ ico: '⛓', label: 'Prompt Chains', hash: '/flows', on: r.name === 'flows' || r.name === 'flow' });
    items.push({ ico: '🏷️', label: 'Purpose Tags', hash: '/tags', on: r.name === 'tags' });
    items.push({ ico: '⚙', label: 'Settings',     hash: '/settings', on: r.name === 'settings' });
    items.push({ sep: true });
    items.push({ ico: '＋', label: 'Quick prompt', act: 'capture', accent: true });
    items.push({ ico: '⟨', label: 'Hide this rail', act: 'fold' });

    $('pmRail').innerHTML =
      '<span class="pm-rail-brand" title="Promptarium">⚗</span>' +
      items.map(function (i) {
        if (i.sep) return '<span class="pm-rail-sep"></span>';
        var attr = i.act ? ' data-act="' + i.act + '"' : ' data-hash="' + esc(i.hash) + '"';
        return '<button type="button" class="pm-rail-btn' + (i.on ? ' is-on' : '') + (i.accent ? ' is-accent' : '') + '"' + attr +
          ' aria-label="' + esc(i.label) + '">' +
          '<span aria-hidden="true">' + esc(i.ico) + '</span>' +
          (i.badge ? '<span class="pm-rail-badge">' + i.badge + '</span>' : '') +
          '<span class="pm-rail-tip">' + esc(i.label) + '</span>' +
        '</button>';
      }).join('');
  }

  // ============================================================
  // §HEAD — the shared page header: giant display serif over a
  // translucent orb, with a clipped accent twin so the words recolour
  // where they cross the light; corner meta; pill actions; and a ticker
  // of the collections along the bottom edge.
  // ============================================================
  // Both blocks now stack in the header's right-hand column, so both read
  // text-then-icon; `side` survives only as a class hook. Returns '' rather
  // than a placeholder span, which in a flex row would open a gap.
  function metaHTML(m, side) {
    if (!m) return '';
    // No pm-par-4 here — .pm-head-side carries it, and nesting the layer
    // class would apply the translate twice.
    return '<div class="pm-head-meta is-' + side + '">' +
      '<div><b>' + esc(m.title) + '</b>' + esc(m.text) + '</div>' +
      '<span class="pm-head-meta-ico" aria-hidden="true">' + esc(m.ico) + '</span>' +
    '</div>';
  }
  function tickerHTML() {
    var d = D(), all = pvAll();
    var items = d.collectionList().map(function (c) {
      var n = all.filter(function (p) { return p.collection === c.id; }).length;
      return '<a class="pm-ticker-item" href="#/c/' + esc(c.id) + '">' + esc(c.icon) + ' ' + esc(c.label) +
             ' <span class="pm-ticker-n">' + n + '</span></a>';
    }).join('');
    // Doubled: the -50% keyframe makes a seamless loop only if the track
    // holds exactly two copies of the same run.
    return '<div class="pm-head-ticker"><div class="pm-ticker-track">' + items + items + '</div></div>';
  }
  /* Layer classes map onto the reference component's four rates:
       1 (.70) the footage, on #pmStageVid — the deep plate
       2 (.55) — was the orb; unoccupied (see the §PARALLAX comment)
       3 (.40) eyebrow + title — the word-mark
       4 (.10) subtitle, CTA and the meta column — nearly pinned, fading out
     The title's sheen is a background-clip gradient on the element itself,
     not a second positioned copy, so there is nothing left here that could
     lose registration with its parent. */
  function headHTML(o) {
    return '<header class="pm-head">' +
      '<div class="pm-head-grid">' +
        '<div class="pm-head-center">' +
          (o.eyebrow ? '<span class="pm-head-eyebrow pm-par-3">' + esc(o.eyebrow) + '</span>' : '') +
          '<h1 class="pm-head-title pm-par-3">' + esc(o.title) + '</h1>' +
          (o.sub ? '<p class="pm-head-sub pm-par-4">' + esc(o.sub) + '</p>' : '') +
          (o.cta ? '<div class="pm-head-cta pm-par-4">' + o.cta + '</div>' : '') +
        '</div>' +
        (o.left || o.right
          ? '<div class="pm-head-side pm-par-4">' + metaHTML(o.left, 'left') + metaHTML(o.right, 'right') + '</div>'
          : '') +
      '</div>' +
      (o.ticker === false ? '' : tickerHTML()) +
    '</header>';
  }

  // ============================================================
  // §MODAL + declarative fields
  // ============================================================
  var modalCtx = null;

  /* §DRAFT · modals. Every [data-f] field lives only in the DOM until
     onSave runs, so a modal is the second surface with nothing behind it.
     Opt-in via cfg.draftId: the modals that carry TYPED text get one, and
     pure pickers (openBulkFile) do not, so nothing accumulates a draft that
     could never be worth restoring.

     The id must identify the RECORD, not the modal shape — 'prompt:<uid>',
     never 'prompt' — or an abandoned edit of one prompt would restore
     itself into the next prompt you opened. */
  function modalDraftFields() {
    var body = $('pmModalBody');
    if (!body) return {};
    var out = {};
    body.querySelectorAll('[data-f]').forEach(function (el) { out[el.dataset.f] = el.value; });
    return out;
  }
  function modalDraftSave() {
    // modalCtx is read here, at call time, not captured: the delegated
    // listener that calls this is registered once and outlives every modal
    // it will ever fire for (see the note on `on`).
    if (modalCtx && modalCtx.draftId) draftSet(modalCtx.draftId, modalDraftFields());
  }
  function modalDraftDrop() {
    clearTimeout(draftTimer); draftTimer = null; draftPending = null;
    if (modalCtx && modalCtx.draftId) draftClear(modalCtx.draftId);
  }

  function openModal(cfg) {
    modalCtx = cfg;
    var draft = cfg.draftId ? draftGet(cfg.draftId) : null;
    var m = $('pmModal');
    m.classList.toggle('is-wide', !!cfg.wide);
    m.innerHTML =
      '<div class="pm-modal-head">' +
        '<h2 class="pm-modal-title">' + esc(cfg.title) + '</h2>' +
        '<button type="button" class="pm-btn pm-btn-icon" data-mclose="1" aria-label="Close">✕</button>' +
      '</div>' +
      (draft ? draftNoticeHTML(draft.at) : '') +
      '<div id="pmModalBody">' + cfg.body + '</div>' +
      '<div class="pm-modal-foot">' +
        (cfg.onDelete ? '<button type="button" class="pm-btn pm-btn-sm pm-btn-danger" data-mdelete="1">Delete</button>' : '') +
        '<span class="pm-spacer"></span>' +
        '<button type="button" class="pm-btn pm-btn-sm" data-mclose="1">Cancel</button>' +
        '<button type="button" class="pm-btn pm-btn-sm pm-btn-primary" data-msave="1">' + esc(cfg.saveLabel || 'Save') + '</button>' +
      '</div>';
    $('pmModalBg').classList.add('show');
    if (cfg.onMount) cfg.onMount(m);
    // AFTER onMount: wireFields paints the icon/tag/star pickers from the
    // hidden inputs' values, so the draft has to be in those inputs before
    // it runs, and the pickers then have to be repainted to match.
    if (draft) applyModalDraft(m, draft.fields);
    var first = m.querySelector('[data-f]');
    if (first) setTimeout(function () { first.focus(); }, 30);
  }
  /* Closing keeps the draft — same reasoning as closeCapture. */
  function closeModal() { draftFlushNow(); $('pmModalBg').classList.remove('show'); modalCtx = null; }

  function fieldText(label, key, val, ph) {
    return '<div class="pm-field"><label class="pm-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<input class="pm-input" id="f_' + key + '" data-f="' + key + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"></div>';
  }
  function fieldArea(label, key, val, ph, rows) {
    return '<div class="pm-field"><label class="pm-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<textarea class="pm-textarea" id="f_' + key + '" data-f="' + key + '" rows="' + (rows || 6) + '" placeholder="' + esc(ph || '') + '">' + esc(val || '') + '</textarea></div>';
  }
  function fieldSelect(label, key, val, opts) {
    return '<div class="pm-field"><label class="pm-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<select class="pm-select" id="f_' + key + '" data-f="' + key + '">' +
      opts.map(function (o) {
        return '<option value="' + esc(o.id) + '"' + (o.id === val ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('') + '</select></div>';
  }
  function fieldIcon(label, key, val) {
    return '<div class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<input type="hidden" data-f="' + key + '" value="' + esc(val || '✦') + '">' +
      '<div class="pm-chip-row" data-iconset="' + key + '">' +
      D().ICON_SET.map(function (i) {
        return '<button type="button" class="pm-chip' + (i === val ? ' is-on' : '') + '" data-ico="' + esc(i) + '">' + esc(i) + '</button>';
      }).join('') + '</div></div>';
  }
  /* The purpose-tag picker: multi-select chips over the user's own
     vocabulary, plus inline create so a new purpose never costs a trip to
     another page. Stores ids, never labels. */
  function fieldTags(label, key, selected) {
    var tags = D().PurposeTags.list().sort(D().byOrder);
    return '<div class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<input type="hidden" data-f="' + key + '" value="' + esc((selected || []).join(',')) + '">' +
      '<div class="pm-chip-row" data-tagpick="' + key + '">' +
        tags.map(function (t) {
          var on = (selected || []).indexOf(t.id) >= 0;
          return '<button type="button" class="pm-tag c-' + esc(t.color) + (on ? '' : ' is-off') + '" data-tid="' + esc(t.id) + '">' +
            (on ? '✓ ' : '') + esc(t.label) + '</button>';
        }).join('') +
        '<button type="button" class="pm-chip" data-newtag="1">＋ New purpose</button>' +
      '</div></div>';
  }
  function fieldStars(label, key, val) {
    return '<div class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<input type="hidden" data-f="' + key + '" value="' + (Number(val) || 0) + '">' +
      '<span class="pm-rate" data-starpick="' + key + '">' +
        [1, 2, 3, 4, 5].map(function (n) {
          return '<button type="button" class="pm-rate-s' + (n <= (val || 0) ? ' is-on' : '') + '" data-star="' + n + '" aria-label="' + n + ' stars">★</button>';
        }).join('') +
        '<button type="button" class="pm-note-btn" data-star="0" style="margin-left:6px">clear</button>' +
      '</span></div>';
  }
  /* These three pickers write to HIDDEN inputs, which fire no `input`
     event — so the delegated draft listener in §BOOT never sees them and
     each has to schedule the write itself. Miss one and a restored draft
     silently comes back without its icon, its tags or its rating. */
  function wireFields(root) {
    on(root, '[data-iconset] [data-ico]', 'click', function () {
      var wrap = this.closest('[data-iconset]');
      wrap.parentNode.querySelector('[data-f]').value = this.dataset.ico;
      wrap.querySelectorAll('[data-ico]').forEach(function (b) { b.classList.toggle('is-on', b === this); }, this);
      draftSchedule(modalDraftSave);
    });
    on(root, '[data-tagpick] [data-tid]', 'click', function () {
      var wrap = this.closest('[data-tagpick]');
      var input = wrap.parentNode.querySelector('[data-f]');
      var cur = input.value ? input.value.split(',').filter(Boolean) : [];
      var id = this.dataset.tid, i = cur.indexOf(id);
      if (i >= 0) cur.splice(i, 1); else cur.push(id);
      input.value = cur.join(',');
      var t = D().purposeTagById(id);
      this.classList.toggle('is-off', i >= 0);
      this.textContent = (i >= 0 ? '' : '✓ ') + (t ? t.label : '');
      draftSchedule(modalDraftSave);
    });
    on(root, '[data-newtag]', 'click', function () {
      var label = window.prompt('Name the new purpose tag');
      if (!label || !label.trim()) return;
      var d = D();
      var t = d.PurposeTags.add({ label: label.trim(), color: d.TAG_COLORS[d.PurposeTags.list().length % d.TAG_COLORS.length], order: d.nextOrder(d.PurposeTags.list()) });
      var wrap = this.closest('[data-tagpick]');
      var input = wrap.parentNode.querySelector('[data-f]');
      var cur = input.value ? input.value.split(',').filter(Boolean) : [];
      cur.push(t.id); input.value = cur.join(',');
      this.insertAdjacentHTML('beforebegin', '<button type="button" class="pm-tag c-' + esc(t.color) + '" data-tid="' + esc(t.id) + '">✓ ' + esc(t.label) + '</button>');
      draftSchedule(modalDraftSave);
    });
    on(root, '[data-starpick] [data-star]', 'click', function () {
      var wrap = this.closest('[data-starpick]');
      var n = Number(this.dataset.star);
      wrap.parentNode.querySelector('[data-f]').value = n;
      wrap.querySelectorAll('.pm-rate-s').forEach(function (b) {
        b.classList.toggle('is-on', Number(b.dataset.star) <= n);
      });
      draftSchedule(modalDraftSave);
    });
  }
  function readFields(root) {
    var out = {};
    root.querySelectorAll('[data-f]').forEach(function (el) { out[el.dataset.f] = el.value; });
    return out;
  }

  /* Puts a restored draft back into a mounted modal. Three of the field
     types — icon, purpose tags, stars — keep their value in a HIDDEN input
     and their appearance in a row of chips, so writing the input alone
     would restore the value while the chips went on showing the record's.
     Each of the three is repainted from the input it belongs to. */
  function applyModalDraft(root, fields) {
    if (!fields) return;
    root.querySelectorAll('[data-f]').forEach(function (el) {
      var k = el.dataset.f;
      if (Object.prototype.hasOwnProperty.call(fields, k)) el.value = fields[k];
    });
    root.querySelectorAll('[data-iconset]').forEach(function (wrap) {
      var input = wrap.parentNode.querySelector('[data-f]');
      if (!input) return;
      wrap.querySelectorAll('[data-ico]').forEach(function (b) {
        b.classList.toggle('is-on', b.dataset.ico === input.value);
      });
    });
    root.querySelectorAll('[data-tagpick]').forEach(function (wrap) {
      var input = wrap.parentNode.querySelector('[data-f]');
      if (!input) return;
      var cur = input.value ? input.value.split(',').filter(Boolean) : [];
      wrap.querySelectorAll('[data-tid]').forEach(function (b) {
        var on = cur.indexOf(b.dataset.tid) >= 0;
        var t = D().purposeTagById(b.dataset.tid);
        b.classList.toggle('is-off', !on);
        b.textContent = (on ? '✓ ' : '') + (t ? t.label : '');
      });
    });
    root.querySelectorAll('[data-starpick]').forEach(function (wrap) {
      var input = wrap.parentNode.querySelector('[data-f]');
      if (!input) return;
      var n = Number(input.value) || 0;
      wrap.querySelectorAll('.pm-rate-s').forEach(function (b) {
        b.classList.toggle('is-on', Number(b.dataset.star) <= n);
      });
    });
    root.querySelectorAll('textarea[data-f]').forEach(autosize);
  }
  function splitCsv(s) { return String(s || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }

  // ============================================================
  // §LIBRARY — filters, sorts and the prompt card.
  //
  // pmUi is module-level, not stored per render, so a filter survives the
  // re-render that answering it causes. It is mirrored into prm:uiState so
  // the page reopens where you left it.
  // ============================================================
  var pmUi = {
    q: '', category: 'all', status: 'all', purpose: 'all', tag: 'all', creator: 'all',
    rating: 0, dateField: 'createdAt', dateRange: 'all', sort: 'newest',
    openId: '', showFilters: false
  };
  var varVals = {};   // uid -> {VAR: value}, session-only: filling a variable is not a document edit

  (function restoreUi() {
    try {
      var saved = (D() && D().getUiState().filters) || null;
      if (saved) for (var k in saved) if (k in pmUi) pmUi[k] = saved[k];
    } catch (e) {}
  })();
  function saveUi() { try { D().setUiState({ filters: pmUi }); } catch (e) {} }

  function highlightVars(text) {
    return esc(text).replace(/\{\{\s*([A-Z0-9_ -]+?)\s*\}\}/g, '<b>{{$1}}</b>');
  }
  function statusMeta(id) {
    var all = D().PRM_STATUSES;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return { id: id || 'draft', label: id || 'Draft', tone: 'mute' };
  }
  function categoryLabel(id) {
    var all = D().PRM_CATEGORIES;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].label;
    // A fiction prompt carries the Codex's own category vocabulary. Rather
    // than force it into this page's list, show it as it is — the filter
    // offers the union of both.
    return id ? (String(id).charAt(0).toUpperCase() + String(id).slice(1)) : 'Other';
  }
  function creatorLabel(id) {
    var all = D().PRM_CREATORS;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].label;
    return id || 'Me';
  }
  function withinRange(iso, range) {
    if (range === 'all' || !iso) return true;
    var t = new Date(iso).getTime();
    if (isNaN(t)) return true;
    var days = { week: 7, month: 30, quarter: 91, year: 365 }[range];
    if (!days) return true;
    return (Date.now() - t) <= days * 86400000;
  }

  /* ctx: {mode:'library'|'collection'|'pinned'|'inbox', collection:<id>} */
  function scopeOf(ctx) {
    var all = pvAll();
    if (ctx.mode === 'collection') return all.filter(function (p) { return p.collection === ctx.collection; });
    if (ctx.mode === 'inbox')      return all.filter(function (p) { return p.collection === 'inbox'; });
    if (ctx.mode === 'pinned')     return all.filter(function (p) { return p.pinned || p.rating >= 4; });
    if (!D().getSettings().showFictionInLibrary) return all.filter(function (p) { return p.src !== 'cdx'; });
    return all;
  }
  function applyFilters(list) {
    var q = pmUi.q.trim().toLowerCase();
    return list.filter(function (p) {
      if (pmUi.category !== 'all' && p.category !== pmUi.category) return false;
      if (pmUi.status !== 'all' && p.status !== pmUi.status) return false;
      if (pmUi.creator !== 'all' && p.creator !== pmUi.creator) return false;
      if (pmUi.purpose !== 'all' && (p.purposeTags || []).indexOf(pmUi.purpose) < 0) return false;

  /* AUTOSAVE for the inline fields.
     These used to commit on blur and on nothing else, which meant a note you
     typed for ten minutes without clicking away existed only in the DOM: a
     reload, a crash or a cloud repaint took all ten minutes with it. §FLUSH
     catches the reload, but only if the browser lets its IndexedDB write
     commit during teardown — which is not guaranteed, and is the one thing
     no page-level code can force.

     the same family as the rich editor's 1200ms and for the same reason:
     every commit trips sync.js's schedulePush, which re-serialises the whole

    // while this field held focus runs now that it does not.

  // §PROMPT MODAL

  function openPromptModal(uid, ctx) {

       not here — that is what a shared collection means. It is gated like
       every other cdx: write. */
    var intoFiction = isNew && ctx && ctx.mode === 'collection' && ctx.collection === 'fiction';
    if (intoFiction && !codexWritable()) { toast('The fiction library has not finished loading', true); return; }

    var defaultCollection = intoFiction ? 'fiction'
      : (ctx && ctx.mode === 'collection' && ctx.collection !== 'fiction') ? ctx.collection : 'inbox';
    var p = v || { title: '', icon: intoFiction ? '✒️' : '✦', text: '', category: intoFiction ? 'drafting' : 'task',
                   tags: [], purposeTags: [], modelHint: '', creator: 'me', sourceUrl: '',
                   status: 'draft', rating: 0, collection: defaultCollection };

    // A cdx: record carries the Codex's own category vocabulary, so offer
    // that list for anything that lives there rather than forcing this
    // page's categories onto the Codex's data.
    var onCodex = intoFiction || (v && v.src === 'cdx');
    var catOpts = (onCodex && C() && C().PROMPT_CATEGORIES) ? C().PROMPT_CATEGORIES : d.PRM_CATEGORIES;

    var colOpts = [{ id: 'inbox', label: 'Unsorted (inbox)' }].concat(
      d.collectionList().filter(function (c) { return c.source !== 'codex'; })
       .map(function (c) { return { id: c.id, label: c.label }; }));
    // A fiction prompt cannot be moved out of the Codex's store by changing
    // a select, and a native prompt cannot be moved into it — that would be
    // a cross-store migration, not an edit. The field is pinned for both.
    var lockCollection = !isNew || intoFiction;

    openModal({
      title: isNew ? 'New prompt' : 'Edit prompt',
      // Keyed to the RECORD. An abandoned edit of one prompt must never
      // reappear inside the next prompt you open; a new prompt is keyed by
      // where it is going instead, since it has no id yet.
      draftId: isNew ? ('prompt:new:' + defaultCollection) : ('prompt:' + uid),
      wide: true,
      body:
        '<div class="pm-field-row">' + fieldText('Title', 'title', p.title, 'What it does, in your words') +
          fieldSelect('Category', 'category', p.category, catOpts) + '</div>' +
        fieldArea('Prompt', 'text', p.text, 'Paste the prompt. Wrap anything you swap out in double braces, like {{SCENE}}, and it gets highlighted and a fill-in box.', 12) +
        (lockCollection
          ? '<div class="pm-field"><span class="pm-field-label">Collection</span>' +
            '<input type="hidden" data-f="collection" value="' + esc(p.collection) + '">' +
            '<p class="pm-field-hint">' + esc((d.collectionById(p.collection) || {}).label || 'Unsorted') +
            (intoFiction ? ' — this will be saved into the shared fiction database.'
                         : (v && v.src === 'cdx' ? ' — this prompt lives in the shared fiction database.' : '')) + '</p></div>'
          : fieldSelect('Collection', 'collection', p.collection, colOpts)) +
        '<div class="pm-field-row">' + fieldSelect('Status', 'status', p.status, d.PRM_STATUSES) +
          fieldSelect('Creator', 'creator', p.creator, d.PRM_CREATORS) + '</div>' +
        '<div class="pm-field-row">' + fieldText('Tags', 'tagsRaw', (p.tags || []).join(', '), 'comma, separated') +
          fieldText('Best with', 'modelHint', p.modelHint, 'e.g. a long-context model') + '</div>' +
        fieldTags('Purpose', 'purposeRaw', p.purposeTags) +
        '<div class="pm-field-row">' + fieldStars('Rating', 'rating', p.rating) +
          fieldText('Source', 'sourceUrl', p.sourceUrl, 'where it came from (optional)') + '</div>' +
        fieldIcon('Icon', 'icon', p.icon),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim()) { toast('Give the prompt a title', true); return false; }
        f.tags = splitCsv(f.tagsRaw); delete f.tagsRaw;
        f.purposeTags = splitCsv(f.purposeRaw); delete f.purposeRaw;
        f.rating = Number(f.rating) || 0;
        f.variables = d.detectVariables(f.text);
        f.updatedAt = d.nowISO();

        if (intoFiction) {
          // Split at the boundary: only the Codex's own sixteen fields go
          // into its record; everything this page adds goes to the sidecar.
          var meta = { rating: f.rating, purposeTags: f.purposeTags, creator: f.creator, sourceUrl: f.sourceUrl, status: f.status };
          var rec = {
            title: f.title, icon: f.icon, category: f.category, tags: f.tags, text: f.text,
            variables: f.variables, modelHint: f.modelHint, scope: 'global', scopeId: '',
            order: d.nextOrder(cdxPromptList())
          };
          if (!d.assertCodexFields(rec, 'new fiction prompt')) return false;
          var made = null;
          if (!codexWrite(function () { made = C().Prompts.add(rec); })) return false;
          if (made) { d.setFictionMeta(made.id, meta); pmUi.openId = 'cdx:' + made.id; }
          toast('Saved to the fiction library');
        } else if (isNew) {
          f.order = d.nextOrder(d.Prompts.list());
          var np = d.Prompts.add(f);
          pmUi.openId = 'prm:' + np.id;
          toast('Prompt saved');
        } else if (v.src === 'prm') {
          d.Prompts.update(v.id, f);
          toast('Saved');
        } else {
          // Fiction: pvPatch splits the sidecar fields out for us.
          delete f.collection; delete f.variables;
          if (!pvPatch(v.uid, f)) return false;
          toast('Saved to the fiction library');
        }
      },
      onDelete: isNew ? null : function () {
        if (!window.confirm('Delete this prompt and all of its notes?')) return false;
        pvRemove(v.uid);
        pmUi.openId = '';
        toast('Prompt deleted');
      }
    });
  }

  // ============================================================
  // §VIEW · THE MODEL PAGE'S ARTICLE AND NOTES DB
  //
  // Both live OUTSIDE #pmPdb, because repaintDb() wipes that on every
  // keystroke in the search box, every filter change and every star click.
  // Each has its own repaint so editing a note never rebuilds the header or
  // the prompt list.
  // ============================================================
  function renderArticle(host, cid) {
    var d = D(), a = d.articleFor(cid), col = d.collectionById(cid) || { label: cid };
    // Fiction is a domain, not a tool — "How to use Fiction" reads wrong.
    var titlePh = col.source === 'codex' ? 'Working with fiction prompts' : 'How to use ' + col.label;
    // Idempotent: if nothing changed since the last paint, leave the subtree
    // alone. Re-writing innerHTML would re-decode every pasted image on every
    // unrelated repaint.
    if (host.dataset.rev && host.dataset.rev === (a.updatedAt || 'empty')) return;
    host.dataset.rev = a.updatedAt || 'empty';

    host.innerHTML =
      '<article class="pm-art" data-art="' + esc(cid) + '">' +
        '<header class="pm-art-head">' +
          '<h2 class="pm-art-title" contenteditable="true" data-rich="art:' + esc(cid) + ':title" data-plain="1" ' +
            'data-ph="' + esc(titlePh) + '">' + esc(a.title) + '</h2>' +
          '<p class="pm-art-sub" contenteditable="true" data-rich="art:' + esc(cid) + ':subtitle" data-plain="1" ' +
            'data-ph="A one-line subtitle">' + esc(a.subtitle) + '</p>' +
          '<div class="pm-art-rule" aria-hidden="true"><span>✦</span></div>' +
        '</header>' +
        '<div class="pm-rte">' + rteBarHTML() +
          // The third key segment IS the model's field name — articleModel is
          // a whitelist, so a mismatch here is silently dropped on save.
          '<div class="pm-art-body pm-rich" contenteditable="true" data-rich="art:' + esc(cid) + ':bodyHtml" ' +
            'data-ph="Write the guide. Paste from anywhere — headings, lists, links and images all come with it.">' +
            a.bodyHtml +
          '</div>' +
        '</div>' +
        '<div class="pm-art-foot">' +
          '<button type="button" class="pm-btn pm-btn-sm" data-jumpnotes="1">Notes database ↓</button>' +
        '</div>' +
      '</article>';

    host.querySelectorAll('[data-rich]').forEach(markEmpty);
    host.querySelectorAll('.pm-rich a').forEach(function (el) {
      el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer');
    });
  }

  function wireCollectionContent(host) {
    var d = D();
    wireRich(host);
    on(host, '[data-jumpnotes]', 'click', function () {
      // A button, NOT href="#pmColNotes": this page is hash-routed, and
      // setting location.hash would make parseHash fall through to the
      // Overview and navigate away.
      var t = $('pmColNotes');
      if (t) t.scrollIntoView({ behavior: mqMotion.matches ? 'auto' : 'smooth', block: 'start' });
    });
    on(host, '[data-newcnote]', 'click', function () {
      var cid = S.route.id;
      d.CollectionNotes.add({ collectionId: cid, title: 'Note', bodyHtml: '', order: d.nextOrder(d.notesForCollection(cid)) });
      repaintColNotes();
    });
    // Autosaved and named, exactly like the note fields above.
    on(host, '.pm-cnote-title', 'input', function () { inlineAutosave(this); });
    on(host, '.pm-cnote-title', 'blur', function () { commitInlineNow(this); });
    on(host, '[data-cndel]', 'click', function () {
      if (!window.confirm('Delete this note?')) return;
      d.CollectionNotes.remove(this.dataset.cndel);
      repaintColNotes();
    });
    function moveNote(id, dir) {
      var sibs = d.notesForCollection(S.route.id);
      var i = -1;
      for (var k = 0; k < sibs.length; k++) if (sibs[k].id === id) { i = k; break; }
      var j = i + dir;
      if (i < 0 || j < 0 || j >= sibs.length) return;
      var ids = sibs.map(function (x) { return x.id; });
      ids.splice(j, 0, ids.splice(i, 1)[0]);
      d.reorderCollection(d.CollectionNotes, ids);
      repaintColNotes();
    }
    on(host, '[data-cnup]', 'click', function () { moveNote(this.dataset.cnup, -1); });
    on(host, '[data-cndown]', 'click', function () { moveNote(this.dataset.cndown, 1); });
  }

  function stepHTML(s, i, total) {

  /* Deterministic template composition from the step's own data — not a
     model call. It writes the checklist you would have written yourself
     and then never do. */
  function generateStepNote(s) {
    var d = D();
    var ref = pvResolveRef(s.promptRef);
    var text = ref ? ref.text : s.text;
    var vars = d.detectVariables(text);
    var col = s.model ? d.collectionById(s.model) : null;
    var steps = d.stepsForWorkflow(s.workflowId);
    var idx = steps.findIndex(function (x) { return x.id === s.id; });
    var next = idx >= 0 && idx + 1 < steps.length ? steps[idx + 1] : null;

    var body =
      'Run in: ' + (col ? col.label : 'any model') + '\n' +
      (vars.length ? 'Fill before running: ' + vars.join(', ') + '\n' : 'No variables to fill.\n') +
      (s.expectedOutput ? 'Should produce: ' + s.expectedOutput + '\n' : '') +
      (next ? 'Hands off to: ' + (idx + 2) + '. ' + next.title + '\n' : 'Last step in the chain.\n') +
      '\nBefore running:\n- [ ] Previous step’s output is pasted in\n' +
      vars.map(function (v) { return '- [ ] {{' + v + '}} filled'; }).join('\n') +
      (vars.length ? '\n' : '') +
      '\nAfter running:\n- [ ] Output actually matches what this step promised\n- [ ] Anything invented that I did not ask for, noted below\n' +
      '\nWhat went wrong last time:\n';

    d.StepNotes.add({ stepId: s.id, title: 'Run checklist', body: body, order: d.nextOrder(d.notesForStep(s.id)) });
  }

      headHTML({

        right: { ico: '▶', title: pct + '% run', text: done + ' of ' + steps.length + ' done' },

             '<button type="button" class="pm-btn" data-editflow="1">Edit chain</button>' +

          ? '<div id="pmStepList">' + steps.map(function (s, i) { return stepHTML(s, i, steps.length); }).join('') + '</div>'

      '</div>';

    /* Bound once per view element, so nothing here may use the `w` and
       `steps` captured above — they would be the first render's copies
       forever. Everything re-reads from the route and the store. */
    on(host, '[data-editflow]', 'click', function () { openFlowModal(S.route.id); });
    on(host, '[data-addstep]', 'click', function () { openStepModal(S.route.id, null); });
    on(host, '[data-stepedit]', 'click', function (e) { e.stopPropagation(); openStepModal(S.route.id, this.dataset.stepedit); });
    on(host, '[data-resetrun]', 'click', function () {
      d.stepsForWorkflow(S.route.id).forEach(function (s) { d.WorkflowSteps.update(s.id, { done: false }); });
      toast('Run reset'); refreshCurrentView();
    });
    on(host, '[data-copyall]', 'click', function () {
      var wf = d.Workflows.get(S.route.id); if (!wf) return;
      var md = '# ' + wf.title + '\n\n' + (wf.summary || '') + '\n\n' + d.stepsForWorkflow(wf.id).map(function (s, i) {
        var ref = pvResolveRef(s.promptRef);
        var col = s.model ? d.collectionById(s.model) : null;
        return '## ' + (i + 1) + '. ' + s.title + (col ? '  \n**Run in:** ' + col.label : '') +
          (s.expectedOutput ? '  \n**Produces:** ' + s.expectedOutput : '') +
          '\n\n```\n' + (ref ? ref.text : s.text) + '\n```';
      }).join('\n\n');
      copyText(md, this);
    });
    actAsButton(host, '.pm-step-head', function (e) {
      if (e.target.closest('[data-stepdone]') || e.target.closest('.pm-prompt-grip')) return;
      var id = this.closest('[data-step]').dataset.step;
      pmUi.openId = (pmUi.openId === 'step:' + id) ? '' : 'step:' + id;
      refreshCurrentView();
    });
    on(host, '[data-stepdone]', 'change', function (e) {
      e.stopPropagation();
      d.WorkflowSteps.update(this.dataset.stepdone, { done: this.checked });
      refreshCurrentView();
    });
    on(host, '[data-stepcopy]', 'click', function () {
      var s = d.WorkflowSteps.get(this.dataset.stepcopy); if (!s) return;
      var ref = pvResolveRef(s.promptRef);
      copyText(ref ? ref.text : s.text, this);
      if (ref) pvTouch(ref.uid);
    });
    on(host, '[data-stepfill]', 'click', function () {
      var s = d.WorkflowSteps.get(this.dataset.stepfill); if (!s) return;
      var ref = pvResolveRef(s.promptRef);
      copyText(d.fillVariables(ref ? ref.text : s.text, varVals['step:' + s.id] || {}), this);
    });
    on(host, '[data-varsof] [data-var]', 'input', function () {
      var key = this.closest('[data-varsof]').dataset.varsof;
      varVals[key] = varVals[key] || {};
      varVals[key][this.dataset.var] = this.value;
    });
    on(host, '[data-stepnote]', 'click', function () {
      d.StepNotes.add({ stepId: this.dataset.stepnote, title: 'Note', body: '', order: d.nextOrder(d.notesForStep(this.dataset.stepnote)) });
      refreshCurrentView();
    });
    on(host, '[data-gennote]', 'click', function () {
      var s = d.WorkflowSteps.get(this.dataset.gennote); if (!s) return;
      generateStepNote(s); toast('Checklist generated'); refreshCurrentView();
    });
    wireNotes(host, refreshCurrentView);

    var listHost = $('pmStepList');
    if (listHost && window.Sortable) {
      Sortable.create(listHost, {
        animation: 160, handle: '.pm-prompt-grip', draggable: '[data-step]', ghostClass: 'pm-sortable-ghost',
        onEnd: function () {
          var ids = Array.prototype.map.call(listHost.querySelectorAll('[data-step]'), function (n) { return n.dataset.step; });
          d.reorderCollection(d.WorkflowSteps, ids);
          refreshCurrentView();
        }
      });
    }
  }

  function openFlowModal(id) {
    var d = D(), w = id ? d.Workflows.get(id) : null, isNew = !w;
    if (isNew) w = { title: '', icon: '⛓', summary: '', purposeTags: [], status: 'draft' };
    openModal({
      title: isNew ? 'New chain' : 'Edit chain',
      draftId: isNew ? 'flow:new' : ('flow:' + id),
      wide: true,
      body:
        fieldText('Title', 'title', w.title, 'e.g. Idea → Finished Manuscript') +
        fieldArea('What this chain is for', 'summary', w.summary, 'One paragraph: when you would run it, and what you get at the end.', 4) +
        '<div class="pm-field-row">' + fieldSelect('Status', 'status', w.status, d.PRM_STATUSES) +
        fieldStars('Rating', 'rating', w.rating) + '</div>' +
        fieldTags('Purpose', 'purposeRaw', w.purposeTags) +
        fieldIcon('Icon', 'icon', w.icon),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim()) { toast('Give the chain a title', true); return false; }
        f.purposeTags = splitCsv(f.purposeRaw); delete f.purposeRaw;
        f.rating = Number(f.rating) || 0;
        f.updatedAt = d.nowISO();
        if (isNew) {
          f.order = d.nextOrder(d.Workflows.list());
          var nw = d.Workflows.add(f);
          toast('Chain created');
          setTimeout(function () { go('#/flow/' + nw.id); }, 60);
        } else { d.Workflows.update(id, f); toast('Saved'); }
      },
      onDelete: isNew ? null : function () {
        if (!window.confirm('Delete this chain, all of its steps and their notes?')) return false;
        d.removeWorkflow(id); toast('Chain deleted');
        setTimeout(function () { go('#/flows'); }, 60);
      }
    });
  }

  function openStepModal(workflowId, stepId) {
    var d = D(), s = stepId ? d.WorkflowSteps.get(stepId) : null, isNew = !s;
    if (isNew) s = { title: '', model: '', promptRef: '', text: '', expectedOutput: '' };
    var modelOpts = [{ id: '', label: 'Any model' }].concat(
      d.collectionList().map(function (c) { return { id: c.id, label: c.label }; }));
    var refOpts = [{ id: '', label: 'None — this step has its own text' }].concat(
      pvAll().sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); })
        .map(function (p) { return { id: p.uid, label: p.title + '  ·  ' + ((d.collectionById(p.collection) || {}).label || 'Unsorted') }; }));

    openModal({
      title: isNew ? 'New step' : 'Edit step',
      draftId: isNew ? ('step:new:' + workflowId) : ('step:' + stepId),
      wide: true,
      body:
        '<div class="pm-field-row">' + fieldText('Step title', 'title', s.title, 'What this step does') +
          fieldSelect('Run in', 'model', s.model, modelOpts) + '</div>' +
        fieldSelect('Link a library prompt', 'promptRef', s.promptRef, refOpts) +
        '<p class="pm-field-hint" style="margin:-10px 0 var(--sp-4)">Linking keeps the step in step with the prompt: improve the prompt, and this step improves with it. The text below stays as the fallback if the link ever stops resolving.</p>' +
        fieldArea('Step prompt', 'text', s.text, 'The sub-prompt for this step. Use {{VARIABLES}} for anything you swap out.', 10) +
        fieldText('What it should produce', 'expectedOutput', s.expectedOutput, 'The handoff to the next step'),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);

          f.workflowId = workflowId;
          f.order = d.nextOrder(d.stepsForWorkflow(workflowId));

      onDelete: isNew ? null : function () {

        d.removeStep(stepId); toast('Step deleted');
