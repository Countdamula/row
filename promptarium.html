      ' style="--hue:' + hue + '" aria-pressed="' + (ui.cat === id) + '">' + esc(label) +
      '<span class="pm-pill-count">' + count + '</span></button>';
  }
  function syncBarState() {
    var fav = $('pmFav');
    if (fav) {
      fav.classList.toggle('is-on', ui.favOnly);
      fav.setAttribute('aria-pressed', ui.favOnly ? 'true' : 'false');
    }
    var clear = $('pmQClear');
    if (clear) clear.hidden = !ui.q;
  }
  function renderBar(mode) {
    var bar = $('pmBar');
    if (!mode) { bar.hidden = true; return; }
    bar.hidden = false;
    if (barMode !== mode) buildBarControls(mode);
    renderPills(mode);
    syncBarState();
  }

  // ============================================================
  // §VIEWS
  // ============================================================
  function viewPromptsHome() {
    var host = $('pmView');
    var all = pvAll();

    if (!all.length) {
      host.innerHTML = emptyState(
        'No prompts yet',
        'Add the ones you already paste from somewhere else. A prompt needs a name, the text, and one word for what it is for.',
        '<button type="button" class="pm-btn pm-btn-primary" data-new="prompts">+ New prompt</button>');
      return;
    }

    // The collapse rule: a query is not browsing.
    if (isFiltering()) {
      var hits = filteredPrompts().sort(byUse);
      host.innerHTML = hits.length
        ? sectionHead(plural(hits.length, 'prompt'), describeFilter()) +
          '<div class="pm-grid">' + hits.map(promptCard).join('') + '</div>'
        : emptyState('Nothing matches', 'No prompt matches ' + describeFilter() + '. Try fewer words, or clear the filters.',
            '<button type="button" class="pm-btn" data-clearfilters="1">Clear filters</button>');
      return;
    }

    var html = '';

    /* Favourites first, because they are the answer nine times out of
       ten. Before anything is starred, the same slot shows what you have
       actually been copying — the page is useful on day two, not only
       once you have curated it. */
    var faves = all.filter(function (p) { return p.favorite; }).sort(byUse);
    var fallback = !faves.length;
    var top = fallback ? all.filter(function (p) { return p.useCount > 0; }).sort(byUse).slice(0, 6) : faves;
    if (top.length) {
      html += '<section class="pm-sec">' +
        sectionHead(fallback ? 'Most used' : 'Frequently used',
                    fallback ? 'Star one to pin it here' : '', !fallback) +
        '<div class="pm-grid">' + top.map(promptCard).join('') + '</div>' +
      '</section>';
    }

    var recent = all.slice().sort(byRecent).slice(0, 6);
    if (recent.length) {
      html += '<section class="pm-sec">' + sectionHead('Recent') +
        '<div class="pm-rows">' + recent.map(function (p) { return promptRow(p, false); }).join('') + '</div></section>';
    }

    var cols = D().collectionsOfKind('prompt');
    html += '<section class="pm-sec">' +
      sectionHead('Collections', cols.length ? 'A workflow, in order' : '') +
      (cols.length
        ? '<div class="pm-collections">' + cols.map(collectionCard).join('') +
          '</div><div class="pm-empty-acts" style="justify-content:flex-start;margin-top:var(--sp-3)">' +
          '<button type="button" class="pm-btn pm-btn-sm pm-btn-ghost" data-newcol="prompt">+ New collection</button></div>'
        : '<p class="pm-empty-line">Group prompts that run in order &mdash; draft, critique, rewrite &mdash; and open them one after another. ' +
          '<button type="button" class="pm-btn pm-btn-sm pm-btn-ghost" data-newcol="prompt">+ New collection</button></p>') +
    '</section>';

    var rest = all.slice().sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); });
    html += '<section class="pm-sec">' + sectionHead('All prompts', plural(rest.length, 'prompt')) +
      '<div class="pm-grid">' + rest.map(promptCard).join('') + '</div></section>';

    host.innerHTML = html;
  }

  function describeFilter() {
    var bits = [];
    if (ui.q.trim()) bits.push('"' + ui.q.trim() + '"');
    if (ui.cat !== 'all') bits.push(catLabel(ui.tab === 'tools' ? 'tool' : 'prompt', ui.cat));
    if (ui.favOnly) bits.push('favorites');
    return bits.join(' + ');
  }

  function viewToolsHome() {
    var host = $('pmView');
    var d = D();
    var all = d.Tools.list();

    if (!all.length) {
      host.innerHTML = emptyState(
        'No tools yet',
        'Add the sites you open every day. Or start from the ones already in your rotation and edit from there.',
        '<button type="button" class="pm-btn pm-btn-primary" data-new="tools">+ Add a tool</button>' +
        '<button type="button" class="pm-btn" data-starter="1">Add my usual tools</button>');
      return;
    }

    if (isFiltering()) {
      var hits = filteredTools().sort(byUse);
      host.innerHTML = hits.length
        ? sectionHead(plural(hits.length, 'tool'), describeFilter()) +
          '<div class="pm-rows">' + hits.map(toolRow).join('') + '</div>'
        : emptyState('Nothing matches', 'No tool matches ' + describeFilter() + '. Try fewer words, or clear the filters.',
            '<button type="button" class="pm-btn" data-clearfilters="1">Clear filters</button>');
      return;
    }

    var html = '';

    /* Quick Launch is the loudest thing on the page on purpose: four to
       eight tiles, one click, no scrolling. Everything below it is for
       the other days. */
    var quick = all.filter(function (t) { return t.quick && t.url; }).sort(d.byOrder).slice(0, 8);
    if (quick.length) {
      html += '<section class="pm-sec">' + sectionHead('Quick launch') +
        '<div class="pm-quicks">' + quick.map(quickTile).join('') + '</div></section>';
    }

    var faves = all.filter(function (t) { return t.favorite; }).sort(byUse);
    if (faves.length) {
      html += '<section class="pm-sec">' + sectionHead('Favorites', '', true) +
        '<div class="pm-rows">' + faves.map(toolRow).join('') + '</div></section>';
    }

    var recent = all.filter(function (t) { return t.lastOpenedAt; })
      .sort(function (a, b) { return String(b.lastOpenedAt).localeCompare(String(a.lastOpenedAt)); }).slice(0, 5);
    if (recent.length) {
      html += '<section class="pm-sec">' + sectionHead('Recently opened') +
        '<div class="pm-rows">' + recent.map(toolRow).join('') + '</div></section>';
    }

    var stacks = d.collectionsOfKind('tool');
    html += '<section class="pm-sec">' +
      sectionHead('Stacks', stacks.length ? 'The tools one workflow needs' : '') +
      (stacks.length
        ? '<div class="pm-collections">' + stacks.map(collectionCard).join('') +
          '</div><div class="pm-empty-acts" style="justify-content:flex-start;margin-top:var(--sp-3)">' +
          '<button type="button" class="pm-btn pm-btn-sm pm-btn-ghost" data-newcol="tool">+ New stack</button></div>'
        : '<p class="pm-empty-line">Group the tools one job needs &mdash; Obsidian, Claude, Docs &mdash; so you open the set rather than hunting each one. ' +
          '<button type="button" class="pm-btn pm-btn-sm pm-btn-ghost" data-newcol="tool">+ New stack</button></p>') +
    '</section>';

    var rest = all.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    html += '<section class="pm-sec">' + sectionHead('All tools', plural(rest.length, 'tool')) +
      '<div class="pm-rows">' + rest.map(toolRow).join('') + '</div></section>';

    host.innerHTML = html;
  }

  // ============================================================
  // §DETAIL VIEWS
  // ============================================================
  function markVars(text) {
    // esc() first, then wrap — wrapping first would have the escaper eat
    // the markup it just produced.
    return esc(text).replace(/\{\{\s*([A-Z0-9_ -]+?)\s*\}\}/g, function (whole) {
      return '<mark>' + whole + '</mark>';
    });
  }

  function viewPrompt(uid) {
    var host = $('pmView');
    var p = pvGet(uid);
    if (!p) {
      host.innerHTML = emptyState('That prompt is gone',
        'It was deleted, or it lives in the fiction library and has not loaded on this device yet.',
        '<button type="button" class="pm-btn" data-go="#/">Back to prompts</button>');
      return;
    }
    var hue = hueOf('prompt', p.category);
    var vars = D().detectVariables(p.text);
    var reason = p.fiction && !p.editable ? gateReason() : '';

    var html = '<div class="pm-detail" style="--hue:' + hue + '">' +
      '<h1 class="pm-detail-title">' + esc(p.title) + '</h1>' +
      '<p class="pm-detail-meta"><span class="pm-dot"></span>' +
        esc(catLabel('prompt', p.category)) +
        (p.compat ? ' <span class="pm-sep">&middot;</span> ' + esc(D().compatLabel(p.compat)) : '') +
        (p.useCount ? ' <span class="pm-sep">&middot;</span> copied ' + p.useCount + (p.useCount === 1 ? ' time' : ' times') : '') +
        (p.fiction ? ' <span class="pm-fic">&#10086; fiction library</span>' : '') +
        (reason ? ' <span class="pm-ro">Read-only</span>' : '') +
      '</p>';

    if (reason) html += '<div class="pm-notice" style="background:rgba(242,180,65,.08);border:1px solid rgba(242,180,65,.3);color:var(--pm-amber-hi)">' + esc(reason) + '</div>';

    html += '<div class="pm-prompt-text">' + markVars(p.text || 'This prompt has no text yet.') + '</div>' +
      '<div class="pm-detail-acts">' +
        '<button type="button" class="pm-btn pm-btn-primary" data-copy="' + esc(p.uid) + '">Copy prompt</button>' +
        starBtnWide(p.uid, p.favorite) +
        (p.editable ? '<button type="button" class="pm-btn" data-edit="' + esc(p.uid) + '">Edit</button>' : '') +
      '</div>';

    if (vars.length) {
      html += '<div class="pm-block"><h2 class="pm-block-label">Variables</h2>' +
        '<div class="pm-vars">' + vars.map(function (v) {
          return '<label class="pm-field" style="margin:0">' +
            '<span class="pm-field-label">' + esc(v) + '</span>' +
            '<input class="pm-input" type="text" data-var="' + esc(v) + '" placeholder="' + esc(v.toLowerCase()) + '">' +
          '</label>';
        }).join('') + '</div>' +
        '<button type="button" class="pm-btn" id="pmCopyFilled">Copy with these filled in</button></div>';
    }

    html += '<div class="pm-block"><h2 class="pm-block-label">Notes</h2>' +
      '<textarea class="pm-textarea" id="pmNotes" style="min-height:110px;font-family:var(--pm-ui);font-size:16px"' +
        (p.editable ? '' : ' readonly') +
        ' placeholder="What this is for, what it gets wrong, what to change next time.">' + esc(noteFor(p)) + '</textarea>' +
      '<span class="pm-field-hint">Saved when you click away.</span></div>';

    var inCols = D().collectionsHolding('prompt', p.uid);
    if (inCols.length) {
      html += '<div class="pm-block"><h2 class="pm-block-label">In collections</h2><div class="pm-rows">' +
        inCols.map(function (c) {
          return '<div class="pm-row" style="--hue:#7FB3FF"><div class="pm-row-main" role="button" tabindex="0" data-collection="' + esc(c.id) + '">' +
            '<span class="pm-row-dot"></span><span class="pm-row-name">' + esc(c.title) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span><span class="pm-row-open">Open</span></div></div>';
        }).join('') + '</div></div>';
    }

    if (p.editable) {
      html += '<div class="pm-detail-acts"><button type="button" class="pm-btn pm-btn-danger pm-btn-sm" data-delete="' + esc(p.uid) + '">Delete this prompt</button></div>';
    }
    host.innerHTML = html + '</div>';
  }
  function starBtnWide(uid, on) {
    return '<button type="button" class="pm-btn pm-btn-fav' + (on ? ' is-on' : '') + '" data-fav="' + esc(uid) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      (on ? '&#9733; Favorite' : '&#9734; Favorite') + '</button>';
  }

  function viewTool(id) {
    var host = $('pmView');
    var d = D();
    var t = d.Tools.get(id);
    if (!t) {
      host.innerHTML = emptyState('That tool is gone', 'It was deleted from the library.',
        '<button type="button" class="pm-btn" data-go="#/tools">Back to tools</button>');
      return;
    }
    var hue = hueOf('tool', t.category);
    var host2 = d.hostOf(t.url);

    var html = '<div class="pm-detail" style="--hue:' + hue + '">' +
      '<h1 class="pm-detail-title">' + (t.icon ? esc(t.icon) + ' ' : '') + esc(t.name) + '</h1>' +
      '<p class="pm-detail-meta"><span class="pm-dot"></span>' + esc(catLabel('tool', t.category)) +
        (host2 ? ' <span class="pm-sep">&middot;</span> ' + esc(host2) : '') +
        (t.useCount ? ' <span class="pm-sep">&middot;</span> opened ' + t.useCount + (t.useCount === 1 ? ' time' : ' times') : '') +
      '</p>' +
      '<div class="pm-detail-acts">' +
        (t.url ? '<a class="pm-btn pm-btn-primary" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer" data-launch="' + esc(t.id) + '">Open &#8599;</a>' : '') +
        starBtnWide(t.id, t.favorite) +
        '<button type="button" class="pm-btn" data-edittool="' + esc(t.id) + '">Edit</button>' +
      '</div>';

    if (t.useFor) {
      html += '<div class="pm-block"><h2 class="pm-block-label">What you use it for</h2><p style="margin:0;color:var(--pm-text-dim)">' + esc(t.useFor) + '</p></div>';
    }
    if (t.accountNote) {
      html += '<div class="pm-block"><h2 class="pm-block-label">Account</h2><p style="margin:0;color:var(--pm-text-dim)">' + esc(t.accountNote) + '</p></div>';
    }

    /* The join between the two halves of this page: the tool tells you
       which prompts you actually run against it. */
    html += '<div class="pm-block"><h2 class="pm-block-label">Related prompts</h2>';
    var linked = t.relatedPrompts.map(pvGet).filter(Boolean);
    html += linked.length
      ? '<div class="pm-rows">' + linked.map(function (p) { return promptRow(p, true); }).join('') + '</div>'
      : '<p class="pm-empty-line">Nothing linked yet. Link the prompts you run against ' + esc(t.name) + ' so they are one click away when you open it.</p>';
    html += '<div class="pm-empty-acts" style="justify-content:flex-start;margin-top:var(--sp-3)">' +
      '<button type="button" class="pm-btn pm-btn-sm" data-linkprompts="' + esc(t.id) + '">Link prompts</button></div></div>';

    var inStacks = d.collectionsHolding('tool', t.id);
    if (inStacks.length) {
      html += '<div class="pm-block"><h2 class="pm-block-label">In stacks</h2><div class="pm-rows">' +
        inStacks.map(function (c) {
          return '<div class="pm-row" style="--hue:#4FD6E8"><div class="pm-row-main" role="button" tabindex="0" data-collection="' + esc(c.id) + '">' +
            '<span class="pm-row-dot"></span><span class="pm-row-name">' + esc(c.title) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span><span class="pm-row-open">Open</span></div></div>';
        }).join('') + '</div></div>';
    }

    html += '<div class="pm-detail-acts"><button type="button" class="pm-btn pm-btn-danger pm-btn-sm" data-deletetool="' + esc(t.id) + '">Delete this tool</button></div>';
    host.innerHTML = html + '</div>';
  }

  function viewCollection(id) {
    var host = $('pmView');
    var d = D();
    var col = d.Collections.get(id);
    if (!col) {
      host.innerHTML = emptyState('That collection is gone', 'It was deleted.',
        '<button type="button" class="pm-btn" data-go="#/">Back</button>');
      return;
    }
    var isTool = col.kind === 'tool';
    var members = memberRecords(col);

    var html = '<div class="pm-detail" style="--hue:' + (isTool ? '#4FD6E8' : '#7FB3FF') + '">' +
      '<h1 class="pm-detail-title">' + (col.icon ? esc(col.icon) + ' ' : '') + esc(col.title) + '</h1>' +
      '<p class="pm-detail-meta"><span class="pm-dot"></span>' + (isTool ? 'Tool stack' : 'Prompt collection') +
        ' <span class="pm-sep">&middot;</span> ' + plural(col.itemIds.length, isTool ? 'tool' : 'prompt') + '</p>' +
      (col.summary ? '<p style="color:var(--pm-text-dim);margin:0 0 var(--sp-5);max-width:60ch">' + esc(col.summary) + '</p>' : '');

    if (!members.length) {
      html += '<p class="pm-empty-line">No steps yet. Add the ' + (isTool ? 'tools' : 'prompts') + ' this workflow runs, in the order you run them.</p>';
    } else {
      html += '<div class="pm-block"><h2 class="pm-block-label">In order</h2><div class="pm-rows" id="pmSteps">';
      members.forEach(function (m, i) {
        var itemId = col.itemIds[i];
        if (!m) {
          html += '<div class="pm-row" data-step="' + esc(itemId) + '"><div class="pm-row-main" style="cursor:default">' +
            '<span class="pm-row-cat">' + (i + 1) + '</span>' +
            '<span class="pm-row-name" style="color:var(--pm-text-faint)">Missing &mdash; deleted, or the fiction library has not loaded</span>' +
            '</div><div class="pm-row-acts"><button type="button" class="pm-icobtn" data-unstep="' + esc(itemId) + '" aria-label="Remove step">&times;</button></div></div>';
          return;
        }
        var hue = isTool ? hueOf('tool', m.category) : hueOf('prompt', m.category);
        html += '<div class="pm-row" style="--hue:' + hue + '" data-step="' + esc(itemId) + '">' +
          (isTool
            ? '<a class="pm-row-main" href="' + esc(m.url || '#') + '" target="_blank" rel="noopener noreferrer" data-launch="' + esc(m.id) + '">'
            : '<div class="pm-row-main" role="button" tabindex="0" data-open="' + esc(m.uid) + '">') +
            '<span class="pm-row-cat" style="min-width:1.4em">' + (i + 1) + '</span>' +
            '<span class="pm-row-dot"></span>' +
            '<span class="pm-row-name">' + esc(m.title || m.name) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span>' +
            '<span class="pm-row-open">' + (isTool ? 'Open &#8599;' : 'Open') + '</span>' +
          (isTool ? '</a>' : '</div>') +
          '<div class="pm-row-acts">' +
            (isTool ? '' : '<button type="button" class="pm-icobtn pm-copy" data-copy="' + esc(m.uid) + '">Copy</button>') +
            '<button type="button" class="pm-icobtn" data-unstep="' + esc(itemId) + '" aria-label="Remove step">&times;</button>' +
          '</div></div>';
      });
      html += '</div><span class="pm-field-hint">Drag a step to reorder it.</span></div>';
    }

    html += '<div class="pm-detail-acts">' +
      '<button type="button" class="pm-btn pm-btn-primary" data-addstep="' + esc(col.id) + '">Add ' + (isTool ? 'tools' : 'prompts') + '</button>' +
      '<button type="button" class="pm-btn" data-editcol="' + esc(col.id) + '">Edit</button>' +
      '<button type="button" class="pm-btn pm-btn-danger" data-deletecol="' + esc(col.id) + '">Delete</button>' +
    '</div>';

    host.innerHTML = html + '</div>';
    mountStepSort(col.id);
  }

  function mountStepSort(colId) {
    var el = $('pmSteps');
    if (!el || typeof window.Sortable === 'undefined') return;
    window.Sortable.create(el, {
      animation: 150, handle: '.pm-row-cat', draggable: '.pm-row',
      onEnd: function () {
        var ids = Array.prototype.map.call(el.querySelectorAll('[data-step]'), function (n) { return n.dataset.step; });
        D().Collections.update(colId, { itemIds: ids });
        refreshCurrentView();
      }
    });
  }

  // ============================================================
  // §SETTINGS — the fiction library's status, and the snapshot store.
  // Nothing else. A settings page is where a simplified app quietly
  // grows back into a complicated one.
  // ============================================================
  function viewSettings() {
    var d = D(), b = B();
    var reason = gateReason();
    var html = '<div class="pm-detail">' +
      '<h1 class="pm-detail-title">Settings</h1>' +

      '<div class="pm-block"><h2 class="pm-block-label">Fiction library</h2>' +
      '<p style="margin:0 0 var(--sp-3);color:var(--pm-text-dim);max-width:62ch">' +
        'Fiction prompts live in the same cloud record as your manuscripts, so this page reads and writes them ' +
        'directly rather than keeping a copy. They only become editable once that record has arrived on this device.' +
      '</p>' +
      '<p style="margin:0 0 var(--sp-3);color:' + (reason ? 'var(--pm-warn)' : 'var(--pm-good)') + '">' +
        (reason ? esc(reason) : 'Loaded and editable. ' + plural(cdxKeyCount(), 'record') + ' present.') + '</p>' +
      '<label class="pm-check"><input type="checkbox" id="pmShowFiction"' + (d.getSettings().showFiction ? ' checked' : '') + '>' +
        'Show fiction prompts in the library</label>' +
      (reason && gate.mounted && !gate.unlocked
        ? '<button type="button" class="pm-btn pm-btn-sm" id="pmUnlock" style="margin-top:var(--sp-2)">My fiction library really is empty &mdash; let me write to it</button>'
        : '') +
      '</div>';

    var undo = b && b.pendingUndo();
    if (undo) {
      html += '<div class="pm-block"><h2 class="pm-block-label">The rebuild</h2>' +
        '<p style="margin:0 0 var(--sp-3);color:var(--pm-text-dim);max-width:62ch">' +
        'The old model-based prompt library was removed when this page was rebuilt. A snapshot was taken first.</p>' +
        '<button type="button" class="pm-btn" data-restore="' + esc(undo.snapId) + '">Restore the old library</button></div>';
    }

    html += '<div class="pm-block"><h2 class="pm-block-label">Local snapshots</h2>' +
      '<p style="margin:0 0 var(--sp-3);color:var(--pm-text-dim);max-width:62ch">' +
      'Copies of this page\'s data kept on this device only. They are never synced and never sent anywhere, ' +
      'which is exactly why they survive a bad sync.</p>';
    var snaps = b ? b.list() : [];
    html += snaps.length
      ? '<div class="pm-rows">' + snaps.map(function (s) {
          return '<div class="pm-row" style="--hue:#8A94A6"><div class="pm-row-main" style="cursor:default">' +
            '<span class="pm-row-dot"></span>' +
            '<span class="pm-row-name">' + esc(d.fmtDate(s.at)) + ', ' + esc(new Date(s.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })) + '</span>' +
            '<span class="pm-row-cat">' + esc(s.counts.length ? s.counts.join(', ') : 'empty') + '</span>' +
            '</div><div class="pm-row-acts">' +
            '<button type="button" class="pm-btn pm-btn-sm" data-restore="' + esc(s.id) + '">Restore</button></div></div>';
        }).join('') + '</div>'
      : '<p class="pm-empty-line">No snapshots yet. One is taken every time you edit something.</p>';
    html += '<div class="pm-empty-acts" style="justify-content:flex-start;margin-top:var(--sp-3)">' +
      '<button type="button" class="pm-btn pm-btn-sm" id="pmSnapNow">Take a snapshot now</button></div></div>';

    html += '<div class="pm-block"><h2 class="pm-block-label">Library</h2><p class="pm-empty-line">' +
      plural(d.Prompts.list().length, 'prompt') + ' &middot; ' + plural(d.Tools.list().length, 'tool') +
      ' &middot; ' + plural(d.Collections.list().length, 'collection') + '</p>' +
      '<div class="pm-empty-acts" style="justify-content:flex-start;margin-top:var(--sp-3)">' +
      '<button type="button" class="pm-btn pm-btn-sm" data-starter="1">Add my usual tools</button></div></div>';

    $('pmView').innerHTML = html + '</div>';
  }

  // ============================================================
  // §ROUTER
  // ============================================================
  function parts() {
    return (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  }
  function go(hash) { location.hash = hash; }

  function render() {
    var p = parts();
    var back = $('pmBack');
    var isDetail = p.length > 0 && p[0] !== 'tools';

    // The tab follows the route, so a deep link into a tool lands with the
    // Tools tab lit rather than lying about where you are. A collection is
    // the only route that cannot be read off the hash — its own kind says
    // which half of the page it belongs to.
    if (p[0] === 'tools' || p[0] === 't') ui.tab = 'tools';
    else if (!p.length || p[0] === 'p') ui.tab = 'prompts';
    else if (p[0] === 'c' && p[1]) {
      var col = D().Collections.get(decodeURIComponent(p[1]));
      if (col) ui.tab = col.kind === 'tool' ? 'tools' : 'prompts';
    }

    renderHead(isDetail);
    back.hidden = !isDetail;

    if (!p.length)                       { renderBar('prompts'); runSafely(viewPromptsHome, 'prompts home'); }
    else if (p[0] === 'tools')           { renderBar('tools');   runSafely(viewToolsHome, 'tools home'); }
    else if (p[0] === 'p' && p[1])       { renderBar(null); runSafely(function () { viewPrompt(decodeURIComponent(p[1])); }, 'prompt'); }
    else if (p[0] === 't' && p[1])       { renderBar(null); runSafely(function () { viewTool(decodeURIComponent(p[1])); }, 'tool'); }
    else if (p[0] === 'c' && p[1])       { renderBar(null); runSafely(function () { viewCollection(decodeURIComponent(p[1])); }, 'collection'); }
    else if (p[0] === 'settings')        { renderBar(null); runSafely(viewSettings, 'settings'); }
    else                                 { renderBar('prompts'); runSafely(viewPromptsHome, 'prompts home'); }
  }

  /* A repaint is not a navigation. Cloud sync, coming back online and the
     boot grace timer all call this at moments nobody chose, and a
     re-render that scrolled to the top would throw you out of whatever
     you were reading. Scroll-to-top belongs to hashchange, and only
     there. */
  function refreshCurrentView() {
    var y = window.scrollY;
    var active = document.activeElement;
    // Never repaint out from under a field being typed into: the caret,
    // the buffer and any IME composition would go with it.
    if (active && /^(INPUT|TEXTAREA)$/.test(active.tagName) && active.id !== 'pmQ') return;
    render();
    window.scrollTo(0, y);
  }

  // ============================================================
  // §MODAL and §FIELDS
  // ============================================================
  var modalSave = null;
  function openModal(cfg) {
    var bg = $('pmModalBg'), box = $('pmModal');
    box.innerHTML =
      (cfg.title ? '<h2 class="pm-modal-title">' + esc(cfg.title) + '</h2>' : '') +
      cfg.body +
      (cfg.hideActions ? '' :
        '<div class="pm-modal-acts">' +
          (cfg.extra || '') +
          '<span class="pm-spacer"></span>' +
          '<button type="button" class="pm-btn pm-btn-ghost" data-modalclose="1">Cancel</button>' +
          '<button type="button" class="pm-btn pm-btn-primary" id="pmModalSave">' + esc(cfg.saveLabel || 'Save') + '</button>' +
        '</div>');
    modalSave = cfg.onSave || null;
    bg.classList.add('is-open');
    if (cfg.onMount) cfg.onMount(box);
    var first = box.querySelector('input,textarea,select,button');
    if (first) first.focus();
  }
  function closeModal() {
    $('pmModalBg').classList.remove('is-open');
    $('pmModal').innerHTML = '';
    modalSave = null;
  }

  function fieldText(label, name, value, ph, hint) {
    return '<label class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<input class="pm-input" type="text" data-f="' + name + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '">' +
      (hint ? '<span class="pm-field-hint">' + esc(hint) + '</span>' : '') + '</label>';
  }
  function fieldArea(label, name, value, ph, hint) {
    return '<label class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<textarea class="pm-textarea" data-f="' + name + '" placeholder="' + esc(ph || '') + '">' + esc(value || '') + '</textarea>' +
      (hint ? '<span class="pm-field-hint">' + esc(hint) + '</span>' : '') + '</label>';
  }
  function fieldSelect(label, name, value, options) {
    return '<label class="pm-field"><span class="pm-field-label">' + esc(label) + '</span>' +
      '<select class="pm-select" data-f="' + name + '">' +
        options.map(function (o) {
          return '<option value="' + esc(o.id) + '"' + (o.id === value ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('') +
      '</select></label>';
  }
  function fieldCheck(label, name, on) {
    return '<label class="pm-check"><input type="checkbox" data-f="' + name + '"' + (on ? ' checked' : '') + '>' + esc(label) + '</label>';
  }
  function readFields(root) {
    var out = {};
    root.querySelectorAll('[data-f]').forEach(function (el) {
      out[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }
  function parseTags(s) {
    return String(s || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 12);
  }

  // ============================================================
  // §EDITORS
  // ============================================================
  function openPromptEditor(uid) {
    var d = D();
    var p = uid ? pvGet(uid) : null;
    if (uid && !p) { toast('That prompt is gone', true); return; }
    if (p && !p.editable) { toast(gateReason(), true); return; }
    openModal({
      title: p ? 'Edit prompt' : 'New prompt',
      saveLabel: p ? 'Save changes' : 'Add prompt',
      body:
        fieldText('Name', 'title', p ? p.title : '', 'Scene improvement') +
        fieldArea('Prompt', 'text', p ? p.text : '', 'Paste the prompt. Wrap anything you swap out each time in double braces, like {{SCENE}}.',
          'Double-braced words become fillable fields when you open the prompt.') +
        '<div class="pm-fieldrow">' +
          fieldSelect('For', 'category', p ? p.category : 'writing', d.PROMPT_CATEGORIES) +
          fieldSelect('Works with', 'compat', p ? p.compat : '', d.COMPAT) +
        '</div>' +
        fieldText('Tags', 'tags', p ? p.tags.join(', ') : '', 'scene, revision', 'Comma separated. Optional.') +
        fieldCheck('Favorite', 'favorite', p ? p.favorite : false),
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim() && !String(f.text).trim()) { toast('Give it a name or some text', true); return false; }
        var patch = {
          title: String(f.title).trim() || 'Untitled prompt',
          text: f.text,
          category: f.category,
          compat: f.compat,
          tags: parseTags(f.tags),
          favorite: !!f.favorite,
          variables: d.detectVariables(f.text)
        };
        if (p) {
          if (p.src === 'cdx') { delete patch.variables; }   // pvPatch derives them
          return pvPatch(p.uid, patch);
        }
        patch.order = d.nextOrder(d.Prompts.list());
        var made = d.Prompts.add(patch);
        go('#/p/prm:' + made.id);
        return true;
      }
    });
  }

  function openToolEditor(id) {
    var d = D();
    var t = id ? d.Tools.get(id) : null;
    if (id && !t) { toast('That tool is gone', true); return; }
    openModal({
      title: t ? 'Edit tool' : 'Add a tool',
      saveLabel: t ? 'Save changes' : 'Add tool',
      body:
        '<div class="pm-fieldrow">' +
          fieldText('Name', 'name', t ? t.name : '', 'Claude') +
          fieldText('Icon', 'icon', t ? t.icon : '', '◈', 'One character or emoji. Optional.') +
        '</div>' +
        fieldText('Address', 'url', t ? t.url : '', 'claude.ai') +
        fieldSelect('Category', 'category', t ? t.category : 'ai', d.TOOL_CATEGORIES) +
        fieldText('What you use it for', 'useFor', t ? t.useFor : '', 'Long documents and code review', 'Shown when you open the tool, not on the list.') +
        fieldText('Tags', 'tags', t ? t.tags.join(', ') : '', 'daily, writing', 'Comma separated. Optional.') +
        fieldText('Account note', 'accountNote', t ? t.accountNote : '', 'Signed in with the Gmail account',
          'Which account you use. Never put a password here: this syncs to the cloud.') +
        fieldCheck('Favorite', 'favorite', t ? t.favorite : false) +
        fieldCheck('Show in Quick Launch', 'quick', t ? t.quick : false),
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.name).trim()) { toast('Give it a name', true); return false; }
        var url = d.safeUrl(f.url);
        if (String(f.url).trim() && !url) { toast('That address does not look like a link', true); return false; }
        var patch = {
          name: String(f.name).trim(), icon: String(f.icon).trim().slice(0, 4), url: url,
          category: f.category, useFor: f.useFor, tags: parseTags(f.tags),
          accountNote: f.accountNote, favorite: !!f.favorite, quick: !!f.quick
        };
        if (t) { d.Tools.update(t.id, patch); return true; }
        patch.order = d.nextOrder(d.Tools.list());
        var made = d.Tools.add(patch);
        go('#/t/' + made.id);
        return true;
      }
    });
  }

  function openCollectionEditor(id, kind) {
    var d = D();
    var col = id ? d.Collections.get(id) : null;
    var k = col ? col.kind : (kind === 'tool' ? 'tool' : 'prompt');
    openModal({
      title: col ? 'Edit collection' : (k === 'tool' ? 'New stack' : 'New collection'),
      saveLabel: col ? 'Save changes' : 'Create',
      body:
        '<div class="pm-fieldrow">' +
          fieldText('Name', 'title', col ? col.title : '', k === 'tool' ? 'Writing stack' : 'Novel chapter workflow') +
          fieldText('Icon', 'icon', col ? col.icon : '', '', 'Optional.') +
        '</div>' +
        fieldText('What it is for', 'summary', col ? col.summary : '', 'Draft, critique, rewrite, line edit'),
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim()) { toast('Give it a name', true); return false; }
        var patch = { title: String(f.title).trim(), icon: String(f.icon).trim().slice(0, 4), summary: f.summary };
        if (col) { d.Collections.update(col.id, patch); return true; }
        patch.kind = k;
        patch.order = d.nextOrder(d.Collections.list());
        var made = d.Collections.add(patch);
        go('#/c/' + made.id);
        return true;
      }
    });
  }

  /* One picker serves "add steps to a collection" and "link prompts to a
     tool". Both are the same question — which of these, in what order —
     so they are the same sheet. */
  function openPicker(cfg) {
    var rows = cfg.items.map(function (it) {
      return '<label class="pm-check" style="padding:0 6px"><input type="checkbox" value="' + esc(it.id) + '"' +
        (cfg.selected.indexOf(it.id) >= 0 ? ' checked' : '') + '>' +
        '<span>' + esc(it.label) + (it.note ? ' <span style="color:var(--pm-text-faint);font-size:12px">' + esc(it.note) + '</span>' : '') + '</span></label>';
    }).join('');
    openModal({
      title: cfg.title,
      saveLabel: 'Save',
      body: cfg.items.length
        ? '<div id="pmPick" style="max-height:52vh;overflow:auto;margin:0 -6px">' + rows + '</div>' +
          '<span class="pm-field-hint">New picks go on the end. Reorder them on the collection itself.</span>'
        : '<p class="pm-empty-line">' + esc(cfg.emptyMsg || 'Nothing to pick from yet.') + '</p>',
      onSave: function (root) {
        var picked = Array.prototype.map.call(root.querySelectorAll('#pmPick input:checked'), function (n) { return n.value; });
        // Keep the existing order, drop what was unticked, append what is new.
        var next = cfg.selected.filter(function (id) { return picked.indexOf(id) >= 0; })
          .concat(picked.filter(function (id) { return cfg.selected.indexOf(id) < 0; }));
        cfg.onPick(next);
        return true;
      }
    });
  }

  function openStepPicker(colId) {
    var d = D();
    var col = d.Collections.get(colId);
    if (!col) return;
    var items = col.kind === 'tool'
      ? d.Tools.list().sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })

      : pvAll().sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); })

    });

  function openLinkPrompts(toolId) {

        .map(function (p) { return { id: p.uid, label: p.title, note: catLabel('prompt', p.category) }; }),

    });

  /* Add-to-collection, offered from a prompt's own menu — the direction
     you actually think in when you have just written a prompt and realise
     it belongs in a workflow. */
  function openAddToCollection(uid) {
    var d = D();
    var cols = d.collectionsOfKind('prompt');
    if (!cols.length) { openCollectionEditor(null, 'prompt'); return; }
    var inNow = d.collectionsHolding('prompt', uid).map(function (c) { return c.id; });
    openPicker({
      title: 'Add to a collection',
      items: cols.map(function (c) { return { id: c.id, label: c.title, note: plural(c.itemIds.length, 'step') }; }),
      selected: inNow,
      onPick: function (ids) {
        cols.forEach(function (c) {

          if (has === want) return;

          d.Collections.update(c.id, { itemIds: next });

  // ============================================================
  // §MENUS — the ⋯ sheet. A modal rather than a popover: it needs no
  // positioning maths, it works the same on a phone, and it cannot end
  // up off-screen next to a card in the last column.
  // ============================================================
  function menuHtml(items) {
    return '<div class="pm-menu">' + items.map(function (it) {
      return '<button type="button" data-act="' + it.act + '"' + (it.danger ? ' class="is-danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('') + '</div>';
  }
  function openPromptMenu(uid) {
    var p = pvGet(uid);
    if (!p) return;
    var items = [
      { act: 'open', label: 'Open' },
      { act: 'copy', label: 'Copy prompt' },
      { act: 'fav', label: p.favorite ? 'Remove from favorites' : 'Add to favorites' },
      { act: 'collect', label: 'Add to a collection' }
    ];
    if (p.editable) {
      items.push({ act: 'edit', label: 'Edit' });
      items.push({ act: 'dupe', label: 'Duplicate' });
      items.push({ act: 'delete', label: 'Delete', danger: true });
    }
    openModal({
      title: p.title, hideActions: true, body: menuHtml(items),
      onMount: function (box) {
        box.querySelectorAll('[data-act]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var a = btn.dataset.act;
            closeModal();
            if (a === 'open') go('#/p/' + uid);
            else if (a === 'copy') doCopy(uid, null);
            else if (a === 'fav') toggleFav(uid);
            else if (a === 'collect') openAddToCollection(uid);
            else if (a === 'edit') openPromptEditor(uid);
            else if (a === 'dupe') duplicatePrompt(uid);
            else if (a === 'delete') confirmDeletePrompt(uid);
          });
        });
      }
    });
  }
  function openToolMenu(id) {
    var d = D(), t = d.Tools.get(id);
    if (!t) return;
    openModal({
      title: t.name, hideActions: true,
      body: menuHtml([
        { act: 'open', label: 'Open the tool' },
        { act: 'detail', label: 'Show details' },
        { act: 'fav', label: t.favorite ? 'Remove from favorites' : 'Add to favorites' },
        { act: 'quick', label: t.quick ? 'Remove from Quick Launch' : 'Add to Quick Launch' },
        { act: 'edit', label: 'Edit' },
        { act: 'delete', label: 'Delete', danger: true }
      ]),
      onMount: function (box) {
        box.querySelectorAll('[data-act]').forEach(function (btn) {
          btn.addEventListener('click', function () {

            closeModal();

            else if (a === 'detail') go('#/t/' + id);
            else if (a === 'fav') { d.Tools.update(id, { favorite: !t.favorite }); refreshCurrentView(); }
            else if (a === 'quick') { d.Tools.update(id, { quick: !t.quick }); toast(t.quick ? 'Removed from Quick Launch' : 'Added to Quick Launch'); refreshCurrentView(); }
            else if (a === 'edit') openToolEditor(id);
            else if (a === 'delete') confirmDeleteTool(id);
          });
        });

  // ============================================================
  // §ACTIONS
  // ============================================================
  function isPromptUid(x) { return x.indexOf('prm:') === 0 || x.indexOf('cdx:') === 0; }

  function doCopy(uid, btn) {
    var p = pvGet(uid);
    if (!p) { toast('That prompt is gone', true); return; }
    copyText(p.text || '').then(function (ok) {
      if (!ok) { toast('Could not reach the clipboard', true); return; }
      pvTouch(uid);
      toast('Copied');
      if (btn) {
        btn.classList.add('is-done');
        var was = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(function () { btn.classList.remove('is-done'); btn.textContent = was; }, 1400);
      }
    });
  }
  function toggleFav(id) {
    var d = D();
    if (isPromptUid(id)) {
      var p = pvGet(id);
      if (!p) return;
      if (p.src === 'cdx' && !codexWritable()) { toast(gateReason(), true); return; }
      pvPatch(id, { favorite: !p.favorite });
    } else {
      var t = d.Tools.get(id);
      if (!t) return;
      d.Tools.update(id, { favorite: !t.favorite });
    }
    refreshCurrentView();
  }
  function launchTool(id) {
    var d = D(), t = d.Tools.get(id);
    if (!t) return;
    d.Tools.update(id, { useCount: (t.useCount || 0) + 1, lastOpenedAt: d.nowISO() });
  }
  function duplicatePrompt(uid) {
    var d = D(), p = pvGet(uid);
    if (!p) return;
    var made = d.Prompts.add({
      title: p.title + ' (copy)', text: p.text, category: p.category, compat: p.compat,
      tags: p.tags.slice(), notes: p.notes, order: d.nextOrder(d.Prompts.list())
    });

    go('#/p/prm:' + made.id);
  }
  function confirmDeletePrompt(uid) {
    var p = pvGet(uid);

    openModal({
      title: 'Delete ' + p.title + '?',
      saveLabel: 'Delete it',
      body: '<p class="pm-empty-line">' +
        (p.fiction
          ? 'This prompt lives in the fiction library, so deleting it here deletes it there too.'
          : 'This removes the prompt and takes it out of any collection that uses it.') +
        ' A snapshot is kept on this device, so you can put it back from Settings.</p>',
      onSave: function () {

  function confirmDeleteTool(id) {
    var d = D(), t = d.Tools.get(id);

      title: 'Delete ' + t.name + '?',

        'A snapshot is kept on this device, so you can put it back from Settings.</p>',

    });

  function clearFilters() {
    ui.q = ''; ui.cat = 'all'; ui.favOnly = false;
    var q = $('pmQ'); if (q) q.value = '';

  // ============================================================
  // §WIRING — bound once, on hosts that survive every repaint.
  // ============================================================
  function wire() {
    var app = $('pmApp');

    on(app, '[data-tab]', 'click', function () {
      var tab = this.dataset.tab;
      if (ui.tab === tab) return;
      ui.tab = tab;
      // The corpus changed, so the query and the pill are about the wrong
      // library now. Carrying them over would show an empty page.
      ui.q = ''; ui.cat = 'all';
      saveUi();
      go(tab === 'tools' ? '#/tools' : '#/');
    });
    on(app, '[data-cat]', 'click', function () {
      ui.cat = this.dataset.cat; saveUi(); render();
    });
    on(app, '#pmFav', 'click', function () { ui.favOnly = !ui.favOnly; saveUi(); render(); });
    on(app, '#pmQ', 'input', function () { ui.q = this.value; syncBarState(); renderPills(barMode); runSafely(renderCurrentList, 'search'); });
    on(app, '#pmQClear', 'click', function () { ui.q = ''; var q = $('pmQ'); if (q) { q.value = ''; q.focus(); } syncBarState(); renderPills(barMode); render(); });
    on(app, '#pmQ', 'keydown', function (e) { if (e.key === 'Escape') { ui.q = ''; this.value = ''; syncBarState(); render(); } });

    on(app, '[data-new]', 'click', function () {
      if (this.dataset['new'] === 'tools') openToolEditor(null); else openPromptEditor(null);
    });
    on(app, '[data-newcol]', 'click', function () { openCollectionEditor(null, this.dataset.newcol); });
    on(app, '[data-copy]', 'click', function (e) { e.stopPropagation(); doCopy(this.dataset.copy, this); });
    on(app, '[data-fav]', 'click', function (e) { e.stopPropagation(); toggleFav(this.dataset.fav); });
    on(app, '[data-menu]', 'click', function (e) { e.stopPropagation(); openPromptMenu(this.dataset.menu); });
    on(app, '[data-toolmenu]', 'click', function (e) { e.stopPropagation(); openToolMenu(this.dataset.toolmenu); });
    actAsButton(app, '[data-open]', function () { go('#/p/' + this.dataset.open); });
    actAsButton(app, '[data-collection]', function () { go('#/c/' + this.dataset.collection); });
    on(app, '[data-launch]', 'click', function () { launchTool(this.dataset.launch); });
    on(app, '[data-go]', 'click', function () { go(this.dataset.go); });
    on(app, '[data-clearfilters]', 'click', clearFilters);

    on(app, '[data-edit]', 'click', function () { openPromptEditor(this.dataset.edit); });
    on(app, '[data-delete]', 'click', function () { confirmDeletePrompt(this.dataset['delete']); });
    on(app, '[data-edittool]', 'click', function () { openToolEditor(this.dataset.edittool); });
    on(app, '[data-deletetool]', 'click', function () { confirmDeleteTool(this.dataset.deletetool); });
    on(app, '[data-editcol]', 'click', function () { openCollectionEditor(this.dataset.editcol); });
    on(app, '[data-deletecol]', 'click', function () { confirmDeleteCollection(this.dataset.deletecol); });
    on(app, '[data-addstep]', 'click', function () { openStepPicker(this.dataset.addstep); });
    on(app, '[data-linkprompts]', 'click', function () { openLinkPrompts(this.dataset.linkprompts); });
    on(app, '[data-unstep]', 'click', function () {
      var p = parts();
      if (p[0] !== 'c' || !p[1]) return;
      var d = D(), col = d.Collections.get(p[1]);
      if (!col) return;
      var id = this.dataset.unstep;
      d.Collections.update(col.id, { itemIds: col.itemIds.filter(function (x) { return x !== id; }) });
      refreshCurrentView();
    });
    on(app, '[data-starter]', 'click', function () {
      var n = D().addStarterTools();
      toast(n ? 'Added ' + plural(n, 'tool') : 'Those are already here');
      if (ui.tab !== 'tools') { ui.tab = 'tools'; saveUi(); go('#/tools'); } else refreshCurrentView();
    });
    on(app, '[data-restore]', 'click', function () { confirmRestore(this.dataset.restore); });

    on(app, '#pmCopyFilled', 'click', function () {
      var p = pvGet(decodeURIComponent(parts()[1] || ''));
      if (!p) return;
      var values = {};
      $('pmView').querySelectorAll('[data-var]').forEach(function (el) { values[el.dataset.var] = el.value; });
      copyText(D().fillVariables(p.text, values)).then(function (ok) {
        if (!ok) { toast('Could not reach the clipboard', true); return; }
        pvTouch(p.uid);
        toast('Copied with your values');
      });
    });
    on(app, '#pmNotes', 'blur', function () {
      var uid = decodeURIComponent(parts()[1] || '');
      var p = pvGet(uid);
      if (!p || !p.editable || noteFor(p) === this.value) return;
      if (pvPatch(uid, { notes: this.value })) toast('Note saved');
    });
    on(app, '#pmShowFiction', 'change', function () { D().setSettings({ showFiction: this.checked }); toast(this.checked ? 'Fiction prompts shown' : 'Fiction prompts hidden'); });
    on(app, '#pmUnlock', 'click', function () { gate.unlocked = true; toast('Fiction prompts are editable'); refreshCurrentView(); });
    on(app, '#pmSnapNow', 'click', function () {
      var id = B() && B().snapshot('manual');
      toast(id ? 'Snapshot taken' : 'Nothing to snapshot yet', !id);
      refreshCurrentView();
    });

    // modal
    var box = $('pmModal');
    on(box, '[data-modalclose]', 'click', closeModal);
    on(box, '#pmModalSave', 'click', function () {
      if (!modalSave) { closeModal(); return; }
      var res = modalSave($('pmModal'));
      if (res === false) return;                 // the handler said the input was not usable
      closeModal();
      refreshCurrentView();
    });
    $('pmModalBg').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $('pmModalBg').classList.contains('is-open')) closeModal();
    });

    $('pmBack').addEventListener('click', function () {
      if (history.length > 1) history.back();
      else go(ui.tab === 'tools' ? '#/tools' : '#/');
    });
  }

  /* Typing repaints only the results, not the whole route: render() would
     rebuild the bar's controls in some cases, and the caret lives in
     there. */
  function renderCurrentList() {
    if (ui.tab === 'tools') viewToolsHome(); else viewPromptsHome();
  }

  function confirmDeleteCollection(id) {
    var d = D(), col = d.Collections.get(id);
    if (!col) return;
    openModal({
      title: 'Delete ' + col.title + '?',
      saveLabel: 'Delete it',
      body: '<p class="pm-empty-line">The collection goes; the ' + (col.kind === 'tool' ? 'tools' : 'prompts') +
        ' in it stay in the library.</p>',
      onSave: function () { d.Collections.remove(id); toast('Deleted'); go(col.kind === 'tool' ? '#/tools' : '#/'); return true; }
    });
  }
  function confirmRestore(snapId) {
    var b = B();
    if (!b) return;
    var snap = b.read(snapId);
    if (!snap) { toast('That snapshot is gone', true); return; }
    var counts = b.countsFor(snap.state);
    openModal({
      title: 'Restore this snapshot?',
      saveLabel: 'Restore it',
      body: '<p class="pm-empty-line">This replaces what is on the page now with ' +
        esc(counts.length ? counts.join(', ') : 'an empty library') + ' from ' + esc(D().fmtAgo(snap.at)) + '. ' +
        'The current state is snapshotted first, so this is reversible too.</p>',
      onSave: function () {
        var n = b.restore(snapId);
        b.clearUndo();
        renderUndo();
        toast(n ? 'Restored ' + plural(n, 'record') : 'Nothing to restore', !n);
        return true;
      }
    });
  }

  // ============================================================
  // §STAGE — the hero video controller.
  //
  // The element itself is static markup (see the comment on #pmStage);
  // this only decides whether it gets a src at all, and keeps it playing.
  // Never fetched on a phone or under reduced motion: it is atmosphere,
  // and atmosphere is not worth a megabyte on a cellular connection.
  // ============================================================
  var STAGE_SRC = 'images_by_admin/promptarium/hero.mp4';
  var mqNarrow = window.matchMedia('(max-width:720px)');
  var mqMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  function stageAllowed() { return !mqNarrow.matches && !mqMotion.matches; }

  function mountStage() {
    var v = $('pmStageVid'), root = document.documentElement;
    if (!v) return;
    if (!stageAllowed()) {
      // Not "hidden" — actively DETACHED, so a phone never spends the
      // bandwidth. The hero falls back to the photographic plate, which is
      // the same picture without the moving light.
      root.classList.remove('pm-video-on', 'pm-video-live');
      if (v.getAttribute('src')) { try { v.pause(); } catch (e) {} v.removeAttribute('src'); v.load(); }
      return;
    }
    root.classList.add('pm-video-on');
    if (!v.getAttribute('src')) {
      v.addEventListener('playing', function () { root.classList.add('pm-video-live'); });
      v.addEventListener('error', function () { root.classList.remove('pm-video-on', 'pm-video-live'); });
      v.preload = 'auto';
      v.src = STAGE_SRC;
    }
    v.play().catch(function () {});
  }
  function resumeStage() {
    var v = $('pmStageVid');
    if (v && v.getAttribute('src') && v.paused) v.play().catch(function () {});
  }
  if (mqNarrow.addEventListener) {
    mqNarrow.addEventListener('change', mountStage);
    mqMotion.addEventListener('change', mountStage);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) resumeStage(); });
  // Autoplay policy: some browsers refuse until the document has been
  // interacted with once. Cheap, self-removing insurance.
  document.addEventListener('pointerdown', function once() {
    document.removeEventListener('pointerdown', once);
    resumeStage();
  });

  // ============================================================
  // §PARALLAX — the house technique: ONE rAF-throttled scroll handler that
  // writes a single number, and every visual expressed in CSS off it.
  //
  // --p goes on documentElement rather than on .pm-head because layer 1 is
  // the video, which lives outside #pmApp and so cannot inherit from the
  // header. --pm-par-px is the header's live height, which is also what
  // bounds #pmStage.
  // ============================================================
  var parPx = 1;
  function measurePar() {
    var head = document.querySelector('.pm-head');
    parPx = head ? Math.max(1, head.offsetHeight) : Math.round(window.innerHeight * 0.6);
    var root = document.documentElement;
    root.style.setProperty('--pm-par-px', parPx + 'px');
    root.classList.toggle('pm-par', !!head && !mqMotion.matches);
    onParScroll();
  }
  var parQueued = false;
  function onParScroll() {
    if (parQueued) return;
    parQueued = true;
    requestAnimationFrame(function () {
      parQueued = false;
      if (mqMotion.matches) { document.documentElement.style.setProperty('--p', '0'); return; }
      var p = Math.min(1, Math.max(0, (window.scrollY || 0) / parPx));
      document.documentElement.style.setProperty('--p', p.toFixed(4));
    });
  }
  window.addEventListener('scroll', onParScroll, { passive: true });
  window.addEventListener('resize', measurePar);
  if (mqMotion.addEventListener) mqMotion.addEventListener('change', measurePar);

  // ============================================================
  // §STORAGE HEALTH — the two states where nothing above can help.
  //
  //   1. local-store-idb.js resolves to 'memory-only' when IndexedDB will
  //      not open (private-browsing restrictions, a corrupt profile). The
  //      shim still answers every read and write from its in-memory Map,
  //      so the page behaves perfectly — right up until the reload, when
  //      the whole session is gone.
  //   2. storeSet catches a write failure and dispatches prm:save with
  //      ok:false. A failed save is the literal event the snapshot store
  //      exists to prevent; it earns something that stays on screen
  //      rather than a toast that times out.
  // ============================================================
  var healthState = { backend: null, save: null };
  function renderHealth() {
    var el = $('pmHealth');
    if (!el) return;
    var msg = healthState.save || healthState.backend;
    el.hidden = !msg;
    el.innerHTML = msg || '';
    syncNoticeSpacing();
  }
  /* The band's own top padding exists to clear topbar's launcher. When a
     notice is already doing that, the padding is just a hole. */
  function syncNoticeSpacing() {
    var any = !$('pmHealth').hidden || !$('pmUndo').hidden;
    document.body.classList.toggle('pm-has-notice', any);
  }
  function checkStorageBackend() {
    var b = null;
    try { b = window.LocalStoreIDB && window.LocalStoreIDB.backend && window.LocalStoreIDB.backend(); } catch (e) {}
    if (b && b !== 'indexeddb') {
      healthState.backend =
        '<span><b>Not being saved.</b> This browser would not open its database, so everything you ' +
        'type here lasts only until the tab closes. Copy anything you need out now &mdash; a normal ' +
        'window, or a browser that is not blocking site storage, will save it properly.</span>';
    }
    renderHealth();
  }
  window.addEventListener('prm:save', function (e) {
    if (!e.detail) return;
    if (e.detail.ok === false) {
      healthState.save =
        '<span><b>That did not save.</b> Storage refused the write &mdash; it is most likely full. ' +
        'Copy what you just wrote somewhere safe, then clear some space.</span>';
      toast('Save failed — storage may be full', true);
      renderHealth();
    } else if (healthState.save) {
      healthState.save = null;                    // a later write got through
      renderHealth();
    }
  });

  // ============================================================
  // §UNDO — the rebuild's one destructive act, offered back.
  // ============================================================
  var undoDismissed = false;
  function renderUndo() {
    var el = $('pmUndo'), b = B();
    var w = !undoDismissed && b && b.pendingUndo();
    el.hidden = !w;
    syncNoticeSpacing();
    if (!w) return;
    var snap = b.read(w.snapId);
    var counts = snap ? b.countsFor(snap.state) : [];
    el.innerHTML =
      '<span>The old model-based prompt library was removed when this page was rebuilt' +
      (counts.length ? ' (' + esc(counts.join(', ')) + ')' : '') + '. A copy is kept on this device.</span>' +
      '<span class="pm-spacer"></span>' +
      '<button type="button" class="pm-btn pm-btn-sm" data-restore="' + esc(w.snapId) + '">Restore it</button>' +
      '<button type="button" class="pm-btn pm-btn-sm pm-btn-ghost" id="pmUndoDismiss">Dismiss</button>';
  }

  // ============================================================
  // §BOOT
  // ============================================================
  window.addEventListener('hashchange', function () {
    runSafely(render, 'hashchange');
    // Scroll-to-top belongs to navigation, and ONLY to navigation. See
    // refreshCurrentView(), which deliberately does the opposite.
    window.scrollTo(0, 0);
  });
  window.addEventListener('online', function () { refreshCurrentView(); });
  window.addEventListener('offline', function () { refreshCurrentView(); });

  var remoteRef = { applied: false, pulled: false };

  /* §THE WIPE — run once, and only from onPulled.
     pushNow() sends collect() as the row's ENTIRE data column, so a write
     that beats the opening select erases every key this device lacks and
     then pushes the erasure as truth. Waiting for the pull is not a
     nicety; it is the difference between deleting the old library and
     deleting whatever else happened to be in the row. */
  var wipeDone = false;
  function runWipeOnce() {
    if (wipeDone) return;
    wipeDone = true;
    var d = D(), b = B();
    if (!b) { try { console.error('[Prompt Studio] backup module missing; wipe skipped'); } catch (e) {} return; }
    var snapId = b.snapshot('pre-wipe');
    // A null id means there was nothing worth snapshotting, which also
    // means there is nothing to lose — that, and only that, is when the
    // wipe may proceed without one.
    var res = d.wipeLegacy({ force: !snapId });
    if (!res.ran) return;
    if (snapId) { b.markWipe(snapId); renderUndo(); }
    try { console.info('[Prompt Studio] rebuilt: removed ' + res.removed.length + ' legacy key(s)'); } catch (e) {}
    refreshCurrentView();
  }

  function boot() {
    var d = D();
    if (!d) {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#ccc">promptarium-data.js failed to load.</p>';
      return;
    }

    loadUi();
    wire();
    mountStage();
    checkStorageBackend();

    /* The snapshot store starts BEFORE cloud sync. The opening pull can
       change or delete local keys, and the whole point of the boot
       snapshot is that it records what was here before the cloud got a
       vote. */
    if (B()) B().init();
    renderUndo();
    $('pmUndo').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'pmUndoDismiss') { undoDismissed = true; renderUndo(); }
      var r = e.target && e.target.closest ? e.target.closest('[data-restore]') : null;
      if (r) confirmRestore(r.dataset.restore);
    });

    /* TWO sync mounts. The prm: one is registered FIRST so its
       localStorage patch sits innermost; sync.js captures the current
       setItem at call time, so the two wrappers chain and each pushes
       only its own prefix. This is correct ONLY because 'prm:' and 'cdx:'
       are disjoint — an overlap would make the two rows push each other
       in a loop. */
    if (typeof window.initCloudSync === 'function' && window.supabase) {
      window.initCloudSync({
        appKey: 'promptarium',
        syncedPrefixes: ['prm:'],
        // handoff: protects a write whose push never confirmed — a failed
        // request, a tab closed mid-flight — from being deleted by the next
        // visit's opening pull. See sync.js §HANDOFF.
        handoff: true,
        onPulled: function () { remoteRef.pulled = true; runWipeOnce(); },
        onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
      });
      // The Codex's own row, mounted read-write. See §CODEX GATE — nothing
      // may write a cdx: key until this has pulled.
      window.initCloudSync({
        appKey: 'codex',
        syncedPrefixes: ['cdx:'],
        handoff: true,
        onApplied: function () { gate.applied = true; refreshCurrentView(); }
      });
      gate.mounted = true;

      /* A row that is genuinely empty and a pull that never answers look
         identical from here. After three seconds the gate stops waiting
         and falls back to "is there any cdx: data on this device" —
         which is the check that actually protects the manuscripts. */
      setTimeout(function () {
        gate.graceOver = true;
        if (!remoteRef.pulled) runWipeOnce();      // offline first run: still one-shot, still snapshotted
        refreshCurrentView();
      }, 3000);
    } else {
      // No cloud at all (offline file, blocked CDN). Local-only is a
      // legitimate way to use this page; the wipe still needs to happen
      // once, and there is no row to race.
      runWipeOnce();
    }

    runSafely(render, 'boot');
  }

  /* local-store-idb.js hydrates localStorage from IndexedDB ASYNCHRONOUSLY,
     and until it resolves every read returns nothing. Booting before that is
     not merely a flash of an empty page — it is three worse things here:

       1. promptarium-backup.js would snapshot an empty store, so the copy
          taken "before anything is deleted" would be worthless at exactly
          the moment it is needed.
       2. wipeLegacy() would see no legacy keys, call the device a fresh
          install, and stamp the schema — leaving the old library in place
          forever once hydration finished.
       3. initCloudSync would pull and apply into an empty store.

     Every other page in this app already gates on ready() (see
     palaestra.html:1690). This one now does too. */
  function whenReady() {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot, boot);
    else boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();

})();
</script>
</body>
