<!DOCTYPE html>
<html lang="en" class="hd-root">
<head>
<!-- FIRST, AND NEVER DEFERRED. local-store-idb.js replaces
     window.localStorage wholesale before any other script runs, so
     promptarium-data.js keeps using plain localStorage unchanged.
     Every boot path is then gated on LocalStoreIDB.ready(). -->
<script src="local-store-idb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b0907">
<meta name="robots" content="noindex, nofollow">
<title>Prompt Studio</title>

<!-- =====================================================================
     THE SAME HOUSE AS THE ENTERTAINMENT STUDIO.

     This page wears HOUSE DAMULA — vault.html's skin — and it wears it
     by SHARING the stylesheet rather than copying it. vault-theme.css is
     linked here and its .hd-* classes are used verbatim; everything in
     promptarium-theme.css is something the vault has no equivalent for:
     this page's own hero crop, the short hero a detail route wears, the
     six-column library table, the prompt surface, the chain chips.

     Two studios on one stylesheet cannot drift. The consequence worth
     remembering is the other half of that sentence: AN EDIT TO
     vault-theme.css NOW CHANGES TWO PAGES.

     WHAT THIS REPLACED. Until now the page wore The Asclepion, by
     linking asclepion-theme.css. That link is gone and The Asclepion
     owns its sheet alone again. Specifically dead: Bodoni Moda, the
     .asc-hero block, the sticky .asc-bar with its tab switch and search
     field, the .asc-pop drop panels, and the whole .asc-* table
     vocabulary — all re-homed as pm-* in this page's own layer.

     WHAT DID NOT CHANGE: anything about the data. Same prm: prefix,
     same 'promptarium' appKey, same second cdx: mount, same §CODEX
     GATE, same routes. This is a presentation layer and nothing else.

     CORMORANT GARAMOND carries every title: it is the face in
     brand_assets/brand_guidelines/banner & title_text.jpg. INTER
     carries every letterspaced small cap. LINKED, never @import-ed —
     an @import cannot start downloading until the stylesheet has
     arrived and parsed, which puts the two requests in series behind
     the largest text on the page.
     ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault-theme.css?v=4">
<link rel="stylesheet" href="promptarium-theme.css?v=4">
<!-- Every view opens on this. Preloaded, because it is the largest
     paint on all of them. -->
<link rel="preload" as="image" href="images_by_admin/promptarium/hero-hall.webp" fetchpriority="high">
</head>
<body class="hd">

<a class="hd-skip" href="#pmView">Skip to the library</a>

<!-- ══ THE TOP BAR ═══════════════════════════════════════════
     A FLOATING PILL, CENTRED, with the wordmark in the middle of
     the links rather than off to one side. It sits ON the hero's
     photograph, which every view opens with, and takes a frosted
     ground of its own only once you have scrolled off it.

     THE TAB SWITCH LIVES HERE NOW. Prompts, Tools and Kept were
     buttons in a sticky toolbar; they are three PLACES with three
     hashes, and a place in this house is a word in the pill.

     The monogram and the wordmark are STATIC MARKUP; only the
     links are painted. A cloud pull that re-created the chrome
     could not replay the page's entrance, and the brand is the one
     thing that must never flicker. -->
<header class="hd-top" id="hdTop">
  <nav class="hd-pill" aria-label="Primary">
    <span class="hd-pill__side" id="hdNavL"></span>

    <a class="hd-brand" href="#/" aria-label="Prompt Studio — the prompts">
      <span class="hd-mono" aria-hidden="true">
        <svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="1.15"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- A P and an S, INTERLOCKED — the same hand as the vault's
               H and D, which share one stem. These two cannot share a
               stem, because an S has none; what they share instead is
               the P's bowl edge, which the S's upper curve starts
               against. Drawn at 34px, the gap between two letters set
               apart reads as two marks rather than one, which is why
               the S is pulled back to touch. The inner stroke at .42
               gives the bowl its thick/thin contrast at this size. -->
          <path d="M6.5 3.5v27"/>
          <path d="M6.5 3.5h6.6a6.8 7.1 0 0 1 0 14.2H6.5"/>
          <path d="M6.5 7.5h6.1a3.5 3.6 0 0 1 0 7.2H6.5" opacity=".42"/>
          <path d="M32.2 8.4a6.6 6.6 0 0 0-5-2.1c-3.2 0-5.3 1.8-5.3 4.2 0 5.5 10.8 3.1 10.8 9.4 0 2.9-2.6 4.9-6 4.9a7.6 7.6 0 0 1-5.7-2.5"/>
        </svg>
      </span>
      <span class="hd-word">Prompt Studio</span>

    <span class="hd-pill__side" id="hdNavR"></span>

<!-- ══ THE MARKS ═════════════════════════════════════════════
     One drawn vocabulary — circles, arcs and lines at 1.1 stroke —
     in the same register as the vault's shelf sigils, and
     deliberately NOT emoji: emoji in this room would undo the whole
     typographic argument, and they render as tofu in headless
     Chrome besides.

     Keyed by category id, and DRAWN ONCE. They used to be inlined
     per row, which on a four-hundred-row table is four hundred
     copies of the same path; they are referenced by <use> now.
     Both libraries share the ids they have in common, so "writing"
     is the same nib on a prompt and on a tool. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!-- a nib, and the stroke it has just made -->
<g id="pm-writing"><path d="M4.4 19.6l1-3.4L15 6.6a1.8 1.8 0 0 1 2.5 2.5L7.8 18.6z"/><path d="M13.4 8.2l2.4 2.4"/></g>
<!-- a ring, and a second one turning inside it -->
<g id="pm-thinking"><circle cx="12" cy="12" r="8.4"/><path d="M8.2 14.8a4.8 4.8 0 0 1 7.6-5.8"/></g>
<!-- a circle, and the line of sight leaving it -->
<g id="pm-research"><circle cx="10.4" cy="10.4" r="6.2"/><path d="M15 15l5 5"/></g>
<!-- ripples rising from a still point — The Asclepion's own breath -->
<g id="pm-selfcare"><circle cx="12" cy="16.4" r="2"/><path d="M6.6 12.6a7.6 7.6 0 0 1 10.8 0"/><path d="M3.4 8.8a12.1 12.1 0 0 1 17.2 0"/></g>
<!-- three rules, the last one short: a plan is never finished -->
<g id="pm-planning"><path d="M4.6 6.6h14.8M4.6 12h14.8M4.6 17.4h9"/></g>
<!-- a line, struck -->
<g id="pm-editing"><path d="M4.4 12h15.2"/><path d="M9 7.8l6 8.4"/></g>
<!-- two arcs opening from one spine -->
<g id="pm-learning"><path d="M12 6.8v11.8"/><path d="M12 6.8C10 5.4 7.2 5 4.6 5.4v11.8c2.6-.4 5.4 0 7.4 1.4"/><path d="M12 6.8c2-1.4 4.8-1.8 7.4-1.4v11.8c-2.6-.4-5.4 0-7.4 1.4"/></g>
<!-- a ring with one point on its orbit -->
<g id="pm-ai"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="3.6" r="1.3" fill="currentColor" stroke="none"/></g>
<!-- the mark you make when a thing is done -->
<g id="pm-productivity"><path d="M4.8 12.6l4.6 4.6L19.2 7.4"/></g>
<!-- a ring, playing -->
<g id="pm-media"><circle cx="12" cy="12" r="8.4"/><path d="M10.2 8.6L16 12l-5.8 3.4z"/></g>
<!-- two rings, and what they make where they meet -->
<g id="pm-design"><circle cx="9.4" cy="9.6" r="5.4"/><circle cx="14.6" cy="14.4" r="5.4"/></g>
<!-- a waveform -->
<g id="pm-audio"><path d="M3.6 12h1.8M8.2 7.8v8.4M12 4.8v14.4M15.8 8.8v6.4M19.8 10.8v2.4"/></g>
<!-- a camera, turned -->
<g id="pm-video"><path d="M4.2 7.6h10v8.8h-10z"/><path d="M14.2 12l5.6-3v6z"/></g>
<!-- a crosshair -->
<g id="pm-utilities"><path d="M12 3.6v16.8M3.6 12h16.8"/><circle cx="12" cy="12" r="2.6"/></g>
<!-- the null case: a ring, and nothing said about it -->
<g id="pm-other"><circle cx="12" cy="12" r="7.6"/></g>
<!-- The house ornament: a four-point star on a hairline. The one
     drawn flourish in either studio, and it marks exactly one
     thing — the middle of the footer. Drawn on the vault's own
     16-unit grid, unlike the marks above, which are 24. -->
<g id="sg-orn"><path d="M8 1.6 9.1 6.9 14.4 8 9.1 9.1 8 14.4 6.9 9.1 1.6 8 6.9 6.9Z"/></g>
</defs></svg>

<!-- The render host. The HERO IS INSIDE IT, which is the one place
     this page reverses an earlier decision: the hero used to be
     static markup precisely so a cloud pull could not destroy its
     entrance. The vault solved that problem rather than avoiding
     it — a repaint re-measures the hero for the parallax, it never
     runs while a field is focused or a sheet is open, and
     AscUI.rvlStyle() hands the re-created nodes a NEGATIVE --t so
     an entrance mid-flight resumes instead of replaying. Painting
     the hero is what lets each route's hero say its own name.

     .hd-main's negative top margin is load-bearing: the pill is
     sticky, so without it the bar takes 90px of FLOW and every
     page opens on a black band above the photograph. -->
<main class="hd-main" id="pmApp" tabindex="-1">
  <section id="pmView" aria-live="polite"></section>
</main>

<footer class="hd-foot" id="pmFoot">
  <p class="hd-foot__left">
    <span>&copy; Prompt Studio MMXXV</span>
    <span class="hd-foot__bar" aria-hidden="true"></span>
    <span>Filed by what you are trying to do</span>
  </p>
  <span class="hd-foot__orn" aria-hidden="true">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
      stroke-width="1" stroke-linejoin="round"><use href="#sg-orn"></use></svg>
  </span>
  <nav class="hd-foot__right" aria-label="The studio">
    <button type="button" data-go="#/settings">Your data</button>
    <a href="#/settings">Settings</a>
  </nav>
</footer>

<!-- ══ SEARCH ════════════════════════════════════════════════
     A glyph in the pill rather than a field. The references show a
     glyph, and a permanent input in a 90px editorial bar reads as
     an admin panel. It opens over the page, searches both
     libraries live, and Enter hands the query to whichever library
     you are in — where it becomes a token you can see and clear,
     so a filtered library can never be mistaken for an empty one. -->
<div class="hd-find" id="hdFind" role="dialog" aria-modal="true" aria-label="Search the library" hidden>
  <div class="hd-find__box">
    <div class="hd-find__field">

        <circle cx="8.6" cy="8.6" r="5.6"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
      <input id="hdFindIn" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search prompts and tools" aria-label="Search prompts and tools">
      <button type="button" class="hd-find__x" data-act="find-close">Esc</button>
    </div>
    <div class="hd-find__out" id="hdFindOut" role="listbox" aria-label="Results"></div>
  </div>
</div>

<!-- §STORAGE HEALTH and §UNDO — static markup outside #pmApp, so no
     view repaint can take them away while the condition they report
     is still true. FIXED to the bottom-left, because .hd-main's
     negative margin means anything static above it would sit under
     the hero and never be seen. -->
<div class="pm-notice" id="pmHealth" role="alert" hidden></div>
<div class="pm-notice" id="pmUndo" role="status" hidden></div>

<!-- The sheet and the toast carry The Asclepion's own ids, because
     asclepion-ui.js addresses them by id — #ascSheetBg / #ascSheet /
     #ascToast. Reusing the module means reusing its DOM contract.
     The vault does exactly the same. -->
<div class="asc-sheetbg" id="ascSheetBg"><div class="asc-sheet" id="ascSheet" role="dialog" aria-modal="true"></div></div>
<div class="asc-toast" id="ascToast" role="status" aria-live="polite"></div>

<button class="hd-fab" id="addFab" aria-label="Add a prompt">
  <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"></path></svg>
</button>

<!-- Loaded here, and NOT deferred. The inline script below registers
     cloud sync at parse time, and a deferred script would not have run
     yet at that point — sync.js and the data layers must already exist.
     topbar.js stays deferred: it self-injects.

     codex-data.js is loaded READ-WRITE on purpose. The fiction prompts
     are The Codex's own prompt database, and routing every fiction write
     through the Codex's own model function is what makes field drift
     impossible.

     promptarium-backup.js comes BEFORE promptarium-data.js so the wipe's
     "refuse to run without a snapshot" check has something to ask. -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<script src="codex-data.js"></script>
<!-- data-registry.js then snapshots.js, both BEFORE the backup adapter:
     the adapter is now a three-line call into the shared engine, and the
     engine asserts its prefix against the registry before it will build a
     store. Same loading mode as the adapter, or execution order is lost. -->
<script src="data-registry.js?v=1"></script>
<script src="snapshots.js?v=1"></script>
<script src="data-export.js?v=1"></script>
<script src="save-state.js?v=1"></script>
<script src="trash.js?v=1"></script>
<script src="shrink-banner.js?v=1"></script>
<script src="promptarium-backup.js?v=1"></script>
<!-- Generic machinery, shared rather than copied: escaping, the drawn
     marks, the resumable entrance clock, the sheet, the toast. Its own
     header says it best — "Nothing in here knows about the data layer."
     It carries no styles either, which is why vault-theme.css has to
     define every .asc-* class it emits. The vault loads it too. -->
<script src="asclepion-ui.js?v=3"></script>
<script src="promptarium-data.js?v=2"></script>
<script src="topbar.js?v=6" defer></script>


<script>
(function () {
  'use strict';

  // ============================================================
  // §UTIL
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function D() { return window.Promptarium; }
  function C() { return window.CodexData || null; }
  function B() { return window.PromptariumBackup || null; }
  function esc(s) { return D().esc(s); }

  /* Delegated binding. Every renderer below paints innerHTML and re-binds,
     so handlers must never be attached to nodes that are about to be
     replaced — they attach to the host.

     The host, however, SURVIVES those repaints, so binding blindly would
     stack a fresh listener on every render and fire one click N times.
     Each (event, selector) pair is therefore registered once per host.
     The cost of that: a handler must never close over view data, because
     it will still be the FIRST render's copy on the hundredth render.
     Read state from the store inside the handler instead. */
  function on(root, sel, evt, fn) {
    if (!root) return;
    var key = evt + '|' + sel;
    root.__pmOn = root.__pmOn || {};
    if (root.__pmOn[key]) return;
    root.__pmOn[key] = true;
    root.addEventListener(evt, function (e) {
      var t = e.target.closest(sel);
      if (t && root.contains(t)) fn.call(t, e);
    }, evt === 'blur' || evt === 'focus');
  }
  /* A card body sits in a flex row beside real controls, so it cannot be
     a <button> without breaking the layout it needs. This gives a div the
     same keyboard behaviour. */
  function actAsButton(root, sel, fn) {
    on(root, sel, 'click', fn);
    on(root, sel, 'keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn.call(this, e); }
    });
  }

  var toastTimer = null;
  function toast(msg, bad) {
    var el = $("ascToast");
    el.textContent = msg;
    el.classList.toggle('is-bad', !!bad);
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-on'); }, bad ? 4200 : 2000);
  }

  /* A renderer that throws used to take the whole page down with it. One
     that throws now says so in place, rather than leaving a blank screen
     with the reason only in the console. */
  function runSafely(fn, where) {
    try { fn(); }
    catch (e) {
      try { console.error('[Prompt Studio] ' + where, e); } catch (e2) {}
      toast('Something went wrong drawing this view', true);
    }
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  /* navigator.clipboard is unavailable on an insecure origin and refused
     when the document is not focused, and both happen in normal use. The
     textarea path is the fallback, not the primary. */
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { resolve(true); },
          function () { resolve(legacyCopy(text)); }
        );
        return;
      }
      resolve(legacyCopy(text));
    });
  }

  // ============================================================
  // §STATE
  //
  // What a library shows. `q` is deliberately NOT persisted: a search
  // term is about this minute, and restoring one on the next visit would
  // make the page look empty for no reason.
  //
  // `pop` went with the drop panels — see §CHROME. The two filters are
  // native <select>s now and hold their own open state.
  //
  // `shut` is the list of folded category groups, keyed by tab so the
  // two libraries fold independently.
  // ============================================================
  var TABS = ['prompts', 'tools', 'kept'];
  var ui = { tab: 'prompts', q: '', cat: 'all', favOnly: false,
             group: 'category', shut: [], promptsShut: [] };

  /* The scroll handler, assigned once by wireChrome(). It lives up here
     because render() has to call it: a repaint replaces the hero node,
     and the handler would otherwise go on measuring an element that is
     no longer in the document. */
  var readScroll = null;

  function loadUi() {
    var s = D().getUiState();
    if (TABS.indexOf(s.tab) !== -1) ui.tab = s.tab;
    if (typeof s.cat === 'string') ui.cat = s.cat;
    if (s.group && GROUPINGS[s.group]) ui.group = s.group;
    if (Array.isArray(s.shut)) ui.shut = s.shut.slice();
    if (Array.isArray(s.promptsShut)) ui.promptsShut = s.promptsShut.slice();
    ui.favOnly = !!s.favOnly;
  }
  function saveUi() {
    D().setUiState({ tab: ui.tab, cat: ui.cat, favOnly: ui.favOnly,
                     group: ui.group, shut: ui.shut,
                     /* Uids, and nothing but uids. prm:uiState syncs, so
                        this list reaches the phone — which is the point,
                        and also the reason not to let anything else in. */
                     promptsShut: ui.promptsShut });
  }

  /* WHICH PROMPTS ARE OPEN IN THE LIST, and deliberately NOT in `ui` —
     so it is never written to prm:uiState. An expanded prompt is about
     this minute, the same reason the search term is not kept.

     It is a variable rather than just a class on the DOM because a cloud
     pull calls render() at a moment nobody chose, and a prompt you are
     halfway through reading has to survive that repaint. */
  /* A PROMPT'S TEXT IS SHOWN BY DEFAULT, as of 2026-09-04. It used to be
     hidden until you pressed the chevron, and the list underneath showed
     the NOTE instead — which meant finding a prompt by its wording took a
     click per prompt. The library is the prompts; showing them is the job.

     SO THE STATE INVERTED. `openPeek` was a list of what was open and
     lived only in memory, on the argument that reading is not a
     preference. `ui.promptsShut` is a list of what is CLOSED and it is
     persisted to prm:uiState beside ui.shut, which has always worked
     exactly this way for group folds — because deciding a particular
     prompt is too long to sit open IS a preference, and having to decide
     it again on every visit is not.

     Long prompts are handled in CSS, by height, not here by counting
     characters: a character count cuts in a different place at every
     font size, and this page's type is fluid. See .pm-peek__body. */
  function isShut(uid) { return ui.promptsShut.indexOf(uid) !== -1; }
  /* A uid carries a colon (`prm:pp_x`). Legal in an id, awkward in every
     selector that might later be pointed at one, so it is spent here. */
  function peekId(uid) { return 'pmPeek-' + String(uid).replace(/[^A-Za-z0-9_-]/g, '-'); }

  /* FLIPPED IN PLACE, not repainted. Every row carries an entrance
     stagger, so re-rendering the list to close one prompt would make the
     whole library flicker through its reveal again. The repaint is the
     fallback for the case where the row has gone. */
  function togglePeek(uid) {
    var i = ui.promptsShut.indexOf(uid), open = i !== -1;   // it was shut, so this OPENS it
    if (open) ui.promptsShut.splice(i, 1); else ui.promptsShut.push(uid);
    saveUi();
    var panel = document.getElementById(peekId(uid));
    var btn = document.querySelector('[data-peek="' + uid + '"]');
    if (!panel || !btn) { renderCurrentList(); return; }
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label',
      (open ? 'Hide' : 'Show') + ' the text of ' + (btn.getAttribute('data-peek-name') || 'this prompt'));
    // It had no layout while it was hidden, so it could not be measured
    // at the last paint. Measure it now that it has one.
    if (open) markClamped(panel.parentNode);
  }

  /* WHICH PROMPTS ARE ACTUALLY LONG. The clamp itself is CSS — a
     max-height of ten lines on .pm-peek__body — because whether a prompt
     is long is a question about rendered height at the current font
     size, and this page's type is fluid. What CSS cannot do is notice
     that the text overflowed, so the "Show all" is revealed from here.

     READ EVERY HEIGHT FIRST, THEN WRITE EVERY CLASS. Interleaving them
     is a forced reflow per prompt, and this library is four hundred
     prompts; batched, the whole pass costs one layout. That is the
     difference between a paint you notice and one you do not.

     A hidden panel has no layout at all (scrollHeight 0), so a prompt
     whose text is collapsed is skipped rather than measured as short —
     it gets measured when it opens. */
  function markClamped(root) {
    var host = root || $('pmView');
    if (!host) return;
    var panels = host.querySelectorAll('.pm-peek:not([hidden])');
    if (!panels.length) return;
    var reads = [];
    panels.forEach(function (panel) {
      var body = panel.querySelector('.pm-peek__body');
      // is-full removes the max-height, so a released prompt would
      // always measure as "not overflowing" and lose its own control.
      if (!body || panel.classList.contains('is-full')) return;
      reads.push([panel, body.scrollHeight - body.clientHeight > 2]);
    });
    reads.forEach(function (r) { r[0].classList.toggle('is-long', r[1]); });
  }

  /* THE CLAMP RELEASE, and deliberately NOT persisted — unlike the
     collapse above. "This prompt is long and I want it out of my way
     every time" is a preference; "show me the rest of this one, now" is
     about this minute, which is what the old note about openPeek was
     right about. It is a class on the panel and nothing else. */
  function toggleFull(uid) {
    var panel = document.getElementById(peekId(uid));
    if (!panel) return;
    var on = panel.classList.toggle('is-full');
    var btn = panel.querySelector('[data-full]');
    if (btn) {
      btn.textContent = on ? 'Show less' : 'Show all';
      btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    }
    // Folding it back up: re-measure this one, so a prompt that is only
    // just over ten lines keeps its control instead of losing it.
    if (!on) markClamped(panel.parentNode);
  }

  // ============================================================
  // §CODEX GATE
  //
  // Carried over from the previous build unchanged, because the hazard it
  // guards is unchanged.
  //
  // sync.js pushes by REPLACING the whole row: pushNow() collects every
  // matching localStorage key and upserts it as the row's entire data
  // column. So if this page wrote any cdx: key before the codex row had
  // been pulled down here, the 250ms debounce would overwrite the Codex's
  // whole row with a partial set — taking cdx:trilogies, cdx:chapters and
  // cdx:scenes with it. The manuscripts.
  //
  // Hence: EVERY cdx: mutation on this page goes through codexWrite() or
  // codexTry(). Both check codexWritable() first; they differ only in
  // whether a refusal is announced. The invariant to check in review is
  // that `C().Prompts.`, `C().PromptNotes.` and `C().removePrompt`
  // appear nowhere except inside one of those two callbacks.
  // ============================================================
  var gate = { mounted: false, applied: false, graceOver: false, unlocked: false };

  function cdxKeyCount() {
    var n = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('cdx:') === 0) n++;
      }
    } catch (e) {}
    return n;
  }
  function codexWritable() {
    return gate.mounted
      && (gate.applied || gate.graceOver)
      && navigator.onLine !== false
      && (cdxKeyCount() > 0 || gate.unlocked);
  }
  /* Why the gate is shut, in words, for the banner on a fiction prompt. */
  function gateReason() {
    if (!gate.mounted) return 'Cloud sync did not start on this page, so the fiction library cannot be reached. Fiction prompts are read-only.';
    if (!gate.applied && !gate.graceOver) return 'Still loading the fiction library.';
    if (navigator.onLine === false) return 'You are offline. Fiction prompts stay read-only until the connection returns, so a partial write cannot overwrite the fiction library.';
    if (cdxKeyCount() === 0 && !gate.unlocked) return 'None of the fiction library has arrived on this device yet. Fiction prompts stay read-only until it loads: an empty library and a failed load look identical from here, and guessing wrong would overwrite your manuscripts.';
    return '';
  }
  function codexWrite(fn) {
    if (!codexWritable()) { toast('The fiction library has not finished loading', true); return false; }
    try { fn(); } catch (e) {
      try { console.error('[Prompt Studio] codex write failed', e); } catch (e2) {}
      toast('That fiction edit did not save', true);
      return false;
    }
    return true;
  }
  /* The silent sibling, for writes nobody asked for. A usage counter must
     not warn on a copy that worked, and must never block one: copying is a
     read, and the count is bookkeeping. Same gate, no toast. */
  function codexTry(fn) {
    if (!codexWritable()) return false;
    try { fn(); return true; } catch (e) { return false; }
  }

  // ============================================================
  // §PV — the unified prompt view.
  //
  // Every renderer and filter below works on ONE normalized shape, so a
  // fiction prompt and a native prompt are the same object to the UI.
  // Nothing outside this section touches window.CodexData.
  // ============================================================
  function cdxPromptList() {
    var c = C();
    if (!c || !c.Prompts) return [];
    try { return c.Prompts.list(); } catch (e) { return []; }
  }
  function normPrm(p) {
    return {
      uid: 'prm:' + p.id, src: 'prm', id: p.id, raw: p,
      title: p.title, text: p.text, category: p.category, tags: p.tags || [],
      compat: p.compat, favorite: !!p.favorite, notes: p.notes || '',
      useCount: p.useCount || 0, lastUsedAt: p.lastUsedAt || '',
      createdAt: p.createdAt, updatedAt: p.updatedAt || p.createdAt,
      fiction: false, editable: true
    };
  }
  /* Notes on a fiction prompt are the Codex's own note records. The first
     is treated as "the note"; any others the Codex may have made are left
     alone rather than silently merged or dropped. */
  function cdxFirstNote(promptId) {
    var c = C();
    if (!c || !c.notesForPrompt) return null;
    try { var n = c.notesForPrompt(promptId); return n.length ? n[0] : null; } catch (e) { return null; }
  }
  function cdxNoteBody(promptId) {
    var n = cdxFirstNote(promptId);
    return n ? (n.body || '') : '';
  }
  /* The Codex's record carries only its own sixteen fields. Category comes
     from the sidecar; compat rides on modelHint, which IS one of those
     sixteen, so it round-trips without a sidecar entry; the star is the
     Codex's own `favorite`, shared both ways on purpose. */
  function normCdx(p, writable) {
    var m = D().fictionMetaFor(p.id);
    var hint = String(p.modelHint || '').toLowerCase();
    return {
      uid: 'cdx:' + p.id, src: 'cdx', id: p.id, raw: p,
      title: p.title, text: p.text, category: m.category, tags: p.tags || [],
      compat: ['claude', 'chatgpt', 'either'].indexOf(hint) >= 0 ? hint : '',
      favorite: !!p.favorite,
      /* NOT read here. A listing calls this once per fiction prompt, and
         reading the note would re-parse the whole cdx:promptNotes array
         that many times to fill a field no listing shows. The detail view
         asks for it with noteFor() instead. */
      notes: '',
      useCount: p.useCount || 0, lastUsedAt: p.lastUsedAt || '',
      createdAt: p.createdAt, updatedAt: p.updatedAt || p.createdAt,
      fiction: true, editable: writable
    };
  }
  /* The note, read on demand. A native prompt carries its own; a fiction
     prompt's is the Codex's first note record for it. */
  function noteFor(v) { return v.src === 'cdx' ? cdxNoteBody(v.id) : v.notes; }

  function pvAll() {
    var out = D().Prompts.list().map(normPrm);
    if (D().getSettings().showFiction) {
      // Hoisted: codexWritable() sweeps every localStorage key, and asking
      // it once per prompt would make that sweep O(prompts x keys) on
      // every render.
      var writable = codexWritable();
      cdxPromptList().forEach(function (p) { out.push(normCdx(p, writable)); });
    }
    return out;
  }
  function pvGet(uid) {
    var all = pvAll();
    for (var i = 0; i < all.length; i++) if (all[i].uid === uid) return all[i];
    return null;
  }

  function writeCdxNote(promptId, body) {
    var existing = cdxFirstNote(promptId);
    if (!existing && !body) return true;                 // nothing to write, nothing to clear
    return codexWrite(function () {
      if (existing) C().PromptNotes.update(existing.id, { body: body });
      else C().PromptNotes.add({ promptId: promptId, title: 'Note', body: body, order: 0 });
    });
  }
  /* Splits a patch by destination. The Codex's promptModel is a whitelist
     re-run on every update, so anything outside CDX_PROMPT_FIELDS would be
     silently stripped the next time the Codex touched the record. */
  function pvPatch(uid, patch) {
    var d = D(), v = pvGet(uid);
    if (!v) return false;
    if (v.src === 'prm') { d.Prompts.update(v.id, patch); return true; }

    var cdx = {}, sidecar = {}, noteBody = null;
    Object.keys(patch).forEach(function (k) {
      if (k === 'category') sidecar.category = patch[k];
      else if (k === 'compat') cdx.modelHint = patch[k];
      else if (k === 'notes') noteBody = String(patch[k] == null ? '' : patch[k]);
      else if (k === 'text') { cdx.text = patch[k]; cdx.variables = d.detectVariables(patch[k]); }
      else cdx[k] = patch[k];
    });
    if (Object.keys(sidecar).length) d.setFictionMeta(v.id, sidecar);
    if (noteBody !== null && !writeCdxNote(v.id, noteBody)) return false;
    if (!Object.keys(cdx).length) return true;
    if (!d.assertCodexFields(cdx, 'pvPatch(' + uid + ')')) return false;
    return codexWrite(function () { C().Prompts.update(v.id, cdx); });
  }
  function pvRemove(uid) {
    var d = D(), v = pvGet(uid);
    if (!v) return false;
    if (v.src === 'prm') { d.removePrompt(v.id); return true; }
    var ok = codexWrite(function () { C().removePrompt(v.id); });
    if (ok) { d.dropFictionMeta(v.id); d.dropFromCollections('prompt', uid); }
    return ok;
  }
  /* Copy is a READ, so it must work even while the gate is shut. Only the
     usage counter is a write, and it is best-effort — never block a copy
     on it. */
  function pvTouch(uid) {
    var d = D(), v = pvGet(uid);
    if (!v) return;
    var patch = { useCount: (v.useCount || 0) + 1, lastUsedAt: d.nowISO() };
    if (v.src === 'prm') { d.Prompts.update(v.id, patch); return; }
    codexTry(function () { C().Prompts.update(v.id, patch); });
  }

  // ============================================================
  // §FILTER — the one rule that keeps this page from becoming the last
  // one: the moment a search term or a non-"All" pill is active, the
  // library collapses to a single result list. No sections, no
  // Frequently Used, no Recent. Sections are for browsing; a query is
  // not browsing.
  // ============================================================
  function isFiltering() { return !!ui.q.trim() || ui.cat !== 'all' || ui.favOnly; }

  function matchPrompt(p, q) {
    if (!q) return true;
    var hay = (p.title + ' ' + p.text + ' ' + (p.tags || []).join(' ') + ' ' + (p.notes || '')).toLowerCase();
    return q.split(/\s+/).every(function (word) { return hay.indexOf(word) >= 0; });
  }
  function matchTool(t, q) {
    if (!q) return true;
    var hay = (t.name + ' ' + t.url + ' ' + t.useFor + ' ' + (t.tags || []).join(' ')).toLowerCase();
    return q.split(/\s+/).every(function (word) { return hay.indexOf(word) >= 0; });
  }
  function filteredPrompts() {
    var q = ui.q.trim().toLowerCase();
    return pvAll().filter(function (p) {
      if (ui.favOnly && !p.favorite) return false;
      if (ui.cat !== 'all' && p.category !== ui.cat) return false;
      return matchPrompt(p, q);
    });
  }
  function filteredTools() {
    var q = ui.q.trim().toLowerCase();
    return D().Tools.list().filter(function (t) {
      if (ui.favOnly && !t.favorite) return false;
      if (ui.cat !== 'all' && t.category !== ui.cat) return false;
      return matchTool(t, q);
    });
  }
  function byRecent(a, b) {
    return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
  }
  function byUse(a, b) {
    var d = (b.useCount || 0) - (a.useCount || 0);
    return d !== 0 ? d : String(a.title || a.name || '').localeCompare(String(b.title || b.name || ''));
  }

  // ============================================================
  // §PIECES — the small HTML builders.
  //
  // There used to be four surfaces here: a card, a row, a tile and a
  // collection card. There is one table now, and the same row draws a
  // prompt and a tool, which is what keeps a record looking like itself
  // whether you meet it on the home page, inside a search, or as step
  // three of a workflow.
  //
  // Nothing here draws a rule between rows for decoration. Separation is
  // a gold hairline and space — see §THE LIBRARY TABLE in
  // promptarium-theme.css.
  // ============================================================
  function U() { return window.AscUI; }
  function hueOf(kind, id) { return D().catById(kind, id).hue; }
  function catLabel(kind, id) { return D().catById(kind, id).label; }

  /* THE MARKS. One drawn vocabulary — circles, arcs and lines at 1.1
     stroke — in the same register as the vault's shelf sigils, and
     deliberately NOT emoji: emoji in this room would undo the whole
     typographic argument, and they render as tofu in headless Chrome
     besides.

     THE PATHS THEMSELVES LIVE IN THE DOCUMENT, once, in the <defs>
     block at the top of the body; this returns a <use> of one. They
     used to be inlined per row, which across a four-hundred-row table
     is four hundred copies of the same geometry in the markup.

     KEYED BY CATEGORY ID, and the list of ids is checked rather than
     assumed: a <use> pointing at an id that is not in the document
     renders as NOTHING AT ALL, which is a blank gutter rather than a
     visible error. An unknown category falls back to the null mark,
     exactly as the old lookup did. */
  var PM_MARK_IDS = {
    writing: 1, thinking: 1, research: 1, selfcare: 1, planning: 1,
    editing: 1, learning: 1, ai: 1, productivity: 1, media: 1,
    design: 1, audio: 1, video: 1, utilities: 1, other: 1
  };
  function pmMark(cat) {
    var id = PM_MARK_IDS[cat] ? cat : 'other';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<use href="#pm-' + id + '"></use></svg>';
  }

  /* Kept. The drawn heart, on this page's own control class.

     THE VAULT USES A STAR HERE and this does not, which is the one
     glyph the two studios do not share. "Kept" is a place in this
     page's nav — it has a tab of its own — and a star at the end of
     every row would be naming something else. The BOX is identical:
     .pm-heart is .hd-chip's geometry, states and hover, so the control
     reads as the same control in both houses. */
  function heartBtn(id, on, name) {
    return '<button type="button" class="pm-heart' + (on ? ' is-on' : '') + '"' +
      ' data-fav="' + esc(id) + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
      ' aria-label="' + esc((on ? 'Remove ' : 'Keep ') + name) + '">' +
      U().mark('heart') + '</button>';
  }

  /* THE CHEVRON THAT OPENS A PROMPT UNDER ITS OWN ROW. .pm-ico, the
     same box as the ⋯ beside it, because that class already resets the
     browser's chrome — a bare <button> in this table renders as a
     white slab.
     aria-controls ties the disclosure to the thing it discloses, so a
     screen reader hears them as one control and not two siblings. */
  function peekBtn(uid, open, pid, name) {
    return '<button type="button" class="pm-ico pm-peek__t" data-peek="' + esc(uid) + '"' +
      ' data-peek-name="' + esc(name) + '"' +
      ' aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="' + esc(pid) + '"' +
      ' aria-label="' + esc((open ? 'Hide' : 'Show') + ' the text of ' + name) + '">&#9662;</button>';
  }

  /* A SIBLING of the row, never a child. .pm-row is itself a six-column
     grid, and a different, named-area one on a phone, so a panel inside
     it would have to be placed in BOTH — and would sit inside the row's
     own hover surface while it was at it.
     The text is typeset with .pm-prompt-text, the same class the prompt's
     own page uses, so a prompt reads identically wherever you open it. */
  function peekPanel(p, open, pid) {
    return '<div class="pm-peek" id="' + esc(pid) + '"' + (open ? '' : ' hidden') + ' role="row"' +
      ' style="--pm-tint:' + hueOf('prompt', p.category) + '">' +
      '<div class="pm-prompt-text pm-peek__body" role="cell" tabindex="0">' +
        markVars(p.text || 'This prompt has no text yet.') +
      '</div>' +
      /* THE CLAMP RELEASE, always in the markup and never gated on a
         character count: whether a prompt is "long" is a question about
         rendered height at the current font size, and CSS is the only
         thing that knows the answer. .pm-peek__more is revealed by the
         clamp itself, so on a short prompt it simply never shows. */
      '<div class="pm-peek__more" role="cell">' +
        '<button type="button" class="pm-more" data-full="' + esc(p.uid) + '"' +
          ' aria-expanded="false">Show all</button>' +
      '</div>' +
    '</div>';
  }

  /* ── §THE GROUP PILL ────────────────────────────────────────
     Read frame by frame off the "List 2" / "Case 1" buttons in
     Downloads/original-9f68406c143b928315bc24ad1ae397a1.mp4: a fully
     rounded capsule, a vertical gradient in its own hue, near-black
     text, and a soft glow of the same hue under it.

     ONE BUILDER, THREE PLACES — the row's Group cell, the group header
     bar, and a prompt's own page. All three read --pm-tint, so
     recolouring a group is one write and every surface follows; that is
     the same lever that let the vault re-ground itself three times in a
     day for one token block.

     It is a BUTTON on a row (pressing it filters the library to that
     group) and a plain span in the header bar, where the bar itself is
     already the control. A button inside a button is not valid HTML and
     the browser's repair of it is not something to rely on. */
  function groupPill(kind, catId, asButton) {
    var c = D().catById(kind, catId);
    var inner = '<span class="pm-pill__dot" aria-hidden="true"></span>' + esc(c.label);
    if (!asButton) {
      return '<span class="pm-pill" style="--pm-tint:' + c.hue + '">' + inner + '</span>';
    }
    return '<button type="button" class="pm-pill pm-pill--btn" style="--pm-tint:' + c.hue + '"' +
      ' data-cat="' + esc(c.id) + '" title="Show only ' + esc(c.label) + '">' + inner + '</button>';
  }

  function sectionHead(label, note) {
    return '<div class="pm-sec__head">' +
      '<h2 class="hd-eyebrow">' + esc(label) + '</h2>' +
      (note ? '<span class="pm-sec__note">' + esc(note) + '</span>' : '') +
    '</div>';
  }

  // --- the table ------------------------------------------------
  //
  // ONE COLUMN SET NOW. There used to be two — grouped by category the
  // second column showed a count, because a column that repeats the
  // heading above it is a column doing nothing.
  //
  // That rule lost to a better one on 2026-09-04: Damian asked for the
  // group to travel WITH the prompt, as a pill, wherever he meets it. A
  // pill that disappears exactly when you are browsing by group is a
  // pill you cannot rely on, and half the point of it is that you can
  // press it to filter. So Group is unconditional, and the count moved
  // in beside the date, which is what freed the column.
  var COLS = {
    prompt: ['Prompt', 'Group', 'Model', 'Used'],
    tool:   ['Tool', 'Group', 'Site', 'Opened']
  };
  /* The Kept tab never groups: its two libraries ARE its sections, and
     category grouping across both would stack headings that mean
     different things — the two vocabularies share ids, so one "writing"
     heading would be two different groups. colsRow() reads this as well
     as tableHTML(), which is why it is answered here and not in the
     view: a flat list under grouped headings names the wrong columns. */
  function grouped() { return ui.tab !== 'kept' && GROUPINGS[ui.group].group; }

  function colsRow(kind) {
    return '<div class="pm-thead" role="row">' +
      COLS[kind === 'tool' ? 'tool' : 'prompt'].map(function (c) {
        return '<span class="asc-label" role="columnheader">' + esc(c) + '</span>';
      }).join('') +
      '<span class="asc-label" role="columnheader"><span class="hd-sr">Actions</span></span>' +
      '<span class="asc-label" role="columnheader"><span class="hd-sr">Kept</span></span>' +
    '</div>';
  }

  /* One row builder per library, and the same five parts in both: a name
     with a description under it, three facts, the verb, and the heart. So
     they share one grid and one set of rules.

     THE NAME IS A BUTTON (or, for a tool, a link), and the verb and the
     heart are its SIBLINGS, never inside it: a button inside a button is
     not valid HTML and the browser's repair of it is not something to
     rely on. */
  /* ONE PROMPT IS ONE BLOCK. The row and its text used to be two
     siblings separated from the next prompt by a hairline, which was
     right while the text was hidden and a row was one line tall. Now
     that every prompt carries its text, a row is a paragraph tall, and a
     hairline between paragraphs does not say where one prompt ends.

     So the two are wrapped in .pm-item — still SIBLINGS inside it, never
     nested, because .pm-row is a six-column grid and .pm-peek would have
     to be placed in that grid (and again in the phone's named-area one)
     if it were a child. The wrapper carries the border, the tint edge
     and the hover; the grid inside it is untouched.

     THE SECOND COLUMN IS THE GROUP PILL, always — see COLS. The use
     count moved in beside the date, which is what freed the column. */
  function promptRow(p, i) {
    var last = p.lastUsedAt ? D().fmtAgo(p.lastUsedAt) : '';
    var open = !isShut(p.uid), pid = peekId(p.uid);
    var used = [p.useCount ? p.useCount + '\u00d7' : '', last].filter(Boolean).join(' \u00b7 ');
    return '<div class="pm-item ' + U().rvlClass() + '"' + U().rvlStyle(i) +
      ' style="--pm-tint:' + hueOf('prompt', p.category) + '">' +
      '<div class="pm-row" role="row">' +
        '<button type="button" class="pm-row__name" role="cell" data-open="' + esc(p.uid) + '">' +
          '<span class="pm-row__mark" aria-hidden="true">' + pmMark(p.category) + '</span>' +
          '<span class="pm-row__text">' +
            '<span class="pm-row__title">' + esc(p.title) + '</span>' +
            (noteFor(p) ? '<span class="pm-row__desc">' + esc(noteFor(p)) + '</span>' : '') +
          '</span>' +
        '</button>' +
        '<div class="pm-row__meta">' +
          '<span class="pm-cell pm-cell--pill" role="cell">' +
            groupPill('prompt', p.category, true) +
            (p.fiction ? '<span class="pm-fic" title="In the fiction library">&#10086;</span>' : '') +
          '</span>' +
          '<span class="pm-cell pm-cell--quiet" role="cell">' + esc(D().compatLabel(p.compat)) + '</span>' +
          '<span class="pm-cell ' + (used ? 'pm-cell--quiet' : 'pm-cell--never') + '" role="cell">' +
            esc(used) + '</span>' +
        '</div>' +
        '<span class="pm-row__do" role="cell">' +
          '<button type="button" class="pm-start" data-copy="' + esc(p.uid) + '">Copy</button>' +
          peekBtn(p.uid, open, pid, p.title) +
          '<button type="button" class="pm-ico" data-menu="' + esc(p.uid) + '"' +
            ' aria-label="More actions for ' + esc(p.title) + '">&#8943;</button>' +
        '</span>' +
        '<span class="pm-row__kept" role="cell">' + heartBtn(p.uid, p.favorite, p.title) + '</span>' +
      '</div>' +
      peekPanel(p, open, pid) +
    '</div>';
  }

  /* The tool row takes the same wrapper and the same pill, so the two
     tables read as one system — but a tool has no text panel, so
     .pm-item holds a row and nothing else. Tool categories are still the
     frozen constant: only the PROMPT groups are editable, which is what
     was asked for. */
  function toolRow(t, i) {
    var host = D().hostOf(t.url);
    var last = t.lastOpenedAt ? D().fmtAgo(t.lastOpenedAt) : '';
    var used = [t.useCount ? t.useCount + '\u00d7' : '', last].filter(Boolean).join(' \u00b7 ');
    return '<div class="pm-item pm-item--flat ' + U().rvlClass() + '"' + U().rvlStyle(i) +
      ' style="--pm-tint:' + hueOf('tool', t.category) + '">' +
      '<div class="pm-row" role="row">' +
        '<a class="pm-row__name" role="cell" href="' + esc(t.url || '#') + '" target="_blank"' +
          ' rel="noopener noreferrer" data-launch="' + esc(t.id) + '">' +
          '<span class="pm-row__mark" aria-hidden="true">' + pmMark(t.category) + '</span>' +
          '<span class="pm-row__text">' +
            '<span class="pm-row__title">' + (t.icon ? esc(t.icon) + ' ' : '') + esc(t.name) + '</span>' +
            (t.useFor ? '<span class="pm-row__desc">' + esc(t.useFor) + '</span>' : '') +
          '</span>' +
        '</a>' +
        '<div class="pm-row__meta">' +
          '<span class="pm-cell pm-cell--pill" role="cell">' + groupPill('tool', t.category, false) + '</span>' +
          '<span class="pm-cell pm-cell--quiet" role="cell">' + esc(host) + '</span>' +
          '<span class="pm-cell ' + (used ? 'pm-cell--quiet' : 'pm-cell--never') + '" role="cell">' +
            esc(used) + '</span>' +
        '</div>' +
        '<span class="pm-row__do" role="cell">' +
          '<button type="button" class="pm-start" data-tool="' + esc(t.id) + '">Details</button>' +
          '<button type="button" class="pm-ico" data-toolmenu="' + esc(t.id) + '"' +
            ' aria-label="More actions for ' + esc(t.name) + '">&#8943;</button>' +
        '</span>' +
        '<span class="pm-row__kept" role="cell">' + heartBtn(t.id, t.favorite, t.name) + '</span>' +
      '</div>' +
    '</div>';
  }

  /* The table. Grouped by category, or one flat run in a chosen order —
     "most used", "recently updated" and "name" are the three sections
     this page used to stack above the list, which is all those sections
     ever were. */
  function tableHTML(kind, records) {
    var draw = kind === 'tool' ? toolRow : promptRow;
    var out = colsRow(kind);
    var n = 0;

    if (!grouped()) {
      out += '<div class="pm-group__body">' +
        sortRecords(records).map(function (r) { return draw(r, n++); }).join('') + '</div>';
      return out;
    }

    /* THE GROUP BAR, read off the grouping rows in the reference film:
       a chevron, the word, the PILL, the count, and what share of the
       library this group is. The share is the part worth having —
       "twelve prompts" means nothing until you know whether that is most
       of the library or a corner of it.

       On the prompts side it also carries a ⋯: renaming, recolouring and
       deleting a group belong where you are looking AT the group, not
       three clicks away in Settings. It is a SIBLING of the fold button,
       never inside it — a button inside a button is not valid HTML and
       the browser's repair of it is not something to rely on. */
    var total = records.length || 1;
    groupByCategory(kind, records).forEach(function (b) {
      var shut = ui.shut.indexOf(ui.tab + ':' + b.key) !== -1;
      var share = Math.round((b.rows.length / total) * 100);
      out += '<section class="pm-group' + (shut ? ' is-shut' : '') +
        '" style="--pm-tint:' + b.hue + '">' +
        '<div class="pm-group__bar">' +
          '<button type="button" class="pm-group__head" data-fold="' + esc(b.key) + '"' +
            ' aria-expanded="' + (shut ? 'false' : 'true') + '">' +
            '<span class="pm-group__fold" aria-hidden="true">&#9662;</span>' +
            '<span class="pm-group__label">' + (kind === 'tool' ? 'Category' : 'Group') + '</span>' +
            groupPill(kind, b.key, false) +
            '<span class="pm-group__count">' +
              esc(U().plural(b.rows.length, kind === 'tool' ? 'tool' : 'prompt')) + '</span>' +
            '<span class="pm-group__share" aria-hidden="true"><i style="--w:' + share + '%"></i></span>' +
            '<span class="pm-group__pct">' + share + '%</span>' +
          '</button>' +
          (kind === 'tool' ? '' :
            '<button type="button" class="pm-ico pm-group__edit" data-groupmenu="' + esc(b.key) + '"' +
              ' aria-label="Edit the group ' + esc(b.label) + '">&#8943;</button>') +
        '</div>' +
        '<div class="pm-group__body">' +
          b.rows.map(function (r) { return draw(r, n++); }).join('') +
        '</div>' +
      '</section>';
    });
    return out;
  }

  function byName(a, b) {
    return String(a.title || a.name || '').localeCompare(String(b.title || b.name || ''));
  }
  function sortRecords(list) {
    var out = list.slice();
    if (ui.group === 'used')   return out.sort(byUse);
    if (ui.group === 'recent') return out.sort(byRecent);
    return out.sort(byName);
  }

  /* Category order comes from the vocabulary, not from the data, so the
     groups do not reshuffle as records are added. A category with nothing
     in it is not drawn at all. */
  function groupByCategory(kind, records) {
    var buckets = {};
    records.forEach(function (r) { (buckets[r.category] = buckets[r.category] || []).push(r); });
    return D().catList(kind).filter(function (c) { return buckets[c.id] && buckets[c.id].length; })
      .map(function (c) {
        return { key: c.id, label: c.label, hue: c.hue, rows: buckets[c.id].sort(byName) };
      });
  }

  /* Quick Launch is the loudest thing on the tools page on purpose: four
     to eight tiles, one click, no scrolling. Everything below it is for
     the other days. */
  function quickTile(t) {
    return '<a class="pm-quick" style="--pm-tint:' + hueOf('tool', t.category) + '"' +
      ' href="' + esc(t.url || '#') + '" target="_blank" rel="noopener noreferrer"' +
      ' data-launch="' + esc(t.id) + '">' +
      '<span class="pm-quick__mark" aria-hidden="true">' + pmMark(t.category) + '</span>' +
      '<span class="pm-quick__name">' + esc(t.name) + '</span>' +
    '</a>';
  }

  /* A collection IS a sequence, so it is drawn as one. The arrows are the
     content's real shape — that is the only reason they are allowed on a
     page that otherwise draws no lines at all. */
  function chainHtml(col) {
    var names = memberNames(col);
    if (!names.length) return '<p class="asc-small">No steps yet</p>';
    var shown = names.slice(0, 5);
    var html = shown.map(function (n) { return '<span class="pm-chain__step">' + esc(n) + '</span>'; })
      .join('<span class="pm-chain__arrow" aria-hidden="true">&rarr;</span>');
    if (names.length > shown.length) html += '<span class="pm-chain__more">+' + (names.length - shown.length) + '</span>';
    return '<div class="pm-chain">' + html + '</div>';
  }
  function memberNames(col) {
    return memberRecords(col).map(function (m) { return m ? (m.title || m.name) : 'Missing item'; });
  }
  /* Returns nulls in place for ids that no longer resolve, so a chain
     never silently renumbers itself. A fiction step can also be
     temporarily unresolvable simply because the Codex has not hydrated. */
  function memberRecords(col) {
    if (col.kind === 'tool') return col.itemIds.map(function (id) { return D().Tools.get(id); });
    var all = {}; pvAll().forEach(function (p) { all[p.uid] = p; });
    return col.itemIds.map(function (uid) { return all[uid] || null; });
  }
  function collectionCard(col) {
    return '<div class="pm-col" role="button" tabindex="0" data-collection="' + esc(col.id) + '"' +
      ' style="--pm-tint:' + (col.kind === 'tool' ? '#c99a63' : '#d6d2cb') + '">' +
      '<h3 class="hd-plate">' + (col.icon ? esc(col.icon) + ' ' : '') + esc(col.title) + '</h3>' +
      chainHtml(col) +
    '</div>';
  }

  /* A bold lead sentence, a recovery sentence, and one thing to press. */
  function emptyState(title, body, acts) {
    return '<div class="hd-empty"><strong>' + esc(title) + '</strong>' + esc(body) +
      (acts ? '<div class="asc-sheet__acts">' + acts + '</div>' : '') +
    '</div>';
  }
  // ============================================================
  // §CHROME — the pill, the hero, the utility line, the search.
  //
  // ALL OF IT IS HOUSE DAMULA'S, and most of it is vault-app.js's
  // verbatim. What used to be here — a static hero and a sticky
  // toolbar carrying the tab switch, a search field, a Sort button
  // and a Filter button, each opening a drop panel — is gone. Its
  // four jobs went four different ways:
  //
  //   the tabs      -> the pill, because Prompts / Tools / Kept are
  //                    three PLACES with three hashes, and a place
  //                    in this house is a word in the pill
  //   the search    -> a glyph opening the full-screen .hd-find,
  //                    which hands its query to the library as a
  //                    token you can see and clear
  //   sort + filter -> two native <select>s in the utility line
  //   "New prompt"  -> the floating +, and the `n` key
  //
  // THAT DELETED renderPop(), popPanel(), opt(), closePop() and
  // ui.pop outright — including the offset-measuring workaround
  // .asc-pop needed because it is position:absolute with no
  // offsets and so landed most of a screen from its own button.
  // A <select> opens where it is asked to.
  // ============================================================

  function hashForTab(tab) {
    return tab === 'tools' ? '#/tools' : tab === 'kept' ? '#/kept' : '#/';
  }

  /* Four ways to shape one table, and three of them ARE the sections this
     page used to stack above it. Frequently used, Recent and All were one
     list in three orders; a sort control says that honestly and costs a
     quarter of the scrolling. "Category" is the browse order, and the only
     one that groups. */
  var GROUPINGS = {
    category: { label: 'Category',          group: true },
    used:     { label: 'Most used',         group: false },
    recent:   { label: 'Recently updated',  group: false },
    az:       { label: 'Name',              group: false }
  };

  /* WHAT THE SORT CONTROL SHOULD SAY IT IS DOING. sortRecords() already
     falls through to byName for anything that is not "used" or "recent",
     so a Kept list carrying ui.group === 'category' is in fact in name
     order — and a control reading "Category" over it would be naming a
     grouping that is not on the page. */
  function sortKey() {
    return (ui.tab === 'kept' && GROUPINGS[ui.group].group) ? 'az' : ui.group;
  }

  /* Counts describe what choosing a category WOULD give, so they honour the
     search term and the Kept toggle but not the category already chosen. */
  function catCounts(kind) {
    var q = ui.q.trim().toLowerCase(), pool;
    if (kind === 'tool') {
      pool = D().Tools.list().filter(function (t) { return (!ui.favOnly || t.favorite) && matchTool(t, q); });
    } else {
      pool = pvAll().filter(function (p) { return (!ui.favOnly || p.favorite) && matchPrompt(p, q); });
    }
    var counts = {};
    pool.forEach(function (r) { counts[r.category] = (counts[r.category] || 0) + 1; });
    return counts;
  }

  // ── §THE PILL ──────────────────────────────────────────────
  // Four links, painted as two halves either side of the wordmark
  // by the same ceil(n/2) split the vault uses. The brand itself
  // is static markup and is never re-created: a cloud pull that
  // rebuilt it could not replay the entrance, and the one thing
  // on the page that must never flicker is the name of it.
  var NAV = [
    { href: '#/',         label: 'Prompts',  tab: 'prompts' },
    { href: '#/tools',    label: 'Tools',    tab: 'tools' },
    { href: '#/kept',     label: 'Kept',     tab: 'kept' },
    { href: '#/settings', label: 'Settings', tab: 'settings' }
  ];

  /* A detail route lights its PARENT — #/p/… lights Prompts, #/t/…
     lights Tools — because ui.tab has already been set from the hash by
     the time this runs. Settings is its own tab id for exactly the same
     reason: without one, the Settings page would light Prompts. */
  function paintNav() {
    var link = function (n) {
      var on = route === n.tab;
      return '<a href="' + n.href + '"' + (on ? ' class="is-on" aria-current="page"' : '') + '>' +
        esc(n.label) + '</a>';
    };
    var half = Math.ceil(NAV.length / 2);
    var l = $('hdNavL'), r = $('hdNavR');
    if (l) l.innerHTML = NAV.slice(0, half).map(link).join('');
    if (r) r.innerHTML = NAV.slice(half).map(link).join('');
  }

  // ── §THE HERO ──────────────────────────────────────────────
  // ONE component, on every view, full-bleed, with the pill
  // floating on it. Its anatomy is the vault's, which was read
  // frame by frame off a reference film:
  //
  //     ┌───────────────────────────────────────────────┐
  //     │              ( floating pill nav )            │
  //     │  HEADLINE                        ┌──────────┐ │
  //     │                                  │ the card │ │
  //     │  the copy                        ( chips )    │
  //     └───────────────────────────────────────────────┘
  //
  // FULL-BLEED, AND NO BOUNDARIES. The plate runs to all four
  // edges of the display, so there is no edge to see; only the
  // bottom fades, into the band beneath.
  //
  // THE ONE DEPARTURE: `short`. Every vault view is a room you are
  // browsing and gets the full screen. Half the routes here are a
  // single prompt you are trying to READ, and a prompt should not
  // sit under 82vh of atmosphere. Same photograph, same parallax,
  // a quarter of the height.
  function pageHero(o) {
    var feat = o.short ? null : (o.card === undefined ? featuredCard() : o.card);
    return '<header class="hd-phero' + (o.short ? ' hd-phero--short' : '') + '" data-parallax>' +
      '<div class="hd-phero__art" aria-hidden="true">' +
        '<img class="hd-phero__img" src="images_by_admin/promptarium/hero-hall.webp" alt="" ' +
          'width="736" height="1308" fetchpriority="high" decoding="async">' +
        '<span class="hd-phero__glow"></span>' +
        '<span class="hd-phero__veil"></span>' +
      '</div>' +

      '<div class="hd-phero__in">' +
        '<div class="hd-phero__say">' +
          (o.back ? '<button type="button" class="hd-phero__back" data-back="1">' +
            esc(o.back) + '</button>' : '') +
          (o.eyebrow ? '<p class="hd-phero__e">' + esc(o.eyebrow) + '</p>' : '') +
          '<h1 class="hd-phero__t">' + esc(o.title) + '</h1>' +
        '</div>' +

        (feat ? heroCard(feat) : '') +
        (o.caption ? '<p class="hd-phero__c">' + esc(o.caption) + '</p>' : '') +
        (o.short ? '' :
          // A full-viewport hero hides the whole page, so it has to
          // say there is one. The chips are the real way in; this is
          // the acknowledgement that the picture is not the end.
          '<span class="hd-phero__scroll" aria-hidden="true"><i></i>Scroll</span>' + heroChips()) +
      '</div>' +
      '<span class="hd-phero__rule" aria-hidden="true"></span>' +
    '</header>';
  }

  /* THE FLOATING CARD is the thing you reach for most — the
     most-copied prompt, or on the Tools route the most-opened tool.
     The vault fills this slot with cover art so that every page opens
     on something real out of the collection rather than on
     decoration; a prompt has no cover, so it gets its category's
     drawn mark on the tint and the card's geometry is unchanged.

     Deterministic: ties break on the name, so the hero does not
     reshuffle itself between two repaints. */
  function featuredCard() {
    if (ui.tab === 'tools') {
      var t = D().Tools.list().slice().sort(function (a, b) {
        return (b.useCount || 0) - (a.useCount || 0) ||
               (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0) || byName(a, b);
      })[0];
      return t ? { kind: 'tool', id: t.id, name: t.name, cat: t.category,
                   eyebrow: 'Most opened', verb: 'Open it &#8599;' } : null;
    }
    var p = pvAll().slice().sort(function (a, b) {
      return (b.useCount || 0) - (a.useCount || 0) ||
             (b.lastUsedAt || 0) - (a.lastUsedAt || 0) || byName(a, b);
    })[0];
    return p ? { kind: 'prompt', id: p.uid, name: p.title, cat: p.category,
                 eyebrow: 'Most copied', verb: 'Copy it &#8594;' } : null;
  }

  function heroCard(d) {
    var kind = d.kind === 'tool' ? 'tool' : 'prompt';
    return '<button type="button" class="hd-hcard" style="--pm-tint:' + hueOf(kind, d.cat) + '" ' +
        (d.kind === 'tool' ? 'data-tool="' + esc(d.id) + '"' : 'data-open="' + esc(d.id) + '"') + '>' +
      '<span class="hd-hcard__art">' +
        '<span class="hd-hcard__none">' + pmMark(d.cat) + '</span>' +
      '</span>' +
      '<span class="hd-hcard__in">' +
        '<span class="hd-hcard__e">' + esc(d.eyebrow) + '</span>' +
        '<span class="hd-hcard__t">' + esc(d.name) + '</span>' +
        '<span class="hd-hcard__go">' + d.verb + '</span>' +
      '</span>' +
    '</button>';
  }

  /* THE CHIPS are the categories with something in them, biggest
     first. The vault's are its shelves, and they do the one thing a
     full-viewport hero owes the reader: a way into the library that
     does not require scrolling past the picture first.

     Six, capped, because .hd-chips is sized to break 3/3 — a seventh
     leaves a hole under the first row. */
  function heroChips() {
    var kind = ui.tab === 'tools' ? 'tool' : 'prompt';
    var counts = catCounts(kind);
    var cats = D().catList(kind).filter(function (c) { return counts[c.id]; })
      .sort(function (a, b) { return counts[b.id] - counts[a.id] || a.label.localeCompare(b.label); })
      .slice(0, 6);
    if (!cats.length) return '';
    return '<nav class="hd-chips" aria-label="Categories">' +
      cats.map(function (c) {
        return '<button type="button" class="hd-chip2" data-cat="' + esc(c.id) + '"' +
          ' style="--pm-tint:' + c.hue + '">' +
          '<span class="pm-chip__mark" aria-hidden="true">' + pmMark(c.id) + '</span>' +
          esc(c.label) + '<i>' + counts[c.id] + '</i></button>';
      }).join('') +
    '</nav>';
  }

  /* THE THREE HEROES. A route says its own name: "Prompts" over a
     page of tools would be a heading describing the building rather
     than the room. */
  var HEROES = {
    prompts: { eyebrow: 'A private prompt library', title: 'Prompts',
               caption: 'The words you keep coming back to.' },
    tools:   { eyebrow: 'In the studio', title: 'Tools',
               caption: 'The sites you actually open, and what you run against them.' },
    kept:    { eyebrow: 'From both libraries', title: 'Kept',
               caption: 'The ones worth coming back to, without first deciding which half they were in.' }
  };

  // ── §THE UTILITY LINE ──────────────────────────────────────
  // Everything the old toolbar did, at the weight of a caption.
  // A FILTERED LIBRARY MUST NEVER BE ABLE TO LOOK LIKE AN EMPTY
  // ONE, so the query is a token you can see and clear rather than
  // a field somewhere off the top of the page.
  function utilLine(kind, n) {
    var isKept = ui.tab === 'kept';
    var counts = isKept ? null : catCounts(kind);
    /* The Kept view counts BOTH libraries, so it cannot borrow either
       one's noun. "12 prompts" over a list that is half tools is a
       number that lies about what it counted. */
    var noun = isKept ? 'item' : (kind === 'tool' ? 'tool' : 'prompt');
    var opt = function (v, label, cur, count) {
      return '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' +
        esc(label) + (count == null ? '' : ' (' + count + ')') + '</option>';
    };

    return '<div class="hd-util">' +
      '<span class="hd-util__n">' + esc(plural(n, noun)) + '</span>' +
      (ui.q.trim()
        ? '<button type="button" class="hd-token" data-clearq="1">&ldquo;' + esc(ui.q.trim()) +
          '&rdquo; <i aria-hidden="true">&times;</i></button>'
        : '') +
      '<span class="hd-util__sp"></span>' +

      /* The Kept tab carries neither of the filters. It is already both
         libraries and already kept-only, so a Kept toggle would be
         answering a question the tab has answered — and a category list
         across two vocabularies that share ids would mean two different
         things under one word. */
      (isKept ? '' :
        '<button type="button" class="hd-util__b' + (ui.favOnly ? ' is-on' : '') + '"' +
          ' data-ffav="1" aria-pressed="' + ui.favOnly + '">' +
          U().mark('heart') + ' Kept</button>') +

      (isKept ? '' :
        '<label class="hd-util__sel"><span class="hd-sr">Category</span>' +
          '<select data-fcat="1">' +
            opt('all', 'All categories', ui.cat) +
            D().catList(kind).filter(function (c) { return counts[c.id] || ui.cat === c.id; })
              .map(function (c) { return opt(c.id, c.label, ui.cat, counts[c.id] || 0); }).join('') +
          '</select></label>') +

      '<label class="hd-util__sel"><span class="hd-sr">Sort</span>' +
        '<select data-setgroup="1">' +
          Object.keys(GROUPINGS).filter(function (k) {
            // "Category" is a grouping, and the Kept tab does not group.
            return !(isKept && GROUPINGS[k].group);
          }).map(function (k) { return opt(k, GROUPINGS[k].label, sortKey()); }).join('') +
        '</select></label>' +

      '<button type="button" class="hd-util__b" data-surprise="1">Surprise me</button>' +
    '</div>';
  }

  // ── §SEARCH ────────────────────────────────────────────────
  // A glyph in the pill, and an overlay over the page. It searches
  // BOTH libraries whichever half you are in, because "where did I
  // put that" is not a question you can only ask about the room you
  // are standing in. Enter hands the query to the library.
  var findTimer = 0;

  function openFind() {
    var box = $('hdFind');
    box.hidden = false;
    requestAnimationFrame(function () { box.classList.add('is-on'); });
    document.body.classList.add('asc-locked');
    $('hdFindIn').value = ui.q;
    $('hdFindIn').focus();
    paintFind(ui.q);
  }
  function closeFind() {
    var box = $('hdFind');
    box.classList.remove('is-on');
    document.body.classList.remove('asc-locked');
    setTimeout(function () { box.hidden = true; }, 220);
  }
  function paintFind(q) {
    q = String(q || '').trim().toLowerCase();
    var out = $('hdFindOut');
    if (!q) {
      out.innerHTML = '<p class="hd-find__hint">Names, notes, categories and the prompt text itself. ' +
        'Press Enter to take the query back to the library.</p>';
      return;
    }
    var hits = pvAll().filter(function (p) { return matchPrompt(p, q); })
      .map(function (p) {
        return { href: '#/p/' + encodeURIComponent(p.uid), name: p.title, id: p.category,
                 cat: catLabel('prompt', p.category), hue: hueOf('prompt', p.category),
                 kind: 'Prompt' };
      })
      .concat(D().Tools.list().filter(function (t) { return matchTool(t, q); })
        .map(function (t) {
          return { href: '#/t/' + encodeURIComponent(t.id), name: t.name, id: t.category,
                   cat: catLabel('tool', t.category), hue: hueOf('tool', t.category),
                   kind: 'Tool' };
        }));

    out.innerHTML = hits.length
      ? '<p class="hd-find__n">' + esc(plural(hits.length, 'result')) + '</p>' +
        hits.slice(0, 8).map(function (h) {
          return '<a class="hd-find__row" href="' + esc(h.href) + '" data-act="find-go"' +
            ' style="--pm-tint:' + h.hue + '">' +
            '<span class="pm-find__mark" aria-hidden="true">' + pmMark(h.id) + '</span>' +
            '<span><b>' + esc(h.name) + '</b><i>' + esc(h.kind) + ' &middot; ' + esc(h.cat) + '</i></span></a>';
        }).join('') +
        (hits.length > 8 ? '<p class="hd-find__hint">Press Enter for all ' + hits.length + '.</p>' : '')
      : '<p class="hd-find__hint">Nothing matches &ldquo;' + esc(q) + '&rdquo;.</p>';
  }

  // ============================================================
  // §VIEWS
  //
  // EVERY VIEW IS HERO + ONE BAND. That is HOUSE DAMULA's shape and
  // it is the whole reason a view is a string built in one place
  // rather than a hero pinned in the document with content poured
  // under it: a route that opens on its own name has to be able to
  // say its own name.
  //
  // The band is always .hd-night. The vault kept a ground map so
  // that re-grounding a route stays a one-word change, and both
  // studios still resolve every colour through --hd-bg / --hd-fg
  // rather than naming one — which is what made the vault's three
  // palette changes in a day cost one token block each.
  // ============================================================

  /* One band, so no view can accidentally grow a second ground. */
  function band(inner, extra) {
    return '<section class="hd-band hd-night' + (extra ? ' ' + extra : '') + '">' + inner + '</section>';
  }

  function viewPromptsHome() {
    var host = $('pmView');
    var all = pvAll();
    var hero = pageHero(HEROES.prompts);

    if (!all.length) {
      host.innerHTML = hero + band(emptyState(
        'No prompts yet.',
        'Add the ones you already paste from somewhere else. A prompt needs a name, the text, and one word for what it is for.',
        '<button type="button" class="asc-btn asc-btn--primary" data-new="prompts">New prompt</button>'));
      return;
    }

    // The collapse rule: a query is not browsing. The moment a search term
    // or a filter is active the page is one result list, with no sections
    // above it and no groups inside it.
    //
    // The count and the query no longer need a heading of their own —
    // the utility line carries both, and the query is a token you can
    // press to clear, so a filtered library can never be mistaken for
    // an empty one.
    if (isFiltering()) {
      var hits = filteredPrompts();
      host.innerHTML = hero + band(utilLine('prompt', hits.length) + (hits.length
        ? '<div class="pm-table" role="table" aria-label="Prompts">' +
            colsRow('prompt') +
            '<div class="pm-group__body">' +
              sortRecords(hits).map(function (p, i) { return promptRow(p, i); }).join('') +
            '</div>' +
          '</div>'
        : emptyState('Nothing matches that.',
            'No prompt matches ' + describeFilter() + '. Try fewer words, or clear the filter and start from the whole library.',
            '<button type="button" class="asc-btn asc-btn--primary" data-clearfilters="1">Clear the filter</button>')));
      return;
    }

    var cols = D().collectionsOfKind('prompt');
    var html = utilLine('prompt', all.length) +
      '<section class="pm-sec">' +
      sectionHead('Collections', cols.length ? 'A workflow, in order' : '') +
      (cols.length
        ? '<div class="pm-cols">' + cols.map(collectionCard).join('') + '</div>' +
          '<div class="pm-sec__acts">' +
            '<button type="button" class="asc-btn asc-btn--sm" data-newcol="prompt">New collection</button></div>'
        : '<p class="asc-body">Group prompts that run in order &mdash; draft, critique, rewrite &mdash; and open them one after another. ' +
          '<button type="button" class="asc-btn asc-btn--sm" data-newcol="prompt">New collection</button></p>') +
    '</section>';

    /* And then the library itself. Frequently used, Recent and All used to
       be three stacked sections here; they were one list in three orders,
       and they are the Sort control in the utility line now. */
    html += '<div class="pm-table" role="table" aria-label="Prompts">' +
      tableHTML('prompt', all) + '</div>';

    host.innerHTML = hero + band(html);
  }

  function describeFilter() {
    var bits = [];
    if (ui.q.trim()) bits.push('"' + ui.q.trim() + '"');
    if (ui.cat !== 'all') bits.push(catLabel(ui.tab === 'tools' ? 'tool' : 'prompt', ui.cat));
    if (ui.favOnly) bits.push('kept only');
    return bits.join(' + ');
  }

  function viewToolsHome() {
    var host = $('pmView');
    var d = D();
    var all = d.Tools.list();
    var hero = pageHero(HEROES.tools);

    if (!all.length) {
      host.innerHTML = hero + band(emptyState(
        'No tools yet.',
        'Add the sites you open every day. Or start from the ones already in your rotation and edit from there.',
        '<button type="button" class="asc-btn asc-btn--primary" data-new="tools">Add a tool</button>' +
        '<button type="button" class="asc-btn" data-starter="1">Add my usual tools</button>'));
      return;
    }

    if (isFiltering()) {
      var hits = filteredTools();
      host.innerHTML = hero + band(utilLine('tool', hits.length) + (hits.length
        ? '<div class="pm-table" role="table" aria-label="Tools">' +
            colsRow('tool') +
            '<div class="pm-group__body">' +
              sortRecords(hits).map(function (t, i) { return toolRow(t, i); }).join('') +
            '</div>' +
          '</div>'
        : emptyState('Nothing matches that.',
            'No tool matches ' + describeFilter() + '. Try fewer words, or clear the filter and start from the whole library.',
            '<button type="button" class="asc-btn asc-btn--primary" data-clearfilters="1">Clear the filter</button>')));
      return;
    }

    var html = utilLine('tool', all.length);

    var quick = all.filter(function (t) { return t.quick && t.url; }).sort(d.byOrder).slice(0, 8);
    if (quick.length) {
      html += '<section class="pm-sec">' + sectionHead('Quick launch') +
        '<div class="pm-quicks">' + quick.map(quickTile).join('') + '</div></section>';
    }

    var stacks = d.collectionsOfKind('tool');
    html += '<section class="pm-sec">' +
      sectionHead('Stacks', stacks.length ? 'The tools one workflow needs' : '') +
      (stacks.length
        ? '<div class="pm-cols">' + stacks.map(collectionCard).join('') + '</div>' +
          '<div class="pm-sec__acts">' +
            '<button type="button" class="asc-btn asc-btn--sm" data-newcol="tool">New stack</button></div>'
        : '<p class="asc-body">Group the tools one job needs &mdash; Obsidian, Claude, Docs &mdash; so you open the set rather than hunting each one. ' +
          '<button type="button" class="asc-btn asc-btn--sm" data-newcol="tool">New stack</button></p>') +
    '</section>';

    html += '<div class="pm-table" role="table" aria-label="Tools">' +
      tableHTML('tool', all) + '</div>';

    host.innerHTML = hero + band(html);
  }

  /* WHAT YOU KEPT, from both libraries at once.

     It does its own filtering rather than going through
     isFiltering()/filteredPrompts(): those two carry ui.cat, which
     belongs to whichever library you were last in and would quietly
     hide half of this page. The only controls this view honours are the
     search field and the sort.

     Ungrouped on purpose. Category grouping across two libraries would
     stack headings that mean different things — a "planning" prompt and
     a "planning" tool are not one group — so the two libraries ARE the
     sections, and Sort by orders inside them. */
  function viewKept() {
    var host = $('pmView');
    var q = ui.q.trim().toLowerCase();
    var prompts = pvAll().filter(function (p) { return p.favorite && matchPrompt(p, q); });
    var tools = D().Tools.list().filter(function (t) { return t.favorite && matchTool(t, q); });
    var hero = pageHero(HEROES.kept);

    if (!prompts.length && !tools.length) {
      host.innerHTML = hero + band(q
        ? emptyState('Nothing kept matches that.',
            'Nothing you have kept matches "' + ui.q.trim() + '". Clear the search to see the whole shelf.',
            '<button type="button" class="asc-btn asc-btn--primary" data-clearq="1">Clear the search</button>')
        : emptyState('Nothing kept yet.',
            'Tap the heart at the end of any prompt or tool and it lands here. This is the shelf for the ones you come back to, from both libraries at once.',
            '<button type="button" class="asc-btn asc-btn--primary" data-go="#/">Go to the prompts</button>'));
      return;
    }
