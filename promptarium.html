    /* The count is BOTH halves. On every other view the utility line
       counts one library, because there is only one; here the number
       over the page has to mean the page. */
    var html = utilLine('prompt', prompts.length + tools.length);
    /* An empty half is left out rather than printed as a heading over
       nothing: a section that says "no tools" is still a section. */
    if (prompts.length) {
      html += '<section class="pm-sec">' +
        // No 'Kept' note: the lit tab three lines above already says it,
        // and a label that repeats its own heading is doing nothing.
        sectionHead(plural(prompts.length, 'prompt')) +
        '<div class="pm-table" role="table" aria-label="Prompts you have kept">' +
          colsRow('prompt') +
          '<div class="pm-group__body">' +
            sortRecords(prompts).map(function (p, i) { return promptRow(p, i); }).join('') +
          '</div>' +
        '</div>' +
      '</section>';
    }
    if (tools.length) {
      html += '<section class="pm-sec">' +
        sectionHead(plural(tools.length, 'tool')) +
        '<div class="pm-table" role="table" aria-label="Tools you have kept">' +
          colsRow('tool') +
          '<div class="pm-group__body">' +
            sortRecords(tools).map(function (t, i) { return toolRow(t, i); }).join('') +
          '</div>' +
        '</div>' +
      '</section>';
    }
    host.innerHTML = hero + band(html);
  }

  // ============================================================
  // §DETAIL VIEWS
  // ============================================================
  function markVars(text) {
    // esc() first, then wrap — wrapping first would have the escaper eat
    // the markup it just produced.
    return esc(text).replace(/\{\{\s*([A-Z0-9_ -]+?)\s*\}\}/g, function (whole) {
      return '<mark>' + whole + '</mark>';
    });
  }

  /* THE SHORT HERO, and the one place this studio departs from the
     vault on purpose. Every vault view opens on a full screen of
     photograph because every vault view is a room you are browsing; a
     prompt you are trying to READ should not sit under 82vh of
     atmosphere. Same picture, same parallax, a quarter of the height —
     and the way back lives in it, because topbar.js's launcher owns the
     top-left corner of every page in this dashboard and a back control
     pinned there would render underneath it. */
  function detailHero(eyebrow, title) {
    return pageHero({
      short: true, eyebrow: eyebrow, title: title,
      back: ui.tab === 'tools' ? 'Tools' : ui.tab === 'kept' ? 'Kept' : 'Prompts'
    });
  }

  function viewPrompt(uid) {
    var host = $('pmView');
    var p = pvGet(uid);
    if (!p) {
      host.innerHTML = detailHero('Not found', 'That prompt is gone') +
        band(emptyState('That prompt is gone',
          'It was deleted, or it lives in the fiction library and has not loaded on this device yet.',
          '<button type="button" class="asc-btn" data-go="#/">Back to prompts</button>'));
      return;
    }
    var hue = hueOf('prompt', p.category);
    var vars = D().detectVariables(p.text);
    var reason = p.fiction && !p.editable ? gateReason() : '';

    /* The name is the HERO's headline, not a heading inside the band.
       A detail page that opens on a photograph and then says what it is
       a page OF, four lines lower, is two titles. */
    var html = '<div class="pm-detail" style="--pm-tint:' + hue + '">' +
      '<p class="pm-detail__meta"><span class="pm-dot"></span>' +
        esc(catLabel('prompt', p.category)) +
        (p.compat ? ' <span class="pm-sep">&middot;</span> ' + esc(D().compatLabel(p.compat)) : '') +
        (p.useCount ? ' <span class="pm-sep">&middot;</span> copied ' + p.useCount + (p.useCount === 1 ? ' time' : ' times') : '') +
        (p.fiction ? ' <span class="pm-fic">&#10086; fiction library</span>' : '') +
        (reason ? ' <span class="pm-ro">Read-only</span>' : '') +
      '</p>';

    if (reason) html += '<p class="pm-locked">' + esc(reason) + '</p>';

    html += '<div class="pm-prompt-text">' + markVars(p.text || 'This prompt has no text yet.') + '</div>' +
      '<div class="asc-sheet__acts">' +
        '<button type="button" class="asc-btn asc-btn--primary" data-copy="' + esc(p.uid) + '">Copy prompt</button>' +
        starBtnWide(p.uid, p.favorite) +
        (p.editable ? '<button type="button" class="asc-btn" data-edit="' + esc(p.uid) + '">Edit</button>' : '') +
      '</div>';

    if (vars.length) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">Variables</h2>' +
        '<div class="pm-vars">' + vars.map(function (v) {
          return '<label class="pm-field" style="margin:0">' +
            '<span class="asc-label">' + esc(v) + '</span>' +
            '<input class="asc-input" type="text" data-var="' + esc(v) + '" placeholder="' + esc(v.toLowerCase()) + '">' +
          '</label>';
        }).join('') + '</div>' +
        '<button type="button" class="asc-btn" id="pmCopyFilled">Copy with these filled in</button></div>';
    }

    html += '<div class="asc-sheet__block"><h2 class="asc-label">Notes</h2>' +
      '<textarea class="asc-textarea" id="pmNotes" style="min-height:110px;font-family:var(--hd-ui);font-size:16px"' +
        (p.editable ? '' : ' readonly') +
        ' placeholder="What this is for, what it gets wrong, what to change next time.">' + esc(noteFor(p)) + '</textarea>' +
      '<span class="asc-small">Saved when you click away.</span></div>';

    var inCols = D().collectionsHolding('prompt', p.uid);
    if (inCols.length) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">In collections</h2><div class="pm-list">' +
        inCols.map(function (c) {
          return '<div class="pm-list__row" style="--pm-tint:#d6d2cb"><div class="pm-list__main" role="button" tabindex="0" data-collection="' + esc(c.id) + '">' +
            '<span class="pm-list__dot"></span><span class="pm-list__name">' + esc(c.title) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span><span class="pm-list__open">Open</span></div></div>';
        }).join('') + '</div></div>';
    }

    if (p.editable) {
      html += '<div class="asc-sheet__acts"><button type="button" class="asc-btn asc-btn--danger asc-btn--sm" data-delete="' + esc(p.uid) + '">Delete this prompt</button></div>';
    }
    host.innerHTML =
      detailHero(p.fiction ? 'Fiction library' : catLabel('prompt', p.category), p.title) +
      band(html + '</div>', 'hd-band--detail');
  }
  /* The same heart as the table's, with its name beside it. Labelled
     because a detail view has room for the word and no row of siblings to
     stay narrow for. */
  function starBtnWide(uid, on) {
    return '<button type="button" class="asc-btn pm-heart-wide' + (on ? ' is-on' : '') + '"' +
      ' data-fav="' + esc(uid) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      U().mark('heart') + (on ? 'Kept' : 'Keep') + '</button>';
  }

  function viewTool(id) {
    var host = $('pmView');
    var d = D();
    var t = d.Tools.get(id);
    if (!t) {
      host.innerHTML = detailHero('Not found', 'That tool is gone') +
        band(emptyState('That tool is gone', 'It was deleted from the library.',
          '<button type="button" class="asc-btn" data-go="#/tools">Back to tools</button>'));
      return;
    }
    var hue = hueOf('tool', t.category);
    var host2 = d.hostOf(t.url);

    var html = '<div class="pm-detail" style="--pm-tint:' + hue + '">' +
      '<p class="pm-detail__meta"><span class="pm-dot"></span>' + esc(catLabel('tool', t.category)) +
        (host2 ? ' <span class="pm-sep">&middot;</span> ' + esc(host2) : '') +
        (t.useCount ? ' <span class="pm-sep">&middot;</span> opened ' + t.useCount + (t.useCount === 1 ? ' time' : ' times') : '') +
      '</p>' +
      '<div class="asc-sheet__acts">' +
        (t.url ? '<a class="asc-btn asc-btn--primary" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer" data-launch="' + esc(t.id) + '">Open &#8599;</a>' : '') +
        starBtnWide(t.id, t.favorite) +
        '<button type="button" class="asc-btn" data-edittool="' + esc(t.id) + '">Edit</button>' +
      '</div>';

    if (t.useFor) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">What you use it for</h2><p style="margin:0;color:var(--hd-fg-2)">' + esc(t.useFor) + '</p></div>';
    }
    if (t.accountNote) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">Account</h2><p style="margin:0;color:var(--hd-fg-2)">' + esc(t.accountNote) + '</p></div>';
    }

    /* The join between the two halves of this page: the tool tells you
       which prompts you actually run against it. */
    html += '<div class="asc-sheet__block"><h2 class="asc-label">Related prompts</h2>';
    var linked = t.relatedPrompts.map(pvGet).filter(Boolean);
    html += linked.length
      ? '<div class="pm-table" role="table">' + linked.map(function (p, i) { return promptRow(p, i); }).join('') + '</div>'
      : '<p class="asc-body">Nothing linked yet. Link the prompts you run against ' + esc(t.name) + ' so they are one click away when you open it.</p>';
    html += '<div class="asc-sheet__acts" style="justify-content:flex-start;margin-top:14px">' +
      '<button type="button" class="asc-btn asc-btn--sm" data-linkprompts="' + esc(t.id) + '">Link prompts</button></div></div>';

    var inStacks = d.collectionsHolding('tool', t.id);
    if (inStacks.length) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">In stacks</h2><div class="pm-list">' +
        inStacks.map(function (c) {
          return '<div class="pm-list__row" style="--pm-tint:#c99a63"><div class="pm-list__main" role="button" tabindex="0" data-collection="' + esc(c.id) + '">' +
            '<span class="pm-list__dot"></span><span class="pm-list__name">' + esc(c.title) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span><span class="pm-list__open">Open</span></div></div>';
        }).join('') + '</div></div>';
    }

    html += '<div class="asc-sheet__acts"><button type="button" class="asc-btn asc-btn--danger asc-btn--sm" data-deletetool="' + esc(t.id) + '">Delete this tool</button></div>';
    host.innerHTML = detailHero(host2 || catLabel('tool', t.category), t.name) +
      band(html + '</div>', 'hd-band--detail');
  }

  function viewCollection(id) {
    var host = $('pmView');
    var d = D();
    var col = d.Collections.get(id);
    if (!col) {
      host.innerHTML = detailHero('Not found', 'That collection is gone') +
        band(emptyState('That collection is gone', 'It was deleted.',
          '<button type="button" class="asc-btn" data-go="#/">Back</button>'));
      return;
    }
    var isTool = col.kind === 'tool';
    var members = memberRecords(col);

    var html = '<div class="pm-detail" style="--pm-tint:' + (isTool ? "#c99a63" : "#d6d2cb") + '">' +
      '<p class="pm-detail__meta"><span class="pm-dot"></span>' + (isTool ? 'Tool stack' : 'Prompt collection') +
        ' <span class="pm-sep">&middot;</span> ' + plural(col.itemIds.length, isTool ? 'tool' : 'prompt') + '</p>' +
      (col.summary ? '<p style="color:var(--hd-fg-2);margin:0 0 34px;max-width:60ch">' + esc(col.summary) + '</p>' : '');

    if (!members.length) {
      html += '<p class="asc-body">No steps yet. Add the ' + (isTool ? 'tools' : 'prompts') + ' this workflow runs, in the order you run them.</p>';
    } else {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">In order</h2><div class="pm-list" id="pmSteps">';
      members.forEach(function (m, i) {
        var itemId = col.itemIds[i];
        if (!m) {
          html += '<div class="pm-list__row" data-step="' + esc(itemId) + '"><div class="pm-list__main" style="cursor:default">' +
            '<span class="pm-list__n">' + (i + 1) + '</span>' +
            '<span class="pm-list__name" style="color:var(--hd-fg-3)">Missing &mdash; deleted, or the fiction library has not loaded</span>' +
            '</div><div class="pm-list__acts"><button type="button" class="asc-btn asc-btn--sm" data-unstep="' + esc(itemId) + '" aria-label="Remove step">&times;</button></div></div>';
          return;
        }
        var hue = isTool ? hueOf('tool', m.category) : hueOf('prompt', m.category);
        html += '<div class="pm-list__row" style="--pm-tint:' + hue + '" data-step="' + esc(itemId) + '">' +
          (isTool
            ? '<a class="pm-list__main" href="' + esc(m.url || '#') + '" target="_blank" rel="noopener noreferrer" data-launch="' + esc(m.id) + '">'
            : '<div class="pm-list__main" role="button" tabindex="0" data-open="' + esc(m.uid) + '">') +
            '<span class="pm-list__n" style="min-width:1.4em">' + (i + 1) + '</span>' +
            '<span class="pm-list__dot"></span>' +
            '<span class="pm-list__name">' + esc(m.title || m.name) + '</span>' +
            '<span class="pm-spacer" style="flex:1"></span>' +
            '<span class="pm-list__open">' + (isTool ? 'Open &#8599;' : 'Open') + '</span>' +
          (isTool ? '</a>' : '</div>') +
          '<div class="pm-list__acts">' +
            (isTool ? '' : '<button type="button" class="asc-btn asc-btn--sm pm-copy" data-copy="' + esc(m.uid) + '">Copy</button>') +
            '<button type="button" class="asc-btn asc-btn--sm" data-unstep="' + esc(itemId) + '" aria-label="Remove step">&times;</button>' +
          '</div></div>';
      });
      html += '</div><span class="asc-small">Drag a step to reorder it.</span></div>';
    }

    html += '<div class="asc-sheet__acts">' +
      '<button type="button" class="asc-btn asc-btn--primary" data-addstep="' + esc(col.id) + '">Add ' + (isTool ? 'tools' : 'prompts') + '</button>' +
      '<button type="button" class="asc-btn" data-editcol="' + esc(col.id) + '">Edit</button>' +
      '<button type="button" class="asc-btn asc-btn--danger" data-deletecol="' + esc(col.id) + '">Delete</button>' +
    '</div>';

    host.innerHTML = detailHero(isTool ? 'A tool stack' : 'A prompt collection', col.title) +
      band(html + '</div>', 'hd-band--detail');
    mountStepSort(col.id);
  }

  function mountStepSort(colId) {
    var el = $('pmSteps');
    if (!el || typeof window.Sortable === 'undefined') return;
    window.Sortable.create(el, {
      animation: 150, handle: '.pm-list__n', draggable: '.pm-list__row',
      onEnd: function () {
        var ids = Array.prototype.map.call(el.querySelectorAll('[data-step]'), function (n) { return n.dataset.step; });
        D().Collections.update(colId, { itemIds: ids });
        refreshCurrentView();
      }
    });
  }

  // ============================================================
  // §SETTINGS — the fiction library's status, and the snapshot store.
  // Nothing else. A settings page is where a simplified app quietly
  // grows back into a complicated one.
  // ============================================================
  function viewSettings() {
    var d = D(), b = B();
    var reason = gateReason();
    var html = '<div class="pm-detail">' +

      '<div class="asc-sheet__block"><h2 class="asc-label">Fiction library</h2>' +
      '<p style="margin:0 0 14px;color:var(--hd-fg-2);max-width:62ch">' +
        'Fiction prompts live in the same cloud record as your manuscripts, so this page reads and writes them ' +
        'directly rather than keeping a copy. They only become editable once that record has arrived on this device.' +
      '</p>' +
      '<p style="margin:0 0 14px;max-width:62ch;color:' + (reason ? 'var(--hd-acc)' : 'var(--hd-acc-lit)') + '">' +
        (reason ? esc(reason) : 'Loaded and editable. ' + plural(cdxKeyCount(), 'record') + ' present.') + '</p>' +
      '<label class="pm-check"><input type="checkbox" id="pmShowFiction"' + (d.getSettings().showFiction ? ' checked' : '') + '>' +
        'Show fiction prompts in the library</label>' +
      (reason && gate.mounted && !gate.unlocked
        ? '<button type="button" class="asc-btn asc-btn--sm" id="pmUnlock" style="margin-top:8px">My fiction library really is empty &mdash; let me write to it</button>'
        : '') +
      '</div>';

    /* THE GROUPS PANEL. The group bar's ⋯ handles one group at a time,
       where you are already looking at it; this is the whole vocabulary
       in one place, which is where you go to reorder it — and the order
       here is the order the library groups in. */
    var groups = d.catList('prompt'), counts = d.groupCounts();
    html += '<div class="asc-sheet__block"><h2 class="asc-label">Groups</h2>' +
      '<p style="margin:0 0 14px;color:var(--hd-fg-2);max-width:62ch">' +
      'How the prompt library is filed. Drag to reorder \u2014 this is the order groups appear ' +
      'in down the page. Deleting one always asks where its prompts should go.</p>' +
      '<div class="pm-list" id="pmGroups">' +
      groups.map(function (g) {
        var n = counts[g.id] || 0;
        var last = g.id === d.FALLBACK_GROUP;
        return '<div class="pm-list__row" style="--pm-tint:' + g.hue + '" data-group="' + esc(g.id) + '">' +
          '<div class="pm-list__main" style="cursor:default">' +
            '<span class="pm-list__n" title="Drag to reorder">\u2261</span>' +
            groupPill('prompt', g.id, false) +
            '<span class="pm-spacer" style="flex:1"></span>' +
            '<span class="pm-list__open">' + esc(U().plural(n, 'prompt')) + '</span>' +
          '</div>' +
          '<div class="pm-list__acts">' +
            '<button type="button" class="asc-btn asc-btn--sm" data-groupedit="' + esc(g.id) + '">Edit</button>' +
            (last
              /* Other is the fallback every unresolved group lands on, so
                 it cannot be deleted. Saying why beats a button that
                 refuses when pressed. */
              ? '<span class="asc-small" style="padding:0 8px" title="Every prompt whose group is gone lands here">Fallback</span>'
              : '<button type="button" class="asc-btn asc-btn--sm asc-btn--danger" data-groupdel="' + esc(g.id) + '">Delete</button>') +
          '</div></div>';
      }).join('') + '</div>' +
      '<div class="asc-sheet__acts" style="justify-content:flex-start;margin-top:14px">' +
      '<button type="button" class="asc-btn asc-btn--sm" data-groupnew="1">\uff0b Add a group</button></div></div>';

    var undo = b && b.pendingUndo();
    if (undo) {
      html += '<div class="asc-sheet__block"><h2 class="asc-label">The rebuild</h2>' +
        '<p style="margin:0 0 14px;color:var(--hd-fg-2);max-width:62ch">' +
        'The old model-based prompt library was removed when this page was rebuilt. A snapshot was taken first.</p>' +
        '<button type="button" class="asc-btn" data-restore="' + esc(undo.snapId) + '">Restore the old library</button></div>';
    }

    html += '<div class="asc-sheet__block"><h2 class="asc-label">Local snapshots</h2>' +
      '<p style="margin:0 0 14px;color:var(--hd-fg-2);max-width:62ch">' +
      'Copies of this page\'s data kept on this device only. They are never synced and never sent anywhere, ' +
      'which is exactly why they survive a bad sync.</p>';
    var snaps = b ? b.list() : [];
    html += snaps.length
      ? '<div class="pm-list">' + snaps.map(function (s) {
          return '<div class="pm-list__row" style="--pm-tint:#938b7c"><div class="pm-list__main" style="cursor:default">' +
            '<span class="pm-list__dot"></span>' +
            '<span class="pm-list__name">' + esc(d.fmtDate(s.at)) + ', ' + esc(new Date(s.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })) + '</span>' +
            '<span class="pm-list__n">' + esc(s.counts.length ? s.counts.join(', ') : 'empty') + '</span>' +
            '</div><div class="pm-list__acts">' +
            '<button type="button" class="asc-btn asc-btn--sm" data-restore="' + esc(s.id) + '">Restore</button></div></div>';
        }).join('') + '</div>'
      : '<p class="asc-body">No snapshots yet. One is taken every time you edit something.</p>';
    html += '<div class="asc-sheet__acts" style="justify-content:flex-start;margin-top:14px">' +
      '<button type="button" class="asc-btn asc-btn--sm" id="pmSnapNow">Take a snapshot now</button></div></div>';

    html += '<div class="asc-sheet__block"><h2 class="asc-label">Library</h2><p class="asc-body">' +
      plural(d.Prompts.list().length, 'prompt') + ' &middot; ' + plural(d.Tools.list().length, 'tool') +
      ' &middot; ' + plural(d.Collections.list().length, 'collection') + '</p>' +
      '<div class="asc-sheet__acts" style="justify-content:flex-start;margin-top:14px">' +
      '<button type="button" class="asc-btn asc-btn--sm" data-starter="1">Add my usual tools</button></div></div>';

    $('pmView').innerHTML = detailHero('Prompt Studio', 'Settings') +
      band(html + '</div>', 'hd-band--detail');
    mountGroupSort();
  }

  /* Drag to reorder, on the same Sortable the collection steps use. The
     handle is the grip, not the row, so the Edit and Delete buttons stay
     pressable. reorderGroups() keeps anything the drag did not name — a
     handler that misses a row must not be able to destroy it. */
  function mountGroupSort() {
    var el = $('pmGroups');
    if (!el || typeof window.Sortable === 'undefined') return;
    window.Sortable.create(el, {
      animation: 150, handle: '.pm-list__n', draggable: '.pm-list__row',
      onEnd: function () {
        var ids = Array.prototype.map.call(el.querySelectorAll('[data-group]'),
          function (n) { return n.dataset.group; });
        D().reorderGroups(ids);
        toast('Group order saved');
        refreshCurrentView();
      }
    });
  }

  // ============================================================
  // §ROUTER
  // ============================================================
  function parts() {
    return (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  }
  function go(hash) { location.hash = hash; }

  /* WHICH PILL LINK IS LIT, and deliberately not ui.tab.

     ui.tab is which LIBRARY you are looking at, and it is persisted to
     prm:uiState. Settings is a place in the nav but it is not a
     library, so writing 'settings' into ui.tab would persist a value
     loadUi() then refuses (TABS has three members) and would leave the
     Kept/Prompts switch meaning nothing on the way back. The pill needs
     its own answer, and this is it. */
  var route = 'prompts';

  function render() {
    var p = parts();

    // The tab follows the route, so a deep link into a tool lands with the
    // Tools half open rather than lying about where you are. A collection is
    // the only route that cannot be read off the hash — its own kind says
    // which half of the page it belongs to.
    if (p[0] === 'kept') ui.tab = 'kept';
    else if (p[0] === 'tools' || p[0] === 't') ui.tab = 'tools';
    else if (p[0] === 'c' && p[1]) {
      var col = D().Collections.get(decodeURIComponent(p[1]));
      if (col) ui.tab = col.kind === 'tool' ? 'tools' : 'prompts';
    }
    // Settings belongs to neither half, so it leaves the tab alone. Every
    // other route — including an unrecognised one, which falls through to
    // the prompts home — is the prompts side, and saying so here is what
    // stops the pill reading "Tools" over a page of prompts.
    else if (p[0] !== 'settings') ui.tab = 'prompts';

    /* A DETAIL ROUTE LIGHTS ITS PARENT. #/p/… lights Prompts, #/t/…
       lights Tools, and a collection lights whichever half its kind put
       ui.tab in one line above. */
    route = p[0] === 'settings' ? 'settings' : ui.tab;
    paintNav();

    if (!p.length)                       { runSafely(viewPromptsHome, 'prompts home'); }
    else if (p[0] === 'tools')           { runSafely(viewToolsHome, 'tools home'); }
    else if (p[0] === 'kept')            { runSafely(viewKept, 'kept'); }
    else if (p[0] === 'p' && p[1])       { runSafely(function () { viewPrompt(decodeURIComponent(p[1])); }, 'prompt'); }
    else if (p[0] === 't' && p[1])       { runSafely(function () { viewTool(decodeURIComponent(p[1])); }, 'tool'); }
    else if (p[0] === 'c' && p[1])       { runSafely(function () { viewCollection(decodeURIComponent(p[1])); }, 'collection'); }
    else if (p[0] === 'settings')        { runSafely(viewSettings, 'settings'); }
    else                                 { runSafely(viewPromptsHome, 'prompts home'); }

    /* The hero node was just replaced, so the scroll handler is holding a
       reference to an element no longer in the document. Re-find and
       re-measure it — the scroll event that would otherwise do it is not
       guaranteed to fire. */
    if (readScroll) readScroll(true);
    markClamped();
  }

  /* A repaint is not a navigation. Cloud sync, coming back online and the
     boot grace timer all call this at moments nobody chose, and a
     re-render that scrolled to the top would throw you out of whatever
     you were reading. Scroll-to-top belongs to hashchange, and only
     there. */
  function refreshCurrentView() {
    var y = window.scrollY;
    var active = document.activeElement;
    // Never repaint out from under a field being typed into: the caret,
    // the buffer and any IME composition would go with it. The search
    // field lives in the overlay now, so there is no exception to make.
    if (active && /^(INPUT|TEXTAREA)$/.test(active.tagName)) return;
    // And never out from under an open search or an open sheet.
    if (!$('hdFind').hidden || $('ascSheetBg').classList.contains('is-on')) return;
    render();
    window.scrollTo(0, y);
  }

  // ============================================================
  // §MODAL and §FIELDS
  // ============================================================
  /* It is The Asclepion's sheet now - the one layer-2 surface, sliding in
     from the right on a desktop and up from the bottom on a phone. The
     ELEMENTS are the ones asclepion-ui.js addresses by id, so the shared
     stylesheet and this page's own openModal() are both talking about the
     same box.

     lastFocus is why this is not simply AscUI.openSheet: the editors below
     need a save handler and a mount hook, and a sheet that loses your
     place in the list behind it is a sheet you stop opening. */
  var modalSave = null;
  var lastFocus = null;
  function openModal(cfg) {
    var bg = $('ascSheetBg'), box = $('ascSheet');
    lastFocus = document.activeElement;
    box.innerHTML =
      (cfg.title ? '<h2 class="hd-plate pm-sheet__title">' + esc(cfg.title) + '</h2>' : '') +
      cfg.body +
      (cfg.hideActions ? '' :
        '<div class="asc-sheet__acts">' +
          (cfg.extra || '') +
          '<span class="pm-spacer"></span>' +
          '<button type="button" class="asc-btn asc-btn--quiet" data-modalclose="1">Cancel</button>' +
          '<button type="button" class="asc-btn asc-btn--primary" id="pmModalSave">' + esc(cfg.saveLabel || 'Save') + '</button>' +
        '</div>');
    modalSave = cfg.onSave || null;
    bg.classList.add('is-on');
    document.body.classList.add('asc-locked');
    if (cfg.onMount) cfg.onMount(box);
    var first = box.querySelector('input,textarea,select,button');
    if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
  }
  function closeModal() {
    $('ascSheetBg').classList.remove('is-on');
    $('ascSheet').innerHTML = '';
    document.body.classList.remove('asc-locked');
    modalSave = null;
    if (lastFocus && document.contains(lastFocus)) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
  }

  function fieldText(label, name, value, ph, hint) {
    return '<label class="pm-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<input class="asc-input" type="text" data-f="' + name + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '">' +
      (hint ? '<span class="asc-small">' + esc(hint) + '</span>' : '') + '</label>';
  }
  function fieldArea(label, name, value, ph, hint) {
    return '<label class="pm-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<textarea class="asc-textarea" data-f="' + name + '" placeholder="' + esc(ph || '') + '">' + esc(value || '') + '</textarea>' +
      (hint ? '<span class="asc-small">' + esc(hint) + '</span>' : '') + '</label>';
  }
  function fieldSelect(label, name, value, options) {
    return '<label class="pm-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<select class="asc-select" data-f="' + name + '">' +
        options.map(function (o) {
          return '<option value="' + esc(o.id) + '"' + (o.id === value ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('') +
      '</select></label>';
  }
  function fieldCheck(label, name, on) {
    return '<label class="pm-check"><input type="checkbox" data-f="' + name + '"' + (on ? ' checked' : '') + '>' + esc(label) + '</label>';
  }
  function readFields(root) {
    var out = {};
    root.querySelectorAll('[data-f]').forEach(function (el) {
      out[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }
  function parseTags(s) {
    return String(s || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 12);
  }

  // ============================================================
  // §EDITORS
  // ============================================================
  function openPromptEditor(uid) {
    var d = D();
    var p = uid ? pvGet(uid) : null;
    if (uid && !p) { toast('That prompt is gone', true); return; }
    if (p && !p.editable) { toast(gateReason(), true); return; }
    openModal({
      title: p ? 'Edit prompt' : 'New prompt',
      saveLabel: p ? 'Save changes' : 'Add prompt',
      body:
        fieldText('Name', 'title', p ? p.title : '', 'Scene improvement') +
        fieldArea('Prompt', 'text', p ? p.text : '', 'Paste the prompt. Wrap anything you swap out each time in double braces, like {{SCENE}}.',
          'Double-braced words become fillable fields when you open the prompt.') +
        '<div class="pm-fields2">' +
          /* d.catList('prompt'), not the frozen PROMPT_CATEGORIES: the
             list is editable now and a select built from the constants
             would silently omit every group Damian has added. The last
             option is a way OUT of the select and into the group editor,
             so filing a prompt somewhere new does not mean abandoning
             the form you are in. */
          fieldSelect('Group', 'category', p ? p.category : d.catList('prompt')[0].id,
            d.catList('prompt').concat([{ id: '__new', label: '\uff0b New group\u2026' }])) +
          fieldSelect('Works with', 'compat', p ? p.compat : '', d.COMPAT) +
        '</div>' +
        fieldText('Tags', 'tags', p ? p.tags.join(', ') : '', 'scene, revision', 'Comma separated. Optional.') +
        fieldCheck('Kept', 'favorite', p ? p.favorite : false),
      onMount: function (root) {
        /* '＋ New group…' is not a value, it is a door. Caught on change
           so the group exists by the time the form is saved, and the
           select is put back on the real group afterwards rather than
           left showing the door. */
        var sel = root.querySelector('[data-f="category"]');
        if (!sel) return;
        sel.__prev = sel.value;
        sel.addEventListener('change', function () {
          if (sel.value !== '__new') { sel.__prev = sel.value; return; }
          var name = window.prompt('Name the new group');
          var back = sel.__prev;
          if (name && name.trim()) {
            var made = D().addGroup(name.trim(), D().GROUP_HUES[0].hue);
            var opt = document.createElement('option');
            opt.value = made.id; opt.textContent = made.label;
            sel.insertBefore(opt, sel.lastElementChild);
            back = made.id;
            toast('Added ' + made.label);
          }
          sel.value = back;
          sel.__prev = back;
        });
      },
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim() && !String(f.text).trim()) { toast('Give it a name or some text', true); return false; }
        // Belt and braces: the door is never a destination.
        if (f.category === '__new') f.category = D().FALLBACK_GROUP;
        var patch = {
          title: String(f.title).trim() || 'Untitled prompt',
          text: f.text,
          category: f.category,
          compat: f.compat,
          tags: parseTags(f.tags),
          favorite: !!f.favorite,
          variables: d.detectVariables(f.text)
        };
        if (p) {
          if (p.src === 'cdx') { delete patch.variables; }   // pvPatch derives them
          return pvPatch(p.uid, patch);
        }
        patch.order = d.nextOrder(d.Prompts.list());
        var made = d.Prompts.add(patch);
        go('#/p/prm:' + made.id);
        return true;
      }
    });
  }

  // ============================================================
  // §GROUPS — add, rename, recolour, reorder, delete.
  //
  // Groups were a hard-coded array of eight until 2026-09-04. They are
  // data now (prm:groups), and everything below is the surface for it.
  //
  // THE ID IS NEVER EDITED. Every prompt stores a group by id, and the
  // fiction sidecar stores one too; letting a rename change the id would
  // orphan the whole group in one keystroke. updateGroup() enforces
  // that, and this file never tries.
  // ============================================================

  /* The swatch grid. Eighteen hues measured off the hero photograph, not
     a colour wheel: every one of them clears 3:1 on the ground, and a
     free picker is how a group ends up invisible on its own page. */
  function hueField(selected) {
    return '<div class="pm-field"><span class="asc-label">Colour</span>' +
      '<div class="pm-swatches" role="radiogroup" aria-label="Group colour">' +
        D().GROUP_HUES.map(function (h) {
          var on = h.hue.toLowerCase() === String(selected || '').toLowerCase();
          return '<button type="button" class="pm-swatch' + (on ? ' is-on' : '') + '"' +
            ' style="--pm-tint:' + h.hue + '" data-hue="' + esc(h.hue) + '"' +
            ' role="radio" aria-checked="' + (on ? 'true' : 'false') + '"' +
            ' title="' + esc(h.name) + '"><span class="hd-sr">' + esc(h.name) + '</span></button>';
        }).join('') +
      '</div></div>';
  }

  /* One handler for the whole grid, bound on the sheet each time it
     opens. It writes to a hidden field rather than to a closure, so
     readFields() picks the colour up with everything else and the save
     path stays one shape. */
  function mountHueGrid(root) {
    var grid = root.querySelector('.pm-swatches');
    if (!grid) return;
    grid.addEventListener('click', function (e) {
      var b = e.target.closest('[data-hue]');
      if (!b) return;
      grid.querySelectorAll('.pm-swatch').forEach(function (x) {
        x.classList.remove('is-on'); x.setAttribute('aria-checked', 'false');
      });
      b.classList.add('is-on'); b.setAttribute('aria-checked', 'true');
      var f = root.querySelector('[data-f="hue"]');
      if (f) f.value = b.dataset.hue;
    });
  }

  function openGroupEditor(id) {
    var d = D();
    var g = id ? d.catById('prompt', id) : null;
    if (id && (!g || g.id !== id)) { toast('That group is gone', true); return; }
    var hue = g ? g.hue : d.GROUP_HUES[0].hue;
    openModal({
      title: g ? 'Edit group' : 'New group',
      saveLabel: g ? 'Save changes' : 'Add group',
      body:
        fieldText('Name', 'label', g ? g.label : '', 'Product briefs') +
        hueField(hue) +
        '<input type="hidden" data-f="hue" value="' + esc(hue) + '">' +
        (g ? '<p class="asc-small">' +
              esc(U().plural(d.groupCounts()[g.id] || 0, 'prompt')) + ' in this group.</p>' : ''),
      onMount: mountHueGrid,
      onSave: function (root) {
        var f = readFields(root);
        var label = String(f.label || '').trim();
        if (!label) { toast('Give the group a name', true); return false; }
        if (g) d.updateGroup(g.id, { label: label, hue: f.hue });
        else {
          var made = d.addGroup(label, f.hue);
          toast('Added ' + made.label);
        }
        return true;
      }
    });
  }

  /* DELETING A GROUP ASKS WHERE ITS PROMPTS GO. Nothing is ever silently
     un-filed: the dialogue says how many there are and offers every other
     group, defaulting to Other. A group with nothing in it still asks —
     one dialogue is easier to trust than two paths. */
  function confirmDeleteGroup(id) {
    var d = D();
    var g = d.catById('prompt', id);
    if (!g || g.id !== id) { toast('That group is gone', true); return; }
    if (id === d.FALLBACK_GROUP) {
      toast('Other cannot be deleted — it is where everything else lands', true);
      return;
    }
    var n = d.groupCounts()[id] || 0;
    var others = d.catList('prompt').filter(function (c) { return c.id !== id; });
    openModal({
      title: 'Delete ' + g.label + '?',
      saveLabel: 'Delete the group',
      body: '<p class="asc-body">' +
          (n ? 'This group holds ' + esc(U().plural(n, 'prompt')) +
               '. They are not deleted \u2014 choose where they go.'
             : 'This group is empty, so nothing moves.') + '</p>' +
        (n ? fieldSelect('Move them to', 'moveTo', d.FALLBACK_GROUP, others) : ''),
      onSave: function (root) {
        var f = readFields(root);
        var res = d.removeGroup(id, n ? f.moveTo : d.FALLBACK_GROUP);
        if (!res.ok) { toast('That group could not be deleted', true); return false; }
        toast(res.moved
          ? 'Deleted \u2014 ' + U().plural(res.moved, 'prompt') + ' moved to ' + d.catById('prompt', res.dest).label
          : 'Deleted');
        return true;
      }
    });
  }

  function openGroupMenu(id) {
    var g = D().catById('prompt', id);
    if (!g) return;
    openModal({
      title: g.label,
      hideActions: true,
      body: '<p class="asc-small">' +
          esc(U().plural(D().groupCounts()[id] || 0, 'prompt')) + ' in this group.</p>' +
        menuHtml([
          { act: 'g-edit', label: 'Rename or recolour' },
          { act: 'g-only', label: 'Show only this group' },
          { act: 'g-new', label: 'Add a new group' },
          { act: 'g-del', label: 'Delete this group', danger: id !== D().FALLBACK_GROUP }
        ])
    });
    var box = $('ascSheet');
    box.querySelector('[data-act="g-edit"]').onclick = function () { closeModal(); openGroupEditor(id); };
    box.querySelector('[data-act="g-new"]').onclick = function () { closeModal(); openGroupEditor(null); };
    box.querySelector('[data-act="g-only"]').onclick = function () {
      closeModal(); ui.cat = id; saveUi(); render();
    };
    box.querySelector('[data-act="g-del"]').onclick = function () { closeModal(); confirmDeleteGroup(id); };
  }

  function openToolEditor(id) {
    var d = D();
    var t = id ? d.Tools.get(id) : null;
    if (id && !t) { toast('That tool is gone', true); return; }
    openModal({
      title: t ? 'Edit tool' : 'Add a tool',
      saveLabel: t ? 'Save changes' : 'Add tool',
      body:
        '<div class="pm-fields2">' +
          fieldText('Name', 'name', t ? t.name : '', 'Claude') +
          fieldText('Icon', 'icon', t ? t.icon : '', '◈', 'One character or emoji. Optional.') +
        '</div>' +
        fieldText('Address', 'url', t ? t.url : '', 'claude.ai') +
        fieldSelect('Category', 'category', t ? t.category : 'ai', d.TOOL_CATEGORIES) +
        fieldText('What you use it for', 'useFor', t ? t.useFor : '', 'Long documents and code review', 'Shown when you open the tool, not on the list.') +
        fieldText('Tags', 'tags', t ? t.tags.join(', ') : '', 'daily, writing', 'Comma separated. Optional.') +
        fieldText('Account note', 'accountNote', t ? t.accountNote : '', 'Signed in with the Gmail account',
          'Which account you use. Never put a password here: this syncs to the cloud.') +
        fieldCheck('Kept', 'favorite', t ? t.favorite : false) +
        fieldCheck('Show in Quick Launch', 'quick', t ? t.quick : false),
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.name).trim()) { toast('Give it a name', true); return false; }
        var url = d.safeUrl(f.url);
        if (String(f.url).trim() && !url) { toast('That address does not look like a link', true); return false; }
        var patch = {
          name: String(f.name).trim(), icon: String(f.icon).trim().slice(0, 4), url: url,
          category: f.category, useFor: f.useFor, tags: parseTags(f.tags),
          accountNote: f.accountNote, favorite: !!f.favorite, quick: !!f.quick
        };
        if (t) { d.Tools.update(t.id, patch); return true; }
        patch.order = d.nextOrder(d.Tools.list());
        var made = d.Tools.add(patch);
        go('#/t/' + made.id);
        return true;
      }
    });
  }

  function openCollectionEditor(id, kind) {
    var d = D();
    var col = id ? d.Collections.get(id) : null;
    var k = col ? col.kind : (kind === 'tool' ? 'tool' : 'prompt');
    openModal({
      title: col ? 'Edit collection' : (k === 'tool' ? 'New stack' : 'New collection'),
      saveLabel: col ? 'Save changes' : 'Create',
      body:
        '<div class="pm-fields2">' +
          fieldText('Name', 'title', col ? col.title : '', k === 'tool' ? 'Writing stack' : 'Novel chapter workflow') +
          fieldText('Icon', 'icon', col ? col.icon : '', '', 'Optional.') +
        '</div>' +
        fieldText('What it is for', 'summary', col ? col.summary : '', 'Draft, critique, rewrite, line edit'),
      onSave: function (root) {
        var f = readFields(root);
        if (!String(f.title).trim()) { toast('Give it a name', true); return false; }
        var patch = { title: String(f.title).trim(), icon: String(f.icon).trim().slice(0, 4), summary: f.summary };
        if (col) { d.Collections.update(col.id, patch); return true; }
        patch.kind = k;
        patch.order = d.nextOrder(d.Collections.list());
        var made = d.Collections.add(patch);
        go('#/c/' + made.id);
        return true;
      }
    });
  }

  /* One picker serves "add steps to a collection" and "link prompts to a
     tool". Both are the same question — which of these, in what order —
     so they are the same sheet. */
  function openPicker(cfg) {
    var rows = cfg.items.map(function (it) {
      return '<label class="pm-check" style="padding:0 6px"><input type="checkbox" value="' + esc(it.id) + '"' +
        (cfg.selected.indexOf(it.id) >= 0 ? ' checked' : '') + '>' +
        '<span>' + esc(it.label) + (it.note ? ' <span style="color:var(--hd-fg-3);font-size:12px">' + esc(it.note) + '</span>' : '') + '</span></label>';
    }).join('');
    openModal({
      title: cfg.title,
      saveLabel: 'Save',
      body: cfg.items.length
        ? '<div id="pmPick" style="max-height:52vh;overflow:auto;margin:0 -6px">' + rows + '</div>' +
          '<span class="asc-small">New picks go on the end. Reorder them on the collection itself.</span>'
        : '<p class="asc-body">' + esc(cfg.emptyMsg || 'Nothing to pick from yet.') + '</p>',
      onSave: function (root) {
        var picked = Array.prototype.map.call(root.querySelectorAll('#pmPick input:checked'), function (n) { return n.value; });
        // Keep the existing order, drop what was unticked, append what is new.
        var next = cfg.selected.filter(function (id) { return picked.indexOf(id) >= 0; })
          .concat(picked.filter(function (id) { return cfg.selected.indexOf(id) < 0; }));
        cfg.onPick(next);
        return true;
      }
    });
  }

  function openStepPicker(colId) {
    var d = D();
    var col = d.Collections.get(colId);
    if (!col) return;
    var items = col.kind === 'tool'
      ? d.Tools.list().sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); })
          .map(function (t) { return { id: t.id, label: t.name, note: catLabel('tool', t.category) }; })
      : pvAll().sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); })
          .map(function (p) { return { id: p.uid, label: p.title, note: catLabel('prompt', p.category) }; });
    openPicker({
      title: 'Steps in ' + col.title,
      items: items, selected: col.itemIds.slice(),
      emptyMsg: col.kind === 'tool' ? 'Add a tool first.' : 'Add a prompt first.',
      onPick: function (ids) { d.Collections.update(colId, { itemIds: ids }); refreshCurrentView(); }
    });
  }
  function openLinkPrompts(toolId) {
    var d = D();
    var t = d.Tools.get(toolId);
    if (!t) return;
    openPicker({
      title: 'Prompts you run with ' + t.name,
      items: pvAll().sort(function (a, b) { return String(a.title).localeCompare(String(b.title)); })
        .map(function (p) { return { id: p.uid, label: p.title, note: catLabel('prompt', p.category) }; }),
      selected: t.relatedPrompts.slice(),
      emptyMsg: 'Add a prompt first.',
      onPick: function (ids) { d.Tools.update(toolId, { relatedPrompts: ids }); refreshCurrentView(); }
    });
  }

  /* Add-to-collection, offered from a prompt's own menu — the direction
     you actually think in when you have just written a prompt and realise
     it belongs in a workflow. */
  function openAddToCollection(uid) {
    var d = D();
    var cols = d.collectionsOfKind('prompt');
    if (!cols.length) { openCollectionEditor(null, 'prompt'); return; }
    var inNow = d.collectionsHolding('prompt', uid).map(function (c) { return c.id; });
    openPicker({
      title: 'Add to a collection',
      items: cols.map(function (c) { return { id: c.id, label: c.title, note: plural(c.itemIds.length, 'step') }; }),
      selected: inNow,
      onPick: function (ids) {
        cols.forEach(function (c) {
          var has = c.itemIds.indexOf(uid) >= 0, want = ids.indexOf(c.id) >= 0;
          if (has === want) return;
          var next = want ? c.itemIds.concat([uid]) : c.itemIds.filter(function (x) { return x !== uid; });
          d.Collections.update(c.id, { itemIds: next });
        });
        toast('Collections updated');
        refreshCurrentView();
      }
    });
  }

  // ============================================================
  // §MENUS — the ⋯ sheet. A modal rather than a popover: it needs no
  // positioning maths, it works the same on a phone, and it cannot end
  // up off-screen next to a card in the last column.
  // ============================================================
  function menuHtml(items) {
    return '<div class="pm-menu">' + items.map(function (it) {
      return '<button type="button" data-act="' + it.act + '"' + (it.danger ? ' class="is-danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('') + '</div>';
  }
  function openPromptMenu(uid) {
    var p = pvGet(uid);
    if (!p) return;
    var items = [
      { act: 'open', label: 'Open' },
      { act: 'copy', label: 'Copy prompt' },
      { act: 'fav', label: p.favorite ? 'Stop keeping it' : 'Keep it' },
      { act: 'collect', label: 'Add to a collection' }
    ];
    if (p.editable) {
      items.push({ act: 'edit', label: 'Edit' });
      items.push({ act: 'dupe', label: 'Duplicate' });
      items.push({ act: 'delete', label: 'Delete', danger: true });
    }
    openModal({
      title: p.title, hideActions: true, body: menuHtml(items),
      onMount: function (box) {
        box.querySelectorAll('[data-act]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var a = btn.dataset.act;
            closeModal();
            if (a === 'open') go('#/p/' + uid);
            else if (a === 'copy') doCopy(uid, null);
            else if (a === 'fav') toggleFav(uid);
            else if (a === 'collect') openAddToCollection(uid);
            else if (a === 'edit') openPromptEditor(uid);
            else if (a === 'dupe') duplicatePrompt(uid);
            else if (a === 'delete') confirmDeletePrompt(uid);
          });
        });
      }
    });
  }
  function openToolMenu(id) {
    var d = D(), t = d.Tools.get(id);
    if (!t) return;
    openModal({
      title: t.name, hideActions: true,
      body: menuHtml([
        { act: 'open', label: 'Open the tool' },
        { act: 'detail', label: 'Show details' },
        { act: 'fav', label: t.favorite ? 'Stop keeping it' : 'Keep it' },
        { act: 'quick', label: t.quick ? 'Remove from Quick Launch' : 'Add to Quick Launch' },
        { act: 'edit', label: 'Edit' },
        { act: 'delete', label: 'Delete', danger: true }
      ]),
      onMount: function (box) {
        box.querySelectorAll('[data-act]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var a = btn.dataset.act;
            closeModal();
            if (a === 'open' && t.url) { launchTool(id); window.open(t.url, '_blank', 'noopener'); }
            else if (a === 'detail') go('#/t/' + id);
            else if (a === 'fav') { d.Tools.update(id, { favorite: !t.favorite }); refreshCurrentView(); }
            else if (a === 'quick') { d.Tools.update(id, { quick: !t.quick }); toast(t.quick ? 'Removed from Quick Launch' : 'Added to Quick Launch'); refreshCurrentView(); }
            else if (a === 'edit') openToolEditor(id);
            else if (a === 'delete') confirmDeleteTool(id);
          });
        });
      }
    });
  }

  // ============================================================
  // §ACTIONS
  // ============================================================
  function isPromptUid(x) { return x.indexOf('prm:') === 0 || x.indexOf('cdx:') === 0; }

  function doCopy(uid, btn) {
    var p = pvGet(uid);
    if (!p) { toast('That prompt is gone', true); return; }
    copyText(p.text || '').then(function (ok) {
      if (!ok) { toast('Could not reach the clipboard', true); return; }
      pvTouch(uid);
      toast('Copied');
      if (btn) {
        btn.classList.add('is-done');
        var was = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(function () { btn.classList.remove('is-done'); btn.textContent = was; }, 1400);
      }
    });
  }
  function toggleFav(id) {
    var d = D();
    if (isPromptUid(id)) {
      var p = pvGet(id);
      if (!p) return;
      if (p.src === 'cdx' && !codexWritable()) { toast(gateReason(), true); return; }
      pvPatch(id, { favorite: !p.favorite });
    } else {
      var t = d.Tools.get(id);
      if (!t) return;
      d.Tools.update(id, { favorite: !t.favorite });
    }
    refreshCurrentView();
  }
  function launchTool(id) {
    var d = D(), t = d.Tools.get(id);
    if (!t) return;
    d.Tools.update(id, { useCount: (t.useCount || 0) + 1, lastOpenedAt: d.nowISO() });
  }
  function duplicatePrompt(uid) {
    var d = D(), p = pvGet(uid);
    if (!p) return;
    var made = d.Prompts.add({
      title: p.title + ' (copy)', text: p.text, category: p.category, compat: p.compat,
      tags: p.tags.slice(), notes: p.notes, order: d.nextOrder(d.Prompts.list())
    });
    toast('Duplicated');
    go('#/p/prm:' + made.id);
  }
  function confirmDeletePrompt(uid) {
    var p = pvGet(uid);
    if (!p) return;
    openModal({
      title: 'Delete ' + p.title + '?',
      saveLabel: 'Delete it',
      body: '<p class="asc-body">' +
        (p.fiction
          ? 'This prompt lives in the fiction library, so deleting it here deletes it there too.'
          : 'This removes the prompt and takes it out of any collection that uses it.') +
        ' A snapshot is kept on this device, so you can put it back from Settings.</p>',
      onSave: function () {
        if (!pvRemove(uid)) return false;
        toast('Deleted');
        go(hashForTab(ui.tab));
        return true;
      }
    });
  }
  function confirmDeleteTool(id) {
    var d = D(), t = d.Tools.get(id);
    if (!t) return;
    openModal({
      title: 'Delete ' + t.name + '?',
      saveLabel: 'Delete it',
      body: '<p class="asc-body">This removes the tool and takes it out of any stack that uses it. ' +
        'A snapshot is kept on this device, so you can put it back from Settings.</p>',
      onSave: function () { d.removeTool(id); toast('Deleted'); go('#/tools'); return true; }
    });
  }
  function clearFilters() {
    ui.q = ''; ui.cat = 'all'; ui.favOnly = false;
    saveUi(); render();
  }

  // ============================================================
  // §WIRING — bound once, on hosts that survive every repaint.
  // ============================================================
  function wire() {
    var app = $('pmApp');

    /* THE TWO CONTROLS THAT REPLACED THE DROP PANELS. A <select> reports
       a keyboard choice as `change` and never as a click, so both are
       bound on change — which is also why they can be native controls at
       all, and why renderPop()'s offset-measuring is gone. */
    on(app, '[data-setgroup]', 'change', function () {
      ui.group = this.value; saveUi(); render();
    });
    on(app, '[data-fcat]', 'change', function () {
      ui.cat = this.value; saveUi(); render();
    });
    on(app, '[data-ffav]', 'click', function () { ui.favOnly = !ui.favOnly; saveUi(); render(); });
    on(app, '[data-fclear]', 'click', clearFilters);
    /* Only the search. clearFilters() would also clear ui.favOnly, and
       the Kept tab is the one view that does not own that flag. */
    on(app, '[data-clearq]', 'click', function () { ui.q = ''; render(); });

    /* A CHIP IN THE HERO NARROWS THE LIBRARY. It is the one thing a
       full-viewport hero owes the reader: a way in that does not require
       scrolling past the picture first. Pressing the chip you are
       already on clears it again, so the hero is never a dead end. */
    on(app, '[data-cat]', 'click', function () {
      var c = this.dataset.cat;
      ui.cat = (ui.cat === c) ? 'all' : c;
      saveUi(); render();
      window.scrollTo({ top: 0, behavior: 'auto' });
    });

    /* Surprise me. It opens something you already have rather than
       suggesting something you do not — the point of a library you
       cannot see all of at once. */
    on(app, '[data-surprise]', 'click', function () {
      var pool = ui.tab === 'tools' ? D().Tools.list() : pvAll();
      if (!pool.length) { toast('Nothing to pick from yet'); return; }
      var pick = pool[Math.floor(Math.random() * pool.length)];
      go(ui.tab === 'tools' ? '#/t/' + pick.id : '#/p/' + pick.uid);
    });

    on(app, '[data-fold]', 'click', function () {
      var key = ui.tab + ':' + this.dataset.fold;
      var i = ui.shut.indexOf(key);
      if (i === -1) ui.shut.push(key); else ui.shut.splice(i, 1);
      saveUi();
      renderCurrentList();
    });
    on(app, '[data-back]', 'click', function () {
      if (history.length > 1) history.back();
      else go(hashForTab(ui.tab));
    });
    on(app, '[data-tool]', 'click', function () { go('#/t/' + this.dataset.tool); });

    on(app, '[data-new]', 'click', function () {
      if (this.dataset['new'] === 'tools') openToolEditor(null); else openPromptEditor(null);
    });
    on(app, '[data-newcol]', 'click', function () { openCollectionEditor(null, this.dataset.newcol); });
    on(app, '[data-copy]', 'click', function (e) { e.stopPropagation(); doCopy(this.dataset.copy, this); });
    on(app, '[data-peek]', 'click', function (e) { e.stopPropagation(); togglePeek(this.dataset.peek); });
    on(app, '[data-full]', 'click', function (e) { e.stopPropagation(); toggleFull(this.dataset.full); });
    on(app, '[data-groupmenu]', 'click', function (e) { e.stopPropagation(); openGroupMenu(this.dataset.groupmenu); });
    on(app, '[data-groupedit]', 'click', function () { openGroupEditor(this.dataset.groupedit); });
    on(app, '[data-groupdel]', 'click', function () { confirmDeleteGroup(this.dataset.groupdel); });
    on(app, '[data-groupnew]', 'click', function () { openGroupEditor(null); });
    on(app, '[data-fav]', 'click', function (e) { e.stopPropagation(); toggleFav(this.dataset.fav); });
    on(app, '[data-menu]', 'click', function (e) { e.stopPropagation(); openPromptMenu(this.dataset.menu); });
    on(app, '[data-toolmenu]', 'click', function (e) { e.stopPropagation(); openToolMenu(this.dataset.toolmenu); });
    actAsButton(app, '[data-open]', function () { go('#/p/' + this.dataset.open); });
    actAsButton(app, '[data-collection]', function () { go('#/c/' + this.dataset.collection); });
    on(app, '[data-launch]', 'click', function () { launchTool(this.dataset.launch); });
    on(app, '[data-go]', 'click', function () { go(this.dataset.go); });
    on(app, '[data-clearfilters]', 'click', clearFilters);

    on(app, '[data-edit]', 'click', function () { openPromptEditor(this.dataset.edit); });
    on(app, '[data-delete]', 'click', function () { confirmDeletePrompt(this.dataset['delete']); });
    on(app, '[data-edittool]', 'click', function () { openToolEditor(this.dataset.edittool); });
    on(app, '[data-deletetool]', 'click', function () { confirmDeleteTool(this.dataset.deletetool); });
    on(app, '[data-editcol]', 'click', function () { openCollectionEditor(this.dataset.editcol); });
    on(app, '[data-deletecol]', 'click', function () { confirmDeleteCollection(this.dataset.deletecol); });
    on(app, '[data-addstep]', 'click', function () { openStepPicker(this.dataset.addstep); });
    on(app, '[data-linkprompts]', 'click', function () { openLinkPrompts(this.dataset.linkprompts); });
    on(app, '[data-unstep]', 'click', function () {
      var p = parts();
      if (p[0] !== 'c' || !p[1]) return;
      var d = D(), col = d.Collections.get(p[1]);
      if (!col) return;
      var id = this.dataset.unstep;
      d.Collections.update(col.id, { itemIds: col.itemIds.filter(function (x) { return x !== id; }) });
      refreshCurrentView();
    });
    on(app, '[data-starter]', 'click', function () {
      var n = D().addStarterTools();
      toast(n ? 'Added ' + plural(n, 'tool') : 'Those are already here');
      if (ui.tab !== 'tools') { ui.tab = 'tools'; saveUi(); go('#/tools'); } else refreshCurrentView();
    });
    on(app, '[data-restore]', 'click', function () { confirmRestore(this.dataset.restore); });

    on(app, '#pmCopyFilled', 'click', function () {
      var p = pvGet(decodeURIComponent(parts()[1] || ''));
      if (!p) return;
      var values = {};
      $('pmView').querySelectorAll('[data-var]').forEach(function (el) { values[el.dataset.var] = el.value; });
      copyText(D().fillVariables(p.text, values)).then(function (ok) {
        if (!ok) { toast('Could not reach the clipboard', true); return; }
        pvTouch(p.uid);
        toast('Copied with your values');
      });
    });
    on(app, '#pmNotes', 'blur', function () {
      var uid = decodeURIComponent(parts()[1] || '');
      var p = pvGet(uid);
      if (!p || !p.editable || noteFor(p) === this.value) return;
      if (pvPatch(uid, { notes: this.value })) toast('Note saved');
    });
    on(app, '#pmShowFiction', 'change', function () { D().setSettings({ showFiction: this.checked }); toast(this.checked ? 'Fiction prompts shown' : 'Fiction prompts hidden'); });
    on(app, '#pmUnlock', 'click', function () { gate.unlocked = true; toast('Fiction prompts are editable'); refreshCurrentView(); });
    on(app, '#pmSnapNow', 'click', function () {
      var id = B() && B().snapshot('manual');
      toast(id ? 'Snapshot taken' : 'Nothing to snapshot yet', !id);
      refreshCurrentView();
    });

    // modal
    var box = $("ascSheet");
    on(box, '[data-modalclose]', 'click', closeModal);
    on(box, '#pmModalSave', 'click', function () {
      if (!modalSave) { closeModal(); return; }
      var res = modalSave($("ascSheet"));
      if (res === false) return;                 // the handler said the input was not usable
      closeModal();
      refreshCurrentView();
    });
    $("ascSheetBg").addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $("ascSheetBg").classList.contains("is-on")) closeModal();
    });

    wireChrome();
  }

  // ============================================================
  // §CHROME WIRING — the pill, the search, the keys, the scroll.
  //
  // These hosts are OUTSIDE #pmApp and outside every repaint, so
  // they are bound once here and never again. They are named, never
  // `document`: topbar.js, trash.js, save-state.js and
  // shrink-banner.js all inject chrome of their own into this page,
  // and a document-wide handler that preventDefaults anything with
  // a data-act on it is a trap laid for whichever of them adopts
  // the attribute next.
  // ============================================================
  function wireChrome() {
    var top = $('hdTop'), find = $('hdFind'), foot = $('pmFoot');

    on(top, '[data-act="find"]', 'click', function () { openFind(); });
    on(find, '[data-act="find-close"]', 'click', function () { closeFind(); });
    /* A result is a real link, so it navigates on its own; all this has
       to do is get the overlay out of the way first. */
    on(find, '[data-act="find-go"]', 'click', function () { closeFind(); });
    on(foot, '[data-go]', 'click', function () { go(this.dataset.go); });

    /* THE PILL BECOMES A MENU below 900px. The links do not fit beside
       the wordmark and must not shrink into illegibility, so they drop
       under it and the pill grows into a card. */
    on(top, '[data-act="menu"]', 'click', function () {
      var open = document.body.classList.toggle('hd-menu-on');
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    var findTimerLocal = 0;
    $('hdFindIn').addEventListener('input', function (e) {
      var v = e.target.value;
      clearTimeout(findTimerLocal);
      findTimerLocal = setTimeout(function () { paintFind(v); }, 130);
    });
    $('hdFindIn').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      /* Enter hands the query to the LIBRARY, where it becomes a token
         you can see and clear. A search that only ever lived in an
         overlay would leave you looking at a filtered page with no way
         to tell it apart from an empty one. */
      ui.q = e.target.value;
      closeFind();
      var p = parts();
      if (['p', 't', 'c', 'settings'].indexOf(p[0]) !== -1) go(hashForTab(ui.tab));
      else render();
    });

    $('addFab').onclick = function () {
      if (ui.tab === 'tools') openToolEditor(null); else openPromptEditor(null);
    };

    addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('hdFind').hidden) { e.preventDefault(); return closeFind(); }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if ($('ascSheetBg').classList.contains('is-on')) return;
      if (e.key === '/') { e.preventDefault(); return openFind(); }
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        return ui.tab === 'tools' ? openToolEditor(null) : openPromptEditor(null);
      }
    });

    // ══ SCROLL: THE PILL, AND THE PARALLAX ═══════════════════
    // ONE handler for both, in one rAF. Two listeners reading the
    // same scroll position on the same frame is two layout reads
    // where one would do.
    //
    // NOT `animation-timeline: scroll()`. Scroll-driven CSS
    // animations only reached iOS in Safari 26, and this has to
    // work on Damian's phone today.
    //
    // The hero is the first element of #pmView and #pmView starts
    // at y=0, so the hero's top is the document's top and its
    // height is all the geometry this needs. Measured once per
    // paint, not per frame.
    var stuck = null, ticking = false, heroEl = null, heroH = 0;

    readScroll = function (remeasure) {
      if (remeasure) {
        heroEl = $('pmView').querySelector('[data-parallax]');
        heroH = heroEl ? heroEl.offsetHeight : 0;
      }
      ticking = false;
      var y = window.scrollY || document.documentElement.scrollTop || 0;

      var want = y > 24;
      if (want !== stuck) { stuck = want; $('hdTop').classList.toggle('is-stuck', want); }

      if (!heroEl || !heroH) return;
      // Past the hero there is nothing to move, so this costs one
      // comparison per frame for the rest of the page. The `> heroH`
      // case still runs ONCE, to park the properties at their end
      // values rather than leaving them mid-travel.
      if (y > heroH + 40) {
        if (heroEl.dataset.parked !== '1') {
          heroEl.dataset.parked = '1';
          heroEl.style.setProperty('--hd-par', '0px');
          heroEl.style.setProperty('--hd-lift', '0px');
          heroEl.style.setProperty('--hd-fade', '0');
        }
        return;
      }
      heroEl.dataset.parked = '0';
      if (U().reducedMotion()) return;   // a still photograph, and nothing writes

      var pr = y / heroH;
      // The picture lags the page; the words leave before it does,
      // which is what reads as depth rather than as a stuck image.
      heroEl.style.setProperty('--hd-par', (y * 0.34).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-lift', (y * -0.06).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-fade', Math.max(0, 1 - pr / 0.62).toFixed(3));
    };

    addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { readScroll(false); });
    }, { passive: true });
    addEventListener('resize', function () { readScroll(true); }, { passive: true });
    /* A width change re-wraps every prompt, so what was nine lines can
       become eleven. Debounced, because a drag fires this continuously
       and each pass is a layout read over the whole library. */
    var clampTimer = 0;
    addEventListener('resize', function () {
      clearTimeout(clampTimer);
      clampTimer = setTimeout(function () { markClamped(); }, 180);
    }, { passive: true });
  }

  /* Typing repaints only the results, not the whole route: render() would
     rebuild the bar's controls in some cases, and the caret lives in
     there. */
  /* Repaints the current library WITHOUT navigating. Folding a group is
     not a route change, so it must not scroll — and because a view now
     paints its own hero, it also has to hand the scroll handler the new
     node. See [[rerender_must_not_scroll]]: a repaint that bounced the
     page to the top is exactly the bug the sync layer already had. */
  function renderCurrentList() {
    var y = window.scrollY;
    if (ui.tab === 'kept') viewKept();
    else if (ui.tab === 'tools') viewToolsHome();
    else viewPromptsHome();
    if (readScroll) readScroll(true);
    markClamped();
    window.scrollTo(0, y);
  }

  function confirmDeleteCollection(id) {
    var d = D(), col = d.Collections.get(id);
    if (!col) return;
    openModal({
      title: 'Delete ' + col.title + '?',
      saveLabel: 'Delete it',
      body: '<p class="asc-body">The collection goes; the ' + (col.kind === 'tool' ? 'tools' : 'prompts') +
        ' in it stay in the library.</p>',
      onSave: function () { d.Collections.remove(id); toast('Deleted'); go(col.kind === 'tool' ? '#/tools' : '#/'); return true; }
    });
  }
  function confirmRestore(snapId) {
    var b = B();
    if (!b) return;
    var snap = b.read(snapId);
    if (!snap) { toast('That snapshot is gone', true); return; }
    var counts = b.countsFor(snap.state);
    openModal({
      title: 'Restore this snapshot?',
      saveLabel: 'Restore it',
      body: '<p class="asc-body">This replaces what is on the page now with ' +
        esc(counts.length ? counts.join(', ') : 'an empty library') + ' from ' + esc(D().fmtAgo(snap.at)) + '. ' +
        'The current state is snapshotted first, so this is reversible too.</p>',
      onSave: function () {
        var n = b.restore(snapId);
        b.clearUndo();
        renderUndo();
        toast(n ? 'Restored ' + plural(n, 'record') : 'Nothing to restore', !n);
        return true;
      }
    });
  }

  // ============================================================
  // §STORAGE HEALTH — the two states where nothing above can help.
  //
  //   1. local-store-idb.js resolves to 'memory-only' when IndexedDB will
  //      not open (private-browsing restrictions, a corrupt profile). The
  //      shim still answers every read and write from its in-memory Map,
  //      so the page behaves perfectly — right up until the reload, when
  //      the whole session is gone.
  //   2. storeSet catches a write failure and dispatches prm:save with
  //      ok:false. A failed save is the literal event the snapshot store
  //      exists to prevent; it earns something that stays on screen
  //      rather than a toast that times out.
  // ============================================================
  var healthState = { backend: null, save: null };
  function renderHealth() {
    var el = $('pmHealth');
    if (!el) return;
    var msg = healthState.save || healthState.backend;
    el.hidden = !msg;
    el.innerHTML = msg || '';
    syncNoticeSpacing();
  }
  /* THE TWO NOTICES STACK. They are pinned to the same corner, so
     without this the second is drawn exactly on top of the first and
     whichever lost the race is invisible. Measured rather than assumed:
     either one can be one line or five, depending on the message. */
  function syncNoticeSpacing() {
    var health = $('pmHealth'), undo = $('pmUndo');
    var lift = health.hidden ? 0 : health.offsetHeight + 10;
    undo.style.setProperty('--pm-notice-lift', lift + 'px');
  }
  function checkStorageBackend() {
    var b = null;
    try { b = window.LocalStoreIDB && window.LocalStoreIDB.backend && window.LocalStoreIDB.backend(); } catch (e) {}
    if (b && b !== 'indexeddb') {
      healthState.backend =
        '<span><b>Not being saved.</b> This browser would not open its database, so everything you ' +
        'type here lasts only until the tab closes. Copy anything you need out now &mdash; a normal ' +
        'window, or a browser that is not blocking site storage, will save it properly.</span>';
    }
    renderHealth();
  }
  window.addEventListener('prm:save', function (e) {
    if (!e.detail) return;
    if (e.detail.ok === false) {
      healthState.save =
        '<span><b>That did not save.</b> Storage refused the write &mdash; it is most likely full. ' +
        'Copy what you just wrote somewhere safe, then clear some space.</span>';
      toast('Save failed — storage may be full', true);
      renderHealth();
    } else if (healthState.save) {
      healthState.save = null;                    // a later write got through
      renderHealth();
    }
  });

  // ============================================================
  // §UNDO — the rebuild's one destructive act, offered back.
  // ============================================================
  var undoDismissed = false;
  function renderUndo() {
    var el = $('pmUndo'), b = B();
    var w = !undoDismissed && b && b.pendingUndo();
    el.hidden = !w;
    syncNoticeSpacing();
    if (!w) return;
    var snap = b.read(w.snapId);
    var counts = snap ? b.countsFor(snap.state) : [];
    el.innerHTML =
      '<span>The old model-based prompt library was removed when this page was rebuilt' +
      (counts.length ? ' (' + esc(counts.join(', ')) + ')' : '') + '. A copy is kept on this device.</span>' +
      '<span class="pm-spacer"></span>' +
      '<button type="button" class="asc-btn asc-btn--sm" data-restore="' + esc(w.snapId) + '">Restore it</button>' +
      '<button type="button" class="asc-btn asc-btn--sm asc-btn--quiet" id="pmUndoDismiss">Dismiss</button>';
  }

  // ============================================================
  // §BOOT
  // ============================================================
  window.addEventListener('hashchange', function () {
    // A navigation RE-ARMS the entrance; a repaint does not. That is the
    // whole distinction the reveal clock exists to draw — see
    // introAttrs() in asclepion-ui.js, which hands a re-created element
    // a negative --t so a cloud pull resumes the animation instead of
    // replaying it.
    U().introArrive();
    // The phone menu is open over the page it just navigated away from.
    document.body.classList.remove('hd-menu-on');
    var b = $('hdBurger'); if (b) b.setAttribute('aria-expanded', 'false');
    runSafely(render, 'hashchange');
    // Scroll-to-top belongs to navigation, and ONLY to navigation. See
    // refreshCurrentView(), which deliberately does the opposite.
    window.scrollTo(0, 0);
    if (readScroll) readScroll(true);
  });
  window.addEventListener('online', function () { refreshCurrentView(); });
  window.addEventListener('offline', function () { refreshCurrentView(); });

  var remoteRef = { applied: false, pulled: false };

  /* §THE WIPE — run once, and only from onPulled.
     pushNow() sends collect() as the row's ENTIRE data column, so a write
     that beats the opening select erases every key this device lacks and
     then pushes the erasure as truth. Waiting for the pull is not a
     nicety; it is the difference between deleting the old library and
     deleting whatever else happened to be in the row. */
  var wipeDone = false;
  function runWipeOnce() {
    if (wipeDone) return;
    wipeDone = true;
    var d = D(), b = B();
    if (!b) { try { console.error('[Prompt Studio] backup module missing; wipe skipped'); } catch (e) {} return; }
    var snapId = b.snapshot('pre-wipe');
    // A null id means there was nothing worth snapshotting, which also
    // means there is nothing to lose — that, and only that, is when the
    // wipe may proceed without one.
    var res = d.wipeLegacy({ force: !snapId });
    if (!res.ran) return;
    if (snapId) { b.markWipe(snapId); renderUndo(); }
    try { console.info('[Prompt Studio] rebuilt: removed ' + res.removed.length + ' legacy key(s)'); } catch (e) {}
    refreshCurrentView();
  }

  function boot() {
    var d = D();
    if (!d) {
      document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#ccc">promptarium-data.js failed to load.</p>';
      return;
    }

    loadUi();
    wire();
    U().introArrive();
    /* Writes the eight defaults out the first time this device runs the
       new build, so Settings and the editor's select are editing
       something real rather than a list that exists only in memory. It
       runs AFTER LocalStoreIDB.ready() with everything else in boot, and
       BEFORE cloud sync mounts — a seed pushed on top of a row that
       already has groups would be the wrong way round, and seedGroupList
       only fills in when there is nothing there. */
    D().ensureGroups();
    checkStorageBackend();

    /* The snapshot store starts BEFORE cloud sync. The opening pull can
       change or delete local keys, and the whole point of the boot
       snapshot is that it records what was here before the cloud got a
       vote. */
    if (B()) B().init();
    renderUndo();
    $('pmUndo').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'pmUndoDismiss') { undoDismissed = true; renderUndo(); }
      var r = e.target && e.target.closest ? e.target.closest('[data-restore]') : null;
      if (r) confirmRestore(r.dataset.restore);
    });

    /* TWO sync mounts. The prm: one is registered FIRST so its
       localStorage patch sits innermost; sync.js captures the current
       setItem at call time, so the two wrappers chain and each pushes
       only its own prefix. This is correct ONLY because 'prm:' and 'cdx:'
       are disjoint — an overlap would make the two rows push each other
       in a loop. */
    if (typeof window.initCloudSync === 'function' && window.supabase) {
      window.initCloudSync({
        appKey: 'promptarium',
        syncedPrefixes: ['prm:'],
        // handoff: protects a write whose push never confirmed — a failed
        // request, a tab closed mid-flight — from being deleted by the next
        // visit's opening pull. See sync.js §HANDOFF.
        handoff: true,
        onPulled: function () { remoteRef.pulled = true; runWipeOnce(); },
        onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
      });
      // The Codex's own row, mounted read-write. See §CODEX GATE — nothing
      // may write a cdx: key until this has pulled.
      window.initCloudSync({
        appKey: 'codex',
        syncedPrefixes: ['cdx:'],
        handoff: true,
        onApplied: function () { gate.applied = true; refreshCurrentView(); }
      });
      gate.mounted = true;

      /* A row that is genuinely empty and a pull that never answers look
         identical from here. After three seconds the gate stops waiting
         and falls back to "is there any cdx: data on this device" —
         which is the check that actually protects the manuscripts. */
      setTimeout(function () {
        gate.graceOver = true;
        if (!remoteRef.pulled) runWipeOnce();      // offline first run: still one-shot, still snapshotted
        refreshCurrentView();
      }, 3000);
    } else {
      // No cloud at all (offline file, blocked CDN). Local-only is a
      // legitimate way to use this page; the wipe still needs to happen
      // once, and there is no row to race.
      runWipeOnce();
    }

    runSafely(render, 'boot');
  }

  /* local-store-idb.js hydrates localStorage from IndexedDB ASYNCHRONOUSLY,
     and until it resolves every read returns nothing. Booting before that is
     not merely a flash of an empty page — it is three worse things here:

       1. promptarium-backup.js would snapshot an empty store, so the copy
          taken "before anything is deleted" would be worthless at exactly
          the moment it is needed.
       2. wipeLegacy() would see no legacy keys, call the device a fresh
          install, and stamp the schema — leaving the old library in place
          forever once hydration finished.
       3. initCloudSync would pull and apply into an empty store.

     Every other page in this app already gates on ready() (see
     palaestra.html:1690). This one now does too. */
  function whenReady() {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot, boot);
    else boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();

})();
</script>
</body>
</html>
