      refreshCurrentView();
    });
    on(host, '[data-recolor]', 'click', function () {
      d.PurposeTags.update(this.dataset.recolor, { color: this.dataset.c });
      refreshCurrentView();
    });
    on(host, '[data-deltag]', 'click', function () {
      var t = d.purposeTagById(this.dataset.deltag); if (!t) return;
      var n = d.purposeTagUsage(t.id);
      if (!window.confirm('Delete "' + t.label + '"?' + (n ? '\n\nIt will be removed from ' + plural(n, 'record') + '. Those records are not deleted.' : ''))) return;
      d.removePurposeTag(t.id);
      toast('Tag deleted');
      refreshCurrentView();
    });

    var listHost = $('pmTagList');
    if (listHost && window.Sortable) {
      Sortable.create(listHost, {
        animation: 160, handle: '.pm-prompt-grip', draggable: '[data-tag]', ghostClass: 'pm-sortable-ghost',
        onEnd: function () {
          var ids = Array.prototype.map.call(listHost.querySelectorAll('[data-tag]'), function (n) { return n.dataset.tag; });
          d.reorderCollection(d.PurposeTags, ids);
        }
      });
    }
  }

  // ============================================================
  // §VIEW · SETTINGS
  // ============================================================
  function renderSettingsView(host) {
    var d = D(), st = d.getSettings();
    var reason = gateReason();
    var liveIds = cdxPromptList().map(function (p) { return p.id; });
    var orphans = d.orphanFictionMetaIds(liveIds);

    host.innerHTML =
      headHTML({
        eyebrow: 'Housekeeping', title: 'Settings',
        sub: 'Sync status, the shared fiction connection, and a way out of here with your data.',
        ticker: false
      }) +
      '<div class="pm-shell">' +

        '<section class="pm-section"><span class="pm-eyebrow">Shared fiction library</span>' +
        '<h2 class="pm-h2">Fiction is shared, not copied</h2>' +
        '<p class="pm-note-line" style="margin-bottom:var(--sp-3)">The Fiction collection lives in a second cloud row of its own (<code>cdx:</code>), separate from everything else on this page and shared with the manuscript records stored alongside it. Your ratings, purpose tags, creator and status for those prompts are kept separately here, because that row\'s own prompt model would strip fields it does not know.</p>' +
        '<div class="pm-card">' +
          '<p style="margin:0 0 var(--sp-3)"><b style="color:' + (reason ? 'var(--pm-amber-hi)' : 'var(--pm-good)') + '">' +
            (reason ? 'Read-only' : 'Live — writing enabled') + '</b><br>' +
            '<span style="font-size:12.5px;color:var(--pm-text-mute)">' + esc(reason || 'The fiction library has loaded and its prompts are editable from here.') + '</span></p>' +
          '<div class="pm-chip-row">' +
            '<span class="pm-pill">' + cdxKeyCount() + ' fiction keys local</span>' +
            '<span class="pm-pill">' + cdxPromptList().length + ' fiction prompts</span>' +
            '<span class="pm-pill">' + Object.keys(d.fictionMetaAll()).length + ' sidecar records</span>' +
          '</div>' +
        '</div></section>' +

        '<section class="pm-section"><span class="pm-eyebrow">Maintenance</span>' +
        '<h2 class="pm-h2">Data</h2>' +
        '<div class="pm-card"><div class="pm-chip-row">' +
          '<button type="button" class="pm-btn pm-btn-sm" data-export="1">Export everything as JSON</button>' +
          '<button type="button" class="pm-btn pm-btn-sm" data-orphans="1"' + (orphans.length && !reason ? '' : ' disabled') + '>' +
            'Clean up ' + orphans.length + ' orphaned fiction record' + (orphans.length === 1 ? '' : 's') + '</button>' +
          '<button type="button" class="pm-btn pm-btn-sm" data-togglefiction="1">' +
            (st.showFictionInLibrary ? 'Hide' : 'Show') + ' fiction prompts in the main library</button>' +
        '</div>' +
        (orphans.length && reason
          ? '<p class="pm-field-hint">Orphan cleanup stays disabled while the fiction library is read-only — a prompt missing right now may just mean it has not loaded on this device, and its rating is worth keeping until we know.</p>'
          : '') +
        '</div></section>' +

        '<section class="pm-section"><span class="pm-eyebrow">Elsewhere</span>' +
        '<h2 class="pm-h2">Related pages</h2>' +
        '<div class="pm-card"><p class="pm-note-line" style="margin-top:0">Every other dashboard is a separate build with its own data. Nothing here reads or writes theirs, and nothing there reads this.</p>' +
        '</div></section>' +
      '</div>';

    on(host, '[data-export]', 'click', function () {
      var dump = {};
      Object.keys(d.KEYS).forEach(function (k) { dump[d.KEYS[k]] = d.storeGet(d.KEYS[k]); });
      var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'promptarium-' + d.todayISO() + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('Exported');
    });
    // Re-read rather than using the captured `orphans` / `st`: this
    // handler is bound once and outlives every later render.
    on(host, '[data-orphans]', 'click', function () {
      var live = cdxPromptList().map(function (p) { return p.id; });
      var now = d.orphanFictionMetaIds(live);
      if (!now.length) { toast('Nothing to clean up'); return; }
      if (!window.confirm('Remove metadata for ' + plural(now.length, 'prompt') + ' that no longer exists in the fiction library?')) return;
      now.forEach(function (id) { d.dropFictionMeta(id); });
      toast('Cleaned up'); refreshCurrentView();
    });
    on(host, '[data-togglefiction]', 'click', function () {
      d.setSettings({ showFictionInLibrary: !d.getSettings().showFictionInLibrary });
      refreshCurrentView();
    });
  }

  // ============================================================
  // §QUICK CAPTURE
  //
  // The whole point is that capturing costs nothing: one textarea, no
  // required fields, no decisions. Everything lands in the inbox with a
  // title derived from the first line, and gets organized whenever.
  // ============================================================
  /* §DRAFT · capture. This surface has no record behind it — until Save
     runs there is nothing anywhere but the textarea — so it is the one
     place on the page where a refresh could destroy something that never
     existed twice. See §DRAFT STORE for why the key is not a prm: one. */
  var CAPTURE_DRAFT = 'capture';
  function captureFields() {
    return {
      text: ($('pmCaptureText') || {}).value || '',
      title: ($('pmCaptureTitle') || {}).value || '',
      collection: ($('pmCaptureCol') || {}).value || ''
    };
  }
  function captureDraftSave() { draftSet(CAPTURE_DRAFT, captureFields()); }

  function openCapture() {
    var d = D();
    var colOpts = [{ id: 'inbox', label: 'Unsorted — file it later' }].concat(
      d.collectionList().filter(function (c) { return c.source !== 'codex'; })
       .map(function (c) { return { id: c.id, label: c.label }; }));
    var draft = draftGet(CAPTURE_DRAFT);
    var f = draft ? draft.fields : null;

    $('pmCapture').innerHTML =
      '<div class="pm-modal-head">' +
        '<h2 class="pm-modal-title">Quick prompt</h2>' +
        '<button type="button" class="pm-btn pm-btn-icon" data-cclose="1" aria-label="Close">✕</button>' +
      '</div>' +
      (draft ? draftNoticeHTML(draft.at) : '') +
      '<textarea class="pm-capture-ta" id="pmCaptureText" placeholder="Paste the prompt. That is the whole job — a title gets taken from the first line and you can file it whenever.">' +
        (f ? esc(f.text) : '') +
      '</textarea>' +
      '<div class="pm-field-row" style="margin-top:var(--sp-3)">' +
        '<div class="pm-field" style="margin:0"><label class="pm-field-label" for="pmCaptureTitle">Title (optional)</label>' +
          '<input class="pm-input" id="pmCaptureTitle" placeholder="taken from the first line" value="' + (f ? esc(f.title) : '') + '"></div>' +
        '<div class="pm-field" style="margin:0"><label class="pm-field-label" for="pmCaptureCol">Collection</label>' +
          '<select class="pm-select" id="pmCaptureCol">' +
            selOpts(colOpts, (f && f.collection) || d.getSettings().captureCollection) + '</select></div>' +
      '</div>' +
      '<div class="pm-modal-foot">' +
        '<span class="pm-field-hint" style="margin:0"><kbd>Ctrl</kbd>+<kbd>↵</kbd> save · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>↵</kbd> save &amp; keep going</span>' +
        '<span class="pm-spacer"></span>' +
        '<button type="button" class="pm-btn pm-btn-sm" data-cclose="1">Cancel</button>' +
        '<button type="button" class="pm-btn pm-btn-sm pm-btn-primary" data-csave="1">Save</button>' +
      '</div>';
    $('pmCaptureBg').classList.add('show');
    setTimeout(function () {
      var ta = $('pmCaptureText');
      if (!ta) return;
      ta.focus();
      // Restored text puts the caret at the end, where you stopped typing,
      // instead of selecting or preceding the whole thing.
      if (f && f.text) { try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {} }
    }, 30);
  }
  /* Closing does NOT discard. Escape, the backdrop and ✕ are all things you
     can hit by accident; the draft survives all three and comes back on the
     next open. Only Save and the notice's own Discard clear it. */
  function closeCapture() { draftFlushNow(); $('pmCaptureBg').classList.remove('show'); }

  function saveCapture(keepOpen) {
    var d = D();
    var text = $('pmCaptureText').value;
    if (!text.trim()) { toast('Nothing to save', true); return; }
    var title = $('pmCaptureTitle').value.trim();
    if (!title) {
      var firstLine = text.split('\n').find(function (l) { return l.trim(); }) || 'Captured prompt';
      title = firstLine.trim().slice(0, 60) + (firstLine.trim().length > 60 ? '…' : '');
    }
    var col = $('pmCaptureCol').value || 'inbox';
    d.Prompts.add({
      title: title, text: text, collection: col, status: 'draft', creator: 'me',
      capturedAt: d.nowISO(), variables: d.detectVariables(text),
      order: d.nextOrder(d.Prompts.list())
    });
    d.setSettings({ captureCollection: col });
    // The prompt is a record now, so the draft has nothing left to protect.
    // Cancel the pending debounced write first or it would re-create one
    // from the fields as they stood a moment ago.
    clearTimeout(draftTimer); draftTimer = null; draftPending = null;
    draftClear(CAPTURE_DRAFT);
    toast(col === 'inbox' ? 'Captured to the inbox' : 'Saved');
    if (keepOpen) {
      $('pmCaptureText').value = ''; $('pmCaptureTitle').value = '';
      var notice = $('pmCapture').querySelector('[data-draftnotice]');
      if (notice) notice.remove();
      $('pmCaptureText').focus();
      renderRail();
    } else {
      closeCapture();
      refreshCurrentView();
    }
  }

  function openBulkFile() {
    var d = D();
    var inbox = pvAll().filter(function (p) { return p.collection === 'inbox'; });
    var colOpts = d.collectionList().filter(function (c) { return c.source !== 'codex'; })
      .map(function (c) { return { id: c.id, label: c.label }; });
    if (!colOpts.length) { toast('No collections to file into', true); return; }
    openModal({
      title: 'File ' + plural(inbox.length, 'item'),
      saveLabel: 'File them',
      body: '<p class="pm-note-line" style="margin-top:0">Everything currently in the inbox moves into the collection you pick. You can still edit each one afterwards.</p>' +
        fieldSelect('Collection', 'collection', colOpts[0].id, colOpts),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);
        inbox.forEach(function (p) { if (p.src === 'prm') d.Prompts.update(p.id, { collection: f.collection }); });
        toast('Filed ' + plural(inbox.length, 'prompt'));
      }
    });
  }

  // ============================================================
  // §BOOT
  // ============================================================
  window.addEventListener('hashchange', function () { runSafely(render, 'hashchange'); });

  /* TWO sync mounts. The prm: one is registered FIRST so its localStorage
     patch sits innermost; sync.js captures the current setItem at call
     time, so the two wrappers chain and each pushes only its own prefix.
     This is correct ONLY because 'prm:' and 'cdx:' are disjoint — an
     overlap would make the two rows push each other in a loop. */
  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'promptarium',
      syncedPrefixes: ['prm:'],
      onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
    });
    // The Codex's own row, mounted read-write. See §CODEX GATE — nothing
    // may write a cdx: key until this has pulled.
    window.initCloudSync({
      appKey: 'codex',
      syncedPrefixes: ['cdx:'],
      onApplied: function () { gate.applied = true; refreshCurrentView(); }
    });
    gate.mounted = true;
  }

  // ============================================================
  // §STORAGE HEALTH — the two states where nothing above can help.
  //
  // §FLUSH and §DRAFT both end at localStorage.setItem. If that write is
  // not actually being kept, every one of them is a no-op, and today both
  // ways it can fail are silent:
  //
  //   1. local-store-idb.js resolves to 'memory-only' when IndexedDB will
  //      not open (private-browsing restrictions, a corrupt profile). The
  //      shim still answers every read and write from its in-memory Map, so
  //      the page behaves perfectly — right up until the reload, when the
  //      whole session is gone. Nothing else on the page would say a word.
  //   2. storeSet catches a write failure and dispatches prm:save with
  //      ok:false. That used to raise a 2.2s toast. A failed save is the
  //      literal event this whole feature exists to prevent; it earns
  //      something that stays on screen.
  // ============================================================
  var healthState = { backend: null, save: null };
  function renderHealth() {
    var el = $('pmHealth');
    if (!el) return;
    var msg = healthState.save || healthState.backend;
    el.hidden = !msg;
    document.body.classList.toggle('pm-has-health', !!msg);
    el.innerHTML = msg || '';
  }
  function checkStorageBackend() {
    var b = null;
    try { b = window.LocalStoreIDB && window.LocalStoreIDB.backend && window.LocalStoreIDB.backend(); } catch (e) {}
    if (b && b !== 'indexeddb') {
      healthState.backend =
        '<b>Not being saved.</b> This browser would not open its database, so everything you ' +
        'type here lasts only until the tab closes. Copy anything you need out now — a normal ' +
        'window, or a browser that is not blocking site storage, will save it properly.';
    }
    renderHealth();
  }
  window.addEventListener('prm:save', function (e) {
    if (!e.detail) return;
    if (e.detail.ok === false) {
      healthState.save =
        '<b>That did not save.</b> Storage refused the write — it is most likely full. ' +
        'Copy what you just wrote somewhere safe, then clear some space from Settings.';
      toast('Save failed — storage may be full', true);
      renderHealth();
    } else if (healthState.save) {
      // A later write got through, so whatever it was has passed.
      healthState.save = null;
      renderHealth();
    }
  });
  window.addEventListener('online',  function () { refreshCurrentView(); });
  window.addEventListener('offline', function () { refreshCurrentView(); });

  function boot() {
    var d = D();
    if (!d) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">promptarium-data.js failed to load.</p>'; return; }

    if (d.getUiState().railFolded) setRailFolded(true);

    $('pmRailSpine').addEventListener('click', function () { setRailFolded(false); });
    on($('pmRail'), '[data-hash]', 'click', function () { go('#' + this.dataset.hash); });
    on($('pmRail'), '[data-act="capture"]', 'click', function () { openCapture(); });
    on($('pmRail'), '[data-act="fold"]', 'click', function () { setRailFolded(true); });

    $('pmFab').addEventListener('click', openCapture);

    mountStage();
    checkStorageBackend();
    $('pmBack').addEventListener('click', function () {
      if (histDepth > 0) { history.back(); return; }          // somewhere to go inside the page
      if (S.route.name !== 'home') { go('#/'); return; }       // deep-linked fresh tab → go up
      history.back();                                          // arrived from another row page
    });

    // Modal plumbing
    on($('pmModalBg'), '[data-mclose]', 'click', closeModal);
    on($('pmModalBg'), '[data-msave]', 'click', function () {
      if (!modalCtx || !modalCtx.onSave) { closeModal(); return; }
      var r = modalCtx.onSave($('pmModalBody'));
      if (r === false) return;                       // validation failed — keep it open
      modalDraftDrop();                              // it is a record now
      closeModal(); refreshCurrentView();
    });
    on($('pmModalBg'), '[data-mdelete]', 'click', function () {
      if (!modalCtx || !modalCtx.onDelete) return;
      if (modalCtx.onDelete() === false) return;
      modalDraftDrop();                              // the record is gone; so is its draft
      closeModal(); refreshCurrentView();
    });
    $('pmModalBg').addEventListener('mousedown', function (e) { if (e.target === this) closeModal(); });

    /* §DRAFT · the two live writers. Both hosts are static markup that
       survives every repaint, so `on` registers each pair exactly once and
       neither handler may close over view data — modalCtx is read inside
       modalDraftSave, at call time. `change` as well as `input` because a
       <select> is the field these two surfaces most rely on. */
    on($('pmModalBg'), '[data-f]', 'input', function () { draftSchedule(modalDraftSave); });
    on($('pmModalBg'), '[data-f]', 'change', function () { draftSchedule(modalDraftSave); });
    on($('pmCaptureBg'), '.pm-capture-ta,.pm-input,.pm-select', 'input', function () { draftSchedule(captureDraftSave); });
    on($('pmCaptureBg'), '.pm-capture-ta,.pm-input,.pm-select', 'change', function () { draftSchedule(captureDraftSave); });

    /* Discard, from either surface's restore notice. Clears the draft and
       repaints the surface from the record — for capture, from nothing. */
    on($('pmModalBg'), '[data-draftdiscard]', 'click', function () {
      var cfg = modalCtx;
      modalDraftDrop();
      closeModal();
      if (cfg) openModal(cfg);            // same cfg, now with no draft to find
    });
    on($('pmCaptureBg'), '[data-draftdiscard]', 'click', function () {
      clearTimeout(draftTimer); draftTimer = null; draftPending = null;
      draftClear(CAPTURE_DRAFT);
      openCapture();
    });

    on($('pmCaptureBg'), '[data-cclose]', 'click', closeCapture);
    on($('pmCaptureBg'), '[data-csave]', 'click', function () { saveCapture(false); });
    $('pmCaptureBg').addEventListener('mousedown', function (e) { if (e.target === this) closeCapture(); });
    $('pmCaptureBg').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveCapture(e.shiftKey); }
    });

    document.addEventListener('keydown', function (e) {
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (e.key === 'Escape') { closeModal(); closeCapture(); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); openCapture(); }
      if (e.key === '/') {
        var s = $('pmSearch');
        if (s) { e.preventDefault(); s.focus(); s.select(); }
        else { e.preventDefault(); go('#/library'); setTimeout(function () { var s2 = $('pmSearch'); if (s2) s2.focus(); }, 120); }
      }
    });

    /* The gate's fallback signal. onApplied only fires when applyRemote
       reports an actual change, so on a device whose local cdx: set
       already matches the remote it never fires at all — this timer is
       what lets fiction editing become possible there. */
    setTimeout(function () { gate.graceOver = true; refreshCurrentView(); }, 3000);

    render();

    d.maybeSeedAfterSyncAttempt(remoteRef, function (n) {
      toast('Added ' + plural(n, 'starter record'));
      refreshCurrentView();
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); });
    } else {
      runSafely(boot, 'boot');
    }
  });

  window.__pmRefresh = refreshCurrentView;
})();
</script>
</body>
</html>
