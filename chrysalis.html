<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Chrysalis</title>

<!-- MUST be first and never deferred: it replaces window.localStorage
     before any other script reads it. -->
<script src="local-store-idb.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrysalis-theme.css">

<style>
/* ============================================================
   THE CHRYSALIS — hub. Page-specific only; everything structural
   lives in chrysalis-theme.css.
   ============================================================ */

/* topbar.js injects a fixed launcher pill over the top-left of every
   page. The reel is centred so it clears it, but routed content that
   starts at the top does not. */
.chr-route{ padding-top:max(var(--chr-band), 96px) }

[hidden]{ display:none !important }

/* --- version rows: ruled lines, never cards --- */
.chr-vlist{ list-style:none; margin:0; padding:0 }
.chr-vrow{
  display:flex; align-items:baseline; gap:clamp(14px,2.4vw,30px);
  padding:clamp(20px,3vh,30px) 0;
  border-top:1px solid var(--chr-hair);
}
.chr-vrow:last-child{ border-bottom:1px solid var(--chr-hair) }
.chr-vrow__main{ flex:1 1 auto; min-width:0 }
/* The anchor image of a version, at index scale. A graduated self is
   worth recognising before it is worth reading. */
.chr-vrow__face{
  flex:none; display:block; width:clamp(52px,7vw,76px); aspect-ratio:3/4;
  overflow:hidden; align-self:center;
}
.chr-vrow__face img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(.35) brightness(.86);
  transition:filter var(--chr-mid) var(--chr-ease),
             transform var(--chr-mid) var(--chr-ease);
}
.chr-vrow:hover .chr-vrow__face img{ filter:none; transform:scale(1.03) }
.chr-vrow__name{
  font-family:var(--chr-display); font-weight:400;
  font-size:clamp(1.25rem,2.6vw,1.85rem);
  letter-spacing:.05em; color:var(--chr-ink);
  margin:0 0 4px;
}
.chr-vrow__name a{ color:inherit; text-decoration:none }
.chr-vrow__name a:hover{ color:var(--chr-rose-hi) }
.chr-vrow__name a:focus-visible{ outline:1px solid var(--chr-rose-hi); outline-offset:3px }
.chr-vrow__intent{ margin:0 0 8px; color:var(--chr-ink-mute); font-size:15px }
.chr-vrow__dates{ margin:0 }
.chr-vrow__acts{ flex:none; display:flex; flex-wrap:wrap; gap:8px; align-items:center }

.chr-pill{
  display:inline-block;
  font-size:9.5px; letter-spacing:.26em; text-indent:.26em;
  text-transform:uppercase;
  padding:3px 0;
  color:var(--chr-rose);
  border-bottom:1px solid var(--chr-hair-warm);
}
.chr-pill--archived{ color:var(--chr-ink-mute); border-bottom-color:var(--chr-hair) }

.chr-group{ margin-bottom:clamp(38px,6vh,64px) }

/* --- traits --- */
.chr-rung{
  display:inline-flex; align-items:center; gap:7px;
  font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--chr-rose-hi);
}
.chr-rung__bar{ display:inline-flex; gap:3px }
.chr-rung__pip{
  width:14px; height:1px; background:var(--chr-hair);
}
.chr-rung__pip.is-on{ background:var(--chr-rose) }
.chr-trait-stmt{
  font-family:var(--chr-display); font-weight:400;
  font-size:clamp(1.2rem,2.5vw,1.75rem);
  letter-spacing:.04em; color:var(--chr-ink); margin:0 0 6px;
}
.chr-trait-stmt a{ color:inherit; text-decoration:none }
.chr-trait-stmt a:hover{ color:var(--chr-rose-hi) }
.chr-trait-stmt a:focus-visible{ outline:1px solid var(--chr-rose-hi); outline-offset:3px }
.chr-trait-stmt span{ color:var(--chr-ink-mute); font-size:.62em; letter-spacing:.16em;
  text-transform:uppercase; font-family:var(--chr-body); display:block; margin-bottom:3px }

/* --- create form: underlines, no boxes --- */
.chr-form{
  display:grid; gap:clamp(18px,3vh,28px);
  max-width:var(--chr-field-w);
  margin-top:clamp(22px,4vh,36px);
}
.chr-form__row{ display:grid; gap:6px }
.chr-form__dates{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(18px,3vw,30px) }

.chr-note{
  margin:clamp(30px,5vh,54px) 0 0;
  padding-top:clamp(20px,3vh,30px);
  border-top:1px solid var(--chr-hair);
  color:var(--chr-ink-mute);
  font-size:14.5px;
}

/* ============================================================
   TODAY — the daily surface. One editorial column, never a panel
   of tiles: a dashboard grid is exactly the generic styling this
   page's direction rules out.
   ============================================================ */
.chr-day{
  display:flex; flex-wrap:wrap; align-items:baseline;
  gap:clamp(10px,2vw,26px);
  padding-bottom:clamp(20px,3.2vh,32px);
  border-bottom:1px solid var(--chr-hair);
}
.chr-day__name{
  margin:0; font-family:var(--chr-display); font-weight:400;
  font-size:clamp(1.15rem,2.4vw,1.6rem); letter-spacing:.06em;
}
.chr-day__name a{ color:inherit; text-decoration:none }
.chr-day__name a:hover{ color:var(--chr-rose-hi) }
.chr-day__name a:focus-visible{ outline:1px solid var(--chr-rose-hi); outline-offset:3px }
.chr-day__left{ margin:0; margin-left:auto }

.chr-today{ padding-top:clamp(34px,6vh,68px) }
.chr-today__cue{
  margin:0 0 clamp(12px,1.8vh,18px);
  font-size:10.5px; font-weight:400;
  letter-spacing:.34em; text-indent:.34em;
  text-transform:uppercase; color:var(--chr-rose);
}
.chr-today__act{
  margin:0;
  max-width:22ch;
  font-family:var(--chr-display); font-weight:300;
  font-size:clamp(1.85rem,5vw,3.7rem);
  line-height:1.14; letter-spacing:.035em;
  text-wrap:balance; color:var(--chr-ink);
}
.chr-today__meta{ margin:clamp(18px,2.6vh,26px) 0 0; display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center }
/* The link joins the rung as one utility line rather than sitting in
   body type beside it at half again the size. */
.chr-today__meta .chr-link{
  font-size:10.5px; letter-spacing:.28em; text-indent:.28em; text-transform:uppercase;
}

/* --- practice rows --- */
.chr-plist{ list-style:none; margin:clamp(22px,4vh,34px) 0 0; padding:0 }
.chr-prow{
  display:flex; align-items:flex-start; gap:clamp(10px,1.8vw,20px);
  padding:12px 0; border-top:1px solid var(--chr-hair);
}
.chr-prow:last-child{ border-bottom:1px solid var(--chr-hair) }
.chr-prow__main{ flex:1 1 auto; min-width:0; padding-top:8px }
.chr-prow__name{
  margin:0; font-size:16.5px; line-height:1.5; color:var(--chr-ink);
  transition:color var(--chr-mid) var(--chr-ease);
}
/* Done goes quiet, not triumphant. Nothing on this page celebrates a
   tick or mourns an empty one. */
.chr-prow.is-tied .chr-prow__name{ color:var(--chr-ink-mute) }
/* Sentence case, not tracked caps. A trait statement IS a sentence —
   "finishes what he starts" — and setting it as a label made three rows
   of practices read as a wall of signage. */
.chr-prow__sub{
  margin:3px 0 0; font-size:13.5px; line-height:1.55;
  letter-spacing:0; text-transform:none; color:var(--chr-ink-mute);
}
.chr-prow__sub em{ font-style:normal; color:var(--chr-rose) }
.chr-prow__acts{ flex:none; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-top:4px }

/* --- trait chips: which traits a practice installs --- */
.chr-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px }
.chr-chip{
  font-family:var(--chr-body); font-size:9.5px; font-weight:400;
  letter-spacing:.2em; text-indent:.2em; text-transform:uppercase;
  padding:7px 13px; border:1px solid var(--chr-hair);
  background:transparent; color:var(--chr-ink-mute); cursor:pointer;
  transition:color var(--chr-quick) var(--chr-ease),
             border-color var(--chr-quick) var(--chr-ease);
}
.chr-chip:hover{ color:var(--chr-ink); border-color:var(--chr-hair-warm) }
.chr-chip:focus-visible{ outline:1px solid var(--chr-rose-hi); outline-offset:3px; color:var(--chr-rose-hi) }
.chr-chip[aria-pressed="true"]{ color:var(--chr-rose-hi); border-color:var(--chr-hair-warm) }

/* ============================================================
   THE WEEK & THE LOG
   ============================================================ */
.chr-weeknav{
  display:flex; align-items:center; gap:clamp(12px,3vw,28px);
  padding-bottom:clamp(18px,3vh,28px);
  border-bottom:1px solid var(--chr-hair);
}
.chr-weeknav__label{
  flex:1 1 auto; margin:0; text-align:center;
  font-family:var(--chr-display); font-weight:400;
  font-size:clamp(1.15rem,2.4vw,1.7rem); letter-spacing:.06em;
}
.chr-weeknav__label .chr-meta{ display:block; margin-top:4px }

/* A trait's week, or a week in the log. A ruled block, not a card. */
.chr-wtrait{
  padding:clamp(24px,4vh,38px) 0;
  border-top:1px solid var(--chr-hair);
}
.chr-wtrait:first-of-type{ margin-top:clamp(12px,2vh,20px) }
.chr-wtrait:last-child{ border-bottom:1px solid var(--chr-hair) }
.chr-wtrait .chr-ev{ margin-top:clamp(12px,2vh,18px) }
.chr-wtrait .chr-ev li:first-child{ border-top:0; padding-top:0 }

/* The one long-form field on this page. Still a ruled line to write
   on, just a taller one. */
.chr-write{
  width:100%; min-height:clamp(180px,26vh,300px);
  margin-top:clamp(16px,2.6vh,24px);
  border:0; border-bottom:1px solid var(--chr-hair);
  background:transparent; color:var(--chr-ink);
  font-family:var(--chr-body); font-weight:300;
  font-size:16.5px; line-height:1.8; padding:4px 2px 14px; resize:vertical;
  transition:border-color var(--chr-quick) var(--chr-ease);
}
.chr-write:hover{ border-bottom-color:var(--chr-hair-warm) }
.chr-write:focus{ outline:none; border-bottom-color:var(--chr-rose) }
.chr-write::placeholder{ color:var(--chr-ink-mute); opacity:.55 }

.chr-filters{
  display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center;
  padding-bottom:clamp(6px,1vh,10px);
}
.chr-filters select{ flex:0 1 240px }

/* The worked example, marked wherever it is loaded. A hairline rule
   and a rose keyline — never a coloured alert box; there are none
   anywhere else on this page. */
.chr-example{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 20px;
  margin-bottom:clamp(28px,4vh,44px);
  padding:clamp(14px,2vh,20px) 0 clamp(14px,2vh,20px) 18px;
  border-left:1px solid var(--chr-rose);
  border-block:1px solid var(--chr-hair);
  color:var(--chr-ink-mute); font-size:14.5px;
}
.chr-example p{ margin:0; flex:1 1 320px; min-width:0 }

/* --- the hotkey hint --- */
.chr-hot{
  margin-left:16px; text-transform:none; letter-spacing:.04em; text-indent:0;
  color:var(--chr-ink-mute); font-size:11px;
}
.chr-hot kbd{
  font-family:var(--chr-body); font-size:10px; letter-spacing:.1em;
  padding:2px 6px; border:1px solid var(--chr-hair); color:var(--chr-ink);
}

@media (max-width:640px){
  .chr-vrow{ flex-wrap:wrap }
  .chr-vrow__acts{ width:100% }
  .chr-form__dates{ grid-template-columns:1fr }
  .chr-prow__acts{ padding-top:8px }
}
</style>
</head>
<body>

<div class="chr-grain" aria-hidden="true"></div>

<!-- ============================================================
     THE REEL — home only. Kept in the document rather than
     rendered per route: re-creating the <video> would restart it.
     ============================================================ -->
<header class="chr-reel" id="chrReel">
  <div class="chr-reel__stage">
    <div class="chr-reel__bg" aria-hidden="true">
      <video id="chrHeroVideo" autoplay muted loop playsinline preload="metadata"
             poster="images_by_admin/chrysalis/hero-poster.jpg">
        <source src="images_by_admin/chrysalis/hero.mp4" type="video/mp4">
      </video>
      <div class="chr-reel__crush"></div>
      <div class="chr-reel__wine"></div>
      <div class="chr-reel__glow"></div>
      <div class="chr-reel__edge"></div>
    </div>

    <div class="chr-reel__copy">
      <div class="chr-cell" data-cell="hero">
        <div class="chr-hero__inner">
          <p class="chr-eyebrow">The person you are becoming</p>
          <h1 class="chr-hero__title">The Chrysalis</h1>
          <p class="chr-hero__cue">Scroll to begin</p>
        </div>
      </div>
      <!-- Stage cells are generated from chr:stages. Edited on
           chrysalis-stages.html, not hard-coded here. -->
    </div>
  </div>
</header>

<!-- Compact hero for every route that is not home. -->
<header class="chr-reel chr-reel--short" id="chrShortHero" hidden>
  <div class="chr-reel__stage">
    <!-- The same footage as the reel, playing. It used to be the poster
         still, which made every routed page look frozen next to home. -->
    <div class="chr-reel__bg" aria-hidden="true">
      <video id="chrShortVideo" autoplay muted loop playsinline preload="metadata"
             poster="images_by_admin/chrysalis/hero-poster.jpg">
        <source src="images_by_admin/chrysalis/hero.mp4" type="video/mp4">
      </video>
      <div class="chr-reel__crush"></div>
      <div class="chr-reel__wine"></div>
      <div class="chr-reel__glow"></div>
      <div class="chr-reel__edge"></div>
    </div>
    <div class="chr-reel__copy">
      <div class="chr-cell">
        <div class="chr-hero__inner">
          <p class="chr-eyebrow" id="chrRouteEyebrow">The Chrysalis</p>
          <h1 class="chr-hero__title" id="chrRouteTitle">Versions</h1>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="chrRoot"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="chrysalis-data.js"></script>
<!-- Keystroke drafts for the weekly paragraph on #/review. Generic
     despite the name; it writes to REAL localStorage under an unsynced
     prefix, so an unsaved sentence survives a hard refresh. -->
<script src="athenaeum-drafts.js"></script>
<script src="photo-store.js"></script>
<script src="chrysalis-board.js"></script>
<!-- The route bar, the Back control, this page's how-to, its AI
     prompts and its notes. Inserted between the hero and <main>,
     never inside it. -->
<script src="chrysalis-nav.js"></script>
<script src="topbar.js" defer></script>

<script>
/* ============================================================
   THE CHRYSALIS — hub.
   Owns 'chr:*' and the 'chrysalis' Supabase row. Exactly one
   initCloudSync mount; never reads or writes another page's prefix.
   ============================================================ */
(function () {
  'use strict';

  var DB = window.ChrysalisDB;
  var root = document.getElementById('chrRoot');
  var reel = document.getElementById('chrReel');
  var shortHero = document.getElementById('chrShortHero');
  if (!DB || !root) { console.error('[Chrysalis] chrysalis-data.js did not load'); return; }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // ============================================================
  // CLOUD SYNC — mounted at parse time so a remote pull can land
  // before anything is seeded.
  // ============================================================
  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'chrysalis',
      syncedPrefixes: ['chr:'],
      onApplied: function () { remoteRef.applied = true; repaint(); }
    });
  }

  // ============================================================
  // ROUTER
  // ============================================================
  var ROUTES = {
    '/':          { nav: 'today',     title: 'The Chrysalis', eyebrow: '', render: renderToday },
    '/versions':  { nav: 'versions',  title: 'Versions', eyebrow: 'Who you are becoming, and by when', render: renderVersions },
    '/traits':    { nav: 'traits',    title: 'Traits', eyebrow: 'Permanent. They outlive the version chasing them', render: renderTraits },
    '/practices': { nav: 'practices', title: 'Practices', eyebrow: 'The behaviour that installs a trait', render: renderPractices },
    '/review':    { nav: 'review',    title: 'The Week', eyebrow: 'Read it back before you decide what it meant', render: renderReview },
    '/evidence':  { nav: 'evidence',  title: 'The Log', eyebrow: 'Every entry, in the week it landed in', render: renderEvidence },
    '/graduate':  { nav: 'graduate',  title: 'Graduate', eyebrow: 'Close one version, and say what the next one is', render: renderGraduate }
  };

  function route() {
    var h = (location.hash || '#/').replace(/^#/, '');
    return ROUTES[h] ? h : '/';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function plural(n, word) {
    return n + ' ' + word + (n === 1 ? '' : 's');
  }

  function longDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  /* The thread knots between sections. Same mark the trait page uses. */
  function seam() {
    return '<div class="chr-seam" aria-hidden="true">' +
      '<span class="chr-seam__rule"></span><span class="chr-seam__thread"></span>' +
      '<span class="chr-knot"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width=".9">' +
      '<circle cx="20" cy="20" r="5.4"/><circle cx="20" cy="20" r="1.6" fill="currentColor" stroke="none"/>' +
      '<path d="M14.6 14.6l-4 -4M25.4 14.6l4 -4M14.6 25.4l-4 4M25.4 25.4l4 4" stroke-opacity=".45"/>' +
      '</svg></span></div>';
  }

  /* A repaint is not a navigation. Scroll position is the reader's,
     and a cloud pull must never take it from them. */
  function repaint() {
    var y = window.scrollY;
    render(false);
    window.scrollTo(0, y);
  }

  function render(isNavigation) {
    var r = route();
    var def = ROUTES[r];

    var atHome = r === '/';
    reel.hidden = !atHome;
    shortHero.hidden = atHome;

    /* autoplay only fires while an element is rendered, and both heroes
       spend most of their life hidden. Whichever one is showing has to
       be told to play — otherwise a routed page shows a frozen first
       frame. Reduced motion keeps the poster still, as the brief asks. */
    playHero(atHome ? reel : shortHero, atHome ? shortHero : reel);

    if (!atHome) {
      document.getElementById('chrRouteTitle').textContent = def.title;
      document.getElementById('chrRouteEyebrow').textContent = def.eyebrow;
    }
    document.title = atHome ? 'The Chrysalis' : 'The Chrysalis — ' + def.title;

    /* The route bar and how-to live outside #chrRoot, so this only
       re-runs when the route actually changes — a cloud repaint on the
       same route leaves them, and the reader's open/closed how-to,
       exactly where they were. */
    if (window.ChrNav) window.ChrNav.set(def.nav);

    def.render();
    if (atHome) buildReel();
    reveal();

    /* Scroll-to-top belongs to navigation alone. */
    if (isNavigation) window.scrollTo(0, 0);
  }

  function playHero(shown, hidden) {
    var off = hidden && hidden.querySelector('video');
    if (off) off.pause();
    var on = shown && shown.querySelector('video');
    if (!on) return;
    if (reduce.matches) { on.pause(); on.currentTime = 0; return; }
    var p = on.play();
    /* A rejected play() is not an error worth logging: some browsers
       refuse until the document has been interacted with, and the
       poster is a perfectly good fallback until then. */
    if (p && p.catch) p.catch(function () {});
  }

  window.addEventListener('hashchange', function () {
    /* Arriving at the review is arriving at THIS week. Stepping back
       through the weeks is reading, and reading state should not
       survive leaving the page and coming back. */
    reviewWeek = null;
    render(true);
  });

  // ============================================================
  // TODAY — the daily surface. Under sixty seconds: the version you
  // are inside, one identity action, today's practices, one line of
  // evidence, the last three entries.
  //
  // What is deliberately absent is the design: no streak, no score, no
  // completion percentage, no red state, and no yesterday. A system
  // that grades you daily becomes an accusation on a bad week, and then
  // you stop opening it — which ends the project.
  // ============================================================

  /* The traits the day can draw from. Falls back to every trait when no
     version is chasing any, so the day's action does not disappear
     because a version has not been named yet. */
  function todayPool() {
    var v = DB.Versions.current();
    var chased = v
      ? v.traitIds.map(function (id) { return DB.Traits.get(id); }).filter(Boolean)
      : [];
    return chased.length ? chased : DB.Traits.list();
  }

  var TIE =
    '<svg viewBox="0 0 34 34" fill="none" aria-hidden="true">' +
      '<path class="chr-tie__thread" d="M17 1.5v9.6M17 22.9v9.6"/>' +
      '<circle class="chr-tie__ring" cx="17" cy="17" r="5"/>' +
      '<circle class="chr-tie__core" cx="17" cy="17" r="1.9"/>' +
      '<path class="chr-tie__stitch" d="M13.6 13.6l-3.1-3.1M20.4 13.6l3.1-3.1' +
        'M13.6 20.4l-3.1 3.1M20.4 20.4l3.1 3.1"/>' +
    '</svg>';

  function tieState(p, on) {
    if (p.cadence === 'weekly') return on ? 'Done this week' : 'This week';
    return on ? 'Done today' : 'Daily';
  }

  /* Returns HTML — every name is escaped here, so callers must not
     escape it again. `warmId` is the trait today's action is about; it
     renders warm, which is the one mark that says why this practice is
     on today's list. */
  function installsHTML(p, warmId) {
    var names = p.traitIds.map(function (id) {
      var t = DB.Traits.get(id);
      if (!t) return '';
      var n = esc(t.statement || 'untitled');
      return id === warmId ? '<em>' + n + '</em>' : n;
    }).filter(Boolean);
    /* "Installs someone who…" and not "Installs…": a trait statement
       completes "I am someone who", so on its own it reads as a broken
       sentence — "Installs is honest a beat before it is comfortable". */
    return names.length ? 'Installs someone who ' + names.join(' · ') : 'Not attached to a trait';
  }

  function practiceRow(p, warmId, day) {
    var on = DB.Practices.isDone(p, day);
    return '<li class="chr-prow' + (on ? ' is-tied' : '') + '">' +
      '<button class="chr-tie' + (on ? ' is-tied' : '') + '" type="button" ' +
        'data-tie="' + p.id + '" aria-pressed="' + on + '" ' +
        'aria-label="Mark done: ' + esc(p.name) + '">' + TIE + '</button>' +
      '<div class="chr-prow__main">' +
        '<p class="chr-prow__name">' + esc(p.name) + '</p>' +
        '<p class="chr-prow__sub chr-meta">' + installsHTML(p, warmId) + '</p>' +
      '</div>' +
      '<div class="chr-prow__acts">' +
        '<span class="chr-meta" data-tiestate>' + tieState(p, on) + '</span>' +
      '</div>' +
    '</li>';
  }

  function captureForm(pool, t) {
    return '<form class="chr-capture" id="chrCapture">' +
      '<label class="chr-meta" for="evText">What happened ' +
        '<span class="chr-hot">press <kbd>E</kbd></span></label>' +
      '<input class="chr-field chr-field--display" id="evText" name="text" type="text" required ' +
        'maxlength="2000" placeholder="One line. What you actually did.">' +
      '<div class="chr-capture__row">' +
        '<label class="chr-meta" for="evTrait" style="flex:none">For</label>' +
        '<select class="chr-field" id="evTrait" name="traitId" style="flex:1 1 220px">' +
          pool.map(function (x) {
            return '<option value="' + esc(x.id) + '"' + (t && x.id === t.id ? ' selected' : '') + '>' +
              esc(x.statement || 'untitled') + '</option>';
          }).join('') +
        '</select>' +
        '<label class="chr-meta" for="evKind" style="flex:none">This was</label>' +
        '<select class="chr-field" id="evKind" name="kind" style="flex:0 1 210px">' +
          '<option value="acted">acting as the new self</option>' +
          '<option value="fellback">falling back to the old self</option>' +
        '</select>' +
        '<button class="chr-act" type="submit">Log it</button>' +
      '</div>' +
    '</form>';
  }

  var DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6' +
    'M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  /* opts is an OBJECT, and every call site wraps it in its own function
     rather than being passed straight to .map(). Array.map hands its
     callback the index as a second argument, so `.map(evRow)` quietly
     made every entry after the first "deletable" — a delete button
     appeared on the daily surface and inside the weekly read-back,
     neither of which is meant to offer one. An object also means a
     stray index can no longer be mistaken for a flag. */
  function evRow(e, opts) {
    opts = opts || {};
    var t = (opts.withTrait === false || !e.traitId) ? null : DB.Traits.get(e.traitId);
    return '<li>' +
      '<span class="chr-ev__when chr-meta">' + esc(fmtDate(e.at)) + '</span>' +
      '<span class="chr-ev__what">' +
        '<span class="chr-ev__kind ' + esc(e.kind) + '">' +
          (e.kind === 'acted' ? 'Acted as the new self' : 'Fell back') +
          (t ? ' · ' + esc(t.statement) : '') +
        '</span>' +
        '<p>' + esc(e.text) + '</p>' +
      '</span>' +
      (opts.deletable
        ? '<button class="chr-tick chr-tick--danger" type="button" data-evdel="' + e.id + '" ' +
          'aria-label="Delete this entry">' + DEL + '</button>'
        : '') +
    '</li>';
  }

  /* Marked wherever it is loaded, so example sentences can never be
     mistaken for the reader's own record. */
  function exampleBanner() {
    if (!DB.Example.installed()) return '';
    return '<div class="chr-example">' +
      '<p>A worked example is loaded — one version, three traits with evidence under them, the ' +
      'practices that install them, and a week written about all of it. It is here to show the ' +
      'shape of the thing. Remove it whenever you like.</p>' +
      '<button class="chr-act chr-act--small" type="button" data-example="remove">' +
        'Remove the example</button>' +
    '</div>';
  }

  function exampleOffer() {
    if (DB.Example.installed()) return '';
    return '<button class="chr-act" type="button" data-example="load">Load a worked example</button>';
  }

  function onExampleAction(e) {
    var btn = e.target.closest('[data-example]');
    if (!btn) return;

    if (btn.getAttribute('data-example') === 'load') {
      DB.Example.install();
      renderRoute();
      window.scrollTo(0, 0);
      return;
    }

    if (!window.confirm('Remove the worked example? Its version, traits, practices, evidence and ' +
      'the week written with it all go. Anything you added to those goes too.')) return;
    DB.Example.remove();
    renderRoute();
  }

  function renderToday() {
    var day = DB.today();
    var v = DB.Versions.current();
    var pool = todayPool();
    var t = DB.traitOfTheDay(pool, day);
    var practices = DB.Practices.due();
    var recent = DB.Evidence.recent(3);

    root.innerHTML =
      /* The image board opens Today the way it opens The Becoming —
         same position, same records, same controls. You should see the
         person before you read the day's instruction. */
      window.ChrBoard.section({
        versionId: v ? v.id : '',
        label: 'The person you are becoming',
        title: 'The Image Board'
      }) +

      seam() +

      '<section class="chr-band" aria-labelledby="today-h"><div class="chr-band__inner">' +
        '<p class="chr-label">' + esc(longDate(day)) + '</p>' +
        exampleBanner() +
        '<div class="chr-day">' +
          (v
            ? '<p class="chr-day__name"><a href="chrysalis-version.html?id=' + encodeURIComponent(v.id) + '">' +
                esc(v.name) + '</a></p>' +
              '<p class="chr-day__left chr-meta">' + esc(daysLeft(v)) + '</p>'
            : '<p class="chr-day__name">No version yet</p>' +
              '<p class="chr-day__left"><a class="chr-link" href="#/versions">Name one</a></p>') +
        '</div>' +
        '<div class="chr-today">' +
          (t
            ? '<p class="chr-today__cue">Today, be the one who</p>' +
              '<h2 class="chr-today__act" id="today-h">' + esc(t.statement || 'untitled') + '</h2>' +
              '<p class="chr-today__meta">' +
                '<span class="chr-meta">' + esc(t.rung) + '</span>' +
                '<a class="chr-link" href="chrysalis-trait.html?id=' + encodeURIComponent(t.id) + '">' +
                  'Open the trait</a>' +
              '</p>'
            : '<p class="chr-today__cue">Today</p>' +
              '<h2 class="chr-today__act" id="today-h">Name the first trait</h2>' +
              '<p class="chr-today__meta">' +
                '<a class="chr-link" href="#/traits">I am someone who…</a></p>' +
              /* An empty Chrysalis cannot explain itself. The example is
                 the fastest way to see what a trait with evidence under
                 it actually looks like. */
              '<p style="margin-top:clamp(24px,3.6vh,36px)">' + exampleOffer() + '</p>') +
        '</div>' +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="prac-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Practices</p>' +
        '<h2 class="chr-h2" id="prac-h">What Installs It</h2>' +
        (practices.length
          ? '<p class="chr-lede">Tie the knot once you have done it. Nothing here is counted, and ' +
            'yesterday is not shown — a day you missed is not evidence of anything.</p>' +
            '<ul class="chr-plist">' + practices.map(function (p) {
                return practiceRow(p, t ? t.id : '', day);
              }).join('') + '</ul>'
          : '<p class="chr-lede">No practices yet. A practice is the repeatable behaviour that ' +
            '<em>installs</em> a trait — the thing you do, not the person it makes you.</p>') +
        '<p style="margin-top:clamp(26px,4vh,42px)"><a class="chr-act" href="#/practices">' +
          (practices.length ? 'All practices' : 'Add the first practice') + '</a></p>' +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="ev-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Evidence</p>' +
        '<h2 class="chr-h2" id="ev-h">What Actually Happened</h2>' +
        (pool.length
          ? '<p class="chr-lede">One line, while you still remember it. Acting as the new self and ' +
            'falling back to the old one are both worth writing down; only one of them is a ' +
            'surprise to read later.</p>' +
            captureForm(pool, t) +
            (recent.length
              ? '<ul class="chr-ev">' +
                recent.map(function (e) { return evRow(e); }).join('') + '</ul>'
              : '') +
            '<p class="chr-note">The last three. <a class="chr-link" href="#/evidence">The whole ' +
            'log</a> holds every entry ever written, and ' +
            '<a class="chr-link" href="#/review">the week</a> reads them back.</p>'
          : '<p class="chr-lede">Evidence belongs to a trait, so there is nothing to log until one ' +
            'exists. <a class="chr-link" href="#/traits">Name one.</a></p>') +
      '</div></section>';

    wireToday();
  }

  function wireToday() {
    var cur = DB.Versions.current();
    window.ChrBoard.wire(root, { versionId: cur ? cur.id : '' }, renderRoute);

    root.querySelectorAll('[data-tie]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = DB.Practices.toggle(btn.getAttribute('data-tie'));
        if (!p) return;
        var on = DB.Practices.isDone(p);
        /* Updated in place, never re-rendered. Ticking a practice must
           not move the page under the hand that just tapped it, or
           replay the section's entrance. */
        var row = btn.closest('.chr-prow');
        btn.classList.toggle('is-tied', on);
        btn.setAttribute('aria-pressed', String(on));
        if (!row) return;
        row.classList.toggle('is-tied', on);
        var st = row.querySelector('[data-tiestate]');
        if (st) st.textContent = tieState(p, on);
      });
    });

    var cap = root.querySelector('#chrCapture');
    if (!cap) return;
    cap.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = cap.text.value.trim();
      if (!text) return;
      var cur = DB.Versions.current();
      DB.Evidence.add({
        traitId: cap.traitId.value,
        versionId: cur ? cur.id : '',
        text: text,
        kind: cap.kind.value
      });
      renderRoute();
      var f = root.querySelector('#evText');
      if (f) f.focus({ preventScroll: true });
    });
  }

  /* Re-render the routed content and nothing else. The reel is a
     separate machine with its own scroll position and writing
     animation; rebuilding it because someone logged a line of evidence
     four screens below would restart the hero. */
  function renderRoute() {
    var y = window.scrollY;
    ROUTES[route()].render();
    reveal();
    window.scrollTo(0, y);
  }

  /* Single-key hotkey for the capture box, guarded so it can never fire
     while the reader is typing — including inside a <select>, where a
     bare letter is type-ahead. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'e' && e.key !== 'E') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
    var f = document.getElementById('evText');
    if (!f) return;
    e.preventDefault();
    f.focus({ preventScroll: true });
    f.scrollIntoView({ block: 'center' });
  });

  function daysLeft(v) {
    if (!v.targetDate) return 'No target date set';
    var t = new Date(v.targetDate + 'T00:00:00');
    if (isNaN(t)) return '';
    var days = Math.ceil((t - new Date()) / 86400000);
    if (days > 1) return days + ' days remaining';
    if (days === 1) return 'One day remaining';
    if (days === 0) return 'The target date is today';
    return 'Target date passed ' + Math.abs(days) + ' days ago';
  }

  // ============================================================
  // VERSIONS
  // ============================================================
  function renderVersions() {
    var all = DB.Versions.list();
    var groups = [
      { key: 'current',  label: 'Current',    empty: 'Nothing is current. Promote one below.' },
      { key: 'next',     label: 'Next',       empty: 'Nothing queued.' },
      { key: 'archived', label: 'Graduated',  empty: 'Nothing graduated yet.' }
    ];

    var html =
      '<section class="chr-band chr-route">' +
        '<div class="chr-band__inner">' + exampleBanner();

    groups.forEach(function (g) {
      var rows = all.filter(function (v) { return v.status === g.key; });
      html += '<div class="chr-group">' +
        '<p class="chr-label">' + g.label + '</p>' +
        (rows.length
          ? '<ul class="chr-vlist">' + rows.map(versionRow).join('') + '</ul>'
          : '<p class="chr-prose">' + g.empty + '</p>') +
        '</div>';
    });

    html +=
        '<div class="chr-group">' +
          '<p class="chr-label">New version</p>' +
          '<h2 class="chr-h2">Name the next self</h2>' +
          '<form class="chr-form" id="chrNewVersion">' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="nvName">Name</label>' +
              '<input class="chr-field chr-field--display" id="nvName" name="name" type="text" required ' +
                'placeholder="e.g. The one who finishes" maxlength="120">' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="nvIntent">What this version is for</label>' +
              '<input class="chr-field" id="nvIntent" name="intent" type="text" ' +
                'placeholder="One line. What has to be true by the end of it." maxlength="600">' +
            '</div>' +
            '<div class="chr-form__dates">' +
              '<div class="chr-form__row">' +
                '<label class="chr-meta" for="nvStart">Starts</label>' +
                '<input class="chr-field" id="nvStart" name="startDate" type="date">' +
              '</div>' +
              '<div class="chr-form__row">' +
                '<label class="chr-meta" for="nvTarget">Target</label>' +
                '<input class="chr-field" id="nvTarget" name="targetDate" type="date">' +
              '</div>' +
            '</div>' +
            '<p><button class="chr-act" type="submit">Create version</button></p>' +
          '</form>' +
        '</div>' +
      '</div></section>';

    root.innerHTML = html;

    root.querySelector('#chrNewVersion').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var name = f.name.value.trim();
      if (!name) { f.name.focus(); return; }
      DB.Versions.add({
        name: name,
        intent: f.intent.value.trim(),
        /* DB.today() and not toISOString(): the latter converts to UTC
           first, so creating a version on a Berlin evening dates it
           tomorrow. */
        startDate: f.startDate.value || DB.today(),
        targetDate: f.targetDate.value,
        status: DB.Versions.current() ? 'next' : 'current'
      });
      render(false);
    });

    root.addEventListener('click', onVersionAction);
  }

  function versionRow(v) {
    var weeks = DB.Reviews.writtenForVersion(v.id).length;
    var dates = [
      v.startDate ? 'From ' + fmtDate(v.startDate) : '',
      v.targetDate ? 'until ' + fmtDate(v.targetDate) : '',
      v.graduatedAt ? 'graduated ' + fmtDate(v.graduatedAt.slice(0, 10)) : '',
      /* What is actually IN an archive is the reason to open it again;
         its dates are not. */
      (v.status === 'archived' && weeks) ? plural(weeks, 'week') + ' written' : ''
    ].filter(Boolean).join(' · ');

    var acts = '<a class="chr-act chr-act--small" href="chrysalis-version.html?id=' +
      encodeURIComponent(v.id) + '">The Becoming</a>';
    if (v.status !== 'current' && v.status !== 'archived') {
      acts += '<button class="chr-act chr-act--small" data-act="promote" data-id="' + v.id + '">Make current</button>';
    }
    if (v.status === 'current') {
      /* A link to the ceremony, not a confirm dialog: graduating and
         naming what comes next is one decision, and a modal cannot ask
         which traits carry over. */
      acts += '<a class="chr-act chr-act--small" href="#/graduate">Graduate</a>';
    }
    acts += '<button class="chr-act chr-act--small" data-act="delete" data-id="' + v.id + '">Delete</button>';

    var anchor = DB.Images.anchorFor(v.id);

    return '<li class="chr-vrow">' +
      (anchor
        ? '<a class="chr-vrow__face" href="chrysalis-version.html?id=' + encodeURIComponent(v.id) + '" ' +
          'tabindex="-1" aria-hidden="true"><img src="' + esc(anchor.url) + '" alt="" loading="lazy"></a>'
        : '') +
      '<div class="chr-vrow__main">' +
        '<p class="chr-vrow__name">' +
          '<a href="chrysalis-version.html?id=' + encodeURIComponent(v.id) + '">' +
            esc(v.name || 'Untitled version') + '</a></p>' +
        (v.intent ? '<p class="chr-vrow__intent">' + esc(v.intent) + '</p>' : '') +
        (dates ? '<p class="chr-vrow__dates chr-meta">' + esc(dates) + '</p>' : '') +
      '</div>' +
      '<div class="chr-vrow__acts">' +
        '<span class="chr-pill' + (v.status === 'archived' ? ' chr-pill--archived' : '') + '">' + v.status + '</span>' +
        acts +
      '</div>' +
    '</li>';
  }

  function onVersionAction(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    var v = DB.Versions.get(id);
    if (!v) return;

    if (act === 'promote') DB.Versions.update(id, { status: 'current' });

    if (act === 'delete') {
      if (!window.confirm('Delete "' + v.name + '"? Its portrait, images and milestones go with it. ' +
        'Graduating keeps all of that as history; deleting does not.')) return;
      DB.Versions.removeCascade(id);
    }

    render(false);
  }

  // ============================================================
  // TRAITS
  // ============================================================
  function rungBar(rung) {
    var i = DB.RUNGS.indexOf(rung);
    return '<span class="chr-rung">' +
      '<span class="chr-rung__bar" aria-hidden="true">' +
        DB.RUNGS.map(function (_, n) {
          return '<span class="chr-rung__pip' + (n <= i ? ' is-on' : '') + '"></span>';
        }).join('') +
      '</span>' + esc(rung) + '</span>';
  }

  function renderTraits() {
    var traits = DB.Traits.list();
    var cur = DB.Versions.current();

    var rows = traits.map(function (t) {
      var n = DB.Evidence.countFor(t.id);
      var last = DB.Evidence.lastFor(t.id);
      var chasing = cur && cur.traitIds.indexOf(t.id) !== -1;
      var meta = [
        n + (n === 1 ? ' entry' : ' entries'),
        last ? 'last ' + fmtDate(last.at.slice(0, 10)) : 'no evidence yet'
      ].join(' · ');

      return '<li class="chr-vrow">' +
        '<div class="chr-vrow__main">' +
          '<p class="chr-trait-stmt"><span>I am someone who</span>' +
            '<a href="chrysalis-trait.html?id=' + encodeURIComponent(t.id) + '">' +
            esc(t.statement || 'untitled') + '</a></p>' +
          '<p class="chr-vrow__dates chr-meta">' + esc(meta) + '</p>' +
        '</div>' +
        '<div class="chr-vrow__acts">' +
          rungBar(t.rung) +
          (cur
            ? '<button class="chr-act chr-act--small" data-tact="chase" data-id="' + t.id + '">' +
              (chasing ? 'Chasing · detach' : 'Chase in this version') + '</button>'
            : '') +
          '<a class="chr-act chr-act--small" href="chrysalis-trait.html?id=' + encodeURIComponent(t.id) + '">Open</a>' +
        '</div>' +
      '</li>';
    }).join('');

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<div class="chr-group">' +
          '<p class="chr-lede">A trait is permanent. A version only <em>selects</em> traits to chase, ' +
          'so everything you gather here — the evidence especially — survives the version that chased it.' +
          (cur ? ' Currently chasing under <strong style="font-weight:400">' + esc(cur.name) + '</strong>.' : '') +
          '</p>' +
          (traits.length
            ? '<ul class="chr-vlist">' + rows + '</ul>'
            : '<p class="chr-prose">No traits yet. Name one below — the thing that separates you from ' +
              'the version you are chasing.</p>') +
        '</div>' +

        '<div class="chr-group">' +
          '<p class="chr-label">New trait</p>' +
          '<h2 class="chr-h2">I am someone who…</h2>' +
          '<form class="chr-form" id="chrNewTrait">' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="ntStatement">…finishes the sentence</label>' +
              '<input class="chr-field chr-field--display" id="ntStatement" name="statement" type="text" ' +
                'required maxlength="200" placeholder="finishes what he starts">' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="ntOld">The old self</label>' +
              '<input class="chr-field" id="ntOld" name="oldSelf" type="text" maxlength="1200" ' +
                'placeholder="What you have done instead, until now">' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="ntWhy">Why it matters</label>' +
              '<input class="chr-field" id="ntWhy" name="why" type="text" maxlength="1200" ' +
                'placeholder="What changes in your life if this becomes true">' +
            '</div>' +
            '<p><button class="chr-act" type="submit">Add trait</button></p>' +
          '</form>' +
        '</div>' +
      '</div></section>';

    root.querySelector('#chrNewTrait').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var s = f.statement.value.trim();
      if (!s) { f.statement.focus(); return; }
      var t = DB.Traits.add({ statement: s, oldSelf: f.oldSelf.value.trim(), why: f.why.value.trim() });
      /* A trait created while a version is current is presumed to be
         what that version is for — otherwise it is orphaned at birth. */
      if (cur) DB.Versions.toggleTrait(cur.id, t.id);
      render(false);
    });

    root.addEventListener('click', onTraitAction);
  }

  function onTraitAction(e) {
    var btn = e.target.closest('[data-tact]');
    if (!btn) return;
    var cur = DB.Versions.current();
    if (!cur) return;
    if (btn.getAttribute('data-tact') === 'chase') {
      DB.Versions.toggleTrait(cur.id, btn.getAttribute('data-id'));
      render(false);
    }
  }

  // ============================================================
  // PRACTICES — the management surface. Naming, retiring and pointing
  // each practice at the traits it installs.
  // ============================================================
  function chip(t, on) {
    return '<button type="button" class="chr-chip" data-trait="' + esc(t.id) + '" ' +
      'aria-pressed="' + (on ? 'true' : 'false') + '">' +
      esc(t.statement || 'untitled') + '</button>';
  }

  function manageRow(p, traits) {
    return '<li class="chr-prow" data-prac="' + p.id + '">' +
      '<div class="chr-prow__main">' +
        '<p class="chr-prow__name">' + esc(p.name) + '</p>' +
        /* No "installs …" line here: the chips below ARE that line, and
           printing both said the same thing twice per row. */
        (traits.length
          ? '<div class="chr-picker" role="group" aria-label="Traits this practice installs">' +
            traits.map(function (t) {
              return chip(t, p.traitIds.indexOf(t.id) !== -1);
            }).join('') + '</div>'
          : '') +
      '</div>' +
      '<div class="chr-prow__acts">' +
        '<span class="chr-pill">' + esc(p.cadence) + '</span>' +
        '<button class="chr-act chr-act--small" type="button" data-prac-act="' +
          (p.active ? 'retire' : 'restore') + '" data-id="' + p.id + '">' +
          (p.active ? 'Retire' : 'Restore') + '</button>' +
        '<button class="chr-act chr-act--small" type="button" data-prac-act="delete" ' +
          'data-id="' + p.id + '">Delete</button>' +
      '</div>' +
    '</li>';
  }

  function renderPractices() {
    var all = DB.Practices.list();
    var traits = DB.Traits.list();
    var active = all.filter(function (p) { return p.active; });
    var retired = all.filter(function (p) { return !p.active; });

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<div class="chr-group">' +
          '<p class="chr-lede">A practice is the repeatable behaviour that <em>installs</em> a trait. ' +
          'It is deliberately not scored, streaked or ranked — that is what Main Pillar is for. ' +
          'All this holds is what you do, and which person it is building.</p>' +
          (active.length
            ? '<ul class="chr-plist">' + active.map(function (p) { return manageRow(p, traits); }).join('') + '</ul>'
            : '<p class="chr-prose">No practices yet. Name one below.</p>') +
        '</div>' +

        (retired.length
          ? '<div class="chr-group">' +
              '<p class="chr-label">Retired</p>' +
              '<p class="chr-prose" style="margin-bottom:clamp(18px,3vh,26px)">Off the day, still on the ' +
              'record. That you once did this is part of how a trait got installed.</p>' +
              '<ul class="chr-plist">' + retired.map(function (p) { return manageRow(p, traits); }).join('') + '</ul>' +
            '</div>'
          : '') +

        '<div class="chr-group">' +
          '<p class="chr-label">New practice</p>' +
          '<h2 class="chr-h2">Name the behaviour</h2>' +
          '<form class="chr-form" id="chrNewPractice">' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="npName">What you do</label>' +
              '<input class="chr-field chr-field--display" id="npName" name="name" type="text" required ' +
                'maxlength="160" placeholder="e.g. One hour on it before anything else">' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="npCadence">How often</label>' +
              '<select class="chr-field" id="npCadence" name="cadence">' +
                '<option value="daily">daily</option>' +
                '<option value="weekly">weekly</option>' +
              '</select>' +
            '</div>' +
            (traits.length
              ? '<div class="chr-form__row">' +
                  '<span class="chr-meta">Installs</span>' +
                  '<div class="chr-picker" role="group" aria-label="Traits this practice installs">' +
                    traits.map(function (t) { return chip(t, false); }).join('') +
                  '</div>' +
                '</div>'
              : '<p class="chr-prose">No traits yet — add this now and attach it later, or ' +
                '<a class="chr-link" href="#/traits">name a trait first</a>.</p>') +
            '<p><button class="chr-act" type="submit">Add practice</button></p>' +
          '</form>' +
        '</div>' +
      '</div></section>';

    root.querySelector('#chrNewPractice').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var nameEl = f.elements.namedItem('name');
      var name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }
      var picked = [].slice.call(f.querySelectorAll('.chr-chip[aria-pressed="true"]'))
        .map(function (b) { return b.getAttribute('data-trait'); });
      DB.Practices.add({ name: name, cadence: f.cadence.value, traitIds: picked });
      render(false);
    });

    /* The new-practice chips hold their own state in the DOM until
       submit — nothing exists in the record to write to yet. */
    root.querySelectorAll('#chrNewPractice .chr-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
    });

    root.querySelectorAll('.chr-prow[data-prac] .chr-chip').forEach(function (b) {
      b.addEventListener('click', function () {
        var row = b.closest('[data-prac]');
        var traitId = b.getAttribute('data-trait');
        var p = DB.Practices.toggleTrait(row.getAttribute('data-prac'), traitId);
        if (!p) return;
        /* In place: a full re-render would move the row out from under
           the pointer while attaching a second trait. */
        b.setAttribute('aria-pressed', String(p.traitIds.indexOf(traitId) !== -1));
      });
    });

    root.addEventListener('click', onPracticeAction);
  }

  function onPracticeAction(e) {
    var btn = e.target.closest('[data-prac-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-prac-act');
    var p = DB.Practices.get(id);
    if (!p) return;

    if (act === 'retire')  DB.Practices.update(id, { active: false });
    if (act === 'restore') DB.Practices.update(id, { active: true });
    if (act === 'delete') {
      if (!window.confirm('Delete "' + p.name + '"? Retiring keeps it on the record as something ' +
        'you once did; deleting does not.')) return;
      DB.Practices.remove(id);
    }
    renderRoute();
  }

  // ============================================================
  // THE WEEK — the weekly ritual, in the order the plan fixed:
  // read the week back → set each rung → see what pulled you back →
  // adjust the practices → write one paragraph, which becomes a
  // permanent entry on the version's timeline.
  //
  // The paragraph is the point. It is the only thing in the whole
  // system that produces prose about a stretch of time rather than a
  // moment, and it is what makes a graduated version readable years
  // later. Everything above it exists to make it writable.
  // ============================================================

  /* Which week is on screen. A module variable, not the hash: stepping
     back through the weeks is reading, not navigation, and putting it
     in the URL would fill the browser history with it. Reset whenever
     the route is entered afresh. */
  var reviewWeek = null;

  function shiftWeek(monday, weeks) {
    var d = new Date(monday + 'T00:00:00');
    d.setDate(d.getDate() + weeks * 7);
    return DB.localISO(d);
  }

  /* formatRange, not two formatted dates joined by a dash: it knows
     that a range inside one month collapses to "August 10 – 16", and
     it knows which side the month goes on in the reader's locale,
     which stitching two strings together cannot. */
  function weekLabel(monday) {
    var a = new Date(monday + 'T00:00:00');
    var b = new Date(monday + 'T00:00:00');
    b.setDate(b.getDate() + 6);
    var opts = { day: 'numeric', month: 'long' };
    try {
      return new Intl.DateTimeFormat(undefined, opts).formatRange(a, b);
    } catch (e) {
      return a.toLocaleDateString(undefined, opts) + ' – ' + b.toLocaleDateString(undefined, opts);
    }
  }

  function ladder(traitId, rung, tight) {
    var at = DB.RUNGS.indexOf(rung);
    return '<div class="chr-ladder' + (tight ? ' chr-ladder--tight' : '') + '" role="group" ' +
      'aria-label="Embodiment rung">' +
      DB.RUNGS.map(function (r, i) {
        var cls = i === at ? 'is-at' : (i < at ? 'is-below' : '');
        return '<button type="button" class="' + cls + '" data-rung="' + esc(r) + '" ' +
          'data-trait="' + esc(traitId) + '" aria-pressed="' + (i === at) + '">' + esc(r) + '</button>';
      }).join('') +
    '</div>';
  }

  function renderReview() {
    var thisWeek = DB.mondayOf(DB.today());
    if (!reviewWeek) reviewWeek = thisWeek;
    var monday = reviewWeek;

    var v = DB.Versions.current();
    var pool = todayPool();
    var week = DB.Evidence.forWeek(monday);
    var review = DB.Reviews.forWeek(monday);
    var practices = DB.Practices.due();
    /* There is nothing to review about a week that has not happened. */
    var atLatest = monday >= thisWeek;

    /* Grouped by trait rather than listed by date: the next thing you
       do with this week is set each trait's rung, and reading a trait's
       week immediately above its own ladder is what makes that an
       informed decision rather than a mood. */
    var byTrait = pool.map(function (t) {
      return { trait: t, entries: week.filter(function (e) { return e.traitId === t.id; }) };
    });
    var orphans = week.filter(function (e) {
      return !pool.some(function (t) { return t.id === e.traitId; });
    });

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<div class="chr-weeknav">' +
          '<button class="chr-act chr-act--small" type="button" data-week="-1">‹ Earlier</button>' +
          '<p class="chr-weeknav__label" data-weekof="' + esc(monday) + '">' + esc(weekLabel(monday)) +
            (monday === thisWeek ? ' <span class="chr-meta">this week</span>' : '') + '</p>' +
          '<button class="chr-act chr-act--small" type="button" data-week="1"' +
            (atLatest ? ' disabled' : '') + '>Later ›</button>' +
        '</div>' +

        '<p class="chr-lede" style="margin-top:clamp(30px,5vh,48px)">' +
          (week.length
            ? esc(week.length + (week.length === 1 ? ' entry' : ' entries') + ' landed this week.') +
              ' Read them before you decide what the week meant — memory rewrites a week ' +
              'in whichever direction Sunday happens to feel.'
            : 'Nothing was logged this week. That is a gap in the record, not a verdict on the ' +
              'week — write the paragraph anyway if you have something to say.') +
        '</p>' +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="rb-h"><div class="chr-band__inner">' +
        '<p class="chr-label">One</p>' +
        '<h2 class="chr-h2" id="rb-h">Read It Back</h2>' +
        '<p class="chr-lede">Acting as the new self and falling back to the old one are both here, ' +
        'told apart but not ranked. Then move each rung — only if it is true, not because a week ' +
        'has gone by.</p>' +
        (byTrait.length
          ? byTrait.map(function (g) {
              return '<div class="chr-wtrait">' +
                '<h3 class="chr-h3"><a class="chr-link" href="chrysalis-trait.html?id=' +
                  encodeURIComponent(g.trait.id) + '">' + esc(g.trait.statement || 'untitled') + '</a></h3>' +
                (g.entries.length
                  /* withTrait:false — the block is already headed by
                     the trait, so repeating it on every row is noise. */
                  ? '<ul class="chr-ev">' + g.entries.map(function (e) {
                      return evRow(e, { withTrait: false });
                    }).join('') + '</ul>'
                  : '<p class="chr-prose" style="margin:6px 0 0">Nothing logged against this one.</p>') +
                ladder(g.trait.id, g.trait.rung, true) +
              '</div>';
            }).join('')
          : '<p class="chr-prose">No traits to review yet. ' +
            '<a class="chr-link" href="#/traits">Name one.</a></p>') +
        (orphans.length
          ? '<div class="chr-wtrait">' +
              '<h3 class="chr-h3">Logged against traits this version is not chasing</h3>' +
              '<ul class="chr-ev">' +
              orphans.map(function (e) { return evRow(e); }).join('') + '</ul>' +
            '</div>'
          : '') +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="adj-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Two</p>' +
        '<h2 class="chr-h2" id="adj-h">Adjust The Practices</h2>' +
        '<p class="chr-lede">A practice that did not survive the week is information about the ' +
        'practice, not about you. Retire it, or leave it and try it once more.</p>' +
        (practices.length
          ? '<ul class="chr-plist">' + practices.map(function (p) {
              return '<li class="chr-prow">' +
                '<div class="chr-prow__main">' +
                  '<p class="chr-prow__name">' + esc(p.name) + '</p>' +
                  '<p class="chr-prow__sub">' + installsHTML(p, '') + '</p>' +
                '</div>' +
                '<div class="chr-prow__acts">' +
                  '<span class="chr-pill">' + esc(p.cadence) + '</span>' +
                  '<button class="chr-act chr-act--small" type="button" data-prac-act="retire" ' +
                    'data-id="' + p.id + '">Retire</button>' +
                '</div>' +
              '</li>';
            }).join('') + '</ul>'
          : '<p class="chr-prose">No practices running.</p>') +
        '<p style="margin-top:clamp(26px,4vh,42px)"><a class="chr-act" href="#/practices">' +
          'All practices</a></p>' +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="wr-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Three</p>' +
        '<h2 class="chr-h2" id="wr-h">Write The Week</h2>' +
        '<p class="chr-lede">One paragraph. It becomes a permanent entry on the timeline, and it is ' +
        'the only thing here that will still make sense to you in a year.</p>' +
        '<div id="chrWeekWrite">' +
          '<textarea class="chr-write" data-week-para placeholder="What pulled you back, and what ' +
            'did you do about it? Name the pattern rather than the day.">' +
            esc(review ? review.paragraph : '') + '</textarea>' +
        '</div>' +
        '<p class="chr-meta" id="chrWeekStamp" style="margin-top:12px">' +
          (review && review.updatedAt ? 'Last written ' + esc(fmtDate(review.updatedAt)) : 'Not written yet') +
        '</p>' +
        (v ? '' : '<p class="chr-note">No version is current, so this will not appear on a timeline ' +
          'until one is. It is still kept against the week.</p>') +
      '</div></section>';

    wireReview(monday);
  }

  function wireReview(monday) {
    var wrap = root.querySelector('#chrWeekWrite');
    var ta = root.querySelector('[data-week-para]');
    var stamp = root.querySelector('#chrWeekStamp');
    var scope = 'chrysalis-review-' + monday;

    /* Keystroke-durable drafts, and a commit WHILE typing. A write
       queued at unload under the IndexedDB shim often never lands, and
       this is the longest thing written anywhere on this page. */
    var draft = (window.AthDraft && wrap) ? window.AthDraft.bind(scope, wrap, {}) : null;

    function commit() {
      if (!ta) return;
      /* Read the current version HERE and not from the render that
         wired this: the stamp belongs to the moment of writing, and a
         handler installed before the first cloud pull landed would
         otherwise file the paragraph under no version at all. */
      var cur = DB.Versions.current();
      var saved = DB.Reviews.write(monday, cur ? cur.id : '', ta.value);
      if (stamp) stamp.textContent = saved
        ? 'Last written ' + fmtDate(new Date().toISOString())
        : 'Not written yet';
      /* Clear the draft once it is in the record and re-bind without
         restoring. A kept draft can only be older than what is stored,
         so leaving it would let a stale local copy overwrite a newer
         one that arrived from another device. */
      if (draft && draft.clear) {
        draft.clear();
        draft = window.AthDraft ? window.AthDraft.bind(scope, wrap, { skipRestore: true }) : null;
      }
    }

    /* Writes while typing and on blur. The handle's flush() is what
       anything that re-renders calls first: the rebuild reads the
       paragraph back out of storage, so a click inside the debounce
       would otherwise discard the last sentence typed. */
    var saver = ta ? DB.autosave(ta, commit) : null;

    function flushThen(fn) {
      if (saver) saver.flush();
      fn();
    }

    root.querySelectorAll('[data-week]').forEach(function (b) {
      b.addEventListener('click', function () {
        flushThen(function () {
          reviewWeek = shiftWeek(monday, Number(b.getAttribute('data-week')));
          renderRoute();
          window.scrollTo(0, 0);
        });
      });
    });

    root.querySelectorAll('[data-rung][data-trait]').forEach(function (b) {
      b.addEventListener('click', function () {
        flushThen(function () {
          DB.Traits.setRung(b.getAttribute('data-trait'), b.getAttribute('data-rung'));
          renderRoute();
        });
      });
    });

    /* Retiring a practice from the review goes through the same handler
       as the practices page, so the confirm copy and the cascade cannot
       drift apart between the two surfaces. */
    root.addEventListener('click', onPracticeAction);
  }

  // ============================================================
  // GRADUATION — the full cycle, and the only place the system
  // proves it is a cycle rather than a single stretch.
  //
  // Closing a version and naming the next is ONE decision, so it is
  // one page. Graduating on its own would leave nothing current and
  // no route forward, which is exactly where a system like this
  // quietly stops being opened.
  // ============================================================
  function renderGraduate() {
    var v = DB.Versions.current();

    if (!v) {
      root.innerHTML = '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<h2 class="chr-h2">Nothing to graduate</h2>' +
        '<p class="chr-lede">No version is current. Graduation closes the one you are inside.</p>' +
        '<p><a class="chr-act" href="#/versions">All versions</a></p>' +
      '</div></section>';
      return;
    }

    var traits = DB.Traits.list();
    var chased = v.traitIds;

    var portrait = DB.Portraits.forVersion(v.id)[0];
    var answered = portrait ? Object.keys(portrait.fields).filter(function (k) {
      return String(portrait.fields[k]).trim() !== '';
    }).length : 0;

    var kept = [
      plural(DB.Images.forVersion(v.id).length, 'image'),
      plural(DB.Milestones.forVersion(v.id).length, 'milestone'),
      plural(DB.Reviews.writtenForVersion(v.id).length, 'week') + ' written',
      /* Named, not counted. "6 of 6 answered" is a completeness score,
         and there is not one of those anywhere else on this page. */
      answered === 0 ? 'portrait unwritten'
        : answered < DB.PORTRAIT_FIELDS.length ? 'portrait part-written'
        : 'portrait written'
    ];

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<p class="chr-label">Closing</p>' +
        '<h2 class="chr-h2">' + esc(v.name) + '</h2>' +
        (v.intent ? '<p class="chr-lede">' + esc(v.intent) + '</p>' : '') +
        '<p class="chr-lede">Graduating freezes this version. Nothing is deleted and nothing is ' +
        'scored — it simply stops being editable, so the person you were trying to become cannot ' +
        'later be quietly rewritten into someone easier to have been.</p>' +
        '<p class="chr-meta">Kept, read-only · ' + esc(kept.join(' · ')) + '</p>' +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="carry-h"><div class="chr-band__inner">' +
        '<p class="chr-label">One</p>' +
        '<h2 class="chr-h2" id="carry-h">What Carries Over</h2>' +
        '<p class="chr-lede">A trait you stop chasing is not a trait you lose. It keeps its rung ' +
        'and every piece of evidence under it — it just stops being what the next stretch is ' +
        '<em>about</em>. Turn off the ones this version finished with.</p>' +
        (traits.length
          ? '<div class="chr-picker" role="group" aria-label="Traits to carry into the next version">' +
            traits.map(function (t) {
              return '<button type="button" class="chr-chip" data-carry="' + esc(t.id) + '" ' +
                'aria-pressed="' + (chased.indexOf(t.id) !== -1) + '">' +
                esc(t.statement || 'untitled') + '</button>';
            }).join('') + '</div>'
          : '<p class="chr-prose">No traits yet.</p>') +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="next-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Two</p>' +
        '<h2 class="chr-h2" id="next-h">Name The Next Self</h2>' +
        '<p class="chr-lede">You can close this version without opening another, but the page has ' +
        'nothing to show you until one exists.</p>' +
        '<form class="chr-form" id="chrGraduate">' +
          '<div class="chr-form__row">' +
            '<label class="chr-meta" for="gvName">Name</label>' +
            '<input class="chr-field chr-field--display" id="gvName" name="name" type="text" ' +
              'maxlength="120" placeholder="Who comes after this one">' +
          '</div>' +
          '<div class="chr-form__row">' +
            '<label class="chr-meta" for="gvIntent">What it is for</label>' +
            '<input class="chr-field" id="gvIntent" name="intent" type="text" maxlength="600" ' +
              'placeholder="One line. What has to be true by the end of it.">' +
          '</div>' +
          '<div class="chr-form__dates">' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="gvStart">Starts</label>' +
              '<input class="chr-field" id="gvStart" name="startDate" type="date" value="' +
                esc(DB.today()) + '">' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="gvTarget">Target</label>' +
              '<input class="chr-field" id="gvTarget" name="targetDate" type="date">' +
            '</div>' +
          '</div>' +
          '<p style="display:flex;flex-wrap:wrap;gap:16px">' +
            '<button class="chr-act" type="submit">Graduate and begin the next</button>' +
            '<button class="chr-act" type="button" id="chrGradAlone">Graduate on its own</button>' +
          '</p>' +
        '</form>' +
      '</div></section>';

    wireGraduate(v);
  }

  function wireGraduate(v) {
    root.querySelectorAll('[data-carry]').forEach(function (b) {
      b.addEventListener('click', function () {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
    });

    function carried() {
      return [].slice.call(root.querySelectorAll('[data-carry][aria-pressed="true"]'))
        .map(function (b) { return b.getAttribute('data-carry'); });
    }

    function finish(next) {
      var result = DB.Versions.graduateInto(v.id, next);
      if (!result) return;
      location.hash = result.opened
        ? '#/'
        : '#/versions';
    }

    var form = root.querySelector('#chrGraduate');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var nameEl = form.elements.namedItem('name');
      var name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }
      if (!window.confirm('Graduate "' + v.name + '" and begin "' + name + '"? ' +
        'The old version becomes a permanent, read-only record.')) return;
      finish({
        name: name,
        intent: form.intent.value.trim(),
        startDate: form.startDate.value,
        targetDate: form.targetDate.value,
        traitIds: carried()
      });
    });

    root.querySelector('#chrGradAlone').addEventListener('click', function () {
      if (!window.confirm('Graduate "' + v.name + '" without starting another? ' +
        'Nothing will be current until you name one.')) return;
      finish(null);
    });
  }

  // ============================================================
  // THE LOG — every entry ever logged, in the week it landed in.
  // ============================================================
  var logTrait = 'all', logKind = 'all';

  function renderEvidence() {
    var traits = DB.Traits.list();
    var all = DB.Evidence.list().sort(function (a, b) {
      return String(b.at).localeCompare(String(a.at));
    }).filter(function (e) {
      return (logTrait === 'all' || e.traitId === logTrait) &&
             (logKind === 'all' || e.kind === logKind);
    });

    var weeks = DB.Evidence.byWeek(all);
    var mondays = Object.keys(weeks).sort(function (a, b) { return b.localeCompare(a); });

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<p class="chr-lede">Everything ever logged, newest first, grouped by the week it happened ' +
        'in. Nothing here is totalled or ranked — it is a record, and its only job is to be ' +
        'read back.</p>' +

        '<div class="chr-filters">' +
          '<label class="chr-meta" for="fTrait">Trait</label>' +
          '<select class="chr-field" id="fTrait">' +
            '<option value="all">every trait</option>' +
            traits.map(function (t) {
              return '<option value="' + esc(t.id) + '"' + (logTrait === t.id ? ' selected' : '') + '>' +
                esc(t.statement || 'untitled') + '</option>';
            }).join('') +
          '</select>' +
          '<label class="chr-meta" for="fKind">Showing</label>' +
          '<select class="chr-field" id="fKind">' +
            '<option value="all"' + (logKind === 'all' ? ' selected' : '') + '>both</option>' +
            '<option value="acted"' + (logKind === 'acted' ? ' selected' : '') + '>acted as the new self</option>' +
            '<option value="fellback"' + (logKind === 'fellback' ? ' selected' : '') + '>fell back</option>' +
          '</select>' +
        '</div>' +

        (mondays.length
          ? mondays.map(function (m) {
              return '<div class="chr-wtrait" data-weekof="' + esc(m) + '">' +
                '<h3 class="chr-h3">' + esc(weekLabel(m)) + '</h3>' +
                '<ul class="chr-ev">' + weeks[m].map(function (e) {
                  return evRow(e, { deletable: true });
                }).join('') + '</ul>' +
              '</div>';
            }).join('')
          : '<p class="chr-prose">' +
            (DB.Evidence.list().length
              ? 'Nothing matches that filter.'
              : 'Nothing logged yet. The first entry is the hardest and the most useful.') +
            '</p>') +
      '</div></section>';

    root.querySelector('#fTrait').addEventListener('change', function (e) {
      logTrait = e.target.value; renderRoute();
    });
    root.querySelector('#fKind').addEventListener('change', function (e) {
      logKind = e.target.value; renderRoute();
    });
    root.addEventListener('click', onEvidenceAction);
  }

  function onEvidenceAction(e) {
    var btn = e.target.closest('[data-evdel]');
    if (!btn) return;
    if (!window.confirm('Delete this entry? Evidence is meant to accumulate.')) return;
    DB.Evidence.remove(btn.getAttribute('data-evdel'));
    renderRoute();
  }

  // ============================================================
  // REVEALS — content must never be permanently invisible.
  // ============================================================
  function reveal() {
    var targets = root.querySelectorAll('.chr-band__inner > *');
    if (reduce.matches || !('IntersectionObserver' in window)) {
      targets.forEach(function (el) { el.classList.add('is-in'); });
      return;
    }
    targets.forEach(function (el) {
      /* Anything already on screen when this runs is shown at once and
         without transition. A cloud repaint re-creates these nodes, and
         replaying their entrance every time a pull lands is nauseating. */
      var box = el.getBoundingClientRect();
      if (box.top < window.innerHeight * 0.92) { el.classList.add('is-in'); return; }
      el.classList.add('chr-rise');
    });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('is-in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: .06 });

    root.querySelectorAll('.chr-rise:not(.is-in)').forEach(function (el) { io.observe(el); });
    window.setTimeout(function () {
      root.querySelectorAll('.chr-rise:not(.is-in)').forEach(function (el) { el.classList.add('is-in'); });
    }, 2400);
  }

  // ============================================================
  // THE REEL
  // ============================================================
  var ROTATE_MS = 4200, CELL_SCROLL = 130;
  var stages = [], cellEls = [], CELLS = 1, lastP = -1, ticking = false;
  var copy = reel.querySelector('.chr-reel__copy');
  var stageEl = reel.querySelector('.chr-reel__stage');

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function seg(p, a, b) { return clamp((p - a) / (b - a), 0, 1); }
  function ease(t) { return t * t * (3 - 2 * t); }

  function renderLine(s, text) {
    var frag = document.createDocumentFragment();
    var words = String(text || '').split(/\s+/).filter(Boolean);
    s.words = [];
    words.forEach(function (w, i) {
      var span = document.createElement('span');
      span.className = 'chr-word';
      span.textContent = w;
      frag.appendChild(span);
      if (i < words.length - 1) frag.appendChild(document.createTextNode(' '));
      s.words.push(span);
    });
    s.lineEl.textContent = '';
    s.lineEl.appendChild(frag);
    s.shown = -1;
  }

  function writeTo(s, n, stagger) {
    n = clamp(n, 0, s.words.length);
    if (n === s.shown) return;
    s.shown = n;
    for (var i = 0; i < s.words.length; i++) {
      var on = i < n;
      s.words[i].style.transitionDelay = (stagger && on) ? (i * 28) + 'ms' : '0ms';
      s.words[i].classList.toggle('is-writ', on);
    }
  }

  function buildReel() {
    document.documentElement.classList.add('chr-js');

    [].slice.call(copy.querySelectorAll('.chr-cell[data-stage]'))
      .forEach(function (n) { n.parentNode.removeChild(n); });

    stages = DB.Stages.list().map(function (d, i) {
      var cell = document.createElement('section');
      cell.className = 'chr-cell';
      cell.setAttribute('data-stage', String(i));
      var label = document.createElement('p');
      label.className = 'chr-eyebrow';
      label.id = 'chrStage' + i;
      label.textContent = d.label;
      var line = document.createElement('p');
      line.className = 'chr-line';
      cell.setAttribute('aria-labelledby', label.id);
      cell.appendChild(label);
      cell.appendChild(line);
      copy.appendChild(cell);
      return { data: d, el: cell, lineEl: line, labelEl: label,
               idx: 0, words: [], shown: -1, rotatedAt: 0 };
    });

    cellEls = [].slice.call(copy.querySelectorAll('.chr-cell'));
    CELLS = cellEls.length;
    stages.forEach(function (s) { renderLine(s, s.data.lines[0] || ''); });

    if (reduce.matches) {
      reel.classList.add('chr-reel--flat');
      reel.style.height = '';
      cellEls.forEach(function (el) {
        el.style.opacity = ''; el.style.transform = ''; el.style.pointerEvents = '';
        el.setAttribute('aria-hidden', 'false');
      });
      stages.forEach(function (s) { writeTo(s, s.words.length, false); });
      return;
    }

    reel.classList.remove('chr-reel--flat');
    reel.style.height = (CELLS * CELL_SCROLL) + 'svh';
    lastP = -1;
    frame();
  }

  function frame() {
    ticking = false;
    /* Boot is gated on the IndexedDB shim's async hydration, but the
       scroll listener is live from parse time. Reloading while scrolled
       down restores the scroll position and fires this before the reel
       has been built — cellEls is still empty and every read throws. */
    if (reel.hidden || !cellEls.length) return;
    var scrollable = reel.offsetHeight - stageEl.offsetHeight;
    if (scrollable <= 0) return;

    var p = clamp(-reel.getBoundingClientRect().top / scrollable, 0, 1);
    if (Math.abs(p - lastP) < 0.0004) return;
    lastP = p;

    for (var i = 0; i < CELLS; i++) {
      var a = i / CELLS, b = (i + 1) / CELLS;
      var fin  = (i === 0)         ? 1 : ease(seg(p, a - 0.02, a + 0.06));
      var fout = (i === CELLS - 1) ? 0 : ease(seg(p, b - 0.06, b + 0.02));
      var op = Math.min(fin, 1 - fout);

      var el = cellEls[i];
      el.style.opacity = op;
      el.style.transform = 'translateY(' + ((1 - op) * 16) + 'px)';
      el.style.pointerEvents = op > 0.5 ? 'auto' : 'none';
      el.setAttribute('aria-hidden', op < 0.05 ? 'true' : 'false');

      if (i === 0) continue;
      var s = stages[i - 1];
      if (!s) continue;
      var write = seg(p, a + 0.005, a + 0.105);
      if (op < 0.05) { writeTo(s, 0, false); s.rotatedAt = 0; }
      else if (write < 1) { writeTo(s, Math.ceil(write * s.words.length), false); }
      else { writeTo(s, s.words.length, false); if (!s.rotatedAt) s.rotatedAt = Date.now(); }
    }
  }

  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(frame);
  }, { passive: true });
  window.addEventListener('resize', function () { lastP = -1; frame(); });

  window.setInterval(function () {
    if (document.hidden || reduce.matches || reel.hidden) return;
    stages.forEach(function (s) {
      if (!s.rotatedAt || s.data.lines.length < 2) return;
      if (Date.now() - s.rotatedAt < ROTATE_MS) return;
      s.rotatedAt = Date.now();
      s.idx = (s.idx + 1) % s.data.lines.length;
      renderLine(s, s.data.lines[s.idx]);
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () { writeTo(s, s.words.length, true); });
      });
    });
  }, 500);

  // ============================================================
  // BOOT — gated on the IndexedDB shim's one-time hydration.
  // ============================================================
  DB.onChange(repaint);

  /* Bound once to the container rather than per render: the example
     controls appear on more than one route, and root outlives all of
     them. A named function makes the repeat binding a no-op anyway. */
  root.addEventListener('click', onExampleAction);

  function boot() {
    render(false);
    DB.seedAfterSyncAttempt(remoteRef, repaint);
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(boot);
    } else {
      boot();
    }
  });
})();
</script>

</body>
</html>
