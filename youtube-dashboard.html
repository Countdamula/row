<!doctype html>
<html lang="en">
<head>
<script src="local-store-idb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0a0806">
<title>YouTube Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Poppins:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="glass-theme.css">
<link rel="stylesheet" href="gallery-card.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2"></script>
<style>
/* =====================================================================
   YouTube Dashboard — a YouTube Business Operating System living in the
   existing "Business" nav folder, alongside Writing Dashboard. Built on
   this app's two shared UI kits (glass-theme.css/js + gallery-card.css/js
   — see their own header comments), same as Knowledge Hub/Design
   Library/Writing Dashboard, rather than a bespoke aesthetic layer. No
   reference photo/literal color instruction was given for this page, so
   per CLAUDE.md §6/DO NOT MODIFY rule 2 this defaults to the app's real
   near-black/gold common thread (gallery-card.css's own --gc-accent is
   already this exact gold) rather than inventing a new palette — the
   --gt-* repoint below just brings glass-theme.css's own tokens in line
   with that same gold instead of its default red.
   ===================================================================== */
:root {
  --gt-accent: #c9a876; --gt-accent-bright: #e8cf9f; --gt-accent-rgb: 201,168,118; --gt-accent-text: #1a1712;
  --gt-bgfx-rgb: 201,168,118; --gt-bg: #100d0a; --gt-bg-deep: #0a0806;
  --yd-good: #6ee7b7; --yd-warn: #fbbf24; --yd-bad: #ff8a8a; --yd-info: #7dd3fc;
  /* Same brand-guideline → font mapping Writing Dashboard already
     established from these exact two reference images (its own header
     comment, ~line 58): normal_text.jpg's bold rounded sans -> Poppins
     (body); banner & title_text.jpg's ornate high-contrast serif
     logotype -> the closest web-safe equivalent, Playfair Display
     (headings/display/hero). Reused verbatim rather than re-deriving a
     second interpretation of the same two images. */
  --yd-font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --yd-serif: "Playfair Display", Georgia, serif;
}
* { box-sizing: border-box; }
body { font-family: var(--yd-font); }
h1, h2, h3, .gt-btn-primary { font-family: inherit; }
.yd-shell { padding-top: 86px; }
@media (max-width: 620px) { .yd-shell { padding-top: 78px; } }

/* ---------- Top bar: breadcrumb + search + favorite ---------- */
.yd-topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 12px 4px 14px; margin-bottom: 6px; background: linear-gradient(180deg, var(--gt-bg-deep) 60%, rgba(10,8,6,0)); }
.yd-back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--gt-border); background: rgba(255,255,255,0.04); color: var(--gt-text-dim); font-weight: 700; font-size: 12.5px; cursor: pointer; flex-shrink: 0; }
.yd-back-btn:hover { color: var(--gt-accent-bright); border-color: rgba(var(--gt-accent-rgb),0.5); }
.yd-crumbs { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--gt-text-mute); min-width: 0; }
.yd-crumb { color: var(--gt-text-mute); cursor: pointer; white-space: nowrap; }
.yd-crumb:hover { color: var(--gt-accent-bright); }
.yd-crumb.current { color: var(--gt-text); font-weight: 700; }
.yd-crumb-sep { opacity: 0.4; }
.yd-topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.yd-icon-btn { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--gt-border); background: rgba(255,255,255,0.04); color: var(--gt-text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
.yd-icon-btn:hover { color: var(--gt-accent-bright); border-color: rgba(var(--gt-accent-rgb),0.5); }
.yd-icon-btn.on { color: #ffd166; border-color: rgba(255,209,102,0.5); }
.yd-search-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--gt-border); background: rgba(255,255,255,0.04); color: var(--gt-text-mute); font-size: 12.5px; cursor: pointer; }
.yd-search-btn:hover { color: var(--gt-accent-bright); border-color: rgba(var(--gt-accent-rgb),0.5); }
.yd-search-btn kbd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 5px; }

/* ---------- Page title block ---------- */
.yd-page-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.yd-page-title h1 { font-family: var(--yd-serif); font-weight: 800; font-size: 28px; letter-spacing: -0.01em; margin: 0; }
.yd-page-sub { font-size: 13px; color: var(--gt-text-mute); margin-top: 4px; }
.yd-page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Stat grid (Dashboard Home) ---------- */
.yd-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.yd-stat-tile { background: var(--gt-card); border: 1px solid var(--gt-border); border-radius: 16px; padding: 15px 16px; backdrop-filter: blur(16px) saturate(1.4); }
.yd-stat-tile .n { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.yd-stat-tile .l { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gt-text-mute); margin-top: 4px; }
.yd-stat-tile .n.good { color: var(--yd-good); } .yd-stat-tile .n.warn { color: var(--yd-warn); } .yd-stat-tile .n.info { color: var(--yd-info); }

/* ---------- Quick actions ---------- */
.yd-qa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.yd-qa-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 15px; border-radius: 14px; border: 1px solid var(--gt-border); background: rgba(255,255,255,0.03); cursor: pointer; color: var(--gt-text); text-align: left; font-family: inherit; transition: transform .15s ease, border-color .15s ease; }
.yd-qa-btn:hover { transform: translateY(-2px); border-color: rgba(var(--gt-accent-rgb),0.5); background: rgba(255,255,255,0.06); }
.yd-qa-btn .ic { font-size: 19px; }
.yd-qa-btn .lb { font-size: 12.5px; font-weight: 700; }

/* ---------- Tabs (squiggly nav wrapper spacing) ---------- */
.yd-tabbar { margin-bottom: 16px; }

/* ---------- Notes panel ---------- */
.yd-notes-panel { margin-bottom: 18px; }
.yd-notes-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 10px; }
.yd-notes-head-l { display: flex; align-items: center; gap: 9px; }
.yd-notes-count { font-size: 11px; font-weight: 700; color: var(--gt-text-mute); background: rgba(255,255,255,0.05); padding: 2px 9px; border-radius: 999px; }
.yd-notes-toggle { font-size: 11px; color: var(--gt-text-mute); transition: transform .2s ease; }
.yd-notes-panel.open .yd-notes-toggle { transform: rotate(90deg); }
.yd-notes-body { display: none; margin-top: 14px; }
.yd-notes-panel.open .yd-notes-body { display: block; }
.yd-notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.yd-note-card { background: rgba(255,255,255,0.035); border: 1px solid var(--gt-hairline); border-radius: 13px; padding: 12px 13px; cursor: pointer; position: relative; }
.yd-note-card:hover { border-color: rgba(var(--gt-accent-rgb),0.4); background: rgba(255,255,255,0.06); }
.yd-note-card .t { font-weight: 700; font-size: 13px; margin-bottom: 4px; padding-right: 16px; }
.yd-note-card .b { font-size: 11.5px; color: var(--gt-text-dim); line-height: 1.5; max-height: 3.2em; overflow: hidden; }
.yd-note-card .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.yd-note-color { position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 13px 0 0 13px; }
.yd-note-fav { position: absolute; top: 10px; right: 10px; font-size: 12px; color: #ffd166; }

/* ---------- Tables ---------- */
.yd-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--gt-hairline); }
.yd-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 720px; }
.yd-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gt-text-mute); padding: 10px 12px; border-bottom: 1px solid var(--gt-hairline); background: rgba(255,255,255,0.02); white-space: nowrap; }
.yd-table td { padding: 10px 12px; border-bottom: 1px solid var(--gt-hairline); vertical-align: middle; }
.yd-table tr:hover td { background: rgba(255,255,255,0.03); }
.yd-table tr { cursor: pointer; }
.yd-status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.yd-status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ---------- Kanban ---------- */
.yd-kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.yd-kanban-col { flex: 0 0 250px; background: rgba(255,255,255,0.02); border: 1px solid var(--gt-hairline); border-radius: 14px; padding: 10px; min-height: 120px; }
.yd-kanban-col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.yd-kanban-card { background: var(--gt-card); border: 1px solid var(--gt-hairline); border-radius: 11px; padding: 10px 11px; margin-bottom: 8px; cursor: pointer; font-size: 12.5px; }
.yd-kanban-card:hover { border-color: rgba(var(--gt-accent-rgb),0.5); }
.yd-kanban-card .t { font-weight: 700; margin-bottom: 5px; }
.yd-kanban-card .m { font-size: 10.5px; color: var(--gt-text-mute); display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Calendar ---------- */
.yd-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.yd-cal-dow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gt-text-mute); text-align: center; padding-bottom: 4px; }
.yd-cal-day { min-height: 84px; background: rgba(255,255,255,0.02); border: 1px solid var(--gt-hairline); border-radius: 10px; padding: 6px 7px; font-size: 11px; cursor: pointer; }
.yd-cal-day.other { opacity: 0.35; }
.yd-cal-day.today { border-color: rgba(var(--gt-accent-rgb),0.6); background: rgba(var(--gt-accent-rgb),0.08); }
.yd-cal-day:hover { border-color: rgba(var(--gt-accent-rgb),0.45); }
.yd-cal-daynum { font-weight: 700; margin-bottom: 4px; color: var(--gt-text-dim); }
.yd-cal-event { font-size: 9.5px; padding: 2px 5px; border-radius: 5px; margin-bottom: 2px; background: rgba(var(--gt-accent-rgb),0.16); color: var(--gt-accent-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yd-cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.yd-cal-nav .lbl { font-weight: 800; font-size: 15px; flex: 1; }

/* ---------- Checklist ---------- */
.yd-ck-section { margin-bottom: 16px; }
.yd-ck-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.yd-ck-section-head .t { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gt-text-dim); }
.yd-ck-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; margin-bottom: 4px; background: rgba(255,255,255,0.025); }
.yd-ck-item.sub { margin-left: 26px; }
.yd-ck-item.done { opacity: 0.5; }
.yd-ck-item.done .txt { text-decoration: line-through; }
.yd-ck-check { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--gt-border); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.yd-ck-item.done .yd-ck-check { background: var(--yd-good); border-color: var(--yd-good); color: #04140c; }
.yd-ck-item .txt { flex: 1; font-size: 12.5px; }
.yd-ck-progress-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; margin: 10px 0 18px; }
.yd-ck-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gt-accent), var(--gt-accent-bright)); border-radius: 999px; transition: width .3s ease; }

/* ---------- Sections engine (research/production panels) ---------- */
.yd-sec-card { background: rgba(255,255,255,0.03); border: 1px solid var(--gt-hairline); border-radius: 13px; padding: 13px 15px; margin-bottom: 10px; }
.yd-sec-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.yd-sec-card-head input { flex: 1; background: transparent; border: none; font-weight: 800; font-size: 13px; color: var(--gt-text); font-family: inherit; }
.yd-sec-card-head input:focus { outline: none; }
.yd-sec-card textarea { width: 100%; min-height: 70px; background: rgba(255,255,255,0.03); border: 1px solid var(--gt-hairline); border-radius: 10px; padding: 9px 11px; color: var(--gt-text-dim); font-size: 12.5px; font-family: inherit; resize: vertical; }
.yd-sec-mini-btn { background: transparent; border: none; color: var(--gt-text-mute); cursor: pointer; font-size: 12px; padding: 2px 6px; }
.yd-sec-mini-btn:hover { color: var(--gt-accent-bright); }

/* ---------- Video/Channel workspace header (video workspace only —
   the Channel workspace uses the full .gt-hero treatment below instead,
   see .yd-hero-crest et al.) ---------- */
.yd-ws-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; }
.yd-ws-thumb { width: 96px; height: 96px; border-radius: 16px; background: rgba(255,255,255,0.05); background-size: cover; background-position: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid var(--gt-hairline); }
.yd-ws-title-wrap { flex: 1; min-width: 220px; }
.yd-ws-title-wrap h1 { font-family: var(--yd-serif); font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
.yd-ws-meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Hero: page-scoped override of the shared .gt-hero
   component to center-align + display-serif title, the same treatment
   writing-dashboard.html already built from these exact two brand-
   guideline images (its own header comment, ~line 288) — cloned here
   rather than re-derived, per an explicit "resembles the same Hero
   section as the Writing Dashboard" request. Structural classes/ids
   stay exactly as glass-theme.js's wireHero() requires; only the
   cosmetic rules + the .yd-hero-crest/-diamond/-flourish/-trust/
   -credits dressing (itself cloned from Writing Dashboard's own crest,
   which that page's comment traces to normal_text.jpg's flanking-words/
   center-mark/diamonds/curling-flourish/3-column-credit-strip
   composition) are new here. ---------- */
.gt-hero { min-height: 58vh; justify-content: center; align-items: center; text-align: center; padding: 56px 26px; }
.gt-hero-content { max-width: 700px; display: flex; flex-direction: column; align-items: center; }
.gt-hero::before {
  content: ''; position: absolute; top: -18%; left: 50%; width: 900px; height: 900px; z-index: 1; pointer-events: none;
  transform: translateX(-50%);
  background: radial-gradient(ellipse 50% 40% at 50% 100%, rgba(var(--gt-accent-rgb),0.32) 0%, transparent 68%);
  filter: blur(10px);
}
.gt-hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(var(--gt-accent-rgb),0.12); border: 1px solid rgba(var(--gt-accent-rgb),0.35); border-radius: 999px; padding: 7px 16px; }
.gt-hero-eyebrow::before { display: none; }
.gt-hero-title {
  font-family: var(--yd-serif) !important; text-align: center; font-size: clamp(32px, 5.6vw, 50px); flex: 1; text-shadow: none;
  background: linear-gradient(180deg, #ffffff 0%, #f3ead9 42%, #c9a876 58%, #f6ecd8 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.gt-hero-subtext { text-align: center; max-width: 480px; margin-left: auto; margin-right: auto; }
.gt-hero-choice { align-items: flex-start; justify-content: flex-end; padding: 16px; }
@media (max-width: 620px) { .gt-hero { min-height: 48vh; padding: 42px 18px; } }

.yd-hero-actions { position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; gap: 6px; }
.yd-hero-crest { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-size: 11px; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gt-text-dim); }
.yd-hero-crest-icon { font-size: 15px; color: var(--gt-accent-bright); letter-spacing: 0; text-shadow: 0 0 10px rgba(var(--gt-accent-rgb),0.6); }
.yd-hero-title-row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
.yd-hero-diamond { flex-shrink: 0; font-size: 15px; color: var(--gt-accent-bright); opacity: 0.85; text-shadow: 0 0 10px rgba(var(--gt-accent-rgb),0.6); }
.yd-hero-flourish { display: block; width: min(420px, 70%); height: 22px; margin: 4px auto 0; opacity: 0.55; }
.yd-hero-flourish path { fill: none; stroke: var(--gt-accent-bright); stroke-width: 1.3; }
.yd-hero-trust { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 12px; color: var(--gt-text-dim); flex-wrap: wrap; justify-content: center; }
.yd-hero-trust-item b { color: var(--gt-accent-bright); font-variant-numeric: tabular-nums; }
.yd-hero-trust-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gt-text-mute); }
.yd-hero-credits { display: grid; grid-template-columns: repeat(3, auto); gap: 26px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--gt-hairline); width: 100%; max-width: 560px; }
.yd-hero-credit { text-align: center; }
.yd-hero-credit-top { font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gt-text-mute); margin-bottom: 4px; }
.yd-hero-credit-bottom { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gt-text-dim); }
@media (max-width: 560px) { .yd-hero-credits { grid-template-columns: 1fr; gap: 10px; } }
/* Channel Hero: same crest/diamond/flourish/credits treatment as
   Home's, condensed — a tab bar sits directly beneath it. */
#ydChannelHero { min-height: 30vh; padding: 34px 24px; }
#ydChannelHero .yd-hero-crest { margin-bottom: 10px; }
#ydChannelHero .gt-hero-title { font-size: clamp(26px, 4.4vw, 40px); }
#ydChannelHero .yd-hero-credits { margin-top: 16px; padding-top: 12px; }

/* ---------- Channel cards — deliberately bigger than the standard
   .gc-card size used everywhere else in this app (videos/assets/
   templates all stay standard-size) — same "the top of this app's own
   hierarchy reads as visually distinct" precedent writing-dashboard
   .html's own Series Library grid (.wd-series-card-lg) already
   established, reused both on Dashboard Home's own channel gallery and
   the standalone Channels page. ---------- */
.yd-channel-grid-lg { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
.yd-channel-card-lg { border-width: 1.5px; }
.yd-channel-card-lg .gc-card-cover-wrap { aspect-ratio: 16/9; }
.yd-channel-card-lg .gc-card-cover-fallback { font-size: 56px; }
.yd-channel-card-lg .gc-card-body { padding: 18px 20px 20px; gap: 8px; }
.yd-channel-card-lg .gc-card-title { font-size: 23px; }
.yd-channel-card-lg .gc-card-subtopic { font-size: 12px; }
.yd-channel-card-lg .gc-card-desc { font-size: 12.5px; -webkit-line-clamp: 3; }

/* ---------- Video file attach ---------- */
.yd-vf-card { border: 1.5px dashed var(--gt-hairline); border-radius: 16px; padding: 22px; text-align: center; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
.yd-vf-card:hover, .yd-vf-card.dragover { border-color: rgba(var(--gt-accent-rgb),0.55); background: rgba(var(--gt-accent-rgb),0.05); }
.yd-vf-card .ic { font-size: 28px; margin-bottom: 8px; }
.yd-vf-filled { display: flex; flex-direction: column; gap: 10px; }
.yd-vf-filled video { width: 100%; max-height: 320px; border-radius: 14px; background: #000; }
.yd-vf-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--gt-text-dim); flex-wrap: wrap; }

/* ---------- Views ---------- */
.yd-view-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--gt-hairline); border-radius: 999px; padding: 3px; }
.yd-view-switch button { border: none; background: transparent; color: var(--gt-text-mute); font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; }
.yd-view-switch button.on { background: rgba(var(--gt-accent-rgb),0.18); color: var(--gt-accent-bright); }

/* ---------- Command palette ---------- */
.yd-palette-bg { position: fixed; inset: 0; z-index: 4000; background: rgba(4,3,2,0.72); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.yd-palette-bg.show { display: flex; }
.yd-palette { width: 100%; max-width: 560px; background: rgba(18,15,12,0.94); border: 1px solid var(--gt-border); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,0.6); overflow: hidden; }
.yd-palette input { width: 100%; padding: 16px 18px; background: transparent; border: none; border-bottom: 1px solid var(--gt-hairline); color: var(--gt-text); font-size: 15px; font-family: inherit; }
.yd-palette input:focus { outline: none; }
.yd-palette-results { max-height: 50vh; overflow-y: auto; padding: 8px; }
.yd-palette-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.yd-palette-item:hover, .yd-palette-item.sel { background: rgba(var(--gt-accent-rgb),0.14); }
.yd-palette-item .sub { color: var(--gt-text-mute); font-size: 11px; margin-left: auto; }

/* ---------- Focus / Script Composition Mode ---------- */
#ydFocus { position: fixed; inset: 0; z-index: 5000; display: none; background: var(--gt-bg-deep); }
#ydFocus.open { display: flex; flex-direction: column; }
#ydFocus::before { content: ''; position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 900px 600px at 20% -10%, rgba(var(--gt-accent-rgb),0.14) 0%, transparent 60%), radial-gradient(ellipse 800px 600px at 100% 110%, rgba(var(--gt-accent-rgb),0.08) 0%, transparent 55%); }
.yd-focus-bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--gt-hairline); flex-shrink: 0; }
.yd-focus-bar .ttl { font-weight: 800; font-size: 13.5px; flex: 1; }
.yd-focus-stats { display: flex; gap: 14px; font-size: 11px; color: var(--gt-text-mute); font-variant-numeric: tabular-nums; }
.yd-focus-body { position: relative; z-index: 1; flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 50px 24px 100px; }
.yd-focus-panel { width: 100%; max-width: 720px; background: rgba(255,255,255,0.045); backdrop-filter: blur(22px) saturate(1.4); border: 1px solid var(--gt-border); border-radius: 22px; padding: 42px 46px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.yd-focus-field { margin-bottom: 26px; }
.yd-focus-field label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gt-accent-bright); margin-bottom: 8px; }
.yd-focus-field textarea { width: 100%; background: transparent; border: none; resize: none; overflow: hidden; color: var(--gt-text); font-family: "Cormorant Garamond", Georgia, serif; font-size: 19px; line-height: 1.75; }
.yd-focus-field textarea:focus { outline: none; }
.yd-focus-outline { position: fixed; right: 26px; top: 84px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.yd-focus-outline button { background: rgba(255,255,255,0.05); border: 1px solid var(--gt-hairline); color: var(--gt-text-mute); border-radius: 999px; padding: 5px 12px; font-size: 10.5px; font-weight: 700; cursor: pointer; }
.yd-focus-outline button:hover, .yd-focus-outline button.active { color: var(--gt-accent-bright); border-color: rgba(var(--gt-accent-rgb),0.5); }
@media (max-width: 780px) { .yd-focus-outline { display: none; } .yd-focus-panel { padding: 28px 22px; } }

/* ---------- Misc ---------- */
.yd-tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,0.06); color: var(--gt-text-dim); }
.yd-progress-ring-wrap { display: flex; align-items: center; gap: 8px; }
.yd-field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.yd-save-banner { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 6000; background: rgba(20,17,14,0.92); border: 1px solid var(--gt-border); border-radius: 999px; padding: 8px 18px; font-size: 12px; color: var(--gt-text-dim); display: none; }
.yd-save-banner.show { display: block; }
.yd-empty-lg { padding: 50px 20px; text-align: center; color: var(--gt-text-mute); }
.yd-empty-lg .ic { font-size: 34px; margin-bottom: 10px; }
</style>
</head>
<body class="gt-theme">
<div id="gtHeroCoverBg"></div>
<input type="file" id="ydHeroFileInput" accept="image/*" style="display:none">
<input type="file" id="ydChHeroFileInput" accept="image/*" style="display:none">
<input type="file" id="ydVideoFileInput" accept="video/*" style="display:none">

<div class="gt-shell yd-shell" id="ydApp">
  <div class="yd-topbar">
    <button class="yd-back-btn" id="ydBackBtn" style="display:none">← Back</button>
    <div class="yd-crumbs" id="ydCrumbs"></div>
    <div class="yd-topbar-actions">
      <button class="yd-search-btn" id="ydSearchBtn">🔍 Search Everything <kbd>Ctrl K</kbd></button>
    </div>
  </div>
  <div id="ydPageHost"></div>
</div>

<div class="gt-modal-bg" id="ydModalBg"><div class="gt-modal" id="ydModalBody"></div></div>

<div class="yd-palette-bg" id="ydPaletteBg">
  <div class="yd-palette">
    <input id="ydPaletteInput" placeholder="Search channels, videos, scripts, templates, checklists, assets, notes…" autocomplete="off">
    <div class="yd-palette-results" id="ydPaletteResults"></div>
  </div>
</div>

<div id="ydFocus">
  <div class="yd-focus-bar">
    <button class="gt-btn gt-btn-sm gt-btn-ghost" id="ydFocusClose">✕ Exit Focus Mode</button>
    <div class="ttl" id="ydFocusTitle"></div>
    <div class="yd-focus-stats" id="ydFocusStats"></div>
  </div>
  <div class="yd-focus-outline" id="ydFocusOutline"></div>
  <div class="yd-focus-body"><div class="yd-focus-panel" id="ydFocusPanel"></div></div>
</div>

<div class="yd-save-banner" id="ydSaveBanner">Saved</div>

<script src="youtube-dashboard-data.js"></script>
<script src="glass-theme.js"></script>
<script src="gallery-card.js"></script>
<script src="sync.js"></script>
<script src="topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';
  function D() { return window.YouTubeDashboardData; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return D().escapeHtml(s); }
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  // ============================================================
  // FORMATTERS
  // ============================================================
  function fmtNum(n) {
    n = Number(n) || 0;
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  }
  function fmtMoney(n) { return '$' + (Number(n) || 0).toLocaleString(); }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso + (iso.length <= 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtDateShort(iso) {
    if (!iso) return '—';
    var d = new Date(iso + (iso.length <= 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function timeAgo(iso) {
    if (!iso) return '';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function mdRender(text) {
    var h = esc(text || '');
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--gt-accent-bright)">$1</a>');
    return h.replace(/\n/g, '<br>');
  }
  function statusMeta(list, key) { return list.find(function (s) { return s.key === key; }) || { label: key, color: 'var(--gt-text-mute)' }; }
  function saveBanner() { var b = $('ydSaveBanner'); b.classList.add('show'); clearTimeout(saveBanner._t); saveBanner._t = setTimeout(function () { b.classList.remove('show'); }, 1400); }

  // ============================================================
  // GENERIC MODAL + FORM BUILDER
  // ============================================================
  function closeModal() { $('ydModalBg').classList.remove('show'); }
  function openModalHtml(html) { $('ydModalBody').innerHTML = html; $('ydModalBg').classList.add('show'); }
  $('ydModalBg').addEventListener('click', function (e) { if (e.target === $('ydModalBg')) closeModal(); });

  function renderFieldHtml(f, values) {
    var v = values && values[f.key] != null ? values[f.key] : (f.default != null ? f.default : '');
    var id = 'fld_' + f.key;
    var label = '<label class="gt-field-label">' + esc(f.label) + '</label>';
    if (f.type === 'textarea') {
      return '<div class="gt-field">' + label + '<textarea class="gt-textarea" id="' + id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea></div>';
    }
    if (f.type === 'select') {
      var opts = (f.options || []).map(function (o) { return '<option value="' + esc(o.value) + '"' + (o.value === v ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('');
      return '<div class="gt-field">' + label + '<select class="gt-select" id="' + id + '">' + opts + '</select></div>';
    }
    if (f.type === 'color') {
      return '<div class="gt-field">' + label + '<input class="gt-input" type="color" id="' + id + '" value="' + esc(v || '#c9a876') + '" style="height:38px;padding:4px"></div>';
    }
    if (f.type === 'number') {
      return '<div class="gt-field">' + label + '<input class="gt-input" type="number" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '"></div>';
    }
    if (f.type === 'date') {
      return '<div class="gt-field">' + label + '<input class="gt-input" type="date" id="' + id + '" value="' + esc(v) + '"></div>';
    }
    if (f.type === 'checkbox') {
      return '<div class="gt-field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="' + id + '" ' + (v ? 'checked' : '') + '> <span class="gt-field-label" style="margin:0">' + esc(f.label) + '</span></label></div>';
    }
    if (f.type === 'tags') {
      return '<div class="gt-field">' + label + '<input class="gt-input" id="' + id + '" value="' + esc((Array.isArray(v) ? v : []).join(', ')) + '" placeholder="comma, separated, tags"></div>';
    }
    return '<div class="gt-field">' + label + '<input class="gt-input" type="text" id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '"></div>';
  }
  function collectFieldValues(fields) {
    var out = {};
    fields.forEach(function (f) {
      var el = $('fld_' + f.key); if (!el) return;
      if (f.type === 'number') out[f.key] = el.value === '' ? 0 : Number(el.value);
      else if (f.type === 'checkbox') out[f.key] = el.checked;
      else if (f.type === 'tags') out[f.key] = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      else out[f.key] = el.value;
    });
    return out;
  }
  function openFormModal(opts) {
    var groups = opts.groups || [{ fields: opts.fields }];
    var html = '<h3>' + esc(opts.title) + '</h3>';
    groups.forEach(function (g) {
      if (g.label) html += '<div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gt-accent-bright);margin:16px 0 8px">' + esc(g.label) + '</div>';
      html += '<div class="yd-field-row">' + g.fields.map(function (f) { return renderFieldHtml(f, opts.values); }).join('') + '</div>';
    });
    html += '<div class="gt-modal-actions">';
    if (opts.onDelete) html += '<button class="gt-btn" id="ydFormDelete" style="margin-right:auto;color:var(--yd-bad)">🗑 Delete</button>';
    html += '<button class="gt-btn gt-btn-ghost" id="ydFormCancel">Cancel</button><button class="gt-btn gt-btn-primary" id="ydFormSave">' + esc(opts.submitLabel || 'Save') + '</button></div>';
    openModalHtml(html);
    var allFields = [].concat.apply([], groups.map(function (g) { return g.fields; }));
    $('ydFormCancel').addEventListener('click', closeModal);
    $('ydFormSave').addEventListener('click', function () { var vals = collectFieldValues(allFields); closeModal(); opts.onSave(vals); saveBanner(); });
    if (opts.onDelete) $('ydFormDelete').addEventListener('click', function () { if (confirm('Delete this? This cannot be undone.')) { closeModal(); opts.onDelete(); } });
  }

  // ============================================================
  // STATE + NAVIGATION
  // ============================================================
  var S = { pageStack: [], currentPage: { type: 'home' }, videoView: 'gallery', calMonth: new Date(), templatesTab: 'video', notesOpen: {} };

  function goTo(page) { S.pageStack.push(S.currentPage); S.currentPage = page; render(); window.scrollTo(0, 0); }
  function goBack() { S.currentPage = S.pageStack.pop() || { type: 'home' }; render(); window.scrollTo(0, 0); }
  function goRoot(page) { S.pageStack = []; S.currentPage = page; render(); window.scrollTo(0, 0); }

  var TOP_LEVEL_TYPES = ['home', 'channels', 'notes', 'templates', 'assets', 'analytics', 'calendar', 'archive', 'settings'];

  function crumbLabelFor(page) {
    if (page.type === 'home') return { icon: '🏠', label: 'Dashboard Home' };
    if (page.type === 'channels') return { icon: '📺', label: 'Channels' };
    if (page.type === 'channel') { var c = D().Channels.get(page.id); return { icon: '📺', label: c ? c.name : 'Channel' }; }
    if (page.type === 'video') { var v = D().Videos.get(page.id); return { icon: '🎬', label: v ? v.title : 'Video' }; }
    if (page.type === 'notes') return { icon: '🗒️', label: 'Global Notes' };
    if (page.type === 'templates') return { icon: '🧩', label: 'Global Templates' };
    if (page.type === 'assets') return { icon: '🗂️', label: 'Global Assets' };
    if (page.type === 'analytics') return { icon: '📊', label: 'Global Analytics' };
    if (page.type === 'calendar') return { icon: '📅', label: 'Content Calendar' };
    if (page.type === 'archive') return { icon: '📦', label: 'Archive' };
    if (page.type === 'settings') return { icon: '⚙️', label: 'Settings' };
    return { icon: '', label: '' };
  }
  function renderTopBar() {
    $('ydBackBtn').style.display = S.pageStack.length ? 'inline-flex' : 'none';
    var trail = S.pageStack.concat([S.currentPage]);
    $('ydCrumbs').innerHTML = trail.map(function (p, i) {
      var meta = crumbLabelFor(p);
      var last = i === trail.length - 1;
      return (i > 0 ? '<span class="yd-crumb-sep">/</span>' : '') + '<span class="yd-crumb' + (last ? ' current' : '') + '" data-idx="' + i + '">' + meta.icon + ' ' + esc(meta.label) + '</span>';
    }).join('');
    qsa('.yd-crumb', $('ydCrumbs')).forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = Number(el.dataset.idx);
        if (idx === trail.length - 1) return;
        S.pageStack = trail.slice(0, idx); S.currentPage = trail[idx]; render(); window.scrollTo(0, 0);
      });
    });
  }
  $('ydBackBtn').addEventListener('click', goBack);

  // ============================================================
  // UNIVERSAL NOTES PANEL — the ONE notes database, filtered by scope
  // ============================================================
  function notesScopeForCurrentPage() {
    var p = S.currentPage;
    if (p.type === 'home') return { scope: 'global', scopeId: '' };
    if (p.type === 'channel') return { scope: 'channel', scopeId: p.id };
    if (p.type === 'video') return { scope: 'video', scopeId: p.id };
    return null;
  }
  // Renders into #ydNotesSlot — a placeholder each page's own template
  // drops in wherever "below the Hero" (or below the header, for the
  // Video workspace, which has no Hero) actually is for that page, not
  // a single fixed top-of-shell container. Must run AFTER the page body
  // itself has been rendered (see render()), since that's what creates
  // the slot this looks up.
  function renderNotesPanel() {
    var host = $('ydNotesSlot');
    if (!host) return;
    var sc = notesScopeForCurrentPage();
    if (!sc) { host.innerHTML = ''; return; }
    host.innerHTML = renderNotesPanelHtml(sc.scope, sc.scopeId, 'ydMainNotes');
    wireNotesPanel(host, sc.scope, sc.scopeId, 'ydMainNotes');
  }
  function renderNotesPanelHtml(scope, scopeId, domKey) {
    var notes = D().notesFor(scope, scopeId);
    var open = S.notesOpen[domKey];
    var colorMap = { red: '#ff8a8a', orange: '#f0a868', gold: '#c9a876', green: '#6ee7b7', blue: '#7dd3fc', purple: '#a78bfa', none: 'transparent' };
    return '<div class="gt-card yd-notes-panel' + (open ? ' open' : '') + '" data-domkey="' + domKey + '">' +
      '<div class="yd-notes-head" data-toggle="1"><div class="yd-notes-head-l"><span class="gt-card-title" style="font-size:15px">🗒️ Notes</span><span class="yd-notes-count">' + notes.length + '</span></div><span class="yd-notes-toggle">▸</span></div>' +
      '<div class="yd-notes-body">' +
      '<div style="margin-bottom:10px"><button class="gt-btn gt-btn-sm gt-btn-primary" data-add-note="1">+ New Note</button></div>' +
      (notes.length ? '<div class="yd-notes-grid">' + notes.map(function (n) {
        return '<div class="yd-note-card" data-note-id="' + n.id + '">' +
          '<div class="yd-note-color" style="background:' + (colorMap[n.colorLabel] || 'transparent') + '"></div>' +
          (n.favorite ? '<span class="yd-note-fav">★</span>' : '') +
          '<div class="t">' + esc(n.title) + '</div>' +
          '<div class="b">' + mdRender(n.body).replace(/<[^>]+>/g, ' ').slice(0, 140) + '</div>' +
          '<div class="meta">' + (n.tags || []).slice(0, 3).map(function (t) { return '<span class="yd-tag-chip">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '</div>';
      }).join('') + '</div>' : '<div class="gt-empty">No notes here yet.</div>') +
      '</div></div>';
  }
  function wireNotesPanel(host, scope, scopeId, domKey) {
    var panel = qs('.yd-notes-panel[data-domkey="' + domKey + '"]', host);
    if (!panel) return;
    qs('.yd-notes-head', panel).addEventListener('click', function () { S.notesOpen[domKey] = !S.notesOpen[domKey]; panel.classList.toggle('open'); });
    var addBtn = qs('[data-add-note]', panel);
    if (addBtn) addBtn.addEventListener('click', function (e) { e.stopPropagation(); openNoteModal(null, scope, scopeId, domKey); });
    qsa('.yd-note-card', panel).forEach(function (card) {
      card.addEventListener('click', function () { openNoteModal(D().Notes.get(card.dataset.noteId), scope, scopeId, domKey); });
    });
  }
  function openNoteModal(note, scope, scopeId, domKey) {
    var values = note || { title: '', body: '', tags: [], priority: 'medium', status: 'none', colorLabel: 'none', favorite: false };
    var html = '<h3>' + (note ? 'Edit Note' : 'New Note') + '</h3>' +
      '<div class="gt-field"><label class="gt-field-label">Title</label><input class="gt-input" id="ydNoteTitle" value="' + esc(values.title) + '"></div>' +
      '<div class="gt-field"><label class="gt-field-label">Body (supports **bold**, *italic*, [text](url))</label><textarea class="gt-textarea" id="ydNoteBody" rows="7">' + esc(values.body) + '</textarea></div>' +
      '<div class="yd-field-row">' +
      renderFieldHtml({ key: 'tags', label: 'Tags', type: 'tags' }, { tags: values.tags }) +
      renderFieldHtml({ key: 'priority', label: 'Priority', type: 'select', options: D().NOTE_PRIORITIES.map(function (p) { return { value: p, label: p }; }) }, values) +
      renderFieldHtml({ key: 'status', label: 'Status', type: 'select', options: D().NOTE_STATUSES.map(function (p) { return { value: p, label: p }; }) }, values) +
      renderFieldHtml({ key: 'colorLabel', label: 'Color Label', type: 'select', options: D().NOTE_COLOR_LABELS.map(function (p) { return { value: p, label: p }; }) }, values) +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:6px"><input type="checkbox" id="ydNoteFav" ' + (values.favorite ? 'checked' : '') + '> <span class="gt-field-label" style="margin:0">Favorite</span></label>' +
      '<div class="gt-modal-actions">' + (note ? '<button class="gt-btn" id="ydNoteDelete" style="margin-right:auto;color:var(--yd-bad)">🗑 Delete</button>' : '') + '<button class="gt-btn gt-btn-ghost" id="ydNoteCancel">Cancel</button><button class="gt-btn gt-btn-primary" id="ydNoteSave">Save</button></div>';
    openModalHtml(html);
    $('ydNoteCancel').addEventListener('click', closeModal);
    $('ydNoteSave').addEventListener('click', function () {
      var patch = {
        title: $('ydNoteTitle').value.trim() || 'Untitled Note', body: $('ydNoteBody').value,
        tags: $('fld_tags').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        priority: $('fld_priority').value, status: $('fld_status').value, colorLabel: $('fld_colorLabel').value,
        favorite: $('ydNoteFav').checked, scope: scope, scopeId: scopeId
      };
      if (note) D().Notes.update(note.id, patch); else D().Notes.add(patch);
      closeModal(); saveBanner(); render();
    });
    if (note) $('ydNoteDelete').addEventListener('click', function () { if (confirm('Delete this note?')) { D().Notes.remove(note.id); closeModal(); render(); } });
  }

  // ============================================================
  // RENDER DISPATCH
  // ============================================================
  function render() {
    renderTopBar();
    var host = $('ydPageHost');
    var p = S.currentPage;
    if (p.type === 'home') renderHome(host);
    else if (p.type === 'channels') renderChannelsPage(host);
    else if (p.type === 'channel') renderChannelWorkspace(host, p);
    else if (p.type === 'video') renderVideoWorkspace(host, p);
    else if (p.type === 'notes') renderGlobalNotesPage(host);
    else if (p.type === 'templates') renderTemplatesPage(host);
    else if (p.type === 'assets') renderAssetsPage(host);
    else if (p.type === 'analytics') renderAnalyticsPage(host);
    else if (p.type === 'calendar') renderCalendarPage(host, null);
    else if (p.type === 'archive') renderArchivePage(host);
    else if (p.type === 'settings') renderSettingsPage(host);
    else host.innerHTML = '<div class="yd-empty-lg">Not found.</div>';
    // Runs after the page body above, since it fills in a #ydNotesSlot
    // that page just created (below its own Hero/header) — see that
    // function's own comment.
    renderNotesPanel();
  }

  // ============================================================
  // DASHBOARD HOME
  // ============================================================
  function heroMarkup(opts) {
    return '<div class="gt-hero" id="' + opts.id + '">' +
      '<div class="gt-hero-media"><img id="' + opts.id + 'Img" alt="" style="display:none;"></div>' +
      '<div class="gt-hero-abstract" id="' + opts.id + 'Abstract"></div>' +
      '<div class="gt-hero-choice" id="' + opts.id + 'Choice"><button type="button" class="gt-hero-choice-btn" id="' + opts.id + 'AddBtn">+ Add a cover photo</button></div>' +
      '<div class="gt-hero-overlay"></div>' +

  // ============================================================
  // VIDEO FILE ATTACH — see youtube-dashboard-data.js's VideoFiles
  // header comment for why this is a raw IndexedDB blob keyed by
  // videoId, device-local, separate from the synced Videos collection.
  // ============================================================
  function renderVideoFileBlock(hostEl, video) {
    hostEl.innerHTML = '<div class="yd-vf-card"><div class="ic">🎬</div><div>Loading…</div></div>';
    // Scoped to hostEl throughout (never the global $() document lookup):
    // this fetch is async, and if the user navigates away — or another
    // render() replaces #ydVfHost with a fresh element — before it
    // resolves, a global getElementById('ydVfReplace') could grab a
    // same-ID element belonging to a totally different, newer render
    // pass (or find nothing and crash on a null .addEventListener).
    // Querying inside this specific hostEl is correct either way, even
    // if hostEl itself is by then detached from the live document.
    D().VideoFiles.get(video.id).then(function (file) {
      if (file) {
        var url = URL.createObjectURL(file);
        hostEl.innerHTML = '<div class="yd-vf-filled"><video src="' + url + '" controls></video>' +
          '<div class="yd-vf-meta-row"><span>📄 ' + esc(video.videoFileName || file.name) + ' · ' + D().fmtFileSize(video.videoFileSize || file.size) + '</span>' +
          '<span><button class="gt-btn gt-btn-sm" data-vf-replace="1">↻ Replace</button> <button class="gt-btn gt-btn-sm" data-vf-remove="1" style="color:var(--yd-bad)">🗑 Remove</button></span></div></div>';
        var replaceBtn = hostEl.querySelector('[data-vf-replace]'), removeBtn = hostEl.querySelector('[data-vf-remove]');
        if (replaceBtn) replaceBtn.addEventListener('click', function () { S.pendingVideoFileTarget = video.id; $('ydVideoFileInput').click(); });
        if (removeBtn) removeBtn.addEventListener('click', function () { if (confirm('Remove the attached video file from this device?')) { D().VideoFiles.remove(video.id); D().Videos.update(video.id, { videoFileName: '', videoFileSize: 0, videoFileType: '', videoFileAttachedAt: '' }); render(); } });
      } else if (video.videoFileName) {
        hostEl.innerHTML = '<div class="yd-vf-card" data-vf-card="1"><div class="ic">⚠️</div><div>"' + esc(video.videoFileName) + '" was attached on a different device/browser and isn\'t stored here.<br><span style="opacity:.65;font-size:11.5px">Video files are device-local, not cloud-synced (they\'d be far too large to push through Supabase). Click to re-attach it on this device.</span></div></div>';
        wireDropzone();
      } else {
        hostEl.innerHTML = '<div class="yd-vf-card" data-vf-card="1"><div class="ic">🎬</div><div>Click or drop a video file here to attach it to this project<br><span style="opacity:.6;font-size:11px">Stored locally on this device — not synced to the cloud</span></div></div>';
        wireDropzone();
      }
    });
    function wireDropzone() {
      var card = hostEl.querySelector('[data-vf-card]');
      if (!card) return;
      card.addEventListener('click', function () { S.pendingVideoFileTarget = video.id; $('ydVideoFileInput').click(); });
      card.addEventListener('dragover', function (e) { e.preventDefault(); card.classList.add('dragover'); });
      card.addEventListener('dragleave', function () { card.classList.remove('dragover'); });
      card.addEventListener('drop', function (e) {
        e.preventDefault(); card.classList.remove('dragover');
        var f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) attachVideoFile(video.id, f);
      });
    }
  }
  function attachVideoFile(videoId, file) {

      render();
    }).catch(function (err) { alert('Could not store that video file: ' + (err && err.message ? err.message : err)); });
  }

    host.innerHTML = '<div class="yd-page-title"><div><h1>📊 Global Analytics</h1><div class="yd-page-sub">Cross-channel performance rollup.</div></div></div>' +
      '<div class="yd-stat-grid">' + statTile(fmtNum(stats.totalViews), 'Total Views') + statTile(fmtNum(stats.subscribers), 'Subscribers') + statTile(fmtNum(stats.watchTime) + 'h', 'Watch Time') + statTile(fmtMoney(stats.revenue), 'Revenue', 'good') + statTile(stats.uploadStreak + 'd', 'Upload Streak') + '</div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">Per-Channel Breakdown</h2></div><div class="yd-table-wrap"><table class="yd-table"><thead><tr><th>Channel</th><th>Views</th><th>Subscribers</th><th>Watch Time</th><th>Revenue</th><th>Published</th></tr></thead><tbody>' +
      chans.map(function (c) { var r = D().channelRollup(c.id); return '<tr data-ch="' + c.id + '"><td>' + esc(c.name) + '</td><td>' + fmtNum(r.views) + '</td><td>' + fmtNum(r.subscribers) + '</td><td>' + fmtNum(r.watchTime) + 'h</td><td>' + fmtMoney(r.revenue) + '</td><td>' + r.publishedCount + '/' + r.totalVideos + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">🏆 Top Videos (All Channels)</h2></div>' +
      (topAll.length ? '<div class="yd-table-wrap"><table class="yd-table"><thead><tr><th>Title</th><th>Channel</th><th>Revenue</th></tr></thead><tbody>' + topAll.map(function (v) { var ch = D().Channels.get(v.channelId); return '<tr data-open="' + v.id + '"><td>' + esc(v.title) + '</td><td>' + esc(ch ? ch.name : '—') + '</td><td>' + fmtMoney(v.revenue) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="gt-empty">No published videos yet.</div>') + '</div>';
    qsa('[data-ch]', host).forEach(function (el) { el.addEventListener('click', function () { goTo({ type: 'channel', id: el.dataset.ch, tab: 'analytics' }); }); });
    qsa('[data-open]', host).forEach(function (el) { el.addEventListener('click', function () { openVideo(el.dataset.open); }); });
  }

  // ============================================================
  // CONTENT CALENDAR
  // ============================================================
  function renderCalendarPage(host, channelId) {
    var month = S.calMonth;
    var y = month.getFullYear(), m = month.getMonth();
    var first = new Date(y, m, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var entries = D().calendarEntriesFor(channelId);
    var byDate = {};
    entries.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    var todayS = D().todayStr();
    var cells = '';
    for (var i = 0; i < startDow; i++) { var pd = new Date(y, m, i - startDow + 1); cells += calDayCell(pd, true, [], todayS); }
    for (var d = 1; d <= daysInMonth; d++) { var dt = new Date(y, m, d); var ds = dt.toISOString().slice(0, 10); cells += calDayCell(dt, false, byDate[ds] || [], todayS); }
    host.innerHTML = (channelId ? '' : '<div class="yd-page-title"><div><h1>📅 Content Calendar</h1><div class="yd-page-sub">Every stage, every channel, one timeline.</div></div><div class="yd-page-actions"><button class="gt-btn gt-btn-primary gt-btn-sm" id="ydNewCalEventBtn">+ New Event</button></div></div>') +
      '<div class="gt-card"><div class="yd-cal-nav"><button class="gt-btn gt-btn-sm" id="ydCalPrev">←</button><div class="lbl">' + month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</div><button class="gt-btn gt-btn-sm" id="ydCalNext">→</button>' + (channelId ? '<button class="gt-btn gt-btn-sm" id="ydCalNewEvent">+ Event</button>' : '') + '</div>' +
      '<div class="yd-cal-grid">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (d2) { return '<div class="yd-cal-dow">' + d2 + '</div>'; }).join('') + cells + '</div></div>';
    $('ydCalPrev').addEventListener('click', function () { S.calMonth = new Date(y, m - 1, 1); renderCalendarPage(host, channelId); });
    $('ydCalNext').addEventListener('click', function () { S.calMonth = new Date(y, m + 1, 1); renderCalendarPage(host, channelId); });
    var newBtn = $('ydNewCalEventBtn') || $('ydCalNewEvent');
    if (newBtn) newBtn.addEventListener('click', function () { openCalendarEventModal(null, channelId); });
    qsa('.yd-cal-day[data-date]', host).forEach(function (cell) { cell.addEventListener('click', function () { openCalendarEventModal(null, channelId, cell.dataset.date); }); });
    qsa('.yd-cal-event[data-video]', host).forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); openVideo(el.dataset.video); }); });
    qsa('.yd-cal-event[data-event]', host).forEach(function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); openCalendarEventModal(D().CalendarEvents.get(el.dataset.event), channelId); }); });
  }
  function calDayCell(dt, other, events, todayS) {
    var ds = dt.toISOString().slice(0, 10);
    return '<div class="yd-cal-day' + (other ? ' other' : '') + (ds === todayS ? ' today' : '') + '" data-date="' + ds + '"><div class="yd-cal-daynum">' + dt.getDate() + '</div>' +
      events.slice(0, 3).map(function (e) { return '<div class="yd-cal-event" ' + (e.videoId ? 'data-video="' + e.videoId + '"' : 'data-event="' + e.id + '"') + '>' + esc(e.title) + '</div>'; }).join('') +
      (events.length > 3 ? '<div style="font-size:9px;color:var(--gt-text-mute)">+' + (events.length - 3) + ' more</div>' : '') + '</div>';
  }
  function openCalendarEventModal(event, channelId, date) {
    var chans = D().channelsSorted();
    openFormModal({
      title: event ? 'Edit Event' : 'New Calendar Event', values: event || { date: date || D().todayStr(), channelId: channelId || '' },
      fields: [
        { key: 'title', label: 'Title' }, { key: 'type', label: 'Type', type: 'select', options: D().CALENDAR_EVENT_TYPES.map(function (t) { return { value: t, label: t }; }) },
        { key: 'date', label: 'Date', type: 'date' }, { key: 'channelId', label: 'Channel', type: 'select', options: [{ value: '', label: '— Any —' }].concat(chans.map(function (c) { return { value: c.id, label: c.name }; })) },
        { key: 'notes', label: 'Notes', type: 'textarea' }
      ],
      onSave: function (v) { if (event) D().CalendarEvents.update(event.id, v); else D().CalendarEvents.add(v); render(); },
      onDelete: event ? function () { D().CalendarEvents.remove(event.id); render(); } : null
    });
  }

  // ============================================================
  // ARCHIVE
  // ============================================================
  function renderArchivePage(host) {
    var vids = D().Videos.list().filter(function (v) { return v.status === 'archived'; });
    var chans = D().Channels.list().filter(function (c) { return c.status === 'archived'; });
    host.innerHTML = '<div class="yd-page-title"><div><h1>📦 Archive</h1><div class="yd-page-sub">Archived channels and video projects.</div></div></div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">Channels</h2></div>' + (chans.length ? '<div class="gc-grid" id="ydArchChGrid"></div>' : '<div class="gt-empty">No archived channels.</div>') + '</div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">Video Projects</h2></div>' + (vids.length ? '<div class="gc-grid" id="ydArchVGrid"></div>' : '<div class="gt-empty">No archived videos.</div>') + '</div>';
    var chG = $('ydArchChGrid'); if (chG) chans.forEach(function (c) { chG.appendChild(GalleryCard.build({ id: c.id, title: c.name, subtopic: 'Archived' }, { fallbackIcon: '📺', onEdit: function () { openChannel(c.id); }, onOpenFallback: function () { openChannel(c.id); } })); });
    var vG = $('ydArchVGrid'); if (vG) vids.forEach(function (v) { vG.appendChild(buildVideoCard(v)); });
  }

  // ============================================================
  // SETTINGS
  // ============================================================
  function renderSettingsPage(host) {
    var settings = D().KEYS && (JSON.parse(localStorage.getItem(D().KEYS.settings) || '{}') || {});
    host.innerHTML = '<div class="yd-page-title"><div><h1>⚙️ Settings</h1></div></div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">Workspace</h2></div><div class="yd-field-row">' +
      renderFieldHtml({ key: 'workspaceName', label: 'Workspace Name', placeholder: 'My YouTube Business' }, settings) +
      renderFieldHtml({ key: 'defaultChannelId', label: 'Default Channel', type: 'select', options: [{ value: '', label: '— None —' }].concat(D().channelsSorted().map(function (c) { return { value: c.id, label: c.name }; })) }, settings) +
      '</div><button class="gt-btn gt-btn-primary gt-btn-sm" id="ydSettingsSaveBtn" style="margin-top:12px">Save</button></div>' +
      '<div class="gt-card"><div class="gt-card-head"><h2 class="gt-card-title">About</h2></div><div style="font-size:12.5px;color:var(--gt-text-dim);line-height:1.7">Data syncs automatically via Supabase (appKey <code>youtubedash</code>). No live YouTube Data API sync yet — Analytics are logged manually. This whole workspace is genuinely separate from Writing Dashboard, Business Dashboard, and Business OS elsewhere in this app.</div></div>';
    var fields = [{ key: 'workspaceName', type: 'text' }, { key: 'defaultChannelId', type: 'select' }];
    $('ydSettingsSaveBtn').addEventListener('click', function () { localStorage.setItem(D().KEYS.settings, JSON.stringify(collectFieldValues(fields))); saveBanner(); });
  }

  // ============================================================
  // COMMAND PALETTE
  // ============================================================
  function openPalette() { $('ydPaletteBg').classList.add('show'); $('ydPaletteInput').value = ''; $('ydPaletteInput').focus(); renderPaletteResults(''); }
  function closePalette() { $('ydPaletteBg').classList.remove('show'); }
  $('ydSearchBtn').addEventListener('click', openPalette);
  $('ydPaletteBg').addEventListener('click', function (e) { if (e.target === $('ydPaletteBg')) closePalette(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
    else if (e.key === 'Escape' && $('ydPaletteBg').classList.contains('show')) closePalette();
  });
  $('ydPaletteInput').addEventListener('input', function () { renderPaletteResults($('ydPaletteInput').value); });
  function renderPaletteResults(q) {
    var results = q ? D().searchAll(q) : [];
    $('ydPaletteResults').innerHTML = results.length ? results.map(function (r) { return '<div class="yd-palette-item" data-type="' + r.type + '" data-id="' + r.id + '">' + r.icon + ' ' + esc(r.label) + '<span class="sub">' + esc(r.sub || '') + '</span></div>'; }).join('') : (q ? '<div class="gt-empty">No results.</div>' : '<div class="gt-empty">Start typing to search everything.</div>');
    qsa('.yd-palette-item', $('ydPaletteResults')).forEach(function (el) { el.addEventListener('click', function () { closePalette(); openByTypeId(el.dataset.type, el.dataset.id); }); });
  }

  // ============================================================
  // BOOT
  // ============================================================
  function routeFromHash() {
    var h = (location.hash || '').replace('#', '');
    if (TOP_LEVEL_TYPES.indexOf(h) !== -1) goRoot({ type: h });
  }
  window.addEventListener('hashchange', routeFromHash);

  function boot() {
    D().ensureAllDefaultsOnce();
    var h = (location.hash || '').replace('#', '');
    S.currentPage = TOP_LEVEL_TYPES.indexOf(h) !== -1 ? { type: h } : { type: 'home' };
    render();
    if (window.initCloudSync) {
      window.initCloudSync({ appKey: 'youtubedash', syncedPrefixes: ['ytd:'], onApplied: function () { render(); } });
    }
  }
  function startBoot() { if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot); else boot(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startBoot); else startBoot();

  window.YD_activeScriptContext = YD_activeScriptContext;
  window.YD_refreshScriptTab = YD_refreshScriptTab;
})();
</script>
</body>
</html>
