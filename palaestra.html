  function sheetTemplate(id, presetDay) {
    var rec = id ? P.Templates.get(id) : null;
    var items = rec ? rec.items.map(function (x) { return Object.assign({}, x); }) : [];
    var library = P.exercisesSorted();
    // "Add one" on an empty schedule row arrives with the day already known.
    var days = rec ? (rec.days || []).slice() : (presetDay ? [presetDay] : []);

    // §PER-ITEM OVERRIDES.
    //
    // templateItemModel has supported sets/reps/rest/unit/note overrides
    // since the first build and this sheet never wrote a single one — it
    // pushed a bare { exerciseId }. That was survivable while a routine was
    // just a list of exercises. It stops being survivable the moment the
    // same movement appears at 3 × 10–12 on a HIGH day and 2 × 8–12 on a
    // LOW one, which is the entire point of the three programs.
    //
    // A blank field means INHERIT, and says so in its placeholder — the
    // library record's own number. Only a value typed here overrides.
    function ovField(i, key, value, ph, label, wide) {
      return '<label class="pal-tplov__f" style="' + (wide ? 'flex:1 1 120px' : '') + '">' +
        '<span>' + esc(label) + '</span>' +
        '<input class="pal-input pal-input--num" type="number" inputmode="numeric" min="0"' +
          ' data-tpl-ov="' + i + '" data-key="' + esc(key) + '"' +
          ' value="' + (value == null ? '' : esc(value)) + '"' +
          ' placeholder="' + esc(ph) + '"></label>';
    }
    function itemsHtml() {
      if (!items.length) return '<p class="pal-sub">No exercises yet. Add one below.</p>';
      return '<ul class="pal-list">' + items.map(function (it, i) {
        var ex = P.Exercises.get(it.exerciseId);
        var d = ex || { sets: 3, repMin: 8, repMax: 12, restSec: 90, unit: 'reps' };
        var unit = it.unit == null ? d.unit : it.unit;
        return '<li class="pal-listrow pal-tplrow">' +
          '<div class="pal-listrow__meta" style="width:24px;flex:none">' + (i + 1) + '</div>' +
          '<div class="pal-listrow__main">' +
            '<div class="pal-listrow__title">' + esc(ex ? ex.name : 'Missing exercise') + '</div>' +
            '<div class="pal-listrow__meta">' + esc(ex ? ex.muscle : '') +
              (ex ? ' · library: ' + esc(P.setsAndReps(ex) || '—') + ' · ' + esc(P.fmtRest(ex.restSec)) : '') + '</div>' +
            '<div class="pal-tplov">' +
              ovField(i, 'sets', it.sets, String(d.sets), 'Sets') +
              ovField(i, 'repMin', it.repMin, String(d.repMin), 'From') +
              ovField(i, 'repMax', it.repMax, String(d.repMax), 'To') +
              ovField(i, 'restSec', it.restSec, String(d.restSec), 'Rest s') +
              '<label class="pal-tplov__f"><span>Unit</span>' +
                '<select class="pal-select" data-tpl-ov="' + i + '" data-key="unit">' +
                U.selectOptions(P.UNITS, unit) + '</select></label>' +
              '<label class="pal-tplov__f pal-tplov__f--wide"><span>Note</span>' +
                '<input class="pal-input" data-tpl-ov="' + i + '" data-key="note" value="' + esc(it.note || '') +
                '" placeholder="e.g. rest 60–90 sec"></label>' +
              '<label class="pal-tplov__side"><input type="checkbox" class="pal-check" data-tpl-ov="' + i + '" data-key="perSide"' +
                ((it.perSide == null ? (ex && ex.perSide) : it.perSide) ? ' checked' : '') + '><span>per leg</span></label>' +
            '</div>' +
          '</div>' +
          '<div class="pal-listrow__actions">' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--ghost" data-tpl-move="' + i + '" data-dir="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--ghost" data-tpl-move="' + i + '" data-dir="1" aria-label="Move down"' + (i === items.length - 1 ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--danger" data-tpl-del="' + i + '" aria-label="Remove">✕</button>' +
          '</div>' +
        '</li>';
      }).join('') + '</ul>';
    }

    function redraw(sheet) { sheet.querySelector('#palTplItems').innerHTML = itemsHtml(); }

    U.openSheet({
      title: rec ? 'Edit workout' : 'New workout',
      body:
        '<div class="pal-grid pal-grid--2" style="margin-bottom:16px">' +
          '<div class="pal-field"><label class="pal-label" for="fld_name">Name</label>' +
            '<input class="pal-input" id="fld_name" name="name" value="' + esc(rec ? rec.name : '') + '" placeholder="Pull Day"></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_type">Type</label>' +
            '<select class="pal-select" id="fld_type" name="type">' +
            U.selectOptions(P.TYPE_KEYS, rec ? rec.type : 'Pull') + '</select></div>' +
        '</div>' +
        // §SCHEDULE-ON-THE-ROUTINE, at the point of editing. These two
        // fields ARE the weekly schedule — there is no second store to keep
        // in step, so a routine given Monday appears on Monday and a routine
        // renamed is renamed there too.
        '<div class="pal-grid pal-grid--2" style="margin-bottom:16px">' +
          '<div class="pal-field"><span class="pal-label">Days</span>' +
            '<div class="pal-daypick">' + P.WEEKDAYS.map(function (w) {
              var on = days.indexOf(w.key) !== -1;
              return '<label class="pal-daypick__d"><input type="checkbox" data-day="' + esc(w.key) + '"' +
                (on ? ' checked' : '') + '><span>' + esc(w.short) + '</span></label>';
            }).join('') + '</div>' +
            '<p class="pal-sub" style="margin-top:6px">Leave every day off to keep this routine off the schedule.</p></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_level">Effort level</label>' +
            '<select class="pal-select" id="fld_level" name="level">' +
              '<option value=""' + (rec && !rec.level ? ' selected' : '') + '>Any level</option>' +
              P.LEVELS.map(function (l) {
                return '<option value="' + esc(l.key) + '"' + (rec && rec.level === l.key ? ' selected' : '') + '>' +
                  esc(l.label + ' · ' + l.title) + '</option>';
              }).join('') +
            '</select>' +
            '<p class="pal-sub" style="margin-top:6px">Any level means this one stands in whichever version of the day you pick — what a rest day wants.</p></div>' +
        '</div>' +
        '<div class="pal-field"><span class="pal-label">Exercises</span><div id="palTplItems">' + itemsHtml() + '</div></div>' +
        '<div class="pal-row" style="margin-top:12px">' +
          '<select class="pal-select" id="palTplPick" style="max-width:280px" aria-label="Exercise to add">' +
            '<option value="">Add an exercise…</option>' +
            library.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' · ' + esc(e.muscle) + '</option>'; }).join('') +
          '</select>' +
          '<button type="button" class="pal-btn" id="palTplAdd">Add</button>' +
          '<button type="button" class="pal-btn pal-btn--ghost" id="palTplNewEx">＋ New exercise instead</button>' +
        '</div>',
      actions: (rec ? [{ label: 'Delete', act: 'del', kind: 'danger' }] : [])
        .concat([{ label: 'Cancel', act: 'cancel' }, { label: 'Save workout', act: 'save', kind: 'primary' }]),
      onMount: function (sheet) {
        sheet.querySelector('#palTplAdd').addEventListener('click', function () {
          var pick = sheet.querySelector('#palTplPick');
          if (!pick.value) return;
          items.push({ exerciseId: pick.value });
          pick.value = '';
          redraw(sheet);
        });
        sheet.querySelector('#palTplNewEx').addEventListener('click', function () {
          U.closeSheet();
          sheetExercise(null);
        });
        // One delegated listener for every override field. Blank clears the
        // override back to inherit rather than writing a zero — a routine
        // that silently prescribed 0 sets would be worse than no override.
        sheet.querySelector('#palTplItems').addEventListener('input', function (e) {
          var f = e.target.closest('[data-tpl-ov]');
          if (!f) return;
          var i = parseInt(f.getAttribute('data-tpl-ov'), 10);
          var key = f.getAttribute('data-key');
          if (!items[i]) return;
          if (key === 'perSide') { items[i].perSide = f.checked; return; }
          if (key === 'note') { items[i].note = f.value; return; }
          if (key === 'unit') { items[i].unit = f.value || null; return; }
          items[i][key] = f.value === '' ? null : Math.max(0, parseInt(f.value, 10) || 0);
        });
        sheet.querySelector('#palTplItems').addEventListener('change', function (e) {
          var f = e.target.closest('[data-tpl-ov]');
          if (f && f.getAttribute('data-key') === 'perSide') items[parseInt(f.getAttribute('data-tpl-ov'), 10)].perSide = f.checked;
        });
        sheet.addEventListener('change', function (e) {
          var d = e.target.closest('[data-day]');
          if (!d) return;
          var k = d.getAttribute('data-day');
          var at = days.indexOf(k);
          if (d.checked && at === -1) days.push(k);
          else if (!d.checked && at !== -1) days.splice(at, 1);
        });
        sheet.querySelector('#palTplItems').addEventListener('click', function (e) {
          var mv = e.target.closest('[data-tpl-move]');
          if (mv) {
            var i = parseInt(mv.getAttribute('data-tpl-move'), 10);
            var d = parseInt(mv.getAttribute('data-dir'), 10);
            var j = i + d;
            if (j < 0 || j >= items.length) return;
            var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
            redraw(sheet);
            return;
          }
          var del = e.target.closest('[data-tpl-del]');
          if (del) {
            items.splice(parseInt(del.getAttribute('data-tpl-del'), 10), 1);
            redraw(sheet);
          }
        });
      },
      onAction: function (act, sheet) {
        if (act === 'del') {
          if (!confirm('Delete "' + rec.name + '"? Workouts already logged from it are kept.')) return;
          P.Templates.remove(rec.id); U.closeSheet(); refresh(); U.toast('Deleted');
          return;
        }
        if (act !== 'save') return;
        var name = String(val(sheet, 'name')).trim();
        if (!name) { U.toast('Give it a name'); return; }
        var type = val(sheet, 'type');
        // A rest day is a routine with nothing in it, and refusing to save
        // one would make the schedule unable to express the most common
        // instruction in the whole programme.
        if (!items.length && type !== 'Rest') { U.toast('Add at least one exercise, or set the type to Rest'); return; }
        var patch = { name: name, type: type, items: items, days: days, level: val(sheet, 'level') };
        if (rec) P.Templates.update(rec.id, patch);
        else P.Templates.add(Object.assign(patch, { order: P.Templates.nextOrder() }));
        U.closeSheet(); refresh(); U.toast('Saved');
      }
    });
  }

  function sheetDay(date) {
    var info = P.dayStatus(date);
    var s = P.getSettings();
    var day = P.getDay(date);
    var body = '';

    if (info.sessions.length) {
      body += info.sessions.map(function (x) {
        return '<div class="pal-card" style="margin-bottom:12px" data-lane="' + esc(P.laneOf(x.type)) + '">' +
          '<div class="pal-card__head"><h3 class="pal-h3">' + esc(x.name) + '</h3>' +
          '<span class="pal-badge">' + esc(x.type) + '</span></div>' +
          '<p class="pal-sub">' + P.sessionSetCount(x) + ' sets · ' + P.fmtInt(P.sessionVolume(x)) + ' ' +
          esc(s.weightUnit) + ' · ' + P.fmtDuration(x.elapsedSec) + '</p>' +
          '<button class="pal-btn pal-btn--sm" style="margin-top:10px" data-sheet-act="open:' + esc(x.id) + '">Open the log</button>' +
        '</div>';
      }).join('');
    } else if (info.planned && !info.planned.rest) {
      body += '<div class="pal-card" data-lane="' + esc(P.laneOf(info.planned.type)) + '">' +
        '<p class="pal-eyebrow">' + (info.status === 'missed' ? 'Planned, not done' : 'Planned') + '</p>' +
        '<h3 class="pal-h2">' + esc(info.planned.name) + '</h3>' +
        (info.status === 'missed'
          ? '<p class="pal-sub" style="margin-top:8px">You can still log it — pick the date when you finish.</p>'
          : '') +
        '<button class="pal-btn pal-btn--primary" style="margin-top:14px" data-sheet-act="start:' + esc(info.planned.templateId) + '">▶ Start it</button>' +
      '</div>';
    } else if (info.planned && info.planned.rest) {
      body += '<div class="pal-card" data-lane="rest"><h3 class="pal-h2">Rest</h3>' +
        '<p class="pal-sub" style="margin-top:8px">Scheduled recovery.</p></div>';
    } else {
      body += '<p class="pal-sub">Nothing scheduled and nothing logged.</p>';
    }

    body += '<div class="pal-grid pal-grid--3" style="margin-top:16px">' +
      U.tile('Steps', U.fig(P.fmtInt(day.steps), '', 'sm'), '') +
      U.tile('Water', U.fig(P.fmtInt(day.water), 'ml', 'sm'), '') +
      U.tile('Weight', U.fig(day.weight ? P.fmtWeight(day.weight) : '—', s.weightUnit, 'sm'), '') +
    '</div>';

    U.openSheet({
      title: P.prettyLong(date),
      body: body,
      actions: [{ label: 'Close', act: 'cancel' }],
      onAction: function (act) {
        if (act.indexOf('open:') === 0) { U.closeSheet(); sheetSession(act.slice(5)); return; }
        if (act.indexOf('start:') === 0) { U.closeSheet(); startTemplate(act.slice(6)); }
      }
    });
  }

  function sheetSession(id) {
    var x = P.Sessions.get(id);
    if (!x) return;
    var s = P.getSettings();
    var body = '<p class="pal-sub" style="margin-bottom:14px">' + esc(P.prettyLong(x.date)) + ' · ' +
      P.fmtDuration(x.elapsedSec) + ' · ' + P.fmtInt(P.sessionVolume(x)) + ' ' + esc(s.weightUnit) + ' lifted</p>';

    body += x.entries.map(function (e) {
      var done = e.sets.filter(function (st) { return st.done; });
      return '<div class="pal-card" style="margin-bottom:10px">' +
        '<div class="pal-card__head"><h3 class="pal-h3">' + esc(e.name) + '</h3>' +
        '<span class="pal-listrow__meta">' + esc(e.muscle) + '</span></div>' +
        (done.length
          ? '<div class="pal-mono" style="font-size:13px">' + done.map(function (st, i) {
              return (i + 1) + '.  ' + P.fmtWeight(st.weight) + ' × ' + st.reps + (st.rpe ? '  @' + st.rpe : '');
            }).join('<br>') + '</div>'
          : '<p class="pal-sub">No sets completed</p>') +
        (e.notes ? '<p class="pal-sub" style="margin-top:8px">' + esc(e.notes) + '</p>' : '') +
        (e.media.length ? '<div style="margin-top:10px">' + U.mediaStrip(e.media) + '</div>' : '') +
      '</div>';
    }).join('');

    if (x.notes) body += '<div class="pal-card"><p class="pal-eyebrow">Note</p><p>' + esc(x.notes) + '</p></div>';
    if (x.media.length) body += '<div style="margin-top:12px">' + U.mediaStrip(x.media) + '</div>';

    U.openSheet({
      title: x.name,
      body: body,
      actions: [{ label: 'Delete', act: 'del', kind: 'danger' }, { label: 'Close', act: 'cancel' }],
      onAction: function (act) {
        if (act !== 'del') return;
        if (!confirm('Delete this logged workout? Its volume and any PR it set go with it.')) return;
        P.Sessions.remove(x.id);
        U.closeSheet(); refresh(); U.toast('Deleted');
      }
    });
  }

  function sheetGoal() {
    U.openSheet({
      title: 'New goal',
      body:
        '<div class="pal-field" style="margin-bottom:12px"><label class="pal-label" for="fld_title">Goal</label>' +
          '<input class="pal-input" id="fld_title" name="title" placeholder="Deadlift 315 for 5"></div>' +
        '<div class="pal-grid pal-grid--2">' +
          '<div class="pal-field"><label class="pal-label" for="fld_target">Target</label>' +
            '<input class="pal-input" id="fld_target" name="target" placeholder="315 × 5"></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_due">By</label>' +
            '<input class="pal-input" id="fld_due" name="due" type="date"></div>' +
        '</div>' +
        '<div class="pal-field" style="margin-top:12px"><label class="pal-label" for="fld_detail">Why</label>' +
          '<textarea class="pal-textarea" id="fld_detail" name="detail" rows="3"></textarea></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var title = String(val(sheet, 'title')).trim();
        if (!title) { U.toast('Name the goal'); return; }
        P.Goals.add({ title: title, target: val(sheet, 'target'), due: val(sheet, 'due'), detail: val(sheet, 'detail') });
        U.closeSheet(); U.toast('Goal saved');
      }
    });
  }

  function sheetNote() {
    U.openSheet({
      title: 'Note',
      body: '<div class="pal-field"><label class="pal-label" for="fld_body">Today</label>' +
        '<textarea class="pal-textarea" id="fld_body" name="body" rows="5"></textarea></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var b = String(val(sheet, 'body')).trim();
        if (!b) { U.closeSheet(); return; }
        var t = P.today();
        var existing = P.Notes.list().filter(function (n) { return n.date === t; })[0];
        if (existing) P.Notes.update(existing.id, { body: existing.body ? existing.body + '\n\n' + b : b });
        else P.Notes.add({ date: t, body: b });
        U.closeSheet(); refresh(); U.toast('Noted');
      }
    });
  }

  function sheetCardio() {
    U.openSheet({
      title: 'Log cardio',
      body:
        '<div class="pal-grid pal-grid--2">' +
          '<div class="pal-field"><label class="pal-label" for="fld_name">What</label>' +
            '<input class="pal-input" id="fld_name" name="name" value="Cardio" placeholder="Treadmill walk"></div>' +
          numField('minutes', 'Minutes', 30) +
        '</div>' +
        '<div class="pal-field" style="margin-top:12px"><label class="pal-label" for="fld_date">Date</label>' +
          '<input class="pal-input" id="fld_date" name="date" type="date" value="' + esc(P.today()) + '"></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var mins = parseInt(val(sheet, 'minutes'), 10) || 0;
        var date = val(sheet, 'date') || P.today();
        var ses = P.Sessions.add({
          date: date, name: String(val(sheet, 'name')).trim() || 'Cardio', type: 'Cardio',
          status: 'done', startedAt: Date.now(), endedAt: Date.now(),
          elapsedSec: mins * 60, cardioMin: mins
        });
        if (mins > 0) P.addToDay(date, 'cardioMin', mins);
        U.closeSheet(); refresh(); U.toast('Cardio logged');
        return ses;
      }
    });
  }

  function sheetQuickAdd() {
    var opts = [
      ['Log a workout', 'q-workout'], ['Log weight', 'q-weight'], ['Log measurements', 'q-body'],
      ['Log cardio', 'q-cardio'], ['Log steps', 'q-steps'], ['Add a progress photo', 'q-photo'],
      ['Add an exercise', 'q-exercise'], ['Add a goal', 'q-goal'], ['Add a note', 'q-note']
    ];
    U.openSheet({
      title: 'Quick add',
      body: '<div class="pal-quickgrid">' + opts.map(function (o) {
        return '<button class="pal-quickbtn" data-sheet-act="' + o[1] + '">' + esc(o[0]) + '</button>';
      }).join('') + '</div>',
      actions: [],
      onAction: function (act) {
        U.closeSheet();
        if (act === 'q-workout') startFree();
        if (act === 'q-weight') sheetWeighIn();
        if (act === 'q-body') sheetBody(null);
        if (act === 'q-cardio') sheetCardio();
        if (act === 'q-steps') sheetSteps();
        if (act === 'q-photo') sheetBody(null);
        if (act === 'q-exercise') sheetExercise(null);
        if (act === 'q-goal') sheetGoal();
        if (act === 'q-note') sheetNote();
      }
    });
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  // LEAVING THE DOCUMENT AFTER A WRITE.
  //
  // localStorage here is local-store-idb.js's shim: setItem updates a Map
  // synchronously and fires an IndexedDB transaction that only commits once
  // control returns to the event loop. `location.href` in the same tick
  // abandons it. startWorkout() writes TWO keys — pal:sessions and pal:live —
  // and both were being thrown away, which is why starting a workout took
  // several tries to stick.
  //
  // LocalStoreIDB.navigate() waits for the commit and always resolves, with a
  // timeout backstop, so this can never strand the page. Everything that
  // navigates away from here goes through it, including the paths that do not
  // write today — the cost is one already-resolved promise, and the next
  // person to add a write above one of them does not have to know this.
  function goLogger() {
    var url = 'palaestra-workout.html';
    if (window.LocalStoreIDB && window.LocalStoreIDB.navigate) window.LocalStoreIDB.navigate(url);
    else location.href = url;
  }

  function startTemplate(id, level) {
    var live = P.getLive();
    if (live && live.sessionId) {
      // Never silently orphan a half-logged workout.
      if (!confirm('A workout is already in progress. Open that one instead?')) return;
      goLogger();
      return;
    }
    // The level can be set in advance on the schedule and changed again here;
    // whichever came last is what the session records.
    var tpl = P.Templates.get(id);
    P.startWorkout({ templateId: id, level: level || (tpl ? tpl.level : '') || P.getLevel(P.today()) });
    goLogger();
  }
  function startFree() {
    var live = P.getLive();
    if (live && live.sessionId) { goLogger(); return; }
    var tpls = P.templatesSorted();
    if (!tpls.length) { P.startWorkout({}); goLogger(); return; }
    U.openSheet({
      title: 'Start a workout',
      body: '<div class="pal-quickgrid">' + tpls.map(function (t) {
        return '<button class="pal-quickbtn" data-sheet-act="t:' + esc(t.id) + '">' + esc(t.name) +
               '<br><span class="pal-sub">' + esc(t.type) + '</span></button>';
      }).join('') + '<button class="pal-quickbtn" data-sheet-act="free">Freestyle<br><span class="pal-sub">build it as you go</span></button></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }],
      onAction: function (act) {
        if (act === 'free') { U.closeSheet(); P.startWorkout({}); goLogger(); return; }
        if (act.indexOf('t:') === 0) { U.closeSheet(); startTemplate(act.slice(2)); }
      }
    });
  }

  // A ONE-TIME OFFER, asked once and never again.
  //
  // Starting a workout used to fail silently: the pal:sessions write landed,
  // the pal:live write did not, and the next attempt added another session
  // rather than finding the first. History filters status 'live' out, so the
  // leftovers were invisible while still riding in every sync push. The bug
  // that made them is fixed; these are the ones it already made.
  //
  // Only ever offered for sessions with NOT ONE completed set in them. A
  // workout someone actually did is never a candidate, however it ended.
  function offerOrphanSweep() {
    if (P.orphanSweepDone()) return;
    var doomed = P.orphanLiveSessions();
    if (!doomed.length) { P.setOrphanSweepDone(); return; }
    var shown = doomed.slice(0, 12);
    U.openSheet({
      title: 'Tidy up ' + doomed.length + ' abandoned record' + (doomed.length === 1 ? '' : 's'),
      body: '<p class="pal-prose">Starting a workout could fail part-way and leave a record ' +
            'behind. These have nothing logged in them — no completed sets — and anything ' +
            'you actually did is never touched.</p>' +
            '<ul class="pal-list">' + shown.map(function (s) {
              return '<li class="pal-listrow"><span>' + esc(s.name || 'Workout') + '</span>' +
                     '<span class="pal-listrow__meta">' + esc(s.date) + '</span></li>';
            }).join('') + '</ul>' +
            (doomed.length > shown.length
              ? '<p class="pal-sub">and ' + (doomed.length - shown.length) + ' more</p>' : ''),
      actions: [{ label: 'Keep them', act: 'keep' },
                { label: 'Remove ' + doomed.length, act: 'sweep', kind: 'primary' }],
      // Dismissing the sheet without answering is not an answer — the marker
      // is only set by an actual choice, so it asks again next time.
      onAction: function (act) {
        P.setOrphanSweepDone();
        U.closeSheet();
        if (act !== 'sweep') return;
        var n = P.sweepOrphanLiveSessions();
        refresh();
        U.toast('Removed ' + n + ' abandoned record' + (n === 1 ? '' : 's'));
      }
    });
  }

  function doImport() {
    var res = P.importPrograms();
    refresh();
    if (!res.templates && !res.exercises) {
      U.toast(res.skipped ? 'Already imported — nothing new' : 'Nothing found to import');
    } else {
      U.toast('Imported ' + res.templates + ' workout' + (res.templates === 1 ? '' : 's') +
              ' and ' + res.exercises + ' exercise' + (res.exercises === 1 ? '' : 's'));
    }
  }

  var ACTIONS = {
    'open-day': function (el) { sheetDay(el.getAttribute('data-date')); },
    'open-session': function (el) { sheetSession(el.getAttribute('data-id')); },
    'start-template': function (el) { startTemplate(el.getAttribute('data-id'), el.getAttribute('data-level')); },
    'start-free': startFree,
    'go-templates': function () { go('/templates'); },
    'new-template': function (el) { sheetTemplate(null, el && el.getAttribute('data-day')); },
    'edit-template': function (el) { sheetTemplate(el.getAttribute('data-id')); },
    'new-exercise': function () { sheetExercise(null); },
    'edit-exercise': function (el) { sheetExercise(el.getAttribute('data-id')); },
    // Filtering is a re-render, not a navigation: it must not scroll.
    // refresh() renders in place; only navigate() ever moves the page.
    'ex-filter': function (el) { exMuscle = el.getAttribute('data-muscle') || 'All'; refresh(); },
    'log-body': function () { sheetBody(null); },
    'edit-body': function (el) { sheetBody(el.getAttribute('data-id')); },
    'weigh-in': sheetWeighIn,
    'steps-set': sheetSteps,
    'steps-history': sheetStepsHistory,
    'steps-add': function (el) {
      P.addToDay(P.today(), 'steps', parseInt(el.getAttribute('data-n'), 10) || 0);
      refresh();
    },
    'water-add': function (el) {
      P.addToDay(P.today(), 'water', parseInt(el.getAttribute('data-n'), 10) || 0);
      refresh();
    },
    'macros-edit': sheetMacros,
    'import': doImport,
    'install-programs': function () {
      var r = P.installPrograms();
      refresh();
      if (!r.routines && !r.exercises && !r.exercisesEnriched) { U.toast('Everything is already here'); return; }
      var bits = [];
      if (r.routines) bits.push(r.routines + ' routine' + (r.routines === 1 ? '' : 's'));
      if (r.exercises) bits.push(r.exercises + ' exercise' + (r.exercises === 1 ? '' : 's'));
      if (r.exercisesEnriched) bits.push(r.exercisesEnriched + ' updated');
      U.toast('Added ' + bits.join(' and '));
    },
    'snap-now': function () {
      var e = window.PalBackup && window.PalBackup.snapshot('manual', { force: true, pinned: true });
      refresh();
      U.toast(e ? 'Snapshot saved on this device' : 'Nothing to snapshot yet');
    },
    'snap-restore': function (el) { sheetRestore(el.getAttribute('data-id')); },
    'snap-delete': function (el) {
      if (!window.confirm('Delete this snapshot? It is the only copy.')) return;
      window.PalBackup.remove(el.getAttribute('data-id'));
      refresh();
      U.toast('Snapshot deleted');
    },
    'week-step': function (el) {
      var n = parseInt(el.getAttribute('data-n'), 10) || 0;
      var cur = scoreWeek || P.today();
      var next = P.addDays(P.mondayOf(cur), n * 7);
      if (P.daysBetween(P.today(), next) > 0) return;    // never page into the future
      scoreWeek = next;
      refresh();
    },
    'sched-step': function (el) {
      schedWeek += parseInt(el.getAttribute('data-n'), 10) || 0;
      refresh();
    },
    'sched-today': function () { schedWeek = 0; refresh(); },
    'set-level': function (el) {
      var date = el.getAttribute('data-date');
      var level = el.getAttribute('data-level');
      P.setLevel(date, level);
      refresh();
      var info = P.levelInfo(level);
      U.toast(info.label + ' \u00b7 ' + info.title + ' \u2014 ' + info.mins);
    },
    'vol-window': function (el) { volWindow = el.getAttribute('data-n'); refresh(); }
  };

  // ============================================================
  // BOOT
  // ============================================================
  function boot() {
    P = window.Pal;
    U = window.PalUI;
    root = document.getElementById('palRoot');
    routesEl = document.getElementById('palRoutes');

    // ONCE, before the router first runs, and outside #palRoot — so no
    // render can ever re-create the <video> inside it.
    window.PalHero.mount({
      variant: 'full',
      mark: 'Fitness Studio',
      markHref: 'palaestra.html',
      dateText: P.prettyLong(P.today()),
      routes: ROUTES,
      routebar: document.getElementById('palRouteBar'),
      onRoute: function (r) { go(r.hash); },
      badge: { lead: 'Start', main: 'Today' }
    });

    // Every route is in the DOM at every width — the phone block hides the
    // secondary ones rather than the script rebuilding the bar on resize,
    // so a rotation cannot leave the nav in the wrong shape.
    routesEl.innerHTML = ROUTES.map(function (r) {
      return '<button class="pal-route" data-route="' + esc(r.hash) + '"' +
        ' data-primary="' + (isPrimary(r.hash) ? 'true' : 'false') + '">' +
        '<span class="pal-route__txt">' + esc(r.label) + '</span></button>';
    }).join('') +
      '<button class="pal-route pal-route--more" data-more="1" aria-haspopup="dialog">' +
        '<span class="pal-route__txt">More</span></button>';
    routesEl.addEventListener('click', function (e) {
      if (e.target.closest('[data-more]')) { sheetMore(); return; }
      var b = e.target.closest('[data-route]');
      if (b) go(b.getAttribute('data-route'));
    });

    // One delegated listener for everything the views render.
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || !root.contains(el)) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (!fn) return;
      e.preventDefault();
      fn(el);
    });
    document.getElementById('palFab').addEventListener('click', sheetQuickAdd);

    // A track pinned inside the music dock belongs to an exercise or a
    // workout. The dock does not know that; it just reports the scope.
    document.addEventListener('pal:music:pin', function (e) {
      var d = e.detail || {};
      var parts = String(d.scope || '').split(':');
      if (parts[0] === 'exercise' && parts[1]) P.Exercises.update(parts[1], { trackId: d.trackId });
      if (parts[0] === 'template' && parts[1]) P.Templates.update(parts[1], { trackId: d.trackId });
      refresh();
      U.toast(d.trackId ? 'Track pinned' : 'Track unpinned');
    });

    window.addEventListener('hashchange', navigate);

    // The first thing this page does with storage, and deliberately BEFORE
    // initCloudSync: a snapshot of what this device holds right now, taken
    // while the cloud has not yet had the chance to change it. Everything it
    // writes lives under `palbak:`, which sync.js cannot see.
    if (window.PalBackup) window.PalBackup.boot();

    var remoteRef = { applied: false, pulled: false, onPulled: null };
    if (typeof window.initCloudSync === 'function' && window.supabase) {
      window.initCloudSync({
        appKey: 'palaestra',
        syncedPrefixes: ['pal:'],
        // Fitness Studio is TWO documents on one row. Without this, the logger
        // boots with no memory of what this page just wrote and its opening
        // pull erases it. See §HANDOFF in sync.js.
        handoff: true,
        onApplied: function () { remoteRef.applied = true; repaint(); },
        // "The cloud has spoken", which is a different question from "the
        // cloud said something new" — and it is the one the seeder needs.
        onPulled: function () {
          remoteRef.pulled = true;
          if (typeof remoteRef.onPulled === 'function') { var f = remoteRef.onPulled; remoteRef.onPulled = null; f(); }
        }
      });
    }
    // Never seed before the cloud has had its chance — on a fresh
    // device an immediate seed would be pushed over the real row.
    // Both of these wait for the cloud's first word for the same reason: a
    // decision made against a local store that has not been filled in yet is a
    // decision made about the wrong data.
    P.seedAfterSyncAttempt(remoteRef, function (seeded) {
      // The weekly plan used to live in its own key. Folding it into the
      // routines has to happen AFTER the cloud has spoken for the same
      // reason seeding does: run against a store that has not been filled
      // in yet and it migrates the wrong data, then marks itself done.
      var moved = P.migrateSchedule();
      if (seeded || moved) refresh();
      offerOrphanSweep();
    });

    P.onChange(repaint);
    // A save that failed used to say "Saved" anyway: storeSet dispatched
    // pal:save with ok:false and nothing in the app listened, and the
    // IndexedDB shim counted a failed transaction as a completed one. Both
    // are fixed at the source; this is the part the reader can see.
    window.addEventListener('pal:save', function (e) {
      if (e && e.detail && e.detail.ok === false) U.toast('Could not save — storage refused the write', true);
    });
    window.addEventListener('localstore:writefailed', function () {
      U.toast('A save did not reach this device\'s storage', true);
    });
    window.PalMusic.init();
    render();
  }

  // Two gates, both required: the DOM has to exist, and the IndexedDB
  // shim has to have hydrated — reading `pal:` before that lands shows
  // an empty page for a beat and then repaints.
  function whenReady() {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot);
    else boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
