<!DOCTYPE html>
<html lang="en" class="pal-root">
<head>
<meta charset="utf-8">
<!-- This repo has no build step: editing a file's CONTENTS never changes
     its URL, so a browser that already fetched the old copy has no signal
     to refetch it. The ?v= on every palaestra-* asset below forces one.
     These three tags do the same job for THIS document, which the query
     strings cannot reach. Partial, honestly: a meta tag tells a BROWSER
     how to re-request next time; it cannot reach an edge cache that has
     already served a stale response. There is no vercel.json and no
     server-side header control, so this is the only lever inside the file. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14120F">
<title>Fitness Studio</title>

<!-- MUST be first and never deferred: it replaces window.localStorage
     before any other script reads it. -->
<script src="local-store-idb.js"></script>

<!--
  FITNESS STUDIO — hub. (Built as "The Palaestra"; renamed 2026-08-21.
  DISPLAY NAME ONLY — every filename, the `pal:` prefix, the appKey
  'palaestra' and all --pal-*/.pal-* CSS names are unchanged.)

  index.html's embedded fitness tab (`fitness:`) and fitnessstudio.html
  (`fitstudio:`) are untouched on disk; the second was deleted in the
  2026-08-21 tidy-up and the first no longer has a nav link.

  Everything here is `pal:`-prefixed with its own Supabase row (appKey
  'palaestra'); the only contact with those pages is the explicit
  "Import my programs" button, which reads their template keys and
  never writes back. See palaestra-data.js's header.

  Routes live in the hash: #/ (the weekly schedule, and the landing
  page) · #/templates · #/exercises · #/history, plus #/data — the
  safety net, deliberately off the nav.

  Today, Steps, Body, Volume and Settings were removed 2026-08-25. The
  page is for training, and most of what they held was measurement.
  Their records — pal:days, pal:body, pal:photos, pal:goals — are still
  in storage and still synced; nothing reads them any more, which is a
  different thing from deleting them.

  The live workout logger is its own page, palaestra-workout.html —
  it is the one screen used mid-set on a phone and it should not share
  a document that repaints on every cloud pull.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="palaestra-theme.css?v=5">

<!-- Not deferred, and before the page's own inline script: the inline
     script in <body> runs during parsing, which is BEFORE any deferred
     script executes, so window.Pal has to already exist by then. Same
     arrangement as chrysalis.html. topbar.js is the one that can wait. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- row has no build step, so editing a file never changes its URL and a
     phone holding yesterday's copy renders new markup against old styles —
     or calls a new function as undefined — in silence. One number for the
     whole app: everything here is at v3. Bump it on ANY change to these
     files or the "it hasn't updated on my phone" report comes straight
     back. sync.js is versioned for the same reason: it was the one shared
     file with no version on it, so a device holding the old copy would
     never get the handoff fix, and now the §SEEN fix on top of it. -->
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="palaestra-data.js?v=6"></script>
<!-- Before palaestra-ui.js and before anything renders: its boot() has to
     snapshot what this device holds BEFORE the opening cloud pull can
     change it. -->
<script src="palaestra-backup.js?v=4"></script>
<script src="palaestra-ui.js?v=4"></script>
<script src="palaestra-hero.js?v=4"></script>
<script src="palaestra-music.js?v=4"></script>
<script src="topbar.js?v=4" defer></script>

<style>
/* Page-specific only — everything structural is in palaestra-theme.css. */

/* The week's count, above the seven rows. ONE figure: it is what the
   streak band was actually for, and the rest of that band scored things
   (steps, bodyweight) this page no longer tracks. */
.pal-weekline {
  display: flex; align-items: center; gap: var(--pal-3);
  flex-wrap: wrap; margin: 0 0 var(--pal-4);
}
.pal-weekline__txt {
  font-family: var(--pal-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--pal-ash);
}

/* The Today card keeps roughly the column it had when the day's numbers
   sat beside it. Full-bleed it runs its exercise list to 1200px and stops
   being a list — and .pal-xcard__cover's 264px ceiling was measured for
   this width, not for the whole page. */
.pal-todaypanel { max-width: 760px; }

/* The way back to the safety net..pal-schedfoot {
  margin-top: var(--pal-6); padding-top: var(--pal-4);
  border-top: 1px solid var(--pal-hair);
}
.pal-schedfoot a {
  font-family: var(--pal-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--pal-ash); text-decoration: none;
  transition: color .2s var(--pal-ease);
}
.pal-schedfoot a:hover { color: var(--pal-sand-2); }
.pal-schedfoot a:focus-visible {
  outline: 2px solid var(--pal-bronze); outline-offset: 3px; border-radius: 2px;
}
</style>

</head>

<body class="pal">

<!-- The hero, the ribbon and the badge are injected by palaestra-hero.js
     ONCE at boot, before the router first runs, and live outside #palRoot so
     no render can touch them — see that file's header comment on why a
     <video> may never be created by a renderer. -->
<div class="pal-routebar" id="palRouteBar">
  <div class="pal-routebar__in">
    <nav class="pal-routes pal-scrollx" id="palRoutes" aria-label="Sections"></nav>
  </div>
</div>

<main class="pal-shell" id="palRoot" tabindex="-1"></main>

<button class="pal-fab pal-fab--music" id="palFabMusic" type="button" data-pal-music="" data-pal-music-toggle data-pal-label="Music" aria-controls="palMusic" aria-expanded="false" aria-label="Music">♪</button>
<button class="pal-fab" id="palFab" aria-label="Quick add">＋</button>

<script>
(function () {
  'use strict';

  var P, U, root, routesEl;

  // Each route carries its own hero scene. The reference recording is
  // three different headlines over one continuous world, and this is
  // how that reads here: the backdrop never changes, the words do.
  var ROUTES = [
    { hash: '/', label: 'Schedule',
      eyebrow: 'The plan',
      lines: ['Which', 'version', 'today?'],
      note: 'HIGH, MID or LOW — three real options, not one and two excuses. Rest days are part of the plan too: taking one keeps the streak, skipping a session breaks it.' },
    { hash: '/templates', label: 'Workouts',
      eyebrow: 'Routines',
      lines: ['Decide once,', 'lift many', 'times'],
      note: 'A routine is a decision you already made, so the tired version of you does not have to make it again.' },
    { hash: '/exercises', label: 'Exercises',
      eyebrow: 'The library',
      lines: ['Master', 'the few'],
      note: 'A short list of movements you do well beats a long list you do once. This is that list.' },
    { hash: '/history', label: 'History',
      eyebrow: 'Everything so far',
      lines: ['You have', 'already', 'done this'],
      note: 'Every session you finished is still here, and so is every weight you have beaten.' }
  ];

  // #/data is a route but NOT a destination, so it is not in ROUTES: the
  // tab bar and the hero rail are both built straight off that array, and
  // the safety net belongs in neither. It is reached from one line at the
  // foot of the schedule — which is where you look for it, after
  // something has already gone wrong.
  var DATA_SCENE = {
    hash: '/data', label: 'Safety net',
    eyebrow: 'Kept safe',
    lines: ['Nothing', 'here is', 'lost'],
    note: 'Snapshots of every routine and every session, held on this device outside everything the cloud can reach. Taken whether or not you ever open this page.'
  };

  // View state that belongs to the screen, not to storage: which week the
  // schedule is showing, and the library's muscle filter.
  var schedWeek = 0;
  var exMuscle = 'All';

  function esc(s) { return P.escapeHtml(s); }
  function route() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return '/';
    if (h === DATA_SCENE.hash) return h;
    // Anything else falls through to the schedule rather than an empty
    // page — which is what a bookmarked #/steps or #/settings now is.
    return ROUTES.some(function (r) { return r.hash === h; }) ? h : '/';
  }
  function go(hash) { location.hash = '#' + hash; }

  // ============================================================
  // RENDER
  //
  // refresh() and repaint() are deliberately two functions.
  // repaint() is someone ELSE acting — a cloud pull, another tab —
  // and is deferred while the caret is in a field, so a re-render
  // never drops focus mid-sentence. refresh() is the reader acting,
  // and always renders. Neither ever scrolls: scroll-to-top belongs
  // to navigation only.
  // ============================================================
  // The scene that is currently ON SCREEN. A cloud pull calls render()
  // too, and re-running the word reveal every time another device syncs
  // would restart the intro at random — the same trap
  // `intro_animations_restart_on_repaint` records. The hero is only
  // re-armed when the route genuinely changed.
  var shownRoute = null;

  // ============================================================
  // §PHONE NAV — four destinations, four slots, no overflow menu.
  //
  // There were nine, in a horizontally-scrolling bottom bar under 719px,
  // with five of them past the right edge: a nav with a hidden half. Four
  // fit 320px without scrolling anything, so More is gone and every route
  // is reachable at every width.
  //
  // Every route is in the DOM at every width and CSS does the laying out
  // — a script rebuilding the bar on resize can leave it wrong after a
  // rotation.
  // ============================================================

  function render() {
    var r = route();
    Array.prototype.forEach.call(routesEl.children, function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-route') === r ? 'true' : 'false');
    });
    if (window.PalHero) {
      if (shownRoute !== r) {
        // index -1 on #/data: the rail marks nothing current, because the
        // rail does not contain it.
        var meta = DATA_SCENE, i = -1;
        for (var k = 0; k < ROUTES.length; k++) if (ROUTES[k].hash === r) { i = k; meta = ROUTES[k]; }
        window.PalHero.setScene({
          eyebrow: meta.eyebrow, lines: meta.lines, note: meta.note, index: i
        });
        shownRoute = r;
      }
      updateBadge();
    }
    var view =
      r === '/templates' ? viewTemplates()
    : r === '/exercises' ? viewExercises()
    : r === '/history'   ? viewHistory()
    : r === '/data'      ? viewData()
    :                      viewSchedule();
    root.innerHTML = view;
    afterRender(r);
  }
  function refresh() { render(); }
  function repaint() {
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (U.sheetOpen()) return;
    render();
  }
  function navigate() {
    // Already past the hero? Land on the top of the new route's CONTENT,
    // not back at the top of a video. Replaying a 100vh hero every time
    // you change tab is the navigation equivalent of the repaint bug
    // `rerender_must_not_scroll` records.
    var h = window.PalHero ? window.PalHero.height() : 0;
    var below = h > 0 && (window.scrollY || window.pageYOffset || 0) > h * 0.6;
    render();
    if (!below) { toTop(); return; }
    var top = root.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - 70;
    try { window.scrollTo({ top: Math.max(0, top), behavior: 'auto' }); }
    catch (e) { window.scrollTo(0, Math.max(0, top)); }
  }

  // The badge on the ribbon is the page's primary action, so it says what
  // the page would say: resume what is open, start what is planned, or
  // start something when nothing is.
  function updateBadge() {
    if (!window.PalHero) return;
    var live = P.getLive();
    if (live) {
      window.PalHero.setBadge({ lead: 'Resume', main: 'Workout',
        onClick: function () { location.href = 'palaestra-workout.html'; } });
      return;
    }
    var planned = P.plannedFor(P.today());
    if (planned && !planned.rest) {
      window.PalHero.setBadge({ lead: 'Start', main: planned.name,
        onClick: function () { startTemplate(planned.templateId); } });
    } else if (planned && planned.rest) {
      window.PalHero.setBadge({ lead: 'Rest day', main: 'Train anyway',
        onClick: startFree });
    } else {
      window.PalHero.setBadge({ lead: 'Start', main: 'Today', onClick: startFree });
    }
  }
  function toTop() {
    try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { window.scrollTo(0, 0); }
  }

  // Anything that needs a real element after innerHTML lands.
  function afterRender(r) {
    if (r === '/data') wireSettings();
    // A route changes the page's height, and so where the ribbon sits
    // in it — which is what the second parallax transition is measured
    // against. Re-measuring here is measuring, not animating: it does
    // not re-arm the hero's reveal, and it does not scroll.
    if (window.PalHero && window.PalHero.measure) window.PalHero.measure();
  }

  // ============================================================
  // SHARED FRAGMENTS
  // ============================================================
  // The duration estimate is sets × (work + rest). Meaningful for lifting,
  // meaningless for a treadmill walk where the whole session is one "set" —
  // it read "2 min est." for a 45-minute Zone 2. A cardio card shows no
  // estimate at all rather than a wrong one; see workoutCard.

  // ============================================================
  // THE COVER CARD
  //
  // One builder, two shapes, so an exercise card and a workout card
  // can never drift apart. The cover is drawn entirely in CSS from
  // --lane (see .pal-xcard__cover) — there is no image to load and no
  // empty state to design, which matters because the 21 seeded
  // exercises ship with no media at all.
  //
  // A card shows PHOTOS only. Videos are counted in a badge and open
  // with the card; twenty <video> elements on one route is the most
  // expensive thing this page could ask a phone to do. See
  // PalUI.cardMedia.
  // ============================================================
  // The cover is the gradient, the type badge and whatever photos the
  // routine carries — and nothing else. It used to letter the routine's
  // name across it as a watermark, which read as a fresco on a card called
  // "Pull" and as damage on one called "Saturday Shoulders — HIGH": two
  // lines of 46px display type, clipped, directly above the same name set
  // properly in the card body. Once every routine's name carried its day
  // and its level, the device stopped working.
  function xcover(lane, mediaHtml, tagHtml) {
    return '<div class="pal-xcard__cover">' + (tagHtml || '') + (mediaHtml || '') + '</div>';
  }

  function xstat(val, key) {
    return '<span class="pal-xcard__stat">' +
      '<span class="pal-xcard__val">' + esc(val) + '</span>' +
      '<span class="pal-xcard__key">' + esc(key) + '</span>' +
    '</span>';
  }

  // ============================================================
  // §EXERCISE ROW — a ruled list, not a wall of cover cards.
  //
  // The cover card was one card per exercise: a 16/11 gradient, a giant
  // ghost watermark and two figures. At fifty exercises that is eight
  // screens of scrolling to answer "how many sets was the pullover", and
  // the covers carry no information — they are drawn from the muscle, which
  // the row already names.
  //
  // So the list came back, and everything the card showed comes with it,
  // plus two things the card had silently dropped: the per-exercise music
  // pin, and the personal best. Nothing is lost by scanning instead of
  // browsing.
  //
  // The GLOW is what the card was really for — knowing which muscle a row
  // belongs to without reading it. It is a stacked, colour-tinted box-shadow
  // keyed to the same per-muscle --cover axis the card used, on a 3px left
  // edge: the device .pal-planrow introduced, at the density a library
  // needs. box-shadow, never backdrop-filter — the theme forbids per-row
  // blur for exactly this count of rows.
  // ============================================================
  function exerciseRow(e) {
    var lane = P.laneOf(e.muscle === 'Cardio' ? 'Cardio' : 'Strength');
    var media = U.mediaLabel(e.media);
    var best = exBest(e.name);
    var bits = [e.equipment, media].filter(Boolean);
    return '<li class="pal-listrow pal-exrow" data-lane="' + esc(lane) + '" data-muscle="' + esc(e.muscle) + '">' +
      '<div class="pal-listrow__main">' +
        '<div class="pal-listrow__title">' + esc(e.name) + '</div>' +
        '<div class="pal-listrow__meta">' +
          esc(P.setsAndReps(e) || '\u2014') + ' \u00b7 ' + esc(P.fmtRest(e.restSec)) + ' rest' +
          (bits.length ? ' \u00b7 ' + esc(bits.join(' \u00b7 ')) : '') +
        '</div>' +
      '</div>' +
      (best ? '<div class="pal-exrow__pr" title="Best estimated one-rep max">' +
        '<span class="pal-exrow__prval">' + esc(P.fmtWeight(best.e1rm)) + '</span>' +
        '<span class="pal-exrow__prkey">best</span></div>' : '') +
      '<div class="pal-listrow__actions">' +
        window.PalMusic.button({ scope: 'exercise:' + e.id, trackId: e.trackId, label: e.name }) +
        '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="edit-exercise" data-id="' + esc(e.id) + '">Edit</button>' +
      '</div>' +
    '</li>';
  }
  // personalBests() walks every session ever logged, so it is read ONCE per
  // render and looked up from a map — not called per row.
  var prCache = null;
  function exBest(name) {
    if (!prCache) {
      prCache = {};
      P.personalBests().forEach(function (b) { prCache[b.exercise] = b; });
    }
    return prCache[name] || null;
  }

  // A workout card is NOT a button — its actions start a session, and
  // that is not something a stray tap on a card should be able to do.
  // ============================================================
  // §LISTING A ROUTINE'S EXERCISES
  //
  // One builder for both places a routine's contents are listed — the
  // Today card and the schedule row — so a superset can never read as a
  // pair on one and a flat list on the other.
  //
  // A block gets a rule above it naming the rest that follows the PAIR.
  // Without that line the two exercises are just two exercises, and the
  // whole point of the week is that they are not done that way.
  // ============================================================
  function entryListHtml(entries, cap, liClass, repClass) {
    var shown = entries.slice(0, cap);
    var n = 0;
    return P.blocksOf(shown).map(function (g) {
      var pair = g.entries.length > 1;
      if (pair) n++;
      return (pair
        ? '<li class="pal-blockline' + (liClass ? ' ' + liClass : '') + '">' +
          '<span>Block ' + n + '</span>' +
          '<span>' + P.blockRest(g.entries) + 's after the pair</span></li>'
        : '') +
        g.entries.map(function (e) {
          return '<li' + (liClass ? ' class="' + liClass + '"' : '') +
            (pair ? ' data-paired="true"' : '') + '>' +
            '<span>' + esc(e.name) + '</span>' +
            '<span' + (repClass ? ' class="' + repClass + '"' : '') + '>' +
            esc(e.sets.length + ' \u00d7 ' + (e.targetReps || '\u2014')) + '</span></li>';
        }).join('');
    }).join('');
  }

  function workoutCard(t, entries, opts) {
    opts = opts || {};
    var lane = P.laneOf(t.type);
    var cap = opts.cap || 6;
    var shown = entries.slice(0, cap);
    var more = entries.length - shown.length;
    var isCardio = lane === 'cardio';
    var media = [];
    entries.forEach(function (en) { if (en.media && en.media.length) media = media.concat(en.media); });

    return '<div class="pal-xcard" data-lane="' + esc(lane) + '" data-tpl="' + esc(t.id) + '">' +
      xcover(lane, U.cardMedia(media, 3),
        '<span class="pal-xcard__tag"><span class="pal-badge">' + esc(t.type) + '</span></span>') +
      '<div class="pal-xcard__body">' +
        (opts.eyebrow ? '<p class="pal-eyebrow">' + esc(opts.eyebrow) + '</p>' : '') +
        '<h3 class="pal-xcard__name">' + esc(t.name) + '</h3>' +
        schedTag(t) +
        (shown.length
          ? '<ul class="pal-xcard__list">' + entryListHtml(entries, cap, 'pal-xcard__li', '') + '</ul>' +
            (more ? '<p class="pal-sub">and ' + more + ' more</p>' : '')
          : '<p class="pal-sub">No exercises in this routine yet.</p>') +
        '<div class="pal-xcard__stats">' +
          xstat(String(entries.length), entries.length === 1 ? 'exercise' : 'exercises') +
          (isCardio ? '' : xstat(P.estimatedDuration(entries) + 'm', 'est.')) +
        '</div>' +
        '<div class="pal-xcard__acts">' +
          '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="start-template" data-id="' + esc(t.id) + '"' +
            (opts.level ? ' data-level="' + esc(opts.level) + '"' : '') + '>\u25b6 Start</button>' +
          '<button class="pal-btn pal-btn--sm" data-act="edit-template" data-id="' + esc(t.id) + '">Edit</button>' +
          window.PalMusic.button({ scope: 'template:' + t.id, trackId: t.trackId, label: t.name }) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // Where a routine sits in the week — the same two fields the Schedule
  // page reads. Shown on the card so the two pages cannot describe the
  // same routine differently.
  function schedTag(t) {
    var days = (t.days || []);
    if (!days.length && !t.level) return '';
    var dayTxt = days.length
      ? P.WEEKDAYS.filter(function (w) { return days.indexOf(w.key) !== -1; })
          .map(function (w) { return w.short; }).join(' · ')
      : 'Unscheduled';
    return '<p class="pal-xcard__sched">' +
      '<span class="pal-xcard__scheddays">' + esc(dayTxt) + '</span>' +
      (t.level ? '<span class="pal-xcard__schedlvl" data-level="' + esc(t.level) + '">' +
        esc(P.levelInfo(t.level).label) + '</span>' : '') +
    '</p>';
  }

  function band(title, inner, headExtra) {
    return '<section class="pal-band">' +
      '<div class="pal-band__head"><h2 class="pal-h2">' + esc(title) + '</h2>' +
      (headExtra || '') + '</div>' + inner + '</section>';
  }

  // ============================================================
  // §SCHEDULE VIEW — the Weekly Workout Schedule, and the landing page.
  //
  // It answers the question the page is opened with: what am I doing
  // today, at which effort, and can I start it from here. Today gets a
  // panel of its own above the seven rows; the other six days are rows.
  //
  // Nothing on this page is stored. Every row is read back out of the
  // routines themselves through P.getSchedule() — set a routine's days in
  // Workouts and it appears here, rename it and it renames here. The only
  // thing written is the level chosen for a date, in pal:levels.
  // ============================================================

  // ============================================================
  // §THE TODAY PANEL
  //
  // What the Today page was for, on the page you now land on. Only the
  // half that starts a workout made the move: the steps, water,
  // bodyweight and macro tiles beside it are gone with the screens that
  // read them, and so are the streak band and the weekly scorecard —
  // half of what they scored no longer exists.
  //
  // What is left is one figure (the week's count) and one card. Every
  // shape in it already existed: workoutCard() brings its own Start, Edit
  // and music button, so this panel and the same routine's card in
  // Workouts can never drift apart.
  // ============================================================
  function todayPanel() {
    var t = P.today();
    var s = P.getSettings();
    var live = P.getLive();
    var liveSes = live ? P.Sessions.get(live.sessionId) : null;
    var planned = P.plannedFor(t);
    var doneToday = P.sessionsOn(t);

    var card;
    if (liveSes) {
      var remaining = liveSes.entries.filter(function (e) { return !e.done; }).length;
      card = '<div class="pal-card" data-lane="' + esc(P.laneOf(liveSes.type)) + '">' +
        '<div class="pal-card__head">' +
          '<div><p class="pal-eyebrow">In progress</p><h3 class="pal-h2">' + esc(liveSes.name) + '</h3></div>' +
          '<span class="pal-badge">' + esc(liveSes.type) + '</span>' +
        '</div>' +
        '<div class="pal-row" style="gap:24px;margin-bottom:18px">' +
          U.fig(remaining, 'left', 'md') +
          U.fig(P.sessionSetCount(liveSes), 'sets done', 'md') +
        '</div>' +
        '<a class="pal-btn pal-btn--primary" href="palaestra-workout.html">Back to the workout →</a>' +
      '</div>';
    } else if (planned && !planned.rest) {
      var lvl = P.getLevel(t);
      var info = P.levelInfo(lvl);
      card = '<div class="pal-todaylvl">' +
          '<div><p class="pal-eyebrow" style="margin:0 0 4px">Which version today?</p>' +
            '<p class="pal-sub" style="margin:0">' + esc(info.dot + ' ' + info.label + ' \u00b7 ' + info.title + ' \u00b7 ' + info.mins + '. ' + info.when) + '</p></div>' +
          levelPicker(t, lvl, P.hasLevel(t)) +
        '</div>' +
        workoutCard(planned.template, P.entriesFromTemplate(planned.template),
                    { eyebrow: 'Today', cap: 8, level: lvl });
    } else if (planned && planned.rest) {
      card = '<div class="pal-card" data-lane="rest">' +
        '<p class="pal-eyebrow">Today</p><h3 class="pal-h2">Rest</h3>' +
        '<p class="pal-lede" style="margin:12px 0 18px">Scheduled recovery. Resting today keeps the streak, it does not break it.</p>' +
        '<div class="pal-row">' +
          '<button class="pal-btn" data-act="start-free">Train anyway</button>' +
          '<button class="pal-btn pal-btn--ghost" data-act="go-templates">Change the plan</button>' +
        '</div>' +
      '</div>';
    } else {
      card = '<div class="pal-card">' +
        '<p class="pal-eyebrow">Today</p><h3 class="pal-h2">Nothing scheduled</h3>' +
        '<p class="pal-lede" style="margin:12px 0 18px">Give a routine some days in Workouts and this card fills itself in every morning.</p>' +
        '<div class="pal-row">' +
          '<button class="pal-btn pal-btn--primary" data-act="start-free">▶ Start a workout</button>' +
          '<button class="pal-btn" data-act="go-templates">Build the week</button>' +
        '</div>' +
      '</div>';
    }

    if (doneToday.length) {
      card += '<div class="pal-card" style="margin-top:16px">' +
        '<p class="pal-eyebrow">Logged today</p>' +
        '<ul class="pal-list">' + doneToday.map(function (x) {
          return '<li class="pal-listrow" data-lane="' + esc(P.laneOf(x.type)) + '">' +
            '<div class="pal-listrow__main"><div class="pal-listrow__title">' + esc(x.name) + '</div>' +
            '<div class="pal-listrow__meta">' + P.sessionSetCount(x) + ' sets · ' + P.fmtInt(P.sessionVolume(x)) + ' ' + esc(s.weightUnit) + ' · ' + P.fmtDuration(x.elapsedSec) + '</div></div>' +
            '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="open-session" data-id="' + esc(x.id) + '">Open</button>' +
          '</li>';
        }).join('') + '</ul></div>';
    }

    // The one number the streak band was for. A workout streak tops out at
    // 2 for anyone training four days a week, so the honest weekly figure
    // is the one worth keeping.
    var st = P.streaks();
    var count = '<div class="pal-weekline">' + U.pips(st.weekDone, st.weekGoal) +
      '<span class="pal-weekline__txt">' + st.weekDone + ' of ' + st.weekGoal + ' this week</span></div>';

    return '<section class="pal-band" style="border-top:0">' +
      '<div class="pal-band__head">' +
        '<h2 class="pal-h2">Today</h2>' + count +
      '</div>' +
      '<div class="pal-todaypanel">' + card + '</div>' +
    '</section>';
  }

  function levelPicker(dateStr, chosen, explicit) {
    return '<div class="pal-levels" role="group" aria-label="Effort level for ' + esc(P.prettyLong(dateStr)) + '">' +
      P.LEVELS.map(function (l) {
        var on = l.key === chosen;
        return '<button type="button" class="pal-level" data-act="set-level"' +
          ' data-date="' + esc(dateStr) + '" data-level="' + esc(l.key) + '"' +
          ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
          ' data-chosen="' + (on && explicit ? 'true' : 'false') + '"' +
          ' title="' + esc(l.title + ' · ' + l.mins + '. ' + l.when) + '">' +
          esc(l.label) + '</button>';
      }).join('') + '</div>';
  }

  function scheduleRow(dateStr, dayKey, label) {
    var chosen = P.getLevel(dateStr);
    var explicit = P.hasLevel(dateStr);
    var slot = P.getSchedule()[dayKey];
    var tpl = P.resolveForDay(dayKey, chosen);
    var isToday = dateStr === P.today();
    var done = P.sessionsOn(dateStr);
    // The routine that resolved may not be the level asked for — a day with
    // only a HIGH routine still starts something on a LOW day. Say so rather
    // than letting the label and the picker quietly disagree.
    var exact = tpl && ((tpl.level || '') === chosen || !tpl.level);
    var lane = done.length ? P.laneOf(done[0].type) : (tpl ? P.laneOf(tpl.type) : 'none');
    var isRest = tpl && tpl.type === 'Rest';

    var body;
    if (done.length) {
      body = '<p class="pal-schedrow__name">' + esc(done[0].name) + '</p>' +
        '<p class="pal-schedrow__meta">Done · ' + P.sessionSetCount(done[0]) + ' sets · ' +
        P.fmtDuration(done[0].elapsedSec) + '</p>';
    } else if (isRest) {
      body = '<p class="pal-schedrow__name">' + esc(tpl.name) + '</p>' +
        '<p class="pal-schedrow__meta">Rest. Taking it keeps the streak — it does not break it.</p>';
    } else if (tpl) {
      var entries = P.entriesFromTemplate(tpl);
      body = '<p class="pal-schedrow__name">' + esc(tpl.name) + '</p>' +
        '<p class="pal-schedrow__meta">' + entries.length + ' exercise' + (entries.length === 1 ? '' : 's') +
          ' · ~' + P.estimatedDuration(entries) + ' min' +
          (isToday ? ' · listed in full above' : '') +
          (exact ? '' : ' · nothing written for ' + esc(P.levelInfo(chosen).label) + ' yet, so this stands in') +
        '</p>' +
        // Today's panel already prints this routine's exercises directly
        // above, and printing them a second time here made the two halves
        // of one screen say the same thing at the same length.
        (entries.length && !isToday
          ? '<ul class="pal-schedrow__list">' + entryListHtml(entries, 8, '', 'pal-schedrow__reps') +
            (entries.length > 8 ? '<li class="pal-schedrow__more">and ' + (entries.length - 8) + ' more</li>' : '') +
            '</ul>'
          : '');
    } else {
      body = '<p class="pal-schedrow__name pal-schedrow__name--empty">Nothing scheduled</p>' +
        '<p class="pal-schedrow__meta">Give a routine this day in Workouts and it appears here.</p>';
    }

    // Start is offered on ANY day that has a routine and nothing logged,
    // not only today's row. P.startWorkout() always dates the session
    // P.today(), which is the honest behaviour: starting Thursday's
    // routine on a Tuesday records a workout done on Tuesday. Today's
    // button is the primary one and the other six are quiet, so the page
    // still says plainly which day it is.
    var acts = [];
    if (tpl && !isRest && !done.length) {
      acts.push('<button class="pal-btn pal-btn--sm' + (isToday ? ' pal-btn--primary' : '') +
        '" data-act="start-template" data-id="' + esc(tpl.id) + '" data-level="' + esc(chosen) + '">' +
        (isToday ? '▶ Start' : 'Start') + '</button>');
    }
    if (done.length) {
      acts.push('<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="open-session" data-id="' +
        esc(done[0].id) + '">Open</button>');
    }
    acts.push(tpl
      ? '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="edit-template" data-id="' +
        esc(tpl.id) + '">Edit</button>'
      : '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="new-template" data-day="' +
        esc(dayKey) + '">Add one</button>');
    var actions = '<div class="pal-row">' + acts.join('') + '</div>';

    // Which levels this day actually has something written for. A dot the
    // reader can see is worth more than discovering it on the day.
    var written = P.LEVEL_KEYS.filter(function (k) { return slot[k]; });
    var coverage = (slot.any || written.length === 3)
      ? ''
      : '<p class="pal-schedrow__cover">' +
          (written.length ? 'Written for ' + written.map(function (k) { return P.levelInfo(k).label; }).join(', ') : 'No routine yet') +
        '</p>';

    return '<li class="pal-schedrow" data-lane="' + esc(lane) + '" data-today="' + (isToday ? 'true' : 'false') +
        '" data-done="' + (done.length ? 'true' : 'false') + '">' +
      '<div class="pal-schedrow__day">' +
        '<span class="pal-schedrow__dow">' + esc(label) + '</span>' +
        '<span class="pal-schedrow__date">' + esc(P.prettyDate(dateStr)) + '</span>' +
        (isToday ? '<span class="pal-schedrow__tag">Today</span>' : '') +
      '</div>' +
      '<div class="pal-schedrow__main">' + body + coverage + '</div>' +
      '<div class="pal-schedrow__side">' + levelPicker(dateStr, chosen, explicit) + actions + '</div>' +
    '</li>';
  }

  function viewSchedule() {
    var start = P.addDays(P.mondayOf(P.today()), schedWeek * 7);
    var rows = P.WEEKDAYS.map(function (w, i) {
      return scheduleRow(P.addDays(start, i), w.key, w.short);
    }).join('');

    // The framing is not decoration. Left unsaid, a three-way picker reads as
    // "full workout / half a workout / gave up", which is the opposite of
    // what it is for.
    var key = '<div class="pal-levelkey">' + P.LEVELS.map(function (l) {
      return '<div class="pal-levelkey__item" data-level="' + esc(l.key) + '">' +
        '<span class="pal-levelkey__dot" aria-hidden="true">' + l.dot + '</span>' +
        '<div><p class="pal-levelkey__head">' + esc(l.label) + ' \u00b7 ' + esc(l.title) +
          ' <span class="pal-sub">' + esc(l.mins) + '</span></p>' +
        '<p class="pal-levelkey__body">' + esc(l.blurb) + '</p>' +
        '<p class="pal-levelkey__when">' + esc(l.when) + '</p></div>' +
      '</div>';
    }).join('') +
    '<p class="pal-levelkey__foot">MID and LOW are not failed HIGH days \u2014 they are the versions of the week that match the resources you actually have. ' +
      'Nothing here counts a LOW day as a miss, and there is nothing to make up afterwards.</p>' +
    '</div>';

    var label = schedWeek === 0 ? 'This week'
      : (schedWeek === 1 ? 'Next week'
      : (schedWeek === -1 ? 'Last week' : P.prettyDate(start)));

    // The only way to #/data, and it says how many snapshots are behind it
    // — an assurance is worth nothing if you cannot see it is true.
    var st = window.PalBackup ? window.PalBackup.stats() : null;
    var foot = '<div class="pal-schedfoot"><a href="#/data">Safety net' +
      (st ? ' \u00b7 ' + st.count + ' snapshot' + (st.count === 1 ? '' : 's') : '') +
      '</a></div>';

    return todayPanel() + band('The week',
      '<ul class="pal-schedlist">' + rows + '</ul>' +
      '<div class="pal-card" style="margin-top:24px"><h3 class="pal-h3" style="margin-bottom:14px">Choosing a level</h3>' + key + '</div>' +
      foot,
      '<div class="pal-row">' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-step" data-n="-1" aria-label="Previous week">\u2190</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-today">' + esc(label) + '</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-step" data-n="1" aria-label="Next week">\u2192</button>' +
      '</div>');
  }

  // ============================================================
  // TEMPLATES
  // ============================================================
  function viewTemplates() {
    var list = P.templatesSorted();
    var canImport = P.importAvailable();
    var head = '<div class="pal-row">' +
      (canImport ? '<button class="pal-btn pal-btn--sm" data-act="import">↻ Import my programs</button>' : '') +
      '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="new-template">＋ New workout</button>' +
    '</div>';

    if (!list.length) {
      return band('Workouts',
        U.empty('No routines yet',
          canImport
            ? 'Install the HIGH / MID / LOW programs from Settings, import the routines still stored by your retired fitness pages, or build one from scratch.'
            : 'A routine is a named list of exercises you can start with one button.',
          'Build your first workout', 'new-template'),
        head);
    }

    // entriesFromTemplate allocates a setModel per set, so it is called
    // ONCE per card and the result handed on — not re-derived per field.
    var cards = '<div class="pal-xgrid">' + list.map(function (t) {
      return workoutCard(t, P.entriesFromTemplate(t));
    }).join('') + '</div>';

    return band('Workouts', cards, head);
  }

  // ============================================================
  // EXERCISES
  // ============================================================
  function viewExercises() {
    var list = P.exercisesSorted();
    var head = '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="new-exercise">＋ New exercise</button>';
    if (!list.length) {
      return band('Exercise library',
        U.empty('The library is empty', 'Every routine is built from these.', 'Add an exercise', 'new-exercise'), head);
    }
    // Flat grid, not a panel per muscle. Every card already names its own
    // muscle, so twelve labelled bands repeated the same fact twelve times
    // and made the page four screens long. The chips filter instead.
    var present = {};
    list.forEach(function (e) { present[e.muscle] = (present[e.muscle] || 0) + 1; });
    if (exMuscle !== 'All' && !present[exMuscle]) exMuscle = 'All';

    var chips = '<div class="pal-xfilter pal-scrollx" role="group" aria-label="Filter by muscle group">' +
      ['All'].concat(P.MUSCLES.filter(function (m) { return present[m]; }))
        .map(function (m) {
          var on = m === exMuscle;
          return '<button type="button" class="pal-chip" data-act="ex-filter" data-muscle="' + esc(m) + '"' +
                 ' aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(m) +
                 (m === 'All' ? '' : ' <span class="pal-mono">' + present[m] + '</span>') + '</button>';
        }).join('') + '</div>';

    var shown = exMuscle === 'All' ? list : list.filter(function (e) { return e.muscle === exMuscle; });
    prCache = null;

    // Grouped when showing everything, flat when a chip is on — a single
    // heading repeating the chip you just pressed says nothing.
    var groups;
    if (exMuscle === 'All') {
      groups = P.MUSCLES.filter(function (m) { return present[m]; }).map(function (m) {
        var rows = shown.filter(function (e) { return e.muscle === m; });
        return '<div class="pal-card pal-exgroup" data-muscle="' + esc(m) + '" style="margin-bottom:14px">' +
          '<div class="pal-card__head"><h3 class="pal-h3">' + esc(m) + '</h3>' +
          '<span class="pal-sub">' + rows.length + '</span></div>' +
          '<ul class="pal-list">' + rows.map(exerciseRow).join('') + '</ul>' +
        '</div>';
      }).join('');
    } else {
      groups = '<div class="pal-card pal-exgroup" data-muscle="' + esc(exMuscle) + '">' +
        '<ul class="pal-list">' + shown.map(exerciseRow).join('') + '</ul></div>';
    }

    var body = chips + '<div id="palExGrid" style="margin-top:var(--pal-4)">' + groups + '</div>';
    return band('Exercise library', body, head);
  }

  // ============================================================
  // HISTORY
  // ============================================================
  function viewHistory() {
    var s = P.getSettings();
    var list = P.sessionsSorted().filter(function (x) { return x.status !== 'live'; });
    if (!list.length) {
      return band('History', U.empty('Nothing logged yet', 'Finished workouts land here.', 'Start a workout', 'start-free'));
    }
    var bests = P.personalBests();
    var prBlock = bests.length
      ? '<div class="pal-card" style="margin-bottom:16px">' +
          '<div class="pal-card__head"><h3 class="pal-h3">Personal bests</h3>' +
          '<span class="pal-sub">estimated 1RM · Epley</span></div>' +
          '<div class="pal-tablewrap"><table class="pal-table"><thead><tr>' +
          '<th>Exercise</th><th>Best set</th><th>Est. 1RM</th><th>When</th></tr></thead><tbody>' +
          bests.map(function (b) {
            return '<tr><td>' + esc(b.exercise) + '</td>' +
              '<td class="pal-num">' + P.fmtWeight(b.weight) + ' × ' + b.reps + '</td>' +
              '<td class="pal-num">' + P.fmtInt(b.e1rm) + ' ' + esc(s.weightUnit) + '</td>' +
              '<td class="pal-num">' + esc(P.prettyDate(b.date)) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>'
      : '';

    var rows = '<div class="pal-card"><ul class="pal-list">' + list.slice(0, 120).map(function (x) {
      return '<li class="pal-listrow" data-lane="' + esc(P.laneOf(x.type)) + '">' +
        '<div class="pal-listrow__meta" style="width:70px;flex:none">' + esc(P.prettyDate(x.date)) + '</div>' +
        '<div class="pal-listrow__main">' +
          '<div class="pal-listrow__title">' + esc(x.name) +
          (x.status === 'abandoned' ? ' <span class="pal-sub">(not finished)</span>' : '') + '</div>' +
          '<div class="pal-listrow__meta">' +
          (x.level ? '<span class="pal-lvltag" data-level="' + esc(x.level) + '">' + esc(P.levelInfo(x.level).label) + '</span> ' : '') +
          P.sessionSetCount(x) + ' sets · ' +
          P.fmtInt(P.sessionVolume(x)) + ' ' + esc(s.weightUnit) + ' · ' + P.fmtDuration(x.elapsedSec) + '</div>' +
        '</div>' +
        '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="open-session" data-id="' + esc(x.id) + '">Open</button>' +
      '</li>';
    }).join('') + '</ul></div>';

    return band('History', prBlock + rows);
  }

  // ============================================================
  // DATA — the safety net, and the two settings still worth setting
  //
  // Not in the nav, and not called Settings: nobody opens this page to
  // browse it. It is opened because something went missing, which is why
  // the snapshots are the first thing on it and the preferences are the
  // last.
  // ============================================================
  function viewData() {
    var s = P.getSettings();
    return band('Safety net',
      backupCard() +
      programsCard() +
      resetCard() +
      '<div class="pal-card" style="margin-bottom:16px">' +
        '<h3 class="pal-h3" style="margin-bottom:10px">Bringing work across</h3>' +
        '<p class="pal-sub" style="margin-bottom:14px">Reads the routines still stored by the retired fitness pages and copies them here. ' +
          'It never changes them, and running it again only adds what is new.</p>' +
        '<button class="pal-btn" data-act="import">↻ Import my programs (' + P.importAvailable() + ' found)</button>' +
      '</div>' +
      prefsCard(s));
  }

  // The two settings anything still reads. Step, water, weight and macro
  // goals, the measurement unit and the macro switch went with the screens
  // that showed them; P.getSettings() still defaults every one of them, so
  // no surviving code gets undefined.
  function prefsCard(s) {
    return '<div class="pal-card">' +
      '<h3 class="pal-h3" style="margin-bottom:14px">Preferences</h3>' +
      '<div class="pal-grid pal-grid--2">' +
        '<div class="pal-field"><label class="pal-label" for="set_weeklyWorkoutGoal">Workouts a week</label>' +
          '<input class="pal-input pal-input--num" id="set_weeklyWorkoutGoal" data-set="weeklyWorkoutGoal" type="number" value="' + esc(s.weeklyWorkoutGoal) + '"></div>' +
        '<div class="pal-field"><label class="pal-label" for="set_weightUnit">Weight unit</label>' +
          '<select class="pal-select" id="set_weightUnit" data-set="weightUnit">' +
          U.selectOptions(['lb', 'kg'], s.weightUnit) + '</select></div>' +
      '</div>' +
      '<p class="pal-sub" style="margin-top:12px">The first sets the count above the week. The second is the unit History and the logger print weights in.</p>' +
    '</div>';
  }

  // ============================================================
  // THE SAFETY NET
  //
  // Every snapshot listed here lives under `palbak:`, entirely outside the
  // `pal:` prefix the cloud syncs — so nothing a bad pull, a stale device or
  // a wrong tap can do to the Supabase row reaches them. See
  // palaestra-backup.js for why that prefix is the whole design.
  //
  // The counts are the point of the list. "17:42" tells you nothing; "6
  // routines · 51 exercises" is what lets you find the snapshot from before
  // the thing that went wrong.
  // ============================================================
  function snapCounts(entry) {
    var B = window.PalBackup;
    return B.COUNTED.map(function (c) {
      var n = (entry.counts && entry.counts[c.key]) || 0;
      return n + ' ' + c.label;
    }).filter(function (t) { return t.indexOf('0 ') !== 0; }).join(' · ') || 'empty';
  }
  function snapWhen(ts) {
    var d = new Date(ts), now = new Date();
    var hhmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var same = d.toDateString() === now.toDateString();
    return same ? 'Today ' + hhmm : P.prettyDate(P.localISO(d)) + ' ' + hhmm;
  }
  var SNAP_REASON = {
    boot: 'when you opened the page',
    change: 'after an edit',
    'before-drop': 'just before records disappeared',
    'pre-restore': 'before a restore',
    manual: 'you asked for it'
  };
  function backupCard() {
    var B = window.PalBackup;
    if (!B) return '';
    var snaps = B.list();
    var st = B.stats();
    var live = B.countsOf(B.readState());
    var nowLine = B.COUNTED.map(function (c) { return (live[c.key] || 0) + ' ' + c.label; })
      .filter(function (t) { return t.indexOf('0 ') !== 0; }).join(' · ') || 'nothing yet';

    return '<div class="pal-card" style="margin-bottom:16px">' +
      '<div class="pal-card__head"><h3 class="pal-h3">Safety net</h3>' +
        '<span class="pal-sub">' + st.count + ' local snapshot' + (st.count === 1 ? '' : 's') +
        ' · ' + Math.round(st.bytes / 1024) + ' KB</span></div>' +
      '<p class="pal-sub" style="margin-bottom:14px">Kept on this device only, outside everything the cloud touches, so a bad sync cannot reach them. ' +
        'Right now you have <b>' + esc(nowLine) + '</b>.</p>' +
      '<div class="pal-row" style="margin-bottom:14px">' +
        '<button class="pal-btn pal-btn--sm" data-act="snap-now">＋ Snapshot now</button>' +
      '</div>' +
      (snaps.length
        ? '<ul class="pal-list">' + snaps.map(function (e) {
            return '<li class="pal-listrow">' +
              '<div class="pal-listrow__main">' +
                '<div class="pal-listrow__title">' + esc(snapWhen(e.at)) + '</div>' +
                '<div class="pal-listrow__meta">' + esc(snapCounts(e)) + ' · ' +
                  esc(SNAP_REASON[e.reason] || e.reason) + '</div>' +
              '</div>' +
              '<div class="pal-listrow__actions">' +
                '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="snap-restore" data-id="' + esc(e.id) + '">Restore</button>' +
                '<button class="pal-btn pal-btn--sm pal-btn--ghost pal-btn--danger" data-act="snap-delete" data-id="' + esc(e.id) + '" aria-label="Delete this snapshot">✕</button>' +
              '</div>' +
            '</li>';
          }).join('') + '</ul>'
        : '<p class="pal-sub">None yet — one is written every time you open the page.</p>') +
    '</div>';
  }

  function sheetRestore(id) {
    var B = window.PalBackup;
    var entry = B.list().filter(function (e) { return e.id === id; })[0];
    var snap = B.get(id);
    if (!entry || !snap) { U.toast('That snapshot is gone', true); return; }
    var live = B.countsOf(B.readState());

    // Show the two side by side. A restore is only obviously right when you
    // can see what it gives back and what it takes away in the same glance.
    var rows = B.COUNTED.map(function (c) {
      var was = (entry.counts && entry.counts[c.key]) || 0;
      var now = live[c.key] || 0;
      var delta = was - now;
      return '<li class="pal-listrow">' +
        '<div class="pal-listrow__main"><div class="pal-listrow__title">' + esc(c.label) + '</div>' +
        '<div class="pal-listrow__meta">now ' + now + ' → ' + was + '</div></div>' +
        '<div class="pal-listrow__meta" style="color:' +
          (delta > 0 ? 'var(--pal-good)' : (delta < 0 ? 'var(--pal-bad)' : 'inherit')) + '">' +
          (delta > 0 ? '+' + delta : (delta < 0 ? String(delta) : '=')) + '</div>' +
      '</li>';
    }).join('');

    U.openSheet({
      title: 'Restore ' + snapWhen(entry.at),
      lede: 'This replaces what is on this device now, and pushes the result to your other devices. ' +
            'The state you are replacing is snapshotted first, so this is not a one-way door.',
      body: '<ul class="pal-list">' + rows + '</ul>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Restore everything', act: 'go', kind: 'primary' }],
      onAction: function (act) {
        if (act !== 'go') return;
        var res = B.restore(id);
        U.closeSheet();
        if (!res.ok) { U.toast('Could not read that snapshot', true); return; }
        refresh();
        U.toast('Restored ' + res.written + ' record set' + (res.written === 1 ? '' : 's'));
      }
    });
  }

  // The HIGH / MID / LOW programs. Installing is explicit and repeatable
  // rather than a seed, for the reason palaestra-data.js §PROGRAMS gives:
  // a routine is a decision. Repeatable matters too — if these ever go
  // missing again they are one tap away rather than an evening.
  function programsCard() {
    var n = P.programsInstalled();
    var full = P.PROGRAM_ROUTINES.length;
    return '<div class="pal-card" style="margin-bottom:16px">' +
      '<div class="pal-card__head"><h3 class="pal-h3">The HIGH / MID / LOW programs</h3>' +
        '<span class="pal-sub">' + n + ' of ' + full + ' installed</span></div>' +
      '<p class="pal-sub" style="margin-bottom:14px">Three versions of the same training week, and the exercise library they need. ' +
        'Additive and safe to run again: a routine you have since edited is left exactly as it is, and only genuinely missing ones are written back.</p>' +
      '<button class="pal-btn' + (n < full ? ' pal-btn--primary' : '') + '" data-act="install-programs">' +
        (n ? '↻ Restore anything missing' : '＋ Install the programs') + '</button>' +
    '</div>';
  }

  // The manual version of §PROGRAM RESET. The one-shot runs itself once,
  // on whichever device reaches it first; this is for the day the week has
  // been edited into a mess and the fastest way back is the program as
  // written. Destructive, so it is the only danger-styled button on the page
  // and it asks first.
  function resetCard() {
    return '<div class="pal-card" style="margin-bottom:16px">' +
      '<h3 class="pal-h3" style="margin-bottom:10px">Start the week over</h3>' +
      '<p class="pal-sub" style="margin-bottom:14px">Removes <b>every</b> routine and writes the superset program back exactly as designed \u2014 ' +
        'three blocks a day at HIGH, two at MID, one at LOW. A snapshot is taken first, so whatever you are replacing stays in the list above. ' +
        'Logged workouts and the exercise library are not touched.</p>' +
      '<button class="pal-btn pal-btn--danger" data-act="reset-programs">\u21bb Replace every routine</button>' +
    '</div>';
  }

  function wireSettings() {
    root.querySelectorAll('[data-set]').forEach(function (el) {
      var key = el.getAttribute('data-set');
      el.addEventListener('change', function () {
        var val = el.type === 'number' ? parseFloat(el.value) : el.value;
        P.saveSettings((function () { var o = {}; o[key] = val; return o; })());
        U.toast('Saved');
      });
    });
  }

  // ============================================================
  // SHEETS
  // ============================================================
  function numField(key, label, value, unit) {
    return '<div class="pal-field"><label class="pal-label" for="fld_' + key + '">' + esc(label) +
      (unit ? ' (' + esc(unit) + ')' : '') + '</label>' +
      '<input class="pal-input pal-input--num" id="fld_' + key + '" name="' + key + '" type="number" step="any" inputmode="decimal" value="' +
      (value ? esc(value) : '') + '"></div>';
  }
  function val(sheet, name) {
    var el = sheet.querySelector('[name="' + name + '"]');
    if (!el) return '';
    return el.type === 'checkbox' ? el.checked : el.value;
  }

          '<input class="pal-input" id="fld_name" name="name" value="' + esc(rec ? rec.name : '') + '" placeholder="Dumbbell Row"></div>' +
        '<div class="pal-grid pal-grid--2" style="margin-bottom:14px">' +
          '<div class="pal-field"><label class="pal-label" for="fld_muscle">Muscle group</label>' +
            '<select class="pal-select" id="fld_muscle" name="muscle">' +

          '<div class="pal-field"><label class="pal-label" for="fld_equipment">Equipment</label>' +
            '<select class="pal-select" id="fld_equipment" name="equipment">' +
            '<option value="">—</option>' + U.selectOptions(P.EQUIPMENT, rec ? rec.equipment : '') + '</select></div>' +
        '</div>' +
        '<div class="pal-grid pal-grid--4">' +
          numField('sets', 'Sets', rec ? rec.sets : 3) +

        '</div>' +
        '<div class="pal-field" style="margin-top:14px"><label class="pal-label" for="fld_notes">Form cues</label>' +
          '<textarea class="pal-textarea" id="fld_notes" name="notes" rows="3">' + esc(rec ? rec.notes : '') + '</textarea></div>' +
        '<div class="pal-field" style="margin-top:14px"><span class="pal-label">Photos and videos</span>' +

      actions: (rec ? [{ label: 'Delete', act: 'del', kind: 'danger' }] : [])
        .concat([{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }]),
      onMount: function (sheet) {
        U.mountMedia(sheet.querySelector('#palExMedia'), media, function (next) { media = next; });

          return;

          repMax: parseInt(val(sheet, 'repMax'), 10) || 12,

        };

        else P.Exercises.add(Object.assign(patch, { order: P.Exercises.nextOrder() }));

  function sheetTemplate(id, presetDay) {
    var rec = id ? P.Templates.get(id) : null;
    var items = rec ? rec.items.map(function (x) { return Object.assign({}, x); }) : [];
    var library = P.exercisesSorted();
    // "Add one" on an empty schedule row arrives with the day already known.
    var days = rec ? (rec.days || []).slice() : (presetDay ? [presetDay] : []);

    // §PER-ITEM OVERRIDES.
    //
    // templateItemModel has supported sets/reps/rest/unit/note overrides
    // since the first build and this sheet never wrote a single one — it
    // pushed a bare { exerciseId }. That was survivable while a routine was
    // just a list of exercises. It stops being survivable the moment the
    // same movement appears at 3 × 10–12 on a HIGH day and 2 × 8–12 on a
    // LOW one, which is the entire point of the three programs.
    //
    // A blank field means INHERIT, and says so in its placeholder — the
    // library record's own number. Only a value typed here overrides.
    function ovField(i, key, value, ph, label, wide) {
      return '<label class="pal-tplov__f" style="' + (wide ? 'flex:1 1 120px' : '') + '">' +
        '<span>' + esc(label) + '</span>' +
        '<input class="pal-input pal-input--num" type="number" inputmode="numeric" min="0"' +
          ' data-tpl-ov="' + i + '" data-key="' + esc(key) + '"' +
          ' value="' + (value == null ? '' : esc(value)) + '"' +
          ' placeholder="' + esc(ph) + '"></label>';
    }
    function itemsHtml() {
      if (!items.length) return '<p class="pal-sub">No exercises yet. Add one below.</p>';
      return '<ul class="pal-list">' + items.map(function (it, i) {
        var ex = P.Exercises.get(it.exerciseId);
        var d = ex || { sets: 3, repMin: 8, repMax: 12, restSec: 90, unit: 'reps' };
        var unit = it.unit == null ? d.unit : it.unit;
        return '<li class="pal-listrow pal-tplrow">' +
          '<div class="pal-listrow__meta" style="width:24px;flex:none">' + (i + 1) + '</div>' +
          '<div class="pal-listrow__main">' +
            '<div class="pal-listrow__title">' + esc(ex ? ex.name : 'Missing exercise') + '</div>' +
            '<div class="pal-listrow__meta">' + esc(ex ? ex.muscle : '') +
              (ex ? ' · library: ' + esc(P.setsAndReps(ex) || '—') + ' · ' + esc(P.fmtRest(ex.restSec)) : '') + '</div>' +
            '<div class="pal-tplov">' +
              ovField(i, 'sets', it.sets, String(d.sets), 'Sets') +
              ovField(i, 'repMin', it.repMin, String(d.repMin), 'From') +
              ovField(i, 'repMax', it.repMax, String(d.repMax), 'To') +
              ovField(i, 'restSec', it.restSec, String(d.restSec), 'Rest s') +
              // Same number, consecutive rows = one superset. Blank means the
              // exercise stands alone, which is why 0 is drawn as a dash
              // rather than a zero.
              ovField(i, 'block', it.block || null, '\u2014', 'Block') +
              '<label class="pal-tplov__f"><span>Unit</span>' +
                '<select class="pal-select" data-tpl-ov="' + i + '" data-key="unit">' +
                U.selectOptions(P.UNITS, unit) + '</select></label>' +
              '<label class="pal-tplov__f pal-tplov__f--wide"><span>Note</span>' +
                '<input class="pal-input" data-tpl-ov="' + i + '" data-key="note" value="' + esc(it.note || '') +
                '" placeholder="e.g. rest 60–90 sec"></label>' +
              '<label class="pal-tplov__side"><input type="checkbox" class="pal-check" data-tpl-ov="' + i + '" data-key="perSide"' +
                ((it.perSide == null ? (ex && ex.perSide) : it.perSide) ? ' checked' : '') + '><span>per leg</span></label>' +
            '</div>' +
          '</div>' +
          '<div class="pal-listrow__actions">' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--ghost" data-tpl-move="' + i + '" data-dir="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--ghost" data-tpl-move="' + i + '" data-dir="1" aria-label="Move down"' + (i === items.length - 1 ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="pal-btn pal-btn--sm pal-btn--danger" data-tpl-del="' + i + '" aria-label="Remove">✕</button>' +
          '</div>' +
        '</li>';
      }).join('') + '</ul>';
    }

    function redraw(sheet) { sheet.querySelector('#palTplItems').innerHTML = itemsHtml(); }

    U.openSheet({
      title: rec ? 'Edit workout' : 'New workout',
      body:
        '<div class="pal-grid pal-grid--2" style="margin-bottom:16px">' +
          '<div class="pal-field"><label class="pal-label" for="fld_name">Name</label>' +
            '<input class="pal-input" id="fld_name" name="name" value="' + esc(rec ? rec.name : '') + '" placeholder="Pull Day"></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_type">Type</label>' +
            '<select class="pal-select" id="fld_type" name="type">' +
            U.selectOptions(P.TYPE_KEYS, rec ? rec.type : 'Pull') + '</select></div>' +
        '</div>' +
        // §SCHEDULE-ON-THE-ROUTINE, at the point of editing. These two
        // fields ARE the weekly schedule — there is no second store to keep
        // in step, so a routine given Monday appears on Monday and a routine
        // renamed is renamed there too.
        '<div class="pal-grid pal-grid--2" style="margin-bottom:16px">' +
          '<div class="pal-field"><span class="pal-label">Days</span>' +
            '<div class="pal-daypick">' + P.WEEKDAYS.map(function (w) {
              var on = days.indexOf(w.key) !== -1;
              return '<label class="pal-daypick__d"><input type="checkbox" data-day="' + esc(w.key) + '"' +
                (on ? ' checked' : '') + '><span>' + esc(w.short) + '</span></label>';
            }).join('') + '</div>' +
            '<p class="pal-sub" style="margin-top:6px">Leave every day off to keep this routine off the schedule.</p></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_level">Effort level</label>' +
            '<select class="pal-select" id="fld_level" name="level">' +
              '<option value=""' + (rec && !rec.level ? ' selected' : '') + '>Any level</option>' +
              P.LEVELS.map(function (l) {
                return '<option value="' + esc(l.key) + '"' + (rec && rec.level === l.key ? ' selected' : '') + '>' +
                  esc(l.label + ' · ' + l.title) + '</option>';
              }).join('') +
            '</select>' +
            '<p class="pal-sub" style="margin-top:6px">Any level means this one stands in whichever version of the day you pick — what a rest day wants.</p></div>' +
        '</div>' +
        '<div class="pal-field"><span class="pal-label">Exercises</span><div id="palTplItems">' + itemsHtml() + '</div></div>' +
        '<div class="pal-row" style="margin-top:12px">' +
          '<select class="pal-select" id="palTplPick" style="max-width:280px" aria-label="Exercise to add">' +
            '<option value="">Add an exercise…</option>' +
            library.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.name) + ' · ' + esc(e.muscle) + '</option>'; }).join('') +
          '</select>' +
          '<button type="button" class="pal-btn" id="palTplAdd">Add</button>' +
          '<button type="button" class="pal-btn pal-btn--ghost" id="palTplNewEx">＋ New exercise instead</button>' +
        '</div>',
      actions: (rec ? [{ label: 'Delete', act: 'del', kind: 'danger' }] : [])
        .concat([{ label: 'Cancel', act: 'cancel' }, { label: 'Save workout', act: 'save', kind: 'primary' }]),
      onMount: function (sheet) {
        sheet.querySelector('#palTplAdd').addEventListener('click', function () {
          var pick = sheet.querySelector('#palTplPick');
          if (!pick.value) return;
          items.push({ exerciseId: pick.value });
          pick.value = '';
          redraw(sheet);
        });
        sheet.querySelector('#palTplNewEx').addEventListener('click', function () {
          U.closeSheet();
          sheetExercise(null);
        });
        // One delegated listener for every override field. Blank clears the
        // override back to inherit rather than writing a zero — a routine
        // that silently prescribed 0 sets would be worse than no override.
        sheet.querySelector('#palTplItems').addEventListener('input', function (e) {
          var f = e.target.closest('[data-tpl-ov]');
          if (!f) return;
          var i = parseInt(f.getAttribute('data-tpl-ov'), 10);
          var key = f.getAttribute('data-key');
          if (!items[i]) return;
          if (key === 'perSide') { items[i].perSide = f.checked; return; }
          if (key === 'note') { items[i].note = f.value; return; }
          if (key === 'unit') { items[i].unit = f.value || null; return; }
          items[i][key] = f.value === '' ? null : Math.max(0, parseInt(f.value, 10) || 0);
        });
        sheet.querySelector('#palTplItems').addEventListener('change', function (e) {
          var f = e.target.closest('[data-tpl-ov]');
          if (f && f.getAttribute('data-key') === 'perSide') items[parseInt(f.getAttribute('data-tpl-ov'), 10)].perSide = f.checked;
        });
        sheet.addEventListener('change', function (e) {
          var d = e.target.closest('[data-day]');
          if (!d) return;
          var k = d.getAttribute('data-day');
          var at = days.indexOf(k);
          if (d.checked && at === -1) days.push(k);
          else if (!d.checked && at !== -1) days.splice(at, 1);
        });
        sheet.querySelector('#palTplItems').addEventListener('click', function (e) {
          var mv = e.target.closest('[data-tpl-move]');
          if (mv) {
            var i = parseInt(mv.getAttribute('data-tpl-move'), 10);
            var d = parseInt(mv.getAttribute('data-dir'), 10);
            var j = i + d;
            if (j < 0 || j >= items.length) return;
            var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
            redraw(sheet);
            return;
          }
          var del = e.target.closest('[data-tpl-del]');
          if (del) {
            items.splice(parseInt(del.getAttribute('data-tpl-del'), 10), 1);
            redraw(sheet);
          }
        });
      },
      onAction: function (act, sheet) {
        if (act === 'del') {
          if (!confirm('Delete "' + rec.name + '"? Workouts already logged from it are kept.')) return;
          P.Templates.remove(rec.id); U.closeSheet(); refresh(); U.toast('Deleted');
          return;
        }
        if (act !== 'save') return;
        var name = String(val(sheet, 'name')).trim();
        if (!name) { U.toast('Give it a name'); return; }
        var type = val(sheet, 'type');
        // A rest day is a routine with nothing in it, and refusing to save
        // one would make the schedule unable to express the most common
        // instruction in the whole programme.
        if (!items.length && type !== 'Rest') { U.toast('Add at least one exercise, or set the type to Rest'); return; }
        var patch = { name: name, type: type, items: items, days: days, level: val(sheet, 'level') };
        if (rec) P.Templates.update(rec.id, patch);
        else P.Templates.add(Object.assign(patch, { order: P.Templates.nextOrder() }));
        U.closeSheet(); refresh(); U.toast('Saved');
      }
    });
  }

  function sheetSession(id) {
    var x = P.Sessions.get(id);
    if (!x) return;
    var s = P.getSettings();
    var body = '<p class="pal-sub" style="margin-bottom:14px">' + esc(P.prettyLong(x.date)) + ' · ' +
      P.fmtDuration(x.elapsedSec) + ' · ' + P.fmtInt(P.sessionVolume(x)) + ' ' + esc(s.weightUnit) + ' lifted</p>';

    body += x.entries.map(function (e) {
      var done = e.sets.filter(function (st) { return st.done; });
      return '<div class="pal-card" style="margin-bottom:10px">' +
        '<div class="pal-card__head"><h3 class="pal-h3">' + esc(e.name) + '</h3>' +
        '<span class="pal-listrow__meta">' + esc(e.muscle) + '</span></div>' +
        (done.length
          ? '<div class="pal-mono" style="font-size:13px">' + done.map(function (st, i) {
              return (i + 1) + '.  ' + P.fmtWeight(st.weight) + ' × ' + st.reps + (st.rpe ? '  @' + st.rpe : '');
            }).join('<br>') + '</div>'
          : '<p class="pal-sub">No sets completed</p>') +
        (e.notes ? '<p class="pal-sub" style="margin-top:8px">' + esc(e.notes) + '</p>' : '') +
        (e.media.length ? '<div style="margin-top:10px">' + U.mediaStrip(e.media) + '</div>' : '') +
      '</div>';
    }).join('');

    if (x.notes) body += '<div class="pal-card"><p class="pal-eyebrow">Note</p><p>' + esc(x.notes) + '</p></div>';
    if (x.media.length) body += '<div style="margin-top:12px">' + U.mediaStrip(x.media) + '</div>';

    U.openSheet({
      title: x.name,
      body: body,
      actions: [{ label: 'Delete', act: 'del', kind: 'danger' }, { label: 'Close', act: 'cancel' }],
      onAction: function (act) {
        if (act !== 'del') return;
        if (!confirm('Delete this logged workout? Its volume and any PR it set go with it.')) return;
        P.Sessions.remove(x.id);
        U.closeSheet(); refresh(); U.toast('Deleted');
      }
    });
  }

  function sheetCardio() {
    U.openSheet({
      title: 'Log cardio',
      body:
        '<div class="pal-grid pal-grid--2">' +
          '<div class="pal-field"><label class="pal-label" for="fld_name">What</label>' +
            '<input class="pal-input" id="fld_name" name="name" value="Cardio" placeholder="Treadmill walk"></div>' +
          numField('minutes', 'Minutes', 30) +
        '</div>' +
        '<div class="pal-field" style="margin-top:12px"><label class="pal-label" for="fld_date">Date</label>' +
          '<input class="pal-input" id="fld_date" name="date" type="date" value="' + esc(P.today()) + '"></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var mins = parseInt(val(sheet, 'minutes'), 10) || 0;
        var date = val(sheet, 'date') || P.today();
        var ses = P.Sessions.add({
          date: date, name: String(val(sheet, 'name')).trim() || 'Cardio', type: 'Cardio',
          status: 'done', startedAt: Date.now(), endedAt: Date.now(),
          elapsedSec: mins * 60, cardioMin: mins
        });
        if (mins > 0) P.addToDay(date, 'cardioMin', mins);
        U.closeSheet(); refresh(); U.toast('Cardio logged');
        return ses;
      }
    });
  }

  // Three ways in, all of them a workout. Weight, measurements, steps and
  // photos left with the screens that read them back — an entry that only
  // ever writes is a place for numbers to go and be forgotten.
  function sheetQuickAdd() {
    var opts = [['Log a workout', 'q-workout'], ['Log cardio', 'q-cardio'], ['Add an exercise', 'q-exercise']];
    U.openSheet({
      title: 'Quick add',
      body: '<div class="pal-quickgrid">' + opts.map(function (o) {
        return '<button class="pal-quickbtn" data-sheet-act="' + o[1] + '">' + esc(o[0]) + '</button>';
      }).join('') + '</div>',
      actions: [],
      onAction: function (act) {
        U.closeSheet();
        if (act === 'q-workout') startFree();
        if (act === 'q-cardio') sheetCardio();
