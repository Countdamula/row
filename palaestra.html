<!DOCTYPE html>
<html lang="en" class="hd-root">
<head>
<meta charset="utf-8">
<!-- This repo has no build step: editing a file's CONTENTS never changes
     its URL, so a browser that already fetched the old copy has no signal
     to refetch it. The ?v= on every palaestra-* asset below forces one.
     These three tags do the same job for THIS document, which the query
     strings cannot reach. Partial, honestly: a meta tag tells a BROWSER
     how to re-request next time; it cannot reach an edge cache that has
     already served a stale response. There is no vercel.json and no
     server-side header control, so this is the only lever inside the file. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0907">
<title>Fitness Studio</title>

<!-- MUST be first and never deferred: it replaces window.localStorage
     before any other script reads it. -->
<script src="local-store-idb.js"></script>

<!--
  FITNESS STUDIO — hub. (Built as "The Palaestra"; renamed 2026-08-21.
  DISPLAY NAME ONLY — every filename, the `pal:` prefix, the appKey
  'palaestra' and all --pal-*/.pal-* CSS names are unchanged.)

  index.html's embedded fitness tab (`fitness:`) and fitnessstudio.html
  (`fitstudio:`) are untouched on disk; the second was deleted in the
  2026-08-21 tidy-up and the first no longer has a nav link.

  Everything here is `pal:`-prefixed with its own Supabase row (appKey
  'palaestra'); the only contact with those pages is the explicit
  "Import my programs" button, which reads their template keys and
  never writes back. See palaestra-data.js's header.

  Routes live in the hash: #/ (the weekly schedule, and the landing
  page) · #/templates · #/exercises · #/history, plus #/data — the
  safety net, deliberately off the nav.

  Today, Steps, Body, Volume and Settings were removed 2026-08-25. The
  page is for training, and most of what they held was measurement.
  Their records — pal:days, pal:body, pal:photos, pal:goals — are still
  in storage and still synced; nothing reads them any more, which is a
  different thing from deleting them.

  The live workout logger is its own page, palaestra-workout.html —
  it is the one screen used mid-set on a phone and it should not share
  a document that repaints on every cloud pull.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- CORMORANT GARAMOND, not Cormorant. They are different faces: the
     Garamond's serifs are flared and pointed, which is the hand in
     brand_assets/brand_guidelines/banner & title_text.jpg, and it is the
     face all four studios are set in. IBM Plex Mono survives for one job
     — the set grid and the two clocks, where a digit that changes every
     second must not reflow the row it is in.

     LINKED, never @import-ed: an @import cannot start downloading until
     the importing stylesheet has arrived and parsed, which puts the two
     requests in series behind the largest text on the page. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- ═════════════════════════════════════════════════════════════
     THE SAME HOUSE AS THE OTHER THREE STUDIOS.

     This page wears HOUSE DAMULA, and it wears it by SHARING the
     stylesheet rather than copying it. vault-theme.css is linked
     first and its .hd-* classes are used verbatim; palaestra-theme.css
     is a LAYER holding only what the house has no equivalent for — a
     training week, a superset, a set grid, a rest clock, a music dock.

     AN EDIT TO vault-theme.css NOW CHANGES FOUR PAGES:
     vault.html, promptarium.html, asclepion.html and these two. Four
     studios on one stylesheet cannot drift, which is the point; the
     other half of the sentence is that a fix there needs ?v= bumping
     in all five documents, because this repo has no build step.

     Unlike Prompt Studio and The Asclepion, NOTHING HAD TO BE
     RENAMED. Both of those had grown an .asc-* vocabulary that
     collided with the 24 .asc-* classes vault-theme.css defines; every
     name here was already pal-*.

     WHAT THIS REPLACED: a warm-bronze palette of its own, a <video>
     hero with a rotating conic ring and a hand-drawn SVG ribbon, a
     fixed route bar, and 2528 lines of stylesheet that named their own
     colours. All of it is gone. palaestra-hero.js is no longer linked.
     ═════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="vault-theme.css?v=6">
<link rel="stylesheet" href="palaestra-theme.css?v=7">
<!-- The page opens on this, so it is the largest paint on it. A
     photograph set in Settings is swapped in by script once the store
     is ready; this is the one that ships. -->
<link rel="preload" as="image" href="images_by_admin/palaestra/hero-house.jpg" fetchpriority="high">

<!-- Not deferred, and before the page's own inline script: the inline
     script in <body> runs during parsing, which is BEFORE any deferred
     script executes, so window.Pal has to already exist by then. Same
     arrangement as chrysalis.html. topbar.js?v=8 is the one that can wait. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Drag-to-reorder for the group panel in Settings. It is the ONLY
     thing on this page that needs it, and the panel degrades to a pair
     of up/down buttons when it is absent — which is what happens on a
     flaky connection, and what happens in the test browser, where this
     CDN is blocked so a keepalive fetch cannot reach the real one. -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<!-- row has no build step, so editing a file never changes its URL and a
     phone holding yesterday's copy renders new markup against old styles —
     or calls a new function as undefined — in silence. Bump these on ANY
     change to these files or the "it hasn't updated on my phone" report
     comes straight back. -->
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="palaestra-data.js?v=9"></script>
<!-- data-registry.js?v=5 then snapshots.js, both BEFORE the backup adapter:

<script src="data-registry.js?v=5"></script>
<script src="snapshots.js?v=1"></script>
<script src="data-export.js?v=1"></script>
<script src="save-state.js?v=2"></script>
<script src="trash.js?v=1"></script>
<script src="shrink-banner.js?v=1"></script>
<!-- Before palaestra-ui.js and before anything renders: its boot() has to
     snapshot what this device holds BEFORE the opening cloud pull can

<script src="palaestra-backup.js?v=4"></script>
<script src="palaestra-ui.js?v=4"></script>
<script src="palaestra-music.js?v=5"></script>
<script src="topbar.js?v=8" defer></script>

</head>

<!-- ══ THE TOP BAR ═══════════════════════════════════════════
     A FLOATING PILL, CENTRED, with the wordmark in the middle of the
     links rather than off to one side. It sits ON the hero's
     photograph and takes a frosted ground of its own only once you
     have scrolled off it.

     IT ALSO SOLVES THE PROBLEM THE OLD ROUTE BAR SOLVED. topbar.js?v=8
     fixes its launcher at top:14 / left:14, ~190px wide, above
     anything this page can draw; a bar starting at the gutter sits
     underneath it. The old answer was a 216px left inset on desktop
     and a move to the bottom of the screen on a phone. A centred pill
     is simply never in that corner.

     THE MONOGRAM AND THE WORDMARK ARE STATIC MARKUP; only the links
     are painted. A cloud pull that re-created the chrome could not
     replay the page's entrance, and the brand is the one thing that
     must never flicker. -->
<header class="hd-top" id="hdTop">
  <nav class="hd-pill" aria-label="Primary">
    <span class="hd-pill__side" id="hdNavL"></span>

    <a class="hd-brand" href="#/" data-act="to-top" aria-label="Fitness Studio — the schedule">

        <svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="1.15"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- An F and an S. The same hand as the vault's interlocked H
               and D, Prompt Studio's P and S and The Asclepion's A and S:
               two letters that share something rather than standing
               apart, because at 34px a gap reads as two marks instead of
               one. The F's middle arm runs on into the S's spine — the
               only straight line in an S, and the only place the two can
               meet without either losing its shape. -->
          <path d="M4.2 30.5V4.2h11.8"/>
          <path d="M4.2 16.6h8.4"/>
          <path d="M12.6 16.6h4.8" opacity=".42"/>
          <path d="M35.6 9.6a6.4 6.4 0 0 0-4.9-2.1c-3.1 0-5.2 1.8-5.2 4.1 0 5.4 10.6 3 10.6 9.2 0 2.9-2.6 4.8-5.9 4.8a7.5 7.5 0 0 1-5.6-2.4"/>
        </svg>
      </span>
      <span class="hd-word">Fitness Studio</span>

    <button type="button" class="hd-burger" id="hdBurger" data-act="menu"

<!-- THE HERO IS PAINTED, not static markup, so each route's hero can
     say its own name. The vault solved the problem that made the old
     hero an injected singleton — a cloud pull destroying a rendered
     entrance — with introAttrs()'s negative --t and a re-measure after
     every repaint, rather than by avoiding it. There is no <video> to
     protect any more either, which was the other half of the rule. -->
<main class="hd-main" id="palRoot" tabindex="-1"></main>

<button class="pal-fab pal-fab--music" id="palFabMusic" type="button" data-pal-music="" data-pal-music-toggle data-pal-label="Music" aria-controls="palMusic" aria-expanded="false" aria-label="Music">&#9834;</button>
<button class="pal-fab" id="palFab" aria-label="Quick add">&#65291;</button>


<script>
(function () {
  'use strict';

  var P, U, root;

  // ROUTES IS FOUR HASHES AND FOUR LABELS, and nothing else now.
  // The eyebrow, the headline and the note that used to sit here are
  // in pal:house — see §HOUSE in palaestra-data.js — so they can be
  // edited from the page rather than from this file. P.scene(hash)
  // hands back the three of them, with the schedule's as the
  // fallback, which is exactly how route() resolves an unknown hash.
  var ROUTES = [
    { hash: '/', label: 'Schedule' },
    { hash: '/templates', label: 'Workouts' },
    { hash: '/exercises', label: 'Exercises' },
    { hash: '/history', label: 'History' }
  ];

  // #/data is a route but NOT a destination, so it is not in ROUTES: the
  // tab bar and the hero rail are both built straight off that array, and
  // the safety net belongs in neither. It is reached from one line at the
  // foot of the schedule — which is where you look for it, after
  // something has already gone wrong.
  var DATA_HASH = '/data';

  // View state that belongs to the screen, not to storage: which week the
  // schedule is showing, and the library's muscle filter.
  var schedWeek = 0;
  var exMuscle = 'All';

  function esc(s) { return P.escapeHtml(s); }
  function route() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return '/';
    if (h === DATA_HASH) return h;
    // Anything else falls through to the schedule rather than an empty
    // page — which is what a bookmarked #/steps or #/settings now is.
    return ROUTES.some(function (r) { return r.hash === h; }) ? h : '/';
  }
  function go(hash) { location.hash = '#' + hash; }

  // ============================================================
  // RENDER
  //
  // refresh() and repaint() are deliberately two functions.
  // repaint() is someone ELSE acting — a cloud pull, another tab —
  // and is deferred while the caret is in a field, so a re-render
  // never drops focus mid-sentence. refresh() is the reader acting,
  // and always renders. Neither ever scrolls: scroll-to-top belongs
  // to navigation only.
  // ============================================================
  // The scene that is currently ON SCREEN. A cloud pull calls render()
  // too, and re-running the word reveal every time another device syncs
  // would restart the intro at random — the same trap
  // `intro_animations_restart_on_repaint` records. The hero is only
  // re-armed when the route genuinely changed.
  var shownRoute = null;

  // ============================================================
  // §PHONE NAV — four destinations, four slots, no overflow menu.
  //
  // There were nine, in a horizontally-scrolling bottom bar under 719px,
  // with five of them past the right edge: a nav with a hidden half. Four
  // fit 320px without scrolling anything, so More is gone and every route
  // is reachable at every width.
  //
  // Every route is in the DOM at every width and CSS does the laying out
  // — a script rebuilding the bar on resize can leave it wrong after a
  // rotation.
  // ============================================================

  // ============================================================
  // §THE HERO
  //
  // ONE component, full-bleed, with the pill floating on it. Its
  // anatomy is the house's, which was read frame by frame off a
  // reference film:
  //
  //     ┌───────────────────────────────────────────────┐
  //     │              ( floating pill nav )            │
  //     │  HEADLINE                        ┌──────────┐ │
  //     │                                  │  TODAY   │ │
  //     │  the copy                        ( chips )    │
  //     └───────────────────────────────────────────────┘
  //
  // FULL-BLEED, AND NO BOUNDARIES. The plate runs to all four edges
  // of the display, so there is no edge to see; only the bottom
  // fades, into the band beneath it.
  //
  // EVERY WORD ON IT IS YOURS. The eyebrow, the headline and the line
  // under it are pal:house, per route, edited from the safety net.
  // They default to the words that were in ROUTES before this, so a
  // first load after this ships looks exactly like the load before.
  //
  // IT IS PAINTED, not injected once at boot. The old hero could not
  // be: it held a <video>, and both pages do root.innerHTML = … on
  // every repaint, so a renderer that built it would tear the clip
  // down and rebuild it several times a minute. There is no <video>
  // any more, and the entrance survives a cloud pull the way the
  // vault's does — a negative --t on the reveal rather than an
  // element the renderer cannot reach.
  // ============================================================
  function pageHero(r) {
    var h = P.getHouse();
    var sc = P.scene(r);
    return '<header class="hd-phero" data-parallax>' +
      '<div class="hd-phero__art" aria-hidden="true">' +
        '<img class="hd-phero__img" src="' + esc(h.heroUrl) + '" alt="" ' +
          'width="736" height="1308" fetchpriority="high" decoding="async">' +
        '<span class="hd-phero__glow"></span>' +
        '<span class="hd-phero__veil"></span>' +
      '</div>' +

      '<div class="hd-phero__in">' +
        '<div class="hd-phero__say">' +
          '<p class="hd-phero__e">' + esc(sc.eyebrow) + '</p>' +
          '<h1 class="hd-phero__t">' + esc(sc.title) + '</h1>' +
        '</div>' +

        todayCard() +
        '<p class="hd-phero__c">' + esc(sc.caption) + '</p>' +
        /* A full-viewport hero hides the whole page, so it has to say
           there is one. The chips are the real way in; this is the
           acknowledgement that the picture is not the end. */
        '<span class="hd-phero__scroll" aria-hidden="true"><i></i>Scroll</span>' +
        heroChips(r) +
      '</div>' +
      '<span class="hd-phero__rule" aria-hidden="true"></span>' +
    '</header>';
  }

  // THE FLOATING CARD IS TODAY, and it is the page's primary action —
  // the job the ribbon badge used to do. It says exactly what the page
  // would say if asked: resume what is open, start what is planned,
  // acknowledge a rest day, or offer to start something when nothing
  // is scheduled. Four states, one button, and every one of them does
  // something.
  //
  // The vault fills this slot with cover art so every page opens on
  // something real out of the collection. A routine usually has no
  // photograph, so it gets its group's colour and its lane's mark
  // instead, and the card's geometry is unchanged.
  function todayCard() {
    var live = P.getLive();
    var lead, main, act, tint, cover = '';

    if (live) {
      var ses = P.Sessions.get(live.sessionId);
      lead = 'In progress';
      main = (ses && ses.name) || 'Your workout';
      act = 'resume';
      tint = 'var(--pal-bronze)';
    } else {
      var planned = P.plannedFor(P.today());
      if (planned && !planned.rest) {
        var tpl = P.Templates.get(planned.templateId);
        lead = P.prettyLong(P.today());
        main = planned.name;
        act = 'hero-start';
        tint = hueOf(tpl ? P.templateGroup(tpl) : '');
        if (tpl && tpl.cover) cover = tpl.cover;
      } else if (planned && planned.rest) {
        lead = 'Today is a rest day';
        main = planned.name || 'Rest';
        act = 'hero-free';
        tint = 'var(--pal-rest)';
      } else {
        lead = P.prettyLong(P.today());
        main = 'Nothing scheduled';
        act = 'hero-free';
        tint = 'var(--pal-ash)';
      }
    }

    return '<button type="button" class="hd-hcard" style="--pal-tint:' + esc(tint) + '"' +
      ' data-act="' + act + '"' +
      (live ? '' : ' data-id="' + esc((P.plannedFor(P.today()) || {}).templateId || '') + '"') + '>' +
      '<span class="hd-hcard__art">' +
        (cover
          ? '<img src="' + esc(cover) + '" alt="" loading="lazy" decoding="async">'
          : '<span class="hd-hcard__none">' + palMark() + '</span>') +
      '</span>' +
      '<span class="hd-hcard__in">' +
        '<span class="hd-hcard__e">' + esc(lead) + '</span>' +
        '<span class="hd-hcard__t">' + esc(main) + '</span>' +
        '<span class="hd-hcard__go">' +
          (live ? 'Pick it up &#8594;' : (act === 'hero-free' ? 'Start something &#8594;' : 'Start it &#8594;')) +
        '</span>' +
      '</span>' +
    '</button>';
  }

  // THE CHIPS are the groups with something in them, biggest first —
  // the one thing a full-viewport hero owes the reader: a way into the
  // library that does not require scrolling past the picture first.
  // Six, capped, because .hd-chips is sized to break 3/3.
  //
  // On every route except Workouts they GO to Workouts; on Workouts
  // itself they filter it, because a chip that navigates to the page
  // you are already on is a chip that does nothing.
  function heroChips(r) {
    var counts = P.groupCounts();
    var list = P.groups()
      .filter(function (g) { return counts[g.id]; })
      .sort(function (a, b) { return counts[b.id] - counts[a.id]; })
      .slice(0, 6);
    if (!list.length) return '';
    return '<nav class="hd-chips" aria-label="Your workouts">' +
      list.map(function (g) {
        return '<button type="button" class="hd-chip2" data-act="to-group"' +
          ' data-group="' + esc(g.id) + '" style="--pal-tint:' + esc(g.hue) + '">' +
          '<span class="hd-chip2__n">' + esc(g.label) + '</span>' +
          '<span class="hd-chip2__c">' + counts[g.id] + '</span>' +
        '</button>';
      }).join('') +
    '</nav>';
  }

  // The mark on the hero card when the day's routine has no photograph.
  // Drawn, never emoji: emoji in this room would undo the typographic
  // argument, and they render as tofu in headless Chrome besides.
  function palMark() {
    return '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.1" ' +
      'stroke-linecap="round" aria-hidden="true">' +
      '<path d="M6 20h28"/><path d="M11 13v14"/><path d="M29 13v14"/>' +
      '<path d="M6.5 16.5v7"/><path d="M33.5 16.5v7"/></svg>';
  }

  function hueOf(groupId) {
    var g = P.groupById(groupId);
    return g ? g.hue : 'var(--pal-ash)';
  }

  // ============================================================
  // §THE PILL NAV
  //
  // The four routes become the pill's links, split around the
  // wordmark — the house's arrangement, and the reason the wordmark
  // sits in the middle of the links rather than off to one side.
  // ============================================================
  function paintNav(r) {
    var L = document.getElementById('hdNavL');
    var R = document.getElementById('hdNavR');
    if (!L || !R) return;
    function link(rt) {
      return '<a href="#' + rt.hash + '"' +
        (rt.hash === r ? ' aria-current="page"' : '') + '>' + esc(rt.label) + '</a>';
    }
    L.innerHTML = ROUTES.slice(0, 2).map(link).join('');
    R.innerHTML = ROUTES.slice(2).map(link).join('');
  }

  // ============================================================
  // §THE SCROLL HANDLER — one listener, three jobs
  //
  // It frosts the bar past 24px AND drives the hero's parallax: the
  // plate down at y*0.34, the words up at y*-0.06, the whole thing
  // fading out over the first 62%. Two listeners would mean two
  // layout reads a frame.
  //
  // Not animation-timeline: scroll(), which only reached iOS in
  // Safari 26. Past the hero the properties are parked once rather
  // than written every frame.
  // ============================================================
  var heroEl = null, heroH = 0, ticking = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  function measureHero() {
    heroEl = root.querySelector('.hd-phero');
    heroH = heroEl ? heroEl.offsetHeight : 0;
    if (heroEl) delete heroEl.dataset.parked;
    onScroll();
  }

  function onScroll() {
    var y = window.scrollY || window.pageYOffset || 0;
    var top = document.getElementById('hdTop');
    if (top) top.classList.toggle('is-stuck', y > 24);
    if (!heroEl || !heroH || reduced.matches) return;
    if (y >= heroH) {
      if (heroEl.dataset.parked) return;
      heroEl.dataset.parked = '1';
      heroEl.style.setProperty('--hd-par', (heroH * 0.34).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-lift', (heroH * -0.06).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-fade', '0');
      return;
    }
    delete heroEl.dataset.parked;
    var p = y / heroH;
    heroEl.style.setProperty('--hd-par', (y * 0.34).toFixed(1) + 'px');
    heroEl.style.setProperty('--hd-lift', (y * -0.06).toFixed(1) + 'px');
    heroEl.style.setProperty('--hd-fade', Math.max(0, 1 - p / 0.62).toFixed(3));
  }

  function onScrollRaf() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; onScroll(); });
  }

  function render() {
    var r = route();
    paintNav(r);
    var view =
      r === '/templates' ? viewTemplates()
    : r === '/exercises' ? viewExercises()
    : r === '/history'   ? viewHistory()
    : r === '/data'      ? viewData()
    :                      viewSchedule();
    // THE HERO IS PART OF THE VIEW. It is re-created on every paint,
    // which is what lets each route say its own name — and which is
    // why measureHero() has to run again immediately afterwards: the
    // element the scroll handler was holding no longer exists.
    root.innerHTML = pageHero(r) + view;
    afterRender(r);
  }
  function refresh() { render(); }
  function repaint() {
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (U.sheetOpen()) return;
    render();
  }
  function navigate() {
    // Already past the hero? Land on the top of the new route's
    // CONTENT rather than back at the top of a photograph. Replaying a
    // 100svh hero every time you change tab is the navigation
    // equivalent of the repaint-scrolls bug.
    var below = heroH > 0 && (window.scrollY || window.pageYOffset || 0) > heroH * 0.6;
    render();
    if (!below) { toTop(); return; }
    var el = root.querySelector('.hd-phero');
    var h = el ? el.offsetHeight : 0;
    try { window.scrollTo({ top: h, behavior: 'auto' }); }
    catch (e) { window.scrollTo(0, h); }
  }

  // updateBadge() is gone with the ribbon it wrote to. What it said —
  // resume / start what is planned / rest day / start something — is
  // todayCard(), which is painted with the hero and so can never fall
  // out of step with the route the way a separately-updated badge
  // could.

  function toTop() {
    try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { window.scrollTo(0, 0); }
  }

  // Anything that needs a real element after innerHTML lands.
  function afterRender(r) {
    if (r === '/data') wireSettings();
    if (r === '/templates' && pendingGroup) {
      var g = pendingGroup; pendingGroup = null;
      scrollToGroup(g);
    }
    // The hero was destroyed and rebuilt by the paint above, so the
    // scroll handler is holding a detached element and a stale
    // height. Measuring is measuring: it does not re-arm the
    // entrance and it does not scroll.
    measureHero();
  }

  // ============================================================
  // SHARED FRAGMENTS
  // ============================================================
  // The duration estimate is sets × (work + rest). Meaningful for lifting,
  // meaningless for a treadmill walk where the whole session is one "set" —
  // it read "2 min est." for a 45-minute Zone 2. A cardio card shows no
  // estimate at all rather than a wrong one; see workoutCard.

  // ============================================================
  // §THE WORKOUT CARD
  //
  // ONE LARGE CARD. It had a drawn cover panel above it until
  // 2026-09-05 — six stacked gradients tinted per muscle, with the
  // type badge and up to three 46px thumbnails floating on it, and a
  // seventh gradient dissolving the whole thing into the panel below.
  //
  // The panel was solving a real problem: the seeded library ships
  // with no media at all, so a card whose image area is an empty box
  // on a fresh install is not a design, and a DRAWN cover meant every
  // card had one. It was not worth what it cost. Twenty routines drew
  // twenty variations of the same murk, the badge and the thumbnails
  // were only legible because the murk was dark, and none of it said
  // anything about the workout the card is for.
  //
  // A ROUTINE THAT HAS BEEN GIVEN A PHOTOGRAPH SHOWS IT, and nothing
  // is drawn over it — no scrim, no gradient, no blend mode. That is
  // why the name sits BELOW the art rather than on it: text over an
  // image is the thing that forces a scrim.
  //
  // A card shows PHOTOS only. Videos are counted in a chip and open
  // with the card; twenty <video> elements on one route is the most
  // expensive thing this page could ask a phone to do. See
  // PalUI.cardMedia.
  // ============================================================
  function xstat(val, key) {
    return '<span class="pal-xcard__stat">' +
      '<span class="pal-xcard__val">' + esc(val) + '</span>' +
      '<span class="pal-xcard__key">' + esc(key) + '</span>' +
    '</span>';
  }

  // ============================================================
  // §EXERCISE ROW — a ruled list, not a wall of cover cards.
  //
  // The cover card was one card per exercise: a 16/11 gradient, a giant
  // ghost watermark and two figures. At fifty exercises that is eight
  // screens of scrolling to answer "how many sets was the pullover", and
  // the covers carry no information — they are drawn from the muscle, which
  // the row already names.
  //
  // So the list came back, and everything the card showed comes with it,
  // plus two things the card had silently dropped: the per-exercise music
  // pin, and the personal best. Nothing is lost by scanning instead of
  // browsing.
  //
  // The GLOW is what the card was really for — knowing which muscle a row
  // belongs to without reading it. It is a stacked, colour-tinted box-shadow
  // keyed to the same per-muscle --cover axis the card used, on a 3px left
  // edge: the device .pal-planrow introduced, at the density a library
  // needs. box-shadow, never backdrop-filter — the theme forbids per-row
  // blur for exactly this count of rows.
  // ============================================================
  function exerciseRow(e) {
    var lane = P.laneOf(e.muscle === 'Cardio' ? 'Cardio' : 'Strength');
    var media = U.mediaLabel(e.media);
    var best = exBest(e.name);
    var bits = [e.equipment, media].filter(Boolean);
    return '<li class="pal-listrow pal-exrow" data-lane="' + esc(lane) + '" data-muscle="' + esc(e.muscle) + '">' +
      '<div class="pal-listrow__main">' +
        '<div class="pal-listrow__title">' + esc(e.name) + '</div>' +
        '<div class="pal-listrow__meta">' +
          esc(P.setsAndReps(e) || '\u2014') + ' \u00b7 ' + esc(P.fmtRest(e.restSec)) + ' rest' +
          (bits.length ? ' \u00b7 ' + esc(bits.join(' \u00b7 ')) : '') +
        '</div>' +
      '</div>' +
      (best ? '<div class="pal-exrow__pr" title="Best estimated one-rep max">' +
        '<span class="pal-exrow__prval">' + esc(P.fmtWeight(best.e1rm)) + '</span>' +
        '<span class="pal-exrow__prkey">best</span></div>' : '') +
      '<div class="pal-listrow__actions">' +
        window.PalMusic.button({ scope: 'exercise:' + e.id, trackId: e.trackId, label: e.name }) +
        '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="edit-exercise" data-id="' + esc(e.id) + '">Edit</button>' +
      '</div>' +
    '</li>';
  }
  // personalBests() walks every session ever logged, so it is read ONCE per
  // render and looked up from a map — not called per row.
  var prCache = null;
  function exBest(name) {
    if (!prCache) {
      prCache = {};
      P.personalBests().forEach(function (b) { prCache[b.exercise] = b; });
    }
    return prCache[name] || null;
  }

  // A workout card is NOT a button — its actions start a session, and
  // that is not something a stray tap on a card should be able to do.
  // ============================================================
  // §LISTING A ROUTINE'S EXERCISES
  //
  // One builder for both places a routine's contents are listed — the
  // Today card and the schedule row — so a superset can never read as a
  // pair on one and a flat list on the other.
  //
  // A block gets a rule above it naming the rest that follows the PAIR.
  // Without that line the two exercises are just two exercises, and the
  // whole point of the week is that they are not done that way.
  // ============================================================
  function entryListHtml(entries, cap, liClass, repClass) {
    var shown = entries.slice(0, cap);
    var n = 0;
    return P.blocksOf(shown).map(function (g) {
      var pair = g.entries.length > 1;
      if (pair) n++;
      return (pair
        ? '<li class="pal-blockline' + (liClass ? ' ' + liClass : '') + '">' +
          '<span>Block ' + n + '</span>' +
          '<span>' + P.blockRest(g.entries) + 's after the pair</span></li>'
        : '') +
        g.entries.map(function (e) {
          return '<li' + (liClass ? ' class="' + liClass + '"' : '') +
            (pair ? ' data-paired="true"' : '') + '>' +
            '<span>' + esc(e.name) + '</span>' +
            '<span' + (repClass ? ' class="' + repClass + '"' : '') + '>' +
            esc(e.sets.length + ' \u00d7 ' + (e.targetReps || '\u2014')) + '</span></li>';
        }).join('');
    }).join('');
  }

  function workoutCard(t, entries, opts) {
    opts = opts || {};
    var lane = P.laneOf(t.type);
    var cap = opts.cap || 6;
    var shown = entries.slice(0, cap);
    var more = entries.length - shown.length;
    var isCardio = lane === 'cardio';
    var media = [];
    entries.forEach(function (en) { if (en.media && en.media.length) media = media.concat(en.media); });

    var grp = P.groupById(P.templateGroup(t));

    return '<div class="pal-xcard" data-lane="' + esc(lane) + '" data-tpl="' + esc(t.id) + '"' +
      ' data-group="' + esc(grp.id) + '" style="--pal-tint:' + esc(grp.hue) + '">' +
      /* THE ART, WHEN THERE IS ANY. No wrapper at all when there is
         not — an empty ratio box is exactly the hole the drawn cover
         existed to fill, and re-introducing it would undo the change. */
      (t.cover
        ? '<div class="pal-xcard__art"><img src="' + esc(t.cover) + '" alt=""' +
          ' loading="lazy" decoding="async"></div>'
        : '') +
      '<div class="pal-xcard__body">' +
        (opts.eyebrow ? '<p class="pal-eyebrow">' + esc(opts.eyebrow) + '</p>' : '') +
        '<h3 class="pal-xcard__name">' + esc(t.name) + '</h3>' +
        /* ONE META ROW. The group pill, the type badge and where it
           sits in the week were three separate things in three
           places — the badge floating on the cover, the schedule tag
           under the name. They say related things, so they say them
           together. */
        /* THE PILL AND THE BADGE MUST NOT SAY THE SAME WORD. The ten
           groups seed from the ten type keys, so out of the box a Push
           routine is typed Push and filed under Push — and the card
           printed 'Push' twice, once as a capsule and once as a badge.
           The type is the one that carries information the group does
           not, so it is always shown; the pill appears only once the
           two have actually come apart. */
        '<div class="pal-xcard__meta">' +
          (grp.label.toLowerCase() === String(t.type).toLowerCase() ? '' : groupPill(grp)) +
          '<span class="pal-xcard__tag"><span class="pal-badge">' + esc(t.type) + '</span></span>' +
        '</div>' +
        schedTag(t) +
        (shown.length
          ? '<ul class="pal-xcard__list">' + entryListHtml(entries, cap, 'pal-xcard__li', '') + '</ul>' +
            (more ? '<p class="pal-sub">and ' + more + ' more</p>' : '')
          : '<p class="pal-sub">No exercises in this routine yet.</p>') +
        '<div class="pal-xcard__stats">' +
          xstat(String(entries.length), entries.length === 1 ? 'exercise' : 'exercises') +
          (isCardio ? '' : xstat(P.estimatedDuration(entries) + 'm', 'est.')) +
        '</div>' +
        '<div class="pal-xcard__acts">' +
          '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="start-template" data-id="' + esc(t.id) + '"' +
            (opts.level ? ' data-level="' + esc(opts.level) + '"' : '') + '>\u25b6 Start</button>' +
          '<button class="pal-btn pal-btn--sm" data-act="edit-template" data-id="' + esc(t.id) + '">Edit</button>' +
          window.PalMusic.button({ scope: 'template:' + t.id, trackId: t.trackId, label: t.name }) +
        '</div>' +
        /* The exercise photographs. They were pinned to the bottom of
           the cover; they are a strip at the foot of the panel now,
           which is the only place left for them and the right one —
           they belong to the exercises listed above them. */
        U.cardMedia(media, 3) +
      '</div>' +
    '</div>';
  }

  // THE GROUP PILL. A rounded capsule in the group's own hue with
  // near-black text — the house's one non-square shape besides a tap
  // target, and the same builder Prompt Studio and The Asclepion use.
  // One builder, three places, all reading --pal-tint.
  function groupPill(g) {
    if (!g) return '';
    return '<span class="pal-pill" style="--pal-tint:' + esc(g.hue) + '">' +
      esc(g.label) + '</span>';
  }

  // Where a routine sits in the week — the same two fields the Schedule
  // page reads. Shown on the card so the two pages cannot describe the
  // same routine differently.
  function schedTag(t) {
    var days = (t.days || []);
    if (!days.length && !t.level) return '';
    var dayTxt = days.length
      ? P.WEEKDAYS.filter(function (w) { return days.indexOf(w.key) !== -1; })
          .map(function (w) { return w.short; }).join(' · ')
      : 'Unscheduled';
    return '<p class="pal-xcard__sched">' +
      '<span class="pal-xcard__scheddays">' + esc(dayTxt) + '</span>' +
      (t.level ? '<span class="pal-xcard__schedlvl" data-level="' + esc(t.level) + '">' +
        esc(P.levelInfo(t.level).label) + '</span>' : '') +
    '</p>';
  }

  // EVERY BAND HEADING IS YOURS. band() takes the KEY of a heading
  // rather than the heading, and looks the words up in pal:house —
  // so a heading is edited from the safety net instead of from this
  // file. The defaults are the strings that used to be typed here.
  function band(key, inner, headExtra) {
    var title = P.getHouse().bands[key] || key;
    return '<section class="pal-band hd-night">' +
      '<div class="pal-band__head"><h2 class="pal-h2">' + esc(title) + '</h2>' +
      (headExtra || '') + '</div>' + inner + '</section>';
  }

  // ============================================================
  // §SCHEDULE VIEW — the Weekly Workout Schedule, and the landing page.
  //
  // It answers the question the page is opened with: what am I doing
  // today, at which effort, and can I start it from here. Today gets a
  // panel of its own above the seven rows; the other six days are rows.
  //
  // Nothing on this page is stored. Every row is read back out of the
  // routines themselves through P.getSchedule() — set a routine's days in
  // Workouts and it appears here, rename it and it renames here. The only
  // thing written is the level chosen for a date, in pal:levels.
  // ============================================================

  // ============================================================
  // §THE TODAY PANEL
  //
  // What the Today page was for, on the page you now land on. Only the
  // half that starts a workout made the move: the steps, water,
  // bodyweight and macro tiles beside it are gone with the screens that
  // read them, and so are the streak band and the weekly scorecard —
  // half of what they scored no longer exists.
  //
  // What is left is one figure (the week's count) and one card. Every
  // shape in it already existed: workoutCard() brings its own Start, Edit
  // and music button, so this panel and the same routine's card in
  // Workouts can never drift apart.
  // ============================================================
  function todayPanel() {
    var t = P.today();
    var s = P.getSettings();
    var live = P.getLive();
    var liveSes = live ? P.Sessions.get(live.sessionId) : null;
    var planned = P.plannedFor(t);
    var doneToday = P.sessionsOn(t);

    var card;
    if (liveSes) {
      var remaining = liveSes.entries.filter(function (e) { return !e.done; }).length;
      card = '<div class="pal-card" data-lane="' + esc(P.laneOf(liveSes.type)) + '">' +
        '<div class="pal-card__head">' +
          '<div><p class="pal-eyebrow">In progress</p><h3 class="pal-h2">' + esc(liveSes.name) + '</h3></div>' +
          '<span class="pal-badge">' + esc(liveSes.type) + '</span>' +
        '</div>' +
        '<div class="pal-row" style="gap:24px;margin-bottom:18px">' +
          U.fig(remaining, 'left', 'md') +
          U.fig(P.sessionSetCount(liveSes), 'sets done', 'md') +
        '</div>' +
        '<a class="pal-btn pal-btn--primary" href="palaestra-workout.html">Back to the workout →</a>' +
      '</div>';
    } else if (planned && !planned.rest) {
      var lvl = P.getLevel(t);
      var info = P.levelInfo(lvl);
      card = '<div class="pal-todaylvl">' +
          '<div><p class="pal-eyebrow" style="margin:0 0 4px">Which version today?</p>' +
            '<p class="pal-sub" style="margin:0">' + esc(info.dot + ' ' + info.label + ' \u00b7 ' + info.title + ' \u00b7 ' + info.mins + '. ' + info.when) + '</p></div>' +
          levelPicker(t, lvl, P.hasLevel(t)) +
        '</div>' +
        workoutCard(planned.template, P.entriesFromTemplate(planned.template),
                    { eyebrow: 'Today', cap: 8, level: lvl });
    } else if (planned && planned.rest) {
      card = '<div class="pal-card" data-lane="rest">' +
        '<p class="pal-eyebrow">Today</p><h3 class="pal-h2">Rest</h3>' +
        '<p class="pal-lede" style="margin:12px 0 18px">Scheduled recovery. Resting today keeps the streak, it does not break it.</p>' +
        '<div class="pal-row">' +
          '<button class="pal-btn" data-act="start-free">Train anyway</button>' +
          '<button class="pal-btn pal-btn--ghost" data-act="go-templates">Change the plan</button>' +
        '</div>' +
      '</div>';
    } else {
      card = '<div class="pal-card">' +
        '<p class="pal-eyebrow">Today</p><h3 class="pal-h2">Nothing scheduled</h3>' +
        '<p class="pal-lede" style="margin:12px 0 18px">Give a routine some days in Workouts and this card fills itself in every morning.</p>' +
        '<div class="pal-row">' +
          '<button class="pal-btn pal-btn--primary" data-act="start-free">▶ Start a workout</button>' +
          '<button class="pal-btn" data-act="go-templates">Build the week</button>' +
        '</div>' +
      '</div>';
    }

    if (doneToday.length) {
      card += '<div class="pal-card" style="margin-top:16px">' +
        '<p class="pal-eyebrow">Logged today</p>' +
        '<ul class="pal-list">' + doneToday.map(function (x) {
          return '<li class="pal-listrow" data-lane="' + esc(P.laneOf(x.type)) + '">' +
            '<div class="pal-listrow__main"><div class="pal-listrow__title">' + esc(x.name) + '</div>' +
            '<div class="pal-listrow__meta">' + P.sessionSetCount(x) + ' sets · ' + P.fmtInt(P.sessionVolume(x)) + ' ' + esc(s.weightUnit) + ' · ' + P.fmtDuration(x.elapsedSec) + '</div></div>' +
            '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="open-session" data-id="' + esc(x.id) + '">Open</button>' +
          '</li>';
        }).join('') + '</ul></div>';
    }

    // The one number the streak band was for. A workout streak tops out at
    // 2 for anyone training four days a week, so the honest weekly figure
    // is the one worth keeping.
    var st = P.streaks();
    var count = '<div class="pal-weekline">' + U.pips(st.weekDone, st.weekGoal) +
      '<span class="pal-weekline__txt">' + st.weekDone + ' of ' + st.weekGoal + ' this week</span></div>';

    return '<section class="pal-band" style="border-top:0">' +
      '<div class="pal-band__head">' +
        '<h2 class="pal-h2">Today</h2>' + count +
      '</div>' +
      '<div class="pal-todaypanel">' + card + '</div>' +
    '</section>';
  }

  function levelPicker(dateStr, chosen, explicit) {
    return '<div class="pal-levels" role="group" aria-label="Effort level for ' + esc(P.prettyLong(dateStr)) + '">' +
      P.LEVELS.map(function (l) {
        var on = l.key === chosen;
        return '<button type="button" class="pal-level" data-act="set-level"' +
          ' data-date="' + esc(dateStr) + '" data-level="' + esc(l.key) + '"' +
          ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
          ' data-chosen="' + (on && explicit ? 'true' : 'false') + '"' +
          ' title="' + esc(l.title + ' · ' + l.mins + '. ' + l.when) + '">' +
          esc(l.label) + '</button>';
      }).join('') + '</div>';
  }

  function scheduleRow(dateStr, dayKey, label) {
    var chosen = P.getLevel(dateStr);
    var explicit = P.hasLevel(dateStr);
    var slot = P.getSchedule()[dayKey];
    var tpl = P.resolveForDay(dayKey, chosen);
    var isToday = dateStr === P.today();
    var done = P.sessionsOn(dateStr);
    // The routine that resolved may not be the level asked for — a day with
    // only a HIGH routine still starts something on a LOW day. Say so rather
    // than letting the label and the picker quietly disagree.
    var exact = tpl && ((tpl.level || '') === chosen || !tpl.level);
    var lane = done.length ? P.laneOf(done[0].type) : (tpl ? P.laneOf(tpl.type) : 'none');
    var isRest = tpl && tpl.type === 'Rest';

    var body;
    if (done.length) {
      body = '<p class="pal-schedrow__name">' + esc(done[0].name) + '</p>' +
        '<p class="pal-schedrow__meta">Done · ' + P.sessionSetCount(done[0]) + ' sets · ' +
        P.fmtDuration(done[0].elapsedSec) + '</p>';
    } else if (isRest) {
      body = '<p class="pal-schedrow__name">' + esc(tpl.name) + '</p>' +
        '<p class="pal-schedrow__meta">Rest. Taking it keeps the streak — it does not break it.</p>';
    } else if (tpl) {
      var entries = P.entriesFromTemplate(tpl);
      body = '<p class="pal-schedrow__name">' + esc(tpl.name) + '</p>' +
        '<p class="pal-schedrow__meta">' + entries.length + ' exercise' + (entries.length === 1 ? '' : 's') +
          ' · ~' + P.estimatedDuration(entries) + ' min' +
          (isToday ? ' · listed in full above' : '') +
          (exact ? '' : ' · nothing written for ' + esc(P.levelInfo(chosen).label) + ' yet, so this stands in') +
        '</p>' +
        // Today's panel already prints this routine's exercises directly
        // above, and printing them a second time here made the two halves
        // of one screen say the same thing at the same length.
        (entries.length && !isToday
          ? '<ul class="pal-schedrow__list">' + entryListHtml(entries, 8, '', 'pal-schedrow__reps') +
            (entries.length > 8 ? '<li class="pal-schedrow__more">and ' + (entries.length - 8) + ' more</li>' : '') +
            '</ul>'
          : '');
    } else {
      body = '<p class="pal-schedrow__name pal-schedrow__name--empty">Nothing scheduled</p>' +
        '<p class="pal-schedrow__meta">Give a routine this day in Workouts and it appears here.</p>';
    }

    // Start is offered on ANY day that has a routine and nothing logged,
    // not only today's row. P.startWorkout() always dates the session
    // P.today(), which is the honest behaviour: starting Thursday's
    // routine on a Tuesday records a workout done on Tuesday. Today's
    // button is the primary one and the other six are quiet, so the page
    // still says plainly which day it is.
    var acts = [];
    if (tpl && !isRest && !done.length) {
      acts.push('<button class="pal-btn pal-btn--sm' + (isToday ? ' pal-btn--primary' : '') +
        '" data-act="start-template" data-id="' + esc(tpl.id) + '" data-level="' + esc(chosen) + '">' +
        (isToday ? '▶ Start' : 'Start') + '</button>');
    }
    if (done.length) {
      acts.push('<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="open-session" data-id="' +
        esc(done[0].id) + '">Open</button>');
    }
    acts.push(tpl
      ? '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="edit-template" data-id="' +
        esc(tpl.id) + '">Edit</button>'
      : '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="new-template" data-day="' +
        esc(dayKey) + '">Add one</button>');
    var actions = '<div class="pal-row">' + acts.join('') + '</div>';

    // Which levels this day actually has something written for. A dot the
    // reader can see is worth more than discovering it on the day.
    var written = P.LEVEL_KEYS.filter(function (k) { return slot[k]; });
    var coverage = (slot.any || written.length === 3)
      ? ''
      : '<p class="pal-schedrow__cover">' +
          (written.length ? 'Written for ' + written.map(function (k) { return P.levelInfo(k).label; }).join(', ') : 'No routine yet') +
        '</p>';

    return '<li class="pal-schedrow" data-lane="' + esc(lane) + '" data-today="' + (isToday ? 'true' : 'false') +
        '" data-done="' + (done.length ? 'true' : 'false') + '">' +
      '<div class="pal-schedrow__day">' +
        '<span class="pal-schedrow__dow">' + esc(label) + '</span>' +
        '<span class="pal-schedrow__date">' + esc(P.prettyDate(dateStr)) + '</span>' +
        (isToday ? '<span class="pal-schedrow__tag">Today</span>' : '') +
      '</div>' +
      '<div class="pal-schedrow__main">' + body + coverage + '</div>' +
      '<div class="pal-schedrow__side">' + levelPicker(dateStr, chosen, explicit) + actions + '</div>' +
    '</li>';
  }

  function viewSchedule() {
    var start = P.addDays(P.mondayOf(P.today()), schedWeek * 7);
    var rows = P.WEEKDAYS.map(function (w, i) {
      return scheduleRow(P.addDays(start, i), w.key, w.short);
    }).join('');

    // The framing is not decoration. Left unsaid, a three-way picker reads as
    // "full workout / half a workout / gave up", which is the opposite of
    // what it is for.
    var key = '<div class="pal-levelkey">' + P.LEVELS.map(function (l) {
      return '<div class="pal-levelkey__item" data-level="' + esc(l.key) + '">' +
        '<span class="pal-levelkey__dot" aria-hidden="true">' + l.dot + '</span>' +
        '<div><p class="pal-levelkey__head">' + esc(l.label) + ' \u00b7 ' + esc(l.title) +
          ' <span class="pal-sub">' + esc(l.mins) + '</span></p>' +
        '<p class="pal-levelkey__body">' + esc(l.blurb) + '</p>' +
        '<p class="pal-levelkey__when">' + esc(l.when) + '</p></div>' +
      '</div>';
    }).join('') +
    '<p class="pal-levelkey__foot">MID and LOW are not failed HIGH days \u2014 they are the versions of the week that match the resources you actually have. ' +
      'Nothing here counts a LOW day as a miss, and there is nothing to make up afterwards.</p>' +
    '</div>';

    var label = schedWeek === 0 ? 'This week'
      : (schedWeek === 1 ? 'Next week'
      : (schedWeek === -1 ? 'Last week' : P.prettyDate(start)));

    // The only way to #/data, and it says how many snapshots are behind it
    // — an assurance is worth nothing if you cannot see it is true.
    var st = window.PalBackup ? window.PalBackup.stats() : null;
    var foot = '<div class="pal-schedfoot"><a href="#/data">Safety net' +
      (st ? ' \u00b7 ' + st.count + ' snapshot' + (st.count === 1 ? '' : 's') : '') +
      '</a></div>';

    return todayPanel() + band('schedule',
      '<ul class="pal-schedlist">' + rows + '</ul>' +
      '<div class="pal-card" style="margin-top:24px"><h3 class="pal-h3" style="margin-bottom:14px">Choosing a level</h3>' + key + '</div>' +
      foot,
      '<div class="pal-row">' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-step" data-n="-1" aria-label="Previous week">\u2190</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-today">' + esc(label) + '</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="sched-step" data-n="1" aria-label="Next week">\u2192</button>' +
      '</div>');
  }

  // ============================================================
  // §THE GROUP BAR — the Workouts route, filed the way you file it
  //
  // A routine's shelf used to be its TYPE, and type is a frozen ten.
  // It is a group now, and a group is data: rename it, recolour it,
  // reorder it, add one, delete one. See §GROUPS in palaestra-data.js
  // for why type and group had to come apart.
  //
  // The fold state is a PREFERENCE and is persisted; nothing else
  // about the view is. Deciding a group is one you rarely open is a
  // lasting decision.
  //
  // pal:uiShut sits under the pal: prefix, so it rides the existing
  // Supabase row like everything else — which is right: a group you
  // keep folded on the laptop is one you want folded on the phone.
  // ============================================================
  var shutGroups = null;

  function loadShut() {
    if (shutGroups) return shutGroups;
    var raw = null;
    try { raw = localStorage.getItem('pal:uiShut'); } catch (e) {}
    try { shutGroups = raw ? JSON.parse(raw) : []; } catch (e) { shutGroups = []; }
    if (!Array.isArray(shutGroups)) shutGroups = [];
    return shutGroups;
  }
  function isShut(id) { return loadShut().indexOf(id) !== -1; }
  function toggleShut(id) {
    var list = loadShut(), i = list.indexOf(id);
    if (i === -1) list.push(id); else list.splice(i, 1);
    try { localStorage.setItem('pal:uiShut', JSON.stringify(list)); } catch (e) {}
  }

  function groupedTemplates() {
    var by = {};
    P.templatesSorted().forEach(function (t) {
      var g = P.templateGroup(t);
      (by[g] = by[g] || []).push(t);
    });
    return by;
  }

  // THE GROUP PILL. A rounded capsule in the group's own hue with
  // near-black text — the house's one non-square shape besides a tap
  // target, and the same builder Prompt Studio and The Asclepion use.
  // One builder, three places, all reading --pal-tint.
  function groupPill(g) {
    if (!g) return '';
    return '<span class="pal-pill" style="--pal-tint:' + esc(g.hue) + '">' +
      esc(g.label) + '</span>';
  }

  function groupSection(g, list) {
    var shut = isShut(g.id);
    return '<section class="pal-group" id="g_' + esc(g.id) + '"' +
      ' data-group="' + esc(g.id) + '" style="--pal-tint:' + esc(g.hue) + '">' +
      '<div class="pal-group__bar">' +
        /* The chevron turns the way a fold does everywhere else in the
           dashboard: upright open, rotated shut. The same glyph one
           level down must not mean the opposite thing. */
        '<button type="button" class="pal-group__fold" data-act="fold-group"' +
          ' data-group="' + esc(g.id) + '" aria-expanded="' + (shut ? 'false' : 'true') + '"' +
          ' aria-label="' + (shut ? 'Show ' : 'Hide ') + esc(g.label) + '">' +
          '<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor"' +
          ' stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M2.5 4.5 6 8l3.5-3.5"/></svg>' +
        '</button>' +
        groupPill(g) +
        '<span class="pal-group__n">' + list.length +
          (list.length === 1 ? ' routine' : ' routines') + '</span>' +
        '<span class="pal-spacer"></span>' +
        '<button type="button" class="pal-btn pal-btn--sm pal-btn--ghost"' +
          ' data-act="edit-group" data-group="' + esc(g.id) + '">Edit group</button>' +
      '</div>' +
      /* display beats the UA stylesheet's [hidden], and .pal-group__body
         carries a display of its own. Say it twice or a folded group
         stays open. */
      '<div class="pal-group__body"' + (shut ? ' hidden' : '') + '>' +
        '<div class="pal-xgrid">' + list.map(function (t) {
          return workoutCard(t, P.entriesFromTemplate(t));
        }).join('') + '</div>' +
      '</div>' +
    '</section>';
  }

  // ============================================================
  // §THE GROUP EDITOR
  // ============================================================
  function sheetGroup(id) {
    var isNew = !id;
    var g = isNew ? { id: '', label: '', hue: P.GROUP_HUES[0].hue } : P.groupById(id);
    var counts = P.groupCounts();
    var n = counts[g.id] || 0;
    var others = P.groups().filter(function (x) { return x.id !== g.id; });
    var protectedGroup = !isNew && g.id === P.FALLBACK_GROUP;

    U.openSheet({
      title: isNew ? 'New group' : 'Edit group',
      body:
        '<div class="pal-field" style="margin-bottom:14px">' +
          '<label class="pal-label" for="fld_glabel">Name</label>' +
          '<input class="pal-input" id="fld_glabel" name="label" maxlength="40"' +
          ' value="' + esc(g.label) + '" placeholder="Garage days"></div>' +
        '<div class="pal-field" style="margin-bottom:14px"><span class="pal-label">Colour</span>' +
          '<div class="pal-hues" role="group" aria-label="Group colour">' +
            P.GROUP_HUES.map(function (h) {
              return '<button type="button" class="pal-hue" data-hue="' + esc(h.hue) + '"' +
                ' style="--pal-tint:' + esc(h.hue) + '" title="' + esc(h.name) + '"' +
                ' aria-label="' + esc(h.name) + '"' +
                ' aria-pressed="' + (h.hue.toLowerCase() === String(g.hue).toLowerCase()) + '"></button>';
            }).join('') +
          '</div></div>' +
        (isNew ? '' :
          '<p class="pal-sub">' + (n ? n + (n === 1 ? ' routine is' : ' routines are') + ' filed here.'
                                     : 'Nothing is filed here yet.') + '</p>') +
        (protectedGroup
          ? '<p class="pal-sub">This is the group anything unfiled falls back to, so it cannot be deleted.</p>'
          : (isNew ? '' :
            '<div class="pal-field" style="margin-top:14px">' +
              '<label class="pal-label" for="fld_gmove">If you delete this group, its routines move to</label>' +
              '<select class="pal-select" id="fld_gmove" name="moveTo">' +
                others.map(function (o) {
                  return '<option value="' + esc(o.id) + '"' +
                    (o.id === P.FALLBACK_GROUP ? ' selected' : '') + '>' + esc(o.label) + '</option>';
                }).join('') +
              '</select></div>')),
      actions: (isNew || protectedGroup ? [] : [{ label: 'Delete group', act: 'del', kind: 'danger' }])
        .concat([{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }]),
      onMount: function (sheet) {
        // Exactly one hue is pressed at a time, so the handler clears
        // the others rather than only setting this one.
        sheet.addEventListener('click', function (e) {
          var b = e.target.closest('.pal-hue');
          if (!b || !sheet.contains(b)) return;
          e.preventDefault();
          Array.prototype.forEach.call(sheet.querySelectorAll('.pal-hue'), function (x) {
            x.setAttribute('aria-pressed', String(x === b));
          });
        });
      },
      onAction: function (act, sheet) {
        if (act === 'del') {
          if (!confirm('Delete "' + g.label + '"?' + (n
            ? '\n\nThe ' + n + ' routine' + (n === 1 ? '' : 's') + ' in it will be moved, not deleted.'
            : ''))) return;
          var res = P.removeGroup(g.id, val(sheet, 'moveTo'));
          if (!res.ok) { U.toast('That group cannot be deleted', true); return; }
          U.closeSheet(); refresh();
          U.toast(res.moved
            ? 'Group deleted — ' + res.moved + ' routine' + (res.moved === 1 ? '' : 's') +
              ' moved to ' + P.groupById(res.dest).label
            : 'Group deleted');
          return;
        }
        if (act !== 'save') return;
        var label = String(val(sheet, 'label')).trim();
        if (!label) { U.toast('Give the group a name', true); return; }
        var picked = sheet.querySelector('.pal-hue[aria-pressed="true"]');
        var hue = picked ? picked.getAttribute('data-hue') : g.hue;
        if (isNew) P.addGroup(label, hue);
        else P.updateGroup(g.id, { label: label, hue: hue });
        U.closeSheet(); refresh();
        U.toast(isNew ? 'Group added' : 'Group saved');
      }
    });
  }

  // Drag-to-reorder the groups in the safety net's panel. SortableJS is
  // a CDN script, so it can simply not be there — on a flaky connection,
  // and in the test browser, where that CDN is blocked. The panel
  // renders up/down buttons either way and THEY are the real control;
  // the drag is the convenience on top of them.
  function mountGroupSort() {
    var el = document.getElementById('palGroupSort');
    if (!el || !window.Sortable) return;
    window.Sortable.create(el, {
      animation: 150, handle: '.pal-glist__grip', draggable: '.pal-glist__row',
      onEnd: function () {
        var ids = Array.prototype.map.call(
          el.querySelectorAll('[data-group]'), function (n) { return n.getAttribute('data-group'); });
        P.reorderGroups(ids);
        refresh();
        U.toast('Order saved');
      }
    });
  }

  function nudgeGroup(id, dir) {
    var ids = P.groups().map(function (g) { return g.id; });
    var i = ids.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(j, 0, ids.splice(i, 1)[0]);
    P.reorderGroups(ids);
    refresh();
  }

  // ============================================================
  // §THE HOUSE PANEL — everything this studio says about itself
  //
  // The hero copy for each of the five scenes, the heading over every
  // band, the seven weekday names, what HIGH / MID / LOW are called,
  // the line in the footer, and the photograph behind all of it. Every
  // one of them used to be typed into this file.
  //
  // THE KEYS ARE NOT LABELS. high/mid/low, the ten type keys and the
  // seven weekday keys are identifiers: every routine and every logged
  // session carries a copy of them, so renaming one would rewrite
  // history rather than relabel it. What they are CALLED is editable;
  // what they ARE is not. See §HOUSE in palaestra-data.js.
  // ============================================================
  function houseCard() {
    var h = P.getHouse();
    var custom = h.heroUrl !== P.HERO_DEFAULT;
    return '<section class="pal-card">' +
      '<h3 class="pal-h3">The studio\'s own words</h3>' +
      '<p class="pal-lede">Every heading, every hero and every label on this page is ' +
        'yours to change. Clear a field and it goes back to the words that ship with it.</p>' +
      '<div class="pal-row" style="margin-top:14px">' +
        '<button class="pal-btn pal-btn--sm" data-act="edit-scenes">Hero words</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="edit-bands">Headings and labels</button>' +
        '<button class="pal-btn pal-btn--sm" data-act="edit-hero">The photograph</button>' +
      '</div>' +
      '<p class="pal-sub" style="margin-top:12px">' +
        (custom ? 'Using your own photograph.' : 'Using the photograph that ships with the studio.') +
      '</p>' +
    '</section>';
  }

  function sceneField(hash, label, sc) {
    return '<fieldset class="pal-fieldset">' +
      '<legend class="pal-label">' + esc(label) + '</legend>' +
      '<div class="pal-field"><input class="pal-input" name="e_' + esc(hash) + '"' +
        ' maxlength="60" value="' + esc(sc.eyebrow) + '" aria-label="Eyebrow"></div>' +
      '<div class="pal-field"><input class="pal-input" name="t_' + esc(hash) + '"' +
        ' maxlength="120" value="' + esc(sc.title) + '" aria-label="Headline"></div>' +
      '<div class="pal-field"><textarea class="pal-textarea" name="c_' + esc(hash) + '"' +
        ' rows="2" maxlength="400" aria-label="The line under it">' + esc(sc.caption) + '</textarea></div>' +
    '</fieldset>';
  }

  function sheetScenes() {
    var h = P.getHouse();
    var order = [
      ['/', 'Schedule'], ['/templates', 'Workouts'], ['/exercises', 'Exercises'],
      ['/history', 'History'], ['/data', 'Safety net'], ['log', 'The workout logger']
    ];
    U.openSheet({
      title: 'Hero words',
      lede: 'Three lines per screen: the small capitals, the headline, and the sentence under it.',
      body: order.map(function (o) { return sceneField(o[0], o[1], h.scenes[o[0]]); }).join(''),
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var scenes = {};
        order.forEach(function (o) {
          scenes[o[0]] = {
            eyebrow: val(sheet, 'e_' + o[0]),
            title: val(sheet, 't_' + o[0]),
            caption: val(sheet, 'c_' + o[0])
          };
        });
        P.setHouse({ scenes: scenes });
        U.closeSheet(); refresh(); U.toast('Saved');
      }

  function sheetBands() {
    var h = P.getHouse();
    var bands = [['schedule', 'The schedule'], ['workouts', 'Workouts'],
                 ['exercises', 'The exercise library'], ['history', 'History'],
                 ['data', 'The safety net']];
    U.openSheet({
      title: 'Headings and labels',
      lede: 'What each section is called, what the seven days are called, and what the three efforts are called.',
      body:
        '<fieldset class="pal-fieldset"><legend class="pal-label">Section headings</legend>' +
          bands.map(function (b) {
            return '<div class="pal-field"><input class="pal-input" name="b_' + b[0] + '"' +
              ' maxlength="60" value="' + esc(h.bands[b[0]]) + '" aria-label="' + esc(b[1]) + '"></div>';
          }).join('') +
        '</fieldset>' +
        '<fieldset class="pal-fieldset"><legend class="pal-label">The days of the week</legend>' +
          '<div class="pal-grid pal-grid--2">' +
            h.days.map(function (d, i) {
              return '<div class="pal-field"><input class="pal-input" name="d_' + i + '"' +
                ' maxlength="24" value="' + esc(d) + '" aria-label="Day ' + (i + 1) + '"></div>';
            }).join('') +
          '</div>' +
          '<p class="pal-sub">Monday first, and the order is fixed — a week is a week. ' +
            'The short form on the cards is taken from the first three letters.</p>' +
        '</fieldset>' +
        '<fieldset class="pal-fieldset"><legend class="pal-label">The three efforts</legend>' +
          P.LEVEL_KEYS.map(function (k) {
            return '<div class="pal-grid pal-grid--2">' +
              '<div class="pal-field"><input class="pal-input" name="ll_' + k + '"' +
                ' maxlength="20" value="' + esc(h.levels[k].label) + '" aria-label="Short name"></div>' +
              '<div class="pal-field"><input class="pal-input" name="lt_' + k + '"' +
                ' maxlength="40" value="' + esc(h.levels[k].title) + '" aria-label="What it is for"></div>' +
            '</div>';
          }).join('') +
          '<p class="pal-sub">These are names, not settings. Every routine and every logged workout ' +
            'stores which of the three it was, so renaming one relabels your history rather than rewriting it.</p>' +
        '</fieldset>' +
        '<fieldset class="pal-fieldset"><legend class="pal-label">The line at the foot of the schedule</legend>' +
          '<div class="pal-field"><input class="pal-input" name="footLine" maxlength="80"' +
            ' value="' + esc(h.footLine) + '" aria-label="Footer line"></div>' +
        '</fieldset>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var nb = {}, nl = {};
        bands.forEach(function (b) { nb[b[0]] = val(sheet, 'b_' + b[0]); });
        P.LEVEL_KEYS.forEach(function (k) {
          nl[k] = { label: val(sheet, 'll_' + k), title: val(sheet, 'lt_' + k) };
        });
        P.setHouse({
          bands: nb, levels: nl, footLine: val(sheet, 'footLine'),
          days: P.HOUSE_DEFAULTS.days.map(function (_, i) { return val(sheet, 'd_' + i); })
        });
        U.closeSheet(); refresh(); U.toast('Saved');
      }
    });
  }

  // THE PHOTOGRAPH. It goes through PhotoStore like every other image
  // on this page: the file is compressed to a data URL here, uploaded,
  // and only the returned URL is stored. A multi-megabyte base64 string
  // in a pal: key would be pushed into the Supabase row on every save.
  function sheetHero() {
    var h = P.getHouse();
    U.openSheet({
      title: 'The photograph',
      lede: 'It fills the top of every screen in the studio.',
      body:
        '<div class="pal-herofig"><img src="' + esc(h.heroUrl) + '" alt=""></div>' +
        '<p class="pal-sub" style="margin:12px 0">' +
          (h.heroUrl === P.HERO_DEFAULT
            ? 'The staircase that ships with the studio.'
            : esc(h.heroUrl)) + '</p>' +
        '<div class="pal-field"><label class="pal-label" for="fld_heroFile">Use your own</label>' +
          '<input class="pal-input" id="fld_heroFile" type="file" accept="image/*"></div>' +
        '<p class="pal-sub">A tall photograph works best — the one that ships is 736&#215;1308.</p>',
      actions: (h.heroUrl === P.HERO_DEFAULT ? [] : [{ label: 'Put the original back', act: 'reset', kind: 'danger' }])
        .concat([{ label: 'Close', act: 'cancel' }]),
      onMount: function (sheet) {
        sheet.querySelector('#fld_heroFile').addEventListener('change', function () {
          var f = this.files && this.files[0];
          if (!f) return;
          U.toast('Reading the photograph…');
          // Both of these return promises — the same path mountMedia
          // takes for every other image on the page. The compressed
          // image is stored straight away so the hero works even if the
          // bucket is unreachable; the upload only ever swaps it for a
          // shorter URL.
          P.readFileAsDataUrl(f).then(function (dataUrl) {
            if (!dataUrl) { U.toast('Could not read that file', true); return; }
            return P.compressImageDataUrl(dataUrl, 1600, 0.86).then(function (small) {
              P.setHouse({ heroUrl: small });
              U.closeSheet(); refresh(); U.toast('Photograph changed');
              if (window.PhotoStore && window.PhotoStore.upload) {
                window.PhotoStore.upload(small, function (url) {
                  if (url) { P.setHouse({ heroUrl: url }); refresh(); }
                });
              }
            });
          });
        });
      },
      onAction: function (act) {
        if (act !== 'reset') return;
        P.setHouse({ heroUrl: P.HERO_DEFAULT });
        U.closeSheet(); refresh(); U.toast('The original is back');
      }
    });
  }

  // ============================================================
  // §THE GROUPS PANEL
  // ============================================================
  function groupsCard() {
    var counts = P.groupCounts();
    var list = P.groups();
    return '<section class="pal-card">' +

      '</div>' +
    '</section>';
  }

  // ============================================================
  // TEMPLATES
  // ============================================================
  function viewTemplates() {
    var list = P.templatesSorted();
    var canImport = P.importAvailable();
    var head = '<div class="pal-row">' +
      (canImport ? '<button class="pal-btn pal-btn--sm" data-act="import">↻ Import my programs</button>' : '') +
      '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="new-template">＋ New workout</button>' +
    '</div>';

    if (!list.length) {
      return band('workouts',
        U.empty('No routines yet',
          canImport
            ? 'Install the HIGH / MID / LOW programs from Settings, import the routines still stored by your retired fitness pages, or build one from scratch.'
            : 'A routine is a named list of exercises you can start with one button.',
          'Build your first workout', 'new-template'),
        head);
    }

    // GROUPED, and grouped by a group rather than by a type. A group
    // with nothing in it is not drawn: an empty heading is a promise
    // the page cannot keep, and every group is one row in the safety
    // net's panel anyway.
    //
    // entriesFromTemplate allocates a setModel per set, so it is called
    // ONCE per card and the result handed on — not re-derived per field.
    var by = groupedTemplates();
    var sections = P.groups()
      .filter(function (g) { return (by[g.id] || []).length; })
      .map(function (g) { return groupSection(g, by[g.id]); })
      .join('');

    return band('workouts', sections, head);
  }

  // ============================================================
  // EXERCISES

  // ============================================================
  // EXERCISES
  // ============================================================
  function viewExercises() {
    var list = P.exercisesSorted();
    var head = '<button class="pal-btn pal-btn--sm pal-btn--primary" data-act="new-exercise">＋ New exercise</button>';
    if (!list.length) {
      return band('exercises',
        U.empty('The library is empty', 'Every routine is built from these.', 'Add an exercise', 'new-exercise'), head);
    }
    // Flat grid, not a panel per muscle. Every card already names its own
    // muscle, so twelve labelled bands repeated the same fact twelve times
    // and made the page four screens long. The chips filter instead.
    var present = {};
    list.forEach(function (e) { present[e.muscle] = (present[e.muscle] || 0) + 1; });
    if (exMuscle !== 'All' && !present[exMuscle]) exMuscle = 'All';

    var chips = '<div class="pal-xfilter pal-scrollx" role="group" aria-label="Filter by muscle group">' +
      ['All'].concat(P.MUSCLES.filter(function (m) { return present[m]; }))
        .map(function (m) {
          var on = m === exMuscle;
          return '<button type="button" class="pal-chip" data-act="ex-filter" data-muscle="' + esc(m) + '"' +
                 ' aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(m) +
                 (m === 'All' ? '' : ' <span class="pal-mono">' + present[m] + '</span>') + '</button>';
        }).join('') + '</div>';

    var shown = exMuscle === 'All' ? list : list.filter(function (e) { return e.muscle === exMuscle; });
    prCache = null;

    // Grouped when showing everything, flat when a chip is on — a single
    // heading repeating the chip you just pressed says nothing.
    var groups;
    if (exMuscle === 'All') {
      groups = P.MUSCLES.filter(function (m) { return present[m]; }).map(function (m) {
        var rows = shown.filter(function (e) { return e.muscle === m; });
        return '<div class="pal-card pal-exgroup" data-muscle="' + esc(m) + '" style="margin-bottom:14px">' +
          '<div class="pal-card__head"><h3 class="pal-h3">' + esc(m) + '</h3>' +
          '<span class="pal-sub">' + rows.length + '</span></div>' +
          '<ul class="pal-list">' + rows.map(exerciseRow).join('') + '</ul>' +
        '</div>';
      }).join('');
    } else {
      groups = '<div class="pal-card pal-exgroup" data-muscle="' + esc(exMuscle) + '">' +
        '<ul class="pal-list">' + shown.map(exerciseRow).join('') + '</ul></div>';
    }

    var body = chips + '<div id="palExGrid" style="margin-top:var(--pal-4)">' + groups + '</div>';
    return band('exercises', body, head);
  }

  // The two settings anything still reads. Step, water, weight and macro
