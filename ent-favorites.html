<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>Favorites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Favorites — the fifth "Entertainment" nav-folder page (see topbar.js's
  own new "entertainment" NAV_GROUPS group). Owns no data of its own —
  it's a live, read/write aggregation of every item favorited on
  Podcasts/Stories/Entertainment/Playlists (see entertainment-hub-data.js's
  allFavorites()), filterable by which page it came from. Genuinely new,
  standalone page — not a rebuild of entertainment.html ("Media")'s own,
  unrelated Favorites tab, which is completely untouched. All real
  logic/markup/styles are injected at runtime by the shared
  entertainment-hub-ui.js engine (see that file's own header comment);
  this shell only loads the shared scripts and boots the right page.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
<script src="sync.js" defer></script>
<script src="photo-store.js" defer></script>
<script src="topbar.js" defer></script>
<script src="entertainment-hub-data.js?v=3" defer></script>
<script src="entertainment-hub-ui.js?v=3" defer></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.EntHubUI) {
    EntHubUI.initFavoritesPage();
  } else {
    alert('Favorites failed to load — entertainment-hub-ui.js did not load. Try a hard refresh.');
  }
});
</script>
</body>
</html>
