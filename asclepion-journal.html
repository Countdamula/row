<!DOCTYPE html>
<html lang="en" class="asc-root">
<head>
<script src="local-store-idb.js"></script>
<!-- The snapshot layer. Not deferred: the registry must exist before any
     boot() asks Snapshots.forApp() for a store, and the engine asserts the
     store prefix against the registry before it will build one. -->
<script src="data-registry.js?v=1"></script>
<script src="snapshots.js?v=1"></script>
<script src="data-export.js?v=1"></script>
<script src="save-state.js?v=1"></script>
<script src="trash.js?v=1"></script>
<script src="shrink-banner.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0C1416">
<meta name="robots" content="noindex, nofollow">
<title>The Asclepion — Journals</title>

<!-- =============================================================
     THE JOURNALS.

     Its own document because writing is long-form and autosaved,
     and because a page you write on should not also be a page
     with nine other things on it. Same argument that split the
     runner out.

     Routes:
       #/            every entry, newest first
       #/j/<id>      one journal: its purpose, then its entries
       #/e/<id>      one entry, open for writing
       #/new/<id>    a blank entry from that journal's template

     AUTOSAVE, and the two rules it lives by:

     1. Debounced 600ms, so a burst of typing is one write rather
        than forty. Entries are on the `asclog:` row precisely so
        that this does not re-upload the 100KB library each time.
     2. Flushed on blur, on pagehide and on visibilitychange —
        the last of which is the ONLY one iOS reliably fires when
        you switch apps. And navigation goes through
        LocalStoreIDB.navigate, because the IDB shim commits
        asynchronously and leaving in the same tick as a write
        silently loses it.
     ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="asclepion-theme.css?v=2">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<script src="asclepion-seed.js?v=2"></script>
<script src="asclepion-data.js?v=2"></script>
<script src="asclepion-sync.js?v=2"></script>
<script src="asclepion-ui.js?v=2"></script>
<script src="asclepion-hero.js?v=2"></script>
<script src="topbar.js?v=4" defer></script>
</head>
<body class="asc asc--journal">

<div class="asc-sessionbar">
  <a class="asc-btn asc-btn--ghost asc-btn--sm" href="asclepion.html#/journal" id="ascBack">The Asclepion</a>
  <span class="asc-label" id="ascJournalLabel"></span>
  <span class="asc-sessionbar__sp"></span>
  <span class="asc-small" id="ascSaved"></span>
</div>

<main class="asc-shell asc-shell--journal" id="ascRoot" tabindex="-1"></main>

<div class="asc-sheetbg" id="ascSheetBg" role="dialog" aria-modal="true" aria-label="Detail">
  <div class="asc-sheet" id="ascSheet"></div>
</div>
<div class="asc-toast" id="ascToast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var U = window.AscUI;
  var A = null;
  var root = document.getElementById('ascRoot');
  var esc = U.esc, escLines = U.escLines;

  // The entry currently open for writing. Held here rather than
  // read back out of storage on every keystroke.
  var draft = null;
  var saveTimer = null;
  var dirty = false;

  function route() {
    var h = String(location.hash || '').replace(/^#/, '');
    // #/new/<journalId>/<date> — a review carries the date it is
    // ABOUT, so a Tuesday missed and written up on Thursday still
    // files itself under Tuesday.
    var d = h.match(/^\/new\/([^/]+)\/(\d{4}-\d{2}-\d{2})$/);
    if (d) return { kind: 'new', id: d[1], date: d[2] };
    var m = h.match(/^\/(j|e|new)\/(.+)$/);
    if (m) return { kind: m[1], id: m[2] };
    return { kind: 'index', id: '' };
  }

  // The example panel remembers whether you left it open, so it is
  // not in the way on the two-hundredth entry — and is still one
  // click away on the first.
  function bindExample() {
    var d = document.getElementById('ascExample');
    if (!d) return;
    d.addEventListener('toggle', function () { A.uiState('exampleOpen', d.open); });
  }

  // ==========================================================
  // AUTOSAVE
  // ==========================================================
  function markDirty() {
    dirty = true;
    setSaved('Saving...');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
  }
  function flush() {
    clearTimeout(saveTimer);
    if (!dirty || !draft) return;
    // An entry with nothing in it is not saved at all. Otherwise
    // every time you open a template and change your mind you
    // leave a blank behind, and a journal full of blanks is a
    // journal you stop opening.
    if (isBlank(draft) && !A.Entries.get(draft.id)) { dirty = false; setSaved(''); return; }
    var saved = A.saveEntry(draft);
    if (saved) draft.id = saved.id;
    dirty = false;
    setSaved('Saved');

    // THE URL HAS TO STOP SAYING "new".
    //
    // #/new/<journalId> means "build me a blank entry", and render()
    // does exactly that every time it runs. So the first save has to
    // move the address to the entry that now exists — otherwise the
    // next render (a cloud repaint, closing composition mode, a
    // rotation) hands you a fresh blank page while everything you
    // wrote sits safely in storage under an id the screen no longer
    // points at. It looks exactly like losing your work.
    //
    // replaceState, not location.hash: this is a correction to where
    // we already are, not a navigation, and it must not add a history
    // entry or fire hashchange.
    if (route().kind === 'new' && saved) {
      try { history.replaceState(null, '', '#/e/' + saved.id); } catch (e) {}
    }
  }
  function isBlank(e) {
    if (String(e.title || '').trim()) return false;
    return (e.sections || []).every(function (s) {
      return !String(s.body || '').trim() && (s.lines || []).every(function (l) { return !String(l).trim(); });
    });
  }
  function setSaved(text) {
    var el = document.getElementById('ascSaved');
    if (el) el.textContent = text;
  }

  // ==========================================================
  // VIEWS
  // ==========================================================
  function sectionHead(title, aside, lede) {
    return '<div class="asc-section__head">' +
      '<div><h2 class="asc-plate asc-plate--sm">' + esc(title) + '</h2>' +
      (lede ? '<p class="asc-small" style="margin-top:6px">' + esc(lede) + '</p>' : '') + '</div>' +
      (aside ? '<div class="asc-section__aside">' + aside + '</div>' : '') +
      '</div><hr class="asc-rule">';
  }

  function viewIndex() {
    var journals = A.Journals.list();
    var out = '<section class="asc-section asc-section--first" data-tint="journal">' +
      sectionHead('Journals', '', 'Five journals, five different jobs. Pick the job, not the mood.') +
      '<div class="asc-grid asc-grid--3">';
    journals.forEach(function (j, n) {
      var count = A.entriesFor(j.id).length;
      out += '<a class="asc-card asc-card--sm asc-rvl"' + U.stagger(n, 50) + ' data-tint="journal" href="#/j/' + esc(j.id) + '">' +
        '<span class="asc-card__mark asc-card__mark--glyph">' + esc(j.glyph) + '</span>' +
        '<h3 class="asc-card__title">' + esc(j.name) + '</h3>' +
        '<p class="asc-card__note">' + esc(j.purpose) + '</p>' +
        '<span class="asc-card__count">' + (count ? U.plural(count, 'entry', 'entries') : 'Nothing yet') + '</span>' +
        '</a>';
    });
    out += '</div></section>';

    var recent = A.entriesFor('').slice(0, 20);
    out += '<section class="asc-section" data-tint="journal">' +
      sectionHead('Everything written', '', 'Newest first, across all five.');
    out += recent.length ? entryRows(recent) : '<p class="asc-empty">Nothing written yet.</p>';
    return out + '</section>';
  }

  // The article's prose carries § markers, and a journal's
  // `figures` array anchors each diagram to one of them. Splitting
  // on the markers means the images sit where the writing puts
  // them rather than all at the bottom.
  function aboutHtml(j) {
    var parts = String(j.about || '').split(/(?=§\d)/);
    return parts.map(function (chunk) {
      var m = chunk.match(/^§(\d)/);
      var fig = '';
      if (m) {
        (j.figures || []).forEach(function (f) {
          if (f.after !== '§' + m[1]) return;
          fig = '<img class="asc-figure-img" src="' + esc(f.src) + '" alt="" loading="lazy">' +
                (f.caption ? '<p class="asc-figure-cap">' + esc(f.caption) + '</p>' : '');
        });
      }
      return escLines(chunk.replace(/^§\d\s*·?\s*/, m ? '' : '')) + fig;
    }).join('');
  }

  function viewJournal(id) {
    var j = A.Journals.get(id);
    if (!j) return notFound();
    var entries = A.entriesFor(j.id);
    var out = '<section class="asc-section asc-section--first" data-tint="journal">' +
      '<p class="asc-label asc-label--tint">' + esc(j.glyph) + ' &nbsp; ' + esc(j.purpose) + '</p>' +
      '<h1 class="asc-plate asc-plate--lg" style="margin-top:var(--asc-2)">' + esc(j.name) + '</h1>' +
      (j.system === 'hia' ? viewHia() : '') +
      '<div class="asc-about">' + aboutHtml(j) + '</div>' +
      '<div class="asc-panel__foot">' +
        '<a class="asc-btn asc-btn--primary" href="#/new/' + esc(j.id) + '">Start an entry</a>' +
        U.heart('journal', j.id, j.favorite, '', esc(j.name)) +
      '</div>' +
      '</section>';
    out += '<section class="asc-section" data-tint="journal">' + sectionHead('Entries', '');
    out += entries.length ? entryRows(entries) : '<p class="asc-empty">Nothing written in this one yet.</p>';
    return out + '</section>';
  }

  // ==========================================================
  // THE HIGH IMPACT ACTION SYSTEM
  //
  // Rendered above the article, in the article's own order: the
  // goal, then at most three actions, then thirty squares, then
  // the one rule that the whole method turns on.
  // ==========================================================
  function viewHia() {
    var h = A.getHia();
    var grid = A.hiaGrid(30);
    var streak = A.hiaStreak();
    var warn = A.neverSkipTwice();

    var out = '<div class="asc-hia" data-tint="journal">';

    out += '<div class="asc-hia__goal">' +
      '<span class="asc-label asc-label--tint">The goal</span>' +
      '<input type="text" class="asc-hia__goalfield" id="ascHiaGoal" ' +
        'placeholder="Run the Edinburgh Marathon in 2027" value="' + esc(h.goal) + '" ' +
        'aria-label="Your goal">' +
      '</div>';

    out += '<div class="asc-section__head" style="margin-top:var(--asc-5)">' +
      '<div><span class="asc-label asc-label--tint">High Impact Actions</span>' +
      '<p class="asc-small" style="margin-top:6px">Few, within your control, every day, and highly predictive of success. ' +
      (h.actions.length >= 3 ? 'Three is the cap — a fourth makes it a to-do list again.'
                             : 'Aim for no more than three. Start with one.') + '</p></div>' +
      (h.actions.length < 3
        ? '<div class="asc-section__aside"><button type="button" class="asc-btn asc-btn--sm" data-act="hia-add">Add an action</button></div>'
        : '') +
      '</div>';

    out += '<div class="asc-hia__actions">' +
      (h.actions.length ? h.actions.map(function (a, i) {
        return '<div class="asc-hia__action">' +
          '<span class="asc-hia__action-n">' + (i + 1) + '</span>' +
          '<input type="text" class="asc-hia__action-field" data-hia-action="' + esc(a.id) + '" ' +
            'placeholder="Write for one hour" value="' + esc(a.text) + '" ' +
            'aria-label="High Impact Action ' + (i + 1) + '">' +
          '<button type="button" class="asc-btn asc-btn--ghost asc-btn--sm" data-act="hia-remove" ' +
            'data-id="' + esc(a.id) + '" aria-label="Remove this action">Remove</button>' +
        '</div>';
      }).join('') : '<p class="asc-empty" style="padding:var(--asc-3) 0">No actions yet. One is enough to start.</p>') +
      '</div>';

    if (warn) {
      out += '<div class="asc-hia__warn">' +
        '<strong>You missed yesterday.</strong> Never skip twice — skipping two days in a row is what ' +
        'actually breaks a habit, and today is the one that decides it.</div>';
    }

    out += '<div class="asc-section__head" style="margin-top:var(--asc-5)">' +
      '<div><span class="asc-label asc-label--tint">Thirty days</span>' +
      '<p class="asc-small" style="margin-top:6px">One square, one day. Tap once for done, twice for missed. ' +
      (streak ? 'Currently ' + U.plural(streak, 'day') + ' in a row.' : 'Mark today and the streak starts.') +
      '</p></div></div>';

    out += '<div class="asc-hia__grid">' + grid.map(function (d) {
      var cls = 'asc-hia__sq' +
        (d.state === 'done' ? ' is-done' : '') +
        (d.state === 'missed' ? ' is-missed' : '') +
        (d.twice ? ' is-twice' : '') +
        (d.isToday ? ' is-today' : '') +
        (d.isFuture ? ' is-future' : '');
      return '<button type="button" class="' + cls + '"' +
        (d.isFuture ? ' disabled' : ' data-act="hia-mark" data-date="' + d.date + '"') +
        ' aria-label="' + esc(U.dateLabel(d.date)) + (d.state ? ', ' + d.state : '') + '">' +
        (d.state === 'done' ? esc(h.symbol) : d.state === 'missed' ? '·' : '') +
        '</button>';
    }).join('') + '</div>';

    out += '<div class="asc-hia__legend">' +
      '<span>Your symbol</span>' +
      '<span class="asc-hia__syms">' +
        A.HIA_SYMBOLS.map(function (s) {
          return '<button type="button" class="asc-hia__sym' + (s === h.symbol ? ' is-on' : '') +
            '" data-act="hia-symbol" data-sym="' + esc(s) + '" aria-label="Use ' + esc(s) + '">' +
            esc(s) + '</button>';
        }).join('') +
      '</span>' +
      '</div>';

    return out + '</div><hr class="asc-rule">';
  }

  function entryRows(entries) {
    return '<div class="asc-rows">' + entries.map(function (e, n) {
      var j = A.Journals.get(e.journalId);
      var preview = (e.sections || []).map(function (s) {
        return [s.body].concat(s.lines || []).filter(Boolean).join(' ');
      }).filter(Boolean).join(' — ').slice(0, 170);
      return '<a class="asc-row asc-rvl"' + U.stagger(n, 30) + ' data-tint="journal" href="#/e/' + esc(e.id) + '">' +
        '<div class="asc-row__body">' +
          '<p class="asc-row__title">' + esc(e.title || (j ? j.name : 'Entry')) + '</p>' +
          '<p class="asc-row__meta">' +
            '<span class="asc-label">' + esc(U.dateLabel(e.date)) + '</span>' +
            (j ? '<span class="asc-chip asc-chip--quiet">' + esc(j.name) + '</span>' : '') +
          '</p>' +
          (preview ? '<p class="asc-row__note">' + esc(preview) + '</p>' : '') +
        '</div></a>';
    }).join('') + '</div>';
  }

  // ==========================================================
  // THE EXAMPLE ENTRY
  //
  // A worked example, collapsed, at the top of every entry.
  //
  // It is a <details>, which means the open/closed behaviour and
  // its keyboard handling cost no JavaScript at all. The one
  // thing JS does is remember the state, in asc:uiState, so it is
  // not in the way on the two-hundredth entry.
  // ==========================================================
  function exampleHtml() {
    var ex = window.AscSeed && window.AscSeed.exampleEntry;
    if (!ex) return '';
    var open = !!(A.uiState && A.uiState('exampleOpen'));
    return '<details class="asc-example" id="ascExample"' + (open ? ' open' : '') + '>' +
      '<summary>Example entry &mdash; how one of these can read</summary>' +
      '<div class="asc-example__body">' +
        '<p class="asc-example__title">' + esc(ex.title) + '</p>' +
        (ex.note ? '<p class="asc-write__prompt" style="margin-top:calc(-1 * var(--asc-2))">' + esc(ex.note) + '</p>' : '') +
        ex.paragraphs.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div></details>';
  }

  function viewEntry(entry, journal) {
    var out = '<section class="asc-section asc-section--first" data-tint="journal">' +
      exampleHtml() +
      '<div class="asc-section__head">' +
        '<div>' +
          '<p class="asc-label asc-label--tint">' + esc(journal.glyph) + ' &nbsp; ' + esc(journal.name) + '</p>' +
          '<input type="text" class="asc-titlefield" id="ascTitle" placeholder="Untitled" value="' + esc(entry.title) + '">' +
        '</div>' +
        '<div class="asc-section__aside">' +
          '<button type="button" class="asc-btn asc-btn--sm" data-act="compose">Compose</button>' +
          '<input type="date" class="asc-input asc-input--date" id="ascDate" value="' + esc(entry.date) + '" aria-label="Date">' +
        '</div>' +
      '</div><hr class="asc-rule">';

    entry.sections.forEach(function (s, i) {
      var def = (journal.sections || [])[i];
      var prompt = def && def.prompt ? def.prompt : '';
      out += '<div class="asc-write">' +
        '<label class="asc-label" for="sec-' + i + '">' + esc(s.label) + '</label>' +
        (prompt ? '<p class="asc-write__prompt">' + esc(prompt) + '</p>' : '');
      if (s.lines && s.lines.length) {
        // Numbered lines, not one open box. Three is the whole
        // method in the 3/3/3 journal, and an open box quietly
        // lets three become two.
        out += '<ol class="asc-numbered">' + s.lines.map(function (line, n) {
          return '<li><input type="text" class="asc-input asc-linefield" data-sec="' + i + '" data-line="' + n +
            '" value="' + esc(line) + '" aria-label="' + esc(s.label) + ', line ' + (n + 1) + '"></li>';
        }).join('') + '</ol>';
      } else {
        out += '<textarea class="asc-textarea asc-writefield" id="sec-' + i + '" data-sec="' + i +
          '" rows="5">' + esc(s.body) + '</textarea>';
      }
      out += '</div>';
    });

    out += '<div class="asc-panel__foot">' +
      '<button type="button" class="asc-btn asc-btn--primary" data-act="done">Done</button>' +
      U.heart('entry', entry.id, entry.favorite, '', 'this entry') +
      (A.Entries.get(entry.id) ? '<button type="button" class="asc-btn asc-btn--ghost" data-act="delete">Delete</button>' : '') +
      '</div>';
    return out + '</section>';
  }

  function notFound() {
    return '<section class="asc-section asc-section--first">' +
      '<h1 class="asc-plate">That is no longer here.</h1>' +
      '<p class="asc-lede">It may have been deleted on another device.</p>' +
      '<div class="asc-panel__foot"><a class="asc-btn asc-btn--primary" href="#/">All journals</a></div>' +
      '</section>';
  }

  // ==========================================================
  // RENDER
  // ==========================================================
  function render() {
    var r = route();
    var label = document.getElementById('ascJournalLabel');
    var intro = U.introAttrs();
    root.className = 'asc-shell asc-shell--journal' + intro.cls;

    if (r.kind === 'index') {
      draft = null;
      if (label) label.textContent = 'Journals';
      root.innerHTML = viewIndex();
    } else if (r.kind === 'j') {
      draft = null;
      var j = A.Journals.get(r.id);
      if (label) label.textContent = j ? j.name : 'Journals';
      root.innerHTML = viewJournal(r.id);
      if (j && j.system === 'hia') bindHia();
    } else {
      var entry, journal;
      if (r.kind === 'new') {
        journal = A.Journals.get(r.id);
        if (!journal) { root.innerHTML = notFound(); return; }
        entry = A.blankEntry(journal.id);
        entry.id = A.uid('ent');   // minted now so the heart has something to point at
        if (r.date) entry.date = r.date;
        draft = entry;
      } else {
        entry = A.Entries.get(r.id);
        if (!entry) { draft = null; root.innerHTML = notFound(); return; }
        journal = A.Journals.get(entry.journalId);
        if (!journal) { draft = null; root.innerHTML = notFound(); return; }
        draft = entry;
      }
      if (label) label.textContent = journal.name;
      root.innerHTML = viewEntry(draft, journal);
      bindWriting();
      bindExample();
    }
    setSaved(dirty ? 'Saving...' : '');
  }

  function bindWriting() {
    var title = document.getElementById('ascTitle');
    if (title) title.addEventListener('input', function () { draft.title = title.value; markDirty(); });
    var date = document.getElementById('ascDate');
    if (date) date.addEventListener('change', function () {
      if (/^\d{4}-\d{2}-\d{2}$/.test(date.value)) { draft.date = date.value; markDirty(); }
    });
    root.querySelectorAll('.asc-writefield').forEach(function (el) {
      autosize(el);
      el.addEventListener('input', function () {
        draft.sections[Number(el.getAttribute('data-sec'))].body = el.value;
        autosize(el);
        markDirty();
      });
      el.addEventListener('blur', flush);
    });
    root.querySelectorAll('.asc-linefield').forEach(function (el) {
      el.addEventListener('input', function () {
        draft.sections[Number(el.getAttribute('data-sec'))].lines[Number(el.getAttribute('data-line'))] = el.value;
        markDirty();
      });
      el.addEventListener('blur', flush);
      // Enter moves to the next line rather than doing nothing —
      // three numbered boxes want to be typed through, not clicked
      // between.
      el.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var all = Array.prototype.slice.call(root.querySelectorAll('.asc-linefield'));
        var next = all[all.indexOf(el) + 1];
        if (next) next.focus();
        else { flush(); el.blur(); }
      });
    });
  }

  // A textarea that grows with what is in it. A journal you have
  // to scroll inside a 5-row box is a journal you write less in.
  function autosize(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(el.scrollHeight, 120) + 'px';
  }

  function repaint() {
    // Never rebuild the DOM under someone who is writing. The
    // cloud gets its turn at the next navigation.
    if (!U.safeToRepaint()) return;
    if (draft && dirty) return;
    render();
  }

  var ACTIONS = {
    fav: function (el) {
      var kind = el.getAttribute('data-fav-kind'), id = el.getAttribute('data-fav-id');
      if (kind === 'entry' && draft) {
        // An entry you have not saved yet still has to be
        // keepable — flush first so there is a record to flag.
        draft.favorite = !draft.favorite;
        dirty = true;
        flush();
        render();
        return;
      }
      A.toggleFavourite(kind, id, el.getAttribute('data-fav-shelf'));
      render();
    },
    done: function () {
      flush();
      var id = draft && draft.journalId;
      location.hash = id ? '/j/' + id : '/';
    },

    // ------------------------------------------------------
    // COMPOSITION MODE
    //
    // It is handed THE SAME saver this page already uses — not a
    // second one. One write path to Asc.saveEntry means the two
    // surfaces cannot disagree about what you wrote, and closing
    // the overlay cannot overwrite something typed in the page
    // underneath it.
    //
    // The sections array is passed BY REFERENCE, so the overlay's
    // edits land on the live draft as they happen; onClose only
    // has to re-render.
    // ------------------------------------------------------
    compose: function () {
      if (!draft) return;
      var journal = A.Journals.get(draft.journalId);
      flush();
      U.openCompose({
        where: (journal ? journal.name : 'Journal') + ' · ' + U.dateLabel(draft.date),
        sections: draft.sections,
        example: exampleHtml(),
        saver: flush,
        onInput: function () { markDirty(); },
        onClose: function () { flush(); render(); }
      });
    },
    'delete': function () {
      if (!draft) return;
      U.openSheet(
        '<div class="asc-sheet__head"><h2 class="asc-plate asc-plate--sm">Delete this entry?</h2></div>' +
        '<p class="asc-body">This cannot be undone, and it will be gone on your other devices too.</p>' +
        '<div class="asc-panel__foot">' +
          '<button type="button" class="asc-btn" data-act="sheet-close" data-autofocus>Keep it</button>' +
          '<button type="button" class="asc-btn asc-btn--primary" data-act="delete-confirm">Delete</button>' +
        '</div>', { tint: 'journal' });
    },
    'delete-confirm': function () {
      var id = draft && draft.id, back = draft && draft.journalId;
      clearTimeout(saveTimer); dirty = false;
      if (id) A.Entries.remove(id);
      draft = null;
      U.closeSheet();
      U.toast('Entry deleted.');
      location.hash = back ? '/j/' + back : '/';
    },
    // ------------------------------------------------------
    // THE HIGH IMPACT ACTION SYSTEM
    // ------------------------------------------------------
    'hia-add': function () { A.addHiaAction(''); render(); focusLastAction(); },
    'hia-remove': function (el) { A.removeHiaAction(el.getAttribute('data-id')); render(); },
    'hia-symbol': function (el) { A.setHia({ symbol: el.getAttribute('data-sym') }); render(); },

    // done -> missed -> clear. Marking a day MISSED opens the
    // review the article asks for, pre-sectioned with its own two
    // questions — the review is the half that makes the tracker
    // worth keeping, and it is the half everyone skips, so it is
    // offered rather than waited for.
    'hia-mark': function (el) {
      var date = el.getAttribute('data-date');
      var marks = A.cycleDay(date);
      render();
      if (marks[date] !== 'missed') return;
      var j = A.Journals.list().filter(function (x) { return x.system === 'hia'; })[0];
      if (!j) return;
      U.openSheet(
        '<div class="asc-sheet__head">' +
          '<div><p class="asc-label asc-label--tint">' + esc(U.dateLabel(date)) + '</p>' +
          '<h2 class="asc-plate asc-plate--sm">A missed day wants a review</h2></div>' +
        '</div>' +
        '<p class="asc-body">Two questions, and they are the whole reason the tracker is worth ' +
        'keeping. Write them now while you still know the answer.</p>' +
        '<div class="asc-panel__foot">' +
          '<button type="button" class="asc-btn asc-btn--primary" data-act="hia-review" ' +
            'data-date="' + esc(date) + '" data-id="' + esc(j.id) + '" data-autofocus>Write the review</button>' +
          '<button type="button" class="asc-btn asc-btn--ghost" data-act="sheet-close">Not now</button>' +
        '</div>', { tint: 'journal' });
    },
    'hia-review': function (el) {
      U.closeSheet();
      var date = el.getAttribute('data-date');
      // Carried on the hash so the review lands on the day it is
      // about, not on the day it happens to be written.
      location.hash = '/new/' + el.getAttribute('data-id') + '/' + date;
    },

    'sheet-close': function () { U.closeSheet(); }
  };

  function focusLastAction() {
    var all = root.querySelectorAll('[data-hia-action]');
    var last = all[all.length - 1];
    if (last) { try { last.focus({ preventScroll: true }); } catch (e) { last.focus(); } }
  }

  // The goal and the actions are ordinary fields with the page's
  // own debounce behind them — the same markDirty/flush pair the
  // entry editor uses, so there is one save path on this document
  // and not two.
  function bindHia() {
    var goal = document.getElementById('ascHiaGoal');
    if (goal) {
      goal.addEventListener('input', function () { A.setHia({ goal: goal.value }); });
      goal.addEventListener('blur', function () { A.setHia({ goal: goal.value }); });
    }
    Array.prototype.forEach.call(root.querySelectorAll('[data-hia-action]'), function (el) {
      el.addEventListener('input', function () {
        var id = el.getAttribute('data-hia-action');
        var h = A.getHia();
        h.actions.forEach(function (a) { if (a.id === id) a.text = el.value; });
        A.setHia({ actions: h.actions });
      });
    });
  }

  // ==========================================================
  // BOOT
  // ==========================================================
  document.addEventListener('DOMContentLoaded', function () {
    var ready = (window.LocalStoreIDB && window.LocalStoreIDB.ready)
      ? window.LocalStoreIDB.ready() : Promise.resolve();

    ready.then(function () {
      A = window.Asc;
      if (!A) { bootError('The Asclepion', new Error('asclepion-data.js did not load')); return; }
      // Snapshot BEFORE anything else this session does, and pinned: this is
      // the copy that answers "what did this device hold when I opened it",
      // which is the only question worth asking after a bad sync. boot() also
      // installs the shrink watch, so a pull that deletes a collection leaves
      // a pinned copy of the state as it was a moment earlier.
      // Lives under the registry's prefix for 'asclepion', outside every synced
      // prefix — see snapshots.js.
      if (window.Snapshots) { try { window.Snapshots.forApp('asclepion').boot(); } catch (e) { try { console.error('[snapshots]', e); } catch (e2) {} } }

      U.bindSheet();
      U.delegate(root, ACTIONS);
      U.delegate(document.getElementById('ascSheetBg'), ACTIONS);

      // The band hero: the same night garden, at 58vh rather than
      // a full screen, with no card and no chips. Mounted once and
      // outside the render host, for the reason in
      // asclepion-hero.js's ONE INVARIANT — and here that matters
      // twice over, because this document re-renders on every
      // keystroke's debounce.
      if (window.AscHero) {
        window.AscHero.mount({
          before: root,
          variant: 'band',
          tint: 'journal',
          scene: {
            key: 'journal',
            eyebrow: 'The Asclepion',
            lines: ['Somewhere', 'to put it'],
            note: 'Five journals, five different jobs — *resistance, wonder, evidence, the shape of a day,* and the one that finally stops the procrastinating.'
          }
        });
      }

      U.introArrive();
      render();

      window.addEventListener('hashchange', function () { flush(); U.introArrive(); render(); });

      // THE THREE PLACES A DRAFT CAN BE LOST. pagehide covers a
      // navigation; visibilitychange is the only one iOS reliably
      // fires when you switch apps or lock the screen, and is
      // therefore the important one; beforeunload is the desktop
      // belt-and-braces.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') flush();
      });
      window.addEventListener('pagehide', flush);
      window.addEventListener('beforeunload', flush);

      // Leaving by link has to flush AND wait for the IDB shim.
      var back = document.getElementById('ascBack');
      if (back) back.addEventListener('click', function (e) {
        e.preventDefault();
        flush();
        U.go(back.getAttribute('href'));
      });

      A.onChange(function () { repaint(); });

      if (window.AscSync) {
        var state = window.AscSync.mountAndSeed({ onApplied: function () { repaint(); } });
        A.seedAfterSyncAttempt(state.ref, function (seeded) { if (seeded) render(); });
      } else {
        A.seedAfterSyncAttempt(null, function (seeded) { if (seeded) render(); });
      }
    }).catch(function (err) { bootError('The Asclepion', err); });
  });

  function bootError(what, err) {
    try {
      var bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:3200;background:#2A1114;color:#F3D9D9;' +
        'padding:14px 16px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;';
      bar.textContent = what + ' failed to load: ' + (err && err.message ? err.message : err);
      document.body.appendChild(bar);
    } catch (e) {}
  }
})();
</script>
</body>
</html>
