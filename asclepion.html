     Every boot path is then gated on LocalStoreIDB.ready(). -->
<script src="local-store-idb.js"></script>
<!-- The snapshot layer. Not deferred: the registry must exist before any
     boot() asks Snapshots.forApp() for a store, and the engine asserts the

<script src="data-registry.js?v=3"></script>
<script src="snapshots.js?v=1"></script>

<!-- =====================================================================
     THE SAME HOUSE AS THE ENTERTAINMENT STUDIO AND PROMPT STUDIO.

     This page wears HOUSE DAMULA, and it wears it by SHARING the
     stylesheet rather than copying it. vault-theme.css is linked here
     and its .hd-* classes are used verbatim; everything in
     asclepion-theme.css is something the house has no equivalent for —
     this photograph's own crop, the library table, the group pill, the
     description panel, and the practice OVERLAY, which no other page in
     the dashboard has anything like.

     Three studios on one stylesheet cannot drift. The consequence worth
     remembering is the other half of that sentence: AN EDIT TO
     vault-theme.css NOW CHANGES THREE PAGES.

     WHAT THIS REPLACED. Until now the page wore INÉORA: Bodoni Moda, a
     palette measured off this very photograph, a static <header
     class="asc-hero">, a sticky .asc-bar with its two .asc-pop drop
     panels, and a whole .asc-* table vocabulary. All of that is gone.
     The table is re-homed as sc-*, so this page's own layer cannot
     collide with the 24 .asc-* classes vault-theme.css defines — the
     ones asclepion-ui.js emits.

     WHAT DID NOT CHANGE: the photograph, and almost nothing about the
     data. Same asc: and asclog: prefixes, same two rows, same six
     collections, same session log. One genuinely new idea: THE GROUP IS
     A FIELD NOW rather than the collection a record lives in, which is
     what makes it editable at all. See §GROUPS in asclepion-data.js.

     ONE DOCUMENT, AND STILL NO HASH ROUTES. It was three documents
     behind ten routes until 2026-09-01. The pill nav carries places
     that are not routes — Practices scrolls, Settings opens a sheet —
     so topbar.js's Asclepion entry must still carry no `children`: a
     hash in that menu the page does not answer is a link to a blank
     screen.

     TWO ROWS, STILL
       asclepion     -> asc:      the library. Seeded, ~150KB.
       asclepionlog  -> asclog:   the session log. Small, constant.
     The split is about WRITE FREQUENCY. `mainselfcare:` is a different
     orphan again and must stay in main-sync.js forever.

     CORMORANT GARAMOND carries every title: it is the face in
     brand_assets/brand_guidelines/banner & title_text.jpg. INTER carries
     every letterspaced small cap. LINKED, never @import-ed — an @import
     cannot start downloading until the stylesheet has arrived and
     parsed, which puts the two requests in series behind the largest
     text on the page.
     ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault-theme.css?v=6">
<link rel="stylesheet" href="asclepion-theme.css?v=8">
<!-- The page opens on this. Preloaded, because it is the largest paint
     on it. A custom photograph set in Settings is swapped in by script
     once the store is ready; this is the one that ships. -->
<link rel="preload" as="image" href="images_by_admin/asclepion/hero-library.webp" fetchpriority="high">

<!-- Not deferred, and in dependency order: the inline boot script at the
     bottom of <body> runs during parsing, before any deferred script
     would have executed. topbar.js is the one exception because nothing
     here calls into it. -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="asclepion-seed.js?v=3"></script>
<script src="asclepion-data.js?v=6"></script>
<script src="asclepion-sync.js?v=3"></script>
<!-- Generic machinery, shared rather than copied: escaping, the drawn
     marks, the resumable entrance clock, the sheet, the toast. Its own
     header says it best — "Nothing in here knows about the data layer."
     It carries no styles either, which is why vault-theme.css has to
     define every .asc-* class it emits. Both other studios load it. -->
<script src="asclepion-ui.js?v=3"></script>
<script src="asclepion-retire.js?v=1"></script>
<script src="topbar.js?v=6" defer></script>
</head>

<!-- ══ THE TOP BAR ═══════════════════════════════════════════
     A FLOATING PILL, CENTRED, with the wordmark in the middle of the
     links rather than off to one side. It sits ON the hero's
     photograph and takes a frosted ground of its own only once you
     have scrolled off it.

     TWO LINKS, AND NEITHER IS A ROUTE. This studio is one document
     and stays one document: Practices scrolls to the table, Settings
     opens a sheet. Nothing here writes to location.hash, which is why
     topbar.js's entry for this page still has no children.

     The monogram and the wordmark are STATIC MARKUP; only the links
     are painted. A cloud pull that re-created the chrome could not
     replay the page's entrance, and the brand is the one thing that
     must never flicker. -->
<header class="hd-top" id="hdTop">
  <nav class="hd-pill" aria-label="Primary">
    <span class="hd-pill__side" id="hdNavL"></span>

    <a class="hd-brand" href="#" data-act="to-top" aria-label="The Asclepion — the library">
      <span class="hd-mono" aria-hidden="true">
        <svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="1.15"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- An A and an S. The same hand as the vault's interlocked
               H and D and Prompt Studio's P and S: two letters that
               share something rather than standing apart, because at
               34px a gap reads as two marks instead of one. The A's
               right leg IS the stem the S curls off, and the A's
               crossbar runs on into the S's spine — which is the only
               straight line in an S and the only place the two can
               meet without either losing its shape. -->
          <path d="M2.8 30.5 12.4 3.5l9.6 27"/>
          <path d="M6.6 21.4h11.6"/>
          <path d="M18.2 21.4h4.4" opacity=".42"/>
          <path d="M35.6 9.6a6.4 6.4 0 0 0-4.9-2.1c-3.1 0-5.2 1.8-5.2 4.1 0 5.4 10.6 3 10.6 9.2 0 2.9-2.6 4.8-5.9 4.8a7.5 7.5 0 0 1-5.6-2.4"/>
        </svg>
      </span>
      <span class="hd-word">The Asclepion</span>
    </a>

    <span class="hd-pill__side" id="hdNavR"></span>
  </nav>

  <div class="hd-topacts">
    <button type="button" class="hd-iconbtn" id="hdSearchBtn" data-act="find"
      aria-label="Search the library">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <circle cx="8.6" cy="8.6" r="5.6"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
    </button>
    <button type="button" class="hd-burger" id="hdBurger" data-act="menu"

<!-- ══ THE MARKS ═════════════════════════════════════════════
     One drawn vocabulary — circles, arcs and lines at 1.1 stroke —
     in the same register as the vault's shelf sigils and Prompt
     Studio's, and deliberately NOT emoji: emoji in this room would
     undo the whole typographic argument, and they render as tofu in
     headless Chrome besides.

     These are the SIX SEEDED GROUPS. A group is data now, so a group
     you make yourself has no mark of its own and falls back to the
     null one — a ring, and nothing said about it. That is the honest
     answer: inventing a glyph for "Before bed" would be guessing.

     DRAWN ONCE and referenced by <use>. Inlined per row, a hundred
     and fifty rows is a hundred and fifty copies of the same paths.
     The geometry is asclepion-ui.js's own MARKS, moved here so the
     table can reference rather than repeat them. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!-- ripples rising from a still point -->
<g id="sc-breath"><circle cx="12" cy="16.4" r="2"/><path d="M6.6 12.6a7.6 7.6 0 0 1 10.8 0"/><path d="M3.4 8.8a12.1 12.1 0 0 1 17.2 0"/></g>
<!-- the midline, with points on it and beside it -->
<g id="sc-eft"><path d="M12 2.8v18.4"/><circle cx="12" cy="6" r="1.25"/><circle cx="12" cy="10.5" r="1.25"/><circle cx="12" cy="15" r="1.25"/><circle cx="7.2" cy="12.8" r="1.25"/><circle cx="16.8" cy="12.8" r="1.25"/></g>
<!-- a ring with the light turned inward -->
<g id="sc-medit"><circle cx="12" cy="12" r="8.4"/><path d="M15.2 7.4a5.7 5.7 0 1 0 0 9.2 6.6 6.6 0 0 1 0-9.2z" fill="currentColor" stroke="none"/></g>
<!-- a body arched, inside its own circle -->
<g id="sc-yoga"><circle cx="12" cy="12" r="8.4"/><path d="M7 15.2c2.6-4.6 7.4-4.6 10 0"/><circle cx="12" cy="8.6" r="1.3"/></g>
<!-- radiance -->
<g id="sc-energy"><circle cx="12" cy="12" r="3.4"/><path d="M12 1.9v3.4M12 18.7v3.4M1.9 12h3.4M18.7 12h3.4M4.8 4.8l2.4 2.4M16.8 16.8l2.4 2.4M19.2 4.8l-2.4 2.4M7.2 16.8l-2.4 2.4"/></g>
<!-- a mark made by hand: a stroke crossing the ring, not concentric
     with it. The only one of the six that is not symmetrical, because
     it is the only group you write. -->
<g id="sc-mine"><circle cx="12" cy="12" r="8.4"/><path d="M7.6 15.6 16.4 8"/></g>
<!-- the null case: a ring, and nothing said about it -->
<g id="sc-other"><circle cx="12" cy="12" r="7.6"/></g>
<!-- kept -->
<g id="sc-heart"><path d="M12 20.4S3.6 15.2 3.6 9.4A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8.4 2.6c0 5.8-8.4 11-8.4 11z"/></g>
<!-- The house ornament: a four-point star on a hairline. The one
     drawn flourish in any of the three studios, and it marks exactly
     one thing — the middle of the footer. -->
<g id="sg-orn"><path d="M8 1.6 9.1 6.9 14.4 8 9.1 9.1 8 14.4 6.9 9.1 1.6 8 6.9 6.9Z"/></g>
</defs></svg>

<!-- The render host. THE HERO IS INSIDE IT, which reverses the
     decision this page made in 2026-09-01: the hero was static markup
     precisely so a cloud pull could not destroy its entrance. The
     vault solved that problem rather than avoiding it — a repaint
     re-measures the hero for the parallax, it never runs while a field
     is focused or a sheet is open, and AscUI.rvlStyle() hands the
     re-created nodes a NEGATIVE --t so an entrance mid-flight resumes
     instead of replaying. Painting the hero is what lets its words be
     yours rather than mine.

     .hd-main's negative top margin is load-bearing: the pill is
     sticky, so without it the bar takes 90px of FLOW and the page
     opens on a black band above the photograph. -->
<main class="hd-main" id="ascApp" tabindex="-1">
  <section id="ascView" aria-live="polite"></section>
</main>

<footer class="hd-foot" id="ascFoot">
  <p class="hd-foot__left">
    <span>&copy; The Asclepion MMXXV</span>
    <span class="hd-foot__bar" aria-hidden="true"></span>
    <span id="ascFootLine">Nothing here keeps score</span>
  </p>
  <span class="hd-foot__orn" aria-hidden="true">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
      stroke-width="1" stroke-linejoin="round"><use href="#sg-orn"></use></svg>
  </span>
  <nav class="hd-foot__right" aria-label="The studio">
    <button type="button" data-act="settings">Your data</button>
    <button type="button" data-act="settings">Settings</button>
  </nav>
</footer>

<!-- ══ SEARCH ════════════════════════════════════════════════
     A glyph in the pill rather than a field. The references show a
     glyph, and a permanent input in a 90px editorial bar reads as an
     admin panel. It opens over the page, searches live, and Enter
     hands the query to the library — where it becomes a token you can
     see and clear, so a filtered library can never be mistaken for an
     empty one. -->
<div class="hd-find" id="hdFind" role="dialog" aria-modal="true" aria-label="Search the library" hidden>
  <div class="hd-find__box">
    <div class="hd-find__field">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <circle cx="8.6" cy="8.6" r="5.6"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
      <input id="hdFindIn" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search the practices" aria-label="Search the practices">
      <button type="button" class="hd-find__x" data-act="find-close">Esc</button>
    </div>
    <div class="hd-find__out" id="hdFindOut" role="listbox" aria-label="Results"></div>
  </div>
</div>

<!-- §STORAGE HEALTH and §RECALL — static markup outside #ascApp, so no
     repaint can take them away while the condition they report is
     still true. FIXED to the bottom-left, because .hd-main's negative
     margin means anything static above it would sit under the hero and
     never be seen. -->
<div class="sc-notice" id="ascRecall" role="status" hidden></div>

<!-- The sheet and the toast carry the ids asclepion-ui.js addresses
     them by. Reusing the module means reusing its DOM contract; both
     other studios do exactly the same. -->
<div class="asc-sheetbg" id="ascSheetBg"><div class="asc-sheet" id="ascSheet" role="dialog" aria-modal="true"></div></div>
<div class="asc-toast" id="ascToast" role="status" aria-live="polite"></div>

<button class="hd-fab" id="addFab" aria-label="Add a practice">
  <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"></path></svg>
</button>

<!-- THE PRACTICE OVERLAY. One host for three runners; which one is
     inside it is decided at open time. A practice is a MODE the page
     enters, not a place you navigate to. -->
<!-- hd-night IS LOAD-BEARING, not decoration. vault-theme.css defines
     --hd-bg / --hd-fg / --hd-fg-2 / --hd-line ONLY on .hd-night and
     .hd-sepia — body.hd sets a literal --hd-black and defines none of
     them. This div hangs off body, so every one of those tokens was
     out of scope here and `background: var(--hd-bg)` was invalid at
     computed-value time: the overlay fell back to TRANSPARENT and the
     hero, the nav pill and the whole table showed straight through a
     practice. The ground class is how the rest of the page brings the
     set into scope (see the hd-band hd-night bands below). -->
<div class="sc-run hd-night" id="ascRun" role="dialog" aria-modal="true" aria-label="Practice">
  <!-- ONE EXIT, AND IT IS ALWAYS HERE. Everything else you can press
       during a practice — Begin, Next, Skip, Finish — is written into
       #ascRunBody and rebuilt on every phase, so the buttons change
       under you and none of them says stop. This one is outside the
       body, so no runner can take it away.

       It says END SESSION rather than Back because that is what it
       does, and it is a BUTTON rather than the sheet's quiet .asc-back
       link because this is the control you have to find mid-breath
       with your eyes half shut.

       Still at the RIGHT end. topbar.js's launcher is hidden while a
       practice runs (see body.sc-running in asclepion-theme.css), so
       the corner is free — but .sc-run__where is centred directly
       beneath this and the position is the one already learned. -->
  <div class="sc-run__top">
    <button type="button" class="sc-run__end" data-act="run-close">End session</button>
  </div>
  <!-- Outside the body, because the body is rebuilt on every phase. -->
  <p class="asc-label sc-run__where" id="ascRunWhere"></p>
  <div class="sc-run__body" id="ascRunBody"></div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // §UTIL
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function U() { return window.AscUI; }
  var A = null;                     // window.Asc, once the store is ready
  var esc = function (s) { return U().esc(s); };
  var escLines = function (s) { return U().escLines(s); };

  function toast(msg, bad) { U().toast(msg, bad); }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  // ============================================================
  // §STATE
  //
  // Everything except the search term is remembered, because
  // everything except the search term is a preference. A query you
  // left behind yesterday is not a preference, it is a page that
  // looks broken when you open it.
  // ============================================================
  var ui = {
    q: '',
    group: 'group',       // the sort/grouping key
    cat: 'all',           // which group is being shown
    when: 'all',          // which "for when" is being shown
    max: 0,               // "under n minutes", 0 = any
    favOnly: false,
    shut: [],             // group ids whose section is folded shut
    /* A list of what is CLOSED, not of what is open. Deciding one
       description is too long to sit open IS a preference; deciding it
       again on every visit is not. */
    shutDesc: []
  };

  function loadUi() {
    var s = A.uiState('table');
    if (!s || typeof s !== 'object') return;
    if (GROUPINGS[s.group]) ui.group = s.group;
    if (typeof s.cat === 'string') ui.cat = s.cat;
    if (typeof s.when === 'string') ui.when = s.when;
    ui.max = Number(s.max) || 0;
    ui.favOnly = s.favOnly === true;
    ui.shut = Array.isArray(s.shut) ? s.shut : [];
    ui.shutDesc = Array.isArray(s.shutDesc) ? s.shutDesc : [];
  }
  function saveUi() {
    A.uiState('table', {
      group: ui.group, cat: ui.cat, when: ui.when, max: ui.max,
      favOnly: ui.favOnly, shut: ui.shut, shutDesc: ui.shutDesc
    });
  }
  function toggleIn(list, v) {
    var i = list.indexOf(v);
    if (i === -1) list.push(v); else list.splice(i, 1);
    return list;
  }

  // ============================================================
  // §FORMATTERS
  // ============================================================
  function daysAgo(iso) {
    if (!iso) return Infinity;
    var p = iso.split('-');
    var then = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((now - then) / 86400000);
  }
  /* "Last done" is a DATE, never a streak and never a count. A page
     you open on a bad day must not be able to tell you how many days
     you have missed. */
  function lastDoneWord(iso) {
    if (!iso) return '';
    var d = daysAgo(iso);
    if (d <= 0) return 'Today';
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + ' days ago';
    if (d < 14) return 'Last week';
    if (d < 62) return Math.round(d / 7) + ' weeks ago';
    return U().dateLabel(iso);
  }
  /* Minutes, unless the thing is genuinely shorter than a couple of
     minutes — then m:ss, because five breathing techniques all reading
     "1 min" is a column that has stopped saying anything. */
  function lengthWord(a) {
    if (a.seconds && a.seconds < 150) return U().clock(a.seconds);
    return a.minutes ? U().mins(a.minutes) : '';
  }

  // ============================================================
  // §THE MARKS
  //
  // Keyed by group id, and the list of ids is CHECKED rather than
  // assumed: a <use> pointing at an id that is not in the document
  // renders as nothing at all, which is a blank gutter rather than a
  // visible error. A group you made yourself falls back to the null
  // mark, which is the honest answer.
  // ============================================================
  var MARK_IDS = { breath: 1, eft: 1, medit: 1, yoga: 1, energy: 1, mine: 1, other: 1 };
  function scMark(groupId) {
    var id = MARK_IDS[groupId] ? groupId : 'other';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<use href="#sc-' + id + '"></use></svg>';
  }
  function hueOf(groupId) { return A.groupById(groupId).hue; }
  function groupLabel(groupId) { return A.groupById(groupId).label; }

  // ============================================================
  // §THE FILTER
  // ============================================================
  function isFiltering() {
    return !!ui.q.trim() || ui.cat !== 'all' || ui.when !== 'all' || !!ui.max || ui.favOnly;
  }

  function visible() {
    var q = ui.q.trim().toLowerCase();
    return A.activities().filter(function (a) {
      if (ui.favOnly && !a.favorite) return false;
      if (ui.cat !== 'all' && a.group !== ui.cat) return false;
      if (ui.when !== 'all' && (a.forWhen || '').toLowerCase() !== ui.when) return false;
      /* "under n minutes" must not hide the things with no stated
         length — a breathing technique with no duration is the most
         likely answer to "I have five minutes", not the least. */
      if (ui.max && a.minutes && a.minutes > ui.max) return false;
      if (q) {
        /* The description is in the haystack because it is on the
           page. A word you can see in a row and cannot search for
           reads as a broken search box. */
        var hay = (a.title + ' ' + a.forWhen + ' ' + a.summary + ' ' +
          groupLabel(a.group)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  /* Five ways to shape one table, and four of them are orders rather
     than groupings. "Group" is the browse order and the only one that
     groups. */
  var GROUPINGS = {
    group:  { label: 'Group',           group: true },
    done:   { label: 'Most done',       group: false },
    recent: { label: 'Recently done',   group: false },
    az:     { label: 'Name',            group: false },
    len:    { label: 'Shortest first',  group: false }
  };
  function grouped() { return GROUPINGS[ui.group].group; }

  function byName(a, b) { return String(a.title || '').localeCompare(String(b.title || '')); }
  function sortRecords(list) {
    var out = list.slice();
    if (ui.group === 'done') {
      out.sort(function (a, b) { return (b.timesDone || 0) - (a.timesDone || 0) || byName(a, b); });
    } else if (ui.group === 'recent') {
      out.sort(function (a, b) {
        return String(b.lastDoneISO || '').localeCompare(String(a.lastDoneISO || '')) || byName(a, b);
      });
    } else if (ui.group === 'len') {
      /* No stated length sorts LAST, not first. A zero here means "as
         long as it takes", and putting the unmeasured things at the top
         of "shortest first" is the column lying. */
      out.sort(function (a, b) {
        var x = mins(a), y = mins(b);
        return x - y || byName(a, b);
      });
    } else {
      out.sort(byName);
    }
    return out;
    function mins(r) {
      if (r.seconds) return r.seconds / 60;
      return r.minutes || 1e6;
    }
  }

  /* Grouped by group, in the order the groups themselves are in —
     which is a stored order now, drag-reorderable in Settings. A group
     with nothing in it is not drawn. */
  function groupRows(rows) {
    var by = {};
    rows.forEach(function (a) { (by[a.group] = by[a.group] || []).push(a); });
    var out = [];
    A.groups().forEach(function (g) {
      if (!by[g.id]) return;
      out.push({ key: g.id, label: g.label, hue: g.hue, rows: sortRecords(by[g.id]) });
      delete by[g.id];
    });
    /* Anything pointing at a group that is not here — deleted on
       another device this one has not heard from yet — still gets
       drawn, under the catch-all's name, rather than vanishing. */
    Object.keys(by).forEach(function (k) {
      var g = A.groupById(k);
      out.push({ key: k, label: g.label, hue: g.hue, rows: sortRecords(by[k]) });
    });
    return out;
  }

  /* Counts describe what choosing a group WOULD give, so they honour
     the search term and the other filters but not the group already
     chosen. */
  function groupCounts() {
    var q = ui.q.trim().toLowerCase(), counts = {};
    A.activities().forEach(function (a) {
      if (ui.favOnly && !a.favorite) return;
      if (ui.when !== 'all' && (a.forWhen || '').toLowerCase() !== ui.when) return;
      if (ui.max && a.minutes && a.minutes > ui.max) return;
      if (q) {
        var hay = (a.title + ' ' + a.forWhen + ' ' + a.summary + ' ' +
          groupLabel(a.group)).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      counts[a.group] = (counts[a.group] || 0) + 1;
    });
    return counts;
  }

  // ============================================================
  // §THE TABLE
  // ============================================================

  /* Kept. The drawn heart, on this page's own control class —
     AscUI.heart() emits .asc-heart, which vault-theme.css does not
     define, so the box is built here. The data attributes are the
     ones the delegated `fav` action reads. */
  function heartBtn(a) {
    return '<button type="button" class="sc-heart' + (a.favorite ? ' is-on' : '') + '"' +
      ' data-act="fav" data-fav-kind="' + esc(a.kind) + '" data-fav-id="' + esc(a.id) + '"' +
      ' data-fav-shelf="' + esc(a.shelf) + '"' +
      ' aria-pressed="' + (a.favorite ? 'true' : 'false') + '"' +
      ' aria-label="' + esc((a.favorite ? 'Remove ' : 'Keep ') + a.title) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<use href="#sc-heart"></use></svg></button>';
  }

  function rowKey(a) { return a.kind + ':' + a.id; }
  function isDescShut(a) { return ui.shutDesc.indexOf(rowKey(a)) !== -1; }
  /* A key carries a colon. Legal in an id, awkward in every selector
     that might later be pointed at one, so it is spent here. */
  function peekId(a) { return 'scPeek-' + rowKey(a).replace(/[^A-Za-z0-9_-]/g, '-'); }

  /* THE CHEVRON THAT OPENS A DESCRIPTION UNDER ITS OWN ROW. .sc-ico,
     the same box as the link beside it, because that class already
     resets the browser's chrome — a bare <button> in this table
     renders as a white slab. aria-controls ties the disclosure to the
     thing it discloses, so a screen reader hears them as one control
     and not two siblings. */
  function peekBtn(a, open) {
    return '<button type="button" class="sc-ico sc-peek__t" data-act="peek"' +
      ' data-key="' + esc(rowKey(a)) + '" data-peek-name="' + esc(a.title) + '"' +
      ' aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="' + esc(peekId(a)) + '"' +
      ' aria-label="' + esc((open ? 'Hide' : 'Show') + ' what ' + a.title + ' is') +
      '">&#9662;</button>';
  }

  /* A SIBLING of the row, never a child. .sc-row is a six-column grid
     on a desktop and a named-area one on a phone, so a panel inside it
     would have to be placed in BOTH — and would sit inside the row's
     own hover surface while it was at it. */
  function peekPanel(a, open) {
    return '<div class="sc-peek" id="' + esc(peekId(a)) + '"' + (open ? '' : ' hidden') +
      ' role="row" style="--sc-tint:' + hueOf(a.group) + '">' +
      '<div class="sc-peek__body" role="cell">' + escLines(a.summary) + '</div>' +
      /* THE CLAMP RELEASE, always in the markup and never gated on a
         character count: whether a description is "long" is a question
         about rendered height at the current font size. .sc-peek__more
         is revealed by the clamp itself, so on a short one it simply
         never shows. */
      '<div class="sc-peek__more" role="cell">' +
        '<button type="button" class="sc-more" data-act="full" data-key="' + esc(rowKey(a)) + '"' +
          ' aria-expanded="false">Show all</button>' +
      '</div>' +
    '</div>';
  }

  /* ── §THE GROUP PILL ────────────────────────────────────────
     A fully rounded capsule, a vertical gradient in its own hue,
     near-black text, and a soft glow of the same hue under it.

     ONE BUILDER, THREE PLACES — the row's Group cell, the group bar,
     and a practice's own sheet. All three read --sc-tint, so
     recolouring a group is one write and every surface follows.

     It is a BUTTON on a row (pressing it filters the library to that
     group) and a plain span in the bar, where the bar itself is
     already the control. A button inside a button is not valid HTML
     and the browser's repair of it is not something to rely on. */
  function groupPill(groupId, asButton) {
    var g = A.groupById(groupId);
    var inner = '<span class="sc-pill__dot" aria-hidden="true"></span>' + esc(g.label);
    if (!asButton) {
      return '<span class="sc-pill" style="--sc-tint:' + g.hue + '">' + inner + '</span>';
    }
    return '<button type="button" class="sc-pill sc-pill--btn" style="--sc-tint:' + g.hue + '"' +
      ' data-act="only" data-group="' + esc(g.id) + '"' +
      ' title="Show only ' + esc(g.label) + '">' + inner + '</button>';
  }

  /* SIX COLUMNS. The name with its description under it, the group,
     what state it is for, how long and when it was last done, the
     verb, and whether it is kept. */
  var COLS = ['Practice', 'Group', 'For when', 'Length'];
  function colsRow() {
    return '<div class="sc-thead" role="row">' +
      COLS.map(function (c) {
        return '<span class="asc-label" role="columnheader">' + esc(c) + '</span>';
      }).join('') +
      '<span class="asc-label" role="columnheader"><span class="hd-sr">Actions</span></span>' +
      '<span class="asc-label" role="columnheader"><span class="hd-sr">Kept</span></span>' +
    '</div>';
  }

  /* ONE PRACTICE IS ONE BLOCK. The row and its description are
     SIBLINGS inside .sc-item, never nested — see peekPanel(). The
     wrapper carries the border, the tint edge and the hover; the grid
     inside it is untouched.

     THE NAME IS A BUTTON, and the verb, the link and the heart are its
     SIBLINGS, never inside it. */
  function row(a, i) {
    var open = !isDescShut(a) && !!a.summary;
    var last = lastDoneWord(a.lastDoneISO);
    var len = lengthWord(a);
    var meta = [len, last].filter(Boolean).join(' · ');
    return '<div class="sc-item' + (a.summary ? '' : ' sc-item--flat') +
      (open ? ' is-open' : '') + ' ' + U().rvlClass() + '"' +
      U().rvlStyle(i) + ' style="--sc-tint:' + hueOf(a.group) + '">' +
      '<div class="sc-row" role="row">' +
        '<button type="button" class="sc-row__name" role="cell" data-act="open"' +
          ' data-kind="' + esc(a.kind) + '" data-id="' + esc(a.id) + '" data-shelf="' + esc(a.shelf) + '">' +
          '<span class="sc-row__mark" aria-hidden="true">' + scMark(a.group) + '</span>' +
          '<span class="sc-row__text">' +
            '<span class="sc-row__title">' + esc(a.title) + '</span>' +
            /* THE SAME SENTENCE, CLAMPED. The panel below is this line
               RELEASED, not a second copy of it: .sc-item.is-open hides
               this one, so a practice never prints its description
               twice. Clamped in CSS rather than cut here, because a
               string cut at n characters cuts in a different place at
               every font size and this root size is fluid. */
            (a.summary ? '<span class="sc-row__desc">' + esc(a.summary) + '</span>' : '') +
          '</span>' +
        '</button>' +
        '<div class="sc-row__meta">' +
          '<span class="sc-cell sc-cell--pill" role="cell">' + groupPill(a.group, true) + '</span>' +
          '<span class="sc-cell ' + (a.forWhen ? '' : 'sc-cell--never') + '" role="cell">' +
            esc(a.forWhen) + '</span>' +
          '<span class="sc-cell ' + (meta ? 'sc-cell--num' : 'sc-cell--never') + '" role="cell">' +
            esc(meta) + '</span>' +
        '</div>' +
        '<span class="sc-row__do" role="cell">' +
          '<button type="button" class="sc-start" data-act="start"' +
            ' data-kind="' + esc(a.kind) + '" data-id="' + esc(a.id) + '"' +
            ' data-shelf="' + esc(a.shelf) + '">Start session</button>' +
          (a.url
            ? '<a class="sc-ico" href="' + esc(a.url) + '" target="_blank"' +
              ' rel="noopener noreferrer" data-act="row-open"' +
              ' data-kind="' + esc(a.kind) + '" data-id="' + esc(a.id) + '" data-shelf="' + esc(a.shelf) + '"' +
              ' title="Open the link" aria-label="Open ' + esc(a.title) + ' in a new tab">&#8599;</a>'
            : '') +
          (a.summary ? peekBtn(a, open) : '') +
        '</span>' +
        '<span class="sc-row__kept" role="cell">' + heartBtn(a) + '</span>' +
      '</div>' +
      (a.summary ? peekPanel(a, open) : '') +
    '</div>';
  }

  function tableHTML(rows) {
    var out = colsRow(), n = 0;
    if (!grouped()) {
      out += '<div class="sc-group__body">' +
        sortRecords(rows).map(function (r) { return row(r, n++); }).join('') + '</div>';
      return out;
    }

    /* THE GROUP BAR: a chevron, the word, the PILL, the count, and
       what share of the library this group is. The share is the part
       worth having — "twelve practices" means nothing until you know
       whether that is most of the library or a corner of it.

       It also carries a ⋯: renaming, recolouring and deleting a group
       belong where you are looking AT the group, not three clicks away
       in Settings. A SIBLING of the fold button, never inside it. */
    var total = rows.length || 1;
    groupRows(rows).forEach(function (b) {
      var shut = ui.shut.indexOf(b.key) !== -1;
      var share = Math.round((b.rows.length / total) * 100);
      out += '<section class="sc-group' + (shut ? ' is-shut' : '') +
        '" style="--sc-tint:' + b.hue + '">' +
        '<div class="sc-group__bar">' +
          '<button type="button" class="sc-group__head" data-act="fold" data-key="' + esc(b.key) + '"' +
            ' aria-expanded="' + (shut ? 'false' : 'true') + '">' +
            '<span class="sc-group__fold" aria-hidden="true">&#9662;</span>' +
            '<span class="sc-group__label">Group</span>' +
            groupPill(b.key, false) +
            '<span class="sc-group__count">' + esc(plural(b.rows.length, 'practice')) + '</span>' +
            '<span class="sc-group__share" aria-hidden="true"><i style="--w:' + share + '%"></i></span>' +
            '<span class="sc-group__pct">' + share + '%</span>' +
          '</button>' +
          '<button type="button" class="sc-ico sc-group__edit" data-act="groupmenu"' +
            ' data-group="' + esc(b.key) + '"' +
            ' aria-label="Edit the group ' + esc(b.label) + '">&#8943;</button>' +
        '</div>' +
        '<div class="sc-group__body">' +
          b.rows.map(function (r) { return row(r, n++); }).join('') +
        '</div>' +
      '</section>';
    });
    return out;
  }

  function emptyState() {
    if (isFiltering()) {
      return '<div class="sc-empty"><strong>Nothing matches that.</strong>' +
        'Widen the filter, or clear it and start from the whole list.' +
        '<div class="asc-sheet__acts">' +
          '<button type="button" class="asc-btn asc-btn--primary" data-act="clear">Clear the filter</button>' +
        '</div></div>';
    }
    return '<div class="sc-empty"><strong>The library has not arrived yet.</strong>' +
      'Give it a moment. If it stays empty, the cloud has not answered and this device has nothing stored.</div>';
  }

  // ============================================================
  // §THE UTILITY LINE
  //
  // Everything the old sticky toolbar did, at the weight of a
  // caption. A FILTERED LIBRARY MUST NEVER BE ABLE TO LOOK LIKE AN
  // EMPTY ONE, so the query is a token you can see and clear rather
  // than a field somewhere off the top of the page.
  // ============================================================
  var LENGTHS = [
    { key: 5,  label: 'Five minutes or less' },
    { key: 15, label: 'A quarter of an hour' },
    { key: 30, label: 'Half an hour' }
  ];

  function utilLine(n) {
    var counts = groupCounts();
    function opt(v, label, cur, count) {
      return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' +
        esc(label) + (count == null ? '' : ' (' + count + ')') + '</option>';
    }

    return '<div class="hd-util">' +
      '<span class="hd-util__n">' + esc(plural(n, 'practice')) + '</span>' +
      (ui.q.trim()
        ? '<button type="button" class="hd-token" data-act="clearq">&ldquo;' + esc(ui.q.trim()) +
          '&rdquo; <i aria-hidden="true">&times;</i></button>'
        : '') +
      '<span class="hd-util__sp"></span>' +

      '<button type="button" class="hd-util__b' + (ui.favOnly ? ' is-on' : '') + '"' +
        ' data-act="ffav" aria-pressed="' + ui.favOnly + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<use href="#sc-heart"></use></svg> Kept</button>' +

      '<label class="hd-util__sel"><span class="hd-sr">Group</span>' +
        '<select data-fgroup="1">' +
          opt('all', 'Every group', ui.cat) +
          A.groups().filter(function (g) { return counts[g.id] || ui.cat === g.id; })
            .map(function (g) { return opt(g.id, g.label, ui.cat, counts[g.id] || 0); }).join('') +
        '</select></label>' +

      '<label class="hd-util__sel"><span class="hd-sr">For when</span>' +
        '<select data-fwhen="1">' +
          opt('all', 'Any time', ui.when) +
          A.getHouse().whenList.map(function (v) {
            return opt(v.toLowerCase(), v, ui.when);
          }).join('') +
        '</select></label>' +

      '<label class="hd-util__sel"><span class="hd-sr">How long you have</span>' +
        '<select data-fmax="1">' +
          opt('0', 'Any length', ui.max) +
          LENGTHS.map(function (l) { return opt(l.key, l.label, ui.max); }).join('') +
        '</select></label>' +

      '<label class="hd-util__sel"><span class="hd-sr">Sort</span>' +
        '<select data-setgroup="1">' +
          Object.keys(GROUPINGS).map(function (k) {
            return opt(k, GROUPINGS[k].label, ui.group);
          }).join('') +
        '</select></label>' +

      '<button type="button" class="hd-util__b" data-act="surprise">Surprise me</button>' +
    '</div>';
  }

  // ============================================================
  // §THE HERO
  //
  // ONE component, full-bleed, with the pill floating on it. Its
  // anatomy is the vault's, which was read frame by frame off a
  // reference film:
  //
  //     ┌───────────────────────────────────────────────┐
  //     │              ( floating pill nav )            │
  //     │  HEADLINE                        ┌──────────┐ │
  //     │                                  │ RIGHT NOW│ │
  //     │  the copy                        ( chips )    │
  //     └───────────────────────────────────────────────┘
  //
  // FULL-BLEED, AND NO BOUNDARIES. The plate runs to all four edges
  // of the display, so there is no edge to see; only the bottom
  // fades, into the band beneath.
  //
  // EVERY WORD ON IT IS YOURS. The eyebrow, the headline and the
  // line under it are asc:house, edited from Settings. They default
  // to the words that were typed into the markup before this, so a
  // first load after this ships looks exactly like the load before.
  // ============================================================
  function pageHero() {
    var h = A.getHouse();
    return '<header class="hd-phero" data-parallax>' +
      '<div class="hd-phero__art" aria-hidden="true">' +
        '<img class="hd-phero__img" src="' + esc(h.heroUrl) + '" alt="" ' +
          'width="736" height="1308" fetchpriority="high" decoding="async">' +
        '<span class="hd-phero__glow"></span>' +
        '<span class="hd-phero__veil"></span>' +
      '</div>' +

      '<div class="hd-phero__in">' +
        '<div class="hd-phero__say">' +
          '<p class="hd-phero__e">' + esc(h.eyebrow) + '</p>' +
          '<h1 class="hd-phero__t">' + esc(h.title) + '</h1>' +
        '</div>' +

        rightNowCard() +
        '<p class="hd-phero__c">' + esc(h.caption) + '</p>' +
        /* A full-viewport hero hides the whole page, so it has to say
           there is one. The chips are the real way in; this is the
           acknowledgement that the picture is not the end. */
        '<span class="hd-phero__scroll" aria-hidden="true"><i></i>Scroll</span>' +
        heroChips() +
      '</div>' +
      '<span class="hd-phero__rule" aria-hidden="true"></span>' +
    '</header>';
  }

  /* THE FLOATING CARD IS "RIGHT NOW" — one thing you could do, rather
     than a library to browse. It is stable through the day, for the
     same reason the old daily affirmation was: a suggestion that
     changes every time you glance at it is a suggestion you never
     take. "Something else" re-rolls it deliberately, and is a SIBLING
     of the card rather than inside it.

     The vault fills this slot with cover art so every page opens on
     something real out of the collection; a practice has no cover, so
     it gets its group's drawn mark on the tint and the card's geometry
     is unchanged. */
  function rightNowCard() {
    var pick = A.menu(1)[0];
    if (!pick) return '';
    var bits = [groupLabel(pick.group)];
    if (lengthWord(pick)) bits.push(lengthWord(pick));
    return '<div class="sc-hcard-wrap">' +
      '<button type="button" class="hd-hcard" style="--sc-tint:' + hueOf(pick.group) + '"' +
        ' data-act="start" data-kind="' + esc(pick.kind) + '" data-id="' + esc(pick.id) + '"' +
        ' data-shelf="' + esc(pick.shelf) + '">' +
        '<span class="hd-hcard__art">' +
          '<span class="hd-hcard__none">' + scMark(pick.group) + '</span>' +
        '</span>' +
        '<span class="hd-hcard__in">' +
          '<span class="hd-hcard__e">Right now &middot; ' + esc(bits.join(' · ')) + '</span>' +
          '<span class="hd-hcard__t">' + esc(pick.title) + '</span>' +
          '<span class="hd-hcard__go">Start it &#8594;</span>' +
        '</span>' +
      '</button>' +
      '<button type="button" class="sc-reroll" data-act="reroll">Something else</button>' +
    '</div>';
  }

  /* THE CHIPS are the groups with something in them, biggest first.
     The vault's are its shelves, and they do the one thing a
     full-viewport hero owes the reader: a way into the library that
     does not require scrolling past the picture first.

     Six, capped, because .hd-chips is sized to break 3/3 — a seventh
     leaves a hole under the first row. */
  function heroChips() {
    var counts = groupCounts();
    var gs = A.groups().filter(function (g) { return counts[g.id]; })
      .sort(function (a, b) { return counts[b.id] - counts[a.id] || a.label.localeCompare(b.label); })
      .slice(0, 6);
    if (!gs.length) return '';
    return '<nav class="hd-chips" aria-label="Groups">' +
      gs.map(function (g) {
        return '<button type="button" class="hd-chip2" data-act="only" data-group="' + esc(g.id) + '"' +
          ' style="--sc-tint:' + g.hue + '">' +
          '<span class="sc-chip__mark" aria-hidden="true">' + scMark(g.id) + '</span>' +
          esc(g.label) + '<i>' + counts[g.id] + '</i></button>';
      }).join('') +
    '</nav>';
  }

  // ============================================================
  // §SEARCH
  //
  // A glyph in the pill, and an overlay over the page. Enter hands
  // the query to the library, where it becomes a token.
  // ============================================================
  function openFind() {
    var box = $('hdFind');
    box.hidden = false;
    requestAnimationFrame(function () { box.classList.add('is-on'); });
    document.body.classList.add('asc-locked');
    $('hdFindIn').value = ui.q;
    $('hdFindIn').focus();
    paintFind(ui.q);
  }
  function closeFind() {
    var box = $('hdFind');
    box.classList.remove('is-on');
    box.hidden = true;
    document.body.classList.remove('asc-locked');
  }
  function paintFind(q) {
    var out = $('hdFindOut');
    var term = String(q || '').trim().toLowerCase();
    if (!term) {
      out.innerHTML = '<p class="hd-find__hint">Type to search every practice in the studio.</p>';
      return;
    }
    var hits = A.activities().filter(function (a) {
      return (a.title + ' ' + a.forWhen + ' ' + a.summary + ' ' + groupLabel(a.group))
        .toLowerCase().indexOf(term) !== -1;
    }).slice(0, 12);
    if (!hits.length) {
      out.innerHTML = '<p class="hd-find__hint">Nothing by that name.</p>';
      return;
    }
    out.innerHTML = '<p class="hd-find__n">' + esc(plural(hits.length, 'practice')) + '</p>' +
      hits.map(function (a) {
        return '<button type="button" class="hd-find__row" role="option" data-act="find-go"' +
          ' data-kind="' + esc(a.kind) + '" data-id="' + esc(a.id) + '"' +
          ' data-shelf="' + esc(a.shelf) + '" style="--sc-tint:' + hueOf(a.group) + '">' +
          '<span class="sc-find__mark" aria-hidden="true">' + scMark(a.group) + '</span>' +
          '<span><b>' + esc(a.title) + '</b>' +
            '<i>' + esc(groupLabel(a.group)) +
              (lengthWord(a) ? ' · ' + esc(lengthWord(a)) : '') + '</i></span>' +
        '</button>';
      }).join('');
  }

  // ============================================================
  // §RENDER
  //
  // THE SCROLL POSITION IS NOT TOUCHED HERE. Scrolling to the top
  // belongs to navigation, and this page has none — every render is
  // a filter change or a cloud pull, and both of those happen while
  // you are reading something further down.
  //
  //   render()       the hero and the library
  //   renderList()   just the list — what a filter change costs
  // ============================================================
  function libraryHTML() {
    var rows = visible();
    return '<div class="hd-band hd-night">' +
      utilLine(rows.length) +
      (rows.length ? '<div class="sc-table" role="table" aria-label="Self-care practices">' +
        tableHTML(rows) + '</div>' : emptyState()) +
    '</div>';
  }

  function render() {
    var view = $('ascView');
    view.innerHTML = pageHero() + libraryHTML();
    paintNav();
    paintFoot();
    /* A repaint re-creates the hero, so the parallax has to be told
       where the new one is and how tall it is — the scroll event that
       would otherwise do it is not going to fire on its own. */
    if (readScroll) readScroll(true);
    markClamped();
  }

  /* Repaints the library WITHOUT touching the hero. Folding a group or
     changing a filter is not a navigation, and re-creating the hero
     would restart its entrance and re-measure for nothing. */
  function renderList() {
    var host = $('ascView').querySelector('.hd-band');
    if (!host) { render(); return; }
    host.outerHTML = libraryHTML();
    if (readScroll) readScroll(true);
    markClamped();
  }

  function paintFoot() {
    var el = $('ascFootLine');
    if (el) el.textContent = A.getHouse().footLine;
  }

  /* THE PILL'S LINKS. Neither is a route: Practices scrolls to the
     library and Settings opens a sheet. Painted as two halves either
     side of the wordmark by the same ceil(n/2) split the vault uses. */
  var NAV = [
    { act: 'to-list', label: 'Practices' },
    { act: 'settings', label: 'Settings' }
  ];
  function paintNav() {
    /* AN ANCHOR, not a button: vault-theme.css styles `.hd-pill a` and
       a <button> in that slot arrives unstyled. Neither is a route —
       AscUI.delegate() preventDefaults anything carrying a data-act,
       so the href never navigates. */
    var link = function (n) {
      return '<a href="#" data-act="' + n.act + '">' + esc(n.label) + '</a>';
    };
    var half = Math.ceil(NAV.length / 2);
    var l = $('hdNavL'), r = $('hdNavR');
    if (l) l.innerHTML = NAV.slice(0, half).map(link).join('');
    if (r) r.innerHTML = NAV.slice(half).map(link).join('');
  }

  /* WHICH DESCRIPTIONS ARE ACTUALLY LONG. The clamp itself is CSS,
     because whether a description is long is a question about rendered
     height at the current font size and this page's type is fluid.
     What CSS cannot do is notice that the text overflowed, so the
     "Show all" is revealed from here.

     READ EVERY HEIGHT FIRST, THEN WRITE EVERY CLASS. Interleaving them
     is a forced reflow per row; batched, the whole pass costs one
     layout. A hidden panel has no layout at all, so a closed one is
     skipped rather than measured as short — it gets measured when it
     opens. */
  function markClamped(root) {
    var host = root || $('ascView');
    if (!host) return;
    var panels = host.querySelectorAll('.sc-peek:not([hidden])');
    if (!panels.length) return;
    var reads = [];
    Array.prototype.forEach.call(panels, function (panel) {
      var body = panel.querySelector('.sc-peek__body');
      // is-full removes the max-height, so a released description
      // would always measure as "not overflowing" and lose its control.
      if (!body || panel.classList.contains('is-full')) return;
      reads.push([panel, body.scrollHeight - body.clientHeight > 2]);
    });
    reads.forEach(function (r) { r[0].classList.toggle('is-long', r[1]); });
  }

  /* FLIPPED IN PLACE, not repainted. Every row carries an entrance
     stagger, so re-rendering the list to close one description would
     make the whole library flicker through its reveal again. The
     repaint is the fallback for the case where the row has gone. */
  function togglePeek(key) {
    var i = ui.shutDesc.indexOf(key), open = i !== -1;   // it was shut, so this OPENS it
    if (open) ui.shutDesc.splice(i, 1); else ui.shutDesc.push(key);
    saveUi();
    var btn = $('ascView').querySelector('[data-act="peek"][data-key="' + key + '"]');
    var panel = btn ? btn.closest('.sc-item').querySelector('.sc-peek') : null;
    if (!panel || !btn) { renderList(); return; }
    panel.hidden = !open;
    // The row's clamped copy of the same sentence goes with it — see row().
    panel.parentNode.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label',
      (open ? 'Hide' : 'Show') + ' what ' + (btn.getAttribute('data-peek-name') || 'this') + ' is');
    // It had no layout while it was hidden, so it could not be
    // measured at the last paint. Measure it now that it has one.
    if (open) markClamped(panel.parentNode);
  }

  /* THE CLAMP RELEASE, and deliberately NOT persisted — unlike the
     collapse above. "This one is long and I want it out of my way
     every time" is a preference; "show me the rest of this, now" is
     about this minute. */
  function toggleFull(key) {
    var btn = $('ascView').querySelector('[data-act="full"][data-key="' + key + '"]');
    var panel = btn ? btn.closest('.sc-peek') : null;
    if (!panel) return;
    var on = panel.classList.toggle('is-full');
    btn.textContent = on ? 'Show less' : 'Show all';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    // Folding it back up: re-measure this one, so a description that
    // is only just over the clamp keeps its control instead of losing
    // it.
    if (!on) markClamped(panel.parentNode);
  }

  // ============================================================
  // §THE SHEET — one practice, read before it is run.
  // ============================================================
  var sheetOf = null;           // {kind, id, shelf} currently shown

  function findRow(kind, id) {
    var all = A.activities();
    for (var i = 0; i < all.length; i++) if (all[i].kind === kind && all[i].id === id) return all[i];
    return null;
  }

  function sheetBack() {
    /* BACK, and it is a real control rather than a hint about Esc. The
       sheet could already be dismissed four ways — Esc, the backdrop,
       Cancel, the browser's own back — and every one of them is
       invisible. */
    return '<div class="asc-sheet__back">' +
      '<button type="button" class="asc-back" data-act="sheet-close">' +
        '<span aria-hidden="true">&#8592;</span> Back</button>' +
    '</div>';
  }

  function openDetail(kind, id, shelf) {
    var a = findRow(kind, id);
    if (!a) { toast('That is no longer here.'); render(); return; }
    sheetOf = { kind: kind, id: id, shelf: shelf || '' };
    var r = a.rec;
    var out = '<div style="--sc-tint:' + hueOf(a.group) + '">' +
      sheetBack() +
      '<div class="asc-sheet__top">' +
        '<div>' +
          '<p class="asc-label">' + esc(KINDS[a.kind] ? KINDS[a.kind].label : a.kind) + '</p>' +
          '<h2 class="sc-plate sc-plate--lg">' + esc(a.title) + '</h2>' +
        '</div>' +
        heartBtn(a) +
      '</div>' +
      /* The group travels WITH the practice, wherever you meet it —
         and here it is a button that files it somewhere else. */
      '<div class="sc-detail__meta">' + groupPill(a.group, false) +
        '<button type="button" class="asc-btn asc-btn--sm asc-btn--quiet" data-act="regroup">Move it</button>' +
      '</div>';

    var chips = [];
    if (a.forWhen) chips.push(a.forWhen);
    if (lengthWord(a)) chips.push(lengthWord(a));
    if (a.lastDoneISO) chips.push('Last done ' + lastDoneWord(a.lastDoneISO).toLowerCase());
    if (a.timesDone > 1) chips.push(plural(a.timesDone, 'time'));
    if (chips.length) {
      out += '<div class="sc-chips">' + chips.map(function (c) {
        return '<span class="sc-chip">' + esc(c) + '</span>';
      }).join('') + '</div>';
    }

    if (kind === 'breath')      out += detailBreath(r);
    else if (kind === 'eft')    out += detailEft(r);
    else if (kind === 'energy') out += detailEnergy(r);
    else if (kind === 'custom') out += detailCustom(r);
    else                        out += detailMedia(r);

    /* THE ACTIONS ARE BUILT HERE, not inside the five detail
       functions, and that is the whole point: the primary button reads
       "Start session" on every kind and goes through startActivity(),
       the same call the table rows and the hero card make. */
    out += '<div class="asc-sheet__acts">' +
      '<button type="button" class="asc-btn asc-btn--primary" data-act="start"' +
        ' data-kind="' + esc(a.kind) + '" data-id="' + esc(a.id) + '"' +
        ' data-shelf="' + esc(a.shelf) + '">Start session</button>' +
      (a.url
        ? '<a class="asc-btn" href="' + esc(a.url) + '" target="_blank"' +
          ' rel="noopener noreferrer" data-act="did-open">Open the link &#8599;</a>'
        : '') +
      // Still here, and still quiet. It is what you press for the
      // practice you did away from the screen.
      '<button type="button" class="asc-btn asc-btn--quiet" data-act="did">Mark it done</button>' +
    '</div>';

    out += '<div class="asc-sheet__acts asc-sheet__acts--minor">' +
      '<button type="button" class="asc-btn asc-btn--sm" data-act="edit">Edit</button>' +
      '<button type="button" class="asc-btn asc-btn--sm asc-btn--quiet" data-act="delete">Delete</button>' +
    '</div>';

    U().openSheet(out + '</div>');
  }

  function detailBreath(b) {
    var out = '';
    if (b.summary) out += '<p class="asc-body asc-sheet__block">' + escLines(b.summary) + '</p>';
    if (b.cues.length) {
      out += '<div class="asc-sheet__block"><p class="asc-label">How it goes</p>' +
        '<ul class="sc-cues">' + b.cues.map(function (c) {
          return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
    }
    out += '<div class="asc-sheet__block"><p class="asc-label">The pattern</p><div class="asc-lines">' +
      b.rounds.map(function (rd) {
        return '<div class="asc-line">' +
          '<span class="asc-label">' + esc(rd.label || (rd.cycles + '×')) + '</span>' +
          '<p>' + esc(rd.phases.map(function (p) {
            var w = { inhale: 'in', hold: 'hold', exhale: 'out', holdOut: 'hold' }[p.kind] || p.kind;
            return w + ' ' + (p.seconds ? p.seconds + 's' : 'as long as you like');
          }).join(' · ')) + (rd.cycles > 1 ? ' — ' + rd.cycles + ' times' : '') + '</p>' +
        '</div>';
      }).join('') + '</div></div>';
    if (b.why) out += '<div class="asc-sheet__block"><p class="asc-label">Why it works</p>' +
      '<p class="asc-body">' + escLines(b.why) + '</p></div>';
    return out;
  }

  function detailEft(t) {
    var out = '';
    if (t.blurb) out += '<p class="asc-body asc-sheet__block">' + escLines(t.blurb) + '</p>';
    if (t.setup.length) {
      out += '<div class="asc-sheet__block"><p class="asc-label">The setup, said out loud</p>' +
        '<ul class="sc-cues">' + t.setup.map(function (s) {
          return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
    }
    return out;
  }

  function detailEnergy(e) {
    var out = '';
    if (e.summary) out += '<p class="asc-body asc-sheet__block">' + escLines(e.summary) + '</p>';
    if (e.steps.length) {
      out += '<div class="asc-sheet__block"><p class="asc-label">What to do</p>' +
        '<ol class="sc-steps">' + e.steps.map(function (s) {
          return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></div>';
    }
    return out;
  }

  function detailCustom(c) {
    var out = '';
    if (c.summary) out += '<p class="asc-body asc-sheet__block">' + escLines(c.summary) + '</p>';
    if (c.steps.length) {
      out += '<div class="asc-sheet__block"><p class="asc-label">What to do</p>' +
        '<ol class="sc-steps">' + c.steps.map(function (s) {
          return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></div>';
    }
    return out;
  }

  function detailMedia(m) {
    var out = '';
    if (m.description) out += '<p class="asc-body asc-sheet__block">' + escLines(m.description) + '</p>';
    if (m.teacher) out += '<div class="sc-chips"><span class="sc-chip">' + esc(m.teacher) + '</span></div>';
    if (!m.url) {
      // Seeded on purpose without a link. An invented URL is a dead
      // link, and a dead link is worse than a described one.
      out += '<p class="asc-small asc-sheet__block">Described, not linked — ' +
        'find the one you like and paste it in.</p>';
    }
    return out;
  }

  // ============================================================
  // §THE MODAL — one shape for every dialogue that is not a
  // practice. Groups, the house words, the hero, the vocabulary.
  // ============================================================
  var modalSave = null;

  function openModal(cfg) {
    modalSave = cfg.onSave || null;
    var out = '<div>' + sheetBack() +
      '<h2 class="sc-plate sc-plate--lg sc-sheet__title">' + esc(cfg.title) + '</h2>' +
      (cfg.lede ? '<p class="asc-body asc-sheet__block">' + esc(cfg.lede) + '</p>' : '') +
      cfg.body +
      (cfg.hideActions ? '' :
        '<div class="asc-sheet__acts">' +
          '<button type="button" class="asc-btn asc-btn--primary" data-act="m-save">' +
            esc(cfg.saveLabel || 'Save') + '</button>' +
          '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Cancel</button>' +
        '</div>') +
    '</div>';
    U().openSheet(out);
    if (cfg.onMount) cfg.onMount(U().sheetEl());
  }
  function closeModal() { modalSave = null; U().closeSheet(); }

  function menuHtml(items) {
    return '<div class="sc-menu">' + items.map(function (it) {
      return '<button type="button" data-mact="' + esc(it.act) + '"' +
        (it.danger ? ' class="is-danger"' : '') + '>' + esc(it.label) + '</button>';
    }).join('') + '</div>';
  }

  function mField(label, name, value, ph, hint) {
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<input class="asc-input" data-f="' + esc(name) + '" maxlength="300"' +
        ' value="' + esc(value == null ? '' : value) + '"' +
        ' placeholder="' + esc(ph || '') + '"></label>' +
      (hint ? '<p class="sc-hint">' + esc(hint) + '</p>' : '');
  }
  function mArea(label, name, value, ph, rows) {
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<textarea class="asc-textarea" data-f="' + esc(name) + '" rows="' + (rows || 3) + '"' +
        ' maxlength="4000" placeholder="' + esc(ph || '') + '">' +
        esc(value == null ? '' : value) + '</textarea></label>';
  }
  function mSelect(label, name, value, options) {
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<select class="asc-input asc-select" data-f="' + esc(name) + '">' +
        options.map(function (o) {
          var v = o.id == null ? o.value : o.id;
          var t = o.label == null ? v : o.label;
          return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') +
            '>' + esc(t) + '</option>';
        }).join('') +
      '</select></label>';
  }
  function readFields(root) {
    var out = {};
    Array.prototype.forEach.call(root.querySelectorAll('[data-f]'), function (el) {
      out[el.getAttribute('data-f')] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }

  // ============================================================
  // §GROUPS — the filing system, edited where you look at it
  // ============================================================
  function hueField(selected) {
    return '<div class="sc-field"><span class="asc-label">Colour</span>' +
      '<div class="sc-swatches" role="radiogroup" aria-label="Group colour">' +
        A.GROUP_HUES.map(function (h) {
          var on = h.hue.toLowerCase() === String(selected || '').toLowerCase();
          return '<button type="button" class="sc-swatch' + (on ? ' is-on' : '') + '"' +
            ' style="--sc-tint:' + h.hue + '" data-hue="' + esc(h.hue) + '"' +
            ' role="radio" aria-checked="' + (on ? 'true' : 'false') + '"' +
            ' title="' + esc(h.name) + '"><span class="hd-sr">' + esc(h.name) + '</span></button>';
        }).join('') +
      '</div></div>';
  }

  /* One handler for the whole grid, bound on the sheet each time it
     opens. It writes to a hidden field rather than to a closure, so
     readFields() picks the colour up with everything else and the save
     path stays one shape. */
  function mountHueGrid(root) {
    var grid = root.querySelector('.sc-swatches');
    if (!grid) return;
    grid.addEventListener('click', function (e) {
      var b = e.target.closest('[data-hue]');
      if (!b) return;
      Array.prototype.forEach.call(grid.querySelectorAll('.sc-swatch'), function (x) {
        x.classList.remove('is-on'); x.setAttribute('aria-checked', 'false');
      });
      b.classList.add('is-on'); b.setAttribute('aria-checked', 'true');
      var f = root.querySelector('[data-f="hue"]');
      if (f) f.value = b.dataset.hue;
    });
  }

  function openGroupEditor(id) {
    var g = id ? A.groupById(id) : null;
    if (id && (!g || g.id !== id)) { toast('That group is gone', true); return; }
    var hue = g ? g.hue : A.GROUP_HUES[0].hue;
    openModal({
      title: g ? 'Edit group' : 'New group',
      saveLabel: g ? 'Save changes' : 'Add group',
      body:
        mField('Name', 'label', g ? g.label : '', 'Before bed') +
        hueField(hue) +
        '<input type="hidden" data-f="hue" value="' + esc(hue) + '">' +
        (g ? '<p class="asc-small">' +
              esc(plural(A.groupCounts()[g.id] || 0, 'practice')) + ' in this group.</p>' : ''),
      onMount: mountHueGrid,
      onSave: function (root) {
        var f = readFields(root);
        var label = String(f.label || '').trim();
        if (!label) { toast('Give the group a name', true); return false; }
        if (g) A.updateGroup(g.id, { label: label, hue: f.hue });
        else toast('Added ' + A.addGroup(label, f.hue).label);
        return true;
      }
    });
  }

  /* DELETING A GROUP ASKS WHERE ITS PRACTICES GO. Nothing is ever
     silently un-filed: the dialogue says how many there are and offers
     every other group, defaulting to the catch-all. A group with
     nothing in it still asks — one dialogue is easier to trust than
     two paths. */
  function confirmDeleteGroup(id) {
    var g = A.groupById(id);
    if (!g || g.id !== id) { toast('That group is gone', true); return; }
    if (id === A.FALLBACK_GROUP) {
      toast('Mine cannot be deleted — it is where everything else lands', true);
      return;
    }
    var n = A.groupCounts()[id] || 0;
    var others = A.groups().filter(function (c) { return c.id !== id; });
    openModal({
      title: 'Delete ' + g.label + '?',
      saveLabel: 'Delete the group',
      body: '<p class="asc-body">' +
          (n ? 'This group holds ' + esc(plural(n, 'practice')) +
               '. They are not deleted — choose where they go.'
             : 'This group is empty, so nothing moves.') + '</p>' +
        (n ? mSelect('Move them to', 'moveTo', A.FALLBACK_GROUP, others) : ''),
      onSave: function (root) {
        var f = readFields(root);
        var res = A.removeGroup(id, n ? f.moveTo : A.FALLBACK_GROUP);
        if (!res.ok) { toast('That group could not be deleted', true); return false; }
        toast(res.moved
          ? 'Deleted — ' + plural(res.moved, 'practice') + ' moved to ' + A.groupById(res.dest).label
          : 'Deleted');
        return true;
      }
    });
  }

  function openGroupMenu(id) {
    var g = A.groupById(id);
    if (!g) return;
    openModal({
      title: g.label,
      hideActions: true,
      body: '<p class="asc-small">' +
          esc(plural(A.groupCounts()[id] || 0, 'practice')) + ' in this group.</p>' +
        menuHtml([
          { act: 'g-edit', label: 'Rename or recolour' },
          { act: 'g-only', label: 'Show only this group' },
          { act: 'g-new', label: 'Add a new group' },
          { act: 'g-del', label: 'Delete this group', danger: id !== A.FALLBACK_GROUP }
        ])
    });
    MENU_ACTS = {
      'g-edit': function () { closeModal(); openGroupEditor(id); },
      'g-new':  function () { closeModal(); openGroupEditor(null); },
      'g-only': function () { closeModal(); ui.cat = id; saveUi(); renderList(); },
      'g-del':  function () { closeModal(); confirmDeleteGroup(id); }
    };
  }

  /* Move ONE practice into another group. The only field is the
     group: the kind is not offered, because changing it would mean
     deleting the record from one collection and adding it to another
     under a new id, orphaning every session logged against it. */
  function openRegroup(kind, id, shelf) {
    var a = findRow(kind, id);
    if (!a) { toast('That is no longer here.'); return; }
    openModal({
      title: 'Where does it go?',
      lede: a.title,
      saveLabel: 'Move it',
      body: mSelect('Group', 'groupId', a.group, A.groups()),
      onSave: function (root) {
        var f = readFields(root);
        var coll = collFor(kind, shelf);
        if (!coll) { toast('That kind has nowhere to go.', true); return false; }
        coll.update(id, { groupId: f.groupId });
        toast('Moved to ' + A.groupById(f.groupId).label);
        render();
        return true;
      }
    });
  }

  // ============================================================
  // §ADDING, EDITING AND DELETING — every kind, not just Mine
  //
  // WHY IT IS A DRAFT OBJECT AND NOT A <form>
  // Four of the six kinds are flat prose and a plain form would do.
  // The other two are not: a breathing technique is rounds of timed
  // phases and a tapping script is lines against tapping points, and
  // both need rows that can be added and removed while you are
  // looking at them. So the form renders FROM a draft object and
  // every field writes back into it by path — one input listener and
  // one setter, rather than a bespoke handler per control.
  //
  // The draft is deliberately NOT the record. Nothing is written to
  // storage until Save, so Back really does mean back.
  // ============================================================

  // Where each kind lives, and what its name field is called. Two of
  // the six say `name` and four say `title`; that difference is in the
  // models and is not worth a migration, so it is declared once here.
  //
  // `group` is the group a NEW record of this kind lands in. It is a
  // default now, not an identity — see §GROUPS in asclepion-data.js.
  var KINDS = {
    breath:     { group: 'breath', label: 'Breath',     nameKey: 'name'  },
    eft:        { group: 'eft',    label: 'Tapping',    nameKey: 'name'  },
    meditation: { group: 'medit',  label: 'Meditation', nameKey: 'title' },
    yoga:       { group: 'yoga',   label: 'Movement',   nameKey: 'title' },
    energy:     { group: 'energy', label: 'Energy',     nameKey: 'title' },
    custom:     { group: 'mine',   label: 'Mine',       nameKey: 'title' }
  };
  var KIND_ORDER = ['breath', 'eft', 'meditation', 'yoga', 'energy', 'custom'];

  // The collection a kind writes to. Meditation is five collections
  // wearing one name — the shelf picks which.
  function collFor(kind, shelf) {
    if (kind === 'breath')     return A.Breath;
    if (kind === 'eft')        return A.Eft;
    if (kind === 'yoga')       return A.Yoga;
    if (kind === 'energy')     return A.Energy;
    if (kind === 'custom')     return A.Custom;
    if (kind === 'meditation') return A.mediaShelf(shelf || 'meditation');
    return null;
  }

  var editing = null;   // { kind, id, shelf, draft }

  function blankDraft(kind) {
    var g = KINDS[kind] ? KINDS[kind].group : 'mine';
    if (kind === 'breath') {
      return { name: '', goal: 'Calm', groupId: g, summary: '', why: '', cues: '',
        rounds: [{ label: '', cycles: 4, phases: [
          { kind: 'inhale', seconds: 4 }, { kind: 'exhale', seconds: 6 }] }] };
    }
    if (kind === 'eft') {
      return { name: '', blurb: '', groupId: g, setup: '', closing: '',
        round1: [{ point: '', phrase: '' }], round2: [], reframe: [] };
    }
    if (kind === 'meditation') {
      return { shelf: 'meditation', title: '', teacher: '', url: '', groupId: g,
        description: '', minutes: 0, forWhen: '' };
    }
    if (kind === 'yoga') {
      return { title: '', category: 'mobility', feelings: '', minutes: 0, groupId: g,
        url: '', description: '' };
    }
    if (kind === 'energy') {
      return { title: '', group: 'grounding', groupId: g, summary: '', steps: '', minutes: 0 };
    }
    return { title: '', forWhen: '', minutes: 0, groupId: g, summary: '', steps: '', url: '' };
  }

  // A record, opened for editing. Lists become newline text because
  // that is how they are edited; they go back to lists on save.
  function draftOf(kind, rec) {
    var g = A.groupIdFor(rec.groupId, kind);
    if (kind === 'breath') {
      return { name: rec.name, goal: rec.goal, groupId: g, summary: rec.summary, why: rec.why,
        cues: (rec.cues || []).join('\n'),
        rounds: (rec.rounds || []).map(function (r) {
          return { label: r.label, cycles: r.cycles,
            phases: (r.phases || []).map(function (p) {
              return { kind: p.kind, seconds: p.seconds, route: p.route || '', note: p.note || '' };
            }) };
        }) };
    }
    if (kind === 'eft') {
      var lines = function (arr) {
        return (arr || []).map(function (l) { return { point: l.point, phrase: l.phrase }; });
      };
      return { name: rec.name, blurb: rec.blurb, groupId: g, setup: (rec.setup || []).join('\n'),
        closing: rec.closing, round1: lines(rec.round1), round2: lines(rec.round2),
        reframe: lines(rec.reframe) };
    }
    if (kind === 'meditation') {
      return { shelf: rec._shelf || 'meditation', title: rec.title, teacher: rec.teacher,
        url: rec.url, groupId: g, description: rec.description, minutes: rec.minutes,
        forWhen: rec.forWhen };
    }
    if (kind === 'yoga') {
      return { title: rec.title, category: rec.category, groupId: g,
        feelings: (rec.feelings || []).join(', '),
        minutes: rec.minutes, url: rec.url, description: rec.description };
    }
    if (kind === 'energy') {
      return { title: rec.title, group: rec.group, groupId: g, summary: rec.summary,
        steps: (rec.steps || []).join('\n'), minutes: rec.minutes };
    }
    return { title: rec.title, forWhen: rec.forWhen, minutes: rec.minutes, groupId: g,
      summary: rec.summary, steps: (rec.steps || []).join('\n'), url: rec.url };
  }

  // ---------- writing a field back by path ----------
  // "rounds.0.phases.2.seconds" -> editing.draft.rounds[0].phases[2]
  function setPath(obj, path, value) {
    var parts = path.split('.'), o = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      o = o[parts[i]];
      if (!o) return;
    }
    o[parts[parts.length - 1]] = value;
  }
  function getPath(obj, path) {
    var parts = path.split('.'), o = obj;
    for (var i = 0; i < parts.length; i++) {
      if (o == null) return '';
      o = o[parts[i]];
    }
    return o == null ? '' : o;
  }

  // ---------- small field builders ----------
  function fText(label, path, opts) {
    opts = opts || {};
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<input class="asc-input" data-path="' + esc(path) + '"' +
        (opts.type ? ' type="' + opts.type + '"' : '') +
        (opts.num ? ' inputmode="numeric" min="0" max="600"' : '') +
        (opts.list ? ' list="' + opts.list + '"' : '') +
        (opts.autofocus ? ' data-autofocus' : '') +
        ' maxlength="' + (opts.max || 200) + '"' +
        ' value="' + esc(String(getPath(editing.draft, path))) + '"' +
        ' placeholder="' + esc(opts.hint || '') + '"></label>';
  }
  function fArea(label, path, hint, rows) {
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<textarea class="asc-textarea" data-path="' + esc(path) + '" rows="' + (rows || 3) + '"' +
        ' maxlength="4000" placeholder="' + esc(hint || '') + '">' +
        esc(String(getPath(editing.draft, path))) + '</textarea></label>';
  }
  function fSelect(label, path, options) {
    var v = String(getPath(editing.draft, path));
    return '<label class="sc-field"><span class="asc-label">' + esc(label) + '</span>' +
      '<select class="asc-input asc-select" data-path="' + esc(path) + '">' +
        options.map(function (o) {
          var val = typeof o === 'string' ? o : (o.id == null ? o.value : o.id);
          var txt = typeof o === 'string' ? o : (o.label == null ? val : o.label);
          return '<option value="' + esc(val) + '"' + (String(val) === v ? ' selected' : '') + '>' +
            esc(txt) + '</option>';
        }).join('') +
      '</select></label>';
  }

  /* THE GROUP FIELD, on every kind. `＋ New group…` at the foot of it
     is a sentinel value the input listener watches for: filing
     something into a group that does not exist yet should not mean
     abandoning the form to go and make one. */
  var NEW_GROUP = '__new__';
  function fGroup() {
    return fSelect('Group', 'groupId',
      A.groups().concat([{ id: NEW_GROUP, label: '＋ New group…' }]));
  }

  // ---------- the form ----------
  function openForm(kind, id, shelf) {
    kind = KINDS[kind] ? kind : 'custom';
    var rec = null;
    if (id) {
      var c = collFor(kind, shelf);
      rec = c && c.get ? c.get(id) : null;
      if (rec && kind === 'meditation') rec._shelf = shelf;
    }
    editing = {
      kind: kind, id: rec ? id : '', shelf: shelf || '',
      draft: rec ? draftOf(kind, rec) : blankDraft(kind)
    };
    paintForm();
  }

  function paintForm() {
    var k = KINDS[editing.kind];
    var out = '<div style="--sc-tint:' + hueOf(editing.draft.groupId || k.group) + '">' +
      sheetBack() +
      '<div class="asc-sheet__top"><div>' +
        '<p class="asc-label">' + esc(k.label) + '</p>' +
        '<h2 class="sc-plate sc-plate--lg">' +
          (editing.id ? 'Edit' : 'Something new') + '</h2>' +
      '</div></div>';

    /* The type picker, on a NEW record only. Changing the kind of an
       existing one would mean deleting it from one collection and
       adding it to another under a new id, which loses its sessions.
       THE GROUP IS NOT THE KIND, and that is the change: the kind is
       what the practice IS, the group is where you file it, and only
       the second is editable afterwards. */
    if (!editing.id) {
      out += '<div class="sc-kindrow">' + KIND_ORDER.map(function (kk) {
        return '<button type="button" class="asc-btn asc-btn--sm' +
          (kk === editing.kind ? ' asc-btn--primary' : ' asc-btn--quiet') +
          '" data-act="f-kind" data-kind="' + kk + '"' +
          ' aria-pressed="' + (kk === editing.kind ? 'true' : 'false') + '">' +
          esc(KINDS[kk].label) + '</button>';
      }).join('') + '</div>';
    }

    out += '<div class="sc-form">' + formFields() + '</div>';

    out += '<div class="asc-sheet__acts">' +
      '<button type="button" class="asc-btn asc-btn--primary" data-act="f-save">' +
        (editing.id ? 'Save' : 'Add it') + '</button>' +
      '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Cancel</button>' +
    '</div>';

    if (editing.id) {
      out += '<div class="asc-sheet__acts asc-sheet__acts--minor">' +
        '<button type="button" class="asc-btn asc-btn--sm asc-btn--quiet" data-act="f-delete">' +
          'Delete this</button></div>';
    }

    U().openSheet(out + '</div>');
  }

  function whenList() {
    return '<datalist id="ascWhenList">' + A.getHouse().whenList.map(function (v) {
      return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
  }

          fSelect('For when', 'goal', A.BREATH_GOALS) +
          '<div class="sc-field sc-field--read"><span class="asc-label">How long it runs</span>' +
            '<p class="sc-readout">' + esc(U().clock(draftSeconds())) + '</p></div>' +
        '</div>' +
        fGroup() +
        fArea('What it is', 'summary', 'One or two lines.', 2) +
        fArea('Cues, one per line', 'cues', 'Optional. Shown while it runs.', 2) +
        fArea('Why it works', 'why', 'Optional.', 2) +
        roundsEditor();
    }

    if (kind === 'eft') {
      return fText('Name', 'name', { max: 80, autofocus: true, hint: 'Anxiety' }) +
        fGroup() +
        fArea('What it is for', 'blurb', 'One or two lines.', 2) +
        fArea('The setup, one line per repetition', 'setup',
          'Even though I feel this, I deeply and completely accept myself.', 3) +

        linesEditor('round2', 'Second round') +
        linesEditor('reframe', 'The reframe') +

    }

    if (kind === 'meditation') {

        fGroup() +
        '<div class="sc-fields2">' +
          fText('Teacher', 'teacher', { max: 120, hint: 'Optional.' }) +

        '</div>' + whenList() +
