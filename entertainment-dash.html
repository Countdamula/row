<title>Entertainment — Personal Dashboard</title>
<!--
  entertainment-dash.html — the single merged Entertainment dashboard.
  Replaces two things that used to exist separately:
    1. The five-page "Entertainment" nav folder (ent-podcasts.html/
       ent-stories.html/ent-entertainment.html/ent-playlists.html/
       ent-favorites.html, all deleted) — their real data isn't lost,
       it's still read/written through the same entertainment-hub-data.js
       (see that file's own header comment on why it's kept, not
       deleted — fitnessstudio.html's music panel still depends on it).
    2. "Media"/mediaverse.html (deleted outright, per an explicit
       request — its own mediaverse-data.js is gone too, nothing here
       reads it).

  Per an explicit request, this page also gains 5 sections the old
  folder never had: Discovery Engine, Reading Corner, Anime, Games, and
  Statistics (Anime/Games are entertainment-dash-data.js collections;
  Discovery/Statistics are pure computed tools, no storage of their
  own). Horror Stories and Spicy Stories are now each split into a
  Reading database and a separate YouTube database — see
  entertainment-hub-data.js's own header comment for how that split/
  migration works.

  Per a later, separate explicit request, Reading Corner was pulled OUT
  of the generic Discovery/Favorites/Statistics REGISTRY system above
  and rebuilt as its own richer, standalone set of databases — Library,
  To Be Read, Series, Authors, Quotes, Reading Goals, and Stats — closer
  in shape to a dedicated "Ultimate Reading Tracker" Notion template
  than a single generic gallery. See entertainment-reading-data.js's own
  header comment for the full data model.

  Per a further explicit request ("completely separate the Reading
  Corner, Anime, and Games into its own database"), Anime and Games have
  now ALSO been pulled fully out of the same generic REGISTRY system —
  see entertainment-anime-data.js/entertainment-games-data.js. Unlike
  Reading Corner, they keep their original simpler single-page shape
  (a gallery + genre/status filters + search + drag-reorder, same
  feature set they already had) — just backed by their own standalone
  data file/collection/render function instead of shared REGISTRY
  dispatch, and now restyled per a further explicit request: their own
  genre/status filter rows use a hand-rolled "squiggly underline" nav
  (glass-theme.css's own .gt-squiggly-nav — a vanilla reimplementation of
  a React/Framer-Motion component prompt, since this app has no build
  step/React/Tailwind anywhere, CLAUDE.md §1) with an added glow, and
  their cards render inside glass-theme.css's own .gt-beam-card "border
  beam" panel (again reimplementing a React/shadcn component prompt
  natively) in a red/pink/black palette scoped ONLY to these two tabs
  (see the .eda-rpb rule in this file's own <style> block) — every other
  tab on this page (Home/Discovery/Favorites/Statistics, Reading Corner,
  every Enthub gallery) keeps this page's usual near-black/gold look,
  untouched.

  "Clone and copy the looks of Fitness Studio and Business Dashboard":
  this page is built entirely from those two pages' own extracted,
  reusable component kits — glass-theme.css/js (the dark-glass hero,
  glare cards, border-beam cards, background glow, and now the squiggly-
  underline nav) and gallery-card.css/js (the cover-art gallery card,
  extracted from ent-stories.html's own card before that page was
  deleted) — rather than a third, bespoke copy of either. --gt-*/--gc-*
  are repointed below to this app's common near-black/gold palette
  (Business Dashboard's own values), the aesthetic most of this app's
  newer pages already share (CLAUDE.md §6) — Anime/Games' own red/pink
  override only ever applies inside the .eda-rpb scope, never globally.

  Structural note, disclosed rather than silently chosen: Fitness
  Studio's own "clone" is a continuous single-scroll page with movable
  sections; Business Dashboard's is a gallery of businesses that open
  into their own full page. With 15 real sections here (Home/Discovery/
  Favorites + 11 galleries + Statistics), neither shape reads well as
  one giant stacked scroll or as 15 separate full-page overlays — so
  this page uses a persistent tab row instead (the same shape
  household.html/selfcare.html/businessdash.html's own subnav already
  use elsewhere in this app), while still genuinely reusing the shared
  kit's hero/card/glare/beam components for the actual look.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="glass-theme.css">
<link rel="stylesheet" href="gallery-card.css">
<style>
:root {
  /* Repoint the shared kit's accent to this app's common near-black/gold
     palette (Business Dashboard's own --bd-* values) — DO NOT MODIFY §2:
     reuse existing tokens, no new hard-coded palette. */
  --gt-bg: #0b0a08;
  --gt-bg-deep: #050403;
  --gt-accent: #c9a876;
  --gt-accent-bright: #e8cf9f;
  --gt-accent-rgb: 201,168,118;
  --gt-accent-text: #24190c;
  --gt-bgfx-rgb: 201,168,118;
  --gt-font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
body { margin: 0; font-family: var(--gt-font); }
.edash-tabs {
  position: sticky; top: 8px; z-index: 40;
  background: rgba(11,10,8,0.82); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border: 1px solid var(--gt-border); padding: 10px; margin: 0 0 20px; border-radius: 16px;
  max-height: 46vh; overflow-y: auto;
}
.edash-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 12px; margin-bottom: 4px; }
.edash-stat-tile { padding: 16px; text-align: center; margin-bottom: 0; }
.edash-stat-value { font-size: 26px; font-weight: 800; color: var(--gt-accent-bright); }
.edash-stat-label { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gt-text-mute); margin-top: 4px; }
.edash-bar-row { margin-bottom: 9px; }
.edash-bar-label { font-size: 12px; color: var(--gt-text-dim); margin-bottom: 3px; }
.edash-bar-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; }
.edash-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gt-accent) 0%, var(--gt-accent-bright) 100%); border-radius: 999px; }
.edash-group-title { font-weight: 700; font-size: 13px; margin: 0 0 8px; color: var(--gt-text); }
.edash-boot-error { position: fixed; top: 0; left: 0; right: 0; z-index: 6000; background: #3a0d0d; color: #fff; padding: 14px 18px; font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.edash-boot-error button { margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font: inherit; }
@media (max-width: 620px) { .edash-tabs { max-height: 34vh; } }

/* ---------- Anime / Games — "completely separate... into its own
   database," restyled per a further explicit request: a red/pink/black
   palette, scoped to ONLY this wrapper (renderNativeGalleryTab() below
   wraps everything it renders in a `.eda-rpb` div) so nothing outside
   these two tabs repaints. Works purely by overriding the shared kit's
   own custom properties — .gt-beam-card/.gt-squiggly-nav/most of
   gallery-card.css already read var(--gt-accent*)/var(--gc-accent*), so
   scoping just those variables here recolors every one of this app's
   already-existing components automatically; only the two hardcoded-hex
   exceptions in gallery-card.css (.gc-card-fav-btn.on/.gc-star.on) need
   an explicit override rule of their own. ---------- */
.eda-rpb {
  --gt-accent: #ff2d6a;
  --gt-accent-bright: #ff6fae;
  --gt-accent-rgb: 255,45,106;
  --gt-accent-text: #200008;
  /* Two DISTINCT beam colors (red + pink) instead of one color repeated
     twice — see glass-theme.css's own .gt-beam-card-glow comment on why
     these two variables exist at all. */
  --gt-beam-color-a: #ff2d55;
  --gt-beam-color-b: #ff6fae;
  --gc-accent: #ff2d6a;
  --gc-accent-bright: #ff6fae;
  --gc-hairline: rgba(255,45,106,0.28);
}
.eda-rpb .gc-card-fav-btn.on { color: #ff6fae; filter: drop-shadow(0 0 6px rgba(255,111,174,0.85)); }
.eda-rpb .gc-star.on { color: #ff6fae; filter: drop-shadow(0 0 5px rgba(255,111,174,0.85)); }
.eda-rpb .gt-beam-card { box-shadow: 0 0 24px rgba(255,45,106,0.3); }

/* ---------- Reading Corner — pulled out of the generic gallery-tab
   system into its own richer set of sub-pages (Overview/Library/TBR/
   Series/Authors/Quotes/Reading Goals/Stats), styled to match the rest
   of this page's own .gt-*/.gc-* component vocabulary rather than
   inventing a fourth naming scheme. ---------- */
.gc-card-icon-btn.on { color: var(--gt-accent-bright); border-color: rgba(var(--gt-accent-rgb),0.5); }
.rd-modal-wide { max-width: 760px; }

/* Currently Reading rows (Overview) */
.rd-cr-row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--gt-hairline); }
.rd-cr-row:last-child { border-bottom: none; }
.rd-cr-cover { width: 52px; height: 72px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.rd-cr-cover img { width: 100%; height: 100%; object-fit: cover; }
.rd-cr-info { flex: 1; min-width: 0; }
.rd-cr-title { font-weight: 700; font-size: 14.5px; cursor: pointer; }
.rd-cr-title:hover { color: var(--gt-accent-bright); }
.rd-cr-author { font-size: 12px; color: var(--gt-text-mute); margin-bottom: 6px; }
.rd-cr-actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }

/* Reading-habit heatmap (Overview) */
.rd-heatmap { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; max-width: 380px; }
.rd-heatmap-cell { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,0.05); }
.rd-heatmap-l1 { background: rgba(var(--gt-accent-rgb),0.35); }
.rd-heatmap-l2 { background: rgba(var(--gt-accent-rgb),0.62); }
.rd-heatmap-l3 { background: var(--gt-accent-bright); }

/* TBR list */
.rd-tbr-list { display: flex; flex-direction: column; }
.rd-tbr-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gt-hairline); }
.rd-tbr-row:last-child { border-bottom: none; }
.rd-tbr-drag { cursor: grab; }
.rd-tbr-rank { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--gt-text-mute); font-size: 12px; flex: 0 0 auto; width: 26px; }
.rd-tbr-info { flex: 1; min-width: 0; }
.rd-tbr-title { font-weight: 700; font-size: 14px; cursor: pointer; }
.rd-tbr-title:hover { color: var(--gt-accent-bright); }
.rd-tbr-meta { font-size: 11.5px; color: var(--gt-text-mute); margin-top: 2px; }
.rd-tbr-actions { display: flex; gap: 6px; flex: 0 0 auto; }

/* Series */
/* No padding/margin of its own anymore — this now sits nested inside
   .gt-beam-card-inner (see buildSeriesCard()'s wrapInBeamCard() call),
   which already supplies both; keeping its own would double-inset it
   compared to every other card on this page. */
.rd-series-card { }
.rd-series-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.rd-series-title { font-weight: 800; font-size: 16px; }
.rd-series-notes { font-size: 12px; color: var(--gt-text-mute); margin-top: 3px; }
.rd-series-members { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.rd-series-member { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 9px; background: rgba(255,255,255,0.03); font-size: 13px; cursor: pointer; }
.rd-series-member:hover { background: rgba(255,255,255,0.06); }
.rd-series-member-status { font-size: 10.5px; color: var(--gt-text-mute); text-transform: uppercase; letter-spacing: 0.04em; }

/* Authors */
.rd-author-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 14px; }
/* padding removed for the same reason as .rd-series-card above — now
   nested inside .gt-beam-card-inner, which already supplies it. */
.rd-author-card { text-align: center; cursor: pointer; }
.rd-author-photo { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
.rd-author-photo img { width: 100%; height: 100%; object-fit: cover; }
.rd-author-name { font-weight: 700; font-size: 13.5px; }
.rd-author-meta { font-size: 11px; color: var(--gt-text-mute); margin-top: 3px; }

/* Quotes */
.rd-quote-text { font-family: var(--gt-font); font-style: italic; font-size: 15px; line-height: 1.55; color: var(--gt-text); margin-bottom: 8px; }
.rd-quote-meta { font-size: 11.5px; color: var(--gt-text-mute); }

/* Monthly Books Finished bar chart (Reading Goals) */
.rd-month-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.rd-month-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.rd-month-bar { width: 100%; max-width: 22px; background: linear-gradient(180deg, var(--gt-accent-bright) 0%, var(--gt-accent) 100%); border-radius: 4px 4px 0 0; }
.rd-month-label { font-size: 9.5px; color: var(--gt-text-mute); margin-top: 4px; }
.rd-month-val { font-size: 10px; color: var(--gt-text-dim); font-weight: 700; }

/* Book Detail overlay */
.rd-detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.rd-detail-cover { width: 80px; height: 112px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 26px; }
.rd-detail-cover img { width: 100%; height: 100%; object-fit: cover; }
.rd-detail-headinfo { flex: 1; min-width: 0; }
.rd-detail-subhead { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; }
.rd-detail-subhead h4 { margin: 0; font-size: 14px; font-weight: 800; }
.rd-detail-quote { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--gt-hairline); font-size: 13px; font-style: italic; }
.rd-detail-quote:last-of-type { border-bottom: none; }

/* Journal sections (generated-on-demand, same pattern as this app's
   other per-record Notes sections, e.g. business.html Platform Detail /
   system.html Page Notes). */
.rd-journal-card { background: rgba(255,255,255,0.03); border: 1px solid var(--gt-hairline); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.rd-journal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rd-journal-title-input { flex: 1; background: transparent; border: none; color: var(--gt-text); font-weight: 700; font-size: 13.5px; font-family: inherit; padding: 4px 2px; }
.rd-journal-title-input:focus { outline: none; border-bottom: 1px solid rgba(var(--gt-accent-rgb),0.5); }
.rd-journal-body-input { width: 100%; background: transparent; border: none; resize: none; overflow: hidden; color: var(--gt-text-dim); font-family: inherit; font-size: 13px; line-height: 1.55; min-height: 1.6em; }
.rd-journal-body-input:focus { outline: none; }
@media (max-width: 620px) { .rd-heatmap { grid-template-columns: repeat(10, 1fr); max-width: 280px; } }
</style>
</head>

<!-- ================= Reading Corner modals ================= -->

      <label class="gt-field-label">Author</label>

      <label class="gt-field-label">Rating</label>

    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">

<script>
// Wrapped in DOMContentLoaded — every dependency above is a deferred
// script, which only finishes executing right before DOMContentLoaded
// fires. A plain inline script (this one) would otherwise run BEFORE
// those deferred scripts on some engines' ordering, the exact bug class
// mainpillar.html's own changelog documents hitting once — avoided here
// from the start.
document.addEventListener('DOMContentLoaded', function () {
  LocalStoreIDB.ready().then(function () {
    try { boot(); } catch (err) { showBootError(err); }
  });
});

function showBanner(msg, opts) {
  opts = opts || {};
  var el = document.getElementById('edBootError');
  if (!el) return;
  // Deduped, dismissible banners (save-failure warnings) update their own
  // existing box in place instead of stacking a new one on every failed
  // write; a plain boot-crash banner (no dedupeId) always appends fresh.
  if (opts.dedupeId) {
    var existing = document.getElementById(opts.dedupeId);
    if (existing) { existing.querySelector('.edash-boot-error-msg').textContent = msg; return; }
  }
  var box = document.createElement('div');
  box.className = 'edash-boot-error';
  if (opts.dedupeId) box.id = opts.dedupeId;
  var p = document.createElement('div');
  p.className = 'edash-boot-error-msg';
  p.textContent = msg;
  box.appendChild(p);
  if (opts.details) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Copy error details';
    btn.addEventListener('click', function () {
      try { navigator.clipboard.writeText(opts.details); } catch (e) {}
    });
    box.appendChild(btn);
  }
  if (opts.onFreeSpace) {
    var freeBtn = document.createElement('button');
    freeBtn.type = 'button';
    freeBtn.textContent = '🧹 Free up space';
    freeBtn.style.marginLeft = '8px';
    freeBtn.addEventListener('click', opts.onFreeSpace);
    box.appendChild(freeBtn);
  }
  if (opts.dismissable) {
    var dismissBtn = document.createElement('button');
    dismissBtn.type = 'button';
    dismissBtn.textContent = 'Dismiss';
    dismissBtn.style.marginLeft = '8px';
    dismissBtn.addEventListener('click', function () { box.remove(); });
    box.appendChild(dismissBtn);
  }
  el.appendChild(box);
}
function showBootError(err) {
  var msg = (err && err.message) ? err.message : String(err);
  var stack = (err && err.stack) || '';
  showBanner('Something went wrong loading this page: ' + msg, { details: msg + '\n\n' + stack });
}
// A write that fails inside storeSet() (entertainment-dash-data.js /
// entertainment-hub-data.js / entertainment-reading-data.js) never
// throws — it's caught internally and turned into an 'entdash:save' /
// 'enthub:save' / 'entread:save' event instead, so it
// never reaches the window 'error'/'unhandledrejection' listeners below
// and never showed any banner at all. It used to just vanish with zero
// signal: click "+ Add," fill it in, hit Save — the modal closes and the
// item just never shows up, reported as "won't let me add anything."
// Most likely cause is this origin's shared localStorage quota being
// full (a documented recurring issue across this app's newer,
// image-heavy pages — see photo-store.js's own header), since every
// page in this app shares one 5MB browser-imposed budget. This makes
// that failure visible instead of guessing at narrower fixes.
function showSaveError(detail) {
  var err = detail && detail.error;
  var isQuota = !!(err && (err.name === 'QuotaExceededError' || err.code === 22));
  var msg = isQuota
    ? '⚠ Couldn\'t save your last change — this site\'s local storage is full. Free up space (clear old browsing data for this site, or ask to have unused pages\' data cleaned up) and try again.'
    : '⚠ Couldn\'t save your last change' + (err ? ': ' + (err.message || err) : '') + '. Try again — if it keeps happening, copy the details below.';
  showBanner(msg, {
    dedupeId: 'edSaveErrorBanner',
    dismissable: true,
    details: (detail && detail.key) + ': ' + ((err && err.stack) || String(err || '')),
    onFreeSpace: (isQuota && window.StorageCleanup) ? function () { window.StorageCleanup.openPanel(); } : null
  });
}
window.addEventListener('entdash:save', function (e) { if (e.detail && e.detail.ok === false) showSaveError(e.detail); });
window.addEventListener('enthub:save', function (e) { if (e.detail && e.detail.ok === false) showSaveError(e.detail); });
window.addEventListener('entread:save', function (e) { if (e.detail && e.detail.ok === false) showSaveError(e.detail); });
window.addEventListener('entanime:save', function (e) { if (e.detail && e.detail.ok === false) showSaveError(e.detail); });
window.addEventListener('entgames:save', function (e) { if (e.detail && e.detail.ok === false) showSaveError(e.detail); });
// A throw inside a click/change handler (e.g. clicking "+ Add" or Save on
// any item modal) happens well after boot() has already returned — the
// try/catch around boot() above can't see it, so it used to fail
// completely silently (the button just "does nothing," nothing on
// screen, nothing but a console error). These two listeners catch that
// class of bug page-wide, for the whole session, and surface it in the
// same visible banner boot failures already use.
window.addEventListener('error', function (e) { showBootError(e.error || e.message); });
window.addEventListener('unhandledrejection', function (e) { showBootError(e.reason); });

var TAB_HASH = {
  home: 'home', discovery: 'discovery', favorites: 'favorites',
  podcasts: 'podcasts', horrorWatchCreepypasta: 'horror-creepypasta', horrorWatchTrue: 'horror-true-stories',
  spicyWatch: 'spicy-watch', storiesImmersive: 'stories-immersive',
  entertainment: 'entertainment', playlists: 'playlists',
  reading: 'reading-corner', anime: 'anime', games: 'games',
  statistics: 'statistics'
};
var HASH_TAB = {};
Object.keys(TAB_HASH).forEach(function (k) { HASH_TAB[TAB_HASH[k]] = k; });

var EXTRA_TAB_META = {
  home: { icon: '🏠', label: 'Home' },
  discovery: { icon: '🎲', label: 'Discovery Engine' },
  favorites: { icon: '⭐', label: 'Favorites' },
  // 'reading'/'anime'/'games' all live here (not in
  // window.EntDash.REGISTRY, which no longer includes any of the three —
  // see entertainment-dash-data.js's own header comment) since each is
  // now its own standalone system with its own dedicated data file.
  // Reading Corner has its own internal sub-nav (renderReadingCorner());
  // Anime/Games render via the shared renderNativeGalleryTab(body, key)
  // below instead of the generic REGISTRY-driven renderGalleryTab().
  reading: { icon: '📚', label: 'Reading Corner' },
  anime: { icon: '🎴', label: 'Anime' },
  games: { icon: '🎮', label: 'Games' },
  statistics: { icon: '📊', label: 'Statistics' }
};
var CREATOR_LABEL_ENTHUB = {
  podcasts: 'Host / Creator', horrorWatchCreepypasta: 'Channel / Creator', horrorWatchTrue: 'Channel / Creator',
  spicyWatch: 'Channel / Creator', storiesImmersive: 'Creator',
  entertainment: 'Channel / Creator', playlists: 'Curator / Artist'
};

var TAB_ORDER = [];
var activeTab = 'home';
var activeFilters = {};
var favFilterKey = 'all';
var discoveryState = { categoryKey: 'all', minRating: 0, currentPick: null };
var editingKey = null, editingId = null, editingDraft = null;

function tabMeta(key) {
  if (EXTRA_TAB_META[key]) return EXTRA_TAB_META[key];
  var r = window.EntDash.REGISTRY[key];
  return { icon: r.icon, label: r.label };
}

function boot() {
  // window.EntDash.GALLERY_KEYS now only ever contains the 7 Enthub-
  // sourced galleries (Podcasts/Horror·YouTube ×2/Spicy·YouTube/Stories·
  // Immersive/Entertainment/Playlists) — Reading Corner, Anime, and
  // Games have ALL been pulled fully out of that REGISTRY/dispatch
  // system into their own standalone files (see entertainment-dash-
  // data.js's own header comment), so they're appended here directly
  // instead of being spliced back into a position computed from
  // REGISTRY metadata that no longer describes any of them.
  TAB_ORDER = ['home', 'discovery', 'favorites']
    .concat(window.EntDash.GALLERY_KEYS.slice())
    .concat(['reading', 'anime', 'games'])
    .concat(['statistics']);

  var hash = (location.hash || '').replace(/^#/, '');
  activeTab = HASH_TAB[hash] || 'home';

  wireHeroUI();
  wireModal();
  try { readingSubTab = localStorage.getItem('entread:activeSubtab') || 'overview'; } catch (e) {}
  wireBookModal();
  wireBookDetail();
  wireAuthorModal();
  wireSeriesModal();
  wireQuoteModal();
  wireLogModal();

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace(/^#/, '');
    var k = HASH_TAB[h];
    if (k && k !== activeTab) { activeTab = k; renderTabRow(); renderActiveTab(); }
  });

  if (window.EntHub && typeof window.EntHub.bootSync === 'function') {
    window.EntHub.bootSync(function () { renderTabRow(); renderActiveTab(); });
  }
  var remoteAppliedRef = { applied: false };
  if (typeof window.initCloudSync === 'function') {
    window.initCloudSync({
      appKey: 'entdash', syncedPrefixes: ['entdash:', 'entread:', 'entanime:', 'entgames:'],
      onApplied: function () { remoteAppliedRef.applied = true; renderTabRow(); renderActiveTab(); }
    });
  }
  window.EntDash.maybeSeedAfterSyncAttempt(remoteAppliedRef);
  // Same single sync call above covers 'entdash:'/'entread:'/'entanime:'/
  // 'entgames:' together — its one onApplied already flips
  // remoteAppliedRef.applied for all four, so Reading Corner's/Anime's/
  // Games' own seed-race-safety windows all share this one ref rather
  // than each needing a second sync call/second onApplied.
  if (window.EntReading) window.EntReading.maybeSeedAfterSyncAttempt(remoteAppliedRef);
  if (window.EntAnime) window.EntAnime.maybeSeedAfterSyncAttempt(remoteAppliedRef);
  if (window.EntGames) window.EntGames.maybeSeedAfterSyncAttempt(remoteAppliedRef);

  // One-time backfills that swap any leftover base64 covers for tiny
  // Supabase-Storage-hosted URLs — see entertainment-hub-data.js's own
  // migratePhotosToStorage() header for why this file in particular
  // never had one before now, and why it's very likely the actual cause
  // of this page's localStorage-quota reports. Delayed the same 3s every
  // other page in this app uses for this exact call, so it runs after
  // boot's own initial render rather than competing with it — and after
  // EntHub's own sweep specifically, so entertainment-dash-data.js's own
  // migrateHorrorSpicyReadingIntoReadingCorner() (which already ran
  // synchronously above, via entertainment-dash-data.js's own load-time
  // call) has the best chance of copying an already-small hosted URL
  // instead of a giant base64 blob on its next retry.
  setTimeout(function () {
    if (window.EntHub && typeof window.EntHub.migratePhotosToStorage === 'function') {
      window.EntHub.migratePhotosToStorage();
    }
    if (window.EntDash && typeof window.EntDash.migratePhotosToStorage === 'function') {
      window.EntDash.migratePhotosToStorage();
    }
    if (window.EntReading && typeof window.EntReading.migratePhotosToStorage === 'function') {
      window.EntReading.migratePhotosToStorage();
    }
    if (window.EntAnime && typeof window.EntAnime.migratePhotosToStorage === 'function') {
      window.EntAnime.migratePhotosToStorage();
    }
    if (window.EntGames && typeof window.EntGames.migratePhotosToStorage === 'function') {
      window.EntGames.migratePhotosToStorage();
    }
  }, 3000);

  renderTabRow();
  renderActiveTab();
}

function switchTab(key) {
  activeTab = key;
  try { history.replaceState(null, '', '#' + TAB_HASH[key]); } catch (e) {}
  renderTabRow();
  renderActiveTab();
  var row = document.getElementById('edTabRow');
  if (row) row.scrollIntoView({ behavior: (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'), block: 'start' });
}

function renderTabRow() {
  var row = document.getElementById('edTabRow');
  if (!row) return;
  row.innerHTML = '';
  TAB_ORDER.forEach(function (key) {
    var m = tabMeta(key);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gt-chip' + (key === activeTab ? ' active' : '');
    btn.textContent = m.icon + ' ' + m.label;
    btn.addEventListener('click', function () { switchTab(key); });
    row.appendChild(btn);
  });
}

function renderActiveTab() {
  var body = document.getElementById('edTabBody');
  if (!body) return;
  body.innerHTML = '';
  if (activeTab === 'home') renderHome(body);
  else if (activeTab === 'discovery') renderDiscovery(body);
  else if (activeTab === 'favorites') renderFavorites(body);
  else if (activeTab === 'statistics') renderStatistics(body);
  else if (activeTab === 'reading') renderReadingCorner(body);
  else if (activeTab === 'anime' || activeTab === 'games') renderNativeGalleryTab(body, activeTab);
  else renderGalleryTab(body, activeTab);
}

function buildFilterChip(label, active, onClick) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'gt-chip' + (active ? ' active' : '');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

// Wraps ANY already-built card element in the .gt-beam-card "border
// beam" panel (glass-theme.css) — the shared piece behind "the same card
// effect for all of the cards in all of the databases in Entertainment."
// Every card-building function on this page (buildCardFor/buildBookCard/
// buildSeriesCard/buildAuthorCard/buildBeamCardFor, and buildQuoteCard's
// own already-existing inline copy of this exact same markup) funnels
// through this one function now instead of five near-duplicate
// beam/glow/inner constructions. `id`, when given, is stamped onto the
// wrapper itself (not just the card nested inside it) — Sortable's own
// onEnd reads each direct grid child's dataset.id (see
// wireSortableGrid() in gallery-card.js), and since the wrapper is now
// what's actually a direct child of the grid, drag-reorder would
// silently stop working without it.
function wrapInBeamCard(cardEl, id) {
  var beam = document.createElement('div');
  beam.className = 'gt-beam-card';
  if (id != null) beam.dataset.id = id;
  var glow = document.createElement('div'); glow.className = 'gt-beam-card-glow';
  beam.appendChild(glow);
  var inner = document.createElement('div'); inner.className = 'gt-beam-card-inner';
  inner.appendChild(cardEl);
  beam.appendChild(inner);
  return beam;
}
function buildCardFor(item, key, opts) {
  opts = opts || {};
  var r = window.EntDash.REGISTRY[key];
  var cardEl = window.GalleryCard.build(item, {
    fallbackIcon: r.icon,
    draggable: !!opts.draggable,
    showSourceTag: !!opts.showSource,
    sourceIcon: r.icon, sourceLabel: r.label,
    onEdit: function (it) { openItemModal(key, it.id); },
    onFavoriteToggle: function (it) { window.EntDash.toggleFavoriteAny(key, it.id); renderActiveTab(); },
    onRatingChange: function (it, rating) { window.EntDash.setRatingAny(key, it.id, rating); renderActiveTab(); }
  });
  return wrapInBeamCard(cardEl, item.id);
}

function buildStatTile(label, value) {
  var t = document.createElement('div');
  t.className = 'gt-glare-card edash-stat-tile';
  var v = document.createElement('div'); v.className = 'edash-stat-value'; v.textContent = value;
  var l = document.createElement('div'); l.className = 'edash-stat-label'; l.textContent = label;
  t.appendChild(v); t.appendChild(l);
  if (window.GlassTheme) window.GlassTheme.wireGlareCard(t);
  return t;
}

// ---------- Home ----------
function renderHome(body) {
  var stats = window.EntDash.computeStats();
  var card = document.createElement('div'); card.className = 'gt-card';
  var head = document.createElement('div'); head.className = 'gt-card-head';
  head.innerHTML = '<h2 class="gt-card-title">👋 Welcome back</h2>';
  card.appendChild(head);
  var row = document.createElement('div'); row.className = 'edash-stat-row';
  row.appendChild(buildStatTile('Total Items', stats.totalItems));
  row.appendChild(buildStatTile('Favorites', stats.totalFavorites));
  row.appendChild(buildStatTile('Categories', stats.categoryCount));
  row.appendChild(buildStatTile('Avg Rating', stats.avgRating ? stats.avgRating.toFixed(1) + ' ★' : '—'));

function buildReadingHeatmap() {
  var R = rd();
  var byDate = R.logByDate();
  var wrap = document.createElement('div'); wrap.className = 'rd-heatmap';
  var days = 70;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(today); d.setDate(d.getDate() - i);
    var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var entry = byDate[iso];
    var level = 0;
    if (entry) { level = entry.pagesRead > 40 ? 3 : (entry.pagesRead > 15 ? 2 : 1); }
    var cell = document.createElement('div');
    cell.className = 'rd-heatmap-cell rd-heatmap-l' + level;
    cell.title = iso + (entry ? ' — ' + entry.pagesRead + ' pages' : ' — no reading logged');
    wrap.appendChild(cell);
  }
  return wrap;
}

function saveLogModal() {

  var minutes = parseInt(document.getElementById('rdLogMinutes').value, 10) || 0;

function saveBookModal() {
  if (!editingBookDraft) return;
  var R = rd();
  var title = document.getElementById('rdBookTitle').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  var authorTyped = document.getElementById('rdBookAuthor').value.trim();
  var authorRec = authorTyped ? R.findOrCreateAuthorByName(authorTyped) : null;
  var seriesIdVal = document.getElementById('rdBookSeries').value || null;
  var seriesIndexVal = parseInt(document.getElementById('rdBookSeriesIndex').value, 10) || null;
  var pastedCover = document.getElementById('rdBookCover').value.trim();
  var statusVal = document.getElementById('rdBookStatus').value;
  var patch = {
    title: title,
    authorId: authorRec ? authorRec.id : null,
    seriesId: seriesIdVal,
    seriesIndex: seriesIdVal ? seriesIndexVal : null,
    genres: editingBookDraft.genres.slice(),
    format: document.getElementById('rdBookFormat').value,
    status: statusVal,
    rating: editingBookDraft.rating || 0,
    pageCount: parseInt(document.getElementById('rdBookPageCount').value, 10) || null,
    currentPage: document.getElementById('rdBookCurrentPage').value !== '' ? (parseInt(document.getElementById('rdBookCurrentPage').value, 10) || 0) : null,
    dateStarted: document.getElementById('rdBookDateStarted').value || '',
    dateFinished: document.getElementById('rdBookDateFinished').value || '',
    source: document.getElementById('rdBookSource').value || '',
    isReread: document.getElementById('rdBookReread').checked,
    favorite: document.getElementById('rdBookFavorite').checked,
    cover: pastedCover || editingBookDraft.cover || '',
    url: document.getElementById('rdBookUrl').value.trim(),
    review: document.getElementById('rdBookReview').value.trim()
  };
  // Only hand out a fresh queue position when the book is newly entering
  // 'tbr' (new book, or transitioning in from another status) — checked
  // against the PREVIOUS status, not tbrPriority itself, since the very
  // first book in the queue legitimately has tbrPriority === 0, which a
  // falsy check would mistake for "never set" and keep reassigning.
  var existingRecord = editingBookId ? R.Books.get(editingBookId) : null;
  var wasAlreadyTbr = existingRecord && existingRecord.status === 'tbr';
  if (statusVal === 'tbr' && !wasAlreadyTbr) patch.tbrPriority = R.nextTbrPriority();
  if (statusVal === 'reading' && !patch.dateStarted) patch.dateStarted = R.todayISO();
  if (statusVal === 'read' && !patch.dateFinished) patch.dateFinished = R.todayISO();

  var result;
  if (editingBookId) {
    result = R.Books.update(editingBookId, patch);
  } else {
    patch.order = R.nextOrder();
    result = R.Books.add(patch);
  }
  if (!result) { alert('Couldn\'t save this — your browser\'s local storage for this site may be full. Free up space and try again; your entry is still in this form.'); return; }
  closeBookModal();
  renderActiveTab();
  if (openBookDetailId) renderBookDetail();
}
function deleteBookModal() {
  if (!editingBookId) return;
  if (!confirm('Delete this book? Its quotes and journal notes will be deleted too.')) return;
  var wasDetailOpen = openBookDetailId === editingBookId;

        }

    };

  });
  // Same URL-paste "🔍 Fetch" auto-fill every other gallery tab already
  // has (window.EntHub.fetchPreview — YouTube/Spotify oEmbed, a plain
  // page-agnostic function) — useful here for an audiobook/author-

  document.getElementById('rdBookFetchBtn').addEventListener('click', function () {

      if (result.cover) {
        editingBookDraft.cover = result.cover;
        document.getElementById('rdBookCover').value = result.cover;
        updateBookCoverPreview();
      }
    });
  });

// ---------- Add/Edit modal ----------
// providerFor(key) — a small abstraction so this ONE shared modal (and
// its Fetch/cover-upload wiring below) can keep working for both
// REGISTRY-driven keys (the 7 Enthub galleries) AND Anime/Games, which
// no longer live in REGISTRY at all (see entertainment-dash-data.js's
// own header comment) but still want the exact same rich modal (title/
// creator/genre/status/url+fetch/length/cover/description/notes) they
// already had before being pulled out into their own files. Returns one
// consistent shape either way, so openItemModal/saveItemModal/
// deleteItemModal below never need to branch on "which kind of key is
// this" themselves.
function providerFor(key) {
  if (key === 'anime' || key === 'games') {
    var mod = key === 'anime' ? window.EntAnime : window.EntGames;
    var cfg = mod.CFG;
    return {
      icon: cfg.icon, label: cfg.label, subtopics: cfg.genres, hasStatus: true,
      statusLabels: cfg.statusLabels, creatorLabel: cfg.creatorLabel, lengthLabel: cfg.lengthLabel,
      // Same URL-paste "🔍 Fetch" auto-fill (YouTube/Spotify oEmbed via
      // window.EntHub.fetchPreview — a plain, page-agnostic function, not
      // scoped to the enthub REGISTRY) every other gallery tab already
      // has — useful here for a trailer/OP link (YouTube) or an official
      // soundtrack/audiobook link (Spotify) pasted as the item's URL.
      hasNotes: true, canFetchPreview: true,
      list: mod.items, add: mod.add, update: mod.update, remove: mod.remove,
      nextOrder: mod.nextOrder, toggleFavorite: mod.toggleFavorite, setRating: mod.setRating
    };
  }
  var r = window.EntDash.REGISTRY[key];
  return {
    icon: r.icon, label: r.label, subtopics: r.subtopics, hasStatus: r.hasStatus,
    statusLabels: r.statusLabels, creatorLabel: CREATOR_LABEL_ENTHUB[key] || 'Creator', lengthLabel: 'Length',
    hasNotes: false, canFetchPreview: true,
    list: function () { return window.EntDash.listItems(key); },
    add: function (data) { return window.EntDash.addItem(key, data); },
    update: function (id, patch) { return window.EntDash.updateItem(key, id, patch); },
    remove: function (id) { return window.EntDash.removeItem(key, id); },
    nextOrder: function () { return window.EntDash.nextOrderAny(key); },
    toggleFavorite: function (id) { return window.EntDash.toggleFavoriteAny(key, id); },
    setRating: function (id, rating) { return window.EntDash.setRatingAny(key, id, rating); }
  };
}
function updateCoverPreview() {
  var img = document.getElementById('edFieldCoverPreview');
  var statusEl = document.getElementById('edFieldCoverStatus');
  if (editingDraft && editingDraft.cover) {
    img.src = editingDraft.cover; img.style.display = 'block';
    statusEl.textContent = editingDraft.cover.indexOf('data:') === 0 ? '✓ Photo attached' : '';
  } else {
    img.style.display = 'none'; img.src = '';
    statusEl.textContent = '';
  }
}
function openItemModal(key, id) {
  editingKey = key; editingId = id;
  var p = providerFor(key);
  var existing = id ? p.list().find(function (x) { return x.id === id; }) : null;
  editingDraft = existing ? Object.assign({}, existing) : {
    title: '', creator: '', url: '', cover: '', description: '', lengthText: '', notesText: '',
    subtopic: (p.subtopics && p.subtopics[0]) || '', status: 'want'
  };

  document.getElementById('edModalTitle').textContent = id ? 'Edit' : ('Add to ' + p.label);
  document.getElementById('edFieldTitle').value = editingDraft.title;
  document.getElementById('edFieldCreatorLabel').textContent = p.creatorLabel;
  document.getElementById('edFieldCreator').value = editingDraft.creator;
  document.getElementById('edFieldUrl').value = editingDraft.url;
  document.getElementById('edFieldCover').value = (editingDraft.cover && editingDraft.cover.indexOf('data:') !== 0) ? editingDraft.cover : '';
  updateCoverPreview();

  var subtopicSel = document.getElementById('edFieldSubtopic'); subtopicSel.innerHTML = '';
  (p.subtopics || []).forEach(function (st) {
    var o = document.createElement('option'); o.value = st; o.textContent = st; subtopicSel.appendChild(o);
  });
  subtopicSel.value = editingDraft.subtopic;

  var statusRow = document.getElementById('edFieldStatusRow');
  if (p.hasStatus) {
    statusRow.style.display = 'block';
    var statusSel = document.getElementById('edFieldStatus'); statusSel.innerHTML = '';
    window.EntDash.STATUS_KEYS.forEach(function (sk) {
      var o = document.createElement('option'); o.value = sk; o.textContent = p.statusLabels[sk]; statusSel.appendChild(o);
    });
    statusSel.value = editingDraft.status;
  } else {
    statusRow.style.display = 'none';
  }

  document.getElementById('edFieldLengthLabel').textContent = p.lengthLabel || 'Length';
  document.getElementById('edFieldLength').value = editingDraft.lengthText;
  document.getElementById('edFieldDescription').value = editingDraft.description;

  var notesRow = document.getElementById('edFieldNotesRow');
  notesRow.style.display = p.hasNotes ? 'block' : 'none';
  document.getElementById('edFieldNotes').value = editingDraft.notesText || '';

  document.getElementById('edFetchBtn').style.display = p.canFetchPreview ? 'inline-flex' : 'none';
  document.getElementById('edDeleteBtn').style.display = id ? 'inline-flex' : 'none';

  document.getElementById('edItemModalBg').classList.add('show');
}
function closeItemModal() {
  document.getElementById('edItemModalBg').classList.remove('show');
  editingKey = null; editingId = null; editingDraft = null;
}
function saveItemModal() {
  if (!editingKey || !editingDraft) return;
  var p = providerFor(editingKey);
  var title = document.getElementById('edFieldTitle').value.trim();
  if (!title) { alert('Please enter a title.'); return; }
  var pastedCover = document.getElementById('edFieldCover').value.trim();
  var patch = {
    title: title,
    creator: document.getElementById('edFieldCreator').value.trim(),
    url: document.getElementById('edFieldUrl').value.trim(),
    cover: pastedCover || editingDraft.cover || '',
    subtopic: document.getElementById('edFieldSubtopic').value,
    lengthText: document.getElementById('edFieldLength').value.trim(),
    description: document.getElementById('edFieldDescription').value.trim()
  };
  if (p.hasStatus) patch.status = document.getElementById('edFieldStatus').value;
  if (p.hasNotes) patch.notesText = document.getElementById('edFieldNotes').value.trim();

  var result;
  if (editingId) {
    result = p.update(editingId, patch);
  } else {
    patch.order = p.nextOrder();
    result = p.add(patch);
  }
  // add/update now return null when the underlying write genuinely
  // failed (see entertainment-dash-data.js/entertainment-hub-data.js/
  // entertainment-anime-data.js/entertainment-games-data.js) — this used
  // to close the modal and re-render regardless, so a failed save just
  // silently vanished with the typed input lost. Keep the modal open
  // (their text is still right there) and say so plainly instead.
  if (!result) {
    alert('Couldn\'t save this — your browser\'s local storage for this site may be full. Free up space and try again; your entry is still in this form.');
    return;
  }
  closeItemModal();
  renderActiveTab();
}
function deleteItemModal() {
  if (!editingKey || !editingId) return;
  if (!confirm('Delete this item?')) return;
  providerFor(editingKey).remove(editingId);
  closeItemModal();
  renderActiveTab();
}
function wireModal() {
  document.getElementById('edModalCancelBtn').addEventListener('click', closeItemModal);
  document.getElementById('edItemModalBg').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'edItemModalBg') closeItemModal();
  });
  document.getElementById('edModalSaveBtn').addEventListener('click', saveItemModal);
  document.getElementById('edDeleteBtn').addEventListener('click', deleteItemModal);

  document.getElementById('edFieldCover').addEventListener('input', function () {
    if (editingDraft) { editingDraft.cover = this.value.trim(); updateCoverPreview(); }
  });
  document.getElementById('edCoverUploadBtn').addEventListener('click', function () {
    var input = document.getElementById('edCoverFileInput');
    input.value = ''; input.click();
  });
  document.getElementById('edCoverFileInput').addEventListener('change', function () {
    var file = this.files[0];
    if (!file || !window.EntHub) return;
    var reader = new FileReader();
    reader.onload = function () {
      window.EntHub.compressImageDataUrl(String(reader.result), 480, 0.82).then(function (compressed) {
        if (!editingDraft) return;
        editingDraft.cover = compressed;
        document.getElementById('edFieldCover').value = '';
        updateCoverPreview();
        if (window.PhotoStore) {
          window.PhotoStore.upload(compressed, function (url) {
            if (editingDraft) { editingDraft.cover = url; updateCoverPreview(); }
          });
        }
      }).catch(function () {});
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('edFetchBtn').addEventListener('click', function () {
    var url = document.getElementById('edFieldUrl').value.trim();
    if (!url || !window.EntHub) return;
    window.EntHub.fetchPreview(url).then(function (result) {
      if (!editingDraft) return;
      if (result.title && !document.getElementById('edFieldTitle').value.trim()) document.getElementById('edFieldTitle').value = result.title;
      if (result.creator) document.getElementById('edFieldCreator').value = result.creator;
      if (result.cover) { editingDraft.cover = result.cover; document.getElementById('edFieldCover').value = result.cover; updateCoverPreview(); }
    });
  });
}
