<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>YouTube Dashboard</title>
<script src="topbar.js" defer></script>
<style>
/* =============================================================
   YouTube Dashboard — standalone page, in the new "Business" nav
   folder (see topbar.js NAV_GROUPS). The YouTube Dashboard tab still
   lives inside business.html (layout:'youtube') exactly as before —
   nothing was removed or migrated, per an explicit "do not delete
   anything" instruction. Same same-origin-iframe-embed approach as
   business-writing.html (see that file's own comment for the full
   reasoning) — zero duplicated logic, every existing feature (the
   channel board, Video Planner, Tasks Inline Database, etc.) keeps
   working exactly as it already does, unmodified.

   Same near-black/gold token subset as business.html's own --bh-*
   tokens (DO NOT MODIFY rule 2 — reuse existing tokens, no new palette).
============================================================= */
:root {
  --wb-bg: #0b0a08;
  --wb-bg-deep: #050403;
  --wb-gold: #c9a876;
  --wb-gold-bright: #e8cf9f;
  --wb-text: #f5f1e9;
  --wb-text-dim: rgba(245, 241, 233, 0.68);
  --wb-hairline: rgba(201, 168, 118, 0.22);
  --font-serif: "Cormorant Garamond", Georgia, "Iowan Old Style", serif;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--wb-bg-deep); color: var(--wb-text); font-family: var(--font); height: 100%; -webkit-font-smoothing: antialiased; overflow: hidden; }
:focus-visible { outline: 2px solid var(--wb-gold-bright); outline-offset: 2px; border-radius: 4px; }

.wb-shell { display: flex; flex-direction: column; height: 100%; }

.wb-header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px 14px max(20px, calc(env(safe-area-inset-left) + 20px));
  padding-top: max(64px, calc(env(safe-area-inset-top) + 64px));
  background: linear-gradient(180deg, var(--wb-bg) 0%, var(--wb-bg-deep) 100%);
  border-bottom: 1px solid var(--wb-hairline);
}
.wb-header-title-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wb-header-eyebrow { font-family: var(--font-mono, monospace); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--wb-gold); }
.wb-header-title { font-family: var(--font-serif); font-style: italic; font-size: clamp(20px, 3.4vw, 28px); font-weight: 600; color: var(--wb-text); }
.wb-header-sub { font-size: 12.5px; color: var(--wb-text-dim); max-width: 60ch; }
.wb-header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.wb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 15px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--wb-hairline);
  border-radius: 999px; color: var(--wb-text-dim);
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.wb-btn:hover { background: rgba(201,168,118,0.12); color: var(--wb-gold-bright); border-color: var(--wb-gold); }

.wb-frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; background: var(--wb-bg-deep); }
.wb-frame-wrap iframe { display: block; width: 100%; height: 100%; border: none; }
.wb-frame-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--wb-text-dim); font-size: 13px; letter-spacing: 0.04em; pointer-events: none;
  transition: opacity 0.25s ease;
}
</style>
</head>
<body>

<div class="wb-shell">
  <header class="wb-header">
    <div class="wb-header-title-wrap">
      <span class="wb-header-eyebrow">Business · YouTube</span>
      <span class="wb-header-title">YouTube Dashboard</span>
      <span class="wb-header-sub">Live, embedded from Business Hub — every channel, the Video Planner, and every task here already syncs the same way it does on that page.</span>
    </div>
    <div class="wb-header-actions">
      <a class="wb-btn" href="business-overview.html">← Business</a>
      <a class="wb-btn" href="business.html#youtube" target="_blank" rel="noopener">Open full page ↗</a>
    </div>
  </header>
  <div class="wb-frame-wrap">
    <div class="wb-frame-loading" id="wbLoading">Loading YouTube Dashboard…</div>
    <iframe id="wbFrame" src="business.html#youtube" title="YouTube Dashboard" loading="eager"></iframe>
  </div>
</div>

<script>
(function () {
  'use strict';
  var frame = document.getElementById('wbFrame');
  var loading = document.getElementById('wbLoading');

  // Best-effort: hide the embedded page's own topbar launcher and back
  // button so there's no doubled nav chrome inside the frame — same
  // "same-origin only, wrapped in try/catch, silently skipped if it ever
  // fails" precedent this app's own now-removed home.html already
  // established for embedding a real page inside another.
  function tameFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      var style = doc.createElement('style');
      style.textContent = '.tb-launcher, .bh-back-btn { display: none !important; }';
      doc.head.appendChild(style);
    } catch (e) { /* cross-origin or not-yet-ready — ignore */ }
  }

  frame.addEventListener('load', function () {
    tameFrame();
    if (loading) loading.style.opacity = '0';
    setTimeout(tameFrame, 400); // catch late-rendered nav markup
  });
})();
</script>

</body>
</html>
