  function editorKeys(e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key === '.') { e.preventDefault(); openComposition(S.route.id); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      var n = D().adjacentChapter(S.route.id, e.key === 'ArrowDown' ? 1 : -1);
      if (n) { e.preventDefault(); if (S.editor) S.editor.flush(); go('/w/' + n.id); }
    }
  }

  function renderChapterRail(ch, b, t) {
    var d = D();
    var rail = $('cxWrRail');
    if (!rail) return;
    var scenes = d.scenesForChapter(ch.id);
    var cast = t ? d.charactersForTrilogy(t.id).slice(0, 6) : [];
    var lore = t ? d.loreForTrilogy(t.id).slice(0, 6) : [];

    rail.innerHTML =
      '<div class="cx-rail-card">' +
        '<span class="cx-eyebrow">Scenes</span>' +
        (scenes.length ? scenes.map(function (s) {
          return '<button type="button" class="cx-scene-card" data-sc="' + esc(s.id) + '">' +
            '<span class="cx-scene-card-t">' + esc(s.title) + '</span>' +
            '<span class="cx-scene-card-s">' + esc(d.statusMeta(d.SCENE_STATUSES, s.status).label) +
            (s.goal ? ' · ' + esc(s.goal) : '') + '</span></button>';
        }).join('') : '<p class="cx-mini-s" style="text-transform:none;letter-spacing:0">No scenes mapped.</p>') +
        '<button type="button" class="cx-add-row" style="margin:8px 0 0" data-newsc="1">+ Scene</button>' +
      '</div>' +
      '<div class="cx-rail-card">' +
        '<span class="cx-eyebrow">Revision notes</span>' +
        '<textarea class="cx-rail-note" id="cxRailNotes" rows="3" placeholder="What still needs fixing here…">' + esc(ch.notes) + '</textarea>' +
      '</div>' +
      (cast.length ? '<div class="cx-rail-card"><span class="cx-eyebrow">Cast</span>' +
        cast.map(function (c) { return '<div class="cx-scene-card-s" style="padding:3px 0">' + esc(c.icon || '🎭') + ' ' + esc(c.name) + ' · ' + esc(c.role) + '</div>'; }).join('') + '</div>' : '') +
      (lore.length ? '<div class="cx-rail-card"><span class="cx-eyebrow">Lore</span>' +
        lore.map(function (l) { return '<div class="cx-scene-card-s" style="padding:3px 0">' + esc(l.title) + '</div>'; }).join('') + '</div>' : '');

    on(rail, '[data-sc]', 'click', function () { openSceneModal(this.dataset.sc, ch.id); });
    on(rail, '[data-newsc]', 'click', function () { openSceneModal(null, ch.id); });
    var notes = $('cxRailNotes');
    if (notes) {
      autosize(notes);
      notes.addEventListener('input', function () { autosize(this); });
      notes.addEventListener('blur', function () { d.Chapters.update(ch.id, { notes: this.value }); });
    }
  }

  function openChapterModal(id, bookId) {
    var d = D();
    var c = id ? d.Chapters.get(id) : null;
    var isNew = !c;
    if (isNew) c = { title: '', label: '', icon: '', headerArt: '', headerArtPos: 50, status: 'outline', pov: '', location: '', summary: '', notes: '', wordGoal: 0, revisionStatus: 'not started', actId: '' };
    var acts = [{ id: '', label: 'Unbound' }].concat(d.actsForBook(bookId).map(function (a) { return { id: a.id, label: a.title }; }));
    openModal({
      title: isNew ? 'New chapter' : 'Chapter details',
      wide: true,
      body:
        '<div class="cx-field-row">' + fieldText('Title', 'title', c.title) + fieldText('Label', 'label', c.label, 'e.g. Chapter Twelve') + '</div>' +
        '<div class="cx-field-row">' + fieldSelect('Act', 'actId', c.actId, acts) + fieldSelect('Status', 'status', c.status, d.CHAPTER_STATUSES) + '</div>' +
        '<div class="cx-field-row">' + fieldText('POV', 'pov', c.pov) + fieldText('Location', 'location', c.location) + '</div>' +
        fieldArea('Summary', 'summary', c.summary, 'One line: what changes in this chapter?', 2) +
        fieldArea('Revision notes', 'notes', c.notes, '', 3) +
        '<div class="cx-field-row">' + fieldNum('Word goal', 'wordGoal', c.wordGoal) +
        fieldSelect('Revision', 'revisionStatus', c.revisionStatus, d.REVISION_STATUSES) + '</div>' +
        fieldImage('Header art', 'headerArt', c.headerArt) +
        fieldNum('Header art focal point (0–100)', 'headerArtPos', c.headerArtPos) +
        fieldIcon('Icon', 'icon', c.icon),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);
        if (!f.title.trim()) { toast('Give the chapter a title'); return false; }
        if (isNew) { f.bookId = bookId; f.order = d.nextOrder(d.chaptersForBook(bookId)); d.Chapters.add(f); }
        else d.Chapters.update(id, f);
        toast('Saved');
      },
      onDelete: isNew ? null : function () {
        var b = d.Chapters.get(id);
        var back = b ? b.bookId : '';
        d.removeChapter(id);
        toast('Chapter deleted');
        if (S.route.name === 'write') go('/b/' + back, true);
      },
      deleteConfirm: 'Delete this chapter and everything written in it?'
    });
  }

        slider('scrim', 'Darkness behind the words', prefs.scrim, 0, 0.92, 0.02) +
        slider('blur', 'Panel blur', prefs.blur, 0, 26, 1) +
        slider('vignette', 'Vignette', prefs.vignette, 0, 1, 0.02) +
        slider('textGlow', 'Text halo', prefs.textGlow, 0, 1, 0.02) +
        slider('measure', 'Line width', prefs.measure, 34, 92, 1) +
        slider('fontSize', 'Text size', prefs.fontSize, 15, 34, 1) +
        slider('lineHeight', 'Line height', prefs.lineHeight, 1.4, 2.6, 0.05) +
        '<label class="cx-mini" style="cursor:pointer;gap:10px;margin-bottom:var(--sp-2)">' +
          '<input type="checkbox" id="cxCompPanelOn"' + (prefs.panel ? ' checked' : '') + ' style="accent-color:var(--cx-gilt);width:16px;height:16px;flex:none">' +
          '<span><span class="cx-mini-t">Frosted panel</span><span class="cx-mini-s">A soft plate under the text</span></span>' +
        '</label>' +
        '<label class="cx-mini" style="cursor:pointer;gap:10px;margin-bottom:var(--sp-2)">' +
          '<input type="checkbox" id="cxCompTypeOn"' + (prefs.typewriter ? ' checked' : '') + ' style="accent-color:var(--cx-gilt);width:16px;height:16px;flex:none">' +
          '<span><span class="cx-mini-t">Typewriter scroll</span><span class="cx-mini-s">Keeps the live line centred</span></span>' +
        '</label>' +
        '<label class="cx-mini" style="cursor:pointer;gap:10px;margin-bottom:var(--sp-5)">' +
          '<input type="checkbox" id="cxCompSerifOn"' + (prefs.serif ? ' checked' : '') + ' style="accent-color:var(--cx-gilt);width:16px;height:16px;flex:none">' +
          '<span><span class="cx-mini-t">Serif</span><span class="cx-mini-s">Off switches to the interface sans</span></span>' +
        '</label>' +
        '<div class="cx-field-row">' + fieldNum('Sprint goal (words)', 'sprintWords', prefs.sprintWords) +
        fieldNum('Timer (minutes)', 'timerMinutes', prefs.timerMinutes) + '</div>' +
        '<button type="button" class="cx-btn cx-btn-sm" id="cxCompPanelClose" style="width:100%">Done</button>' +
      '</aside>';

    root.classList.add('show');
    root.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    var ta = $('cxCompText');
    ta.value = ch.content;

    var startWords = d.wordCount(ch.content);
    var startedAt = Date.now();

    S.comp = createSession(ch, ta, function (r) {
      var read = $('cxCompRead');
      if (read) read.innerHTML = '<b>' + d.fmtWords(r.words) + '</b> words';
      var sp = $('cxCompSprint');
      var p = d.getCompositionPrefs();
      if (sp && p.sprintWords > 0) {
        var done = Math.max(0, r.words - startWords);
        sp.innerHTML = '<b>' + d.fmtWords(done) + '</b> / ' + d.fmtWords(p.sprintWords) + ' sprint';
      }
    });
    S.comp.mode = 'composition';

    applyComposition();
    autosizeComp();
    ta.addEventListener('input', autosizeComp);
    ta.focus();
    try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}

    // Chrome auto-hide: the controls go away while writing and come back
    // the moment the pointer or a non-typing key moves.
    var idleTimer = null;
    function wake() {
      root.classList.remove('is-idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { root.classList.add('is-idle'); }, 2600);
    }
    root.addEventListener('pointermove', wake);
    root.addEventListener('pointerdown', wake);
    ta.addEventListener('input', function () { root.classList.add('is-idle'); clearTimeout(idleTimer); });
    wake();

    var clock = $('cxCompClock');
    var tick = setInterval(function () {
      if (!clock) return;
      var mins = Math.floor((Date.now() - startedAt) / 60000);
      var p = d.getCompositionPrefs();
      var left = (p.timerMinutes || 0) - mins;
      clock.textContent = p.timerMinutes > 0
        ? (left > 0 ? left + ' min left' : 'Sprint complete')
        : mins + ' min';
    }, 5000);

    function typewriter() {
      if (!d.getCompositionPrefs().typewriter) return;
      var stage = $('cxCompStage');
      if (!stage) return;
      // Approximate the caret line from the text before it, then hold it
      // in the middle of the stage.
      var before = ta.value.slice(0, ta.selectionStart).split('\n').length;
      var lineH = parseFloat(getComputedStyle(ta).lineHeight) || 34;
      var target = ta.offsetTop + before * lineH - stage.clientHeight / 2;
      stage.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    }
    ta.addEventListener('keyup', typewriter);
    ta.addEventListener('click', typewriter);

    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); closeComposition(); }
      else if ((e.ctrlKey || e.metaKey) && e.key === '.') { e.preventDefault(); closeComposition(); }
    }
    document.addEventListener('keydown', onKey);

    $('cxCompExit').addEventListener('click', closeComposition);
    $('cxCompSettings').addEventListener('click', function () { $('cxCompPanel').classList.add('show'); wake(); });
    $('cxCompPanelClose').addEventListener('click', function () { $('cxCompPanel').classList.remove('show'); });
    on(root, '[data-scene]', 'click', function () {
      d.saveCompositionPrefs({ sceneId: this.dataset.scene });
      Array.prototype.forEach.call(root.querySelectorAll('[data-scene]'), function (n) { n.classList.remove('is-on'); });
      this.classList.add('is-on');
      $('cxCompOwnFields').style.display = this.dataset.scene === 'custom' ? 'block' : 'none';
      applyComposition();
    });
    on(root, '[data-slider]', 'input', function () {
      var patch = {};
      patch[this.dataset.slider] = Number(this.value);
      d.saveCompositionPrefs(patch);
      applyComposition();
    });
    wireFields(root);
    on(root, '[data-f="customUrl"]', 'change', function () {
      d.saveCompositionPrefs({ customUrl: this.value });
      applyComposition();
    });
    ['cxCompMotionOn:motion', 'cxCompPanelOn:panel', 'cxCompTypeOn:typewriter', 'cxCompSerifOn:serif'].forEach(function (pair) {
      var parts = pair.split(':');
      var node = $(parts[0]);
      if (node) node.addEventListener('change', function () {
        var patch = {}; patch[parts[1]] = this.checked;
        d.saveCompositionPrefs(patch);
        applyComposition();
      });
    });
    on(root, '[data-f="sprintWords"], [data-f="timerMinutes"]', 'change', function () {
      var patch = {}; patch[this.dataset.f] = Number(this.value) || 0;
      d.saveCompositionPrefs(patch);
      S.comp.readouts();
    });

    S.comp.teardown = function () {
      clearInterval(tick);
      clearTimeout(idleTimer);
      document.removeEventListener('keydown', onKey);
    };
  }

  function slider(name, label, value, min, max, step) {
    return '<label class="cx-slider"><span>' + esc(label) + '</span>' +
      '<input type="range" data-slider="' + name + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '"></label>';
  }

  function autosizeComp() {
    var ta = $('cxCompText');
    if (!ta) return;
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, window.innerHeight * 0.56) + 'px';
  }

  // ------------------------------------------------------------
  // Particle field. One canvas, one rAF loop, torn down with the mode.
  // Everything is drawn locally, so a scene is on screen in the first
  // frame and stays identical with or without a network.
  // ------------------------------------------------------------
  var fx = { raf: 0, particles: [], cfg: null, canvas: null, ctx: null, w: 0, h: 0, t: 0 };

  function fxStop() {
    if (fx.raf) cancelAnimationFrame(fx.raf);
    fx.raf = 0; fx.particles = []; fx.cfg = null;
    if (fx.ctx && fx.canvas) fx.ctx.clearRect(0, 0, fx.canvas.width, fx.canvas.height);
  }

  function fxStart(cfg) {
    fxStop();
    var canvas = $('cxCompCanvas');
    if (!canvas || !cfg) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    fx.canvas = canvas;
    fx.ctx = canvas.getContext('2d');
    fx.cfg = cfg;

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      fx.w = canvas.clientWidth; fx.h = canvas.clientHeight;
      canvas.width = Math.round(fx.w * dpr);
      canvas.height = Math.round(fx.h * dpr);
      fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    fx.onResize = resize;
    window.addEventListener('resize', resize);

    function seed(p, initial) {
      p.x = Math.random() * (fx.w + 200) - 100;
      // Falling scenes enter above the fold, rising ones below it.
      p.y = initial ? Math.random() * fx.h : (cfg.speed > 0 ? -40 : fx.h + 40);
      p.len = cfg.minLen + Math.random() * (cfg.maxLen - cfg.minLen);
      p.r = cfg.size * (0.5 + Math.random() * 0.9);
      p.vy = cfg.speed * (0.6 + Math.random() * 0.85);
      p.vx = cfg.drift * (0.4 + Math.random() * 1.2);
      p.phase = Math.random() * Math.PI * 2;
      p.a = cfg.alpha * (0.35 + Math.random() * 0.75);
      return p;
    }
    for (var i = 0; i < cfg.count; i++) fx.particles.push(seed({}, true));

    var ctx = fx.ctx;
    function frame() {
      fx.t += 0.016;
      ctx.clearRect(0, 0, fx.w, fx.h);
      for (var i = 0; i < fx.particles.length; i++) {
        var p = fx.particles[i];
        p.y += p.vy;
        p.x += p.vx + (cfg.sway ? Math.sin(fx.t * 0.6 + p.phase) * cfg.sway * 0.014 : 0);

        if (cfg.kind === 'streak') {
          ctx.strokeStyle = 'rgba(' + cfg.color + ',' + p.a.toFixed(3) + ')';
          ctx.lineWidth = p.r;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 1.4, p.y - p.len);
          ctx.stroke();
        } else if (cfg.kind === 'cloud') {
          var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, cfg.size);
          g.addColorStop(0, 'rgba(' + cfg.color + ',' + p.a.toFixed(3) + ')');
          g.addColorStop(1, 'rgba(' + cfg.color + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(p.x - cfg.size, p.y - cfg.size, cfg.size * 2, cfg.size * 2);
        } else if (cfg.kind === 'glow') {
          var twinkle = 0.6 + Math.sin(fx.t * 1.4 + p.phase) * 0.4;
          var g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
          g2.addColorStop(0, 'rgba(' + cfg.color + ',' + (p.a * twinkle).toFixed(3) + ')');
          g2.addColorStop(1, 'rgba(' + cfg.color + ',0)');
          ctx.fillStyle = g2;
          ctx.fillRect(p.x - p.r * 4, p.y - p.r * 4, p.r * 8, p.r * 8);
        } else {
          ctx.fillStyle = 'rgba(' + cfg.color + ',' + p.a.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        var pad = cfg.kind === 'cloud' ? cfg.size : 60;
        if ((p.vy > 0 && p.y > fx.h + pad) || (p.vy < 0 && p.y < -pad) || p.x < -pad - 120 || p.x > fx.w + pad + 120) {
          seed(p, false);
        }
      }
      fx.raf = requestAnimationFrame(frame);
    }
    fx.raf = requestAnimationFrame(frame);
  }

  function applyComposition() {
    var d = D();
    var p = d.getCompositionPrefs();
    var scene = d.ambientScene(p.sceneId);
    var root = $('cxComp');
    if (!root || !root.classList.contains('show')) return;

    $('cxCompCss').style.backgroundImage = scene.layers.join(', ');
    $('cxCompFx').className = 'cx-comp-layer cx-comp-fx fx-' + scene.fx + (p.motion ? '' : ' is-still');
    $('cxCompTint').style.background = scene.tint;
    $('cxCompScrim').style.opacity = String(d.clamp(p.scrim / 0.92, 0, 1));
    $('cxCompVig').style.opacity = String(p.vignette);
    root.classList.toggle('cx-comp-panelbg', !!p.panel);
    root.classList.toggle('is-still', !p.motion);

    var col = $('cxCompCol');
    col.style.setProperty('--cxc-measure', p.measure + 'ch');
    $('cxCompPlate').style.setProperty('--cxc-blur', p.blur + 'px');
    var ta = $('cxCompText');
    ta.style.setProperty('--cxc-size', p.fontSize + 'px');
    ta.style.setProperty('--cxc-lh', String(p.lineHeight));
    ta.style.setProperty('--cxc-glow', String(p.textGlow));
    ta.style.setProperty('--cxc-font', p.serif ? 'var(--cx-prose)' : 'var(--cx-ui)');

    // Your own photo or video, when the custom scene is chosen. Kind is
    // sniffed from the extension so one field takes either.
    var own = $('cxCompOwn');
    own.innerHTML = '';
    if (scene.custom && d.isValidMediaUrl(p.customUrl)) {
      if (/\.(mp4|webm|ogv|mov)(\?|$)/i.test(p.customUrl)) {
        var v = document.createElement('video');
        v.className = 'cx-comp-own-media';
        v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
        v.src = p.customUrl;
        v.onerror = function () { own.innerHTML = '<div class="cx-comp-own-fail">That video could not be loaded.</div>'; };
        own.appendChild(v);
        v.play().catch(function () {});
      } else {
        var img = document.createElement('img');
        img.className = 'cx-comp-own-media';
        img.src = p.customUrl;
        img.alt = '';
        img.onerror = function () { own.innerHTML = '<div class="cx-comp-own-fail">That image could not be loaded.</div>'; };
        own.appendChild(img);
      }
    }

    fxStart(p.motion ? d.FX_CONFIG[scene.fx] : null);
  }

  function closeComposition() {
    var root = $('cxComp');
    fxStop();
    if (fx.onResize) { window.removeEventListener('resize', fx.onResize); fx.onResize = null; }
    if (S.comp) {
      if (S.comp.teardown) S.comp.teardown();
      S.comp.destroy();
      S.comp = null;
    }
    root.classList.remove('show', 'is-idle', 'cx-comp-panelbg');
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML = '';
    document.body.style.overflow = '';
    render();
  }

  // ============================================================
  // §COMPILE — print-formatted view + window.print(), plus plain
  // downloads. No PDF byte generator, per this app's own precedent.
  // ============================================================
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function openCompile(scope, id) {
    var d = D();
    var b = scope === 'book' ? d.Books.get(id) : null;
    var scopes = [];
    if (b) {
      var t = d.Trilogies.get(b.trilogyId);
      scopes.push({ id: 'book:' + b.id, label: 'This book — ' + b.title });
      d.actsForBook(b.id).forEach(function (a) { scopes.push({ id: 'act:' + a.id, label: a.title + ' only' }); });
      if (t) scopes.push({ id: 'trilogy:' + t.id, label: 'The whole trilogy — ' + t.title });
    }
    openModal({
      title: 'Compile the manuscript',
      body:
        fieldSelect('What to compile', 'scope', 'book:' + (b ? b.id : ''), scopes) +
        '<p class="cx-mini-s" style="text-transform:none;letter-spacing:0;margin:0 0 var(--sp-4)">' +
        'PDF opens your browser\'s print dialog — choose “Save as PDF”. Italics, bold and scene breaks are rendered; ' +
        'each chapter starts on a fresh page.</p>' +
        '<div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">' +
          '<button type="button" class="cx-btn cx-btn-gilt" data-fmt="pdf">PDF / Print</button>' +
          '<button type="button" class="cx-btn" data-fmt="txt">.txt</button>' +
          '<button type="button" class="cx-btn" data-fmt="md">.md</button>' +
          '<button type="button" class="cx-btn" data-fmt="html">.html</button>' +
        '</div>',
      onMount: function (root) {
        on(root, '[data-fmt]', 'click', function () {
          var pair = String(root.querySelector('[data-f="scope"]').value).split(':');
          var sc = pair[0], sid = pair[1];
          var title = sc === 'book' ? (d.Books.get(sid) || {}).title
            : sc === 'act' ? (d.Acts.get(sid) || {}).title
            : (d.Trilogies.get(sid) || {}).title;
          title = (title || 'manuscript').replace(/[^\w\s-]/g, '').trim() || 'manuscript';
          var fmt = this.dataset.fmt;
          if (fmt === 'txt') return download(title + '.txt', d.compileToText(sc, sid));
          if (fmt === 'md') return download(title + '.md', d.compileToMarkdown(sc, sid), 'text/markdown;charset=utf-8');
          if (fmt === 'html') {
            return download(title + '.html',
              '<!doctype html><meta charset="utf-8"><title>' + esc(title) + '</title>' +
              '<style>body{font:12pt/2 Georgia,serif;max-width:6.5in;margin:1in auto;color:#111}' +
              'h1,h2,h3{font-weight:400;text-align:center;letter-spacing:.08em;text-transform:uppercase}' +
              'p{margin:0;text-indent:.5in}.cx-scene-break{text-align:center;margin:.3in 0;letter-spacing:.4em;text-indent:0}</style>' +
              d.compileToPrintHtml(sc, sid), 'text/html;charset=utf-8');
          }
          $('cxPrintView').innerHTML = d.compileToPrintHtml(sc, sid);
          setTimeout(function () { window.print(); }, 60);
        });
      }
    });
  }

  // ============================================================
  // BOOT
  // ============================================================
  window.addEventListener('hashchange', function () { runSafely(render, 'hashchange'); });

  if (window.initCloudSync) {
    window.initCloudSync({
      appKey: 'codex',
      syncedPrefixes: ['cdx:'],
      onApplied: function () { refreshCurrentView(); }
    });
  }

  window.addEventListener('cdx:save', function (e) {
    if (e.detail && e.detail.ok === false) toast('Save failed — storage may be full');
  });

  // ------------------------------------------------------------
  // §HIDE-FLUSH — the phone path.
  //
  // A writing session commits on an 800ms debounce and on blur. Neither
  // happens when you switch apps mid-sentence: the textarea keeps focus, so
  // no blur fires, and the OS may discard the page before the debounce does.
  // beforeunload never fires on iOS and pagehide only fires on a real
  // navigation, so `hidden` is the last reliable moment to get a paragraph
  // out of the box and into storage. Losing eight hundred milliseconds of a
  // manuscript is not acceptable, and it is exactly the case that happens
  // most: you stop typing because something else demanded the phone.
  //
  // commit() is a no-op when the text is unchanged, so this is free.
  // ------------------------------------------------------------
  function flushWriting() {
    if (S.editor) runSafely(function () { S.editor.flush(); }, 'hide flush editor');
    if (S.comp) runSafely(function () { S.comp.flush(); }, 'hide flush composition');
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushWriting();
  });
  window.addEventListener('pagehide', flushWriting);

  function boot() {
    // The spine lives outside #cxRail so it survives the rail's repaints;
    // it only needs binding once.
    $('cxRailSpine').addEventListener('click', function () { setRailCollapsed(false); });
    applyRailCollapsed();
    render();
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && LocalStoreIDB.ready) {
      LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); });
    } else {
      runSafely(boot, 'boot');
    }
  });

  window.__cxRefresh = refreshCurrentView;

  // The router calls these names; the sections above define the bodies.
  function renderBook() { return renderBookImpl(); }
  function renderWrite() { return renderWriteImpl(); }
  function renderGlobalPrompts(h) { return renderGlobalPromptsImpl(h); }
  function renderGlobalStats(h) { return renderGlobalStatsImpl(h); }

})();
</script>

</body>
