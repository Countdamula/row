      if (wch) { book = d.Books.get(wch.bookId) || book; }
    }
    if (book && !tri) tri = d.Trilogies.get(book.trilogyId);
    var chapter = d.Chapters.get(ui.lastChapterId);
    if (chapter && book && chapter.bookId !== book.id) {
      chapter = book.currentChapterId ? d.Chapters.get(book.currentChapterId) : null;
    }

    // Emoji rather than typographic dingbats: ◷ and ✒ fall back to a
    // tofu box on Windows, which is what the rail was showing.
    var items = [
      { icon: '📚', label: 'The Shelf', hash: '/', on: r.name === 'home' && r.tab === 'shelf' },
      { icon: '🪶', label: 'Prompt Database', hash: '/prompts', on: r.name === 'home' && r.tab === 'prompts' },
      { icon: '📊', label: 'Statistics', hash: '/stats', on: r.name === 'home' && r.tab === 'stats' },
      { sep: true },
      { icon: tri ? (tri.icon || '📖') : '📖', label: tri ? tri.title : 'No trilogy open',
        hash: tri ? '/t/' + tri.id : '', on: r.name === 'trilogy' },
      { icon: book ? (book.icon || '📕') : '📕', label: book ? book.title : 'No book open',
        hash: book ? '/b/' + book.id : '', on: r.name === 'book' },
      { icon: '✍️', label: chapter ? 'Write — ' + chapter.title : 'Nothing to write yet',
        hash: chapter ? '/w/' + chapter.id : '', on: r.name === 'write' },
      { sep: true },
      { icon: '＋', label: 'New trilogy', act: 'new' }
    ];

    // The fold control heads the rail, above everything it folds away.
    $('cxRail').innerHTML =
      '<button type="button" class="cx-rail-btn cx-rail-fold" id="cxRailFold" ' +
        'aria-controls="cxRail" aria-expanded="true" aria-label="Hide the rail">' +
        '<span class="cx-rail-ico" aria-hidden="true">&#x2039;</span>' +
        '<span class="cx-rail-tip">Hide the rail</span></button>' +
      '<span class="cx-rail-sep"></span>' +
      items.map(function (i) {
        if (i.sep) return '<span class="cx-rail-sep"></span>';
        var dis = (!i.hash && !i.act) ? ' disabled' : '';
        return '<button type="button" class="cx-rail-btn' + (i.on ? ' is-on' : '') + '"' + dis +
          (i.hash ? ' data-hash="' + esc(i.hash) + '"' : '') +
          (i.act ? ' data-act="' + esc(i.act) + '"' : '') +
          ' aria-label="' + esc(i.label) + '">' +
          '<span class="cx-rail-ico" aria-hidden="true">' + i.icon + '</span>' +
          '<span class="cx-rail-tip">' + esc(i.label) + '</span></button>';
      }).join('');
    on($('cxRail'), '[data-hash]', 'click', function () { go(this.dataset.hash); });
    on($('cxRail'), '[data-act="new"]', 'click', openNewTrilogy);
    $('cxRailFold').addEventListener('click', function () { setRailCollapsed(true); });
    applyRailCollapsed();
  }

  // Folding the rail is not just hiding it: --cx-rail-w is the left
  // margin every hero tier and the parchment sheet are measured against,
  // so it drops at the same time and the page takes the gutter back.
  // The wordmark is fitted to that width, so it has to be re-measured.
  function applyRailCollapsed() {
    var off = !!D().getSidebarPrefs().railCollapsed;
    document.documentElement.classList.toggle('cx-rail-off', off);
    var fold = $('cxRailFold');
    if (fold) fold.setAttribute('aria-expanded', off ? 'false' : 'true');
    var spine = $('cxRailSpine');
    if (spine) spine.setAttribute('aria-expanded', off ? 'false' : 'true');
  }
  function setRailCollapsed(off) {
    D().saveSidebarPrefs({ railCollapsed: !!off });
    applyRailCollapsed();
    fitAllHeroType();
    // Focus follows the fold, so a keyboard user is never left holding a
    // control that just slid off the screen.
    var next = off ? $('cxRailSpine') : $('cxRailFold');
    if (next) next.focus();
  }

  // Cover / art upload — one shared file input for every image field in
  // the page, exactly like the older dashboards. Compresses first, then
  // hands the data URL to PhotoStore so the synced blob only ever holds
  // a short hosted URL.
  function pickImage(onUrl) {
    S.fileTarget = onUrl;
    var input = $('cxFileInput');
    input.value = '';
    input.click();
  }
  $('cxFileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    var cb = S.fileTarget;
    if (!file || !cb) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      D().compressImageDataUrl(ev.target.result, 1600, 0.82).then(function (small) {
        if (window.PhotoStore && PhotoStore.upload) {
          PhotoStore.upload(small, function (hosted) { cb(hosted || small); });
        } else { cb(small); }
      });
    };
    reader.readAsDataURL(file);
  });

  // ------------------------------------------------------------
  // MODAL ENGINE — one modal element reused for every dialog, so a new
  // form never means new static markup and a new set of top-level
  // listeners that silently throw at boot if an id is mistyped.
  // ------------------------------------------------------------
  function openModal(opts) {
    // opts: { title, wide, body(html), onMount(root), onSave(root)->bool, onDelete, saveLabel }
    var bg = $('cxModalBg'), m = $('cxModal');
    m.className = 'cx-modal' + (opts.wide ? ' cx-modal-wide' : '');
    m.innerHTML = '<h3>' + esc(opts.title || '') + '</h3>' +
      '<div id="cxModalBody">' + (opts.body || '') + '</div>' +
      '<div class="cx-modal-actions">' +
      (opts.onDelete ? '<button type="button" class="cx-btn cx-btn-sm cx-btn-danger" id="cxModalDelete">Delete</button>' : '') +
      '<span class="cx-spacer"></span>' +
      '<button type="button" class="cx-btn cx-btn-sm" id="cxModalCancel">Cancel</button>' +
      (opts.onSave ? '<button type="button" class="cx-btn cx-btn-sm cx-btn-gilt" id="cxModalSave">' + esc(opts.saveLabel || 'Save') + '</button>' : '') +
      '</div>';
    bg.classList.add('show');

    function close() { bg.classList.remove('show'); m.innerHTML = ''; }
    $('cxModalCancel').addEventListener('click', close);
    if (opts.onSave) {
      $('cxModalSave').addEventListener('click', function () {
        var ok = opts.onSave(m);
        if (ok !== false) { close(); refreshCurrentView(); }
      });
    }
    if (opts.onDelete) {
      $('cxModalDelete').addEventListener('click', function () {
        if (!confirm(opts.deleteConfirm || 'Delete this permanently? This cannot be undone.')) return;
        opts.onDelete();
        close(); refreshCurrentView();
      });
    }
    bg.onclick = function (e) { if (e.target === bg) close(); };
    document.addEventListener('keydown', function onEsc(e) {
      if (e.key === 'Escape' && bg.classList.contains('show')) { close(); document.removeEventListener('keydown', onEsc); }
      else if (!bg.classList.contains('show')) { document.removeEventListener('keydown', onEsc); }
    });
    if (opts.onMount) runSafely(function () { opts.onMount(m); }, 'modal mount');
    var first = m.querySelector('input,textarea,select');
    if (first) first.focus();
    return { close: close };
  }

  function fieldText(label, name, value, ph) {
    return '<div class="cx-field"><label class="cx-label" for="cxf_' + name + '">' + esc(label) + '</label>' +
      '<input class="cx-input" id="cxf_' + name + '" data-f="' + name + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '"></div>';
  }
  function fieldArea(label, name, value, ph, rows) {
    return '<div class="cx-field"><label class="cx-label" for="cxf_' + name + '">' + esc(label) + '</label>' +
      '<textarea class="cx-textarea" id="cxf_' + name + '" data-f="' + name + '" rows="' + (rows || 3) + '" placeholder="' + esc(ph || '') + '">' + esc(value || '') + '</textarea></div>';
  }
  function fieldNum(label, name, value, ph) {
    return '<div class="cx-field"><label class="cx-label" for="cxf_' + name + '">' + esc(label) + '</label>' +
      '<input class="cx-input" type="number" id="cxf_' + name + '" data-f="' + name + '" value="' + esc(value == null ? '' : value) + '" placeholder="' + esc(ph || '') + '"></div>';
  }
  function fieldDate(label, name, value) {
    return '<div class="cx-field"><label class="cx-label" for="cxf_' + name + '">' + esc(label) + '</label>' +
      '<input class="cx-input" type="date" id="cxf_' + name + '" data-f="' + name + '" value="' + esc(value || '') + '"></div>';
  }
  function fieldSelect(label, name, value, options) {
    var opts = options.map(function (o) {
      var id = (typeof o === 'string') ? o : o.id;
      var lbl = (typeof o === 'string') ? o : o.label;
      return '<option value="' + esc(id) + '"' + (id === value ? ' selected' : '') + '>' + esc(lbl) + '</option>';
    }).join('');
    return '<div class="cx-field"><label class="cx-label" for="cxf_' + name + '">' + esc(label) + '</label>' +
      '<select class="cx-select" id="cxf_' + name + '" data-f="' + name + '">' + opts + '</select></div>';
  }
  function fieldIcon(label, name, value) {
    return '<div class="cx-field"><span class="cx-label">' + esc(label) + '</span>' +
      '<div class="cx-iconpick" data-iconpick="' + name + '">' +
      '<button type="button" data-icon=""' + (!value ? ' class="is-on"' : '') + ' title="No icon">·</button>' +
      D().ICON_SET.map(function (ic) {
        return '<button type="button" data-icon="' + esc(ic) + '"' + (ic === value ? ' class="is-on"' : '') + '>' + ic + '</button>';
      }).join('') + '</div><input type="hidden" data-f="' + name + '" value="' + esc(value || '') + '"></div>';
  }
  function fieldImage(label, name, value) {
    return '<div class="cx-field"><span class="cx-label">' + esc(label) + '</span>' +
      '<div class="cx-cover-row">' +
      '<img class="cx-cover-prev" data-prev="' + name + '" src="' + esc(value || '') + '" alt="" onerror="this.removeAttribute(\'src\')">' +
      '<input class="cx-input" data-f="' + name + '" value="' + esc(value || '') + '" placeholder="Paste an image URL, or upload">' +
      '<button type="button" class="cx-btn cx-btn-sm" data-upload="' + name + '">Upload</button>' +
      '</div></div>';
  }
  // Wires the two field types that need behaviour: the icon grid and the
  // image uploader. Called from every onMount that uses them.
  function wireFields(root) {
    on(root, '[data-iconpick] button', 'click', function () {
      var grid = this.closest('[data-iconpick]');
      Array.prototype.forEach.call(grid.querySelectorAll('button'), function (b) { b.classList.remove('is-on'); });
      this.classList.add('is-on');
      grid.parentNode.querySelector('input[type=hidden]').value = this.dataset.icon;
    });
    on(root, '[data-upload]', 'click', function () {
      var name = this.dataset.upload;
      var btn = this;
      btn.textContent = '…';
      pickImage(function (url) {
        var input = root.querySelector('[data-f="' + name + '"]');
        var prev = root.querySelector('[data-prev="' + name + '"]');
        if (input) input.value = url;
        if (prev) prev.src = url;
        btn.textContent = 'Upload';
      });
    });
    on(root, '.cx-cover-row .cx-input', 'input', function () {
      var name = this.dataset.f;
      var prev = root.querySelector('[data-prev="' + name + '"]');
      if (prev) prev.src = this.value;
    });
  }
  function readFields(root) {
    var out = {};
    Array.prototype.forEach.call(root.querySelectorAll('[data-f]'), function (n) {
      var v = n.value;
      if (n.type === 'number') v = v === '' ? 0 : Number(v);
      out[n.dataset.f] = v;
    });
    return out;
  }

    buildHero($('cxHomeHero'), {

  // The Codex banner is house furniture: it is the same photograph every

  function shelfLede(d, book, words) {
    if (!book) return 'Nothing open yet. Pick a trilogy below and start a chapter.';
    var today = d.wordsOnDate(d.todayISO());
    if (today > 0) return today.toLocaleString() + ' words down today. ' + book.title + ' is at ' + words.toLocaleString() + ' of ' + Number(book.targetWords).toLocaleString() + '.';
    var streak = d.writingStreak();
    if (streak > 1) return streak + ' days running. Keep it going — ' + book.title + ' is waiting at ' + words.toLocaleString() + ' words.';
    return book.title + ' sits at ' + words.toLocaleString() + ' words. The next chapter is one click away.';

  function buildWeekStrip() {
    var d = D();
    var names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var days = [];
    var todayIso = d.todayISO();
    // Sunday-first week containing today.
    var now = new Date();
    var start = new Date(now); start.setDate(now.getDate() - now.getDay());
    var max = 1;
    for (var i = 0; i < 7; i++) {
      var dt = new Date(start); dt.setDate(start.getDate() + i);
      var iso = d.toISODate(dt);
      var w = d.wordsOnDate(iso);
      if (w > max) max = w;
      days.push({ n: names[i], d: dt.getDate(), iso: iso, w: w });
    }
    return '<div class="cx-p-week">' + days.map(function (x) {
      return '<div class="cx-p-day' + (x.iso === todayIso ? ' is-today' : '') + '" title="' + esc(x.iso) + ' · ' + x.w + ' words">' +
        '<span class="cx-p-day-n">' + x.n + '</span>' +
        '<span class="cx-p-day-d">' + x.d + '</span>' +
        '<span class="cx-p-day-bar"><i style="width:' + Math.round(x.w / max * 100) + '%"></i></span>' +
        '</div>';
    }).join('') + '</div>';
  }

  function buildRecentFeed() {
    var d = D();
    // updatedAt is only stamped once a chapter has been edited *in* the
    // Codex, so fall back to createdAt for anything with prose already
    // in it — otherwise an imported or seeded book shows nothing here.
    var chs = d.Chapters.list().filter(function (c) { return d.wordCount(c.content) > 0; })
      .sort(function (a, b) {
        return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
      })
      .slice(0, 5);
    if (!chs.length) return '<p class="cx-p-lede" style="margin:0">Nothing written yet. The first line is the hard one.</p>';
    return chs.map(function (c) {
      var b = d.Books.get(c.bookId);
      var words = d.wordCount(c.content);
      var excerpt = d.mdToPlain(c.content).replace(/\s+/g, ' ').trim().slice(0, 150);
      return '<button type="button" class="cx-p-feed-row" data-feedch="' + esc(c.id) + '">' +
        '<span class="cx-p-feed-av">' + esc(c.icon || '✎') + '</span>' +
        '<span class="cx-p-feed-b">' +
          '<span class="cx-p-feed-t">' + esc(c.title) + '</span>' +
          (excerpt ? '<span class="cx-p-feed-q">' + esc(excerpt) + '…</span>' : '') +
          '<span class="cx-p-feed-m"><b>' + (b ? esc(b.title) : '') + '</b><span>' + d.fmtWords(words) + ' words</span></span>' +
        '</span></button>';
    }).join('');
  }

  // ============================================================
  // §TRILOGY
  // ============================================================
  function renderTrilogy() {
    var d = D();
    var t = d.Trilogies.get(S.route.id);
    if (!t) { go('/', true); return; }
    d.saveUiState({ lastTrilogyId: t.id });

    var books = d.booksForTrilogy(t.id);
    var words = d.trilogyWordCount(t.id);
    var target = d.trilogyTargetWords(t.id);

    var triChapters = d.Chapters.list().filter(function (c) {
      return books.some(function (b) { return b.id === c.bookId; });
    }).length;
    buildHero($('cxTriHero'), {
      title: t.title,
      typeVw: typeVwFor(t.title),
      // The trilogy banner is house art too — the series' own cover is
      // what the shelf card and the detail spread carry.
      art: d.ART.trilogy, tone: 'forest',
      folio: d.folio(0, triChapters),
      script: 'a trilogy',
      links: {
        left: [{ label: 'The Codex', hash: '/' }, { label: t.genre, hash: '/t/' + t.id }],
        right: [{ label: d.statusMeta(d.TRILOGY_STATUSES, t.status).label, hash: '/t/' + t.id }]
      },
      cols: [
        { n: books.length, l: books.length === 1 ? 'Book' : 'Books' },
        { n: triChapters, l: 'Chapters' },
        { n: d.fmtWords(words), l: 'Words written' },
        { n: d.charactersForTrilogy(t.id).length, l: 'Cast' }
      ],
      ink: target ? Math.round(words / target * 100) + '% of ' + d.fmtCompact(target) : 'no target set',
      quill: d.wordsOnDate(d.todayISO()) > 0,
      markAt: 0, markOf: 0,
      statement: (t.tagline || t.description || '').toUpperCase(),
      scrollWord: 'the books', scrollTo: '#cxTriBody'
    });

    var actions = crumb($('cxTriCrumb'), [{ label: 'The Codex', hash: '/' }, { label: t.title }]);
    actions.innerHTML = '<button type="button" class="cx-btn cx-btn-sm" id="cxTriEdit">Edit trilogy</button>';
    $('cxTriEdit').addEventListener('click', function () { openEditTrilogy(t.id); });

    // The detail spread from photo 2: floating cover on the left with
    // paging arrows, title/attribution/CTA on the right, and a
    // two-column meta plate underneath.
    var lead = books[0];
    var resumeTri = lead ? ((lead.currentChapterId && d.Chapters.get(lead.currentChapterId)) ? lead.currentChapterId
      : ((d.orderedChapters(lead.id)[0] || {}).id || '')) : '';

    // The books are the page's loud beat, so they arrive one after another;
    // the index is DOM order, not position, so a reordered shelf still reads
    // left to right. See §MOTION.
    var bookCards = books.length
      ? '<div class="cx-books">' + books.map(function (b, i) { return buildBookCard(b, i + 1); }).join('') + '</div>'
      : '<div class="cx-empty cx-rise"><div class="cx-empty-glyph">✦</div><p>No books in this trilogy yet.</p><button type="button" class="cx-btn cx-btn-gilt" data-newbook="1">Add the first book</button></div>';

    $('cxTriBody').innerHTML =
      // Beat 2, calm: the cover, then the words, then the actions — three
      // steps and then the section is still.
      '<div class="cx-p-top">' +
        '<div class="cx-rise" style="display:grid;grid-template-columns:34px 1fr;gap:var(--sp-4);align-items:start">' +
          '<div style="display:flex;flex-direction:column;gap:8px;padding-top:var(--sp-6)">' +
            '<button type="button" class="cx-p-iconbtn" data-cyc="-1" title="Previous trilogy" aria-label="Previous trilogy" style="width:32px;height:32px;font-size:12px">↑</button>' +
            '<button type="button" class="cx-p-iconbtn" data-cyc="1" title="Next trilogy" aria-label="Next trilogy" style="width:32px;height:32px;font-size:12px">↓</button>' +
          '</div>' +
          (lead
            ? '<button type="button" class="cx-p-float" data-book="' + esc(lead.id) + '" aria-label="Open ' + esc(lead.title) + '" style="max-width:270px">' +
              '<img src="' + esc(d.coverArtFor(t)) + '" alt="">' +
              '</button>'
            : '<span class="cx-p-float-none" style="max-width:270px;aspect-ratio:3/4;border-radius:6px">' + esc(t.icon || '📖') + '</span>') +
        '</div>' +

        '<div class="cx-rise" style="--cx-rise-i:1">' +
          '<h2 class="cx-h1" style="font-size:clamp(26px,3.4vw,40px)">' + esc(t.title) + '</h2>' +
          (t.subtitle ? '<p class="cx-p-feature-prog" style="margin-top:6px">' + esc(t.subtitle) + '</p>' : '') +
          '<p class="cx-p-feature-prog"><b>' + d.fmtWords(words) + '</b> / ' + d.fmtWords(target) + ' words · ' + books.length + ' books</p>' +
          (t.tagline ? '<p class="cx-prose" style="font-style:italic;margin:var(--sp-4) 0 0;max-width:52ch">' + esc(t.tagline) + '</p>' : '') +
          '<div class="cx-rise" style="--cx-rise-i:2;display:flex;gap:var(--sp-3);align-items:center;margin-top:var(--sp-5);flex-wrap:wrap">' +
            (resumeTri ? '<button type="button" class="cx-p-pill" data-write="' + esc(resumeTri) + '">Start writing ↗</button>' : '') +
            '<button type="button" class="cx-p-iconbtn" data-newbook="1" title="Add a book" aria-label="Add a book">＋</button>' +
            '<button type="button" class="cx-p-iconbtn" data-compiletri="' + esc(t.id) + '" title="Compile the trilogy" aria-label="Compile the trilogy">⤓</button>' +
            '<button type="button" class="cx-p-iconbtn" id="cxTriEdit2" title="Edit the trilogy" aria-label="Edit the trilogy">✎</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Beat 3, still: the plate has no entrance on purpose. It is the rest
      // between the two loud beats, and it is the block you actually read.
      '<div class="cx-p-plate" style="margin-bottom:var(--sp-7)"><div class="cx-p-detail">' +
        '<div>' +
          '<h4 class="cx-p-meta-h">About</h4>' +
          '<p class="cx-p-meta-b">' + esc(t.description || 'No description yet.') + '</p>' +
        '</div>' +
        '<div>' +
          '<h4 class="cx-p-meta-h">Genre</h4><p class="cx-p-meta-b">' + esc(t.genre) + '</p>' +
          '<h4 class="cx-p-meta-h">Status</h4><p class="cx-p-meta-b">' + esc(d.statusMeta(d.TRILOGY_STATUSES, t.status).label) + '</p>' +
          '<h4 class="cx-p-meta-h">Length</h4><p class="cx-p-meta-b">' +
            books.length + ' books · ' +
            d.Chapters.list().filter(function (c) { return books.some(function (b) { return b.id === c.bookId; }); }).length +
            ' chapters · ' + d.fmtWords(words) + ' words written</p>' +
        '</div>' +
      '</div></div>' +

      // Beat 4, loud: the head, then the cards behind it.
      '<div class="cx-p-secrow cx-rise"><h3 class="cx-p-sec">The Books</h3>' +
        '<button type="button" class="cx-btn cx-btn-sm" data-newbook="1">+ Add book</button></div>' +
      bookCards +
      // Beat 5, calm: this rule stays put and the cast arrives as one group.
      '<div class="cx-p-rule"></div>' +
      '<div id="cxTriCast" class="cx-rise"></div>' +
      // Beat 6, the full stop: this rule draws itself, and the lore follows.
      '<div class="cx-p-rule cx-draw"></div>' +
      '<div id="cxTriLore" class="cx-rise"></div>';

    $('cxTriEdit2').addEventListener('click', function () { openEditTrilogy(t.id); });
    on($('cxTriBody'), '[data-compiletri]', 'click', function () { openCompile('trilogy', this.dataset.compiletri); });
    on($('cxTriBody'), '.cx-p-float', 'click', function () { go('/b/' + this.dataset.book); });
    on($('cxTriBody'), '[data-cyc]', 'click', function () {
      var all = d.trilogiesSorted();
      var i = all.findIndex(function (x) { return x.id === t.id; });
      var n = all[(i + Number(this.dataset.cyc) + all.length) % all.length];
      if (n) go('/t/' + n.id);
    });

    on($('cxTriBody'), '[data-newbook]', 'click', function () { openBookModal(null, t.id); });
    on($('cxTriBody'), '[data-book]', 'click', function (e) {
      // The card is the link; the two buttons inside it are not.
      if (e.target.closest('[data-bookedit]') || e.target.closest('[data-resume]')) return;
      go('/b/' + this.dataset.book);
    });
    on($('cxTriBody'), '[data-resume]', 'click', function (e) {
      e.stopPropagation();
      go('/w/' + this.dataset.resume);
    });
    on($('cxTriBody'), '[data-write]', 'click', function (e) {
      e.stopPropagation();
      go('/w/' + this.dataset.write);
    });
    on($('cxTriBody'), '[data-bookedit]', 'click', function (e) {
      e.stopPropagation();
      openBookModal(this.dataset.bookedit, t.id);
    });

    renderCast($('cxTriCast'), t.id);
    renderLore($('cxTriLore'), t.id);

    // Last, once the whole body exists. S.navigated is false when a cloud
    // pull repainted this under a reader, and then nothing may move.
    armReveals($('cxTriBody'), S.navigated);
  }

  // riseAt is the card's place in the stagger; 0 or absent means it arrives
  // with no delay, which is what any other caller would want.
  function buildBookCard(b, riseAt) {
    var d = D();
    var words = d.bookWordCount(b.id);
    var pct = d.bookProgress(b.id);
    var chapters = d.chaptersForBook(b.id).length;
    // Straight back to wherever you left off, or the opening chapter.
    var first = d.orderedChapters(b.id)[0];
    var resume = (b.currentChapterId && d.Chapters.get(b.currentChapterId)) ? b.currentChapterId : (first ? first.id : '');
    // Which turn of the autumn this book's card is washed in. Off position
    // rather than DOM order, and cycling at three, so a fourth book starts
    // the ramp again instead of falling off it. Styling only — see §CARDS.
    var stage = ((Math.max(1, b.position || 1) - 1) % 3) + 1;
    return '<article class="cx-book cx-rise" data-book="' + esc(b.id) + '" data-stage="' + stage + '"' +
      ' style="--cx-rise-i:' + (riseAt || 0) + '" role="link" tabindex="0">' +
      '<div class="cx-book-cover">' +
        (b.cover ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy">' : '<div class="cx-tri-fallback" style="font-size:34px">' + esc(b.icon || '✦') + '</div>') +
        '<span class="cx-book-pos">Book ' + d.romanize(b.position || 1) + '</span>' +
      '</div>' +
      '<div class="cx-book-body">' +
        '<h3 class="cx-book-title">' + esc(b.title) + '</h3>' +
        (b.logline ? '<p class="cx-book-log">' + esc(b.logline) + '</p>' : '') +
        '<div style="display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap">' +
          statusPill(d.BOOK_STATUSES, b.status) +
          '<span class="cx-label">' + chapters + ' ch</span>' +
          '<span class="cx-crumb-spacer"></span>' +
          '<button type="button" class="cx-btn cx-btn-sm cx-btn-icon" data-bookedit="' + esc(b.id) + '" title="Edit book" aria-label="Edit book">✎</button>' +
        '</div>' +
        '<div class="cx-book-foot">' +
          '<div class="cx-book-nums"><span>' + d.fmtWords(words) + ' words</span><span>' + Math.round(pct * 100) + '%</span></div>' +
          meter(pct) +
          (resume ? '<button type="button" class="cx-btn cx-btn-sm cx-btn-rose" data-resume="' + esc(resume) + '" style="width:100%;margin-top:var(--sp-3)">Continue writing →</button>' : '') +
        '</div>' +
      '</div></article>';
  }

    }

        fieldText('Subtitle', 'subtitle', b.subtitle) +
        fieldArea('Logline', 'logline', b.logline, 'One or two sentences: who wants what, and what stands in the way', 2) +
        '<div class="cx-field-row">' + fieldSelect('Status', 'status', b.status, d.BOOK_STATUSES) +
        fieldSelect('Revision', 'revisionStatus', b.revisionStatus, d.REVISION_STATUSES) + '</div>' +
        '<div class="cx-field-row">' + fieldNum('Target word count', 'targetWords', b.targetWords) +
        fieldNum('Daily goal', 'dailyGoal', b.dailyGoal) + '</div>' +

      },

  // ---------- Cast & Lore (the lean worldbuilding pair) ----------
  function renderCast(host, trilogyId) {
    var d = D();

  // ============================================================
  // §TREE — the structure sidebar.
  //
  // One builder, used by both the book page and the manuscript editor,
  // so a chapter reordered in one place is reordered in the other with
  // no second implementation to keep in step. Every drag persists
  // through D().reorderCollection(); cross-act and cross-chapter drags
  // additionally rewrite the parent id from the drop target's dataset.
  // ============================================================
  function statusTone(list, id) { return D().statusMeta(list, id).tone; }

  function buildTree(host, bookId, activeChapterId, onPick) {
    var d = D();
    var prefs = d.getSidebarPrefs();
    var closed = {};
    (prefs.collapsedActIds || []).forEach(function (id) { closed[id] = true; });

    // A numbered outline, the way Novelize lays one out: acts are 1, 2,
    // 3; chapters inside them 1.1, 1.2; scenes 1.1.1. The number is the
    // structure made visible — you can see at a glance how deep in the
    // book a chapter sits without counting rows.
    function chapterRow(c, num) {
      var words = d.wordCount(c.content);
      var scenes = prefs.showScenes ? d.scenesForChapter(c.id) : [];
      return '<div class="cx-ch-wrap" data-chwrap="' + esc(c.id) + '">' +
        '<button type="button" class="cx-ch' + (c.id === activeChapterId ? ' is-active' : '') + '" data-ch="' + esc(c.id) + '">' +
          '<span class="cx-ch-num">' + esc(num) + '</span>' +
          (prefs.showCovers && c.headerArt ? '<img class="cx-ch-thumb" src="' + esc(c.headerArt) + '" alt="">'
            : (prefs.showIcons && c.icon ? '<span class="cx-ch-icon">' + esc(c.icon) + '</span>' : '')) +
          '<span class="cx-ch-title">' + esc(c.title) + '</span>' +
          (prefs.showCounts ? '<span class="cx-ch-words">' + (words ? d.fmtCompact(words) + ' words' : '—') + '</span>' : '') +
          (prefs.showStatus ? '<i class="cx-ch-dot cx-tone-' + statusTone(d.CHAPTER_STATUSES, c.status) + '"></i>' : '') +
        '</button>' +
        (scenes.length
          ? '<div class="cx-sc-list" data-scenesof="' + esc(c.id) + '">' + scenes.map(function (s, si) {
              return '<button type="button" class="cx-sc" data-sc="' + esc(s.id) + '">' +
                '<span class="cx-sc-num">' + esc(num + '.' + (si + 1)) + '</span>' +
                '<span class="cx-sc-title">' + esc(s.title) + '</span></button>';
            }).join('') + '</div>'
          : '<div class="cx-sc-list" data-scenesof="' + esc(c.id) + '"></div>') +
        '</div>';
    }

    function sortChapters(list) {
      if (prefs.sortMode === 'alpha') return list.slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
      if (prefs.sortMode === 'words') return list.slice().sort(function (a, b) { return d.wordCount(b.content) - d.wordCount(a.content); });
      return list;
    }

    var book = d.Books.get(bookId);
    var acts = d.actsForBook(bookId);
    var html = '<header class="cx-tree-head">' +
      '<h4 class="cx-tree-title">' + esc(book ? book.title : 'Manuscript') + '</h4>' +
      '<p class="cx-tree-total">' + d.fmtWords(d.bookWordCount(bookId)) + ' words</p>' +
      '</header>';

    html += acts.map(function (a, ai) {
      var chs = sortChapters(d.chaptersForAct(a.id).filter(function (c) { return c.bookId === bookId; }));
      return '<div class="cx-act' + (closed[a.id] ? ' is-closed' : '') + '" data-act="' + esc(a.id) + '">' +
        '<div class="cx-act-head">' +
          '<button type="button" class="cx-act-caret" data-caret="' + esc(a.id) + '" aria-label="Collapse act">▾</button>' +
          '<span class="cx-act-num">' + (ai + 1) + '</span>' +
          '<span class="cx-act-title">' + (a.icon ? esc(a.icon) + ' ' : '') + esc(a.title) + '</span>' +
          (prefs.showCounts ? '<span class="cx-act-words">' + d.fmtCompact(d.actWordCount(a.id)) + ' words</span>' : '') +
          '<button type="button" class="cx-act-cog" data-actedit="' + esc(a.id) + '" aria-label="Edit act">⋯</button>' +
        '</div>' +
        '<div class="cx-ch-list" data-actlist="' + esc(a.id) + '">' +
          chs.map(function (c, ci) { return chapterRow(c, (ai + 1) + '.' + (ci + 1)); }).join('') +
        '</div>' +
        '<button type="button" class="cx-add-row cx-act-add" data-addch="' + esc(a.id) + '">+ Chapter</button>' +
        '</div>';
    }).join('');

    var loose = sortChapters(d.unboundChapters(bookId));
    html += '<div class="cx-act" data-act="">' +
      '<div class="cx-act-head"><span style="width:14px"></span>' +
        '<span class="cx-act-num">·</span>' +
        '<span class="cx-act-title cx-act-title-loose">Unbound</span>' +
        (loose.length && prefs.showCounts ? '<span class="cx-act-words">' + loose.length + '</span>' : '') +
      '</div>' +
      '<div class="cx-ch-list" data-actlist="">' +
        loose.map(function (c, ci) { return chapterRow(c, '·' + (ci + 1)); }).join('') +
      '</div>' +
      '<button type="button" class="cx-add-row cx-act-add" data-addch="">+ Chapter</button>' +
      '</div>';

    host.className = 'cx-tree' + (prefs.density === 'compact' ? ' cx-tree-compact' : '');
    host.innerHTML = html;

    on(host, '[data-ch]', 'click', function () { onPick(this.dataset.ch); });
    on(host, '[data-sc]', 'click', function (e) { e.stopPropagation(); openSceneModal(this.dataset.sc, null); });
    on(host, '[data-caret]', 'click', function (e) {
      e.stopPropagation();
      var id = this.dataset.caret;
      var list = (d.getSidebarPrefs().collapsedActIds || []).slice();
      var i = list.indexOf(id);
      if (i >= 0) list.splice(i, 1); else list.push(id);
      d.saveSidebarPrefs({ collapsedActIds: list });
      this.closest('.cx-act').classList.toggle('is-closed');
    });
    on(host, '[data-actedit]', 'click', function (e) { e.stopPropagation(); openActModal(this.dataset.actedit, bookId); });
    on(host, '[data-addch]', 'click', function (e) {
      e.stopPropagation();
      var c = d.addChapter(bookId, this.dataset.addch || '');
      toast('Chapter added');
      onPick(c.id, true);
    });

    if (!window.Sortable) return;
    var manual = prefs.sortMode === 'manual';

    Sortable.create(host, {
      animation: 160, handle: '.cx-act-head', draggable: '.cx-act[data-act]:not([data-act=""])',
      ghostClass: 'cx-sortable-ghost', chosenClass: 'cx-sortable-chosen',
      onEnd: function () {
        var ids = Array.prototype.map.call(host.querySelectorAll('.cx-act[data-act]'), function (n) { return n.dataset.act; })
          .filter(Boolean);
        d.reorderCollection(d.Acts, ids);
      }
    });

    Array.prototype.forEach.call(host.querySelectorAll('[data-actlist]'), function (list) {
      Sortable.create(list, {
        animation: 160, group: 'cx-chapters', draggable: '.cx-ch-wrap', disabled: !manual,
        ghostClass: 'cx-sortable-ghost',
        onEnd: function (evt) {
          var newActId = evt.to.dataset.actlist || '';
          var chId = evt.item.dataset.chwrap;
          if (chId) d.Chapters.update(chId, { actId: newActId });
          [evt.to, evt.from].forEach(function (l) {
            var ids = Array.prototype.map.call(l.querySelectorAll('.cx-ch-wrap'), function (n) { return n.dataset.chwrap; });
            d.reorderCollection(d.Chapters, ids);
          });
        }
      });
    });

    Array.prototype.forEach.call(host.querySelectorAll('[data-scenesof]'), function (list) {
      Sortable.create(list, {
        animation: 150, group: 'cx-scenes', draggable: '.cx-sc', disabled: !manual,
        ghostClass: 'cx-sortable-ghost',
        onEnd: function (evt) {
          var newChId = evt.to.dataset.scenesof || '';
          var scId = evt.item.dataset.sc;
          if (scId) d.Scenes.update(scId, { chapterId: newChId });
          [evt.to, evt.from].forEach(function (l) {
            var ids = Array.prototype.map.call(l.querySelectorAll('.cx-sc'), function (n) { return n.dataset.sc; });
            d.reorderCollection(d.Scenes, ids);
          });
        }
      });
    });
  }

  // Drag-to-resize the sidebar. Writes the live value straight to the
  // custom property so the grid tracks the pointer, and only persists on
  // release — a save per pointermove would thrash the synced blob.
  function wireSideGrip(grip) {
    var startX = 0, startW = 0, dragging = false;
    function down(e) {
      dragging = true; startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cx-side-w'), 10) || 268;
      grip.setPointerCapture(e.pointerId);
      document.body.style.userSelect = 'none';
    }
    function move(e) {
      if (!dragging) return;
      var w = D().clamp(startW + (e.clientX - startX), 200, 460);
      document.documentElement.style.setProperty('--cx-side-w', w + 'px');
    }
    function up() {
      if (!dragging) return;
      dragging = false;
      document.body.style.userSelect = '';
      var w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cx-side-w'), 10) || 268;
      D().saveSidebarPrefs({ width: w });
    }
    grip.addEventListener('pointerdown', down);
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
    grip.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      var cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cx-side-w'), 10) || 268;
      var w = D().clamp(cur + (e.key === 'ArrowRight' ? 16 : -16), 200, 460);
      document.documentElement.style.setProperty('--cx-side-w', w + 'px');
      D().saveSidebarPrefs({ width: w });
    });
  }
  function applySidebarWidth() {
    document.documentElement.style.setProperty('--cx-side-w', D().getSidebarPrefs().width + 'px');
  }

  function openSidebarSettings() {
    var d = D();
    var p = d.getSidebarPrefs();
    function toggle(name, label, val, hint) {
      return '<label class="cx-mini" style="cursor:pointer;gap:10px">' +

        '<span style="min-width:0"><span class="cx-mini-t">' + esc(label) + '</span>' +
        '<span class="cx-mini-s">' + esc(hint) + '</span></span></label>';
    }
    openModal({

        '<div class="cx-field-row">' +
          fieldSelect('Density', 'density', p.density, [{ id: 'comfortable', label: 'Comfortable' }, { id: 'compact', label: 'Compact' }]) +
          fieldSelect('Order chapters by', 'sortMode', p.sortMode, [
            { id: 'manual', label: 'Manual (drag to reorder)' },

        '<div class="cx-mini-grid">' +
          toggle('showIcons', 'Icons', p.showIcons, 'The emoji on each chapter') +
          toggle('showCounts', 'Word counts', p.showCounts, 'Per chapter and per act') +
          toggle('showStatus', 'Status dots', p.showStatus, 'Outline through final') +
          toggle('showScenes', 'Scenes', p.showScenes, 'Nested under each chapter') +
          toggle('showCovers', 'Header art', p.showCovers, 'A thumbnail instead of the icon') +

      onSave: function (root) {

  // ============================================================
  // §STATS — statistics panels. Book-scoped and global share the same
  // builders, differing only in whether a bookId is passed through.
  // ============================================================
  // `count` is optional and opt-in: pass the raw number a formatted `num`
  // was made from and the tile will count up to it when it arrives. The
  // rendered text is always the FINAL value, so a page whose script never
  // ran, or one under prefers-reduced-motion, simply shows the right
  // number. Only buildBookStats passes it — the Codex Statistics tab
  // calls tile() without it and counts nothing.
  // `riseAt` is the tile's place in a stagger; omitted, the tile has no
  // entrance at all, which is what the Statistics tab wants.
  function tile(num, label, sub, rose, count, riseAt) {
    return '<div class="cx-tile' + (riseAt == null ? '' : ' cx-rise" style="--cx-rise-i:' + riseAt) + '">' +
      '<div class="cx-tile-num' + (rose ? ' is-rose' : '') + '"' +
      (count == null ? '' : ' data-count="' + count + '" data-count-fmt="' + countFmtOf(num, count) + '"') +
      '>' + esc(num) + '</div>' +
      '<div class="cx-tile-label">' + esc(label) + '</div>' +
      (sub ? '<div class="cx-tile-sub">' + sub + '</div>' : '') + '</div>';
  }
  // Which of the app's formatters produced this string. Inferred rather
  // than passed, so a call site cannot label a number one way and format
  // it another — the count has to land on exactly the text it replaced.
  function countFmtOf(rendered, raw) {
    var d = D();
    if (String(rendered) === d.fmtCompact(raw)) return 'compact';
    if (String(rendered) === d.fmtWords(raw)) return 'words';
    return 'plain';
  }
  function arc(pct, capTop, capBottom) {
    var r = 44, c = 2 * Math.PI * r;
    var off = c * (1 - D().clamp(pct, 0, 1));
    // --cx-arc-c carries the circumference into CSS, so the rule that holds
    // the ring empty before it arrives (see §MOTION / THE BOOK PAGE) uses
    // the same number this function computed rather than a copy of it.
    return '<svg class="cx-arc" viewBox="0 0 108 108" style="--cx-arc-c:' + c.toFixed(1) + '" role="img" aria-label="' + Math.round(pct * 100) + ' percent">' +
      // The third thing the token ramps could not reach: an SVG gradient,
      // which is markup rather than CSS. stop-color takes var(), so the
      // three stops follow the ground they are drawn on — with the house
      // gold as the fallback, so nothing moves on a view that sets none.
      '<defs><linearGradient id="cxArcGrad" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="var(--cx-arc-a,#8C6A17)"/>' +
      '<stop offset="52%" stop-color="var(--cx-arc-b,#C9A227)"/>' +
      '<stop offset="100%" stop-color="var(--cx-arc-c,#F0D98C)"/>' +
      '</linearGradient></defs>' +
      '<circle class="cx-arc-track" cx="54" cy="54" r="' + r + '"/>' +
      '<circle class="cx-arc-fill" cx="54" cy="54" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '<text class="cx-arc-pct" x="54" y="' + (capBottom ? 54 : 60) + '">' + Math.round(pct * 100) + '%</text>' +
      (capTop ? '<text class="cx-arc-cap" x="54" y="38">' + esc(capTop) + '</text>' : '') +
      (capBottom ? '<text class="cx-arc-cap" x="54" y="72">' + esc(capBottom) + '</text>' : '') +
      '</svg>';
  }
  // The status palette, written inline onto the stack segments and their
  // legend dots — so, like the heat grid, it was invisible to the token
  // ramps and stayed house-coloured on every ground they re-pointed. Each
  // is a var() with its own value as the fallback, so a view that sets
  // nothing is unchanged; only #cxViewBook overrides them today, where a
  // mint-green segment on plum was the one thing that would not blend.
  var TONE_HEX = {
    gilt: 'var(--cx-tone-gilt-hex,#C9A227)',
    rose: 'var(--cx-tone-rose-hex,#D98A9A)',
    good: 'var(--cx-tone-good-hex,#86D6A8)',
    mute: 'var(--cx-tone-mute-hex,rgba(239,230,218,0.28))'
  };
  function stackBar(list, counts) {
    var total = 0;
    list.forEach(function (s) { total += counts[s.id] || 0; });
    if (!total) return '<div class="cx-stack"></div><p class="cx-mini-s" style="margin-top:8px">Nothing to count yet.</p>';
    return '<div class="cx-stack">' + list.map(function (s) {
      var n = counts[s.id] || 0;
      if (!n) return '';
      return '<span style="width:' + (n / total * 100) + '%;background:' + TONE_HEX[s.tone] + '"></span>';
    }).join('') + '</div>' +
    '<div class="cx-legend">' + list.map(function (s) {
      var n = counts[s.id] || 0;
      if (!n) return '';
      return '<span class="cx-legend-item"><i style="background:' + TONE_HEX[s.tone] + '"></i>' + esc(s.label) + ' · ' + n + '</span>';
    }).join('') + '</div>';
  }
  function heatGrid(days, bookId) {
    var d = D();
    var cells = d.heatmap(days, bookId);
    var max = cells.reduce(function (m, c) { return Math.max(m, c.words); }, 0) || 1;
    return '<div class="cx-heat">' + cells.map(function (c, i) {
      // The one gauge whose colour is written inline from JS, which is why
      // it stayed house gold on every ground the tokens re-pointed. The
      // fallback is that gold, so any view without the variable is
      // unchanged — only #cxViewBook sets it today.
      var bg = c.words
        ? 'rgba(var(--cx-heat-rgb,201,162,39),' + (0.18 + (c.words / max) * 0.72).toFixed(2) + ')'
        : 'rgba(255,255,255,0.05)';
      // --cx-heat-i is the cell's place in the row; one CSS declaration
      // turns it into the ripple. Harmless on every other view, which
      // never reads it.
      return '<div class="cx-heat-cell" style="background:' + bg + ';--cx-heat-i:' + i + '"' +
        ' title="' + esc(c.date) + ' · ' + c.words + ' words"></div>';
    }).join('') + '</div>';
  }

  function buildBookStats(b) {
    var d = D();
    var words = d.bookWordCount(b.id);
    var pct = d.bookProgress(b.id);
    var lens = d.chapterLengthStats(b.id);
    var pace = d.averagePace(b.id, 30);
    var proj = d.projectedFinish(b.id);
    var scenes = d.sceneBreakdown(b.id);
    var acts = d.actsForBook(b.id);
    var maxAct = acts.reduce(function (m, a) { return Math.max(m, d.actWordCount(a.id)); }, 0) || 1;

    var projSub = 'Not enough history yet';
    if (proj && proj.done) projSub = 'Target reached';
    else if (proj) {
      projSub = d.fmtWords(proj.remaining) + ' to go at ' + d.fmtWords(proj.pace) + '/day';
      if (proj.deadlineDelta != null) {
        projSub += proj.deadlineDelta >= 0
          ? ' · <span class="cx-tone-good">' + proj.deadlineDelta + ' days clear of your deadline</span>'
          : ' · <span class="cx-tone-rose">' + Math.abs(proj.deadlineDelta) + ' days past your deadline</span>';
      }
    }

    // Beats 4–8 of the score in §MOTION / THE BOOK PAGE. Each block is one
    // .cx-rise, so it is one observed element rather than one per gauge,
    // and the CSS holds the gauges inside it at zero until it lands.
    return '' +
      // beat 4, loud — the ring sweeps and the total counts
      '<div class="cx-card cx-card-pad cx-rise" style="margin-bottom:var(--sp-3)">' +
        '<div class="cx-arc-card">' + arc(pct, '', 'written') +
        '<div style="min-width:0">' +
          '<div class="cx-tile-num" style="font-size:32px" data-count="' + words + '" data-count-fmt="words">' + d.fmtWords(words) + '</div>' +
          '<div class="cx-tile-label">words of ' + d.fmtWords(b.targetWords) + '</div>' +
          '<div class="cx-tile-sub" style="margin-top:10px">' +
            esc(lens.written) + ' of ' + esc(lens.count) + ' chapters have prose · ' +
            'about ' + Math.max(1, Math.round(words / 220)) + ' min to read' +
          '</div>' +
        '</div></div>' +
      '</div>' +

      // still beat 4 — four tiles, 80ms apart. Each is its own .cx-rise so
      // the stagger is a stagger and not one block sliding.
      '<div class="cx-stats-grid" style="margin-bottom:var(--sp-3)">' +
        tile(d.writingStreak(b.id), 'Day streak', '', false, d.writingStreak(b.id), 0) +
        tile(d.fmtCompact(d.wordsInLastNDays(7, b.id)), 'Words this week', '', false, d.wordsInLastNDays(7, b.id), 1) +
        tile(pace ? d.fmtWords(pace) : '—', 'Words per writing day', '', true, pace || null, 2) +
        tile(lens.avg ? d.fmtWords(lens.avg) : '—', 'Average chapter',
          lens.longest ? 'Longest: ' + esc(lens.longest.title) + ' · ' + d.fmtCompact(lens.longest.words) : '', false, lens.avg || null, 3) +
      '</div>' +

      // beat 5, calm — one fade. The value is a date, so nothing counts.
      '<div class="cx-card cx-card-pad cx-rise" style="margin-bottom:var(--sp-3)">' +
        '<span class="cx-eyebrow">Projected finish</span>' +
        '<div class="cx-tile-num" style="margin-top:8px">' + (proj && !proj.done ? esc(d.fmtDate(proj.date)) : (proj && proj.done ? 'Done' : '—')) + '</div>' +
        '<div class="cx-tile-sub">' + projSub + '</div>' +
      '</div>' +

      // beat 6, loud — the bars draw in sequence. The rows stagger on the
      // card's own axis; the meters inside them are held at zero by CSS.
      '<div class="cx-card cx-card-pad cx-rise" style="margin-bottom:var(--sp-3)">' +
        '<span class="cx-eyebrow">Words by act</span>' +
        '<div class="cx-bars" style="margin-top:var(--sp-4)">' +
          (acts.length ? acts.map(function (a, i) {
            var w = d.actWordCount(a.id);
            return '<div class="cx-bar-row" style="--cx-bar-i:' + i + '"><span class="cx-bar-name">' + esc(a.title) + '</span>' +
              meter(w / maxAct) + '<span class="cx-bar-val">' + d.fmtCompact(w) + '</span></div>';
          }).join('') : '<p class="cx-mini-s">No acts yet.</p>') +
        '</div>' +
      '</div>' +

      // beat 7, calm — both stacks widen once, together
      '<div class="cx-card cx-card-pad cx-rise" style="margin-bottom:var(--sp-3)">' +
        '<span class="cx-eyebrow">Chapters by status</span>' +
        '<div style="margin-top:var(--sp-4)">' + stackBar(d.CHAPTER_STATUSES, d.statusBreakdown(b.id)) + '</div>' +
        '<div style="margin-top:var(--sp-5)"><span class="cx-eyebrow">Scenes by status</span>' +
        '<div style="margin-top:var(--sp-3)">' + (scenes.total ? stackBar(d.SCENE_STATUSES, scenes.counts) : '<p class="cx-mini-s">No scenes yet.</p>') + '</div></div>' +
      '</div>' +

      // beat 8, accent — the grid ripples in, and the page stops
      '<div class="cx-card cx-card-pad cx-rise">' +
        '<span class="cx-eyebrow">Last 30 days</span>' +
        '<div style="margin-top:var(--sp-4)">' + heatGrid(30, b.id) + '</div>' +
      '</div>';
  }

  function renderGlobalStatsImpl(host) {
    var d = D();
    var tris = d.trilogiesSorted();
    var lens = { avg: 0 };
    host.innerHTML =
      '<div class="cx-stats-grid" style="margin-bottom:var(--sp-4)">' +
        tile(d.fmtWords(d.totalWordCount()), 'Words in the codex', '') +
        tile(d.writingStreak(), 'Day streak', '') +
        tile(d.fmtCompact(d.wordsInLastNDays(30)), 'Words this month', '', true) +
        tile(d.fmtWords(d.averagePace(null, 30)), 'Words per writing day', '') +
        tile(d.Chapters.list().length, 'Chapters', '') +
        tile(d.Scenes.list().length, 'Scenes', '') +
      '</div>' +
      '<div class="cx-card cx-card-pad" style="margin-bottom:var(--sp-4)">' +
        '<span class="cx-eyebrow">Last 30 days</span><div style="margin-top:var(--sp-4)">' + heatGrid(30, null) + '</div>' +
      '</div>' +
      (tris.length ? '<div class="cx-card cx-card-pad"><span class="cx-eyebrow">Progress by trilogy</span>' +
        '<div class="cx-bars" style="margin-top:var(--sp-4)">' + tris.map(function (t) {
          var w = d.trilogyWordCount(t.id), tg = d.trilogyTargetWords(t.id);
          return '<div class="cx-bar-row"><span class="cx-bar-name">' + esc(t.title) + '</span>' +
            meter(tg ? w / tg : 0) + '<span class="cx-bar-val">' + d.fmtCompact(w) + (tg ? ' / ' + d.fmtCompact(tg) : '') + '</span></div>';
        }).join('') + '</div></div>' : '');
  }

  // ============================================================
  // §PROMPTS — the AI prompt database. A real collection: every prompt
  // is created by hand, editable, reorderable, synced, and carries as
  // many long-form note blocks as it needs.
  // ============================================================
  var promptUi = { q: '', cat: 'all', scope: 'all', favOnly: false, openId: '' };

  function highlightVars(text) {
    // {{PLACEHOLDER}} is the one thing worth picking out of a prompt at a
    // glance — it is what you have to replace before pasting.
    return esc(text).replace(/\{\{([A-Z0-9_ ]+)\}\}/g, '<b>{{$1}}</b>');
  }

  function renderPromptDb(host, ctx) {
    // ctx: { bookId, trilogyId, showScopeFilter }
    var d = D();
    var all = ctx.bookId ? d.promptsVisibleTo(ctx.bookId, ctx.trilogyId) : d.Prompts.list().sort(d.byOrder);

    var list = all.filter(function (p) {
      if (promptUi.favOnly && !p.favorite) return false;
      if (promptUi.cat !== 'all' && p.category !== promptUi.cat) return false;
      if (promptUi.scope !== 'all' && p.scope !== promptUi.scope) return false;
      if (promptUi.q) {
        var hay = (p.title + ' ' + p.text + ' ' + (p.tags || []).join(' ')).toLowerCase();
        if (hay.indexOf(promptUi.q.toLowerCase()) < 0) return false;
      }
      return true;
    });

    var cats = [{ id: 'all', label: 'All', icon: '✦' }].concat(d.PROMPT_CATEGORIES.filter(function (c) {
      return all.some(function (p) { return p.category === c.id; });
    }));

    host.innerHTML =
      '<div class="cx-section-head">' +
        '<div><h2 class="cx-h2">AI Prompt Database</h2>' +
        '<p class="cx-mini-s" style="margin:6px 0 0;text-transform:none;letter-spacing:0">' +
        all.length + ' saved · click one to read the notes and copy it</p></div>' +
        '<span style="display:flex;gap:6px;flex-wrap:wrap">' +
          // Promptarium mounts this same store (appKey 'codex', prefix 'cdx:'),
          // so its Fiction collection IS this database — not a copy.
          '<a class="cx-btn cx-btn-sm" href="promptarium.html#/c/fiction">Open in Promptarium →</a>' +
          '<button type="button" class="cx-btn cx-btn-sm cx-btn-gilt" data-newprompt="1">+ Add prompt</button>' +
        '</span>' +
      '</div>' +
      '<div class="cx-pdb-bar">' +
        '<input class="cx-input cx-pdb-search" id="cxPdbSearch" placeholder="Search prompts, text and tags" value="' + esc(promptUi.q) + '">' +
        '<button type="button" class="cx-chip' + (promptUi.favOnly ? ' is-on' : '') + '" data-fav="1">★ Favourites</button>' +
        (ctx.showScopeFilter
          ? '<span class="cx-chip-row">' + [{ id: 'all', label: 'All scopes' }, { id: 'book', label: 'This book' }, { id: 'trilogy', label: 'This trilogy' }, { id: 'global', label: 'Everywhere' }].map(function (s) {
              return '<button type="button" class="cx-chip' + (promptUi.scope === s.id ? ' is-on' : '') + '" data-scope="' + s.id + '">' + s.label + '</button>';
            }).join('') + '</span>' : '') +
      '</div>' +
      '<div class="cx-chip-row" style="margin-bottom:var(--sp-4)">' + cats.map(function (c) {
        return '<button type="button" class="cx-chip' + (promptUi.cat === c.id ? ' is-on' : '') + '" data-cat="' + c.id + '">' + c.icon + ' ' + esc(c.label) + '</button>';
      }).join('') + '</div>' +
      (list.length
        ? '<div class="cx-pdb-list" id="cxPdbList">' + list.map(function (p) { return buildPromptRow(p, ctx); }).join('') + '</div>'
        : '<div class="cx-empty"><div class="cx-empty-glyph">✒</div><p>' +
          (all.length ? 'No prompt matches that filter.' : 'No prompts saved yet. Keep the ones that actually work here,<br>with notes on when to use them and what they get wrong.') +
          '</p><button type="button" class="cx-btn cx-btn-gilt" data-newprompt="1">Add your first prompt</button></div>');

    var search = $('cxPdbSearch');
    if (search) {
      search.addEventListener('input', function () {
        promptUi.q = this.value;
        var pos = this.selectionStart;
        renderPromptDb(host, ctx);
        var again = $('cxPdbSearch');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      });
    }
    on(host, '[data-cat]', 'click', function () { promptUi.cat = this.dataset.cat; renderPromptDb(host, ctx); });
    on(host, '[data-scope]', 'click', function () { promptUi.scope = this.dataset.scope; renderPromptDb(host, ctx); });
    on(host, '[data-fav]', 'click', function () { promptUi.favOnly = !promptUi.favOnly; renderPromptDb(host, ctx); });
    on(host, '[data-newprompt]', 'click', function () { openPromptModal(null, ctx); });
    on(host, '.cx-prompt-head', 'click', function (e) {
      if (e.target.closest('.cx-prompt-star') || e.target.closest('.cx-prompt-grip')) return;
      var id = this.closest('[data-prompt]').dataset.prompt;
      promptUi.openId = (promptUi.openId === id) ? '' : id;
      renderPromptDb(host, ctx);
    });
    on(host, '.cx-prompt-star', 'click', function (e) {
      e.stopPropagation();
      var id = this.closest('[data-prompt]').dataset.prompt;
      var p = d.Prompts.get(id);
      d.Prompts.update(id, { favorite: !p.favorite });
      renderPromptDb(host, ctx);
    });
    on(host, '[data-copy]', 'click', function () {
      var id = this.dataset.copy;
      var p = d.Prompts.get(id);
      if (!p) return;
      var btn = this;
      navigator.clipboard.writeText(p.text).then(function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1400);
        d.Prompts.update(id, { useCount: (p.useCount || 0) + 1, lastUsedAt: d.nowISO() });
      }).catch(function () { toast('Clipboard blocked by the browser'); });
    });
    on(host, '[data-pedit]', 'click', function () { openPromptModal(this.dataset.pedit, ctx); });
    on(host, '[data-addnote]', 'click', function () {
      var pid = this.dataset.addnote;
      d.PromptNotes.add({ promptId: pid, title: 'Note', body: '', order: d.nextOrder(d.notesForPrompt(pid)) });
      renderPromptDb(host, ctx);
    });
    wirePromptNotes(host, ctx);

    var listHost = $('cxPdbList');
    if (listHost && window.Sortable && promptUi.cat === 'all' && !promptUi.q && !promptUi.favOnly) {
      Sortable.create(listHost, {
        animation: 160, handle: '.cx-prompt-grip', draggable: '[data-prompt]', ghostClass: 'cx-sortable-ghost',
        onEnd: function () {
          var ids = Array.prototype.map.call(listHost.querySelectorAll('[data-prompt]'), function (n) { return n.dataset.prompt; });
          d.reorderCollection(d.Prompts, ids);
        }
      });
    }
  }

  function buildPromptRow(p, ctx) {
    var d = D();
    var open = promptUi.openId === p.id;
    var cat = d.PROMPT_CATEGORIES.filter(function (c) { return c.id === p.category; })[0] || d.PROMPT_CATEGORIES[0];
    var notes = d.notesForPrompt(p.id);
    var scopeLabel = p.scope === 'global' ? 'Everywhere' : (p.scope === 'trilogy' ? 'This trilogy' : 'This book');

    return '<article class="cx-prompt' + (open ? ' is-open' : '') + '" data-prompt="' + esc(p.id) + '">' +
      '<button type="button" class="cx-prompt-head">' +
        '<span class="cx-prompt-grip" title="Drag to reorder">⣿</span>' +
        '<span class="cx-prompt-icon">' + esc(p.icon || cat.icon) + '</span>' +
        '<span class="cx-prompt-name">' +
          '<span class="cx-prompt-title">' + esc(p.title) + '</span>' +
          '<span class="cx-prompt-sub">' +
            '<span>' + esc(cat.label) + '</span>' +
            '<span>' + esc(scopeLabel) + '</span>' +
            (notes.length ? '<span>' + notes.length + ' note' + (notes.length === 1 ? '' : 's') + '</span>' : '') +
            (p.useCount ? '<span>used ' + p.useCount + '×</span>' : '') +
            ((p.tags || []).length ? '<span>' + esc(p.tags.join(' · ')) + '</span>' : '') +
          '</span>' +
        '</span>' +
        '<span class="cx-prompt-star' + (p.favorite ? ' is-on' : '') + '" role="button" tabindex="0" aria-label="Favourite">★</span>' +
      '</button>' +
      '<div class="cx-prompt-body">' +
        '<div class="cx-code">' + highlightVars(p.text || 'This prompt has no text yet.') +
          '<button type="button" class="cx-btn cx-btn-sm cx-code-copy" data-copy="' + esc(p.id) + '">Copy</button>' +
        '</div>' +
        (p.modelHint ? '<p class="cx-mini-s" style="margin:0 0 var(--sp-3)">Best with ' + esc(p.modelHint) + '</p>' : '') +
        '<div class="cx-section-head" style="margin:var(--sp-4) 0 var(--sp-3)">' +
          '<span class="cx-eyebrow">Notes</span>' +
          '<span style="display:flex;gap:6px">' +
            '<button type="button" class="cx-btn cx-btn-sm" data-addnote="' + esc(p.id) + '">+ Note</button>' +
            '<button type="button" class="cx-btn cx-btn-sm" data-pedit="' + esc(p.id) + '">Edit prompt</button>' +
          '</span>' +
        '</div>' +
        (notes.length
          ? '<div class="cx-notes" data-notesof="' + esc(p.id) + '">' + notes.map(function (n) {
              return '<div class="cx-note" data-note="' + esc(n.id) + '">' +
                '<div class="cx-note-head">' +
                  '<input class="cx-note-title" data-nt="' + esc(n.id) + '" value="' + esc(n.title) + '">' +
                  '<button type="button" class="cx-note-btn" data-nup="' + esc(n.id) + '" aria-label="Move up">▲</button>' +
                  '<button type="button" class="cx-note-btn" data-ndown="' + esc(n.id) + '" aria-label="Move down">▼</button>' +
                  '<button type="button" class="cx-note-btn" data-ndel="' + esc(n.id) + '" aria-label="Delete note">✕</button>' +
                '</div>' +
                '<textarea class="cx-note-body" data-nb="' + esc(n.id) + '" rows="2" placeholder="What this prompt is good for, what it gets wrong, what to run before or after it…">' + esc(n.body) + '</textarea>' +
                '</div>';
            }).join('') + '</div>'
          : '<p class="cx-mini-s" style="text-transform:none;letter-spacing:0">No notes yet. Add what you learned the last time you ran it.</p>') +
      '</div></article>';
  }

  function wirePromptNotes(host, ctx) {
    var d = D();
    Array.prototype.forEach.call(host.querySelectorAll('.cx-note-body'), function (ta) { autosize(ta); });
    on(host, '.cx-note-body', 'input', function () { autosize(this); });
    on(host, '.cx-note-body', 'blur', function () { d.PromptNotes.update(this.dataset.nb, { body: this.value }); });
    on(host, '.cx-note-title', 'blur', function () { d.PromptNotes.update(this.dataset.nt, { title: this.value }); });
    on(host, '[data-ndel]', 'click', function () {
      d.PromptNotes.remove(this.dataset.ndel);
      renderPromptDb(host, ctx);
    });
    function move(id, dir) {
      var n = d.PromptNotes.get(id);
      if (!n) return;
      var siblings = d.notesForPrompt(n.promptId);
      var i = siblings.findIndex(function (x) { return x.id === id; });
      var j = i + dir;
      if (j < 0 || j >= siblings.length) return;
      var ids = siblings.map(function (x) { return x.id; });
      ids.splice(j, 0, ids.splice(i, 1)[0]);
      d.reorderCollection(d.PromptNotes, ids);
      renderPromptDb(host, ctx);
    }
    on(host, '[data-nup]', 'click', function () { move(this.dataset.nup, -1); });
    on(host, '[data-ndown]', 'click', function () { move(this.dataset.ndown, 1); });
  }

  function openPromptModal(id, ctx) {
    var d = D();
    var p = id ? d.Prompts.get(id) : null;
    var isNew = !p;
    if (isNew) p = { title: '', icon: '✒️', category: 'drafting', tags: [], text: '', modelHint: '', scope: ctx.bookId ? 'book' : 'global' };

    var scopeOpts = [{ id: 'global', label: 'Everywhere in the codex' }];
    if (ctx.trilogyId) scopeOpts.unshift({ id: 'trilogy', label: 'This trilogy only' });
    if (ctx.bookId) scopeOpts.unshift({ id: 'book', label: 'This book only' });

    openModal({
      title: isNew ? 'New prompt' : 'Edit prompt',
      wide: true,
      body:
        '<div class="cx-field-row">' + fieldText('Title', 'title', p.title, 'What it does, in your words') +
        fieldSelect('Category', 'category', p.category, d.PROMPT_CATEGORIES) + '</div>' +
        fieldArea('Prompt', 'text', p.text, 'Paste the prompt. Wrap anything you swap out in double braces, like {{SCENE}}, and it will be highlighted.', 10) +
        '<div class="cx-field-row">' + fieldText('Tags', 'tagsRaw', (p.tags || []).join(', '), 'comma, separated') +
        fieldText('Best with', 'modelHint', p.modelHint, 'e.g. Opus, or a long-context model') + '</div>' +
        fieldSelect('Available in', 'scope', p.scope, scopeOpts) +
        fieldIcon('Icon', 'icon', p.icon),
      onMount: wireFields,
      onSave: function (root) {
        var f = readFields(root);
        if (!f.title.trim()) { toast('Give the prompt a title'); return false; }
        f.tags = String(f.tagsRaw || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        delete f.tagsRaw;
        f.scopeId = f.scope === 'book' ? (ctx.bookId || '') : (f.scope === 'trilogy' ? (ctx.trilogyId || '') : '');
        if (isNew) {
          f.order = d.nextOrder(d.Prompts.list());

      onDelete: isNew ? null : function () { d.removePrompt(id); promptUi.openId = ''; toast('Prompt deleted'); },
      deleteConfirm: 'Delete this prompt and all of its notes?'

  // ============================================================
  // §SESSION — the autosave engine, shared by the editor and
  // Composition Mode so both write through exactly one code path.
  //
  // The word baseline is captured once and never recomputed from the
  // book total, which is what stops the counter drifting as other
  // chapters change underneath it. Readouts are patched into the DOM
  // directly rather than by re-rendering, so the caret is never moved.
  // ============================================================
  function createSession(chapter, textarea, onReadout) {
    var d = D();
    var book = d.Books.get(chapter.bookId);
    var openedWords = d.wordCount(chapter.content);
    var loggedWords = openedWords;
    var lastCommit = Date.now();
    var timer = null;
    var dead = false;

    function readouts() {
      var w = d.wordCount(textarea.value);
      if (onReadout) onReadout({
        words: w,
        session: Math.max(0, w - openedWords),
        minutes: Math.max(1, Math.round(w / 220))
      });
    }

    function commit() {
      if (dead) return;
      clearTimeout(timer); timer = null;
      var text = textarea.value;
      var w = d.wordCount(text);
      var current = d.Chapters.get(chapter.id);
      if (!current) { dead = true; return; }
      if (current.content !== text) {
        d.Chapters.update(chapter.id, { content: text, updatedAt: d.nowISO() });
        if (book) d.Books.update(book.id, { currentChapterId: chapter.id, lastEditedAt: d.nowISO() });
      }
      var delta = w - loggedWords;
      if (delta > 0) {
        var mins = Math.max(1, Math.round((Date.now() - lastCommit) / 60000));
        d.logProgress(chapter.bookId, book ? book.trilogyId : '', delta, mins, session.mode);
        loggedWords = w;
      }
      lastCommit = Date.now();
    }

    function onInput() {
      readouts();
      clearTimeout(timer);
      timer = setTimeout(commit, 800);
    }
    textarea.addEventListener('input', onInput);
    textarea.addEventListener('blur', commit);

    var session = {
      mode: 'normal',
      chapterId: chapter.id,
      textarea: textarea,
      flush: commit,
      readouts: readouts,
      destroy: function () {
        commit(); dead = true;
        textarea.removeEventListener('input', onInput);
        textarea.removeEventListener('blur', commit);
      }
    };
    readouts();
    return session;
  }

  // ============================================================
  // §WRITE — the manuscript editor
  // ============================================================
  var writeUi = { preview: false, sideOpen: true, railOpen: true };

  function renderWriteImpl() {

    var ch = d.Chapters.get(S.route.id);

    if (!b) { go('/', true); return; }
    var t = d.Trilogies.get(b.trilogyId);

    var seqW = d.orderedChapters(b.id);
    var idxW = seqW.findIndex(function (c) { return c.id === ch.id; });

      art: ch.headerArt || d.ART.chapter, tone: 'hall',
      folio: d.folio(b.position || 1, idxW + 1),
      script: ch.label ? ch.label.toLowerCase() : 'a chapter',

              : '<textarea id="cxMsText" spellcheck="true" placeholder="Begin…">' + esc(ch.content) + '</textarea>') +

  // ============================================================
  // §FORMAT BAR
  //
  // The manuscript is stored as markdown-lite, and mdToHtml renders
  // exactly four things: **bold**, *italic*, *** (scene break) and
  // > quote. That is the whole vocabulary, so those are the whole bar. A
  // heading or list button would put literal # and - characters into the
  // prose, the word count and every compiled export — a button whose
  // output the renderer ignores is not a feature, it is a bug with an
  // icon on it.
  //
  // THE ONE RULE EVERYTHING HERE DEPENDS ON: text goes in through
  // document.execCommand('insertText'), never through textarea.value.
  // Two reasons, both load-bearing:
  //   1. it keeps the browser's own undo stack, so Undo/Redo are real
  //      rather than a reimplementation fighting Ctrl+Z, and
  //   2. it fires an `input` event, which is what createSession listens
  //      on. Assigning .value fires nothing and the chapter silently
  //      would not save.
  // The fallback below covers browsers without execCommand and dispatches
  // the event by hand, accepting the loss of undo history there only.
  // ============================================================
  var MS_FACES = [
    { id: 'garamond', label: 'Cormorant Garamond', css: '"Cormorant Garamond", Georgia, serif' },
    { id: 'lora',     label: 'Lora',               css: '"Lora", Georgia, serif' },
    { id: 'bodoni',   label: 'Bodoni Moda',        css: '"Bodoni Moda", Didot, Georgia, serif' },
    { id: 'cinzel',   label: 'Cinzel',             css: '"Cinzel", Georgia, serif' },
    { id: 'inter',    label: 'Inter',              css: '"Inter", system-ui, sans-serif' },
    { id: 'serif',    label: 'System serif',       css: 'Georgia, "Times New Roman", serif' },
    { id: 'sans',     label: 'System sans',        css: 'system-ui, -apple-system, "Segoe UI", sans-serif' },

  ];
  function msFace(id) {
    for (var i = 0; i < MS_FACES.length; i++) if (MS_FACES[i].id === id) return MS_FACES[i];

        '<button type="button" class="cx-fmt-b" data-find="close" title="Close find" aria-label="Close find">&#215;</button>' +
      '</div>' +
      '<div class="cx-fmt-pop" id="cxFmtType" hidden></div>' +
    '</div>';
  }

  // Wires the bar to a textarea. Returns nothing; all state lives in the
  // DOM and in the manuscript prefs, so a re-render rebuilds it cleanly.
  function wireFormatBar(ta) {
    var bar = $('cxFmtBar');
    if (!bar || !ta) return;
    var d = D();

    // ---- the one insertion primitive ----
    function put(text) {
      ta.focus();
      var ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
      if (!ok) {
        // No execCommand: splice by hand and announce it, so the autosave
        // session still hears about the change. Undo history is lost here,
        // which is exactly why this is the fallback and not the path.
        var s = ta.selectionStart, e2 = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + text + ta.value.slice(e2);
        ta.selectionStart = ta.selectionEnd = s + text.length;
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    function selection() { return { a: ta.selectionStart, b: ta.selectionEnd, text: ta.value.slice(ta.selectionStart, ta.selectionEnd) }; }

    // Wrap, or UNWRAP when the selection already carries the markers —
    // pressing B on bold text should turn it off, not nest it.
    function wrap(mark) {
      var s = selection();
      var v = ta.value;
      var inner = s.text;
      // markers inside the selection
      if (inner.length >= mark.length * 2 && inner.slice(0, mark.length) === mark && inner.slice(-mark.length) === mark) {
        put(inner.slice(mark.length, -mark.length));
        return;
      }
      // markers just outside it
      if (v.slice(Math.max(0, s.a - mark.length), s.a) === mark && v.slice(s.b, s.b + mark.length) === mark) {
        ta.setSelectionRange(s.a - mark.length, s.b + mark.length);
        put(inner);
        return;
      }
      if (!inner) {
        // No selection: drop the pair and park the caret between them.
        put(mark + mark);
        ta.setSelectionRange(ta.selectionStart - mark.length, ta.selectionStart - mark.length);
        return;
      }
      put(mark + inner + mark);
      ta.setSelectionRange(s.a + mark.length, s.a + mark.length + inner.length);
    }

    // Quote is a LINE operation, not a span one.
    function quote() {
      var v = ta.value, s = selection();
      var lo = v.lastIndexOf('\n', s.a - 1) + 1;
      var hiRaw = v.indexOf('\n', s.b);
      var hi = hiRaw === -1 ? v.length : hiRaw;
      var block = v.slice(lo, hi);
      var lines = block.split('\n');
      var allQuoted = lines.every(function (l) { return /^\s*>\s?/.test(l) || !l.trim(); });
      var next = lines.map(function (l) {
        if (!l.trim()) return l;
        return allQuoted ? l.replace(/^(\s*)>\s?/, '$1') : l.replace(/^(\s*)/, '$1> ');
      }).join('\n');
      ta.setSelectionRange(lo, hi);
      put(next);
      ta.setSelectionRange(lo, lo + next.length);
    }

    function sceneBreak() {
      var v = ta.value, s = selection();
      var before = v.slice(0, s.a);
      var lead = /\n\s*$/.test(before) || before === '' ? '' : '\n\n';
      var after = v.slice(s.b);
      var tail = /^\s*\n/.test(after) ? '' : '\n\n';
      put(lead + '***' + tail);
    }

    // ---- active state: what is the caret actually inside? ----
    function marksAt() {
      var v = ta.value, a = ta.selectionStart, b2 = ta.selectionEnd;
      var lo = v.lastIndexOf('\n', a - 1) + 1;
      var hiRaw = v.indexOf('\n', b2);
      var line = v.slice(lo, hiRaw === -1 ? v.length : hiRaw);
      var out = { bold: false, italic: false, quote: /^\s*>\s?/.test(line) };
      // Count unclosed markers to the left of the caret on this line: an
      // odd number means the caret is inside one.
      var left = v.slice(lo, a);
      var bolds = (left.match(/\*\*/g) || []).length;
      out.bold = bolds % 2 === 1;
      var single = (left.replace(/\*\*/g, '').match(/\*/g) || []).length +
                   (left.match(/_/g) || []).length;
      out.italic = single % 2 === 1;
      return out;
    }
    function paintActive() {
      if (document.activeElement !== ta && !bar.contains(document.activeElement)) return;
      var m = marksAt();
      ['bold', 'italic', 'quote'].forEach(function (k) {
        var el = bar.querySelector('[data-fmt="' + k + '"]');
        if (el) { el.classList.toggle('is-on', !!m[k]); el.setAttribute('aria-pressed', m[k] ? 'true' : 'false'); }
      });
    }
    document.addEventListener('selectionchange', paintActive);
    ta.addEventListener('input', paintActive);

    // ---- find ----
    var findBox = $('cxFmtFind'), q = $('cxFmtQ'), count = $('cxFmtCount');
    var hits = [], at = -1, caretBefore = 0;
    function scan() {
      var needle = q.value;
      hits = []; at = -1;
      if (needle) {
        var hay = ta.value.toLowerCase(), n = needle.toLowerCase(), i = hay.indexOf(n);
        while (i !== -1) { hits.push(i); i = hay.indexOf(n, i + Math.max(1, n.length)); }
      }
      count.textContent = hits.length ? '0 of ' + hits.length : (needle ? 'none' : '—');
    }
    function step(dir) {
      if (!hits.length) return;
      at = (at + dir + hits.length * 2) % hits.length;
      var i = hits[at];
      ta.focus();
      ta.setSelectionRange(i, i + q.value.length);
      // A textarea cannot paint highlights, so the match is SELECTED and
      // scrolled to instead — honest about what the control is.
      var before = ta.value.slice(0, i).split('\n').length;
      var lh = parseFloat(getComputedStyle(ta).lineHeight) || 30;
      window.scrollTo({ top: Math.max(0, ta.offsetTop + before * lh - window.innerHeight * 0.45), behavior: 'smooth' });
      count.textContent = (at + 1) + ' of ' + hits.length;
    }
    function openFind() {
      caretBefore = ta.selectionStart;
      findBox.hidden = false;
      q.focus(); q.select(); scan();
    }
    function closeFind() {
      findBox.hidden = true;
      ta.focus();
      ta.setSelectionRange(caretBefore, caretBefore);
    }
    q.addEventListener('input', scan);
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    });
    on(findBox, '[data-find]', 'click', function () {
      var k = this.dataset.find;
      if (k === 'next') step(1); else if (k === 'prev') step(-1); else closeFind();
    });

    // ---- the type panel ----
    var pop = $('cxFmtType');
    function paintType() {
      var p = d.getManuscriptPrefs();
      pop.innerHTML =
        '<span class="cx-fmt-pop-h">Typeface</span>' +
        '<div class="cx-fmt-faces">' + MS_FACES.map(function (f) {
          return '<button type="button" class="cx-fmt-face' + (f.id === p.font ? ' is-on' : '') +
            '" data-face="' + f.id + '" style="font-family:' + f.css + '">' + esc(f.label) + '</button>';
        }).join('') + '</div>' +
        row('Size', 'fontSize', p.fontSize, 14, 32, 1, 'px') +
        row('Line height', 'lineHeight', p.lineHeight, 1.3, 2.4, 0.05, '') +
        row('Line width', 'measure', p.measure, 48, 100, 2, 'ch') +
        '<button type="button" class="cx-fmt-reset" data-reset="1">Reset to defaults</button>';
      function row(label, name, val, min, max, stepv, unit) {
        return '<label class="cx-fmt-row"><span>' + esc(label) + '</span>' +
          '<input type="range" data-ms="' + name + '" min="' + min + '" max="' + max + '" step="' + stepv + '" value="' + val + '">' +
          '<b id="cxFmtV-' + name + '">' + val + unit + '</b></label>';
      }
    }
    function applyType() {
      var p = d.getManuscriptPrefs();
      var grid = $('cxWrGrid');
      if (!grid) return;
      // Custom properties, so nothing re-renders and the caret is safe.
      grid.style.setProperty('--cx-ms-face', msFace(p.font).css);
      grid.style.setProperty('--cx-ms-size', p.fontSize + 'px');
      grid.style.setProperty('--cx-ms-lh', String(p.lineHeight));
      grid.style.setProperty('--cx-ms-measure', p.measure + 'ch');
      if (ta) { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, window.innerHeight * 0.6) + 'px'; }
    }
    // Delegated, deliberately: on() binds to the nodes that exist when it
    // is called, and paintType() replaces this panel's innerHTML every
    // time a value changes — so anything bound with on() would be wired to
    // the previous set of buttons and silently stop working after the
    // first click.
    pop.addEventListener('click', function (e) {
      var face = e.target.closest('[data-face]');
      if (face) { d.saveManuscriptPrefs({ font: face.dataset.face }); paintType(); applyType(); return; }
      if (e.target.closest('[data-reset]')) {
        d.saveManuscriptPrefs({ font: 'garamond', fontSize: 20, lineHeight: 1.85, measure: 72 });
        paintType(); applyType();
      }
    });
    pop.addEventListener('input', function (e) {
      var el = e.target;
      if (!el.dataset || !el.dataset.ms) return;
      var v = el.dataset.ms === 'lineHeight' ? parseFloat(el.value) : parseInt(el.value, 10);
      var patch = {}; patch[el.dataset.ms] = v;
      d.saveManuscriptPrefs(patch);
      var out = $('cxFmtV-' + el.dataset.ms);
      if (out) out.textContent = v + (el.dataset.ms === 'fontSize' ? 'px' : el.dataset.ms === 'measure' ? 'ch' : '');
      applyType();
    });
    paintType();
    applyType();

    // ---- the buttons ----
    on(bar, '[data-fmt]', 'click', function () {
      var k = this.dataset.fmt;
      if (k === 'bold') wrap('**');
      else if (k === 'italic') wrap('*');
      else if (k === 'quote') quote();
      else if (k === 'break') sceneBreak();
      else if (k === 'undo') { ta.focus(); document.execCommand('undo'); }
      else if (k === 'redo') { ta.focus(); document.execCommand('redo'); }
      else if (k === 'find') { if (findBox.hidden) openFind(); else closeFind(); }
      else if (k === 'type') { pop.hidden = !pop.hidden; }
      if (k !== 'type' && k !== 'find') { pop.hidden = true; paintActive(); }
    });
    // Clicking away closes the type panel; it is a popover, not a drawer.
    document.addEventListener('mousedown', function (e) {
      if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-fmt="type"]')) pop.hidden = true;
    });
    // The keyboard shortcuts the tooltips promise.
    ta.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      var k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); wrap('**'); paintActive(); }
      else if (k === 'i') { e.preventDefault(); wrap('*'); paintActive(); }
      else if (k === 'f') { e.preventDefault(); openFind(); }
    });
  }

  function paintReadout(r) {
    var node = $('cxWrReadout');
    if (!node) return;
    node.innerHTML = '<b>' + D().fmtWords(r.words) + '</b> words · ' + r.minutes + ' min' +
      (r.session > 0 ? ' · <b>+' + D().fmtWords(r.session) + '</b> today' : '');
