<style>
/* =============================================================
   Business OS — a CEO command center for managing multiple businesses
   from one dashboard. Vanilla HTML/CSS/JS, no build step, no framework —
   this repo has none anywhere (CLAUDE.md §1) — built natively in this
   app's real stack (localStorage + the shared initCloudSync() sync
   helper) rather than the originally-requested Next.js/React/Tailwind/
   shadcn/Recharts stack, per an explicit decision confirmed with the
   user before writing any code (same precedent as the Learning Dashboard
   and Writing Dashboard builds elsewhere in this app). Hand-rolled
   charts/kanban/animations stand in for Recharts/Framer Motion — this
   app's own established "no charting/animation library" convention.
   Own private --bos-* tokens, an explicit literal-hex palette instruction
   (near-black #0D0D0D / surface #171717 / crimson #E11D48 / pink
   #F472B6) — the same one-off aesthetic-exception category as every
   other themed page in this app (CLAUDE.md §6 / DO NOT MODIFY rule 2).
   ============================================================= */
:root {
  --bos-bg: #0D0D0D;
  --bos-bg-deep: #060606;
  --bos-surface: #171717;
  --bos-surface-2: #1c1c1c;
  --bos-surface-hover: #212121;
  --bos-border: rgba(255,255,255,0.08);
  --bos-border-strong: rgba(255,255,255,0.16);
  --bos-text: #FFFFFF;
  --bos-text-dim: rgba(255,255,255,0.66);
  --bos-text-mute: rgba(255,255,255,0.40);
  --bos-accent: #E11D48;
  --bos-accent2: #F472B6;
  --bos-accent-rgb: 225,29,72;
  --bos-accent2-rgb: 244,114,182;
  --bos-good: #34D399;
  --bos-warn: #F59E0B;
  --bos-bad: #FB7185;
  --bos-info: #60A5FA;
  --bos-shadow: 0 24px 60px rgba(0,0,0,0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bos-bg); }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--bos-text);
  min-height: 100vh;
  overflow-x: hidden;
}
::selection { background: rgba(var(--bos-accent-rgb), 0.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--bos-border-strong); border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }
a { color: inherit; }
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
@keyframes bosFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bosPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

.bos-bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(700px 500px at 12% -6%, rgba(var(--bos-accent-rgb), 0.16), transparent 60%),
    radial-gradient(600px 480px at 100% 8%, rgba(var(--bos-accent2-rgb), 0.10), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(var(--bos-accent-rgb), 0.06), transparent 60%);
}

/* ---------- app shell ---------- */
.bos-app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.bos-sidebar {
  width: 246px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: rgba(15,15,16,0.6);
  border-right: 1px solid var(--bos-border);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform 0.25s cubic-bezier(0.2,0.8,0.2,1);
  z-index: 40;
}
.bos-sb-brand { display: flex; align-items: center; gap: 10px; padding: 62px 18px 20px; border-bottom: 1px solid var(--bos-border); }
.bos-sb-mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(155deg, var(--bos-accent) 0%, var(--bos-accent2) 100%);
  box-shadow: 0 6px 18px rgba(var(--bos-accent-rgb), 0.4);
  font-size: 16px; font-weight: 800;
}
.bos-sb-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.bos-sb-title { font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bos-sb-subtitle { font-size: 10px; color: var(--bos-text-mute); letter-spacing: 0.04em; text-transform: uppercase; }

.bos-sb-nav { flex: 1 1 auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.bos-sb-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
  text-decoration: none; color: var(--bos-text-dim); font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; position: relative;
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent; background: none; width: 100%; text-align: left;
}
.bos-sb-item:hover { background: var(--bos-surface-hover); color: var(--bos-text); }
.bos-sb-item:active { transform: scale(0.98); }
.bos-sb-item.active { background: linear-gradient(180deg, rgba(var(--bos-accent-rgb),0.22) 0%, rgba(var(--bos-accent-rgb),0.08) 100%); color: #fff; border-color: rgba(var(--bos-accent-rgb), 0.3); }
.bos-sb-item.active::before { content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: linear-gradient(180deg, var(--bos-accent), var(--bos-accent2)); box-shadow: 0 0 10px rgba(var(--bos-accent-rgb), 0.7); }
.bos-sb-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.bos-sb-count { margin-left: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; color: var(--bos-text-mute); }
.bos-sb-footer { padding: 12px 18px 18px; border-top: 1px solid var(--bos-border); font-size: 11.5px; color: var(--bos-text-mute); }

.bos-workspace { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.bos-header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
  padding: 14px 26px; padding-left: 60px;
  background: rgba(13,13,13,0.55); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid var(--bos-border);
}
.bos-search-wrap {
  flex: 1 1 auto; max-width: 440px; display: flex; align-items: center; gap: 8px;
  padding: 9px 13px; border-radius: 11px; background: var(--bos-surface); border: 1px solid var(--bos-border);
  color: var(--bos-text-mute); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
}
.bos-search-wrap:hover { border-color: var(--bos-border-strong); }
.bos-kbd { margin-left: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; padding: 2px 6px; border-radius: 6px; background: var(--bos-surface-2); border: 1px solid var(--bos-border-strong); color: var(--bos-text-mute); }
.bos-header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.bos-icon-btn {
  width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--bos-surface); border: 1px solid var(--bos-border); color: var(--bos-text-dim);
  cursor: pointer; font-size: 15px; transition: all 0.15s ease; position: relative;
}
.bos-icon-btn:hover { background: var(--bos-surface-hover); border-color: var(--bos-border-strong); color: var(--bos-text); transform: translateY(-1px); }
.bos-notif-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--bos-accent); border: 2px solid var(--bos-bg-deep); display: none; }
.bos-notif-dot.show { display: block; animation: bosPulse 1.8s ease-in-out infinite; }

.bos-main { flex: 1 1 auto; padding: 26px 30px 90px; max-width: 1360px; width: 100%; margin: 0 auto; }
.bos-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.bos-page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bos-accent2); margin-bottom: 6px; }
.bos-page-title { font-size: 25px; font-weight: 800; }
.bos-page-subtext { font-size: 13px; color: var(--bos-text-mute); margin-top: 4px; max-width: 620px; }
.bos-anim { animation: bosFadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }

/* ---------- shared components ---------- */
.bos-card { background: rgba(255,255,255,0.035); border: 1px solid var(--bos-border); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset; transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1), border-color 0.2s ease, box-shadow 0.22s ease; }
.bos-card.bos-hoverable { cursor: pointer; }
.bos-card.bos-hoverable:hover { transform: translateY(-4px); border-color: rgba(var(--bos-accent-rgb), 0.35); box-shadow: var(--bos-shadow), 0 0 0 1px rgba(var(--bos-accent-rgb),0.15); }
.bos-card-pad { padding: 18px; }
.bos-grid { display: grid; gap: 16px; }
.bos-grid-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.bos-grid-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.bos-grid-2 { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }

.bos-btn { display: inline-flex; align-items: center; gap: 7px; justify-content: center; padding: 9px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--bos-border-strong); background: var(--bos-surface); color: var(--bos-text); cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
.bos-btn:hover { background: var(--bos-surface-hover); transform: translateY(-1px); }
.bos-btn:active { transform: translateY(0) scale(0.98); }
.bos-btn-primary { background: linear-gradient(135deg, var(--bos-accent) 0%, var(--bos-accent2) 100%); border-color: transparent; color: #fff; box-shadow: 0 8px 22px rgba(var(--bos-accent-rgb), 0.35); }
.bos-btn-primary:hover { box-shadow: 0 10px 28px rgba(var(--bos-accent-rgb), 0.5); filter: brightness(1.05); }
.bos-btn-ghost { background: transparent; border-color: transparent; color: var(--bos-text-mute); }
.bos-btn-ghost:hover { background: var(--bos-surface-hover); color: var(--bos-text); }
.bos-btn-danger { border-color: rgba(251,113,133,0.4); color: var(--bos-bad); background: rgba(251,113,133,0.08); }
.bos-btn-danger:hover { background: rgba(251,113,133,0.16); }
.bos-btn-sm { padding: 6px 11px; font-size: 11.5px; border-radius: 8px; }
.bos-btn-icon-sm { width: 26px; height: 26px; border-radius: 8px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--bos-surface-2); border: 1px solid var(--bos-border); color: var(--bos-text-dim); cursor: pointer; }
.bos-btn-icon-sm:hover { background: var(--bos-surface-hover); color: var(--bos-text); }

.bos-chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.bos-chip { padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bos-surface); border: 1px solid var(--bos-border); color: var(--bos-text-dim); cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
.bos-chip:hover { border-color: var(--bos-border-strong); }
.bos-chip.active { background: linear-gradient(135deg, rgba(var(--bos-accent-rgb),0.9), rgba(var(--bos-accent2-rgb),0.85)); border-color: transparent; color: #fff; }
.bos-tag { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; background: var(--bos-surface-2); border: 1px solid var(--bos-border); color: var(--bos-text-mute); }
.bos-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
.bos-pill-good { background: rgba(52,211,153,0.14); color: var(--bos-good); }
.bos-pill-warn { background: rgba(245,158,11,0.14); color: var(--bos-warn); }
.bos-pill-bad { background: rgba(251,113,133,0.14); color: var(--bos-bad); }
.bos-pill-info { background: rgba(96,165,250,0.14); color: var(--bos-info); }
.bos-pill-mute { background: var(--bos-surface-2); color: var(--bos-text-mute); }

.bos-progress-bar { height: 7px; border-radius: 999px; background: var(--bos-surface-2); overflow: hidden; position: relative; }
.bos-progress-fill { height: 100%; border-radius: 999px; width: 0%; background: linear-gradient(90deg, var(--bos-accent), var(--bos-accent2)); box-shadow: 0 0 10px rgba(var(--bos-accent-rgb), 0.6); transition: width 0.7s cubic-bezier(0.16,1,0.3,1); }
.bos-progress-fill.bos-fill-good { background: linear-gradient(90deg, #059669, var(--bos-good)); }

input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="email"], select, textarea {
  width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px;
  background: var(--bos-surface-2); border: 1px solid var(--bos-border-strong); border-radius: 10px;
  color: var(--bos-text); padding: 9px 12px; outline: none; transition: border-color 0.15s ease, background 0.15s ease;
}
textarea { resize: vertical; min-height: 70px; line-height: 1.55; font-family: inherit; }
input:focus, select:focus, textarea:focus { border-color: var(--bos-accent); background: var(--bos-surface); }
::placeholder { color: var(--bos-text-mute); }
label.bos-field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--bos-text-mute); margin-bottom: 6px; }
.bos-field { margin-bottom: 14px; }
.bos-field-row { display: flex; gap: 12px; }
.bos-checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--bos-text-dim); cursor: pointer; }
.bos-checkbox-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--bos-accent); cursor: pointer; }
.bos-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
.bos-swatch { width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
.bos-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--bos-bg); }

.bos-empty { text-align: center; padding: 50px 20px; color: var(--bos-text-mute); }
.bos-empty-icon { font-size: 34px; margin-bottom: 10px; opacity: 0.7; }
.bos-empty-title { font-size: 14px; font-weight: 700; color: var(--bos-text-dim); margin-bottom: 4px; }
.bos-empty-sub { font-size: 12.5px; }

.bos-stat-tile { padding: 18px; }
.bos-stat-icon { font-size: 20px; margin-bottom: 10px; opacity: 0.9; }
.bos-stat-value { font-size: 25px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.bos-stat-label { font-size: 11.5px; color: var(--bos-text-mute); margin-top: 3px; font-weight: 600; }
.bos-stat-sub { font-size: 11px; margin-top: 6px; font-weight: 700; }

.bos-section-title { font-size: 13.5px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 3000; background: rgba(5,5,5,0.62); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 24px; opacity: 0; transition: opacity 0.2s ease; }
.modal-bg.show { display: flex; opacity: 1; }
.modal { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: rgba(20,20,21,0.92); border: 1px solid var(--bos-border-strong); border-radius: 18px; padding: 24px; box-shadow: var(--bos-shadow); transform: translateY(10px) scale(0.98); transition: transform 0.22s cubic-bezier(0.16,1,0.3,1); backdrop-filter: blur(20px) saturate(1.4); }
.modal-bg.show .modal { transform: translateY(0) scale(1); }
.bos-modal-wide { max-width: 760px; }
.bos-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.bos-modal-title { font-size: 17px; font-weight: 800; }
.bos-modal-close { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--bos-border); background: var(--bos-surface-2); color: var(--bos-text-dim); cursor: pointer; font-size: 14px; }
.bos-modal-close:hover { background: var(--bos-surface-hover); color: var(--bos-text); }
.bos-modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--bos-border); }
.bos-modal-actions-split { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--bos-border); }

/* ---------- boot error banner ---------- */
#bosBootErrorBanner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #3a0a0a; color: #ffdada; font: 12px ui-monospace, monospace; padding: 14px 18px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }

/* ---------- business grid card ---------- */
.bos-biz-card { overflow: hidden; display: flex; flex-direction: column; }
.bos-biz-cover { height: 120px; background: var(--bos-surface-2); background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; }
.bos-biz-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, rgba(10,10,10,0.75) 100%); }
.bos-biz-logo { position: relative; z-index: 1; width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 14px 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); flex-shrink: 0; }
.bos-biz-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; }
.bos-biz-name { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.bos-biz-desc { font-size: 12px; color: var(--bos-text-mute); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bos-biz-stat-row { display: flex; gap: 14px; }
.bos-biz-stat { flex: 1 1 0; min-width: 0; }
.bos-biz-stat-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--bos-text-mute); }
.bos-biz-stat-value { font-size: 14px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin-top: 2px; }
.bos-biz-focus { font-size: 11.5px; color: var(--bos-text-dim); background: var(--bos-surface-2); border-radius: 9px; padding: 8px 10px; border-left: 2px solid var(--bos-accent); }
.bos-biz-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.bos-biz-open { font-size: 12px; font-weight: 800; color: var(--bos-accent2); display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 0; }

/* ---------- business workspace (full page overlay) ---------- */
.bos-biz-page-bg { position: fixed; inset: 0; z-index: 2900; background: var(--bos-bg); display: none; overflow-y: auto; }
.bos-biz-page-bg.show { display: block; }
.bos-bp-header { padding: 20px 26px; border-bottom: 1px solid var(--bos-border); display: flex; align-items: center; gap: 14px; position: sticky; top: 0; background: rgba(13,13,13,0.88); backdrop-filter: blur(14px); z-index: 5; flex-wrap: wrap; }
.bos-bp-icon { width: 48px; height: 48px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 8px 22px rgba(0,0,0,0.3); }
.bos-bp-title-wrap { flex: 1 1 auto; min-width: 160px; }
.bos-bp-title { font-size: 19px; font-weight: 800; }
.bos-bp-meta { font-size: 11.5px; color: var(--bos-text-mute); margin-top: 2px; }
.bos-bp-body { padding: 22px 26px 90px; max-width: 1200px; margin: 0 auto; }
.bos-bp-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--bos-border); padding-bottom: 12px; }
.bos-bp-tab { padding: 8px 13px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--bos-text-mute); background: transparent; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.bos-bp-tab:hover { background: var(--bos-surface-hover); color: var(--bos-text); }
.bos-bp-tab.active { background: rgba(var(--bos-accent-rgb),0.16); color: #fff; border-color: rgba(var(--bos-accent-rgb),0.3); }

/* ---------- kanban ---------- */
.bos-kanban { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.bos-kanban-col { background: rgba(255,255,255,0.02); border: 1px solid var(--bos-border); border-radius: 14px; padding: 10px; min-width: 210px; }
.bos-kanban-col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--bos-text-mute); }
.bos-kanban-col-count { font-family: ui-monospace, monospace; background: var(--bos-surface-2); border-radius: 999px; padding: 1px 7px; font-size: 10px; }
.bos-kanban-col-body { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.bos-kanban-empty { text-align: center; font-size: 11px; color: var(--bos-text-mute); padding: 16px 4px; }
.bos-proj-card { background: var(--bos-surface); border: 1px solid var(--bos-border); border-radius: 12px; padding: 11px 12px; cursor: pointer; transition: border-color 0.15s ease, transform 0.15s ease; }
.bos-proj-card:hover { border-color: rgba(var(--bos-accent-rgb),0.4); transform: translateY(-2px); }
.bos-proj-title { font-size: 12.5px; font-weight: 700; margin-bottom: 7px; line-height: 1.35; }
.bos-proj-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.bos-proj-deadline { font-size: 10.5px; color: var(--bos-text-mute); font-family: ui-monospace, monospace; }
.bos-proj-deadline.bos-overdue { color: var(--bos-bad); font-weight: 700; }
.bos-proj-deadline.bos-soon { color: var(--bos-warn); font-weight: 700; }

/* ---------- Scrivener-style corkboard: Series cards + manuscript index
   cards. A Series card is a wide grouping "folder" tinted with the
   series' own color; a manuscript card mimics an actual Scrivener
   corkboard index card — a colored Label strip along the top edge, a
   folded top-right corner, a serif title, and a synopsis written like
   the lined synopsis area on the back of a real index card — plus a
   Status stamp and word-count progress footer, Scrivener's other two
   defining card attributes. ---------- */
.bos-corkboard-empty-series { border-style: dashed; }
.bos-series-card { border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; position: relative; overflow: hidden; border: 1px solid var(--bos-border); }
.bos-series-card::before { content: ''; position: absolute; inset: 0; opacity: 0.14; background: var(--bos-series-color, var(--bos-accent)); pointer-events: none; }
.bos-series-head { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; flex-wrap: wrap; }
.bos-series-dot { width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; background: var(--bos-series-color, var(--bos-accent)); box-shadow: 0 0 10px var(--bos-series-color, var(--bos-accent)); }
.bos-series-name { font-size: 15.5px; font-weight: 800; font-family: Georgia, "Iowan Old Style", serif; }
.bos-series-count { font-size: 10.5px; color: var(--bos-text-mute); font-weight: 700; }
.bos-series-desc { font-size: 12px; color: var(--bos-text-dim); margin-top: 6px; position: relative; z-index: 1; max-width: 640px; }
.bos-series-actions { margin-left: auto; display: flex; gap: 6px; position: relative; z-index: 1; }
.bos-standalone-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; color: var(--bos-text-mute); font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.bos-standalone-head::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--bos-border); }

.bos-ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 22px; }
.bos-ms-card {
  position: relative; background: #16130f; border: 1px solid var(--bos-border-strong); border-radius: 4px 4px 8px 8px;
  padding: 16px 15px 13px; min-height: 170px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.03) inset;
  transition: transform 0.18s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.18s ease;
}
.bos-ms-card:hover { transform: translateY(-4px) rotate(-0.3deg); box-shadow: 0 18px 34px rgba(0,0,0,0.5); }
.bos-ms-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 4px 4px 0 0; background: var(--bos-label-color, var(--bos-accent)); box-shadow: 0 0 12px var(--bos-label-color, var(--bos-accent)); }
.bos-ms-card::after { content: ''; position: absolute; top: 6px; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 16px 16px 0; border-color: transparent rgba(255,255,255,0.08) transparent transparent; }
.bos-ms-title { font-family: Georgia, "Iowan Old Style", serif; font-size: 14.5px; font-weight: 700; line-height: 1.3; padding-right: 14px; }
.bos-ms-synopsis {
  flex: 1 1 auto; font-size: 11.5px; line-height: 1.7; color: var(--bos-text-dim); font-style: italic;
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 18px, var(--bos-border) 19px);
  padding-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.bos-ms-synopsis.bos-ms-synopsis-empty { color: var(--bos-text-mute); font-style: normal; }
.bos-ms-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
.bos-ms-wordcount { font-size: 9.5px; color: var(--bos-text-mute); font-family: ui-monospace, monospace; }
.bos-ms-wordbar { height: 4px; border-radius: 999px; background: var(--bos-surface-2); overflow: hidden; margin-top: 4px; }
.bos-ms-wordbar-fill { height: 100%; background: var(--bos-label-color, var(--bos-accent)); }

/* ---------- generic list rows (products/content/customers/ops/files/knowledge/ai/notes) ---------- */
.bos-row { background: var(--bos-surface); border: 1px solid var(--bos-border); border-radius: 13px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color 0.15s ease, transform 0.15s ease; }
.bos-row:hover { border-color: rgba(var(--bos-accent-rgb),0.35); transform: translateY(-2px); }
.bos-row-top { display: flex; align-items: center; gap: 10px; }
.bos-row-title { font-size: 13.5px; font-weight: 800; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bos-row-meta { font-size: 11.5px; color: var(--bos-text-mute); line-height: 1.5; }
.bos-row-body { font-size: 12px; color: var(--bos-text-dim); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bos-row-tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- charts (hand-rolled — no charting library, see header note) ---------- */
.bos-bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 6px; }
.bos-bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bos-bar-track { width: 100%; max-width: 34px; height: 100px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; background: var(--bos-surface-2); }
.bos-bar-seg { width: 100%; transition: height 0.6s cubic-bezier(0.16,1,0.3,1); }
.bos-bar-label { font-size: 10px; color: var(--bos-text-mute); font-weight: 700; }
.bos-donut-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
.bos-donut { width: 100%; height: 100%; border-radius: 50%; }
.bos-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bos-donut-pct { font-size: 20px; font-weight: 800; font-family: ui-monospace, monospace; }
.bos-donut-label { font-size: 9px; color: var(--bos-text-mute); font-weight: 700; text-transform: uppercase; }

/* ---------- checklist / activity rows ---------- */
.bos-checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--bos-border); }
.bos-checklist-item:last-child { border-bottom: none; }
.bos-check-circle { width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--bos-border-strong); flex-shrink: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; transition: all 0.15s ease; }
.bos-check-circle.done { background: linear-gradient(135deg, var(--bos-accent), var(--bos-accent2)); border-color: transparent; color: #fff; }
.bos-checklist-text { font-size: 13px; flex: 1 1 auto; }
.bos-checklist-item.bos-done .bos-checklist-text { color: var(--bos-text-mute); text-decoration: line-through; }
.bos-activity-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; }
.bos-activity-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--bos-surface-2); }
.bos-activity-title { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bos-activity-sub { font-size: 10.5px; color: var(--bos-text-mute); }

/* ---------- command palette + quick capture + notifications ---------- */
.bos-cp-modal { max-width: 620px; padding: 0; overflow: hidden; }
.bos-cp-input-wrap { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--bos-border); }
.bos-cp-input { border: none !important; background: none !important; font-size: 15px !important; padding: 4px 0 !important; }
.bos-cp-input:focus { border: none !important; }
.bos-cp-results { max-height: 60vh; overflow-y: auto; padding: 8px; }
.bos-cp-group-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bos-text-mute); padding: 10px 10px 4px; }
.bos-cp-row { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.bos-cp-row:hover, .bos-cp-row.bos-cp-sel { background: var(--bos-surface-hover); }
.bos-cp-row-icon { width: 26px; text-align: center; font-size: 14px; }
.bos-cp-row-label { flex: 1 1 auto; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bos-cp-row-kind { font-size: 10px; color: var(--bos-text-mute); font-weight: 700; }

.bos-fab { position: fixed; right: 26px; bottom: 26px; z-index: 2400; width: 54px; height: 54px; border-radius: 999px; background: linear-gradient(135deg, var(--bos-accent) 0%, var(--bos-accent2) 100%); border: none; color: #fff; font-size: 22px; cursor: pointer; box-shadow: 0 10px 30px rgba(var(--bos-accent-rgb),0.5); display: flex; align-items: center; justify-content: center; transition: transform 0.18s ease, box-shadow 0.18s ease; }
.bos-fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 36px rgba(var(--bos-accent-rgb),0.6); }

.bos-notif-panel { position: fixed; top: 64px; right: 26px; z-index: 3100; width: 340px; max-height: 60vh; overflow-y: auto; background: rgba(20,20,21,0.96); border: 1px solid var(--bos-border-strong); border-radius: 16px; box-shadow: var(--bos-shadow); backdrop-filter: blur(20px); padding: 10px; display: none; }
.bos-notif-panel.show { display: block; }
.bos-notif-row { display: flex; gap: 10px; padding: 10px 8px; border-radius: 10px; align-items: flex-start; }
.bos-notif-row:hover { background: var(--bos-surface-hover); cursor: pointer; }
.bos-notif-icon { font-size: 14px; margin-top: 1px; }
.bos-notif-text { font-size: 12px; font-weight: 700; }
.bos-notif-sub { font-size: 10.5px; color: var(--bos-text-mute); margin-top: 1px; }

.bos-cap-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.bos-cap-tab { flex: 1 1 0; padding: 8px; border-radius: 9px; text-align: center; font-size: 12px; font-weight: 700; background: var(--bos-surface-2); border: 1px solid var(--bos-border); color: var(--bos-text-mute); cursor: pointer; }
.bos-cap-tab.active { background: rgba(var(--bos-accent-rgb),0.16); color: #fff; border-color: rgba(var(--bos-accent-rgb),0.3); }

/* ---------- mobile ---------- */
.bos-sb-toggle { display: none; }
@media (max-width: 980px) {
  .bos-sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
  .bos-sidebar.bos-sb-open { transform: translateX(0); }
  .bos-sb-toggle { display: inline-flex; }
  .bos-header { padding-left: 60px; }
  .bos-kanban { grid-template-columns: repeat(5, 240px); }
}
@media (max-width: 600px) {
  .bos-main { padding: 20px 14px 90px; }
  .bos-header { padding: 12px 14px; padding-left: 56px; }
  .bos-search-wrap .bos-kbd { display: none; }
}
</style>
</head>
<body>
<div id="bosBootErrorBanner"></div>
<div class="bos-bg-glow"></div>

<script>
function $(id) { return document.getElementById(id); }
function esc(s) { return D ? D.escapeHtml(s) : String(s == null ? '' : s); }
var D = null;
var state = {
  activeSection: 'home',
  activeBizId: null,
  activeBizTab: 'overview',
  cpSelIndex: 0,
  cpResults: [],
  capTab: 'new'
};

function showBootErrorBanner(err, context) {
  try {
    var banner = $('bosBootErrorBanner');
    if (!banner) return;
    var detail = (context ? '[' + context + '] ' : '') + (err && err.stack ? err.stack : String(err));
    banner.style.display = 'block';
    banner.textContent = '⚠ Business OS failed to load correctly:\n' + detail + '\n';
    var btn = document.createElement('button');
    btn.textContent = 'Copy error details';
    btn.style.cssText = 'margin-top:8px;padding:6px 12px;background:#ff5757;color:#3a0a0a;border:0;border-radius:4px;font-weight:bold;cursor:pointer;';
    btn.addEventListener('click', function () { try { navigator.clipboard.writeText(detail); btn.textContent = 'Copied!'; } catch (e) {} });
    banner.appendChild(btn);
  } catch (e2) {}
}
function runSafely(fn, context) {
  try { fn(); } catch (err) { showBootErrorBanner(err, context); }
}
// =====================================================================
// FORMAT / SMALL HELPERS
// =====================================================================
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtDateFull(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function deadlineClass(iso, doneAlready) {
  if (!iso || doneAlready) return '';
  if (iso < D.todayISO()) return 'bos-overdue';
  if (iso <= D.isoDaysFromNow(3)) return 'bos-soon';
  return '';
}
function statTile(icon, value, label, sub, subClass) {
  return '<div class="bos-card bos-stat-tile"><div class="bos-stat-icon">' + icon + '</div>' +
    '<div class="bos-stat-value">' + value + '</div><div class="bos-stat-label">' + esc(label) + '</div>' +
    (sub ? '<div class="bos-stat-sub" style="color:var(--bos-' + (subClass || 'text-mute') + ')">' + sub + '</div>' : '') + '</div>';
}
function emptyState(icon, title, sub) {
  return '<div class="bos-empty"><div class="bos-empty-icon">' + icon + '</div><div class="bos-empty-title">' + esc(title) + '</div><div class="bos-empty-sub">' + esc(sub || '') + '</div></div>';
}
function priorityPill(p) {
  var cls = p === 'high' ? 'bos-pill-bad' : (p === 'low' ? 'bos-pill-mute' : 'bos-pill-warn');
  return '<span class="bos-pill ' + cls + '">' + esc((p || 'medium').toUpperCase()) + '</span>';
}
function labelPill(value, cls) { return '<span class="bos-pill ' + (cls || 'bos-pill-mute') + '">' + esc(value) + '</span>'; }
function progressBarHtml(pct, goodOverride) {
  var p = Math.max(0, Math.min(100, pct || 0));
  return '<div class="bos-progress-bar"><div class="bos-progress-fill' + (goodOverride ? ' bos-fill-good' : '') + '" style="width:' + p + '%"></div></div>';
}
function bizName(id) { var b = id && D.business(id); return b ? b.name : ''; }
function bizChipOptions(includeNone) {
  var opts = D.businessesSorted().map(function (b) { return { value: b.id, label: b.logo + ' ' + b.name }; });
  if (includeNone) opts.unshift({ value: '', label: '— Unscoped / Global —' });
  return opts;
}

// =====================================================================
// GENERIC FIELD-FORM MODAL — one reusable component backing every
// add/edit modal in this app (Businesses/Projects/Products/Content/
// Customers/Operations/Finance records/AI Prompts/Knowledge/Notes/
// Files/Tasks/Goals), same recipe as learning-dashboard.html's own
// openFormModal(). Field types: text, textarea, select, number, money,
// date, url, email, checkbox, color.
// =====================================================================
function buildFieldHtml(f, values) {
  var val = values && values[f.key] !== undefined && values[f.key] !== null ? values[f.key] : (f.default !== undefined ? f.default : '');
  var id = 'bosField_' + f.key;
  var label = '<label class="bos-field-label" for="' + id + '">' + esc(f.label) + '</label>';
  var input;
  if (f.type === 'textarea') {
    input = '<textarea id="' + id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(val) + '</textarea>';
  } else if (f.type === 'select') {
    input = '<select id="' + id + '">' + f.options.map(function (o) {
      var ov = (typeof o === 'object') ? o.value : o;
      var ol = (typeof o === 'object') ? o.label : o;
      return '<option value="' + esc(ov) + '"' + (String(ov) === String(val) ? ' selected' : '') + '>' + esc(ol) + '</option>';
    }).join('') + '</select>';
  } else if (f.type === 'checkbox') {
    input = '<label class="bos-checkbox-row"><input type="checkbox" id="' + id + '" ' + (val ? 'checked' : '') + '> <span>' + esc(f.checkLabel || '') + '</span></label>';
  } else if (f.type === 'color') {
    input = '<div class="bos-swatch-row">' + f.options.map(function (c) {
      return '<button type="button" class="bos-swatch' + (c === val ? ' active' : '') + '" data-color-field="' + id + '" data-color="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
    }).join('') + '</div><input type="hidden" id="' + id + '" value="' + esc(val) + '">';
  } else if (f.type === 'money') {
    var displayVal = typeof val === 'number' ? (val / 100).toFixed(2) : val;
    input = '<input type="text" id="' + id + '" value="' + esc(displayVal) + '" placeholder="' + esc(f.placeholder || '0.00') + '" inputmode="decimal">';
  } else {

// CHARTS — hand-rolled (no charting library, see this file's header
// note): div bars for trends, a CSS conic-gradient donut for a single
// percentage. Same "no build step, no npm packages" convention as every
// other visualization in this app.
// =====================================================================
function donutHtml(pct, label, color) {
  var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
  var col = color || 'var(--bos-accent)';
  return '<div class="bos-donut-wrap"><div class="bos-donut" style="background:conic-gradient(' + col + ' ' + (p * 3.6) + 'deg, var(--bos-surface-2) 0deg);">' +
    '<div style="position:absolute; inset:9px; border-radius:50%; background:#141414;"></div></div>' +
    '<div class="bos-donut-center"><div class="bos-donut-pct">' + p + '%</div><div class="bos-donut-label">' + esc(label) + '</div></div></div>';
}
function buildBarsHtml(items, color) {
  var max = Math.max.apply(null, items.map(function (i) { return Math.abs(i.value); }).concat([1]));
  var html = '<div class="bos-bars">';
  items.forEach(function (it) {
    var h = Math.max(4, Math.round((Math.abs(it.value) / max) * 100));
    var c = it.value < 0 ? 'var(--bos-bad)' : (color || 'var(--bos-accent)');
    html += '<div class="bos-bar-col" title="' + esc(it.label) + ': ' + (it.tooltip || it.value) + '"><div class="bos-bar-track"><div class="bos-bar-seg" style="height:' + h + '%; background:' + c + ';"></div></div><div class="bos-bar-label">' + esc(it.label) + '</div></div>';
  });
  html += '</div>';
  return html;
}
function buildNetBarsFromMonthly(monthly) {

  var totalExp = monthly.reduce(function (s, m) { return s + m.expenseCents; }, 0);
  var items = monthly.map(function (m) {
    var net = m.revenueCents - m.expenseCents;
    return { label: m.label, value: net / 100, tooltip: 'Rev ' + D.formatCents(m.revenueCents) + ' · Exp ' + D.formatCents(m.expenseCents) + ' · Net ' + D.formatCents(net) };
  });
  return '<div style="display:flex; gap:16px; font-size:11px; color:var(--bos-text-mute); margin-bottom:10px;">' +
    '<span>● Revenue <b style="color:var(--bos-text)">' + D.formatCents(totalRev, { compact: true }) + '</b></span>' +
    '<span>● Expenses <b style="color:var(--bos-text)">' + D.formatCents(totalExp, { compact: true }) + '</b></span>' +
    '<span>Net bars colored by sign — hover a bar for the month\'s breakdown</span></div>' + buildBarsHtml(items);
}

var projectsViewMode = 'kanban';
function renderProjectsSection(containerId, businessId) {
  var groups = D.projectsByStatus(businessId);

  var html = businessId === null ? '<div class="bos-anim">' + pageHead('Delivery', 'Projects', 'Kanban across every business — status, priority, owner, deadline, progress.',
    '<button class="bos-btn bos-btn-primary" id="bosNewProjBtn">➕ New Project</button>') :

function buildKanban(groups) {

function manuscriptFormFields(businessId) {
  var fields = [
    { key: 'title', label: 'Manuscript Title', type: 'text', placeholder: 'e.g. The Long Winter' },
    { key: 'labelColor', label: 'Label Color', type: 'color', options: D.BIZ_COLORS },
    { key: 'manuscriptStatus', label: 'Status', type: 'select', half: true, options: D.MANUSCRIPT_STATUSES.map(function (s) { return { value: s, label: D.MANUSCRIPT_STATUS_LABELS[s] }; }) },
    { key: 'priority', label: 'Priority', type: 'select', half: true, options: D.PRIORITIES },
    { key: 'wordCountCurrent', label: 'Word Count So Far', type: 'number', half: true, placeholder: '0' },
    { key: 'wordCountGoal', label: 'Word Count Goal', type: 'number', half: true, placeholder: '80000' },
    { key: 'deadline', label: 'Target Deadline', type: 'date', half: true },
    { key: 'owner', label: 'Author', type: 'text', half: true, placeholder: 'Me' },
    { key: 'synopsis', label: 'Synopsis', type: 'textarea', rows: 4, placeholder: "The index-card summary — what's this one actually about?" }
  ];
  // The Series picker only makes sense once the business is fixed and

  // the global Projects page, where the business itself is one of the

  // own workspace, where this field then appears correctly scoped.
  if (businessId) fields.splice(1, 0, { key: 'seriesId', label: 'Series', type: 'select', options: [{ value: '', label: '— Standalone —' }].concat(D.seriesFor(businessId).map(function (s) { return { value: s.id, label: s.name }; })) });
  if (!businessId) fields.unshift({ key: 'businessId', label: 'Business', type: 'select', options: bizChipOptions(false) });

// SALES — a read-mostly rollup over Customers + Finance: revenue trend,
// a simple funnel (leads → qualified → won), and top accounts by LTV.
// =====================================================================
function renderSalesSection(containerId, businessId) {
  var monthly = D.monthlyTxTotals(businessId, 6);
  var all = D.customersFor(businessId);
  var leads = all.filter(function (c) { return c.type === 'lead'; }).length;
  var qualified = all.filter(function (c) { return c.status === 'qualified' || c.status === 'won'; }).length;
  var won = all.filter(function (c) { return c.status === 'won'; }).length;
  var topAccounts = all.slice().sort(function (a, b) { return b.ltvCents - a.ltvCents; }).slice(0, 6);
  var recentWins = all.filter(function (c) { return c.status === 'won'; }).sort(function (a, b) { return b.createdAt - a.createdAt; }).slice(0, 5);
  var html = businessId ? '<div class="bos-section-title"><span>Sales</span></div>' : '<div class="bos-anim">' + pageHead('Revenue', 'Sales', 'How revenue is trending and where it is coming from.', '');
  html += '<div class="bos-card bos-card-pad" style="margin:14px 0 16px;"><div class="bos-section-title"><span>Revenue Trend — last 6 months</span></div>' + buildNetBarsFromMonthly(monthly) + '</div>';
  html += '<div class="bos-grid bos-grid-2">';
  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>Sales Funnel</span></div>' +
    '<div style="display:flex; gap:10px; align-items:center; margin-top:6px;">' +
    '<div style="flex:1 1 0; text-align:center;"><div class="bos-stat-value" style="font-size:20px;">' + leads + '</div><div class="bos-stat-label">Leads</div></div>' +
    '<span style="color:var(--bos-text-mute);">→</span>' +
    '<div style="flex:1 1 0; text-align:center;"><div class="bos-stat-value" style="font-size:20px;">' + qualified + '</div><div class="bos-stat-label">Qualified</div></div>' +
    '<span style="color:var(--bos-text-mute);">→</span>' +
    '<div style="flex:1 1 0; text-align:center;"><div class="bos-stat-value" style="font-size:20px; color:var(--bos-good);">' + won + '</div><div class="bos-stat-label">Won</div></div></div></div>';
  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>Recent Wins</span></div>';
  if (!recentWins.length) html += '<div class="bos-empty-sub" style="text-align:left; padding:4px 0;">No wins logged yet.</div>';
  else recentWins.forEach(function (c) { html += '<div class="bos-activity-row"><span class="bos-activity-icon">🏆</span><div style="flex:1 1 auto; min-width:0;"><div class="bos-activity-title">' + esc(c.name) + '</div><div class="bos-activity-sub">' + (!businessId ? esc(bizName(c.businessId)) + ' · ' : '') + D.formatCents(c.ltvCents, { compact: true }) + ' LTV</div></div></div>'; });
  html += '</div></div>';
  html += '<div class="bos-card bos-card-pad" style="margin-top:16px;"><div class="bos-section-title"><span>Top Accounts by Lifetime Value</span></div>';
  if (!topAccounts.length) html += emptyState('💵', 'No accounts yet', '');
  else topAccounts.forEach(function (c) { html += '<div class="bos-activity-row"><span class="bos-activity-icon">' + (c.type === 'lead' ? '🧲' : '🤝') + '</span><div style="flex:1 1 auto; min-width:0;"><div class="bos-activity-title">' + esc(c.name) + '</div><div class="bos-activity-sub">' + (!businessId ? esc(bizName(c.businessId)) : (c.segment || c.status)) + '</div></div><span class="bos-tag">' + D.formatCents(c.ltvCents, { compact: true }) + '</span></div>'; });
  html += '</div>';
  if (!businessId) html += '</div>';
  $(containerId).innerHTML = html;
}

function openOpsModal(ops, businessId) {

    onDelete: ops ? function () { D.Operations.remove(ops.id); renderAllVisible(); } : null,

function renderOperationsSection(containerId, businessId) {
  var list = D.operationsFor(businessId);
  var html = businessId ? '<div class="bos-section-title"><span>Operations (' + list.length + ')</span><button class="bos-btn bos-btn-sm" id="bosNewOpsBtn">+ New</button></div>' :
    '<div class="bos-anim">' + pageHead('Systems', 'Operations', 'SOPs, checklists, templates, automations, and documents — across every business.', '<button class="bos-btn bos-btn-primary" id="bosNewOpsBtn">➕ New</button>');
  if (!list.length) html += emptyState('📦', 'Nothing documented yet', 'Write down the process once, run it forever.');
  else html += '<div class="bos-grid bos-grid-2">' + list.map(function (o) {
    var doneCount = o.checklist.filter(function (i) { return i.done; }).length;
    return '<div class="bos-card bos-card-pad" data-ops-id="' + o.id + '">' +
      '<div class="bos-row-top" style="margin-bottom:6px;"><span class="bos-row-title" style="cursor:pointer;" data-ops-edit="' + o.id + '">' + esc(o.title) + '</span>' + labelPill(D.OPS_KIND_LABELS[o.kind], 'bos-pill-info') +
      (!businessId ? '<span class="bos-tag">' + esc(bizName(o.businessId)) + '</span>' : '') + '</div>' +
      (o.body ? '<div class="bos-row-body" style="-webkit-line-clamp:3;">' + esc(o.body) + '</div>' : '') +
      '<div style="margin-top:10px;">' +
      o.checklist.map(function (item) {
        return '<div class="bos-checklist-item' + (item.done ? ' bos-done' : '') + '" style="padding:6px 2px;">' +
          '<span class="bos-check-circle' + (item.done ? ' done' : '') + '" data-ops-toggle-item="' + o.id + '|' + item.id + '">' + (item.done ? '✓' : '') + '</span>' +
          '<span class="bos-checklist-text" style="font-size:12px;">' + esc(item.text) + '</span>' +
          '<button type="button" class="bos-btn-icon-sm" data-ops-del-item="' + o.id + '|' + item.id + '">✕</button></div>';
      }).join('') +
      '<div style="display:flex; gap:6px; margin-top:6px;"><input type="text" placeholder="+ checklist item" data-ops-add-input="' + o.id + '" style="font-size:12px; padding:6px 9px;"></div>' +
      (o.checklist.length ? '<div style="font-size:10.5px; color:var(--bos-text-mute); margin-top:6px;">' + doneCount + '/' + o.checklist.length + ' done</div>' : '') +
      '</div></div>';
  }).join('') + '</div>';
  if (!businessId) html += '</div>';
  $(containerId).innerHTML = html;
  var newBtn = document.getElementById('bosNewOpsBtn'); if (newBtn) newBtn.addEventListener('click', function () { openOpsModal(null, businessId); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ops-edit]'), function (el) { el.addEventListener('click', function () { openOpsModal(D.Operations.get(el.getAttribute('data-ops-edit')), businessId); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ops-toggle-item]'), function (el) {
    el.addEventListener('click', function () {
      var parts = el.getAttribute('data-ops-toggle-item').split('|');
      var o = D.Operations.get(parts[0]);
      var cl = o.checklist.map(function (i) { return i.id === parts[1] ? Object.assign({}, i, { done: !i.done }) : i; });
      D.Operations.update(o.id, { checklist: cl });
      renderOperationsSection(containerId, businessId);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ops-del-item]'), function (el) {
    el.addEventListener('click', function () {
      var parts = el.getAttribute('data-ops-del-item').split('|');
      var o = D.Operations.get(parts[0]);
      D.Operations.update(o.id, { checklist: o.checklist.filter(function (i) { return i.id !== parts[1]; }) });
      renderOperationsSection(containerId, businessId);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ops-add-input]'), function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || !el.value.trim()) return;
      var o = D.Operations.get(el.getAttribute('data-ops-add-input'));
      D.Operations.update(o.id, { checklist: o.checklist.concat([{ id: D.uid('chk'), text: el.value.trim(), done: false }]) });
      renderOperationsSection(containerId, businessId);
    });
  });
}

// AI WORKSPACE — a prompt library (favorite, category, copy-to-
// clipboard). Custom GPTs / Claude Projects / automations / research are
// modeled as categories on the same collection, same "one database,
// filtered by category" precedent as aitech.html's own Prompts. This app
// has no active LLM key anywhere (still an inactive placeholder — see
// CLAUDE.md), so nothing here calls a real AI API; prompts are meant to
// be copied into whichever AI tool you actually use.
// =====================================================================
var aiFilter = { category: '', favOnly: false };
function aiFormFields(businessId) {
  var fields = [
    { key: 'title', label: 'Title', type: 'text', placeholder: 'e.g. Book blurb generator' },
    { key: 'category', label: 'Category', type: 'select', options: D.AI_CATEGORIES.map(function (c) { return { value: c, label: D.AI_CATEGORY_LABELS[c] }; }) },
    { key: 'body', label: 'Prompt', type: 'textarea', rows: 6, placeholder: 'The actual prompt text — use {placeholders} for anything you\'ll fill in each time.' },
    { key: 'favorite', label: '', type: 'checkbox', checkLabel: '⭐ Favorite' }
  ];
  fields.splice(1, 0, { key: 'businessId', label: 'Business (optional)', type: 'select', options: bizChipOptions(true) });
  return fields;
}
function openAIModal(item, businessId) {
  openFormModal({
    title: item ? 'Edit Prompt' : 'New AI Prompt',
    fields: aiFormFields(businessId),
    values: item || { category: 'prompt-library', businessId: businessId || '' },
    submitLabel: item ? 'Save Changes' : 'Add Prompt',
    validate: function (v) { if (!v.title.trim()) return 'Give this prompt a title.'; return null; },
    onSubmit: function (v) { if (!v.businessId) v.businessId = null; if (item) D.AIPrompts.update(item.id, v); else { v.order = D.nextOrder(D.AIPrompts.list()); D.AIPrompts.add(v); } renderAllVisible(); },
    onDelete: item ? function () { D.AIPrompts.remove(item.id); renderAllVisible(); } : null,
    deleteConfirm: 'Delete "' + (item ? item.title : '') + '"?'
  });
}
function renderAISection(containerId, businessId) {
  var all = D.aiPromptsFor(businessId);
  var list = all.filter(function (p) { return (!aiFilter.category || p.category === aiFilter.category) && (!aiFilter.favOnly || p.favorite); });
  var html = businessId ? '<div class="bos-section-title"><span>AI Workspace (' + all.length + ')</span><button class="bos-btn bos-btn-sm" id="bosNewAiBtn">+ New Prompt</button></div>' :
    '<div class="bos-anim">' + pageHead('Tools', 'AI Workspace', 'Prompt library, custom GPTs, Claude Projects, automations, writing/marketing tools, brainstorming, and research — all copy-ready.', '<button class="bos-btn bos-btn-primary" id="bosNewAiBtn">➕ New Prompt</button>');
  html += '<div class="bos-chip-row" style="margin:12px 0 18px;" id="bosAiChips">' +
    '<button type="button" class="bos-chip' + (!aiFilter.category ? ' active' : '') + '" data-ai-cat="">All</button>' +
    D.AI_CATEGORIES.map(function (c) { return '<button type="button" class="bos-chip' + (aiFilter.category === c ? ' active' : '') + '" data-ai-cat="' + c + '">' + D.AI_CATEGORY_LABELS[c] + '</button>'; }).join('') +
    '<button type="button" class="bos-chip' + (aiFilter.favOnly ? ' active' : '') + '" id="bosAiFavChip">★ Favorites</button></div>';
  if (!list.length) html += emptyState('🤖', all.length ? 'Nothing matches this filter' : 'No prompts saved yet', '');
  else html += '<div class="bos-grid bos-grid-3">' + list.map(function (p) {
    return '<div class="bos-row" data-ai-id="' + p.id + '"><div class="bos-row-top"><span class="bos-row-title">' + esc(p.title) + '</span>' +
      '<button type="button" class="bos-btn-icon-sm" data-ai-fav="' + p.id + '" style="' + (p.favorite ? 'color:var(--bos-warn);' : '') + '">★</button></div>' +
      '<div class="bos-row-meta">' + D.AI_CATEGORY_LABELS[p.category] + (p.businessId ? ' · ' + esc(bizName(p.businessId)) : '') + '</div>' +
      '<div class="bos-row-body" style="font-family:ui-monospace,monospace; font-size:11px;">' + esc(p.body) + '</div>' +
      '<button type="button" class="bos-btn bos-btn-sm" data-ai-copy="' + p.id + '" style="align-self:flex-start;">📋 Copy</button></div>';
  }).join('') + '</div>';
  if (!businessId) html += '</div>';
  $(containerId).innerHTML = html;
  var newBtn = document.getElementById('bosNewAiBtn'); if (newBtn) newBtn.addEventListener('click', function () { openAIModal(null, businessId); });
  var favChip = document.getElementById('bosAiFavChip'); if (favChip) favChip.addEventListener('click', function () { aiFilter.favOnly = !aiFilter.favOnly; renderAISection(containerId, businessId); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ai-cat]'), function (el) { el.addEventListener('click', function () { aiFilter.category = el.getAttribute('data-ai-cat') || null; renderAISection(containerId, businessId); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ai-fav]'), function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); var p = D.AIPrompts.get(el.getAttribute('data-ai-fav')); D.AIPrompts.update(p.id, { favorite: !p.favorite }); renderAISection(containerId, businessId); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ai-copy]'), function (el) {
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      var p = D.AIPrompts.get(el.getAttribute('data-ai-copy'));
      try { navigator.clipboard.writeText(p.body); var old = el.textContent; el.textContent = '✓ Copied'; setTimeout(function () { el.textContent = old; }, 1400); } catch (err) {}
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-ai-id]'), function (el) {
    el.addEventListener('click', function (e) { if (e.target.closest('[data-ai-fav],[data-ai-copy]')) return; openAIModal(D.AIPrompts.get(el.getAttribute('data-ai-id')), businessId); });
  });
}

// =====================================================================
// BUSINESS OVERVIEW TAB — mission/vision, quarterly/monthly/weekly
// goals, KPIs, upcoming launches, top priorities.
// =====================================================================
function renderOverviewSection(containerId, businessId) {
  var b = D.business(businessId);
  if (!b) { $(containerId).innerHTML = emptyState('🏢', 'Business not found', ''); return; }
  var monthKey = D.monthKey(D.todayISO());
  var monthTx = D.txFor(businessId, { month: monthKey });
  var monthExp = monthTx.filter(function (t) { return t.type === 'expense'; }).reduce(function (s, t) { return s + t.amountCents; }, 0);
  var launches = D.productsFor(businessId).filter(function (p) { return p.status === 'development' && p.launchDate; }).sort(function (a, b2) { return a.launchDate < b2.launchDate ? -1 : 1; });
  var topPriorities = D.projectsFor(businessId).filter(function (p) { return p.priority === 'high' && p.status !== 'done'; });

  var html = '<div class="bos-grid bos-grid-2">';
  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>Mission & Vision</span><button class="bos-btn bos-btn-sm" data-edit-biz="' + b.id + '">✎ Edit</button></div>' +
    '<div style="font-size:12px; color:var(--bos-text-mute); margin-bottom:3px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Mission</div>' +
    '<div style="font-size:13px; margin-bottom:12px;">' + (b.mission ? esc(b.mission) : '<span style="color:var(--bos-text-mute);">Not set yet.</span>') + '</div>' +
    '<div style="font-size:12px; color:var(--bos-text-mute); margin-bottom:3px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Vision</div>' +
    '<div style="font-size:13px;">' + (b.vision ? esc(b.vision) : '<span style="color:var(--bos-text-mute);">Not set yet.</span>') + '</div></div>';

  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>KPIs</span></div>' +
    '<div class="bos-grid bos-grid-4" style="gap:10px;">' +
    '<div><div class="bos-stat-value" style="font-size:16px;">' + D.formatCents(b.revenueCents, { compact: true }) + '</div><div class="bos-stat-label">Revenue</div></div>' +
    '<div><div class="bos-stat-value" style="font-size:16px;">' + D.formatCents(b.profitCents, { compact: true }) + '</div><div class="bos-stat-label">Profit</div></div>' +
    '<div><div class="bos-stat-value" style="font-size:16px;">' + b.conversionRate + '%</div><div class="bos-stat-label">Conversion</div></div>' +
    '<div><div class="bos-stat-value" style="font-size:16px;">' + b.trafficMonthly.toLocaleString() + '</div><div class="bos-stat-label">Traffic</div></div>' +
    '<div><div class="bos-stat-value" style="font-size:16px;">' + D.formatCents(monthExp, { compact: true }) + '</div><div class="bos-stat-label">Expenses (mo.)</div></div>' +
    '</div></div>';
  html += '</div>';

  ['quarter', 'month', 'week'].forEach(function (scope) {
    var goals = D.goalsFor(businessId, scope);
    html += '<div class="bos-card bos-card-pad" style="margin-top:16px;"><div class="bos-section-title"><span>' + D.GOAL_SCOPE_LABELS[scope] + ' Goals</span><button class="bos-btn bos-btn-sm" data-add-goal="' + scope + '">+ Add</button></div>';
    if (!goals.length) html += '<div class="bos-empty-sub" style="text-align:left; padding:4px 0;">No ' + scope + 'ly goals yet.</div>';
    else goals.forEach(function (g) {
      html += '<div class="bos-checklist-item' + (g.done ? ' bos-done' : '') + '"><span class="bos-check-circle' + (g.done ? ' done' : '') + '" data-toggle-goal="' + g.id + '">' + (g.done ? '✓' : '') + '</span>' +
        '<span class="bos-checklist-text" data-edit-goal="' + g.id + '" style="cursor:pointer;">' + esc(g.text) + '</span></div>';
    });
    html += '</div>';
  });

  html += '<div class="bos-grid bos-grid-2" style="margin-top:16px;">';
  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>Upcoming Launches</span></div>';
  if (!launches.length) html += emptyState('🚀', 'Nothing scheduled', '');
  else launches.forEach(function (p) { html += '<div class="bos-activity-row"><span class="bos-activity-icon">🛒</span><div style="flex:1 1 auto; min-width:0;"><div class="bos-activity-title">' + esc(p.name) + '</div></div><span class="bos-proj-deadline ' + deadlineClass(p.launchDate) + '">' + fmtDate(p.launchDate) + '</span></div>'; });
  html += '</div>';
  html += '<div class="bos-card bos-card-pad"><div class="bos-section-title"><span>Top Priorities</span></div>';
  if (!topPriorities.length) html += emptyState('🎯', 'Nothing high-priority right now', '');
  else topPriorities.forEach(function (p) { html += '<div class="bos-activity-row"><span class="bos-activity-icon">🚀</span><div style="flex:1 1 auto; min-width:0;"><div class="bos-activity-title">' + esc(p.title) + '</div></div>' + (p.deadline ? '<span class="bos-proj-deadline ' + deadlineClass(p.deadline) + '">' + fmtDate(p.deadline) + '</span>' : '') + '</div>'; });
  html += '</div></div>';

  $(containerId).innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-edit-biz]'), function (el) { el.addEventListener('click', function () { openBusinessModal(D.business(el.getAttribute('data-edit-biz'))); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-add-goal]'), function (el) { el.addEventListener('click', function () { openGoalModal(null, businessId, el.getAttribute('data-add-goal')); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-toggle-goal]'), function (el) { el.addEventListener('click', function () { var g = D.Goals.get(el.getAttribute('data-toggle-goal')); D.Goals.update(g.id, { done: !g.done }); renderOverviewSection(containerId, businessId); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#' + containerId + ' [data-edit-goal]'), function (el) { el.addEventListener('click', function () { openGoalModal(D.Goals.get(el.getAttribute('data-edit-goal')), businessId); }); });
}

// =====================================================================
// COMMAND PALETTE / GLOBAL SEARCH (Ctrl+K) — in these reference apps
// (Linear/Raycast/Arc), search *is* the command palette; the header
// search box and Ctrl+K both open the same modal, per that same real
// convention rather than building two separate search UIs.
// =====================================================================
var QUICK_ACTIONS = [
  { icon: '🏢', label: 'New Business', run: function () { openBusinessModal(null); } },
  { icon: '🚀', label: 'New Project', run: function () { openProjectModal(null, state.activeBizId); } },
  { icon: '🛒', label: 'New Product', run: function () { openProductModal(null, state.activeBizId); } },
  { icon: '✅', label: 'New Task', run: function () { openTaskModal(null, state.activeBizId); } },
  { icon: '📢', label: 'New Content / Campaign', run: function () { openContentModal(null, state.activeBizId, null, D.CONTENT_PLATFORMS); } },
  { icon: '👥', label: 'New Customer / Lead', run: function () { openCustomerModal(null, state.activeBizId); } },
  { icon: '🗒️', label: 'New Note', run: function () { openNoteModal(null, state.activeBizId); } },
  { icon: '⚡', label: 'Quick Capture', run: function () { openQuickCapture(); } }
];
function openCommandPalette() {
  $('bosCpModalBg').classList.add('show');
  $('bosCpInput').value = '';
  renderPaletteResults('');
  setTimeout(function () { $('bosCpInput').focus(); }, 30);
}
function closeCommandPalette() { $('bosCpModalBg').classList.remove('show'); }
function renderPaletteResults(rawQuery) {
  var q = rawQuery.trim().toLowerCase();
  var actions = QUICK_ACTIONS.filter(function (a) { return !q || a.label.toLowerCase().indexOf(q) !== -1; });
  var results = q ? D.searchAll(q) : [];
  var flat = actions.map(function (a) { return { type: 'action', data: a }; }).concat(results.map(function (r) { return { type: 'result', data: r }; }));
  state.cpResults = flat;
  state.cpSelIndex = 0;
  var html = '';
  if (actions.length) { html += '<div class="bos-cp-group-label">Quick Actions</div>'; actions.forEach(function (a, i) { html += cpRowHtml(a.icon, a.label, '', i); }); }
  if (q) {
    html += '<div class="bos-cp-group-label">Results</div>';
    if (!results.length) html += '<div style="padding:14px 12px; font-size:12.5px; color:var(--bos-text-mute);">No matches for "' + esc(rawQuery) + '"</div>';
    else results.forEach(function (r, i) { html += cpRowHtml(r.icon, r.label, r.kind, actions.length + i); });
  }
  $('bosCpResults').innerHTML = html || '<div style="padding:14px 12px; font-size:12.5px; color:var(--bos-text-mute);">Nothing to show.</div>';
  wireCpRows();
}
function cpRowHtml(icon, label, kind, idx) {
  return '<div class="bos-cp-row' + (idx === 0 ? ' bos-cp-sel' : '') + '" data-cp-idx="' + idx + '"><span class="bos-cp-row-icon">' + icon + '</span><span class="bos-cp-row-label">' + esc(label) + '</span>' + (kind ? '<span class="bos-cp-row-kind">' + esc(kind) + '</span>' : '') + '</div>';
}
function wireCpRows() {
  Array.prototype.forEach.call(document.querySelectorAll('#bosCpResults [data-cp-idx]'), function (el) {
    el.addEventListener('click', function () { activatePaletteItem(parseInt(el.getAttribute('data-cp-idx'), 10)); });
    el.addEventListener('mouseenter', function () { setCpSelection(parseInt(el.getAttribute('data-cp-idx'), 10)); });
  });
}
function setCpSelection(idx) {
  state.cpSelIndex = idx;
  Array.prototype.forEach.call(document.querySelectorAll('#bosCpResults [data-cp-idx]'), function (el) {
    el.classList.toggle('bos-cp-sel', parseInt(el.getAttribute('data-cp-idx'), 10) === idx);
  });
}
function activatePaletteItem(idx) {
  var item = state.cpResults[idx];
  if (!item) return;
  if (item.type === 'action') { closeCommandPalette(); item.data.run(); return; }
  var r = item.data;
  closeCommandPalette();
  if (r.kind === 'Knowledge') { navigateToHash('knowledge'); return; }
  if (r.kind === 'Business') { navigateToHash('biz/' + r.id + '/overview'); return; }
  if (r.businessId) { navigateToHash('biz/' + r.businessId + '/' + r.goto.section); return; }
  navigateToHash(r.goto.section);
}
$('bosSearchTrigger').addEventListener('click', openCommandPalette);
$('bosBpOpenPaletteBtn') && $('bosBpOpenPaletteBtn').addEventListener('click', openCommandPalette);
$('bosCpCloseBtn').addEventListener('click', closeCommandPalette);
$('bosCpModalBg').addEventListener('click', function (e) { if (e.target === $('bosCpModalBg')) closeCommandPalette(); });
$('bosCpInput').addEventListener('input', function () { renderPaletteResults($('bosCpInput').value); });
$('bosCpInput').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); setCpSelection(Math.min(state.cpSelIndex + 1, state.cpResults.length - 1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setCpSelection(Math.max(state.cpSelIndex - 1, 0)); }
  else if (e.key === 'Enter') { e.preventDefault(); activatePaletteItem(state.cpSelIndex); }
  else if (e.key === 'Escape') { closeCommandPalette(); }
});

// =====================================================================
// QUICK CAPTURE — a floating always-available inbox for ideas/tasks/
// meeting notes/voice notes/business ideas/AI prompts, reviewed later
// rather than dropped into a void.
// =====================================================================
function openQuickCapture() { state.capTab = 'new'; renderCapTabs(); $('bosCapModalBg').classList.add('show'); }
function closeQuickCapture() { $('bosCapModalBg').classList.remove('show'); }
function renderCapTabs() {
  $('bosCapTabNew').classList.toggle('active', state.capTab === 'new');
  $('bosCapTabInbox').classList.toggle('active', state.capTab === 'inbox');
  if (state.capTab === 'new') renderCapNew(); else renderCapInbox();
  updateCapInboxCount();
}
function renderCapNew() {
  var html = '<div class="bos-field"><label class="bos-field-label">Type</label><select id="bosCapType">' +
    D.CAPTURE_TYPES.map(function (t) { return '<option value="' + t + '">' + D.CAPTURE_TYPE_LABELS[t] + '</option>'; }).join('') + '</select></div>';
  html += '<div class="bos-field"><label class="bos-field-label">Business (optional)</label><select id="bosCapBiz"><option value="">— Unscoped —</option>' +
    D.businessesSorted().map(function (b) { return '<option value="' + b.id + '">' + esc(b.logo + ' ' + b.name) + '</option>'; }).join('') + '</select></div>';
  html += '<div class="bos-field"><label class="bos-field-label">Capture</label><textarea id="bosCapText" rows="4" placeholder="Whatever\'s on your mind…"></textarea></div>';
  html += '<button class="bos-btn bos-btn-primary" id="bosCapSaveBtn" style="width:100%;">Save to Inbox</button>';
  $('bosCapBody').innerHTML = html;
  document.getElementById('bosCapSaveBtn').addEventListener('click', function () {
    var text = document.getElementById('bosCapText').value.trim();
    if (!text) { alert('Write something first.'); return; }
    D.Captures.add({ type: document.getElementById('bosCapType').value, businessId: document.getElementById('bosCapBiz').value || null, text: text });
    state.capTab = 'inbox';
    renderCapTabs();
  });
}
function renderCapInbox() {
  var list = D.Captures.list().filter(function (c) { return !c.processed; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
  var html = '';
  if (!list.length) html = emptyState('📥', 'Inbox is empty', 'Anything you capture shows up here until you process it.');
  else list.forEach(function (c) {
    html += '<div class="bos-row" style="margin-bottom:10px; cursor:default;"><div class="bos-row-top"><span class="bos-row-title">' + D.CAPTURE_TYPE_LABELS[c.type] + '</span></div>' +
      '<div class="bos-row-body" style="-webkit-line-clamp:4;">' + esc(c.text) + '</div>' +
      (c.businessId ? '<div class="bos-row-meta">' + esc(bizName(c.businessId)) + '</div>' : '') +
      '<div style="display:flex; gap:6px; margin-top:6px;"><button class="bos-btn bos-btn-sm" data-cap-to-task="' + c.id + '">✅ To Task</button><button class="bos-btn bos-btn-sm" data-cap-done="' + c.id + '">✓ Done</button><button class="bos-btn bos-btn-sm bos-btn-danger" data-cap-del="' + c.id + '">✕</button></div></div>';
  });
  $('bosCapBody').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('#bosCapBody [data-cap-to-task]'), function (el) {
    el.addEventListener('click', function () {
      var c = D.Captures.get(el.getAttribute('data-cap-to-task'));
      D.Tasks.add({ title: c.text.slice(0, 120), businessId: c.businessId, status: 'todo', priority: 'medium', order: D.nextOrder(D.Tasks.list()) });
      D.Captures.update(c.id, { processed: true });
      renderCapInbox(); updateCapInboxCount(); renderSbNav();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#bosCapBody [data-cap-done]'), function (el) { el.addEventListener('click', function () { D.Captures.update(el.getAttribute('data-cap-done'), { processed: true }); renderCapInbox(); updateCapInboxCount(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#bosCapBody [data-cap-del]'), function (el) { el.addEventListener('click', function () { D.Captures.remove(el.getAttribute('data-cap-del')); renderCapInbox(); updateCapInboxCount(); }); });
}
function updateCapInboxCount() {
  var n = D.Captures.list().filter(function (c) { return !c.processed; }).length;
  $('bosCapInboxCount').textContent = n ? '(' + n + ')' : '';
}
$('bosCaptureHeaderBtn').addEventListener('click', openQuickCapture);
$('bosCapCloseBtn').addEventListener('click', closeQuickCapture);
$('bosCapModalBg').addEventListener('click', function (e) { if (e.target === $('bosCapModalBg')) closeQuickCapture(); });
$('bosCapTabNew').addEventListener('click', function () { state.capTab = 'new'; renderCapTabs(); });
$('bosCapTabInbox').addEventListener('click', function () { state.capTab = 'inbox'; renderCapTabs(); });

// =====================================================================
// NOTIFICATIONS — overdue tasks/invoices, deadlines and scheduled
// content within 3 days. Computed live, never stored.
// =====================================================================
function computeNotifications() {
  var out = [];
  D.Tasks.list().filter(function (t) { return t.status !== 'done' && t.dueDate && t.dueDate < D.todayISO(); }).forEach(function (t) {
    out.push({ icon: '⏰', text: 'Overdue: ' + t.title, sub: bizName(t.businessId) || 'Unscoped', goto: t.businessId ? { biz: t.businessId, tab: 'projects' } : { section: 'projects' } });
  });
  D.FinanceInvoices.list().filter(function (i) { return i.status === 'overdue' || (i.status === 'sent' && i.dueDate && i.dueDate < D.todayISO()); }).forEach(function (i) {
    out.push({ icon: '🧾', text: 'Invoice overdue: ' + i.client, sub: bizName(i.businessId), goto: { biz: i.businessId, tab: 'finance' } });
  });
  D.Projects.list().filter(function (p) { return p.status !== 'done' && p.deadline && p.deadline >= D.todayISO() && p.deadline <= D.isoDaysFromNow(3); }).forEach(function (p) {
    out.push({ icon: '📅', text: 'Due soon: ' + p.title, sub: fmtDate(p.deadline), goto: { biz: p.businessId, tab: 'projects' } });
  });
  D.Content.list().filter(function (c) { return c.stage !== 'published' && c.scheduledDate && c.scheduledDate >= D.todayISO() && c.scheduledDate <= D.isoDaysFromNow(3); }).forEach(function (c) {
    out.push({ icon: '📢', text: 'Scheduled soon: ' + c.title, sub: fmtDate(c.scheduledDate), goto: { biz: c.businessId, tab: 'content' } });
  });
  return out;
}
function updateNotifDot() { $('bosNotifDot').classList.toggle('show', computeNotifications().length > 0); }
function toggleNotifPanel() {
  var panel = $('bosNotifPanel');
  if (panel.classList.contains('show')) { panel.classList.remove('show'); return; }
  var notifs = computeNotifications();
  panel.innerHTML = notifs.length ? notifs.map(function (n, i) {
    return '<div class="bos-notif-row" data-notif-idx="' + i + '"><span class="bos-notif-icon">' + n.icon + '</span><div><div class="bos-notif-text">' + esc(n.text) + '</div><div class="bos-notif-sub">' + esc(n.sub || '') + '</div></div></div>';
  }).join('') : '<div style="padding:16px; text-align:center; font-size:12.5px; color:var(--bos-text-mute);">You\'re all caught up.</div>';
  Array.prototype.forEach.call(panel.querySelectorAll('[data-notif-idx]'), function (el) {
    el.addEventListener('click', function () {
      var n = notifs[parseInt(el.getAttribute('data-notif-idx'), 10)];
      panel.classList.remove('show');
      if (n.goto.biz) navigateToHash('biz/' + n.goto.biz + '/' + n.goto.tab); else navigateToHash(n.goto.section);
    });
  });
  panel.classList.add('show');
}
$('bosNotifBtn').addEventListener('click', function (e) { e.stopPropagation(); toggleNotifPanel(); });
document.addEventListener('click', function (e) { if (!e.target.closest('#bosNotifPanel') && !e.target.closest('#bosNotifBtn')) $('bosNotifPanel').classList.remove('show'); });

// =====================================================================
// MOBILE SIDEBAR TOGGLE
// =====================================================================
$('bosSbToggleBtn').addEventListener('click', function () { $('bosSidebar').classList.contains('bos-sb-open') ? closeSidebarMobile() : openSidebarMobile(); });

// =====================================================================
// SYNC + BOOT
// =====================================================================
var remoteAppliedOnce = false;
function maybeSeedAfterSyncAttempt() {
  if (remoteAppliedOnce) return;
  if (!D.isEmptyEverywhere()) return;
  D.seedIfEmpty();
  renderAllVisible();
}
function boot() {
  D = window.BusinessOSData;
  if (!D) { showBootErrorBanner('BusinessOSData did not load — check that businessos-data.js loaded correctly.', 'boot'); return; }

  renderSbNav();
  applyHash();

  window.addEventListener('hashchange', applyHash);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCommandPalette(); }
    else if (e.key === 'Escape') { closeCommandPalette(); closeQuickCapture(); }
  });

  if (typeof window.initCloudSync === 'function') {
    window.initCloudSync({
      appKey: 'businessos',
      syncedPrefixes: ['bos:'],
      // handoff: protects a write whose push never confirmed from the next
      // visit's opening pull. See sync.js §HANDOFF.
      handoff: true,
      onApplied: function () {
        remoteAppliedOnce = true;
        renderAllVisible();
      }
    });
  }
  setTimeout(maybeSeedAfterSyncAttempt, 5000);
}
document.addEventListener('DOMContentLoaded', function () { LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); }); });
