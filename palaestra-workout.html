<!DOCTYPE html>
<html lang="en" class="pal-root">
<head>
<meta charset="utf-8">
<!-- This repo has no build step: editing a file's CONTENTS never changes
     its URL, so a browser that already fetched the old copy has no signal
     to refetch it. The ?v= on every palaestra-* asset below forces one.
     These three tags do the same job for THIS document, which the query
     strings cannot reach. Partial, honestly: a meta tag tells a BROWSER
     how to re-request next time; it cannot reach an edge cache that has
     already served a stale response. There is no vercel.json and no
     server-side header control, so this is the only lever inside the file. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14120F">
<title>Workout · Fitness Studio</title>

<!-- MUST be first and never deferred. -->
<script src="local-store-idb.js"></script>

<!--
  THE PALAESTRA — the live workout logger.

  Its own page, not a route on the hub, for one reason: this is the
  screen used mid-set on a phone, and it must not share a document
  that re-renders wholesale every time a cloud pull lands. Here the
  only things that repaint on their own are the two clocks.

  Timer state lives in `pal:live` as ABSOLUTE timestamps, never as a
  counter ticking in memory — a locked phone stops firing intervals,
  so a decrementing counter comes back wrong by exactly however long
  the screen was off. A reload mid-workout resumes; it does not reset.

  ?id=<sessionId> opens a finished workout read-only. With no id it
  opens whatever is live, and offers to start something if nothing is.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="palaestra-theme.css?v=5">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- row has no build step, so editing a file never changes its URL and a
     phone holding yesterday's copy renders new markup against old styles —
     or calls a new function as undefined — in silence. One number for the
     whole app: everything here is at v3. Bump it on ANY change to these
     files or the "it hasn't updated on my phone" report comes straight
     back. sync.js is versioned for the same reason: it was the one shared
     file with no version on it, so a device holding the old copy would
     never get the handoff fix, and now the §SEEN fix on top of it. -->
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="palaestra-data.js?v=6"></script>
<!-- Before palaestra-ui.js and before anything renders: its boot() has to
     snapshot what this device holds BEFORE the opening cloud pull can
     change it. -->
<!-- data-registry.js then snapshots.js, both BEFORE the backup adapter:
     the adapter is now a three-line call into the shared engine, and the
     engine asserts its prefix against the registry before it will build a
     store. Same loading mode as the adapter, or execution order is lost. -->
<script src="data-registry.js?v=1"></script>
<script src="snapshots.js?v=1"></script>
<script src="trash.js?v=1"></script>
<script src="palaestra-backup.js?v=4"></script>
<script src="palaestra-ui.js?v=4"></script>
<script src="palaestra-hero.js?v=4"></script>
<script src="palaestra-music.js?v=4"></script>
<script src="topbar.js?v=4" defer></script>

<style>
.pal-wshell { max-width: none; margin: 0; padding: var(--pal-5) var(--pal-gutter) 140px; }
/* One column is right on a phone and wasteful on a desk. The set rows
   inside a card have a fixed grid, so a card wider than ~640px just
   spreads them; capping the track is what keeps them readable. */
#palLog { display: grid; gap: var(--pal-3); align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 640px)); }
#palLog > .pal-ex, #palLog > .pal-block { margin-bottom: 0; }
/* The hero band above carries the workout's name and type, so this is
   now only the controls — and it stays compact and sticky, because
   between sets you need Finish and the clock, not a headline. */
.pal-whead {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--pal-stone) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--pal-hair-2);
}
.pal-whead__in {
  max-width: none; margin: 0;
  padding: 10px var(--pal-gutter);
  display: flex; align-items: center; gap: var(--pal-3); flex-wrap: wrap;
}
.pal-whead__row { display: flex; align-items: center; gap: var(--pal-3); flex-wrap: wrap; }
.pal-whead__clock {
  font-family: var(--pal-mono); font-weight: 500; font-size: 26px;
  line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; color: var(--pal-sand-2);
}
.pal-prev {
  font-family: var(--pal-mono); font-size: 11px; color: var(--pal-ash);
  letter-spacing: .06em; margin-bottom: 8px;
}
.pal-restpresets { display: flex; gap: 5px; flex-wrap: wrap; }
@media (max-width: 719px) {
  /* One scrolling row, never a second line: a wrapped preset strip makes
     the rest bar tall enough to bury the set you are looking at. */
  .pal-restpresets { flex-wrap: nowrap; overflow-x: auto; }
  .pal-restpresets > * { flex: none; }
  .pal-rest__track { flex-basis: 60px; }

  /* THE CONTROL BAR MOVES TO THE THUMB.
     Stuck to the top it sat directly underneath topbar.js's launcher pill
     — fixed at top:14/left:14, ~190px wide, z-index 2600 — which covered
     the clock and half of Finish. Clearing it horizontally would cost half
     a 390px screen, so the bar goes to the bottom instead: out of the
     launcher's way, and where a hand already is between sets. Everything
     else that lived down there stacks above it. */
  .pal-whead {
    position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 55;
    border-top: 1px solid var(--pal-hair); border-bottom: 0;
  }
  .pal-whead__in {
    padding: 8px var(--pal-gutter);
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    gap: var(--pal-2);
  }
  .pal-whead__clock { font-size: 24px; }
  .pal-whead .pal-btn { padding: 8px 12px; }
  .pal-rest {
    bottom: calc(var(--pal-dock-h) + env(safe-area-inset-bottom, 0px));
    gap: var(--pal-3);
    border-bottom: 1px solid var(--pal-hair-2);
  }
  /* And to the LEFT, only here: the tick that completes a set is the
     rightmost control in every row, so a right-hand button lands squarely
     on top of it at phone width. */
  /* The control bar is what is docked here, not the route bar. One
     number again: the rest bar, the buttons and the shell's padding all
     measure from it instead of each carrying its own copy. */
  body.pal { --pal-dock-h: 62px; }
  body.pal .pal-fab {
    bottom: calc(var(--pal-dock-h) + 20px + env(safe-area-inset-bottom, 0px));
    left: var(--pal-4); right: auto;
  }
  /* The pair moves together: music sits to the RIGHT of quick-add here,
     because quick-add is the one anchored to the left edge. */
  body.pal .pal-fab--music { left: calc(var(--pal-4) + 68px); right: auto; }
  body.pal.is-resting .pal-fab { bottom: calc(var(--pal-dock-h) + 106px + env(safe-area-inset-bottom, 0px)); }
  .pal-wshell { padding-bottom: calc(var(--pal-dock-h) + 178px); }
}
</style>
</head>

<body class="pal">

<header class="pal-whead" id="palWHead"></header>
<main class="pal-wshell" id="palLog" tabindex="-1"></main>
<div id="palRestHost"></div>
<button class="pal-fab pal-fab--music" id="palFabMusic" type="button" data-pal-music="" data-pal-music-toggle data-pal-label="Music" aria-controls="palMusic" aria-expanded="false" aria-label="Music">♪</button>
<button class="pal-fab" id="palFab" aria-label="Quick add">＋</button>

<script>
(function () {
  'use strict';

  var P, U, headEl, logEl, restHost;
  var session = null;
  var readOnly = false;
  var tick = null;

  function esc(s) { return P.escapeHtml(s); }
  function qs(name) {
    try { return new URLSearchParams(location.search).get(name) || ''; }
    catch (e) { return ''; }
  }

  // ============================================================
  // LOADING
  // ============================================================
  function loadSession() {
    var id = qs('id');
    if (id) {
      session = P.Sessions.get(id);
      readOnly = !!session && session.status !== 'live';
      return;
    }
    var live = P.getLive();
    session = live ? P.Sessions.get(live.sessionId) : null;
    readOnly = false;
  }
  function saveSession(patch) {
    if (!session) return;
    // update() returns null when the id is not in the array, and the fallback
    // below keeps the in-memory object — which is right for one tick and wrong
    // for a whole workout. If the record has gone, put it back before writing,
    // or every set logged from here on writes nowhere and Finish saves
    // nothing. restoreSession() is what makes that impossible rather than
    // merely unlikely.
    if (!readOnly && !P.Sessions.get(session.id)) restoreSession();
    session = P.Sessions.update(session.id, patch) || session;
  }

  // A remote apply landed and took the live session with it. The copy in
  // memory is the newer truth — it is the workout being done right now — so
  // it goes back, together with the pointer to it.
  function restoreSession() {
    if (!session || readOnly) return false;
    if (P.Sessions.get(session.id)) return false;
    P.Sessions.restore(session);
    // Keep the elapsed clock running from where it was. runningSince is what
    // the header clock counts from; losing it stops the workout dead at the
    // moment of the overwrite.
    var prev = P.getLiveRaw();
    P.setLive({
      sessionId: session.id,
      runningSince: (prev && prev.runningSince) || session.startedAt || Date.now()
    });
    return true;
  }

  // Called when the cloud overwrites local state. It must NOT re-render:
  // this screen is used mid-set, and a wholesale repaint destroys the number
  // half-typed in a field and re-arms the hero's entrance reveal. It re-reads
  // the record, repairs it if it has been erased, and repaints only the
  // clocks.
  function onRemoteApplied() {
    if (!session) return;
    if (readOnly) { session = P.Sessions.get(session.id) || session; return; }
    if (restoreSession()) {
      U.toast('Recovered this workout — a sync had overwritten it');
    } else {
      session = P.Sessions.get(session.id) || session;
    }
    paintClocks();
  }
  function saveEntries() { saveSession({ entries: session.entries }); }

  // What this exercise looked like the last time it was actually done.
  // Shown as placeholder text, never pre-filled — a number you did not
  // type is not a number you lifted.
  function lastTime(name, excludeId) {
    var prior = P.doneSessions()
      .filter(function (x) { return x.id !== excludeId; })
      .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || b.startedAt - a.startedAt; });
    for (var i = 0; i < prior.length; i++) {
      var hit = prior[i].entries.filter(function (e) {
        return e.name === name && e.sets.some(function (s) { return s.done; });
      })[0];
      if (hit) return { date: prior[i].date, sets: hit.sets.filter(function (s) { return s.done; }) };
    }
    return null;
  }

  // ============================================================
  // HEADER
  // ============================================================
  // The hero band carries the workout's name, type and date. This builds
  // only the controls — and unlike the band, it is re-rendered constantly,
  // which is exactly why the <video> is not in here.
  function renderHead() {
    if (!session) { headEl.innerHTML = ''; headEl.hidden = true; paintHero(); return; }
    headEl.hidden = false;
    var live = P.getLive();
    headEl.innerHTML =
      '<div class="pal-whead__in">' +
        '<span class="pal-whead__clock" id="palElapsed">0:00</span>' +
        '<div class="pal-whead__row" style="flex:1 1 auto">' +
          (readOnly
            ? '<span class="pal-sub">Read-only</span>'
            : '<button class="pal-btn pal-btn--primary" data-act="finish">✓ Finish workout</button>' +
              '<button class="pal-btn pal-btn--ghost" data-act="abandon">Discard</button>') +
        '</div>' +
        window.PalMusic.button({ scope: 'session:' + session.id, trackId: session.trackId, label: session.name }) +
      '</div>';
    if (live && live.runningSince) startClock();
    paintHero();
  }

  // The hero band's own copy. Its scene changes only when the workout
  // does, never on a repaint — a re-armed reveal on every tick would be
  // the `intro_animations_restart_on_repaint` trap.
  var shownScene = '';
  function paintHero() {
    if (!window.PalHero) return;
    var key, scene, badge;
    if (!session) {
      key = 'empty';
      scene = { eyebrow: 'Nothing open',
                lines: ['One set', 'at a', 'time'],
                note: 'Start a workout from Fitness Studio and it opens here, exercise by exercise.' };
      badge = { lead: 'Go to', main: 'Fitness Studio',
                onClick: function () { location.href = 'palaestra.html'; } };
    } else if (readOnly) {
      key = 'ro:' + session.id;
      scene = { eyebrow: 'Logged ' + P.prettyLong(session.date),
                lines: [session.name],
                note: P.sessionSetCount(session) + ' sets · ' +
                      P.fmtInt(P.sessionVolume(session)) + ' ' + P.getSettings().weightUnit +
                      ' · ' + P.fmtDuration(session.elapsedSec) + '. Read-only.' };
      badge = { lead: 'Back to', main: 'Fitness Studio',
                onClick: function () { location.href = 'palaestra.html'; } };
    } else {
      key = 'live:' + session.id;
      scene = { eyebrow: session.type + ' · in progress',
                lines: [session.name],
                note: 'One set at a time. Tick a set and the rest timer starts itself.' };
      badge = { lead: 'Finish', main: 'Workout', onClick: sheetFinish };
    }
    if (shownScene !== key) { window.PalHero.setScene(scene); shownScene = key; }
    window.PalHero.setBadge(badge);
  }

  function startClock() {
    if (tick) clearInterval(tick);
    // Twice a second is enough for a clock reading in whole seconds.
    tick = setInterval(paintClocks, 500);
    paintClocks();
  }
  function paintClocks() {
    if (!session) return;
    // getLiveRaw, not getLive: the validating version parses every
    // session ever logged, and this runs twice a second forever.
    var live = P.getLiveRaw();
    var el = document.getElementById('palElapsed');
    if (el) {
      var extra = live && live.runningSince ? Math.round((Date.now() - live.runningSince) / 1000) : 0;
      el.textContent = P.fmtClock(session.elapsedSec + extra);
    }
    paintRest(live);
  }

  // ============================================================
  // REST TIMER
  // ============================================================
  function renderRest() {
    restHost.innerHTML =
      '<div class="pal-rest" id="palRest" hidden>' +
        '<span class="pal-rest__clock" id="palRestClock">0:00</span>' +
        '<div class="pal-rest__track"><div class="pal-rest__fill" id="palRestFill"></div></div>' +
        '<div class="pal-restpresets" id="palRestPresets">' +
          P.REST_PRESETS.map(function (n) {
            // Lifters say "90 seconds", never "1.5 minutes". Only whole
            // minutes get the minute label.
            var label = (n % 60 === 0 && n >= 120) ? (n / 60) + ' min' : n + ' sec';
            return '<button class="pal-chip" data-rest="' + n + '">' + label + '</button>';
          }).join('') +
          '<button class="pal-btn pal-btn--sm" data-rest="0">Skip</button>' +
        '</div>' +
      '</div>';
    restHost.addEventListener('click', function (e) {
      var b = e.target.closest('[data-rest]');
      if (!b) return;
      var n = parseInt(b.getAttribute('data-rest'), 10) || 0;
      if (n === 0) P.setLive({ restEndsAt: null, restSec: 0 });
      else P.setLive({ restEndsAt: Date.now() + n * 1000, restSec: n });
      paintClocks();
    });
  }

  function startRest(seconds) {
    if (readOnly || !seconds) return;
    P.setLive({ restEndsAt: Date.now() + seconds * 1000, restSec: seconds });
    paintClocks();
  }

  function paintRest(live) {
    var bar = document.getElementById('palRest');
    if (!bar) return;
    if (readOnly || !live || !live.restEndsAt) {
      bar.hidden = true;
      document.body.classList.remove('is-resting');
      return;
    }
    bar.hidden = false;
    document.body.classList.add('is-resting');
    var left = Math.round((live.restEndsAt - Date.now()) / 1000);
    var over = left <= 0;
    bar.setAttribute('data-over', over ? 'true' : 'false');
    document.getElementById('palRestClock').textContent =
      over ? '+' + P.fmtClock(-left) : P.fmtClock(left);
    var pct = live.restSec > 0 ? Math.max(0, Math.min(1, left / live.restSec)) : 0;
    document.getElementById('palRestFill').style.setProperty('--pct', over ? 1 : pct);
  }

  // ============================================================
  // THE LOG
  // ============================================================
  function render() {
    if (!session) {
      logEl.innerHTML = U.empty('Nothing in progress',
        'Start a workout from Fitness Studio and it opens here.',
        'Go to Fitness Studio', 'go-hub');
      renderHead();
      if (window.PalHero && window.PalHero.measure) window.PalHero.measure();
      return;
    }
    renderHead();
    logEl.innerHTML =
      blocksHtml(session.entries) +
      (readOnly ? '' :
        '<div class="pal-row" style="margin:18px 0 24px">' +
          '<button class="pal-btn" data-act="add-exercise">＋ Add an exercise</button>' +
        '</div>') +
      notesHtml();
    if (!readOnly) mountSessionMedia();
    // The log's height decides where the ribbon above it sits, which is
    // what the ribbon→page parallax is measured against.
    if (window.PalHero && window.PalHero.measure) window.PalHero.measure();
  }

  // ============================================================
  // §BLOCKS ON THE LOGGER
  //
  // A superset is drawn as ONE thing with two exercises inside it,
  // because that is what it is: set 1 of A, set 1 of B, and only then a
  // rest. Two independent cards is precisely the drawing that made the
  // logger start a timer between them.
  //
  // The rest lives on the BLOCK, not on either exercise — so it is stated
  // once, in the header, and the "Rest 75s" button appears only on the
  // exercise the rest actually follows.
  // ============================================================
  function blocksHtml(entries) {
    var n = 0;
    return P.blocksOf(entries).map(function (g) {
      if (g.entries.length < 2) return entryHtml(g.entries[0], null, 0);
      n++;
      return '<section class="pal-block">' +
        '<header class="pal-block__head">' +
          '<span class="pal-block__n">Block ' + n + '</span>' +
          '<span class="pal-block__rule">no rest between these \u00b7 ' +
            P.blockRest(g.entries) + 's after the pair</span>' +
        '</header>' +
        g.entries.map(function (e, i) { return entryHtml(e, g, i); }).join('') +
      '</section>';
    }).join('');
  }

  function entryHtml(e, group, at) {
    var doneSets = e.sets.filter(function (s) { return s.done; }).length;
    var prev = readOnly ? null : lastTime(e.name, session.id);
    var last = !group || at === group.entries.length - 1;
    var rest = group ? P.blockRest(group.entries) : e.restSec;
    return (group && at > 0 ? '<p class="pal-block__into" aria-hidden="true">straight into</p>' : '') +
      '<article class="pal-ex" data-entry="' + esc(e.id) + '" data-done="' + (e.done ? 'true' : 'false') + '"' +
        (group ? ' data-paired="true"' : '') + '>' +
      '<div class="pal-ex__head">' +
        '<div class="pal-ex__title">' +
          '<div class="pal-ex__name">' + esc(e.name) + '</div>' +
          // Inside a block the rest belongs to the pair, so it is not
          // repeated here — saying "75s rest" under both halves reads as
          // two rests.
          '<div class="pal-ex__meta">' + esc(e.muscle) + (e.equipment ? ' · ' + esc(e.equipment) : '') +
          ' · ' + doneSets + '/' + e.sets.length + ' sets' +
          (group ? '' : ' · ' + e.restSec + 's rest') + '</div>' +
        '</div>' +
        window.PalMusic.button({ scope: 'entry:' + e.id, trackId: e.trackId, label: e.name }) +
        (readOnly ? '' :
          '<button class="pal-setdone" data-act="entry-done" data-entry="' + esc(e.id) + '"' +
          ' aria-pressed="' + (e.done ? 'true' : 'false') + '" aria-label="Mark ' + esc(e.name) + ' complete">✓</button>') +
      '</div>' +
      '<div class="pal-ex__body">' +
        (prev ? '<p class="pal-prev">Last time (' + esc(P.prettyDate(prev.date)) + '): ' +
                prev.sets.map(function (s) { return P.fmtWeight(s.weight) + '×' + s.reps; }).join(', ') + '</p>' : '') +
        (readOnly ? ''
          : '<div class="pal-sethead"><span>Set</span><span>Weight</span><span>Reps</span><span>RPE</span><span></span></div>') +
        '<div class="' + (readOnly ? 'pal-rosets' : 'pal-sets') + '">' +
          e.sets.map(function (st, n) { return setHtml(e, st, n, prev); }).join('') + '</div>' +
        (readOnly ? '' :
          '<div class="pal-row" style="margin-top:10px">' +
            '<button class="pal-btn pal-btn--sm" data-act="add-set" data-entry="' + esc(e.id) + '">＋ Set</button>' +
            (last ? '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="rest-now" data-entry="' +
              esc(e.id) + '">Rest ' + rest + 's</button>' : '') +
            '<button class="pal-btn pal-btn--sm pal-btn--ghost" data-act="entry-notes" data-entry="' + esc(e.id) + '">Notes &amp; media</button>' +
            '<button class="pal-btn pal-btn--sm pal-btn--danger" data-act="drop-entry" data-entry="' + esc(e.id) + '">Remove</button>' +
          '</div>') +
        (e.notes ? '<p class="pal-sub" style="margin-top:10px">' + esc(e.notes) + '</p>' : '') +
        (e.media.length ? '<div style="margin-top:10px">' + U.mediaStrip(e.media) + '</div>' : '') +
      '</div>' +
    '</article>';
  }

  function setHtml(e, st, n, prev) {
    var ph = prev && prev.sets[n] ? prev.sets[n] : null;
    if (readOnly) {
      // With nothing to type into, a grid of bare numbers is just a grid.
      // Read it back the way a lifter would say it, same as the hub's
      // own session view: "95 × 8 @8".
      return '<div class="pal-rosets__row" data-done="' + (st.done ? 'true' : 'false') + '">' +
        '<span class="pal-rosets__n">' + (n + 1) + '</span>' +
        '<span class="pal-mono">' +
          (st.done ? P.fmtWeight(st.weight) + ' × ' + st.reps + (st.rpe ? '  @' + st.rpe : '')
                   : 'not completed') +
        '</span>' +
      '</div>';
    }
    return '<div class="pal-setrow" data-set="' + esc(st.id) + '" data-entry="' + esc(e.id) + '" data-done="' + (st.done ? 'true' : 'false') + '">' +
      '<span class="pal-setrow__n">' + (n + 1) + '</span>' +
      '<input class="pal-input pal-input--num" type="number" step="any" inputmode="decimal" data-f="weight"' +
        ' value="' + (st.weight || '') + '" placeholder="' + (ph ? P.fmtWeight(ph.weight) : '—') + '" aria-label="Weight, set ' + (n + 1) + '">' +
      '<input class="pal-input pal-input--num" type="number" inputmode="numeric" data-f="reps"' +
        ' value="' + (st.reps || '') + '" placeholder="' + (ph ? ph.reps : e.targetReps || '—') + '" aria-label="Reps, set ' + (n + 1) + '">' +
      '<input class="pal-input pal-input--num" type="number" step="0.5" min="0" max="10" inputmode="decimal" data-f="rpe"' +
        ' value="' + (st.rpe || '') + '" placeholder="RPE" aria-label="RPE, set ' + (n + 1) + '">' +
      '<button class="pal-setdone" data-act="set-done" aria-pressed="' + (st.done ? 'true' : 'false') +
        '" aria-label="Complete set ' + (n + 1) + '">✓</button>' +
    '</div>';
  }

  function notesHtml() {
    if (readOnly) {
      return (session.notes ? '<div class="pal-card"><p class="pal-eyebrow">Note</p><p>' + esc(session.notes) + '</p></div>' : '') +
             (session.media.length ? '<div style="margin-top:12px">' + U.mediaStrip(session.media) + '</div>' : '');
    }
    return '<div class="pal-card">' +
      '<div class="pal-card__head"><h2 class="pal-h3">How it went</h2></div>' +
      '<textarea class="pal-textarea" id="palSesNote" placeholder="Anything worth remembering about this session.">' +
      esc(session.notes) + '</textarea>' +
      '<div style="margin-top:14px"><span class="pal-label">Photos and videos</span>' +
      '<div id="palSesMedia"></div></div>' +
    '</div>';
  }

  function mountSessionMedia() {
    var note = document.getElementById('palSesNote');
    if (note) P.autosave(note, function (v) { saveSession({ notes: v }); }, 400);
    var host = document.getElementById('palSesMedia');
    if (host) U.mountMedia(host, session.media, function (next) { saveSession({ media: next }); });
  }

  // ============================================================
  // EDITS
  //
  // Number fields are written on change and NEVER trigger a re-render —
  // re-rendering the list while a thumb is in a field is how you lose
  // the number you were typing. Only structural changes redraw.
  // ============================================================
  function findEntry(id) {
    for (var i = 0; i < session.entries.length; i++) if (session.entries[i].id === id) return session.entries[i];
    return null;
  }
  function findSet(entry, id) {
    for (var i = 0; i < entry.sets.length; i++) if (entry.sets[i].id === id) return entry.sets[i];
    return null;
  }
  function refreshEntryMeta(entryId) {
    var e = findEntry(entryId);
    var card = logEl.querySelector('[data-entry="' + entryId + '"]');
    if (!e || !card) return;
    var meta = card.querySelector('.pal-ex__meta');
    var doneSets = e.sets.filter(function (s) { return s.done; }).length;
    if (meta) {
      meta.textContent = e.muscle + (e.equipment ? ' · ' + e.equipment : '') +
        ' · ' + doneSets + '/' + e.sets.length + ' sets' +
        (blockOf(e) ? '' : ' · ' + e.restSec + 's rest');
    }
    card.setAttribute('data-done', e.done ? 'true' : 'false');
  }

  function onFieldChange(input) {
    var row = input.closest('[data-set]');
    if (!row) return;
    var e = findEntry(row.getAttribute('data-entry'));
    if (!e) return;
    var st = findSet(e, row.getAttribute('data-set'));
    if (!st) return;
    var f = input.getAttribute('data-f');
    var v = parseFloat(input.value);
    st[f] = isFinite(v) ? v : 0;
    saveEntries();
  }

  function toggleSet(btn) {
    var row = btn.closest('[data-set]');
    var e = findEntry(row.getAttribute('data-entry'));
    var st = findSet(e, row.getAttribute('data-set'));
    if (!e || !st) return;

    if (!st.done) {
      // Take whatever is in the fields at this moment — including a
      // number typed but not yet blurred.
      row.querySelectorAll('[data-f]').forEach(function (inp) {
        var v = parseFloat(inp.value);
        st[inp.getAttribute('data-f')] = isFinite(v) ? v : 0;
      });
      if (!st.reps) { U.toast('Enter the reps first'); return; }
      st.done = true;
      st.at = Date.now();
      row.classList.add('is-logged');
      setTimeout(function () { row.classList.remove('is-logged'); }, 600);
      // Completing the last set finishes the exercise on its own.
      if (e.sets.every(function (s) { return s.done; })) e.done = true;
      saveEntries();
      afterSet(e, e.sets.indexOf(st));
    } else {
      st.done = false;
      st.at = null;
      e.done = false;
      saveEntries();
    }
    row.setAttribute('data-done', st.done ? 'true' : 'false');
    btn.setAttribute('aria-pressed', st.done ? 'true' : 'false');
    var entryBtn = logEl.querySelector('[data-act="entry-done"][data-entry="' + e.id + '"]');
    if (entryBtn) entryBtn.setAttribute('aria-pressed', e.done ? 'true' : 'false');
    refreshEntryMeta(e.id);
  }

  // ============================================================
  // §WHEN A SET IS DONE, INSIDE A BLOCK
  //
  // Outside a block, finishing a set starts that exercise's rest. Inside
  // one it must not: the next thing is the OTHER exercise's set of the
  // same round, and the rest only begins once that round is finished.
  //
  // This is not cosmetic. A 75-second timer between A and B is the app
  // telling you to do the opposite of what the routine says, and the
  // routine's entire time saving is that the rest happens once.
  //
  // "The round is finished" is deliberately loose — it is finished when no
  // OTHER exercise in the block still owes that round a set. So ticking B
  // before A still rests at the right moment, and an added set on one half
  // of a pair does not strand the timer.
  // ============================================================
  function blockOf(e) {
    if (!e || !e.block) return null;
    var g = session.entries.filter(function (x) { return (x.block || 0) === e.block; });
    return g.length > 1 ? g : null;
  }
  function afterSet(e, round) {
    var group = blockOf(e);
    if (!group) { startRest(e.restSec); return; }
    var next = null;
    for (var i = 0; i < group.length && !next; i++) {
      if (group[i].id === e.id) continue;
      var st = group[i].sets[round];
      if (st && !st.done) next = group[i];
    }
    if (!next) { startRest(P.blockRest(group)); return; }
    // Scrolled to, never focused: focusing a number field mid-set opens
    // the phone keyboard over the thing it just scrolled to.
    U.toast('Straight into ' + next.name + ' — no rest yet');
    var el = logEl.querySelector('[data-entry="' + next.id + '"]');
    if (!el) return;
    el.classList.add('is-next');
    setTimeout(function () { el.classList.remove('is-next'); }, 1600);
    var top = el.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) - 90;
    try { window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
    catch (x) { window.scrollTo(0, Math.max(0, top)); }
  }

  function sheetEntryNotes(entryId) {
    var e = findEntry(entryId);
    if (!e) return;
    var media = e.media.slice();
    U.openSheet({
      title: e.name,
      body:
        '<div class="pal-field"><label class="pal-label" for="fld_notes">Notes</label>' +
          '<textarea class="pal-textarea" id="fld_notes" name="notes" rows="4">' + esc(e.notes) + '</textarea></div>' +
        '<div class="pal-grid pal-grid--2" style="margin-top:14px">' +
          '<div class="pal-field"><label class="pal-label" for="fld_rest">Rest (sec)</label>' +
            '<input class="pal-input pal-input--num" id="fld_rest" name="rest" type="number" inputmode="numeric" value="' + e.restSec + '"></div>' +
        '</div>' +
        '<div class="pal-field" style="margin-top:14px"><span class="pal-label">Photos and videos</span>' +
          '<div id="palEntryMedia"></div></div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Save', act: 'save', kind: 'primary' }],
      onMount: function (sheet) {
        U.mountMedia(sheet.querySelector('#palEntryMedia'), media, function (next) { media = next; });
      },
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        e.notes = sheet.querySelector('[name="notes"]').value;
        e.restSec = parseInt(sheet.querySelector('[name="rest"]').value, 10) || e.restSec;
        e.media = media;
        saveEntries();
        U.closeSheet(); render();
      }
    });
  }

  function sheetAddExercise() {
    var library = P.exercisesSorted();
    U.openSheet({
      title: 'Add an exercise',
      body:
        '<div class="pal-field"><label class="pal-label" for="palPick">From the library</label>' +
          '<select class="pal-select" id="palPick" name="pick">' +
            '<option value="">Choose…</option>' +
            library.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + ' · ' + esc(x.muscle) + '</option>'; }).join('') +
          '</select></div>' +
        '<p class="pal-sub" style="margin:16px 0 8px">Or something not in the library yet:</p>' +
        '<div class="pal-grid pal-grid--2">' +
          '<div class="pal-field"><label class="pal-label" for="fld_name">Name</label>' +
            '<input class="pal-input" id="fld_name" name="name" placeholder="Cable Crossover"></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_muscle">Muscle group</label>' +
            '<select class="pal-select" id="fld_muscle" name="muscle">' + U.selectOptions(P.MUSCLES, 'Chest') + '</select></div>' +
        '</div>' +
        '<div class="pal-grid pal-grid--2" style="margin-top:12px">' +
          '<div class="pal-field"><label class="pal-label" for="fld_sets">Sets</label>' +
            '<input class="pal-input pal-input--num" id="fld_sets" name="sets" type="number" inputmode="numeric" value="3"></div>' +
          '<div class="pal-field"><label class="pal-label" for="fld_rest">Rest (sec)</label>' +
            '<input class="pal-input pal-input--num" id="fld_rest" name="rest" type="number" inputmode="numeric" value="90"></div>' +
        '</div>',
      actions: [{ label: 'Cancel', act: 'cancel' }, { label: 'Add', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var sets = parseInt(sheet.querySelector('[name="sets"]').value, 10) || 3;
        var rest = parseInt(sheet.querySelector('[name="rest"]').value, 10) || 90;
        var pickId = sheet.querySelector('[name="pick"]').value;
        var name, muscle, equipment = '', exId = '', media = [], trackId = '', target = '';

        if (pickId) {
          var ex = P.Exercises.get(pickId);
          if (!ex) return;
          name = ex.name; muscle = ex.muscle; equipment = ex.equipment; exId = ex.id;
          media = ex.media; trackId = ex.trackId;
          target = ex.repMin === ex.repMax ? String(ex.repMin) : (ex.repMin + '–' + ex.repMax);
        } else {
          name = String(sheet.querySelector('[name="name"]').value).trim();
          if (!name) { U.toast('Pick one or name a new one'); return; }
          muscle = sheet.querySelector('[name="muscle"]').value;
          // Anything logged is worth keeping: a one-off typed here joins
          // the library so the next routine can reach it.
          var made = P.Exercises.add({
            name: name, muscle: muscle, sets: sets, restSec: rest, order: P.Exercises.nextOrder()
          });
          exId = made.id;
        }

        var blank = [];
        for (var i = 0; i < sets; i++) blank.push({});
        session.entries.push({
          exerciseId: exId, name: name, muscle: muscle, equipment: equipment,
          restSec: rest, targetReps: target, sets: blank, media: media, trackId: trackId
        });
        saveEntries();
        session = P.Sessions.get(session.id);
        U.closeSheet(); render();
      }
    });
  }

  function sheetFinish() {
    var vol = P.sessionVolume(session);
    var sets = P.sessionSetCount(session);
    var s = P.getSettings();
    var isCardio = P.laneOf(session.type) === 'cardio';
    U.openSheet({
      title: 'Finish ' + session.name,
      body:
        '<div class="pal-grid pal-grid--3" style="margin-bottom:16px">' +
          U.tile('Sets', U.fig(sets, '', 'sm'), '') +
          U.tile('Volume', U.fig(P.fmtInt(vol), s.weightUnit, 'sm'), '') +
          U.tile('Time', U.fig(P.fmtClock(elapsedNow()), '', 'sm'), '') +
        '</div>' +
        '<div class="pal-field"><label class="pal-label" for="fld_cardio">Cardio minutes' +
          (isCardio ? '' : ' (if any)') + '</label>' +
          '<input class="pal-input pal-input--num" id="fld_cardio" name="cardio" type="number" inputmode="numeric" value="' +
          (isCardio ? Math.round(elapsedNow() / 60) : '') + '"></div>' +
        '<div class="pal-field" style="margin-top:12px"><label class="pal-label" for="fld_note">Note</label>' +
          '<textarea class="pal-textarea" id="fld_note" name="note" rows="3">' + esc(session.notes) + '</textarea></div>',
      actions: [{ label: 'Keep going', act: 'cancel' }, { label: 'Finish', act: 'save', kind: 'primary' }],
      onAction: function (act, sheet) {
        if (act !== 'save') return;
        var mins = parseInt(sheet.querySelector('[name="cardio"]').value, 10) || 0;
        var note = sheet.querySelector('[name="note"]').value;
        // finishWorkout() reads the record by id and returns null if it is not
        // there — the same hole saveSession() covers. A rollback that lands
        // while the finish sheet is open must not throw the workout away.
        restoreSession();
        P.finishWorkout(session.id, { cardioMin: mins, notes: note });
        if (tick) clearInterval(tick);
        U.closeSheet();
        goHub();
      }
    });
  }
  function elapsedNow() {
    var live = P.getLive();
    var extra = live && live.runningSince ? Math.round((Date.now() - live.runningSince) / 1000) : 0;
    return session.elapsedSec + extra;
  }

  function sheetQuickAdd() {
    // "Log water" was removed on 2026-08-26. Water moved to The
    // Larder with the rest of what you eat and drink, so this
    // button's P.addToDay(...,'water') would now be a silent
    // no-op that still toasted "Logged" — a control that claims
    // to have worked and has not is worse than no control. The
    // Larder logs it in one tap from the ring menu, against a
    // target, which this prompt() never did.
    var opts = [['Add an exercise', 'q-ex'], ['Log steps', 'q-steps'],
                ['Add a photo or video', 'q-photo'], ['Rest 90 seconds', 'q-rest']];
    U.openSheet({
      title: 'Quick add',
      body: '<div class="pal-quickgrid">' + opts.map(function (o) {
        return '<button class="pal-quickbtn" data-sheet-act="' + o[1] + '">' + esc(o[0]) + '</button>';
      }).join('') + '</div>',
      actions: [],
      onAction: function (act) {
        U.closeSheet();
        if (act === 'q-ex') { if (session && !readOnly) sheetAddExercise(); return; }
        if (act === 'q-rest') { startRest(90); return; }
        if (act === 'q-photo') {
          var host = document.getElementById('palSesMedia');
          if (host) { host.scrollIntoView({ block: 'center' }); host.querySelector('[data-media-add="image"]').click(); }
          return;
        }
        if (act === 'q-steps') {
          var n = parseInt(prompt('Steps today', String(P.getDay(P.today()).steps || '')), 10);
          if (n >= 0) { P.patchDay(P.today(), { steps: n }); U.toast('Steps saved'); }
        }
      }
    });
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  // Finishing and discarding both write and then leave, and an IndexedDB
  // write started as the document goes away is silently lost. This used to be
  // a 120ms setTimeout — a guess that is too long when there is nothing
  // pending and too short when there is. LocalStoreIDB.navigate() waits for
  // the actual commit and has its own timeout backstop.
  function goHub() {
    var url = 'palaestra.html';
    if (window.LocalStoreIDB && window.LocalStoreIDB.navigate) window.LocalStoreIDB.navigate(url);
    else location.href = url;
  }

  var ACTIONS = {
    'go-hub': goHub,
    'finish': sheetFinish,
    'abandon': function () {
      if (!confirm('Discard this workout? Everything logged in it is removed.')) return;
      var id = session.id;
      P.abandonWorkout(id);
      P.Sessions.remove(id);
      if (tick) clearInterval(tick);
      goHub();
    },
    'set-done': toggleSet,
    'entry-done': function (btn) {
      var e = findEntry(btn.getAttribute('data-entry'));
      if (!e) return;
      e.done = !e.done;
      // Ticking the whole exercise ticks the sets that have numbers in
      // them; it never invents a set you did not log.
      if (e.done) {
        e.sets.forEach(function (st) { if (st.reps > 0) { st.done = true; st.at = st.at || Date.now(); } });
      }
      saveEntries();
      btn.setAttribute('aria-pressed', e.done ? 'true' : 'false');
      render();
    },
    'add-set': function (btn) {
      var e = findEntry(btn.getAttribute('data-entry'));
      if (!e) return;
      e.sets.push({});
      e.done = false;
      saveEntries();
      session = P.Sessions.get(session.id);
      render();
    },
    'drop-entry': function (btn) {
      var id = btn.getAttribute('data-entry');
      var e = findEntry(id);
      if (!e) return;
      if (e.sets.some(function (s) { return s.done; }) &&
          !confirm('Remove "' + e.name + '"? The sets logged under it go too.')) return;
      session.entries = session.entries.filter(function (x) { return x.id !== id; });
      saveEntries();
      render();
    },
    'entry-notes': function (btn) { sheetEntryNotes(btn.getAttribute('data-entry')); },
    'rest-now': function (btn) {
      var e = findEntry(btn.getAttribute('data-entry'));
      var g = blockOf(e);
      startRest(g ? P.blockRest(g) : (e ? e.restSec : 90));
    },
    'add-exercise': sheetAddExercise
  };

  // ============================================================
  // BOOT
  // ============================================================
  function boot() {
    P = window.Pal;
    U = window.PalUI;
    headEl = document.getElementById('palWHead');
    logEl = document.getElementById('palLog');
    restHost = document.getElementById('palRestHost');

    loadSession();

    // ONCE, before anything renders, and outside #palLog — so no repaint
    // can re-create the <video>. See palaestra-hero.js's header comment.
    window.PalHero.mount({
      variant: 'band',
      before: headEl,
      dateText: P.prettyLong(P.today()),
      badge: { lead: 'Finish', main: 'Workout' }
    });

    renderRest();
    render();

    logEl.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || !logEl.contains(el)) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (!fn) return;
      e.preventDefault();
      fn(el);
    });
    headEl.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (!fn) return;
      e.preventDefault();
      fn(el);
    });
    logEl.addEventListener('change', function (e) {
      var inp = e.target.closest('[data-f]');
      if (inp) onFieldChange(inp);
    });
    document.getElementById('palFab').addEventListener('click', sheetQuickAdd);

    document.addEventListener('pal:music:pin', function (e) {
      var d = e.detail || {};
      var parts = String(d.scope || '').split(':');
      if (parts[0] === 'session' && session) { saveSession({ trackId: d.trackId }); }
      if (parts[0] === 'entry' && session) {
        var en = findEntry(parts[1]);
        if (en) {
          en.trackId = d.trackId;
          saveEntries();
          // A track pinned mid-workout belongs to the exercise, not just
          // to today — otherwise it has to be found again next week.
          if (en.exerciseId) P.Exercises.update(en.exerciseId, { trackId: d.trackId });
        }
      }
      U.toast(d.trackId ? 'Track pinned' : 'Track unpinned');
    });

    // Before initCloudSync, exactly as on the hub: capture what this device
    // holds while the cloud still cannot have touched it. See
    // palaestra-backup.js.
    if (window.PalBackup) window.PalBackup.boot();

    if (typeof window.initCloudSync === 'function' && window.supabase) {
      window.initCloudSync({
        appKey: 'palaestra',
        syncedPrefixes: ['pal:'],
        // See §HANDOFF in sync.js — this is the document the hub hands off to,
        // and the one whose opening pull was destroying the new workout.
        handoff: true,
        onApplied: onRemoteApplied
      });
    }
    // A set logged mid-workout that storage quietly refused is the worst
    // possible thing to find out about later. Say so at the time.
    window.addEventListener('pal:save', function (e) {
      if (e && e.detail && e.detail.ok === false) U.toast('Could not save that set — storage refused the write', true);
    });
    window.PalMusic.init({ defaultShelf: 'playlists' });

    // A phone locking and coming back is the normal case here, not the
    // exception: catch up both clocks the moment the tab is visible.
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { session = session ? P.Sessions.get(session.id) || session : session; paintClocks(); }
    });
    // The number in a field that was never blurred is still a number
    // that was lifted.
    window.addEventListener('pagehide', function () { P.autosave.flushAll(); });
  }

  function whenReady() {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot);
    else boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
