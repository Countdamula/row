<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Hub — The Athenaeum</title>

<!-- MUST be first and MUST NOT be deferred. See athenaeum.html. -->
<script src="local-store-idb.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Bodoni Moda carries the hero/banner, matching the brand's banner &
     title reference. See athenaeum.html's own note. -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Italiana&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   §TOKENS — the Subject Hub is the WORKING surface, so it inverts the
   homepage: the reading room is laid paper, the hub is the dark desk it
   sits on. Same three typefaces, same accents, same near-zero radii —
   only the ground flips. That is deliberate, and it follows the two
   reference images, which are themselves a light editorial page and a
   dark application.
   ===================================================================== */
:root{
  --ath-ground:#C3C0B6;
  --ath-void:#0A0C0F;
  --ath-slate:#101419;
  --ath-raise:#161B21;
  --ath-raise-2:#1D232B;
  --ath-hair:rgba(242,239,232,.10);
  --ath-hair-soft:rgba(242,239,232,.055);

  --ath-text:#F2EFE8;
  --ath-text-2:rgba(242,239,232,.70);
  --ath-text-3:rgba(242,239,232,.44);
  --ath-text-4:rgba(242,239,232,.24);

  --ath-verd:#5CA791;   --ath-verd-rgb:92,167,145;
  --ath-brass:#C9A458;  --ath-brass-rgb:201,164,88;
  --ath-bad:#D2726A;    --ath-bad-rgb:210,114,106;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:18px;
  --sp-5:26px; --sp-6:38px; --sp-7:56px; --sp-8:84px;

  --ath-r-sm:2px; --ath-r:4px; --ath-r-lg:6px;

  --ath-display:"Italiana", Didot, "Bodoni MT", Georgia, serif;
  --ath-hero-face:"Bodoni Moda", Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
  --ath-prose:"Newsreader", Georgia, "Times New Roman", serif;
  --ath-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --ath-spring:cubic-bezier(.34,1.32,.64,1);
  --ath-ease:cubic-bezier(.32,.72,0,1);
  --ath-lift:0 1px 0 rgba(242,239,232,.05) inset, 0 22px 46px -26px rgba(0,0,0,.9);
  --ath-rail:236px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ath-void); color:var(--ath-text);
  font-family:var(--ath-ui); font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important} }
img{max-width:100%; display:block}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--ath-verd); outline-offset:3px}

/* FULL-BLEED. This used to be a floating app shell with a max width and,
   above 1740px, a margin and rounded corners. Both boundaries were removed
   on request: the shell now fills the viewport at every width. */
.ath-shell{
  width:100%; min-height:100vh; background:var(--ath-void);
  display:grid; grid-template-columns:var(--ath-rail) 1fr;
}

/* ---------- rail ---------------------------------------------------- */
.ath-rail{
  border-right:1px solid var(--ath-hair); background:var(--ath-slate);
  display:flex; flex-direction:column; padding:var(--sp-5) 0; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.ath-rail-head{padding:0 var(--sp-5) var(--sp-5); border-bottom:1px solid var(--ath-hair-soft); margin-bottom:var(--sp-4)}
.ath-home{display:inline-flex; align-items:center; gap:8px; font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3); transition:color .2s var(--ath-ease), gap .2s var(--ath-ease)}
.ath-home:hover{color:var(--ath-text); gap:12px}
.ath-rail-name{font-family:var(--ath-display); font-size:20px; line-height:1.15; letter-spacing:.05em; text-transform:uppercase; margin:var(--sp-4) 0 0}
.ath-rail-sub{margin:7px 0 0; font-size:11px; color:var(--ath-text-3); display:flex; align-items:center; gap:7px}

.ath-group-label{padding:var(--sp-4) var(--sp-5) 7px; font-size:9.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--ath-text-4)}
.ath-navitem{
  display:flex; align-items:center; gap:11px; padding:9px var(--sp-5); font-size:13.5px; color:var(--ath-text-2);
  border-left:2px solid transparent; transition:background-color .2s var(--ath-ease), color .2s var(--ath-ease), border-color .2s var(--ath-ease);
}
.ath-navitem:hover{background:rgba(242,239,232,.045); color:var(--ath-text)}
.ath-navitem.is-on{background:rgba(var(--ath-verd-rgb),.11); color:var(--ath-text); border-left-color:var(--ath-verd)}
.ath-navitem i{font-style:normal; width:17px; text-align:center; opacity:.72; font-size:13px}
.ath-navitem b{margin-left:auto; font-weight:500; font-size:11px; color:var(--ath-text-4); font-variant-numeric:tabular-nums}
.ath-navitem.is-on b{color:var(--ath-verd)}
.ath-navitem.is-soon{color:var(--ath-text-4)}
.ath-navitem.is-soon b{font-size:9px; letter-spacing:.1em; text-transform:uppercase}

@media (max-width:1000px){
  .ath-shell{grid-template-columns:1fr}
  .ath-rail{position:static; height:auto; flex-direction:row; overflow-x:auto; padding:var(--sp-4) 0; border-right:0; border-bottom:1px solid var(--ath-hair); align-items:center; gap:var(--sp-2)}
  .ath-rail-head,.ath-group-label{display:none}
  .ath-navitem{border-left:0; border-bottom:2px solid transparent; white-space:nowrap; padding:8px 14px}
  .ath-navitem.is-on{border-left-color:transparent; border-bottom-color:var(--ath-verd)}
}

/* ---------- main ---------------------------------------------------- */
.ath-main{min-width:0; display:flex; flex-direction:column}
.ath-topbar{
  display:flex; align-items:center; gap:var(--sp-4); padding:var(--sp-4) var(--sp-6);
  border-bottom:1px solid var(--ath-hair); background:var(--ath-slate); position:sticky; top:0; z-index:20;
}
.ath-topbar-t{min-width:0; flex:1}
.ath-topbar-t h1{margin:0; font-family:var(--ath-display); font-size:22px; letter-spacing:.055em; text-transform:uppercase; font-weight:400; line-height:1.2}
.ath-topbar-t p{margin:3px 0 0; font-size:12px; color:var(--ath-text-3)}
.ath-page{padding:var(--sp-6); flex:1}
@media (max-width:640px){ .ath-topbar,.ath-page{padding-left:var(--sp-4); padding-right:var(--sp-4)} }

/* ---------- primitives ---------------------------------------------- */
.ath-eyebrow{display:flex; align-items:center; gap:var(--sp-3); font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--ath-text-3); margin:0}
.ath-eyebrow::before{content:""; width:30px; height:1px; background:var(--ath-brass); flex:none}
.ath-h2{font-family:var(--ath-display); font-size:clamp(24px,3vw,36px); line-height:1.06; letter-spacing:.045em; text-transform:uppercase; margin:var(--sp-3) 0 0; font-weight:400}
.ath-h3{font-family:var(--ath-display); font-size:17px; letter-spacing:.06em; text-transform:uppercase; margin:0; font-weight:400}
.ath-prose{font-family:var(--ath-prose); font-size:15.5px; line-height:1.7; color:var(--ath-text-2)}
.ath-micro{font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3); margin:0}
.ath-nums{font-family:var(--ath-prose); font-weight:300; font-variant-numeric:lining-nums tabular-nums}

/* The section action aligns with the EYEBROW, not the bottom of the
   blurb — bottom alignment leaves it floating beside a ragged last line. */
.ath-sechead{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-4); margin-bottom:var(--sp-5); flex-wrap:wrap}
.ath-sechead p.ath-prose{margin:var(--sp-3) 0 0; max-width:62ch; font-size:15px}

.ath-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 16px; border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm);
  font-size:12px; font-weight:500; letter-spacing:.04em; color:var(--ath-text-2);
  transition:background-color .2s var(--ath-ease), color .2s var(--ath-ease), border-color .2s var(--ath-ease), transform .2s var(--ath-spring);
}
.ath-btn:hover{background:rgba(242,239,232,.07); color:var(--ath-text); border-color:var(--ath-text-4); transform:translateY(-1px)}
.ath-btn:active{transform:translateY(0)}
.ath-btn-primary{background:var(--ath-verd); border-color:var(--ath-verd); color:#06120E; font-weight:600}
.ath-btn-primary:hover{background:#6FBCA5; border-color:#6FBCA5; color:#06120E}
.ath-btn-sm{padding:6px 11px; font-size:11px}
.ath-btn-icon{width:30px; height:30px; padding:0; font-size:13px}
.ath-btn-danger:hover{background:rgba(var(--ath-bad-rgb),.16); border-color:var(--ath-bad); color:var(--ath-bad)}

.ath-card{background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); padding:var(--sp-5)}
.ath-card.is-flat{background:transparent; border-color:var(--ath-hair)}

.ath-rows{display:grid; margin:0}
.ath-row{display:grid; grid-template-columns:minmax(130px,.4fr) 1fr; gap:var(--sp-4); padding:11px 0; border-top:1px solid var(--ath-hair-soft); align-items:baseline}
.ath-row:first-child{border-top:0}
.ath-row dt{margin:0; font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-row dd{margin:0; font-size:14px; color:var(--ath-text)}
.ath-row dd.is-quiet{color:var(--ath-text-4); font-style:italic; font-family:var(--ath-prose)}
@media (max-width:560px){ .ath-row{grid-template-columns:1fr; gap:4px} }

.ath-meter{height:3px; background:rgba(242,239,232,.10); position:relative; overflow:hidden; margin-top:8px; border-radius:2px}
.ath-meter i{position:absolute; inset:0 auto 0 0; width:100%; background:var(--ath-verd); transform-origin:left; display:block}
.ath-meter.is-brass i{background:var(--ath-brass)}

.ath-tag{
  display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:var(--ath-r-sm);
  border:1px solid var(--ath-hair); font-size:10.5px; font-weight:500; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ath-text-2);
}
.ath-tag.t-verd{border-color:rgba(var(--ath-verd-rgb),.42); color:var(--ath-verd); background:rgba(var(--ath-verd-rgb),.10)}
.ath-tag.t-brass{border-color:rgba(var(--ath-brass-rgb),.42); color:var(--ath-brass); background:rgba(var(--ath-brass-rgb),.10)}
.ath-tag.t-bad{border-color:rgba(var(--ath-bad-rgb),.42); color:var(--ath-bad); background:rgba(var(--ath-bad-rgb),.10)}
.ath-tag.t-mute{color:var(--ath-text-4)}

.ath-chip{padding:6px 13px; border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm); font-size:11.5px; color:var(--ath-text-2); transition:background-color .2s var(--ath-ease), color .2s var(--ath-ease), border-color .2s var(--ath-ease)}
.ath-chip:hover{border-color:var(--ath-text-4); color:var(--ath-text)}
.ath-chip.is-on{background:var(--ath-text); border-color:var(--ath-text); color:var(--ath-void); font-weight:600}
.ath-chip-row{display:flex; gap:7px; flex-wrap:wrap}

.ath-empty{padding:var(--sp-7) var(--sp-5); text-align:center; border:1px dashed var(--ath-hair); border-radius:var(--ath-r); font-family:var(--ath-prose); color:var(--ath-text-3); font-size:15px}
.ath-empty b{display:block; font-family:var(--ath-display); font-size:19px; letter-spacing:.05em; text-transform:uppercase; color:var(--ath-text-2); margin-bottom:8px; font-weight:400}

/* =====================================================================
   §OVERVIEW — the eight header properties, over the field's own cover.
   ===================================================================== */
/* §HERO. The banner is this page's hero, so it carries the same built-in
   photograph as athenaeum.html's. A per-field cover set in Edit field
   layers on top and wins; the drawn hue plate is the last fallback. */
/* Bleeds out through the page padding to sit flush with the shell edges —
   a hero inset with rounded corners reads as a boxed card, which is the
   boundary this build was asked to remove. */
.ath-banner{
  position:relative; overflow:hidden; isolation:isolate;
  margin:calc(var(--sp-6) * -1) calc(var(--sp-6) * -1) var(--sp-6);
  min-height:360px; display:flex; align-items:flex-end;
  background:var(--ath-void);
}
/* The photograph sits on its own layer so the arrival sequence can scale
   it without dragging the headline along with it. */
.ath-banner::before{
  content:""; position:absolute; inset:0; z-index:-3;
  background:url("images_by_admin/athenaeum/hero.jpg") center 48% / cover no-repeat;
}
@media (max-width:640px){ .ath-banner{margin-left:calc(var(--sp-4) * -1); margin-right:calc(var(--sp-4) * -1)} }
.ath-banner-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2}
/* A hue WASH over the photograph, not an opaque plate. The photo is the
   hero background now, but each field still needs to feel like itself, so
   its hue tints the image rather than replacing it. */
.ath-banner-plate{
  position:absolute; inset:0; z-index:-2; mix-blend-mode:soft-light; opacity:.85;
  background:
    radial-gradient(circle 60% at 74% 30%, hsl(var(--h) 70% 56%) 0%, hsl(var(--h) 60% 34%) 50%, transparent 80%),
    linear-gradient(150deg, hsl(var(--h) 40% 30%) 0%, hsl(var(--h) 44% 12%) 100%);
}
/* The engraved rings stay, over the photograph. */
.ath-banner-plate::before{
  content:""; position:absolute; inset:-30%; mix-blend-mode:normal;
  background:repeating-radial-gradient(circle at 74% 30%, rgba(255,255,255,.12) 0 1px, transparent 1px 30px);
  -webkit-mask-image:radial-gradient(circle at 74% 30%, #000 4%, transparent 62%);
          mask-image:radial-gradient(circle at 74% 30%, #000 4%, transparent 62%);
}
/* Scrim graded to the LEFT, where the headline is, rather than flatly up
   from the bottom — a full-width bottom scrim erases the plate. */
.ath-banner::after{
  content:""; position:absolute; inset:0; z-index:-1;
  background:
    linear-gradient(to right, rgba(10,12,15,.88) 0%, rgba(10,12,15,.52) 44%, rgba(10,12,15,.10) 78%),
    linear-gradient(to top, rgba(10,12,15,.68) 0%, transparent 58%);
}
/* §HERO TYPE — the banner speaks in the hero face, like every other hero
   in The Athenaeum. */
.ath-banner-body,
.ath-banner-body .ath-eyebrow,
.ath-banner-body h2,
.ath-banner-body .ath-tag{font-family:var(--ath-hero-face); font-optical-sizing:auto}
.ath-banner-body{padding:var(--sp-6); width:100%; display:flex; align-items:flex-end; justify-content:space-between; gap:var(--sp-5); flex-wrap:wrap}
/* A BOUNDED CHIP, like the badge above the reference's headline — a
   leading mark, a hairline, glass behind it. Square rather than a pill:
   near-zero radii are this build's discipline. */
.ath-banner-body .ath-eyebrow{
  display:inline-flex; align-items:center; gap:11px;
  padding:6px 15px 6px 11px;
  border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm);
  background:rgba(10,12,15,.44);
  -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  font-weight:400; letter-spacing:.34em; font-size:11.5px;
}
.ath-banner-body .ath-eyebrow::before{
  width:7px; height:7px; background:var(--ath-brass);
  box-shadow:0 0 0 3px rgba(var(--ath-brass-rgb),.20), 0 0 14px rgba(var(--ath-brass-rgb),.8);
}
.ath-banner-body h2{
  font-size:clamp(28px,3.8vw,52px); line-height:1.06; letter-spacing:.07em;
  text-transform:uppercase; margin:var(--sp-4) 0 0; font-weight:500; max-width:20ch;
  text-shadow:0 2px 40px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.5);
}
.ath-banner-body .ath-tag{letter-spacing:.18em; font-weight:400}
/* Sits WITH the photograph rather than on top of it: screen-blended and
   half-opacity, so it reads as part of the plate instead of a sticker. */
.ath-banner-glyph{
  position:absolute; right:9%; top:34%; transform:translate(50%,-50%); font-size:132px; line-height:1;
  opacity:.42; color:hsl(var(--h) 60% 86%); font-style:normal; mix-blend-mode:screen;
  text-shadow:0 0 90px hsl(var(--h) 80% 60% / .5);
}
@media (max-width:760px){ .ath-banner-glyph{font-size:76px; opacity:.28} }

/* =====================================================================
   §BANNER ARRIVAL — the same three gestures as the hero on athenaeum.html
   (plate pulls back, headline is uncovered left to right by a brass
   beam, everything else lifts in behind it), at banner scale. See the
   long note in athenaeum.html for why `--t` exists: a cloud pull
   re-creates this DOM, and the negative offset is what lets the reveal
   RESUME on the new node instead of restarting.
   ===================================================================== */
:root{ --ath-pull:cubic-bezier(.16,.84,.24,1); --ath-wipe:cubic-bezier(.42,.02,.10,1) }

@keyframes ath-plate{ from{ transform:scale(1.16) } }
@keyframes ath-wipe{ from{ -webkit-mask-position:100% 0; mask-position:100% 0 } }
@keyframes ath-bar{ from{ background-position:100% 0 } }
@keyframes ath-lift-in{ from{ opacity:0; transform:translateY(14px) } }
@keyframes ath-glyph-in{ from{ opacity:0; transform:translate(50%,-50%) scale(.82) } }

.ath-banner.is-intro::before,
.ath-banner.is-intro .ath-banner-img,
.ath-banner.is-intro .ath-banner-plate{
  animation:ath-plate 2s var(--ath-pull) backwards;
  animation-delay:calc(var(--t,0ms) + 0s);
}
.ath-rvl{display:block; position:relative}
.ath-banner.is-intro .ath-rvl{
  -webkit-mask-image:linear-gradient(90deg,#000 0 40%,rgba(0,0,0,.42) 43%,transparent 46%);
          mask-image:linear-gradient(90deg,#000 0 40%,rgba(0,0,0,.42) 43%,transparent 46%);
  -webkit-mask-size:250% 100%;   mask-size:250% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:0 0;     mask-position:0 0;
  animation:ath-wipe 1.1s var(--ath-wipe) backwards;
  animation-delay:calc(var(--t,0ms) + .3s);
}
.ath-banner.is-intro .ath-rvl::after{
  content:""; position:absolute; left:0; right:0; top:.04em; bottom:.06em;
  pointer-events:none; mix-blend-mode:screen; opacity:.92;
  background-image:linear-gradient(90deg,
    transparent 0 40.9%,
    rgba(var(--ath-brass-rgb),.5) 41.8%,
    var(--ath-brass) 42.1% 42.9%,
    rgba(var(--ath-brass-rgb),.5) 43.2%,
    transparent 44.1% 100%);
  background-size:250% 100%; background-repeat:no-repeat; background-position:0 0;
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 13%, #000 87%, transparent 100%);
          mask-image:linear-gradient(180deg, transparent 0, #000 13%, #000 87%, transparent 100%);
  animation:ath-bar 1.1s var(--ath-wipe) backwards;
  animation-delay:calc(var(--t,0ms) + .3s);
}
.ath-banner.is-intro .ath-chip-row,
.ath-banner.is-intro .ath-banner-body .ath-eyebrow{ animation:ath-lift-in .84s var(--ath-ease) backwards }
.ath-banner.is-intro .ath-chip-row{ animation-delay:calc(var(--t,0ms) + 1.02s) }
.ath-banner.is-intro .ath-banner-body .ath-eyebrow{ animation-delay:calc(var(--t,0ms) + 1.22s) }
.ath-banner.is-intro .ath-banner-glyph{
  animation:ath-glyph-in 1s var(--ath-ease) backwards;
  animation-delay:calc(var(--t,0ms) + .78s);
}

/* The global reduced-motion rule only collapses DURATION, and these are
   delayed with a backwards fill — collapsing the duration alone would
   hold the banner blank and then snap it in. */
@media (prefers-reduced-motion:reduce){
  .ath-banner.is-intro::before,
  .ath-banner.is-intro .ath-banner-img,
  .ath-banner.is-intro .ath-banner-plate,
  .ath-banner.is-intro .ath-banner-glyph,
  .ath-banner.is-intro .ath-chip-row,
  .ath-banner.is-intro .ath-banner-body .ath-eyebrow,
  .ath-banner.is-intro .ath-rvl{ animation:none }
  .ath-banner.is-intro .ath-rvl{-webkit-mask-image:none; mask-image:none}
  .ath-banner.is-intro .ath-rvl::after{content:none}
}

.ath-props{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-5)}
@media (max-width:900px){ .ath-props{grid-template-columns:1fr} }
.ath-prop{background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); padding:var(--sp-5); position:relative}
.ath-prop h4{margin:0 0 var(--sp-3); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-prop .ath-prose{margin:0; font-size:16px}
.ath-prop .is-unset{color:var(--ath-text-4); font-style:italic}

.ath-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--ath-hair); border:1px solid var(--ath-hair); border-radius:var(--ath-r); overflow:hidden; margin-bottom:var(--sp-6)}
@media (max-width:820px){ .ath-stats{grid-template-columns:repeat(2,1fr)} }
.ath-stat{background:var(--ath-raise); padding:var(--sp-4) var(--sp-5)}
.ath-stat b{display:block; font-family:var(--ath-prose); font-weight:300; font-size:32px; line-height:1.1; font-variant-numeric:lining-nums tabular-nums}
.ath-stat span{font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ath-text-3)}

/* =====================================================================
   §MAP — the Subject Map. A real tree: indentation carries the
   parent→child relation, and the rail on the left of each row makes the
   depth readable without a drawn connector.
   ===================================================================== */
.ath-tree{display:grid; gap:var(--sp-2)}
.ath-node{
  background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r);
  padding:var(--sp-4) var(--sp-5); display:grid; gap:var(--sp-3);
  transition:border-color .22s var(--ath-ease), background-color .22s var(--ath-ease);
}
.ath-node:hover{border-color:var(--ath-hair); background:var(--ath-raise-2)}
.ath-node.d1{margin-left:var(--sp-6); border-left:2px solid rgba(var(--ath-verd-rgb),.32)}
.ath-node.d2{margin-left:calc(var(--sp-6) * 2); border-left:2px solid rgba(var(--ath-brass-rgb),.30)}
.ath-node.d3{margin-left:calc(var(--sp-6) * 3); border-left:2px solid var(--ath-hair)}
@media (max-width:700px){
  .ath-node.d1{margin-left:var(--sp-4)} .ath-node.d2{margin-left:var(--sp-5)} .ath-node.d3{margin-left:var(--sp-6)}
}
.ath-node-top{display:flex; align-items:flex-start; gap:var(--sp-3); flex-wrap:wrap}
.ath-node-title{font-family:var(--ath-prose); font-size:18px; line-height:1.3; margin:0; flex:1; min-width:200px}
.ath-node-acts{display:flex; gap:6px; opacity:0; transition:opacity .2s var(--ath-ease)}
.ath-node:hover .ath-node-acts,.ath-node:focus-within .ath-node-acts{opacity:1}
.ath-node-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:var(--sp-4)}
.ath-node-cell span{display:block; font-size:9.5px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--ath-text-4); margin-bottom:4px}
.ath-node-cell strong{font-weight:500; font-size:13px}
.ath-node-ladder{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ath-text-2)}
.ath-node-ladder em{font-style:normal; color:var(--ath-text-4)}

/* =====================================================================
   §RESEARCH — the Deep Research Bar. Two halves that do different jobs:
   the lens column never changes (standing questions), the inbox column
   is where everything lands.
   ===================================================================== */
.ath-research{display:grid; grid-template-columns:1fr 340px; gap:var(--sp-5); align-items:start}
@media (max-width:1100px){ .ath-research{grid-template-columns:1fr} }
.ath-capture{background:var(--ath-raise); border:1px solid var(--ath-hair); border-radius:var(--ath-r); padding:var(--sp-5); margin-bottom:var(--sp-5)}
.ath-capture textarea{
  width:100%; background:var(--ath-slate); border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm);
  color:var(--ath-text); padding:var(--sp-4); font-family:var(--ath-prose); font-size:16px; line-height:1.6; resize:vertical; min-height:88px;
  transition:border-color .2s var(--ath-ease);
}
.ath-capture textarea:focus{outline:none; border-color:var(--ath-verd)}
.ath-capture-foot{display:flex; align-items:center; gap:var(--sp-3); margin-top:var(--sp-4); flex-wrap:wrap}
.ath-capture-foot .ath-chip-row{flex:1}

.ath-inbox-item{
  background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r);
  padding:var(--sp-4) var(--sp-5); display:grid; gap:var(--sp-3); margin-bottom:var(--sp-2);
  transition:border-color .22s var(--ath-ease);
}
.ath-inbox-item:hover{border-color:var(--ath-hair)}
.ath-inbox-item.is-done{opacity:.5}
.ath-inbox-head{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap}
.ath-inbox-head time{margin-left:auto; font-size:11px; color:var(--ath-text-4)}
.ath-inbox-text{font-family:var(--ath-prose); font-size:17px; line-height:1.5; margin:0}
.ath-inbox-note{font-family:var(--ath-prose); font-size:14.5px; line-height:1.6; color:var(--ath-text-3); margin:0}
.ath-inbox-acts{display:flex; gap:6px; flex-wrap:wrap}

.ath-lens{background:var(--ath-raise); border:1px solid var(--ath-hair); border-radius:var(--ath-r); padding:var(--sp-5); position:sticky; top:96px}
.ath-lens-item{
  display:block; width:100%; text-align:left; padding:var(--sp-4) 0;
  border-top:1px solid var(--ath-hair-soft); font-family:var(--ath-prose); font-style:italic;
  font-size:17px; line-height:1.4; color:var(--ath-text-2);
  transition:color .2s var(--ath-ease), padding-left .24s var(--ath-ease);
}
.ath-lens-item:first-of-type{border-top:0}
.ath-lens-item:hover{color:var(--ath-brass); padding-left:8px}
.ath-lens-item small{display:block; font-family:var(--ath-ui); font-style:normal; font-size:11.5px; color:var(--ath-text-4); margin-top:5px; line-height:1.5}

/* =====================================================================
   §CURRICULA + §RESOURCES
   ===================================================================== */
.ath-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-5); align-items:start}
@media (max-width:1000px){ .ath-cols{grid-template-columns:1fr} }
.ath-col h4{margin:0 0 var(--sp-3); display:flex; align-items:center; justify-content:space-between; font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-col h4 span{color:var(--ath-text-4); font-variant-numeric:tabular-nums}

.ath-item{
  display:block; background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r);
  padding:var(--sp-4); margin-bottom:var(--sp-2);
  transition:border-color .22s var(--ath-ease), transform .22s var(--ath-ease), background-color .22s var(--ath-ease);
}
.ath-item:hover{border-color:var(--ath-hair); background:var(--ath-raise-2); transform:translateY(-2px)}
.ath-item-t{font-family:var(--ath-prose); font-size:17px; line-height:1.3; margin:0}
.ath-item-m{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; margin-top:9px; font-size:11.5px; color:var(--ath-text-3)}
.ath-item-why{font-family:var(--ath-prose); font-size:14px; line-height:1.55; color:var(--ath-text-3); margin:8px 0 0}

.ath-bucket{margin-bottom:var(--sp-6)}
.ath-bucket-head{display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:var(--sp-3); flex-wrap:wrap}
.ath-bucket-head p{margin:0; font-size:12.5px; color:var(--ath-text-3); font-family:var(--ath-prose)}
.ath-reslist{display:grid; gap:1px; background:var(--ath-hair-soft); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); overflow:hidden}
.ath-res{background:var(--ath-raise); padding:var(--sp-3) var(--sp-4); display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; transition:background-color .2s var(--ath-ease)}
.ath-res:hover{background:var(--ath-raise-2)}
.ath-res-t{font-family:var(--ath-prose); font-size:16px; flex:1; min-width:190px}
.ath-res-t em{font-style:normal; color:var(--ath-text-4); font-size:13px; display:block; margin-top:2px}
.ath-res-acts{display:flex; gap:6px}

/* =====================================================================
   §KNOWLEDGE — the permanent concept database.
   ===================================================================== */
.ath-toolbar{display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:center; margin-bottom:var(--sp-5)}
.ath-search{
  flex:1; min-width:200px; padding:9px 13px; background:var(--ath-raise); color:var(--ath-text);
  border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm); font:inherit; font-size:13.5px;
  transition:border-color .2s var(--ath-ease);
}
.ath-search:focus{outline:none; border-color:var(--ath-verd)}

.ath-cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:var(--sp-4)}
.ath-concept{
  display:block; background:var(--ath-raise); border:1px solid var(--ath-hair-soft);
  border-radius:var(--ath-r); padding:var(--sp-5); position:relative; overflow:hidden;
  transition:border-color .24s var(--ath-ease), transform .24s var(--ath-ease), background-color .24s var(--ath-ease);
}
.ath-concept:hover{border-color:var(--ath-hair); background:var(--ath-raise-2); transform:translateY(-3px)}
/* Confidence reads as a spine down the left edge — it is the first thing
   worth knowing about a concept and should not need a legend. */
.ath-concept::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:var(--ath-verd); opacity:calc(var(--conf) / 5);
}
.ath-concept h4{margin:0; font-family:var(--ath-prose); font-size:19px; font-weight:400; line-height:1.25}
.ath-concept p{margin:9px 0 0; font-family:var(--ath-prose); font-size:14.5px; line-height:1.6; color:var(--ath-text-3);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.ath-concept-foot{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-4); padding-top:var(--sp-3); border-top:1px solid var(--ath-hair-soft)}

/* Concept detail — a reading page, so the prose column stays narrow. */
.ath-detail{max-width:900px}
.ath-detail-head{border-bottom:1px solid var(--ath-hair); padding-bottom:var(--sp-5); margin-bottom:var(--sp-5)}
.ath-detail-head h2{font-family:var(--ath-display); font-size:clamp(28px,3.6vw,44px); line-height:1.06; letter-spacing:.035em; text-transform:uppercase; margin:var(--sp-3) 0 0; font-weight:400}
.ath-block{margin-bottom:var(--sp-5)}
.ath-block h4{margin:0 0 var(--sp-2); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-block .ath-prose{margin:0; max-width:70ch}
.ath-block .is-unset{color:var(--ath-text-4); font-style:italic}
/* Criticism and your own interpretation are the two blocks most likely to
   be skipped, so each is marked rather than sitting in a uniform stack. */
.ath-block.is-crit{border-left:2px solid rgba(var(--ath-bad-rgb),.5); padding-left:var(--sp-4)}
.ath-block.is-mine{border-left:2px solid var(--ath-brass); padding-left:var(--sp-4)}
.ath-related{display:flex; gap:var(--sp-2); flex-wrap:wrap}
.ath-related a{padding:6px 12px; border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm); font-family:var(--ath-prose); font-size:15px; color:var(--ath-text-2); transition:border-color .2s var(--ath-ease), color .2s var(--ath-ease)}
.ath-related a:hover{border-color:var(--ath-verd); color:var(--ath-verd)}

/* =====================================================================
   §CONNECTIONS — two hand-rolled SVG diagrams, no library. The internal
   one is a chord circle (ideas inside this field); the cross-field one is
   a hub-and-spoke with this field at the centre.
   ===================================================================== */
.ath-viz{background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); padding:var(--sp-4); margin-bottom:var(--sp-5); overflow-x:auto}
/* Capped and centred rather than stretched: `width:100%` on a wide column
   scales a sparse diagram up into a mostly-empty rectangle. */
.ath-viz svg{display:block; width:100%; max-width:720px; margin:0 auto; height:auto; min-width:400px}
.ath-viz .edge{stroke:rgba(var(--ath-verd-rgb),.34); fill:none; stroke-width:1.2; transition:stroke .2s var(--ath-ease), stroke-width .2s var(--ath-ease)}
.ath-viz .edge.is-cross{stroke:rgba(var(--ath-brass-rgb),.42)}
.ath-viz g.node{cursor:pointer}
.ath-viz g.node circle{fill:var(--ath-raise-2); stroke:var(--ath-hair); stroke-width:1; transition:fill .2s var(--ath-ease), stroke .2s var(--ath-ease)}
.ath-viz g.node:hover circle{fill:var(--ath-verd); stroke:var(--ath-verd)}
.ath-viz g.node.is-hub circle{fill:rgba(var(--ath-brass-rgb),.22); stroke:var(--ath-brass); stroke-width:1.5}
.ath-viz g.node text{fill:var(--ath-text-2); font-family:var(--ath-ui); font-size:9px; font-weight:500; letter-spacing:.02em}
.ath-viz g.node:hover text{fill:var(--ath-text)}
.ath-viz g.node.is-hub text{fill:var(--ath-brass); font-weight:600}

.ath-link{
  display:flex; align-items:center; gap:var(--sp-3); background:var(--ath-raise);
  border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); padding:var(--sp-3) var(--sp-4);
  margin-bottom:var(--sp-2); flex-wrap:wrap; transition:border-color .2s var(--ath-ease);
}
.ath-link:hover{border-color:var(--ath-hair)}
.ath-link-chain{flex:1; min-width:220px; font-family:var(--ath-prose); font-size:16px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.ath-link-chain em{font-style:normal; color:var(--ath-verd); font-size:15px}
.ath-link-note{width:100%; font-family:var(--ath-prose); font-size:14px; color:var(--ath-text-3); margin:0}

/* =====================================================================
   §CONTRADICTIONS — A and B must be visually symmetrical, or the layout
   itself takes a side.
   ===================================================================== */
.ath-cx{background:var(--ath-raise); border:1px solid var(--ath-hair-soft); border-radius:var(--ath-r); margin-bottom:var(--sp-5); overflow:hidden}
.ath-cx.is-resolved{opacity:.72}
.ath-cx-head{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--ath-hair-soft); flex-wrap:wrap}
.ath-cx-head h4{margin:0; font-family:var(--ath-display); font-size:19px; letter-spacing:.05em; text-transform:uppercase; font-weight:400; flex:1; min-width:200px}
.ath-cx-body{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--ath-hair-soft)}
@media (max-width:820px){ .ath-cx-body{grid-template-columns:1fr} }
.ath-cx-side{background:var(--ath-raise); padding:var(--sp-5)}
.ath-cx-side.a{box-shadow:inset 2px 0 0 rgba(var(--ath-verd-rgb),.55)}
.ath-cx-side.b{box-shadow:inset 2px 0 0 rgba(var(--ath-brass-rgb),.55)}
.ath-cx-side h5{margin:0 0 var(--sp-2); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-cx-side .theory{font-family:var(--ath-prose); font-size:17px; line-height:1.5; margin:0 0 var(--sp-4)}
.ath-cx-side .ev{font-family:var(--ath-prose); font-size:14.5px; line-height:1.65; color:var(--ath-text-3); margin:0}
.ath-cx-foot{padding:var(--sp-5); border-top:1px solid var(--ath-hair-soft); display:grid; gap:var(--sp-4)}
.ath-cx-foot .ath-block{margin:0}
.ath-cx-verdict{background:var(--ath-raise-2); border-left:2px solid var(--ath-brass); padding:var(--sp-4) var(--sp-5)}
.ath-conf{display:inline-flex; gap:3px; align-items:center}
.ath-conf i{width:7px; height:7px; border-radius:50%; background:var(--ath-text-4); display:block}
.ath-conf i.on{background:var(--ath-brass)}

/* =====================================================================
   §MODAL + §TOAST
   ===================================================================== */
.ath-modal-bg{position:fixed; inset:0; z-index:120; background:rgba(4,6,9,.74); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:var(--sp-5)}
.ath-modal-bg.show{display:flex; animation:ath-fade .22s var(--ath-ease)}
.ath-modal{background:var(--ath-raise); width:min(700px,100%); max-height:88vh; overflow:auto; border:1px solid var(--ath-hair); border-radius:var(--ath-r); box-shadow:0 40px 90px -40px rgba(0,0,0,.95)}
.ath-modal.is-wide{width:min(960px,100%)}
.ath-modal-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4); padding:var(--sp-5) var(--sp-5) var(--sp-4); border-bottom:1px solid var(--ath-hair-soft); position:sticky; top:0; background:var(--ath-raise); z-index:2}
.ath-modal-body{padding:var(--sp-5); display:grid; gap:var(--sp-4)}
.ath-modal-foot{display:flex; justify-content:flex-end; gap:var(--sp-3); padding:var(--sp-4) var(--sp-5) var(--sp-5); border-top:1px solid var(--ath-hair-soft)}
.ath-field{display:grid; gap:7px}
.ath-field-label{font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--ath-text-3)}
.ath-field-hint{margin:0; font-size:12.5px; color:var(--ath-text-4); font-family:var(--ath-prose); line-height:1.55}
.ath-field-row{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4)}
@media (max-width:600px){ .ath-field-row{grid-template-columns:1fr} }
.ath-input,.ath-select,.ath-textarea{
  width:100%; padding:10px 12px; background:var(--ath-slate); color:var(--ath-text);
  border:1px solid var(--ath-hair); border-radius:var(--ath-r-sm); font:inherit; font-size:14px;
  transition:border-color .2s var(--ath-ease);
}
.ath-textarea{font-family:var(--ath-prose); font-size:15.5px; line-height:1.6; resize:vertical}
.ath-input:focus,.ath-select:focus,.ath-textarea:focus{outline:none; border-color:var(--ath-verd)}
.ath-select option{background:var(--ath-slate)}
/* Phone: a field under 16px makes iOS Safari zoom the page in on focus and
   never zoom back out, so one tap on a form leaves the page magnified. */
@media (max-width:768px){ .ath-input,.ath-select,.ath-textarea{font-size:16px; padding:12px} }
@keyframes ath-fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

#athToast{position:fixed; left:50%; bottom:var(--sp-5); transform:translate(-50%,20px); z-index:200; background:var(--ath-text); color:var(--ath-void); padding:11px 20px; border-radius:var(--ath-r-sm); font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .26s var(--ath-ease), transform .26s var(--ath-spring)}
#athToast.show{opacity:1; transform:translate(-50%,0)}
#athToast.is-bad{background:var(--ath-bad); color:#1A0B0A}

/* topbar.js's launcher pill is fixed top-left over the rail. */
.ath-rail-head{padding-top:52px}
@media (max-width:1000px){ .ath-rail{padding-left:150px} }
</style>
</head>
<body>

<div class="ath-shell">
  <nav class="ath-rail" id="athRail" aria-label="Subject sections"></nav>
  <div class="ath-main">
    <header class="ath-topbar" id="athTopbar"></header>
    <div class="ath-page" id="athPage"></div>
  </div>
</div>

<div class="ath-modal-bg" id="athModalBg"><div class="ath-modal" id="athModal" role="dialog" aria-modal="true"></div></div>
<div id="athToast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="athenaeum-data.js"></script>
<script src="athenaeum-drafts.js"></script>
<script src="athenaeum-resource-editor.js"></script>
<script src="topbar.js?v=1" defer></script>
<script src="athenaeum-nav.js" defer></script>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function D() { return window.Athenaeum; }
  function esc(s) { return D().esc(s); }
  function runSafely(fn, label) {
    try { return fn(); } catch (e) {
      try { console.error('[Athenaeum·hub] ' + (label || 'error'), e); } catch (e2) {}
      toast('Something went wrong — see the console', true);
    }
  }
  var toastTimer = null;
  function toast(msg, bad) {
    var el = $('athToast');
    el.textContent = msg;
    el.classList.toggle('is-bad', !!bad);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  var bound = {};
  function on(hostId, evt, sel, fn) {
    var key = hostId + '|' + evt + '|' + sel;
    if (bound[key]) return;
    bound[key] = 1;
    var host = $(hostId);
    if (!host) return;
    host.addEventListener(evt, function (e) {
      var t = e.target.closest ? e.target.closest(sel) : null;
      if (t && host.contains(t)) fn(e, t);
    });
  }

  // ============================================================
  // §ROUTE — the subject comes from ?id= (a query param, like
  // learning-topic.html) so the hash stays free for the tabs.
  // ============================================================
  var TABS = [
    { id: 'overview',       icon: '◧', label: 'Overview',        group: 'The field' },
    { id: 'map',            icon: '⌗', label: 'Subject Map',     group: 'The field' },
    { id: 'research',       icon: '⌕', label: 'Deep Research',   group: 'The field' },
    { id: 'curricula',      icon: '❑', label: 'Curricula',       group: 'Study' },
    { id: 'resources',      icon: '▤', label: 'Resources',       group: 'Study' },
    { id: 'knowledge',      icon: '◆', label: 'Knowledge Base',  group: 'Permanent' },
    { id: 'connections',    icon: '⁂', label: 'Connections',     group: 'Permanent' },
    { id: 'contradictions', icon: '⚖', label: 'Contradictions',  group: 'Permanent' },
    { id: 'experiments',    icon: '⚗', label: 'Experiments',     group: 'Permanent' }
  ];
  function tabById(id) { for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) return TABS[i]; return TABS[0]; }

  var S = { subjectId: '', tab: 'overview', detailId: '', bucket: 'core', captureKind: 'question', conceptQuery: '', conceptTopic: '' };

  function readParam() {
    try { return new URLSearchParams(location.search).get('id') || ''; }
    catch (e) { return ''; }
  }
  /* #/<tab> and #/<tab>/<recordId>. The second segment gives a concept its
     own address, so Back works out of a detail view instead of leaving the
     page entirely. */
  function parseHash() {
    var raw = String(location.hash || '').replace(/^#/, '').replace(/^\//, '');
    var parts = raw.split('/');
    return { tab: tabById(parts[0]).id, detailId: parts[1] || '' };
  }
  function subject() { return D().subjectById(S.subjectId); }

  var paintedKey = null;
  function render(opts) {
    opts = opts || {};
    var route = parseHash();
    S.tab = route.tab;
    S.detailId = route.detailId;
    var key = S.tab + ':' + S.detailId;
    var navigated = key !== paintedKey;
    var keepScroll = opts.keepScroll || !navigated;
    var y = window.scrollY;

    var s = subject();
    if (!s) { renderMissing(); return; }

    runSafely(function () { renderRail(s); }, 'rail');
    runSafely(function () { renderTopbar(s); }, 'topbar');
    var host = $('athPage');
    // A tab with a detail id routes to its detail renderer instead.
    var fn = S.detailId
      ? ({ knowledge: renderConcept })[S.tab]
      : ({
          overview: renderOverview, map: renderMap, research: renderResearch,
          curricula: renderCurricula, resources: renderResources,
          knowledge: renderKnowledge, connections: renderConnections,
          contradictions: renderContradictions, experiments: renderExperiments
        })[S.tab];
    // `navigated` doubles as the arrival cue for the overview banner: its
    // reveal plays when the reader lands on the tab, never on a repaint.
    if (fn) runSafely(function () { fn(host, s, navigated); }, 'render ' + S.tab);
    else runSafely(function () { renderSoon(host, s); }, 'renderSoon');

    paintedKey = key;
    D().setUiState({ lastSubject: S.subjectId, lastSubjectTab: S.tab });
    // Explicit behavior:'auto' — see the note in athenaeum.html's render().
    if (keepScroll) requestAnimationFrame(function () { window.scrollTo({ top: y, behavior: 'auto' }); });
    else window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* Repaint after a data change or a cloud pull. Never scrolls, and never
     rebuilds the DOM under an open dialog or a field being typed into. */
  function refreshCurrentView() {
    if ($('athModalBg').classList.contains('show')) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return;
    runSafely(function () { render({ keepScroll: true }); }, 'refresh');
  }

  function renderMissing() {
    $('athRail').innerHTML = '<div class="ath-rail-head"><a class="ath-home" href="athenaeum.html">← The Athenaeum</a></div>';
    $('athTopbar').innerHTML = '<div class="ath-topbar-t"><h1>Field not found</h1></div>';
    $('athPage').innerHTML = '<div class="ath-empty"><b>No such field</b>' +
      'This page needs a field id in its address, like <code>athenaeum-subject.html?id=psychology</code>.' +
      '<div style="margin-top:var(--sp-5)"><a class="ath-btn" href="athenaeum.html#/fields">Back to the fields</a></div></div>';
  }

  // ============================================================
  // §RAIL + §TOPBAR
  // ============================================================
  function renderRail(s) {
    var d = D();
    var st = d.subjectStats(s.id);
    var counts = {
      map: d.topicsFor(s.id).length,
      research: d.inboxOpen(s.id).length,
      curricula: d.curriculaFor(s.id).length,
      resources: st.resources,
      knowledge: st.concepts,
      connections: d.connectionsFor(s.id).length,
      contradictions: st.openContradictions,
      experiments: d.experimentsFor(s.id).length
    };
    var html = '<div class="ath-rail-head">' +
      '<a class="ath-home" href="athenaeum.html">← The Athenaeum</a>' +
      '<h2 class="ath-rail-name">' + esc(s.name) + '</h2>' +
      '<p class="ath-rail-sub">' + esc(d.labelFrom(d.SUBJECT_STATUSES, s.status, 'Dormant')) +
        ' · ' + esc(d.labelFrom(d.SEASONS, s.season, 'Fallow')) + '</p>' +
    '</div>';
    var lastGroup = null;
    TABS.forEach(function (t) {
      if (t.group !== lastGroup) { html += '<p class="ath-group-label">' + esc(t.group) + '</p>'; lastGroup = t.group; }
      var n = counts[t.id];
      html += '<a class="ath-navitem' + (S.tab === t.id ? ' is-on' : '') + (t.soon ? ' is-soon' : '') + '" href="#/' + t.id + '">' +
        '<i>' + t.icon + '</i><span>' + esc(t.label) + '</span>' +
        (t.soon ? '<b>Soon</b>' : (n ? '<b>' + n + '</b>' : '')) +
      '</a>';
    });
    $('athRail').innerHTML = html;
  }

  function renderTopbar(s) {
    var d = D();
    $('athTopbar').innerHTML =
      '<div class="ath-topbar-t">' +
        '<h1>' + esc(tabById(S.tab).label) + '</h1>' +
        '<p>' + esc(s.name) + '</p>' +
      '</div>' +
      '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-subject">Edit field</button>';
  }

  // ============================================================
  // §PIECES
  // ============================================================
  function meter(pct, brass) {
    var p = Math.max(0, Math.min(100, Math.round(pct || 0)));
    return '<div class="ath-meter' + (brass ? ' is-brass' : '') + '"><i style="transform:scaleX(' + (p / 100) + ')"></i></div>';
  }
  function row(label, value, quiet) {
    return '<div class="ath-row"><dt>' + esc(label) + '</dt><dd' + (quiet ? ' class="is-quiet"' : '') + '>' + value + '</dd></div>';
  }
  function prop(label, value) {
    return '<div class="ath-prop"><h4>' + esc(label) + '</h4>' +
      (value ? '<p class="ath-prose">' + esc(value).replace(/\n/g, '<br>') + '</p>'
             : '<p class="ath-prose is-unset">Not written yet.</p>') + '</div>';
  }
  /* §ARRIVAL — see the long note in athenaeum.html. On a genuine arrival
     this restarts the clock; on a repaint it reports how far the reveal
     has already got as a negative `--t`, so the re-created banner resumes
     instead of replaying. Past ATH_INTRO_RUN nothing is emitted. */
  var ATH_INTRO_RUN = 2300;
  var introAt = -1;
  function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function introAttrs(arrived) {
    var t = nowMs();
    if (arrived) introAt = t;
    if (introAt < 0) return { cls: '', style: '' };
    var elapsed = t - introAt;
    if (elapsed >= ATH_INTRO_RUN) return { cls: '', style: '' };
    return { cls: ' is-intro', style: '--t:' + (-Math.round(elapsed)) + 'ms;' };
  }

  function sechead(eyebrow, title, blurb, action) {
    return '<div class="ath-sechead"><div>' +
      '<p class="ath-eyebrow">' + esc(eyebrow) + '</p>' +
      '<h2 class="ath-h2">' + esc(title) + '</h2>' +
      (blurb ? '<p class="ath-prose">' + esc(blurb) + '</p>' : '') +
    '</div>' + (action || '') + '</div>';
  }

  // ============================================================
  // §OVERVIEW
  // ============================================================
  function renderOverview(host, s, arrived) {
    var d = D();
    var st = d.subjectStats(s.id);
    var active = st.active;
    var arrival = introAttrs(arrived);

    host.innerHTML =
      '<div class="ath-banner' + arrival.cls + '" style="--h:' + (s.hue || 200) + ';' + arrival.style + '">' +
        (s.cover
          ? '<img class="ath-banner-img" src="' + esc(s.cover) + '" alt="" style="object-position:' + esc(s.coverPos || '50% 50%') + '">'
          : '<div class="ath-banner-plate"></div>') +
        '<i class="ath-banner-glyph">' + esc(s.glyph || '✦') + '</i>' +
        '<div class="ath-banner-body">' +
          '<div>' +
            '<p class="ath-eyebrow">Field ' + esc(d.roman(fieldIndex(s.id) + 1)) + '</p>' +
            '<h2><span class="ath-rvl">' + esc(s.name) + '</span></h2>' +
          '</div>' +
          '<div class="ath-chip-row">' +
            '<span class="ath-tag t-verd">' + esc(d.labelFrom(d.SUBJECT_STATUSES, s.status, 'Dormant')) + '</span>' +
            '<span class="ath-tag t-brass">' + esc(d.labelFrom(d.SEASONS, s.season, 'Fallow')) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="ath-stats">' +
        stat(d.masteryLabel(s.understanding), 'Current understanding', true) +
        stat(String(st.completed), 'Curricula completed') +
        stat(d.fmtHours(s.studyMinutes) || '0h', 'Total study time', true) +
        stat(String(st.concepts), 'Concepts kept') +
      '</div>' +

      '<div class="ath-props">' +
        prop('Why I study this', s.whyIStudy) +
        prop('What mastery means to me', s.masteryMeans) +
        prop('Long-term goals', s.longTermGoals) +
        '<div class="ath-prop">' +
          '<h4>Current curriculum</h4>' +
          (active
            ? '<p class="ath-prose" style="margin-bottom:var(--sp-3)">' + esc(active.title) + '</p>' +
              meter(st.progress) +
              '<p class="ath-micro" style="margin-top:9px">' + st.progress + '% toward outcomes</p>' +
              '<a class="ath-btn ath-btn-sm" style="margin-top:var(--sp-4)" href="athenaeum-curriculum.html?id=' + encodeURIComponent(active.id) + '">Open curriculum</a>'
            : '<p class="ath-prose is-unset">Nothing running in this field.</p>' +
              '<a class="ath-btn ath-btn-sm" style="margin-top:var(--sp-4)" href="#/curricula">Start one</a>') +
        '</div>' +
        '<div class="ath-prop">' +
          '<h4>Mastery ladder</h4>' +
          '<p class="ath-prose" style="margin-bottom:0">' + esc(d.masteryLabel(s.mastery)) + '</p>' +
          '<p class="ath-micro" style="margin:5px 0 0;text-transform:none;letter-spacing:0;font-family:var(--ath-prose);font-size:14px;font-style:italic">' + esc(d.masteryHint(s.mastery)) + '</p>' +
          meter(d.masteryPct(s.mastery), true) +
        '</div>' +
        '<div class="ath-prop">' +
          '<h4>Current focus</h4>' +
          (s.currentFocus ? '<p class="ath-prose">' + esc(s.currentFocus) + '</p>' : '<p class="ath-prose is-unset">Not set.</p>') +
          '<dl class="ath-rows" style="margin-top:var(--sp-4)">' +
            row('Open questions', String(st.openQuestions)) +
            row('Open contradictions', String(st.openContradictions)) +
            row('Topics mapped', String(st.topics)) +
          '</dl>' +
        '</div>' +
      '</div>';
  }
  function stat(value, label, prose) {
    return '<div class="ath-stat"><b' + (prose ? ' style="font-size:26px"' : '') + '>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }
  function fieldIndex(id) {
    var all = D().subjectList();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return i;
    return 0;
  }

  // ============================================================
  // §MAP — the Subject Map.
  // ============================================================
  function renderMap(host, s) {
    var d = D();
    var tree = d.topicTree(s.id);
    var flat = [];
    (function walk(nodes) {
      nodes.forEach(function (n) { flat.push(n); walk(n.children); });
    })(tree);

    var body = flat.length
      ? '<div class="ath-tree">' + flat.map(function (n) { return topicNode(n, s); }).join('') + '</div>'
      : '<div class="ath-empty"><b>The map is empty</b>' +
        'Start with three or four overarching topics, then break each one down. Depth comes later — breadth first.' +
        '<div style="margin-top:var(--sp-5)"><button class="ath-btn ath-btn-primary" type="button" data-act="add-topic">Add the first topic</button></div></div>';

    host.innerHTML = sechead(
      'The skill tree',
      'Subject Map',
      'Every overarching topic in this field, and the sub-topics beneath it. A topic records what you are aiming for and what you actually know — the gap between the two is the whole point.',
      '<button class="ath-btn ath-btn-primary" type="button" data-act="add-topic">Add topic</button>'
    ) + body;
  }

  function topicNode(n, s) {
    var d = D();
    var t = n.topic;
    var cur = d.masteryLabel(t.currentKnowledge);
    var tgt = d.masteryLabel(t.masteryTarget);
    var gap = Math.max(0, t.masteryTarget - t.currentKnowledge);
    var curricula = (t.curriculumIds || []).map(function (id) {
      var c = d.Curricula.get(id); return c ? c.title : null;
    }).filter(Boolean);
    var concepts = d.conceptsForTopic(t.id).length;

    return '<div class="ath-node d' + Math.min(n.depth, 3) + '">' +
      '<div class="ath-node-top">' +
        '<p class="ath-node-title">' + esc(t.title || 'Untitled topic') + '</p>' +
        '<span class="ath-tag' + (t.importance === 'core' ? ' t-brass' : t.importance === 'optional' ? ' t-mute' : '') + '">' +
          esc(d.labelFrom(d.IMPORTANCE, t.importance, 'Medium')) + '</span>' +
        '<span class="ath-tag' + (t.status === 'teaching' ? ' t-verd' : t.status === 'revisit' ? ' t-bad' : '') + '">' +
          esc(d.labelFrom(d.TOPIC_STATUSES, t.status, 'Unexplored')) + '</span>' +
        '<span class="ath-node-acts">' +
          '<button class="ath-btn ath-btn-sm" type="button" data-act="add-child" data-id="' + esc(t.id) + '">＋ Sub-topic</button>' +
          '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-topic" data-id="' + esc(t.id) + '">Edit</button>' +
          '<button class="ath-btn ath-btn-sm ath-btn-danger" type="button" data-act="del-topic" data-id="' + esc(t.id) + '">Delete</button>' +
        '</span>' +
      '</div>' +
      (t.note ? '<p class="ath-inbox-note">' + esc(t.note) + '</p>' : '') +
      '<div class="ath-node-grid">' +
        '<div class="ath-node-cell"><span>Knowledge → target</span>' +
          '<div class="ath-node-ladder">' + esc(cur) + ' <em>→</em> ' + esc(tgt) +
            (gap ? ' <em>(' + gap + ' rung' + (gap === 1 ? '' : 's') + ' to go)</em>' : ' <em>· reached</em>') +
          '</div>' + meter(d.masteryPct(t.currentKnowledge)) +
        '</div>' +
        '<div class="ath-node-cell"><span>Curricula</span><strong>' +
          (curricula.length ? esc(curricula.join(', ')) : '<em style="color:var(--ath-text-4);font-style:italic">None linked</em>') + '</strong></div>' +
        '<div class="ath-node-cell"><span>Concepts</span><strong>' + concepts + '</strong></div>' +
      '</div>' +
    '</div>';
  }

  // ============================================================
  // §RESEARCH — the Deep Research Bar.
  // ============================================================
  function renderResearch(host, s) {
    var d = D();
    var items = d.inboxFor(s.id);
    var lenses = d.lensesFor(s.id);

    host.innerHTML = sechead(
      'The deep research bar',
      'Learning Inbox',
      'Anything that deserves investigation goes in here first — a claim, a theory, a question, a person, a book. Nothing is lost and nothing has to be filed at the moment it occurs to you.'
    ) +
    '<div class="ath-research">' +
      '<div>' +
        '<div class="ath-capture">' +
          '<textarea id="athCapture" placeholder="What deserves a second look?" rows="3"></textarea>' +
          '<div class="ath-capture-foot">' +
            '<div class="ath-chip-row">' +
              d.INBOX_KINDS.map(function (k) {
                return '<button class="ath-chip' + (S.captureKind === k.id ? ' is-on' : '') + '" type="button" data-kind="' + k.id + '">' + esc(k.label) + '</button>';
              }).join('') +
            '</div>' +
            '<button class="ath-btn ath-btn-primary" type="button" data-act="capture">Capture</button>' +
          '</div>' +
        '</div>' +
        (items.length
          ? items.map(function (i) { return inboxItem(i); }).join('')
          : '<div class="ath-empty"><b>Nothing captured yet</b>The inbox is where a passing thought stops being a passing thought.</div>') +
      '</div>' +

      '<aside class="ath-lens">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)">' +
          '<h3 class="ath-h3">Research Lens</h3>' +
          '<button class="ath-btn ath-btn-sm" type="button" data-act="add-lens">＋</button>' +
        '</div>' +
        '<p class="ath-field-hint" style="margin-bottom:var(--sp-3)">Standing questions, kept visible. Click one to capture an answer against it.</p>' +
        lenses.map(function (l) {
          return '<button class="ath-lens-item" type="button" data-lens="' + esc(l.id) + '">' + esc(l.question) +
            (l.note ? '<small>' + esc(l.note) + '</small>' : '') + '</button>';
        }).join('') +
      '</aside>' +
    '</div>';

    var ta = $('athCapture');
    if (ta) ta.focus();
  }

  function inboxItem(i) {
    var d = D();
    var lens = i.lensId ? d.Lenses.get(i.lensId) : null;
    var done = i.status === 'resolved' || i.status === 'archived';
    return '<div class="ath-inbox-item' + (done ? ' is-done' : '') + '">' +
      '<div class="ath-inbox-head">' +
        '<span class="ath-tag t-brass">' + esc(d.labelFrom(d.INBOX_KINDS, i.kind, 'Question')) + '</span>' +
        '<span class="ath-tag' + (i.status === 'investigating' ? ' t-verd' : ' t-mute') + '">' + esc(d.labelFrom(d.INBOX_STATUSES, i.status, 'Unexamined')) + '</span>' +
        '<time>' + esc(d.fmtAgo(i.createdAt)) + '</time>' +
      '</div>' +
      '<p class="ath-inbox-text">' + esc(i.text) + '</p>' +
      (lens ? '<p class="ath-inbox-note"><em style="color:var(--ath-brass)">Through the lens:</em> ' + esc(lens.question) + '</p>' : '') +
      (i.note ? '<p class="ath-inbox-note">' + esc(i.note) + '</p>' : '') +
      '<div class="ath-inbox-acts">' +
        (i.status === 'new' ? '<button class="ath-btn ath-btn-sm" type="button" data-act="inv" data-id="' + esc(i.id) + '">Start investigating</button>' : '') +
        (done ? '' : '<button class="ath-btn ath-btn-sm" type="button" data-act="promote" data-id="' + esc(i.id) + '">Keep as concept</button>') +
        '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-inbox" data-id="' + esc(i.id) + '">Edit</button>' +
        (done ? '' : '<button class="ath-btn ath-btn-sm" type="button" data-act="archive" data-id="' + esc(i.id) + '">Archive</button>') +
        '<button class="ath-btn ath-btn-sm ath-btn-danger" type="button" data-act="del-inbox" data-id="' + esc(i.id) + '">Delete</button>' +
      '</div>' +
    '</div>';
  }

  // ============================================================
  // §CURRICULA — a field is permanent, its curricula are not. Three
  // columns matching that lifecycle.
  // ============================================================
  function renderCurricula(host, s) {
    var d = D();
    var all = d.curriculaFor(s.id);
    var groups = [
      { key: 'completed', label: 'Completed', match: function (c) { return c.status === 'completed'; } },
      { key: 'current', label: 'Current', match: function (c) { return c.status === 'current'; } },
      { key: 'future', label: 'Future', match: function (c) { return c.status === 'future' || c.status === 'next' || c.status === 'backburner'; } }
    ];

    host.innerHTML = sechead(
      'Field → curricula → modules → lessons',
      'Curricula',
      'Curricula live inside their field, never beside it. One runs at a time; the rest wait in Future until they are picked up.',
      '<button class="ath-btn ath-btn-primary" type="button" data-act="add-curriculum">New curriculum</button>'
    ) +
    (all.length
      ? '<div class="ath-cols">' + groups.map(function (g) {
          var list = all.filter(g.match);
          return '<div class="ath-col">' +
            '<h4>' + esc(g.label) + '<span>' + list.length + '</span></h4>' +
            (list.length ? list.map(curriculumItem).join('')
              : '<p class="ath-field-hint" style="padding:var(--sp-4) 0">Nothing here.</p>') +
          '</div>';
        }).join('') + '</div>'
      : '<div class="ath-empty"><b>No curricula yet</b>' +
        'A curriculum is a bounded run at part of this field — with an end date, a scope, and things you deliberately leave out.' +
        '<div style="margin-top:var(--sp-5)"><button class="ath-btn ath-btn-primary" type="button" data-act="add-curriculum">Create the first one</button></div></div>');
  }

  function curriculumItem(c) {
    var d = D();
    var pct = d.curriculumProgress(c.id);
    return '<a class="ath-item" href="athenaeum-curriculum.html?id=' + encodeURIComponent(c.id) + '">' +
      '<p class="ath-item-t">' + esc(c.title || 'Untitled curriculum') + '</p>' +
      (c.why ? '<p class="ath-item-why">' + esc(c.why) + '</p>' : '') +
      '<div class="ath-item-m">' +
        '<span class="ath-tag' + (c.status === 'current' ? ' t-verd' : c.status === 'completed' ? ' t-mute' : '') + '">' +
          esc(d.labelFrom(d.CURRICULUM_STATUSES, c.status, 'Future')) + '</span>' +
        (c.weeklyHours ? '<span>' + esc(c.weeklyHours) + ' h/week</span>' : '') +
        (c.endDate ? '<span>ends ' + esc(d.fmtDateShort(c.endDate)) + '</span>' : '') +
      '</div>' +
      (c.status === 'current' || pct ? meter(pct) : '') +
    '</a>';
  }

  // ============================================================
  // §RESOURCES — one universal database, filtered to this field.
  // ============================================================
  function renderResources(host, s) {
    var d = D();
    var all = d.resourcesFor(s.id);

    host.innerHTML = sechead(
      'Filtered from the universal library',
      'Resources',
      'Every resource in this field, sorted by how it earns its place. Rejected resources are kept on purpose — so a decision already made is not made twice.',
      '<button class="ath-btn ath-btn-primary" type="button" data-act="add-resource">Add resource</button>'
    ) +
    (all.length
      ? d.RESOURCE_BUCKETS.map(function (b) {
          var list = all.filter(function (r) { return r.bucket === b.id; });
          if (!list.length) return '';
          return '<div class="ath-bucket">' +
            '<div class="ath-bucket-head"><h3 class="ath-h3">' + esc(b.label) + '</h3>' +
              '<p>' + esc(b.blurb) + '</p></div>' +
            '<div class="ath-reslist">' + list.map(resourceRow).join('') + '</div>' +
          '</div>';
        }).join('')
      : '<div class="ath-empty"><b>No resources yet</b>' +
        'The library is universal — a resource added here shows up in the global list too, but you only ever see this field\'s from inside this field.' +
        '<div style="margin-top:var(--sp-5)"><button class="ath-btn ath-btn-primary" type="button" data-act="add-resource">Add the first one</button></div></div>');
  }

  function resourceRow(r) {
    var d = D();
    return '<div class="ath-res">' +
      '<div class="ath-res-t"><a href="athenaeum-resource.html?id=' + encodeURIComponent(r.id) + '">' + esc(r.title || 'Untitled') + '</a>' +
        '<em>' + esc(r.type) + (r.author ? ' · ' + esc(r.author) : '') + '</em></div>' +

  // ============================================================
  // §KNOWLEDGE — the field's permanent concepts. This is what is left
  // once a curriculum ends, so it lives on the FIELD and never on a
  // curriculum. See the header note in athenaeum-data.js.
  // ============================================================
  function renderKnowledge(host, s) {
    var d = D();
    var all = d.conceptsFor(s.id);
    var topics = d.topicsFor(s.id);
    var q = S.conceptQuery.trim().toLowerCase();

    var shown = all.filter(function (c) {
      if (S.conceptTopic && c.topicId !== S.conceptTopic) return false;
      if (!q) return true;
      return (c.name + ' ' + c.definition + ' ' + c.simple + ' ' + c.interpretation).toLowerCase().indexOf(q) >= 0;
    });

    host.innerHTML = sechead(
      'What survives the curriculum',
      'Knowledge Base',
      'Every concept you have actually kept from this field. A curriculum ends; these do not.',
      '<button class="ath-btn ath-btn-primary" type="button" data-act="add-concept">Add concept</button>'
    ) +
    (all.length ? '<div class="ath-toolbar">' +
      '<input class="ath-search" id="athConceptQ" type="search" placeholder="Search concepts…" value="' + esc(S.conceptQuery) + '">' +
      '<div class="ath-chip-row">' +
        '<button class="ath-chip' + (S.conceptTopic ? '' : ' is-on') + '" type="button" data-ctopic="">All topics</button>' +
        topics.filter(function (t) { return d.conceptsForTopic(t.id).length; }).map(function (t) {
          return '<button class="ath-chip' + (S.conceptTopic === t.id ? ' is-on' : '') + '" type="button" data-ctopic="' + esc(t.id) + '">' + esc(t.title) + '</button>';
        }).join('') +
      '</div></div>' : '') +
    (shown.length
      ? '<div class="ath-cgrid">' + shown.map(conceptCard).join('') + '</div>'
      : all.length
        ? '<div class="ath-empty"><b>Nothing matches</b>No concept in this field matches that filter.</div>'
        : '<div class="ath-empty"><b>No concepts yet</b>' +
          'A concept earns a place here once you can define it in your own words and say how confident you are. Captures in the Deep Research Bar can be promoted straight into this list.' +
          '<div style="margin-top:var(--sp-5);display:flex;gap:var(--sp-2);justify-content:center;flex-wrap:wrap">' +
            '<button class="ath-btn ath-btn-primary" type="button" data-act="add-concept">Add the first concept</button>' +
            '<a class="ath-btn" href="#/research">Go to the research bar</a>' +
          '</div></div>');
  }

  function conceptCard(c) {
    var d = D();
    var topic = c.topicId ? d.Topics.get(c.topicId) : null;
    return '<a class="ath-concept" href="#/knowledge/' + encodeURIComponent(c.id) + '" style="--conf:' + c.confidence + '">' +
      '<h4>' + esc(c.name || 'Untitled concept') + '</h4>' +
      '<p>' + esc(c.simple || c.definition || 'No explanation written yet.') + '</p>' +
      '<div class="ath-concept-foot">' +
        (topic ? '<span class="ath-tag">' + esc(topic.title) + '</span>' : '') +
        '<span class="ath-tag' + (c.mastery >= 5 ? ' t-verd' : '') + '">' + esc(d.masteryLabel(c.mastery)) + '</span>' +
        '<span class="ath-conf" title="Confidence ' + c.confidence + ' of 5" style="margin-left:auto">' +
          [1, 2, 3, 4, 5].map(function (n) { return '<i class="' + (n <= c.confidence ? 'on' : '') + '"></i>'; }).join('') +
        '</span>' +
      '</div>' +
    '</a>';
  }

  /* A concept's own page. Reached at #/knowledge/<id>, so Back returns to
     the grid rather than leaving the hub. */
  function renderConcept(host, s) {
    var d = D();
    var c = d.Concepts.get(S.detailId);
    if (!c || c.subjectId !== s.id) {
      host.innerHTML = '<div class="ath-empty"><b>Concept not found</b>It may have been deleted.' +
        '<div style="margin-top:var(--sp-5)"><a class="ath-btn" href="#/knowledge">Back to the Knowledge Base</a></div></div>';
      return;
    }
    var topic = c.topicId ? d.Topics.get(c.topicId) : null;
    var related = (c.relatedIds || []).map(function (id) { return d.Concepts.get(id); }).filter(Boolean);
    // Concepts that point AT this one are shown too, so a one-way link is
    // still visible from both ends.
    var backlinks = d.conceptsFor(s.id).filter(function (o) {
      return o.id !== c.id && (o.relatedIds || []).indexOf(c.id) >= 0 && related.indexOf(o) < 0;
    });

    host.innerHTML =
      '<div class="ath-detail">' +
        '<div style="margin-bottom:var(--sp-4)"><a class="ath-home" href="#/knowledge">← Knowledge Base</a></div>' +
        '<div class="ath-detail-head">' +
          '<p class="ath-eyebrow">' + esc(topic ? topic.title : 'Unfiled concept') + '</p>' +
          '<h2>' + esc(c.name || 'Untitled concept') + '</h2>' +
          '<div class="ath-chip-row" style="margin-top:var(--sp-4)">' +
            '<span class="ath-tag' + (c.mastery >= 5 ? ' t-verd' : '') + '">' + esc(d.masteryLabel(c.mastery)) + '</span>' +
            '<span class="ath-tag t-brass">Confidence ' + c.confidence + '/5</span>' +
            '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-concept" data-id="' + esc(c.id) + '">Edit</button>' +
            '<button class="ath-btn ath-btn-sm" type="button" data-act="link-concept" data-id="' + esc(c.id) + '">Link concepts</button>' +
            '<button class="ath-btn ath-btn-sm ath-btn-danger" type="button" data-act="del-concept" data-id="' + esc(c.id) + '">Delete</button>' +
          '</div>' +
        '</div>' +
        block('Definition', c.definition) +
        block('In plain words', c.simple) +
        block('Technically', c.technical) +
        block('Examples', c.examples) +
        block('Evidence', c.evidence) +
        block('Criticism', c.criticism, 'is-crit') +
        block('My interpretation', c.interpretation, 'is-mine') +
        block('Sources', c.sources) +
        (related.length || backlinks.length
          ? '<div class="ath-block"><h4>Related concepts</h4><div class="ath-related">' +
            related.map(function (r) { return '<a href="#/knowledge/' + encodeURIComponent(r.id) + '">' + esc(r.name) + '</a>'; }).join('') +
            backlinks.map(function (r) { return '<a href="#/knowledge/' + encodeURIComponent(r.id) + '" title="Links here">← ' + esc(r.name) + '</a>'; }).join('') +
            '</div></div>'
          : '') +
      '</div>';
  }

  function block(label, value, cls) {
    return '<div class="ath-block' + (cls ? ' ' + cls : '') + '"><h4>' + esc(label) + '</h4>' +
      (value ? '<p class="ath-prose">' + esc(value).replace(/\n/g, '<br>') + '</p>'
             : '<p class="ath-prose is-unset">Not written yet.</p>') + '</div>';
