  // ============================================================
  // §CONNECTIONS — internal (inside this field) and cross-field.
  //
  // Both diagrams are hand-rolled SVG. There is no graph library in this
  // repo and adding one for two figures would not pay for itself.
  // ============================================================
  function renderConnections(host, s) {
    var d = D();
    var internal = d.internalConnections(s.id);
    var cross = d.crossConnections(s.id);

    host.innerHTML = sechead(
      'Where the ideas touch',
      'Connections',
      'Inside this field first, then out to the others. This is the part that makes eleven folders into one system.',
      '<div class="ath-chip-row">' +
        '<button class="ath-btn ath-btn-sm" type="button" data-act="add-internal">Link two ideas</button>' +
        '<button class="ath-btn ath-btn-primary ath-btn-sm" type="button" data-act="add-cross">Link a field</button>' +
      '</div>'
    ) +
    '<h3 class="ath-h3" style="margin-bottom:var(--sp-3)">Internal</h3>' +
    (internal.length
      ? chordViz(internal, s) + internal.map(function (c) { return linkRow(c, s); }).join('')
      : '<div class="ath-empty"><b>No internal links yet</b>' +
        'Chains are what you are after — Memory → Emotion → Trauma → Decision making. Link two topics or concepts to start one.</div>') +

    '<h3 class="ath-h3" style="margin:var(--sp-7) 0 var(--sp-3)">Cross-field</h3>' +
    (cross.length
      ? spokeViz(cross, s) + cross.map(function (c) { return linkRow(c, s); }).join('')
      : '<div class="ath-empty"><b>No cross-field links yet</b>' +
        'Psychology ↔ Entrepreneurship, History ↔ Strategy. A link drawn from either end shows up in both fields.</div>');
  }

  // Resolve either end of a link to a readable name, whatever its type.
  function endName(type, id) {
    var d = D();
    var rec = type === 'subject' ? d.subjectById(id) : type === 'concept' ? d.Concepts.get(id) : d.Topics.get(id);
    if (!rec) return '(deleted)';
    return rec.name || rec.title || '(untitled)';
  }
  function endHref(type, id, subjectId) {
    if (type === 'subject') return 'athenaeum-subject.html?id=' + encodeURIComponent(id) + '#/connections';
    if (type === 'concept') return '#/knowledge/' + encodeURIComponent(id);
    return '#/map';
  }

  function linkRow(c, s) {
    var d = D();
    // A cross-field link is stored once, on the field it was drawn from.
    // Read from the far side, the ends have to be swapped so it still
    // reads outward from the field you are standing in.
    var mine = c.subjectId === s.id;
    var fromT = mine ? c.fromType : 'subject', fromI = mine ? c.fromId : c.toId;
    var toT = mine ? c.toType : 'subject', toI = mine ? c.toId : c.subjectId;
    if (c.kind === 'cross' && !mine) { fromT = 'subject'; fromI = s.id; toT = 'subject'; toI = c.subjectId; }

    return '<div class="ath-link">' +
      '<span class="ath-link-chain">' +
        '<a href="' + endHref(fromT, fromI, s.id) + '">' + esc(endName(fromT, fromI)) + '</a>' +
        '<em>' + (c.label ? '→ ' + esc(c.label) + ' →' : '→') + '</em>' +
        '<a href="' + endHref(toT, toI, s.id) + '">' + esc(endName(toT, toI)) + '</a>' +
      '</span>' +
      (mine
        ? '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-link" data-id="' + esc(c.id) + '">Edit</button>' +
          '<button class="ath-btn ath-btn-sm ath-btn-danger" type="button" data-act="del-link" data-id="' + esc(c.id) + '">✕</button>'
        : '<span class="ath-tag t-mute" title="Drawn from ' + esc(d.subjectName(c.subjectId)) + '">from ' + esc(d.subjectName(c.subjectId)) + '</span>') +
      (c.note ? '<p class="ath-link-note">' + esc(c.note) + '</p>' : '') +
    '</div>';
  }

  /* Chord circle: every node that takes part in an internal link, placed
     on a circle, with quadratic curves bending through the centre. */
  function chordViz(links, s) {
    var ids = [], seen = {};
    links.forEach(function (c) {
      [[c.fromType, c.fromId], [c.toType, c.toId]].forEach(function (p) {
        var k = p[0] + ':' + p[1];
        if (!seen[k]) { seen[k] = 1; ids.push({ type: p[0], id: p[1], key: k }); }
      });
    });
    if (ids.length < 2) return '';

    // The canvas follows the node count. A fixed height turns three nodes
    // into a mostly-empty box.
    var W = 720, H = ids.length <= 4 ? 300 : ids.length <= 8 ? 400 : 480;
    var cx = W / 2, cy = H / 2, r = Math.min(cx, cy) - 68;
    var pos = {};
    ids.forEach(function (n, i) {
      var a = (i / ids.length) * Math.PI * 2 - Math.PI / 2;
      pos[n.key] = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, a: a };
    });

    var edges = links.map(function (c) {
      var p1 = pos[c.fromType + ':' + c.fromId], p2 = pos[c.toType + ':' + c.toId];
      if (!p1 || !p2) return '';
      // Bend toward the centre so parallel chords stay distinguishable.
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var qx = mx + (cx - mx) * 0.55, qy = my + (cy - my) * 0.55;
      return '<path class="edge" d="M' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
        ' Q' + qx.toFixed(1) + ',' + qy.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1) + '"/>';
    }).join('');

    var nodes = ids.map(function (n) {
      var p = pos[n.key];
      var right = Math.cos(p.a) > -0.15;
      var label = endName(n.type, n.id);
      if (label.length > 26) label = label.slice(0, 25) + '…';
      return '<g class="node"><circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5"/>' +
        '<text x="' + (p.x + (right ? 11 : -11)).toFixed(1) + '" y="' + (p.y + 3.5).toFixed(1) + '" ' +
        'text-anchor="' + (right ? 'start' : 'end') + '">' + esc(label) + '</text></g>';
    }).join('');

    return '<div class="ath-viz"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Diagram of ' + links.length + ' links between ' + ids.length + ' ideas in this field">' +
      edges + nodes + '</svg></div>';
  }

  /* Hub and spoke: this field at the centre, every field it touches on a
     ring around it. */
  function spokeViz(links, s) {
    var d = D();
    var others = [], seen = {};
    links.forEach(function (c) {
      var id = d.otherEndOf(c, s.id);
      if (id && id !== s.id && !seen[id]) { seen[id] = 1; others.push(id); }
    });
    if (!others.length) return '';

    var W = 720, H = others.length <= 2 ? 240 : others.length <= 5 ? 340 : 420;
    var cx = W / 2, cy = H / 2, r = Math.min(cx, cy) - 62;
    var edges = '', nodes = '';
    others.forEach(function (id, i) {
      var a = (i / others.length) * Math.PI * 2 - Math.PI / 2;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      edges += '<path class="edge is-cross" d="M' + cx + ',' + cy + ' L' + x.toFixed(1) + ',' + y.toFixed(1) + '"/>';
      var right = Math.cos(a) > -0.15;
      var label = d.subjectName(id);
      if (label.length > 24) label = label.slice(0, 23) + '…';
      nodes += '<g class="node"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6"/>' +
        '<text x="' + (x + (right ? 12 : -12)).toFixed(1) + '" y="' + (y + 3.5).toFixed(1) + '" ' +
        'text-anchor="' + (right ? 'start' : 'end') + '">' + esc(label) + '</text></g>';
    });
    var hubLabel = s.name.length > 26 ? s.name.slice(0, 25) + '…' : s.name;
    nodes += '<g class="node is-hub"><circle cx="' + cx + '" cy="' + cy + '" r="9"/>' +
      '<text x="' + cx + '" y="' + (cy + 26) + '" text-anchor="middle">' + esc(hubLabel) + '</text></g>';

    return '<div class="ath-viz"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="' + esc(s.name) + ' connected to ' + others.length + ' other fields">' +
      edges + nodes + '</svg></div>';
  }

  // ============================================================
  // §CONTRADICTIONS — the Contradiction Lab.
  // ============================================================
  function renderContradictions(host, s) {
    var d = D();
    var all = d.contradictionsFor(s.id);
    var open = all.filter(function (c) { return !c.resolved; });
    var closed = all.filter(function (c) { return c.resolved; });

    host.innerHTML = sechead(
      'Two things that cannot both be fully true',
      'Contradiction Lab',
      'Hold both theories side by side with the evidence for each until you can say where each one is right. Resolving one means taking a position, not picking a winner.',
      '<button class="ath-btn ath-btn-primary" type="button" data-act="add-cx">New contradiction</button>'
    ) +
    (all.length
      ? (open.length
          ? '<h3 class="ath-h3" style="margin-bottom:var(--sp-3)">Unresolved <span class="ath-tag t-bad">' + open.length + '</span></h3>' +
            open.map(contradictionCard).join('')
          : '') +
        (closed.length
          ? '<h3 class="ath-h3" style="margin:var(--sp-7) 0 var(--sp-3)">Settled for now <span class="ath-tag">' + closed.length + '</span></h3>' +
            closed.map(contradictionCard).join('')
          : '')
      : '<div class="ath-empty"><b>No contradictions logged</b>' +
        'When two credible sources in this field disagree, put them here rather than quietly siding with whichever you read last.' +
        '<div style="margin-top:var(--sp-5)"><button class="ath-btn ath-btn-primary" type="button" data-act="add-cx">Log the first one</button></div></div>');
  }

  function contradictionCard(c) {
    return '<div class="ath-cx' + (c.resolved ? ' is-resolved' : '') + '">' +
      '<div class="ath-cx-head">' +
        '<h4>' + esc(c.title || 'Untitled contradiction') + '</h4>' +
        '<span class="ath-tag' + (c.resolved ? ' t-verd' : ' t-bad') + '">' + (c.resolved ? 'Settled' : 'Open') + '</span>' +
        '<span class="ath-conf" title="Confidence ' + c.confidence + ' of 5">' +
          [1, 2, 3, 4, 5].map(function (n) { return '<i class="' + (n <= c.confidence ? 'on' : '') + '"></i>'; }).join('') +
        '</span>' +
        '<button class="ath-btn ath-btn-sm" type="button" data-act="toggle-cx" data-id="' + esc(c.id) + '">' +
          (c.resolved ? 'Reopen' : 'Mark settled') + '</button>' +
        '<button class="ath-btn ath-btn-sm" type="button" data-act="edit-cx" data-id="' + esc(c.id) + '">Edit</button>' +
        '<button class="ath-btn ath-btn-sm ath-btn-danger" type="button" data-act="del-cx" data-id="' + esc(c.id) + '">✕</button>' +
      '</div>' +
      '<div class="ath-cx-body">' +
        '<div class="ath-cx-side a"><h5>Theory A</h5>' +
          '<p class="theory">' + esc(c.theoryA || 'Not stated.') + '</p>' +
          '<h5>Evidence for A</h5><p class="ev">' + (c.evidenceA ? esc(c.evidenceA).replace(/\n/g, '<br>') : '—') + '</p>' +
        '</div>' +
        '<div class="ath-cx-side b"><h5>Theory B</h5>' +
          '<p class="theory">' + esc(c.theoryB || 'Not stated.') + '</p>' +
          '<h5>Evidence for B</h5><p class="ev">' + (c.evidenceB ? esc(c.evidenceB).replace(/\n/g, '<br>') : '—') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="ath-cx-foot">' +
        block('Assumptions each one makes', c.assumptions) +
        block('Methodological differences', c.methodology) +
        block('Where each may be correct', c.whereEachCorrect) +
        '<div class="ath-cx-verdict"><h4 class="ath-micro">My current interpretation</h4>' +
          (c.interpretation
            ? '<p class="ath-prose" style="margin:7px 0 0">' + esc(c.interpretation).replace(/\n/g, '<br>') + '</p>'
            : '<p class="ath-prose" style="margin:7px 0 0;color:var(--ath-text-4);font-style:italic">No position taken yet — this is the field that matters most.</p>') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* §EXPERIMENTS — the same records the global Experiment Lab shows, just

  function renderSoon(host, s) {

  // ============================================================
  // §MODAL
  // ============================================================
  var modalCtx = null;
  var modalDraft = null;
  function fText(label, key, val, ph) {
    return '<div class="ath-field"><label class="ath-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<input class="ath-input" id="f_' + key + '" data-f="' + key + '" value="' + esc(val == null ? '' : val) + '" placeholder="' + esc(ph || '') + '"></div>';
  }
  function fArea(label, key, val, ph, rows) {
    return '<div class="ath-field"><label class="ath-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<textarea class="ath-textarea" id="f_' + key + '" data-f="' + key + '" rows="' + (rows || 4) + '" placeholder="' + esc(ph || '') + '">' + esc(val || '') + '</textarea></div>';
  }
  function fSelect(label, key, val, opts) {
    return '<div class="ath-field"><label class="ath-field-label" for="f_' + key + '">' + esc(label) + '</label>' +
      '<select class="ath-select" id="f_' + key + '" data-f="' + key + '">' +
      opts.map(function (o) {

  function openModal(cfg) {
    modalCtx = cfg;
    var m = $('athModal');
    m.classList.toggle('is-wide', !!cfg.wide);
    m.innerHTML =
      '<div class="ath-modal-head"><h3 class="ath-h3">' + esc(cfg.title) + '</h3>' +
        '<button class="ath-btn ath-btn-icon" type="button" data-close aria-label="Close">✕</button></div>' +
      '<div class="ath-modal-body">' + cfg.body + '</div>' +
      '<div class="ath-modal-foot">' +
        '<button class="ath-btn" type="button" data-close>Cancel</button>' +
        '<button class="ath-btn ath-btn-primary" type="button" data-save>' + esc(cfg.saveLabel || 'Save') + '</button>' +
      '</div>';
    $('athModalBg').classList.add('show');
    // Autosave. Everything in this dialog lives only in the DOM until Save
    // is pressed, so a refresh here used to take the whole form with it.
    // The fingerprint keeps two records that share a title apart.
    modalDraft = window.AthDraft ? AthDraft.bind(
      'modal:subject:' + (cfg.title || '') + ':' + AthDraft.fingerprint(m), m,
      { onRestore: function (when) { toast('Put back what you had typed ' + when); } }
    ) : null;
    var first = m.querySelector('[data-f]');
    if (first) setTimeout(function () { first.focus(); }, 40);
  }
  /* Cancel, Escape and the backdrop are a DECISION to throw the form away,
     so the draft goes with it. A refresh is not a decision, and its draft
     has to survive — which is why only the explicit paths pass true. */
  function closeModal(discard) {
    $('athModalBg').classList.remove('show');
    if (modalDraft) { if (discard) modalDraft.clear(); else modalDraft.save(); }
    modalDraft = null;
    modalCtx = null;
  }
  function modalValues() {
    var out = {};
    $('athModal').querySelectorAll('[data-f]').forEach(function (n) { out[n.getAttribute('data-f')] = n.value; });
    return out;
  }

  /* An internal link joins two things INSIDE this field — a topic or a
     concept at each end. */
  function openInternalLinkModal(link) {
    var d = D(), s = subject();
    var c = link || {};
    var ends = d.topicsFor(s.id).map(function (t) { return { id: 'topic:' + t.id, label: 'Topic · ' + (t.title || 'Untitled') }; })
      .concat(d.conceptsFor(s.id).map(function (x) { return { id: 'concept:' + x.id, label: 'Concept · ' + (x.name || 'Untitled') }; }));
    if (ends.length < 2) {
      toast('Add at least two topics or concepts in this field first', true);
      return;
    }
    openModal({
      title: link ? 'Edit link' : 'Link two ideas',
      body:
        fSelect('From', 'from', c.fromId ? c.fromType + ':' + c.fromId : ends[0].id, ends) +
        fText('Relationship', 'label', c.label, 'leads to · explains · constrains') +
        fSelect('To', 'to', c.toId ? c.toType + ':' + c.toId : ends[1].id, ends) +
        fArea('Note', 'note', c.note, 'Why this link is real and not just adjacent.', 2),
      onSave: function (v) {
        var a = String(v.from).split(':'), b = String(v.to).split(':');
        if (a[1] === b[1]) { toast('An idea cannot link to itself', true); return; }
        var patch = {
          kind: 'internal', subjectId: s.id,
          fromType: a[0], fromId: a[1], toType: b[0], toId: b[1],
          label: v.label, note: v.note
        };
        if (link) { d.Connections.update(link.id, patch); toast('Link updated'); }
        else { patch.order = d.nextOrder(d.connectionsFor(s.id)); d.Connections.add(patch); toast('Link drawn'); }
      }
    });
  }

  on('athPage', 'input', '#athConceptQ', function (e, t) {

    if (!grid) { refreshCurrentView(); return; }
    var d = D(), q = S.conceptQuery.trim().toLowerCase();
    var shown = d.conceptsFor(S.subjectId).filter(function (c) {
      if (S.conceptTopic && c.topicId !== S.conceptTopic) return false;

    refreshCurrentView();
  });

  on('athPage', 'click', '[data-kind]', function (e, t) {
    S.captureKind = t.getAttribute('data-kind');
    // Repaint the chip row alone: a full render would wipe what is
    // already typed into the capture box.
    t.parentNode.querySelectorAll('[data-kind]').forEach(function (n) {
      n.classList.toggle('is-on', n === t);
    });
  });
  on('athPage', 'click', '[data-act="capture"]', function () {
    var ta = $('athCapture');
    if (!ta || !ta.value.trim()) { toast('Nothing to capture', true); return; }
    D().Inbox.add({ subjectId: S.subjectId, text: ta.value.trim(), kind: S.captureKind });
    ta.value = '';
    toast('Captured');
    refreshCurrentView();
  });
  on('athPage', 'click', '[data-lens]', function (e, t) { openLensCapture(t.getAttribute('data-lens')); });
  on('athPage', 'click', '[data-act="add-lens"]', function () { openLensModal(); });
  on('athPage', 'click', '[data-act="inv"]', function (e, t) {
    D().Inbox.update(t.getAttribute('data-id'), { status: 'investigating' });
    refreshCurrentView();
  });
  on('athPage', 'click', '[data-act="archive"]', function (e, t) {
    D().Inbox.update(t.getAttribute('data-id'), { status: 'archived' });
    toast('Archived');
    refreshCurrentView();
  });
  on('athPage', 'click', '[data-act="promote"]', function (e, t) {
    var c = D().promoteInboxToConcept(t.getAttribute('data-id'));
    toast(c ? 'Kept as a concept in this field' : 'Could not promote that', !c);
    refreshCurrentView();
  });
  on('athPage', 'click', '[data-act="edit-inbox"]', function (e, t) { openInboxModal(D().Inbox.get(t.getAttribute('data-id'))); });
  on('athPage', 'click', '[data-act="del-inbox"]', function (e, t) {
    if (!confirm('Delete this capture?')) return;
    D().Inbox.remove(t.getAttribute('data-id'));
    toast('Deleted');
    refreshCurrentView();
  });

  on('athModalBg', 'click', '[data-close]', function () { closeModal(true); });
  on('athModalBg', 'click', '[data-save]', function () {
    if (!modalCtx || !modalCtx.onSave) { closeModal(true); return; }
    var cb = modalCtx.onSave, v = modalValues();
    closeModal(true);
    runSafely(function () { cb(v); refreshCurrentView(); }, 'modal save');
  });
  $('athModalBg').addEventListener('click', function (e) { if (e.target === $('athModalBg')) closeModal(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('athModalBg').classList.contains('show')) closeModal(true);
  });

  // ============================================================
  // §BOOT
  // ============================================================
  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'athenaeum',
      syncedPrefixes: ['ath:'],
      onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
    });
  }

  window.addEventListener('hashchange', function () { runSafely(render, 'hashchange'); });

  function boot() {
    var d = D();
    if (!d) { console.error('[Athenaeum] athenaeum-data.js did not load'); return; }
    S.subjectId = readParam();
    render();
    d.maybeSeedAfterSyncAttempt(remoteRef, function () { refreshCurrentView(); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); });
    } else {
      runSafely(boot, 'boot');
    }
  });
})();
</script>
</body>
</html>
