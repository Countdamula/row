<script>
/* ── shelves ─────────────────────────────────────────────
   A TAB is not the same thing as a shelf. `reads` is the list of real
   storage shelves a tab shows, and it is usually one — but Horror shows
   creepypasta + trueHorror, and Spicy shows spicy + immersive, because
   those pairs are one subject each and were never worth two tabs.

   NOTHING WAS MERGED IN STORAGE. All four keys still exist, still hold
   exactly what they held, and the composer can still file to any of them
   by name. Only the tab strip changed.

   `kind:'view'` marks the four tabs that read ACROSS the shelves rather
   than being a place items live — Home, Discover, Favorites, Stats.

   `lines` is the hero headline, split where it should break; the reveal
   prints it word by word, one mask per line. */
const SHELVES = [
  { key:'home', label:'Home', sigil:'sg-home', tint:'#D9AC6A', verb:'Open', kind:'view',
    lines:['Everything','worth keeping'],
    note:'Ten shelves in one place. Paste a link into the bar above and it files itself.' },
  { key:'discover', label:'Discover', sigil:'sg-discover', tint:'#7E9A93', verb:'Open', kind:'view',
    lines:['Let the shelf','decide'],
    note:'Pick a shelf, set a floor for the rating, and roll. Nothing repeats until the pool runs dry.' },
  { key:'favorites', label:'Favorites', sigil:'sg-star', tint:'#E8D6B0', verb:'Open', kind:'view',
    lines:['The ones','you starred'],
    note:'Everything you starred, grouped by the shelf it came from.' },
  { key:'podcasts', label:'Podcasts', sigil:'sg-wave', tint:'#C2B79A', verb:'Listen',
    reads:['podcasts'],
    lines:['Voices for','the long drive'],
    note:'Series and one-offs worth the whole runtime — learning, photography, true crime, business, writing.' },
  { key:'horror', label:'Horror', sigil:'sg-eye', tint:'#A8794E', verb:'Watch',
    reads:['creepypasta','trueHorror'],
    lines:['Stories told','after dark'],
    note:'Creepypasta and the true-story compilations, together on one shelf.' },
  { key:'spicy', label:'Spicy', sigil:'sg-flame', tint:'#A65E5A', verb:'Listen',
    reads:['spicy','immersive'],
    lines:['Kept behind','the curtain'],
    note:'The spicy shelf and the immersive audio, together on one shelf.' },
  { key:'watch', label:'Watching', sigil:'sg-play', tint:'#B8853F', verb:'Watch',
    reads:['watch'],
    lines:['Whatever the','night asks for'],
    note:'Gaming, scary videos, vlogs, and the rest of the evening.' },
  { key:'playlists', label:'Music', sigil:'sg-moon', tint:'#9481A8', verb:'Play',
    reads:['playlists'],
    lines:['Sound you','return to'],
    note:'Playlists by genre — chill, fantasy, dark, electronic, binaural.' },
  { key:'reading', label:'Reading', sigil:'sg-book', tint:'#A08A6B', verb:'Read',
    reads:['reading'],
    lines:['Pages waiting','their turn'],
    note:'Books, series, and everything still to be read.' },
  { key:'anime', label:'Anime', sigil:'sg-spark', tint:'#A96A86', verb:'Watch',
    reads:['anime'],
    lines:['Worlds drawn','by hand'],
    note:'Watched, watching, and planned.' },
  { key:'games', label:'Games', sigil:'sg-pad', tint:'#6E8B84', verb:'Play',
    reads:['games'],
    lines:['Worlds that','wait for you'],
    note:'Played, playing, and the backlog you keep meaning to clear.' },
  { key:'stats', label:'Stats', sigil:'sg-bars', tint:'#7E9A93', verb:'Open', kind:'view',
    lines:['What the','shelves know'],
    note:'What the collection adds up to, read across every shelf.' }
];

/* The two tabs that used to be four. Old links, old bookmarks and the
   nav's own #hashes keep working. */
const TAB_ALIAS = { creepypasta:'horror', trueHorror:'horror', immersive:'spicy' };

/* Takes a tab key OR a storage-shelf key: the merged tabs mean cards are
    routinely handed 'creepypasta' or 'immersive', which are shelves and no
    longer tabs. Without the alias every such card fell back to SHELVES[0]
    and showed Home's verb. */
const shelfOf = k => SHELVES.find(s => s.key === (TAB_ALIAS[k] || k)) || SHELVES[0];
/* The real storage shelves behind a tab. A view reads none of its own. */
const readsOf = t => (typeof t === 'string' ? shelfOf(t) : t).reads || [];
/* Resolve anything that might be a tab key OR a retired shelf key. */
const tabKey = k => TAB_ALIAS[k] || k;

/* ── fake data ─────────────────────────────────────────── */
const yt   = id => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
const sq   = id => `https://picsum.photos/id/${id}/600/600`;
const wide = id => `https://picsum.photos/id/${id}/1200/600`;
const book = isbn => `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`;

let _id = 0;
const it = o => Object.assign({ id:'i'+(++_id), rating:0, fav:false, queued:false, tags:[], desc:'' }, o);

/* ── data ─────────────────────────────────────────────────
   Everything reads from vault-data.js at RENDER time, never at parse
   time: the IndexedDB shim hydrates asynchronously, so an array captured
   when this script first runs would be the pre-hydration snapshot. */

/* Row order per shelf, so categories land in a sequence Damian chose rather
   than alphabetically. Podcasts follows the old page; playlist genres follow
   the order he listed them in the original brief. Anything not named here
   sorts alphabetically after the named ones. */
const CAT_ORDER = [
  'Learning','Photography / Videography','True Crime','Business','Writing',
  /* Horror: creepypasta's own category first, then the true-story
     compilations — the order the two shelves read in. */
  'Creepypasta','Compilations',
  'Chill','Binaural Beats','Dark / Gothic / Horror / Romance','EDM / Electronic','Fantasy',
  /* Entertainment: the three groups from the live page first, then the two
     that exist only on items recovered from the older entertainment.html. */
  'Gaming','Scary Videos','Vlog-Like','Favorite Videos','Other',
  'Immersive Experience','ASMR',
];

/* Vault record → the shape card() already expects. Adapting here rather
   than changing card() keeps the mockup and this page from drifting. */
const toCard = v => ({
  id:v.id, _shelf:v._shelf, url:v.url, title:v.title, creator:v.creator,
  cover:v.cover, len:v.lengthText, rating:Number(v.rating) || 0,
  fav:v.favorite === true, queued:v.queued === true,
  tags:v.category ? [v.category] : [], desc:v.description || '',
  lastOpenedAt:v.lastOpenedAt || null, createdAt:v.createdAt || 0
});
const rawAll = () => Vault.SHELVES.flatMap(s => Vault.list(s).map(v => ({ ...v, _shelf:s })));
/* One storage shelf's records as cards. byCategory() walks the shelves a
   tab reads and does this itself; this stays for anything that wants a
   single named shelf. */
const shelfItems = shelf => Vault.list(shelf).map(v => toCard({ ...v, _shelf:shelf }));

/* Every category across every shelf a tab reads, in CAT_ORDER first and
   alphabetically after that. Each group remembers the shelf it came from,
   so the row's "+" files back to the right place on a merged tab.
   If one category name appears on BOTH of a tab's shelves, the first
   shelf to use it owns the "+" — the items themselves stay wherever they
   are, and nothing is moved. */
function byCategory(tab){
  const out = {};
  readsOf(tab).forEach(sh => {
    Vault.list(sh).forEach(v => {
      const c = v.category || 'Uncategorised';
      (out[c] ||= { shelf:sh, items:[] }).items.push(toCard({ ...v, _shelf:sh }));
    });
  });
  const rank = k => { const i = CAT_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return Object.fromEntries(Object.keys(out)
    .sort((a,b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(k => [k, out[k]]));
}

const CONTINUE = () => rawAll().filter(v => v.lastOpenedAt)
  .sort((a,b) => (b.lastOpenedAt||0) - (a.lastOpenedAt||0)).slice(0,8).map(toCard);
const TONIGHT  = () => rawAll().filter(v => v.queued).map(toCard);
const RECENT   = () => rawAll().sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0,8).map(toCard);
const COUNTS   = () => Vault.counts();

/* Three at random, reshuffled on every Reroll. */
function vaultPicks(k = 3){
  const all = rawAll();
  for(let i = all.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]] = [all[j],all[i]]; }
  return all.slice(0,k).map(toCard);
}

/* ── helpers ───────────────────────────────────────────── */
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
const sig = (id,sz=16,sw=1.15) => `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── border beam ────────────────────────────────────────
   Ported from the Motiq BorderBeamPanel. Two comets orbit the border; the
   angular VELOCITY is what's sprung (k=30, d=11) toward 240°/s on hover and
   back to 42°/s on leave, so a comet winds up and coasts rather than snapping
   between speeds.

   One rAF loop drives every beam on the page. The React original runs a loop
   per component, which is fine for one panel and wrong for the eighteen this
   page puts on screen at once. The loop stops entirely when nothing is live. */
/* `slow` is what runs under prefers-reduced-motion. The beam used to park
   dead still there, which is why the effect looked broken on phones — iOS
   Reduce Motion is on for a great many people, and it is exactly the kind of
   setting you enable once for the app-open zoom and then forget.
   12deg/s is a 30-second lap: a hairline of light drifting round a border,
   small-area and non-parallax, which is not the kind of motion the
   preference exists to suppress. The hover wind-up is still dropped there —
   that IS a sudden change, and it's the part worth removing. */
const BEAM = { idle:42, hover:240, k:30, d:11, slow:12 };
const beams = new Set();
const beamReduce = matchMedia('(prefers-reduced-motion: reduce)');
/* park the loop for anything scrolled off screen — an orbiting comet nobody
   can see is pure battery */
const beamIO = new IntersectionObserver(es => {
  es.forEach(e => { if(e.target._beam) e.target._beam.seen = e.isIntersecting });
  beamPump();
}, { threshold:.05 });

function paintBeam(b){ b.el.style.setProperty('--beam-a', ((b.a%360+360)%360).toFixed(2)+'deg'); }

function beam(node, opts={}){
  node.classList.add('beamed');
  if(opts.tint) node.style.setProperty('--beam-2', opts.tint);
  const glow = el('span','beam-glow'), ring = el('span','beam-ring');
  glow.setAttribute('aria-hidden','true'); ring.setAttribute('aria-hidden','true');
  node.prepend(ring); node.prepend(glow);

  /* phase off the index, never Math.random — two runs of the same screenshot
     have to match or the comparison rounds are meaningless */
  const rest = beamReduce.matches ? BEAM.slow : BEAM.idle;
  const b = { el:node, a:((opts.seed||1)*137.508)%360, sp:rest, spv:0,
              target:rest, seen:true };
  node._beam = b;
  paintBeam(b);

  /* No hover wind-up under reduced motion — the orbit continues, but nothing
     accelerates. Touch has no hover anyway, so phones lose nothing here. */
  if(!beamReduce.matches){
    const surge = () => { b.target = BEAM.hover }, settle = () => { b.target = BEAM.idle };
    node.addEventListener('pointerenter', surge);
    node.addEventListener('pointerleave', settle);
    node.addEventListener('focus', surge); node.addEventListener('blur', settle);
  }

  beams.add(b); beamIO.observe(node); beamPump();
  return node;
}

/* every render() rebuilds the DOM, so the old beams are detached nodes — drop
   them or the Set grows without bound */
function clearBeams(){ beamIO.disconnect(); beams.clear(); }

let beamRaf = 0, beamLast = 0, tabLive = true;
function beamFrame(now){
  const dt = Math.min(.05, (now - (beamLast || now))/1000);
  beamLast = now; beamRaf = 0;
  beams.forEach(b => {
    if(!b.seen) return;
    b.spv += (BEAM.k*(b.target - b.sp) - BEAM.d*b.spv) * dt;
    b.sp  += b.spv * dt;
    b.a   += b.sp * dt;
    paintBeam(b);
  });
  beamPump();
}
function beamPump(){
  /* beamReduce is deliberately NOT a gate here any more — the loop runs
     either way, just slower. Offscreen and hidden-tab still park it. */
  const live = tabLive && [...beams].some(b => b.seen);
  if(live && !beamRaf) beamRaf = requestAnimationFrame(beamFrame);
  if(!live && beamRaf){ cancelAnimationFrame(beamRaf); beamRaf = 0; beamLast = 0 }
}
document.addEventListener('visibilitychange', () => {
  tabLive = document.visibilityState !== 'hidden'; beamLast = 0; beamPump();
});
/* Toggling the OS setting mid-session retargets every live beam rather than
   waiting for the next render. */
beamReduce.addEventListener('change', () => {
  const rest = beamReduce.matches ? BEAM.slow : BEAM.idle;
  beams.forEach(b => { b.target = rest; if(beamReduce.matches) b.sp = Math.min(b.sp, rest); });
  beamPump();
});

/* ── card ──────────────────────────────────────────────── */
/* A span with role="button" does not fire click on Enter the way a real
   button does, so every one of them is bound through here. */
function act(node, fn){
  node.onclick = fn;
  node.onkeydown = e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
  };
}

/* Built to the reference: art on top, then a panel with the title, who
   made it, two lines of description, and one full-width outlined button
   carrying the shelf's verb. Everything the old overlay card could do it
   still does — star, score, Tonight, details — the two toggles just moved
   onto the art so the button can run the panel's full width. */
function card(d, opts={}){
  const shelf = shelfOf(opts.shelf || 'home');
  const c = el('button','card');
  c.type = 'button';
  const art = d.cover
    ? `<img class="bg" src="${d.cover}" alt="" aria-hidden="true" loading="lazy">
       <img class="fg" src="${d.cover}" alt="" loading="lazy">`
    : `<span class="absolute inset-0 grid place-items-center" style="color:${shelf.tint};opacity:.26">${sig(shelf.sigil,52)}</span>`;

  const meta = [d.creator, d.len].filter(Boolean).map(esc).join(' · ');

  c.innerHTML = `
    <span class="art">
      ${art}
      <span class="c-star ${d.fav?'on':''}" role="button" tabindex="0"
        aria-label="${d.fav?'Remove from favourites':'Add to favourites'}">${d.fav?'★':'☆'}</span>
      ${d.rating ? `<span class="c-score">${d.rating.toFixed(1)}</span>` : ''}
      <span class="c-acts">
        <span class="c-mini c-add ${d.queued?'on':''}" role="button" tabindex="0"
          aria-label="${d.queued?'Take out of Tonight':'Add to Tonight'}">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="${d.queued?'M3.6 8.4 6.5 11.3 12.4 5.2':'M8 3.6v8.8M3.6 8h8.8'}"/></svg>
        </span>
        <span class="c-mini c-info" role="button" tabindex="0" aria-label="Details">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v4"/><circle cx="8" cy="4.9" r=".75" fill="currentColor" stroke="none"/></svg>
        </span>
      </span>
    </span>
    <span class="c-foot">
      <span class="c-title">${esc(d.title)}</span>
      ${meta ? `<span class="c-meta">${meta}</span>` : ''}
      ${d.desc ? `<span class="c-desc">${esc(d.desc)}</span>` : ''}
      <span class="c-play" role="button" tabindex="0">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.6 13 8l-9 5.4Z"/></svg>
        ${shelf.verb}
      </span>
    </span>`;

  /* Every toggle writes through Vault.update() immediately. sync.js has
     patched localStorage.setItem, so the write also schedules the debounced
     Supabase push — no explicit save call needed anywhere. */
  const persist = patch => { if(d._shelf && d.id) Vault.update(d._shelf, d.id, patch); };

  const star = c.querySelector('.c-star');
  act(star, e => { e.stopPropagation(); d.fav = !d.fav;
    star.classList.toggle('on', d.fav); star.textContent = d.fav ? '★' : '☆';
    star.setAttribute('aria-label', d.fav ? 'Remove from favourites' : 'Add to favourites');
    persist({ favorite:d.fav }); });

  const add = c.querySelector('.c-add');
  act(add, e => { e.stopPropagation(); d.queued = !d.queued;
    add.classList.toggle('on', d.queued);
    add.setAttribute('aria-label', d.queued ? 'Take out of Tonight' : 'Add to Tonight');
    add.querySelector('path').setAttribute('d', d.queued ? 'M3.6 8.4 6.5 11.3 12.4 5.2' : 'M8 3.6v8.8M3.6 8h8.8');
    persist({ queued:d.queued }); });

  const open = e => {
    e.stopPropagation();
    if(!d.url){ flash(c, 'No link on this item'); return; }
    /* stamped before navigating — this is what fills the Continue row */
    if(d._shelf && d.id) Vault.touch(d._shelf, d.id);
    window.open(d.url, '_blank', 'noopener');
  };
  act(c.querySelector('.c-play'), open);
  c.onclick = open;
  act(c.querySelector('.c-info'), e => { e.stopPropagation(); toggleDetail(c, d, shelf); });
  return c;
}

function flash(cardEl, msg){
  const t = el('span','', msg);
  Object.assign(t.style, { position:'absolute', inset:'auto 0 0 0', zIndex:9,
    background:'rgba(184,133,63,.94)', color:'#1A1005', padding:'8px 14px',
    fontFamily:"'Martian Mono',monospace", fontSize:'9px', letterSpacing:'.11em',
    textTransform:'uppercase' });
  cardEl.appendChild(t); setTimeout(() => t.remove(), 1100);
}

/* ── inline detail ─────────────────────────────────────── */
const D_TABS = { reading:['Details','Quotes','Journal'], anime:['Details','Resources','Notes','Tables'],
  games:['Details','Resources','Notes','Tables'], _:['Details','Notes','Related'] };

function closeDetail(){
  document.querySelectorAll('.detail').forEach(p => p.remove());
  document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.grid-cards.has-open').forEach(r => r.classList.remove('has-open'));
}
function toggleDetail(cardEl, d, shelf){
  const wasOpen = cardEl.classList.contains('open');
  closeDetail(); if(wasOpen) return;
  const grid = cardEl.closest('.grid-cards');
  if(grid) grid.classList.add('has-open');
  cardEl.classList.add('open');
  const tabs = D_TABS[shelf.key] || D_TABS._;
  const panel = el('div','detail');
  panel.innerHTML = `
    <div class="d-tabs">
      ${tabs.map((t,i)=>`<button class="d-tab ${i===0?'on':''}">${t}</button>`).join('')}
      <button class="d-close" aria-label="Close">✕</button>
    </div>
    <div class="d-body">
      <div>
        <div class="d-lbl">Info</div>
        <p class="d-text">${esc(d.desc || 'No description yet — paste the link again to re-run auto-fill.')}</p>
        <div class="d-acts">
          <button class="d-btn" data-act="edit">Edit</button>
          <button class="d-btn" data-act="open">Open full →</button>
          <button class="d-btn" data-act="queue">${d.queued ? 'In Tonight' : 'Add to Tonight'}</button>
          <button class="d-btn" data-act="del" style="color:#C77">Delete</button>
        </div>
      </div>
      <div>
        <div class="d-lbl">Tags</div>
        <div class="tagwrap">
          ${(d.tags.length?d.tags:['Untagged']).map(t=>`<button class="tagpill">${esc(t)}</button>`).join('')}
          <button class="tagpill" style="border-style:dashed">+ Tag</button>
        </div>
      </div>
    </div>`;
  panel.querySelectorAll('.d-tab').forEach(t => t.onclick = () => {
    panel.querySelectorAll('.d-tab').forEach(x => x.classList.remove('on')); t.classList.add('on'); });
  panel.querySelector('.d-close').onclick = closeDetail;

  /* These four were markup only until now — the panel looked like an editor
     and was a label. `d._shelf` is the shelf the record actually lives on,
     which is not `shelf` here: Home, Favorites and Discover all render cards
     from shelves other than the one being viewed. */
  const rec = () => d._shelf ? Vault.list(d._shelf).find(x => x.id === d.id) : null;
  panel.querySelector('[data-act="edit"]').onclick = () => {
    const r = rec();
    if(!r) return note('That item is no longer on the shelf', true);
    closeDetail();
    openComposer({ shelf:d._shelf, item:r });
  };
  panel.querySelector('[data-act="open"]').onclick = () => {
    if(!d.url) return note('No link on this item', true);
    if(d._shelf && d.id) Vault.touch(d._shelf, d.id);
    window.open(d.url, '_blank', 'noopener');
  };
  const qb = panel.querySelector('[data-act="queue"]');
  qb.onclick = () => {
    d.queued = !d.queued;
    if(d._shelf && d.id) Vault.update(d._shelf, d.id, { queued:d.queued });
    qb.textContent = d.queued ? 'In Tonight' : 'Add to Tonight';
    const mini = cardEl.querySelector('.c-add');
    if(mini){
      mini.classList.toggle('on', d.queued);
      mini.querySelector('path').setAttribute('d',
        d.queued ? 'M3.6 8.4 6.5 11.3 12.4 5.2' : 'M8 3.6v8.8M3.6 8h8.8');
    }
  };
  panel.querySelector('[data-act="del"]').onclick = () => {
    const r = rec();
    if(!r) return note('That item is no longer on the shelf', true);
    if(!confirm('Delete “' + (r.title || 'this item') + '”?\n\nThis cannot be undone.')) return;
    Vault.remove(d._shelf, r.id);
    closeDetail(); note('Deleted');
    paintHero(shelfOf(active)); render();
  };

  /* Inside the grid, spanning every column, so it opens directly beneath
     the row the card is in rather than below the whole section. */
  if(grid){
    panel.style.gridColumn = '1 / -1';
    const kids = [...grid.children];
    const per = Math.max(1, Math.round(grid.offsetWidth /
      (cardEl.offsetWidth + parseFloat(getComputedStyle(grid).columnGap || 0) || 1)));
    const idx = kids.indexOf(cardEl);
    const after = kids[Math.min(kids.length - 1, (Math.floor(idx / per) + 1) * per - 1)];
    after.insertAdjacentElement('afterend', panel);
  } else {
    cardEl.insertAdjacentElement('afterend', panel);
  }
}

/* ── rows ──────────────────────────────────────────────── */
/* `add` is {shelf, category}: a "+" that files straight into THIS row. The
   global add button exists too, but picking the shelf and retyping the
   category for something you are looking at is friction with no purpose. */
function sechead(label, count, more, add){
  const h = el('div','sechead');
  h.innerHTML = `<span class="lbl">${label}</span>` +
    (count!=null?`<span class="num">${String(count).padStart(2,'0')}</span>`:'') +
    `<span class="rule"></span>` + (more?`<button class="more">${more} →</button>`:'');
  if(add){
    const b = el('button','addhere','+');
    b.setAttribute('aria-label', 'Add to ' + (add.category || shelfOf(add.shelf).label));
    b.title = 'Add to ' + (add.category || shelfOf(add.shelf).label);
    b.onclick = () => openComposer({ shelf:add.shelf, category:add.category });
    h.appendChild(b);
  }
  return h;
}
/* A wrapping grid, not a scroller: every card in a genre visible at once,
   which is the point. The nudge arrows and the edge fade went with the
   horizontal scroll they existed to drive. */
function mediaGrid(items, opts={}){
  const g = el('div','grid-cards');
  items.forEach(d => g.appendChild(card(d, opts)));
  return g;
}
function section(label, count, more, items, opts){
  opts = opts || {};
  const s = el('section','mb-12');
  s.appendChild(sechead(label, count, more, opts.addTo)); s.appendChild(mediaGrid(items, opts));
  return s;
}

/* ── the live readouts ───────────────────────────────────
   Four numbers per tab, computed from what is actually on the shelves
   rather than from anything stored. Returns null when a tab has nothing
   to count, and the hero then shows no readouts at all — an empty shelf
   should not claim four zeroes. */
function liveStats(key){
  const c = Vault.counts();
  if(key === 'home'){
    const total = Object.values(c).reduce((a,b) => a+b, 0);
    return [[String(total), 'items'], [String(Object.values(c).filter(Boolean).length), 'shelves'],
            [String(rawAll().filter(v => v.favorite).length), 'starred'],
            [String(rawAll().filter(v => v.queued).length), 'tonight']];
  }
  if(key === 'favorites'){
    const favs = rawAll().filter(v => v.favorite);
    if(!favs.length) return null;
    return [[String(favs.length), 'starred'],
            [String(new Set(favs.map(v => v._shelf)).size), 'shelves'],
            [String(favs.filter(v => (v.rating || 0) >= 5).length), 'five star'],
            [String(favs.filter(v => v.queued).length), 'tonight']];
  }
  if(key === 'discover'){
    const pool = rawAll();
    if(!pool.length) return null;
    return [[String(pool.length), 'in pool'],
            [String(Object.values(c).filter(Boolean).length), 'shelves'],
            [String(pool.filter(v => !v.lastOpenedAt).length), 'untouched'],
            [String(pool.filter(v => (v.rating || 0) >= 4).length), 'four plus']];
  }
  if(key === 'stats'){
    const pool = rawAll();
    if(!pool.length) return null;
    const rated = pool.filter(v => (v.rating || 0) > 0);
    const avg = rated.length
      ? (rated.reduce((a,v) => a + Number(v.rating || 0), 0) / rated.length).toFixed(1) : '—';
    return [[String(pool.length), 'tracked'],
            [String(Object.values(c).filter(Boolean).length), 'shelves'],
            [String(avg), 'avg rating'],
            [String(pool.reduce((a,v) => a + (v.openCount || 0), 0)), 'opens']];
  }
  /* A tab can read more than one shelf — Horror reads two, Spicy reads
     two — so the readouts count across all of them. */
  const reads = readsOf(key);
  if(!reads.length) return null;
  const items = reads.flatMap(sh => Vault.list(sh));
  if(!items.length) return null;
  return [[String(items.length), 'items'],
          [String(new Set(items.map(i => i.category).filter(Boolean)).size), 'categories'],
          [String(items.filter(i => i.favorite).length), 'starred'],
          [String(items.filter(i => i.queued).length), 'tonight']];
}

/* ── hero ────────────────────────────────────────────────
   The hero itself is vault-hero.js's: the clip, the ring, the columns,
   the rail, the ribbon and both parallax transitions all live there and
   are mounted once at boot. This page's only job is to tell it what the
   current tab is called and what the live numbers are.

   A shelf is a place items live; a view reads across the shelves. That
   is a real distinction here, so the eyebrow carries it. */
function paintHero(s){
  if(!global_VaultHero()) return;
  const stats = liveStats(s.key) || [];
  window.VaultHero.setScene({
    key: s.key,
    eyebrow: (s.kind === 'view' ? 'View — ' : 'Shelf — ') + s.label,
    lines: s.lines,
    note: s.note,
    readouts: stats,
  });
}
/* vault-hero.js is deferred, so on a very slow load boot() could in
   principle run first. Cheap to guard, and it keeps the page usable
   even if the file 404s. */
function global_VaultHero(){ return !!window.VaultHero; }

/* ── tabs ──────────────────────────────────────────────── */
let active = 'home';
const strip = document.getElementById('tabstrip');
SHELVES.forEach(s => {
  const b = el('button','tab', sig(s.sigil,12)+`<span>${s.label}</span>`);
  b.dataset.key = s.key; b.onclick = () => go(s.key); strip.appendChild(b);
});

function go(key){
  key = tabKey(key);
  active = key;
  try { history.replaceState(null,'','#'+key) } catch(e){}
  const s = shelfOf(key);
  document.documentElement.style.setProperty('--shelf', s.tint);
  strip.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.key===key));
  strip.querySelector('.tab.on')?.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  paintHero(s);
  render();
  /* Navigation scrolls to the top; a REPAINT never does. onApplied and the
     seeder both call render() without coming through here, which is what
     keeps a cloud pull from throwing you back up the page mid-read. */
  scrollTo({ top:0, behavior:'smooth' });
}

/* ── tab content ───────────────────────────────────────── */
const body = document.getElementById('body');

function renderHome(){
  /* Shelves leads. It's the only block on Home that reaches every collection,
     so it belongs directly under the hero — Continue and Tonight are subsets
     of it and read better as follow-ups. */
  const shelves = el('section','mb-12');
  const counts = COUNTS();
  /* One tile per TAB that holds something — so Horror is one tile
     counting both its shelves, not two. */
  const countOf = s => readsOf(s).reduce((n, sh) => n + (counts[sh] || 0), 0);
  const live = SHELVES.filter(s => countOf(s) > 0);
  shelves.appendChild(sechead('Shelves', live.length, null, { shelf: Vault.SHELVES[0] }));
  const grid = el('div','grid gap-3 grid-cols-2 sm:grid-cols-3 lg:grid-cols-5');
  live.forEach((s,i) => {
    const t = el('button','tile', `<span style="color:${s.tint}">${sig(s.sigil,17)}</span>
      <span class="tn">${s.label}</span><span class="tc">${countOf(s)} items</span>`);
    t.style.setProperty('--tint', s.tint); t.onclick = () => go(s.key);
    /* second comet carries the shelf's own hue, so the tile is colour-coded by
       the light running round it as well as by its sigil */
    beam(t, { tint:s.tint, seed:i+1 });
    grid.appendChild(t);
  });
  shelves.appendChild(grid); body.appendChild(shelves);

  const cont = CONTINUE(), tonight = TONIGHT(), recent = RECENT();
  if(cont.length)    body.appendChild(section('Continue', cont.length, 'History', cont, { shelf:'watch' }));


  if(tonight.length){
    const sec = section('Tonight', tonight.length, 'Clear', tonight, { shelf:'spicy' });
    /* Clear was a label. Emptying the queue is the one thing you want from
       this row that is not opening something in it. */
    sec.querySelector('.more').onclick = () => {
      if(!confirm('Take all ' + tonight.length + ' out of Tonight?')) return;
      tonight.forEach(d => { if(d._shelf) Vault.update(d._shelf, d.id, { queued:false }); });
      paintHero(shelfOf(active)); render();
    };
    body.appendChild(sec);
  }

  if(recent.length)  body.appendChild(section('Recently added', recent.length, 'All', recent, { shelf:'horror' }));

  const picks = vaultPicks(3);
  if(picks.length){
    const sec = section('From the shelves', null, 'Reroll', picks, { shelf:'discover' });
    sec.querySelector('.more').onclick = () => {
      const fresh = vaultPicks(3);
      sec.querySelector('.grid-cards').replaceWith(mediaGrid(fresh, { shelf:'discover' }));
    };
    body.appendChild(sec);
  }
}

/* One gallery renderer for every link shelf — the old dashboard had a
   separate hand-written block per page, which is why its shelves drifted
   apart. Categories become stacked rows, not a filter. */
function renderGallery(tab){
  const groups = byCategory(tab);
  const cats = Object.keys(groups);
  if(!cats.length) return renderEmpty(tab);

  /* The jump chips stay exactly as they were — same pills, same orbiting
     border, same jump-to-section. They are how you get around a long
     shelf, and nothing about the grid below changed that. */
  const chips = el('div','flex gap-2 overflow-x-auto pb-2 mb-10');
  chips.style.scrollbarWidth = 'none';
  const tint = shelfOf(active).tint;
  cats.forEach((c,i) => {
    const b = el('button','chip', `${c} · ${groups[c].items.length}`);
    b.onclick = () => document.getElementById('cat-'+i)?.scrollIntoView({ behavior:'smooth', block:'start' });
    beam(b, { tint, seed:i+1 });
    chips.appendChild(b);
  });
  body.appendChild(chips);

  cats.forEach((c,i) => {
    const g = groups[c];
    const sec = section(c, g.items.length, null, g.items,
      { shelf:g.shelf, addTo:{ shelf:g.shelf, category: c === 'Uncategorised' ? '' : c } });
    sec.classList.add('catblock');
    sec.id = 'cat-'+i; sec.style.scrollMarginTop = '90px'; body.appendChild(sec);
  });

  /* Starting a new category has to be possible from the page itself.
     Without this the only way to create one is to guess that the
     composer's Category box accepts text it has never seen. A merged tab
     offers one button per shelf, because "new category" has to know
     which shelf it is starting on. */
  const foot = el('div','mt-2 mb-14 flex flex-wrap gap-2');
  readsOf(tab).forEach(sh => {
    const label = readsOf(tab).length > 1
      ? '+ New category in ' + SHELF_NAME[sh]
      : '+ New category on this shelf';
    const nb = el('button','cmp-ghost', label);
    nb.onclick = () => openComposer({ shelf:sh, category:'' });
    foot.appendChild(nb);
  });
  body.appendChild(foot);
}

/* The storage shelves' own names, for the places a merged tab has to say
   which of its two shelves it means. */
const SHELF_NAME = {
  podcasts:'Podcasts', creepypasta:'Creepypasta', trueHorror:'True Stories',
  spicy:'Spicy', immersive:'Immersive', watch:'Watching',
  playlists:'Music', reading:'Reading', anime:'Anime', games:'Games'
};

function renderEmpty(tab){
  const s = typeof tab === 'string' ? shelfOf(tab) : tab;
  const first = readsOf(s)[0];
  const d = el('div','stub');
  d.innerHTML = `<div style="color:${s.tint};opacity:.4">${sig(s.sigil,34)}</div>
    <p class="mono mt-5" style="color:var(--ink-faint)">Nothing here yet</p>
    <p class="mt-3 mx-auto max-w-[380px]" style="color:var(--ink-dim);font-size:13px">
      Paste a link, or fill the form in by hand — a title is enough to start with.</p>`;
  const b = el('button','cmp-save emptyadd','Add the first item');
  b.onclick = () => openComposer({ shelf:first });
  d.appendChild(b);
  body.appendChild(d);
}

/* ── Discovery Engine ──────────────────────────────────────
   Matches the old page's behaviour: pick a shelf (or all), set a minimum
   rating, roll one random item, roll again. State survives tab switches
   within the session, exactly as discoveryState did there. */
const discovery = { shelf:'all', minRating:0, pick:null, recent:[] };

function renderDiscover(){
  const wrap = el('section','mb-12');
  wrap.appendChild(sechead('Discovery Engine', null));

  const controls = el('div','disc-controls');

  const shelfSel = el('select','disc-select');
  shelfSel.innerHTML = '<option value="all">All shelves</option>' +
    Vault.SHELVES.filter(s => Vault.list(s).length)
      .map(s => `<option value="${s}">${esc(SHELF_NAME[s] || s)} · ${Vault.list(s).length}</option>`).join('');
  shelfSel.value = discovery.shelf;
  shelfSel.onchange = () => { discovery.shelf = shelfSel.value; };

  const rateSel = el('select','disc-select');
  rateSel.innerHTML = [0,1,2,3,4,5].map(n =>
    `<option value="${n}">${n === 0 ? 'Any rating' : n + '+ stars'}</option>`).join('');
  rateSel.value = discovery.minRating;
  rateSel.onchange = () => { discovery.minRating = Number(rateSel.value); };

  const roll = el('button','disc-roll','Discover');
  roll.onclick = () => { rollDiscovery(); paintPick(); };

  controls.append(shelfSel, rateSel, roll);
  wrap.appendChild(controls);

  const stage = el('div','disc-stage'); stage.id = 'discStage';
  wrap.appendChild(stage);
  body.appendChild(wrap);
  paintPick();
}

function discoveryPool(){
  const shelves = discovery.shelf === 'all' ? Vault.SHELVES : [discovery.shelf];
  return shelves.flatMap(s => Vault.list(s).map(v => ({ ...v, _shelf:s })))
    .filter(v => (Number(v.rating) || 0) >= discovery.minRating);
}

function rollDiscovery(){
  const pool = discoveryPool();
  if(!pool.length){ discovery.pick = null; return; }
  /* Don't hand back the item you just rejected. The old engine used a bare
     Math.random(), so pressing Try Another could return the same card and
     read as a broken button. Only excludes the last few, so a small pool
     still works. */
  const avoid = new Set(discovery.recent.slice(-Math.min(5, pool.length - 1)));
  const fresh = pool.filter(v => !avoid.has(v.id));
  const from = fresh.length ? fresh : pool;
  const hit = from[Math.floor(Math.random() * from.length)];
  discovery.pick = hit;
  discovery.recent.push(hit.id);
  if(discovery.recent.length > 20) discovery.recent.shift();
}

function paintPick(){
  const stage = document.getElementById('discStage');
  if(!stage) return;
  stage.innerHTML = '';
  if(!discovery.pick){
    const pool = discoveryPool().length;
    stage.appendChild(el('p','disc-empty', pool
      ? 'Press Discover for a random pick.'
      : 'Nothing matches those filters yet — try a lower rating.'));
    return;
  }
  const d = toCard(discovery.pick);
  const holder = el('div','disc-card');
  holder.appendChild(card(d, { shelf:discovery.pick._shelf }));
  stage.appendChild(holder);

  const meta = el('p','disc-meta',
    `from ${esc(SHELF_NAME[discovery.pick._shelf] || discovery.pick._shelf)}${d.tags[0] ? ' · ' + esc(d.tags[0]) : ''}`);
  stage.appendChild(meta);

  const again = el('button','disc-again','Try another');
  again.onclick = () => { rollDiscovery(); paintPick(); };
  stage.appendChild(again);
}

/* ── Favorites ─────────────────────────────────────────────
   Every starred item on every shelf, grouped into one row per shelf. The
   old page gated this behind filter chips — one chip click to see one
   shelf. Stacked rows show all of them at once, which is the same reason
   the galleries stack rather than filter. */
function renderFavorites(){
  const groups = Vault.SHELVES
    .map(s => [s, Vault.list(s).filter(v => v.favorite).map(v => toCard({ ...v, _shelf:s }))])
    .filter(([, list]) => list.length);

  if(!groups.length){
    const d = el('div','stub');
    d.innerHTML = `<div style="color:var(--gilt);opacity:.4">${sig('sg-fav',34)}</div>
      <p class="mono mt-5" style="color:var(--ink-faint)">No favourites yet</p>
      <p class="mt-3 mx-auto max-w-[380px]" style="color:var(--ink-dim);font-size:13px">
        Tap the star at the top-left of any card to add one.</p>`;
    body.appendChild(d);
    return;
  }

  const total = groups.reduce((n, [, l]) => n + l.length, 0);
  const chips = el('div','flex gap-2 overflow-x-auto pb-2 mb-10');
  chips.style.scrollbarWidth = 'none';
  groups.forEach(([s, list], i) => {
    const b = el('button','chip', `${esc(SHELF_NAME[s] || s)} · ${list.length}`);
    b.onclick = () => document.getElementById('fav-'+i)?.scrollIntoView({ behavior:'smooth', block:'start' });
    beam(b, { tint:shelfOf(s).tint, seed:i+1 });
    chips.appendChild(b);
  });
  body.appendChild(chips);

  groups.forEach(([s, list], i) => {
    const sec = section(SHELF_NAME[s] || s, list.length, 'Open shelf', list, { shelf:s });
    sec.classList.add('catblock');
    sec.id = 'fav-'+i; sec.style.scrollMarginTop = '90px';
    /* go() resolves a retired shelf key to the tab that now shows it. */
    sec.querySelector('.more')?.addEventListener('click', () => go(s));
    body.appendChild(sec);
  });
  body.dataset.favTotal = total;
}

/* Only Stats reaches this now — every other tab is a real shelf you can put
   something on. Stats is a view over the shelves rather than a place items
   live, so it has nothing to add TO. */
function renderStub(){
  const s = shelfOf(active);
  const d = el('div','stub');
  d.innerHTML = `<div style="color:${s.tint};opacity:.4">${sig(s.sigil,34)}</div>
    <p class="mono mt-5" style="color:var(--ink-faint)">Not built yet</p>
    <p class="mt-3 mx-auto max-w-[380px]" style="color:var(--ink-dim);font-size:13px">
      ${esc(s.label)} reads across the other shelves rather than holding
      anything of its own.</p>`;
  body.appendChild(d);
}

function render(){
  closeDetail(); clearBeams(); body.innerHTML = '';
  if(active==='home') renderHome();
  else if(active==='discover') renderDiscover();
  else if(active==='favorites') renderFavorites();
  else if(readsOf(active).length) renderGallery(shelfOf(active));
  else renderStub();
}

/* ── chrome condense + scroll gauge ────────────────────── */
/* NB: `chrome` is a pre-existing global in Chromium — declaring const chrome
   here throws "already been declared" and kills the whole script. */
const chromeBar = document.getElementById('chrome'), gauge = document.getElementById('gauge');

/* One rAF-throttled pass drives the curtain, the chrome condense and the gauge.
   Everything visual is expressed in CSS off --p; this only writes the number. */
let queued = false;
/* The hero's own parallax is vault-hero.js's rAF, not this one — the old
   curtain (a fixed hero with the sheet sliding over it) is gone. What is
   left here is the chrome bar's condense and the scroll gauge. */
function onScroll(){
  queued = false;
  chromeBar.classList.toggle('stuck', scrollY > 30);
  const max = document.documentElement.scrollHeight - innerHeight;
  gauge.style.transform = `scaleX(${max > 0 ? scrollY/max : 0})`;
}
addEventListener('scroll', () => {
  if(!queued){ queued = true; requestAnimationFrame(onScroll); }
}, { passive:true });
addEventListener('resize', onScroll);
onScroll();

/* The clock and the scroll cue are the hero's now — see vault-hero.js. */

/* deep links: #podcasts must work on back/forward and on paste-into-address-bar */
addEventListener('hashchange', () => {
  const k = tabKey(location.hash.slice(1));
  if(k && k !== active && SHELVES.some(s => s.key === k)) go(k);
});

addEventListener('keydown', e => {
  /* Escape closes the sheet from anywhere, including from inside a field —
     it is the one key that has to work while typing. */
  if(e.key === 'Escape' && cmp.open) return closeComposer();
  /* TEXTAREA and SELECT were missing here, so typing a "3" into the notes
     box would have jumped the page to another shelf. */
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(cmp.open) return;
  if(e.key === 'Escape') return closeDetail();
  if(e.key === 'n' || e.key === 'N'){ e.preventDefault(); return openComposer({}); }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=9 && SHELVES[n-1]) go(SHELVES[n-1].key);
});

/* ══ §COMPOSER ═══════════════════════════════════════════
   Everything that writes an item goes through here. Before this the page
   was read-only in practice: the chrome's "Paste a link…" box had no
   listener, the detail panel's Edit button had no listener, and there was
   no delete at all — so the only items in the Vault were the ones the
   migration put there.

   One form covers add and edit, because correcting an item and creating one
   want the same nine fields, and two forms would drift. */
const cmp = {
  el: document.getElementById('cmp'),
  scrim: document.getElementById('cmpScrim'),
  form: document.getElementById('cmpForm'),
  msg: document.getElementById('cmpMsg'),
  url: document.getElementById('cmpUrl'),
  title: document.getElementById('cmpTitleIn'),
  shelf: document.getElementById('cmpShelf'),
  cat: document.getElementById('cmpCat'),
  catList: document.getElementById('cmpCatList'),
  creator: document.getElementById('cmpCreator'),
  len: document.getElementById('cmpLen'),
  cover: document.getElementById('cmpCover'),
  desc: document.getElementById('cmpDesc'),
  stars: document.getElementById('cmpStars'),
  fav: document.getElementById('cmpFav'),
  queue: document.getElementById('cmpQueue'),
  del: document.getElementById('cmpDel'),
  prev: document.getElementById('cmpPrev'),
  prevImg: document.getElementById('cmpPrevImg'),
  prevTitle: document.getElementById('cmpPrevTitle'),
  prevSub: document.getElementById('cmpPrevSub'),
  heading: document.getElementById('cmpTitle'),
  /* editing: {shelf, id} or null. rating: 0-5. touched: fields the reader
     has typed in, which auto-fill must never overwrite. */
  editing: null, rating: 0, touched: new Set(), lastFocus: null, open: false
};

/* A small centred note. flash() needs a card to attach to, and half of what
   the composer has to say happens with no card on screen. */
function note(msg, bad){
  document.querySelectorAll('.vnote').forEach(n => n.remove());
  const t = el('div','vnote', esc(msg));
  Object.assign(t.style, {
    position:'fixed', left:'50%', bottom:'26px', transform:'translateX(-50%)',
    zIndex:'95', maxWidth:'min(420px,92vw)', textAlign:'center',
    padding:'11px 20px', borderRadius:'99px',
    background: bad ? 'rgba(224,136,136,.95)' : 'rgba(184,133,63,.96)',
    color:'#1A1005', fontFamily:"'Martian Mono',monospace", fontSize:'10px',
    letterSpacing:'.11em', textTransform:'uppercase',
    boxShadow:'0 12px 34px -12px rgba(6,4,2,.9)'
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ── auto-fill ────────────────────────────────────────────
   Only ever fills a field the reader has left alone, and only from the
   site's OWN oEmbed endpoint — no third-party metadata service, which would
   mean every link pasted here being reported to a stranger. When there is no
   endpoint, the host name and the URL slug still beat an empty form. */
const OEMBED = {
  'youtube.com':   u => 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(u),
  'youtu.be':      u => 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(u),
  'vimeo.com':     u => 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent(u),
  'open.spotify.com': u => 'https://open.spotify.com/oembed?url=' + encodeURIComponent(u),
  'soundcloud.com':u => 'https://soundcloud.com/oembed?format=json&url=' + encodeURIComponent(u)
};

function ytId(u){
  try{
    const url = new URL(u), h = url.hostname.replace(/^www\./,'');
    if(h === 'youtu.be') return url.pathname.slice(1).split('/')[0] || '';
    if(!/youtube\.com$/.test(h)) return '';
    if(url.searchParams.get('v')) return url.searchParams.get('v');
    const m = url.pathname.match(/\/(shorts|embed|live)\/([^/?#]+)/);
    return m ? m[2] : '';
  }catch(e){ return '' }
}

function titleFromSlug(u){
  try{
    const seg = new URL(u).pathname.split('/').filter(Boolean).pop() || '';
    if(!seg || /^[0-9a-f]{8,}$/i.test(seg)) return '';
    return decodeURIComponent(seg).replace(/\.(html?|php|aspx?)$/i,'')
      .replace(/[-_+]+/g,' ').replace(/\s+/g,' ').trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }catch(e){ return '' }
}

function fillIfUntouched(field, value){
  if(!value) return;
  const node = cmp[field];
  if(!node || cmp.touched.has(field) || node.value.trim()) return;
  node.value = value;
}

let autofillSeq = 0;
async function autofill(raw){
  const u = String(raw || '').trim();
  if(!/^https?:\/\//i.test(u)) return;
  const seq = ++autofillSeq;

  // Instant, offline, always right: the host is the creator until something
  // better arrives, and a YouTube thumbnail is derivable from the id alone.
  let host = '';
  try{ host = new URL(u).hostname.replace(/^www\./,'') }catch(e){}
  fillIfUntouched('creator', host);
  fillIfUntouched('title', titleFromSlug(u));
  const vid = ytId(u);
  if(vid) fillIfUntouched('cover', `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`);
  paintPreview();

  const endpoint = OEMBED[host];
  if(!endpoint) return;
  try{
    const r = await fetch(endpoint(u), { headers:{ Accept:'application/json' } });
    if(!r.ok) return;
    const j = await r.json();
    if(seq !== autofillSeq) return;         // a newer paste already won
    fillIfUntouched('title', j.title);
    fillIfUntouched('creator', j.author_name);
    // The oEmbed thumbnail beats the derived one, but not a typed one.
    if(j.thumbnail_url && !cmp.touched.has('cover')) cmp.cover.value = j.thumbnail_url;
    paintPreview();
  }catch(e){ /* offline, blocked, or the endpoint moved — the form still works */ }
}

function paintPreview(){
  const cover = cmp.cover.value.trim(), title = cmp.title.value.trim();
  if(!cover && !title){ cmp.prev.hidden = true; return; }
  cmp.prev.hidden = false;
  cmp.prevTitle.textContent = title || 'Untitled';
  const bits = [cmp.creator.value.trim(), cmp.len.value.trim(), cmp.cat.value.trim()].filter(Boolean);
  cmp.prevSub.textContent = bits.join(' · ');
  if(cover){
    cmp.prevImg.hidden = false;
    if(cmp.prevImg.getAttribute('src') !== cover) cmp.prevImg.src = cover;
  } else { cmp.prevImg.hidden = true; cmp.prevImg.removeAttribute('src'); }
}
/* A cover that 404s must look wrong here rather than after saving. */
cmp.prevImg.addEventListener('error', () => {
  if(!cmp.cover.value.trim()) return;
  say('That cover link did not load. It will still save — the card falls back to the shelf sigil.', 'warn');
});

function say(text, kind){
  cmp.msg.textContent = text || '';
  cmp.msg.className = 'cmp-msg' + (text ? ' on ' + (kind || 'warn') : '');
}

function paintStars(){
  cmp.stars.querySelectorAll('.cmp-star').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.n) <= cmp.rating));
}
function paintToggles(){
  cmp.fav.textContent = cmp.fav.classList.contains('on') ? '★ Favourite' : '☆ Favourite';
  cmp.queue.textContent = cmp.queue.classList.contains('on') ? '✓ Tonight' : '＋ Tonight';
}

/* Shelves the composer can file into: the real data shelves only. Home,
   Discover, Favorites and Stats are views over those, not places. */
function fillShelfSelect(selected){
  cmp.shelf.innerHTML = Vault.SHELVES
    .map(s => `<option value="${s}">${esc(shelfOf(s).label)}</option>`).join('');
  cmp.shelf.value = Vault.SHELVES.includes(selected) ? selected : Vault.SHELVES[0];
}
function fillCatList(){
  const own = Vault.categories(cmp.shelf.value);
  const rest = Vault.allCategories().filter(c => !own.includes(c));
  cmp.catList.innerHTML = own.concat(rest).map(c => `<option value="${esc(c)}">`).join('');
}

function openComposer(opts){
  opts = opts || {};
  const item = opts.item || null;
  cmp.editing = item ? { shelf: opts.shelf, id: item.id } : null;
  cmp.touched.clear();
  say('');

  cmp.heading.textContent = item ? 'Edit item' : 'Add to the Studio';
  fillShelfSelect(item ? opts.shelf : (Vault.SHELVES.includes(active) ? active : opts.shelf));
  fillCatList();

  cmp.url.value     = item ? (item.url || '') : (opts.url || '');
  cmp.title.value   = item ? (item.title || '') : '';
  cmp.cat.value     = item ? (item.category || '') : (opts.category || '');
  cmp.creator.value = item ? (item.creator || '') : '';
  cmp.len.value     = item ? (item.lengthText || '') : '';
  cmp.cover.value   = item ? (item.cover || '') : '';
  cmp.desc.value    = item ? (item.description || '') : '';
  cmp.rating        = item ? (Number(item.rating) || 0) : 0;
  cmp.fav.classList.toggle('on', !!(item && item.favorite));
  cmp.queue.classList.toggle('on', !!(item && item.queued));
  paintStars(); paintToggles(); paintPreview();
  cmp.del.hidden = !item;

  cmp.lastFocus = document.activeElement;
  cmp.el.hidden = false; cmp.scrim.hidden = false;
  requestAnimationFrame(() => { cmp.el.classList.add('on'); cmp.scrim.classList.add('on'); });
  cmp.open = true;
  // Editing starts at the title, adding starts at the link — that is the
  // field each case actually wants first.
  setTimeout(() => { (item ? cmp.title : cmp.url).focus(); }, 90);
  if(!item && opts.url) autofill(opts.url);
}

function closeComposer(){
  if(!cmp.open) return;
  cmp.open = false;
  cmp.el.classList.remove('on'); cmp.scrim.classList.remove('on');
  setTimeout(() => { cmp.el.hidden = true; cmp.scrim.hidden = true; }, 320);
  if(cmp.lastFocus && cmp.lastFocus.focus) { try{ cmp.lastFocus.focus() }catch(e){} }
}

function readComposer(){
  return {
    url: cmp.url.value.trim(),
    title: cmp.title.value.trim(),
    category: cmp.cat.value.trim(),
    creator: cmp.creator.value.trim(),
    lengthText: cmp.len.value.trim(),
    cover: cmp.cover.value.trim(),
    description: cmp.desc.value.trim(),
    rating: cmp.rating,
    favorite: cmp.fav.classList.contains('on'),
    queued: cmp.queue.classList.contains('on')
  };
}

/* Returns true when it saved. `keepOpen` is Save & add another, which keeps
   the shelf and the category — the case it exists for is emptying a browser
   tab group onto one shelf, where re-picking the shelf nine times is the
   entire friction. */
function saveComposer(keepOpen){
  const f = readComposer(), shelf = cmp.shelf.value;
  if(!f.title && !f.url){
    say('Give it a title or a link — everything else is optional.', 'bad');
    cmp.title.focus(); return false;
  }
  if(!f.title) f.title = titleFromSlug(f.url) || f.url;

  if(cmp.editing){
    // A shelf change is a move, not a field edit — the shelf is part of the
    // storage key rather than a property of the record.
    if(shelf !== cmp.editing.shelf) Vault.move(cmp.editing.shelf, cmp.editing.id, shelf);
    Vault.update(shelf, cmp.editing.id, f);
    note('Saved');
  } else {
    const dupe = f.url ? Vault.findByUrl(f.url) : null;
    if(dupe){
      say('That link is already on ' + shelfOf(dupe.shelf).label +
          ' as “' + dupe.item.title + '”. Saving again will make a second copy.', 'warn');
      // Only blocks once: pressing Save a second time is a deliberate answer
      // to the question, not an accident.
      if(!cmp.dupeWarned){ cmp.dupeWarned = true; return false; }
    }
    Vault.add(shelf, f);
    note('Added to ' + shelfOf(shelf).label);
  }
  cmp.dupeWarned = false;

  if(keepOpen){
    const keptShelf = shelf, keptCat = f.category;
    cmp.editing = null; cmp.touched.clear(); say('');
    ['url','title','creator','len','cover','desc'].forEach(k => { cmp[k].value = ''; });
    cmp.rating = 0; cmp.fav.classList.remove('on'); cmp.queue.classList.remove('on');
    paintStars(); paintToggles(); paintPreview();
    cmp.heading.textContent = 'Add to the Studio';
    cmp.del.hidden = true;
    fillShelfSelect(keptShelf); cmp.cat.value = keptCat; fillCatList();
    cmp.url.focus();
  } else {
    closeComposer();
  }
  paintHero(shelfOf(active));
  render();
  return true;
}

function deleteComposer(){
  if(!cmp.editing) return;
  const it = Vault.list(cmp.editing.shelf).find(x => x.id === cmp.editing.id);
  if(!confirm('Delete “' + (it ? it.title : 'this item') + '” from ' +
      shelfOf(cmp.editing.shelf).label + '?\n\nThis cannot be undone.')) return;
  Vault.remove(cmp.editing.shelf, cmp.editing.id);
  closeComposer();
  note('Deleted');
  paintHero(shelfOf(active));
  render();
}

/* ── composer wiring ─────────────────────────────────── */
['url','title','cat','creator','len','cover','desc'].forEach(k => {
  cmp[k].addEventListener('input', () => {
    cmp.touched.add(k);
    if(k !== 'desc') paintPreview();
    if(k === 'url') say('');
  });
});
/* Paste is the main way a link arrives. Read it after the browser has put it
   in the box, then go looking for its title. */
cmp.url.addEventListener('paste', () => setTimeout(() => {
  cmp.touched.delete('title'); cmp.touched.delete('creator'); cmp.touched.delete('cover');
  autofill(cmp.url.value);
}, 0));
cmp.url.addEventListener('change', () => autofill(cmp.url.value));
cmp.shelf.addEventListener('change', fillCatList);
cmp.stars.addEventListener('click', e => {
  const b = e.target.closest('.cmp-star'); if(!b) return;
  const n = Number(b.dataset.n);
  cmp.rating = (cmp.rating === n) ? n - 1 : n;   // click the current star to step down
  paintStars();
});
document.getElementById('cmpStarsClear').onclick = () => { cmp.rating = 0; paintStars(); };
cmp.fav.onclick   = () => { cmp.fav.classList.toggle('on'); paintToggles(); };
cmp.queue.onclick = () => { cmp.queue.classList.toggle('on'); paintToggles(); };
document.getElementById('cmpSave').onclick  = () => saveComposer(false);
document.getElementById('cmpAgain').onclick = () => saveComposer(true);
cmp.del.onclick = deleteComposer;
document.getElementById('cmpX').onclick = closeComposer;
cmp.scrim.onclick = closeComposer;
/* Enter saves from any single-line field; the notes box keeps its newlines. */
cmp.form.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); saveComposer(false); }
});
/* Focus must not escape an open sheet — behind it is a page full of links. */
cmp.el.addEventListener('keydown', e => {
  if(e.key !== 'Tab') return;
  const f = [...cmp.el.querySelectorAll('input,select,textarea,button')]
    .filter(n => !n.hidden && !n.disabled && n.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

document.getElementById('addFab').onclick = () => openComposer({});

/* The chrome's paste bar, which until now was decoration. */
const omni = document.querySelector('.omni');
omni.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const v = omni.value.trim();
  if(!v) return;
  omni.value = '';
  openComposer({ url: v });
});
omni.addEventListener('paste', () => setTimeout(() => {
  const v = omni.value.trim();
  if(!/^https?:\/\//i.test(v)) return;
  omni.value = '';
  openComposer({ url: v });
}, 0));

/* ── boot ──────────────────────────────────────────────────
   Two gates, both required:
     · DOMContentLoaded — sync.js, topbar.js and vault-data.js are deferred
       and only finish executing right before it fires.
     · LocalStoreIDB.ready() — the shim seeds a Map synchronously but
       overlays the real IndexedDB contents asynchronously, and IndexedDB
       wins. Rendering before it resolves shows stale data, then flickers. */
function boot(){
  /* tabKey() resolves the retired shelf hashes too, so #creepypasta,
     #trueHorror and #immersive still land somewhere real. */
  const fromHash = tabKey(location.hash.slice(1));
  if(fromHash && SHELVES.some(s => s.key === fromHash)) active = fromHash;
  const s0 = shelfOf(active);
  document.documentElement.style.setProperty('--shelf', s0.tint);
  strip.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.key === active));

  /* The hero, the ribbon and the ground go in ONCE, here, before the
     first render() — outside #body and outside .sheet, so no repaint can
     reach the <video>. */
  if(window.VaultHero){
    window.VaultHero.mount({
      before: '#sheet',
      shelves: SHELVES,
      onShelf: go,
      badge: { lead:'Add', main:'Anything', onClick: () => openComposer({}) },
    });
  }

  paintHero(s0);
  render();
  /* The hero is 100svh; its height is only correct once the first render
     has settled the page's own scroll height. */
  requestAnimationFrame(() => window.VaultHero && window.VaultHero.measure());

  /* Its own Supabase row. Nothing here reads or writes 'enthub:',
     'entdash:', 'entread:' or 'media:', so the existing Entertainment
     dashboard is untouched by anything that happens on this page. */
  const remoteRef = { applied:false };
  if(typeof window.initCloudSync === 'function'){
    window.initCloudSync({
      appKey:'vault', syncedPrefixes:['vault:'],
      /* A repaint, not a navigation: paintHero refreshes the readouts and
         render() redraws the cards, but neither scrolls and neither
         re-arms the hero's intro — setScene only replays the reveal when
         the SHELF changed. */
      onApplied(){ remoteRef.applied = true; paintHero(shelfOf(active)); render(); }
    });
    setStorageState('synced');
  }

  /* Additive: seeds only shelves that are empty, merging by canonical URL.
     Never deletes, so anything removed here stays removed. */
  Vault.maybeSeedAfterSyncAttempt(remoteRef, () => { paintHero(shelfOf(active)); render(); });
}

function setStorageState(mode){
  if(window.VaultHero) window.VaultHero.setState(mode);
}

document.addEventListener('DOMContentLoaded', () => {
  (window.LocalStoreIDB ? window.LocalStoreIDB.ready() : Promise.resolve()).then(boot);
});
</script>
</body>
</html>
