<!DOCTYPE html>
<html lang="en" class="hd-root">
<head>
<!-- FIRST, AND NEVER DEFERRED. local-store-idb.js replaces
     window.localStorage wholesale before any other script runs, so
     vault-data.js keeps using plain localStorage unchanged. Every
     boot path is then gated on LocalStoreIDB.ready(). -->
<script src="local-store-idb.js"></script>
<!-- The snapshot layer. Not deferred: the registry must exist before any
     boot() asks Snapshots.forApp() for a store, and the engine asserts the
     store prefix against the registry before it will build one. -->
<script src="data-registry.js?v=2"></script>
<script src="snapshots.js?v=1"></script>
<!-- Per-keystroke form drafts, written to the REAL localStorage so a
     refresh cannot take an unsaved entry with it. -->
<script src="athenaeum-drafts.js?v=1"></script>
<script src="data-export.js?v=1"></script>
<script src="save-state.js?v=1"></script>
<script src="trash.js?v=1"></script>
<script src="shrink-banner.js?v=1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b0907">
<meta name="robots" content="noindex, nofollow">
<title>House Damula</title>

<!-- =============================================================
     HOUSE DAMULA — the Entertainment Studio.

     ONE DOCUMENT, SIX VIEWS. It was one page and one gallery
     until 2026-09-03; before that it was twelve separate
     documents. The lesson of that first collapse holds, and is
     why this rebuild did not go back to files: a hash route
     inside one document repaints instantly, and shares one sync
     mount, one boot and one composer. Twelve DOCUMENTS were the
     problem. Six VIEWS are not.

       #/                    the house
       #/archive             everything
       #/archive/<shelf>     the same, one shelf
       #/game/<id>           one game, in full
       #/collections         the categories
       #/collection/<name>   one of them
       #/about               the house own numbers

     The Journal was removed on 2026-09-03 — the route, the nav
     item and every link. Its ENTRIES were not: they live on each
     game record and the game page fourth column still writes
     them. Every retired hash, #journal included, still resolves.

     ONE GROUND, ONE COMPONENT
     ─────────────────────────────────────────────────────────
     Every band is the neutral warm black #0b0907 — the colour
     the About page was already on. It ran black-and-ivory, then
     black-and-sepia, then this, and the ground-flip machinery
     survived all three untouched because no component names a
     colour: they name --hd-bg. .hd-sepia is still defined in the
     stylesheet and unused, so re-grounding a band is one word.

     EVERY VIEW OPENS ON THE SAME FULL-VIEWPORT HERO, with this
     floating pill over its photograph. The home page had a hero
     of its own until 2026-09-03; one hero is the point.

     NOTHING WAS MERGED OR MOVED IN STORAGE.
     ─────────────────────────────────────────────────────────
     All ten `vault:media:*` keys still hold exactly what they
     held. `vault-data.js` is untouched. A tab was never a shelf:
     Horror reads creepypasta + trueHorror and Spicy reads spicy +
     immersive, and they always did. Reading and Anime are hidden
     from the interface, not deleted — one word each in SHELVES.

     ONE ROW, STILL
     ─────────────────────────────────────────────────────────
       vault -> vault:    the library. Seeded, ~330KB of records.
     Two new keys, `vault:featured` and `vault:house`, sit under
     the same prefix, so the snapshot, export, trash and shrink
     layers cover them with no registration change.
     ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two faces. CORMORANT GARAMOND carries every title and header:
     it is the face in brand_assets/brand_guidelines/banner &
     title_text.jpg — fine hairlines, flared POINTED serifs, high
     contrast, and caps that hold their shape at .18em of tracking.
     It replaced Bodoni Moda on 2026-09-03, because Bodoni is a
     Didone with flat unbracketed serifs and the brand mark is not.
     INTER carries every letterspaced small cap: the nav, the
     labels, the meta. Two faces; the tracking does the rest. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- SHARED WITH THE PROMPT STUDIO. promptarium.html links this same file,
     so an edit here changes two pages — and BOTH ?v= numbers have to move
     with it. A browser caches by URL, not by which page asked for it, so
     leaving the number alone after editing the file is how a phone keeps
     serving the old stylesheet to both studios indefinitely. -->
<link rel="stylesheet" href="vault-theme.css?v=5">
<!-- Every page opens on this. Preloaded, because it is the largest
     paint on all of them. -->
<link rel="preload" as="image" href="images_by_admin/vault/hero-house.jpg" fetchpriority="high">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<!-- 330KB of seeded records. Deferred so it cannot block the hero,
     which is this page's largest paint; boot() waits for
     DOMContentLoaded anyway. -->
<script src="vault-data.js" defer></script>
<!-- Generic machinery: escaping, the sheet, the toast, the reveal
     clock. It knows nothing about any data layer, and nothing
     about this skin — asclepion-theme.css is NOT linked here. -->
<script src="asclepion-ui.js?v=3"></script>
<!-- The views build strings; the game page is its own file because
     it is the one template meant to be edited; the app is the
     only file that listens, writes or knows what a hash means.
     Deferred, in order; boot() waits for DOMContentLoaded. -->
<script src="vault-views.js?v=2" defer></script>
<script src="vault-game.js?v=2" defer></script>
<script src="vault-app.js?v=2" defer></script>
<script src="topbar.js?v=6" defer></script>
</head>
<body class="hd">

<a class="hd-skip" href="#vtRoot">Skip to the archive</a>

<!-- ══ THE TOP BAR ═══════════════════════════════════════════
     A FLOATING PILL, CENTRED, with the wordmark in the middle of
     the links rather than off to one side — read frame by frame
     off cb92e312e4b74cf8d1acc513866185e1.mp4. It sits ON the
     hero's photograph, which every view now opens with, and takes
     a frosted ground of its own only once you have scrolled off
     it.

     The monogram and the wordmark are STATIC MARKUP; only the
     links and the Tonight count are painted. A cloud pull that
     re-created the chrome could not replay the page's entrance,
     and the brand is the one thing that must never flicker. -->
<header class="hd-top" id="hdTop">
  <nav class="hd-pill" aria-label="Primary">
    <span class="hd-pill__side" id="hdNavL"></span>

    <a class="hd-brand" href="#/" aria-label="House Damula — home">
      <span class="hd-mono" aria-hidden="true">
        <svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="1.15"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- An H and a D sharing one stem. The bowl is drawn as two
               arcs rather than one so it keeps its thick/thin
               contrast at 34px. -->
          <path d="M4 3.5v27M17.5 3.5v27M4 17h13.5"/>
          <path d="M17.5 3.5h5.6a12 13.5 0 0 1 0 27h-5.6"/>
          <path d="M17.5 8.2h4.9a8.6 10.3 0 0 1 0 20.6h-4.9" opacity=".42"/>
        </svg>
      </span>
      <span class="hd-word">House Damula</span>
    </a>

    <span class="hd-pill__side" id="hdNavR"></span>
  </nav>

  <div class="hd-topacts">
    <button type="button" class="hd-tonight" id="hdTonight" data-act="tonight" hidden>
      Tonight <i></i>
    </button>
    <span class="hd-topdiv" aria-hidden="true"></span>
    <button type="button" class="hd-iconbtn" id="hdSearchBtn" data-act="find"
      aria-label="Search the archive">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <circle cx="8.6" cy="8.6" r="5.6"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
    </button>
    <button type="button" class="hd-burger" id="hdBurger" data-act="menu"
      aria-label="Open the menu" aria-expanded="false">
      <span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
  </div>
</header>

<!-- The sigils. One per shelf: a card falls back to its shelf's
     mark when an item has no cover, and each tab carries its own.
     Drawn once, referenced by <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="sg-wave"><path d="M1.8 8v0M4.4 5.6v4.8M7 2.9v10.2M9.6 4.9v6.2M12.2 6.6v2.8M14.6 8v0"/></g>
<g id="sg-eye"><path d="M1.4 8S4 3.7 8 3.7 14.6 8 14.6 8 12 12.3 8 12.3 1.4 8 1.4 8Z"/><circle cx="8" cy="8" r="1.9"/></g>
<g id="sg-flame"><path d="M8 1.7c2.1 3.1 4.1 4.2 4.1 7.1a4.1 4.1 0 0 1-8.2 0c0-1.65.92-2.5 1.64-3.3.5.72 1.02 1.24 1.44 1.24.6 0 1.02-1.44 1.02-5.04Z"/></g>
<g id="sg-play"><circle cx="8" cy="8" r="6.3"/><path d="M6.5 5.4 10.7 8l-4.2 2.6Z"/></g>
<g id="sg-moon"><path d="M10.6 2.3a6.1 6.1 0 1 0 0 11.4 6.9 6.9 0 0 1 0-11.4Z"/><circle cx="12.6" cy="4.4" r=".7" fill="currentColor" stroke="none"/></g>
<g id="sg-book"><path d="M8 4.3S6.1 2.9 2.2 3.3v9C6.1 11.9 8 13.3 8 13.3s1.9-1.4 5.8-1v-9C9.9 2.9 8 4.3 8 4.3Z"/><path d="M8 4.3v9"/></g>
<g id="sg-spark"><path d="M6 1.6 7.15 5.05 10.6 6.2 7.15 7.35 6 10.8 4.85 7.35 1.4 6.2l3.45-1.15Z"/><path d="M11.6 8.6l.66 1.94 1.94.66-1.94.66-.66 1.94-.66-1.94-1.94-.66 1.94-.66Z"/></g>
<g id="sg-pad"><path d="M5.7 2.6h4.6v3.1h3.1v4.6h-3.1v3.1H5.7v-3.1H2.6V5.7h3.1Z"/></g>
<g id="sg-all"><rect x="2.4" y="2.4" width="4.7" height="4.7" rx="1"/><rect x="8.9" y="2.4" width="4.7" height="4.7" rx="1"/><rect x="2.4" y="8.9" width="4.7" height="4.7" rx="1"/><rect x="8.9" y="8.9" width="4.7" height="4.7" rx="1"/></g>
<!-- The house ornament: a four-point star on a hairline. It sits
     under every page title and in the middle of the footer, and
     it is the one drawn flourish in the whole design. -->
<g id="sg-orn"><path d="M8 1.6 9.1 6.9 14.4 8 9.1 9.1 8 14.4 6.9 9.1 1.6 8 6.9 6.9Z"/></g>
</defs></svg>

<main class="hd-main" id="vtRoot" tabindex="-1"></main>

<footer class="hd-foot" id="hdFoot">
  <p class="hd-foot__left">
    <span>&copy; House Damula MMXXV</span>
    <span class="hd-foot__bar" aria-hidden="true"></span>
    <span>Built for the stories that stay</span>
  </p>
  <span class="hd-foot__orn" aria-hidden="true">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
      stroke-width="1" stroke-linejoin="round"><use href="#sg-orn"></use></svg>
  </span>
  <nav class="hd-foot__right" aria-label="The house">
    <button type="button" data-act="privacy">Privacy</button>
    <button type="button" data-act="export">Your data</button>
    <a href="#/about">About</a>
  </nav>
</footer>

<!-- ══ SEARCH ════════════════════════════════════════════════
     A glyph in the bar rather than a field: the references show a
     glyph, and a permanent input in a 90px editorial bar reads as
     an admin panel. It opens over the page, searches live, and
     Enter hands the query to the Archive — where it becomes a
     token you can see and clear, so a filtered library can never
     be mistaken for an empty one. -->
<div class="hd-find" id="hdFind" role="dialog" aria-modal="true" aria-label="Search the archive" hidden>
  <div class="hd-find__box">
    <div class="hd-find__field">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <circle cx="8.6" cy="8.6" r="5.6"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
      <input id="hdFindIn" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search the archive" aria-label="Search the archive">
      <button type="button" class="hd-find__x" data-act="find-close">Esc</button>
    </div>
    <div class="hd-find__out" id="hdFindOut" role="listbox" aria-label="Results"></div>
  </div>
</div>

<!-- The host module's own ids. Reusing the module means reusing
     its DOM contract. -->
<div class="asc-sheetbg" id="ascSheetBg" role="dialog" aria-modal="true" aria-label="Detail">
  <div class="asc-sheet" id="ascSheet"></div>
</div>
<div class="asc-toast" id="ascToast" role="status" aria-live="polite"></div>

<!-- ══ THE COMPOSER ══════════════════════════════════════════
     Unchanged from the page this replaced, ids included. One form
     serves add and edit, because correcting an item and creating
     one want the same nine fields and two forms would drift. Its
     own sheet rather than the host's: it opens FROM the detail
     sheet, carries a keystroke draft and traps Tab, and two
     surfaces sharing one host element would fight over all three.

     THE IDS ARE LOAD-BEARING. AthDraft scopes a draft by them, so
     an entry half-typed before this rebuild is still recoverable
     after it. -->
<div class="vt-cmpbg" id="cmpScrim" hidden></div>
<section class="vt-cmp" id="cmp" role="dialog" aria-modal="true" aria-labelledby="cmpTitle" hidden>
  <div class="vt-cmp__top">
    <h2 class="hd-plate" id="cmpTitle">Add to the archive</h2>
    <button type="button" class="asc-btn asc-btn--quiet asc-btn--sm" id="cmpX"
      style="margin-left:auto">Close</button>
  </div>

  <form class="vt-cmp__body" id="cmpForm">
    <div class="vt-msg" id="cmpMsg" role="status"></div>

    <div class="vt-f vt-f--wide">
      <label class="asc-label" for="cmpUrl">Link</label>
      <input class="asc-input" id="cmpUrl" type="url" inputmode="url" autocomplete="off"
        spellcheck="false" placeholder="https://…">
      <p class="vt-hint">Paste a link and the title, creator and cover fill themselves in where they can be read.</p>
    </div>

    <div class="vt-f vt-f--wide">
      <label class="asc-label" for="cmpTitleIn">Title</label>
      <input class="asc-input" id="cmpTitleIn" type="text" autocomplete="off" placeholder="What is it called?">
    </div>

    <div class="vt-f">
      <label class="asc-label" for="cmpShelf">Shelf</label>
      <select class="asc-select" id="cmpShelf"></select>
    </div>

    <div class="vt-f">
      <label class="asc-label" for="cmpCat">Collection</label>
      <input class="asc-input" id="cmpCat" type="text" autocomplete="off" list="cmpCatList"
        placeholder="Type or pick one">
      <datalist id="cmpCatList"></datalist>
    </div>

    <div class="vt-f">
      <label class="asc-label" for="cmpCreator">Creator</label>
      <input class="asc-input" id="cmpCreator" type="text" autocomplete="off" placeholder="Channel, author, artist, studio">
    </div>

    <div class="vt-f">
      <label class="asc-label" for="cmpLen">Length</label>
      <input class="asc-input" id="cmpLen" type="text" autocomplete="off" placeholder="42 min · 6 eps · 310 pp">
    </div>

    <div class="vt-f vt-f--wide">
      <label class="asc-label" for="cmpCover">Cover image</label>
      <input class="asc-input" id="cmpCover" type="url" inputmode="url" autocomplete="off"
        spellcheck="false" placeholder="https://… (optional)">
    </div>

    <div class="vt-prev" id="cmpPrev" hidden>
      <img id="cmpPrevImg" alt="">
      <span class="vt-prev__meta"><b id="cmpPrevTitle"></b><span id="cmpPrevSub"></span></span>
    </div>

    <div class="vt-f vt-f--wide">
      <span class="asc-label">Rating</span>
      <div class="vt-stars" id="cmpStars">
        <button type="button" class="vt-star" data-n="1" aria-label="1 star">★</button>
        <button type="button" class="vt-star" data-n="2" aria-label="2 stars">★</button>
        <button type="button" class="vt-star" data-n="3" aria-label="3 stars">★</button>
        <button type="button" class="vt-star" data-n="4" aria-label="4 stars">★</button>
        <button type="button" class="vt-star" data-n="5" aria-label="5 stars">★</button>
        <button type="button" class="asc-btn asc-btn--quiet asc-btn--sm" id="cmpStarsClear">Clear</button>
      </div>
    </div>

    <div class="vt-f vt-f--wide">
      <label class="asc-label" for="cmpDesc">Notes</label>
      <textarea class="asc-textarea" id="cmpDesc" placeholder="Why is this here? What is it for?"></textarea>
    </div>

    <div class="vt-togs">
      <button type="button" class="asc-btn asc-btn--sm" id="cmpFav">☆ Favourite</button>
      <button type="button" class="asc-btn asc-btn--sm" id="cmpQueue">＋ Tonight</button>
    </div>
  </form>

  <div class="vt-cmp__foot">
    <button class="asc-btn asc-btn--primary" id="cmpSave" type="button">Save</button>
    <button class="asc-btn asc-btn--quiet" id="cmpAgain" type="button">Save &amp; add another</button>
    <button class="asc-btn asc-btn--danger asc-btn--sm vt-del" id="cmpDel" type="button" hidden>Delete</button>
  </div>
</section>

<button class="hd-fab" id="addFab" aria-label="Add something to the archive">
  <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"></path></svg>
</button>

</body>
</html>
