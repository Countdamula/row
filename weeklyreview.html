<!DOCTYPE html>
<html lang="en" class="mn-root">
<head>
<script src="local-store-idb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#120C08">
<title>Weekly Review</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3" defer></script>
<script src="main-sync.js?v=2" defer></script>
<!-- data-registry.js then snapshots.js, both BEFORE the backup adapter:
     the adapter is now a three-line call into the shared engine, and the
     engine asserts its prefix against the registry before it will build a
     store. Same loading mode as the adapter, or execution order is lost. -->
<script src="data-registry.js?v=1" defer></script>
<script src="snapshots.js?v=1" defer></script>
<script src="data-export.js?v=1" defer></script>
<script src="save-state.js?v=1" defer></script>
<script src="trash.js?v=1" defer></script>
<script src="shrink-banner.js?v=1" defer></script>
<script src="main-backup.js?v=1" defer></script>
<script src="topbar.js?v=4" defer></script>

<!-- Everything this page reads. palaestra-data.js and today-data.js are
     here for their storage keys, which the snapshot reads directly;
     futureself-data.js is here because finishing a week writes ONE line
     into fs:evidence through it. -->
<script src="palaestra-data.js?v=6" defer></script>
<script src="today-data.js?v=1" defer></script>
<script src="futureself-data.js?v=1" defer></script>
<script src="weeklyreview-data.js?v=1" defer></script>
<script src="main-hero.js?v=1" defer></script>
<script src="weeklyreview-ui.js?v=1" defer></script>

<link rel="stylesheet" href="main-theme.css?v=1">
</head>
<body class="mn">

<main>
  <div class="mn-shell">
    <!-- MAIN'S NAV — the same three entries in the same order as
         index.html and futureself.html. Self-Care left this row on
         2026-08-25; it is its own page now, The Asclepion
         (asclepion.html), reached from the circle menu. -->
    <nav class="mn-tabs mn-join-near" id="mnTabs" aria-label="Main">
      <button type="button" class="mn-tab" data-act="go" data-href="index.html">Main</button>
      <button type="button" class="mn-tab" data-act="go" data-href="routine.html">Daily Routine</button>
      <button type="button" class="mn-tab" data-act="go" data-href="futureself.html">Future Self</button>
      <button type="button" class="mn-tab active" aria-current="page">Weekly Review</button>
    </nav>

    <section class="mn-section" id="wrHeader"></section>
    <section class="mn-section" id="wrWeek" style="padding-top:0"></section>
    <section class="mn-section" id="wrWrite"></section>
    <section class="mn-section" id="wrPast"></section>

    <section class="mn-section">
      <hr class="mn-rule">
      <div class="mn-row" style="justify-content:center;margin-top:var(--mn-5)">
        <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="index.html">Today</button>
        <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="futureself.html">Future self</button>
        <button type="button" class="mn-btn mn-btn--sm" data-act="go" data-href="palaestra.html">Fitness Studio</button>
      </div>
    </section>
  </div>
</main>

<div class="mn-sheetbg" id="mnSheetBg" role="dialog" aria-modal="true" aria-label="Editor">
  <div class="mn-sheet" id="mnSheet"></div>
</div>
<div class="mn-toast" id="mnToast" role="status" aria-live="polite"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  LocalStoreIDB.ready().then(function () {
    if (window.MainBackup) { try { window.MainBackup.boot(); } catch (e) {} }

    if (window.MainHero) {
      window.MainHero.mount({
        variant: 'full',
        dateText: new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }),
        medal: { lead: 'This week', main: '—' }
      });
    }

    if (window.WeeklyReviewUI) {
      try { window.WeeklyReviewUI.boot(); } catch (err) { bootError('Weekly Review', err); }
    }

    // THREE rows. This page reads all of them and writes to two:
    // `wr:` on goals, and one line of `fs:evidence` on futureself.
    // main-sync.js sets handoff:true on every one — goals becomes
    // multi-document for the first time here, and without handoff a
    // write followed by a tap through to Today would be lost.
    if (window.MainSync) {
      window.MainSync.mount(['goals', 'palaestra', 'futureself'], {
        onApplied: function () { if (window.WeeklyReviewUI) window.WeeklyReviewUI.renderAll(); }
      });
    }
  });
});

function bootError(what, err) {
  try {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:3200;background:#3a0d0d;color:#ffdada;padding:14px 16px;font:13px/1.5 monospace;white-space:pre-wrap;';
    bar.textContent = what + ' failed to load: ' + (err && err.message ? err.message : err);
    document.body.appendChild(bar);
  } catch (e) {}
}
</script>
</body>
</html>
