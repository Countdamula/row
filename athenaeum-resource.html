<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource — The Athenaeum</title>

<!-- MUST be first and MUST NOT be deferred: local-store-idb.js replaces
     window.localStorage with an IndexedDB-backed shim, and every later
     script assumes the shim is already installed. -->
<script src="local-store-idb.js"></script>
<!-- The snapshot layer. Not deferred: the registry must exist before any
     boot() asks Snapshots.forApp() for a store, and the engine asserts the
     store prefix against the registry before it will build one. -->
<script src="data-registry.js?v=1"></script>
<script src="snapshots.js?v=1"></script>
<script src="data-export.js?v=1"></script>
<script src="save-state.js?v=1"></script>
<script src="trash.js?v=1"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Italiana&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Tokens, resets, shared type and buttons — identical to
   athenaeum-resources.html by construction. */
:root{
  --ath-ground:#06080B;
  --ath-paper:#0A0C0F;
  --ath-paper-2:#12161C;
  --ath-panel:#171C24;

  --ath-void:#0A0C0F;
  --ath-slate:#13171C;
  --ath-raise:#1C212A;

  --ath-ink:#F2EFE8;
  --ath-ink-2:rgba(242,239,232,.72);
  --ath-ink-3:rgba(242,239,232,.52);
  --ath-ink-4:rgba(242,239,232,.38);
  --ath-rule:rgba(242,239,232,.13);
  --ath-rule-soft:rgba(242,239,232,.065);

  --ath-verd:#3D7668;    --ath-verd-rgb:61,118,104;   --ath-verd-hi:#5A9E8C;
  --ath-brass:#9A7830;   --ath-brass-rgb:154,120,48;  --ath-brass-hi:#C9A458;
  --ath-bad:#A2453E;     --ath-bad-rgb:162,69,62;

  --ath-onDark:#F2EFE8;
  --ath-onDark-2:rgba(242,239,232,.70);
  --ath-onDark-3:rgba(242,239,232,.42);
  --ath-onDark-4:rgba(242,239,232,.22);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:18px;
  --sp-5:26px; --sp-6:38px; --sp-7:56px; --sp-8:84px; --sp-9:120px;

  --ath-r-sm:2px; --ath-r:3px; --ath-r-lg:4px;

  --ath-display:"Italiana", Didot, "Bodoni MT", Georgia, serif;
  --ath-hero-face:"Bodoni Moda", Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
  --ath-prose:"Newsreader", Georgia, "Times New Roman", serif;
  --ath-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ath-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --ath-spring:cubic-bezier(.34,1.32,.64,1);
  --ath-ease:cubic-bezier(.32,.72,0,1);
  --ath-pull:cubic-bezier(.16,.84,.24,1);

  --ath-lift:0 1px 0 rgba(242,239,232,.055) inset, 0 14px 30px -22px rgba(0,0,0,.85);
  --ath-lift-2:0 1px 0 rgba(242,239,232,.085) inset, 0 30px 60px -30px rgba(0,0,0,.95), 0 6px 18px -12px rgba(0,0,0,.6);
  --ath-lift-dark:0 30px 70px -34px rgba(0,0,0,.9), 0 6px 20px -12px rgba(0,0,0,.6);

  --ath-gut:clamp(20px, 4.6vw, 76px);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--ath-paper); color:var(--ath-ink);
  font-family:var(--ath-ui); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}
img{max-width:100%; display:block}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--ath-verd-hi); outline-offset:3px}
.ath-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ath-sheet{width:100%; background:var(--ath-paper); overflow:clip}

/* Fine tooth. `overlay` rather than `multiply`: on a near-black ground
   multiply multiplies toward black and does nothing at all, so the grain
   adds light instead of subtracting it. */
.ath-grain{
  position:fixed; inset:0; pointer-events:none; z-index:9; opacity:.28; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.28'/></svg>");
}

/* ---------- shared type -------------------------------------------- */
.ath-eyebrow{
  display:flex; align-items:center; gap:var(--sp-3);
  font-family:var(--ath-ui); font-size:11px; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ath-ink-2);
}
.ath-eyebrow::before{content:""; width:42px; height:1px; background:var(--ath-brass-hi); flex:none}
.ath-h1{
  font-family:var(--ath-display); font-weight:400;
  font-size:clamp(44px, 7.4vw, 104px); line-height:.98; letter-spacing:.02em;
  text-transform:uppercase; margin:0;
}
.ath-h3{
  font-family:var(--ath-display); font-weight:400;
  font-size:clamp(20px, 2.3vw, 28px); line-height:1.15; letter-spacing:.05em;
  text-transform:uppercase; margin:0;
}
.ath-lede{font-family:var(--ath-prose); font-size:17px; line-height:1.68; color:var(--ath-ink-2); margin:0}
.ath-micro{
  font-family:var(--ath-ui); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-ink-3);
}
/* Numerals are Newsreader, never Italiana: Italiana's zero is
   indistinguishable from a capital O, so "2026" reads as "2o26". Every
   figure on this page goes through .ath-num or .ath-prose. */
.ath-num{
  font-family:var(--ath-prose); font-variant-numeric:lining-nums tabular-nums;
}

/* ---------- buttons ------------------------------------------------- */
.ath-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  padding:12px 22px; border:1px solid var(--ath-ink); background:transparent;
  color:var(--ath-ink); font-size:12.5px; font-weight:500; letter-spacing:.06em;
  border-radius:var(--ath-r-sm);
  transition:background-color .22s var(--ath-ease), color .22s var(--ath-ease),
             transform .22s var(--ath-spring), border-color .22s var(--ath-ease);
}
.ath-btn:hover{background:var(--ath-ink); color:var(--ath-paper); transform:translateY(-1px)}
.ath-btn:active{transform:translateY(0)}
.ath-btn-solid{background:var(--ath-ink); color:var(--ath-paper)}
.ath-btn-solid:hover{background:var(--ath-verd); border-color:var(--ath-verd); color:#fff}
.ath-btn-sm{padding:8px 14px; font-size:11.5px}
.ath-btn-ghost{border-color:var(--ath-rule); color:var(--ath-ink-2)}
.ath-btn-ghost:hover{background:var(--ath-ink); border-color:var(--ath-ink); color:var(--ath-paper)}
.ath-btn-light{border-color:var(--ath-onDark-4); color:var(--ath-onDark)}
.ath-btn-light:hover{background:var(--ath-onDark); color:var(--ath-void); border-color:var(--ath-onDark)}
.ath-btn-danger{border-color:rgba(var(--ath-bad-rgb),.55); color:#D2726A}
.ath-btn-danger:hover{background:var(--ath-bad); border-color:var(--ath-bad); color:#fff}
.ath-btn-icon{
  width:34px; height:34px; padding:0; border:1px solid var(--ath-rule);
  border-radius:var(--ath-r-sm); color:var(--ath-ink-2); font-size:14px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background-color .2s var(--ath-ease), color .2s var(--ath-ease), transform .2s var(--ath-spring);
}
.ath-btn-icon:hover{background:var(--ath-ink); color:var(--ath-paper); transform:translateY(-1px)}

/* =====================================================================
   ONE PAGE, THREE TEMPLATES.

   A resource's page is chosen by its medium, because the three media want
   genuinely different things from a page and pretending otherwise would
   serve none of them:

     reader   Book                     a table of contents and a column of prose
     page     Paper Course Article
              Person Dataset Tool      a title, a plate, and a margin of facts
     media    Video Podcast Lecture    a player, a queue, and notes with times

   Everything above this line is shared, and so is the modal, the toast and
   the rich-text editor below it.
   ===================================================================== */
.rs-shell{width:100%; min-height:100vh; background:var(--ath-paper); overflow:clip}

/* The way back. Every template opens with it, in the same place, because
   the Library is where you came from and where you are going next. */
.rs-back{
  display:inline-flex; align-items:center; gap:9px;
  font-family:var(--ath-ui); font-size:11.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ath-onDark-2);
  transition:color .2s var(--ath-ease), gap .2s var(--ath-ease);
}
.rs-back:hover{color:var(--ath-onDark); gap:14px}
.rs-back.on-paper{color:var(--ath-ink-3)}
.rs-back.on-paper:hover{color:var(--ath-ink)}

.rs-tags{display:flex; flex-wrap:wrap; gap:7px}
.rs-tag{
  padding:5px 12px; border:1px solid var(--ath-rule); border-radius:999px;
  font-family:var(--ath-ui); font-size:11px; letter-spacing:.06em; color:var(--ath-ink-3);
  transition:border-color .2s var(--ath-ease), color .2s var(--ath-ease);
}
.rs-tag:hover{border-color:var(--ath-verd-hi); color:var(--ath-verd-hi)}
.rs-tag.on-dark{border-color:var(--ath-onDark-4); color:var(--ath-onDark-2)}
.rs-tag.on-dark:hover{border-color:var(--ath-onDark); color:var(--ath-onDark)}

/* Shared prose treatment for every pasted body and chapter. Pasted markup
   arrives stripped of style and class (see §SANITISE), so these rules are
   the ONLY thing dressing it — which is exactly why a chapter from a white
   PDF lands on this page's ground instead of bringing its own. */
.rs-rich{
  font-family:var(--ath-prose); font-size:17.5px; line-height:1.78; color:var(--ath-ink-2);
}
.rs-rich > *:first-child{margin-top:0}
.rs-rich p{margin:0 0 1.15em}
.rs-rich h2{
  margin:2em 0 .7em; font-family:var(--ath-display); font-weight:400;
  font-size:26px; line-height:1.2; letter-spacing:.05em; text-transform:uppercase; color:var(--ath-ink);
}
.rs-rich h3{margin:1.7em 0 .6em; font-family:var(--ath-display); font-weight:400; font-size:21px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ath-ink)}
.rs-rich h4{margin:1.5em 0 .5em; font-family:var(--ath-ui); font-size:12px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-brass-hi)}
.rs-rich strong{color:var(--ath-ink); font-weight:600}
.rs-rich em{font-style:italic}
.rs-rich a{color:var(--ath-verd-hi); text-decoration:underline; text-underline-offset:3px}
.rs-rich ul,.rs-rich ol{margin:0 0 1.15em; padding-left:1.4em}
.rs-rich li{margin:0 0 .45em}
.rs-rich blockquote{
  margin:1.6em 0; padding:2px 0 2px var(--sp-5); border-left:1px solid var(--ath-brass);
  font-size:20px; line-height:1.6; color:var(--ath-ink); font-style:italic;
}
.rs-rich hr{border:0; height:1px; background:var(--ath-rule); margin:2.2em 0}
.rs-rich img{margin:1.6em 0; border-radius:var(--ath-r)}
.rs-rich code{font-family:var(--ath-mono); font-size:.88em; background:var(--ath-paper-2); padding:2px 6px; border-radius:2px}
.rs-rich pre{background:var(--ath-paper-2); padding:var(--sp-4); border-radius:var(--ath-r); overflow:auto}
.rs-rich figcaption{font-size:13px; color:var(--ath-ink-4); text-align:center; margin-top:-1em}

/* A contenteditable that is visually indistinguishable from the rendered
   article, so editing is not a mode you enter but a place you click. */
[data-rich]{outline:none; border-radius:var(--ath-r); transition:box-shadow .2s var(--ath-ease)}
[data-rich]:focus{box-shadow:0 0 0 1px var(--ath-rule), 0 0 0 6px rgba(var(--ath-verd-rgb),.10)}
[data-rich].is-empty::before{
  content:attr(data-ph); color:var(--ath-ink-4); pointer-events:none; display:block;
}

/* =====================================================================
   §READER — Books. Reference 2: a full-bleed image, the way back sitting
   on it, a Didone title, the dek, the person, then the date and the tags
   on one rule; and below, a sticky table of contents beside the prose.
   ===================================================================== */
.rd-hero{
  position:relative; min-height:clamp(420px, 66vh, 620px);
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:96px var(--ath-gut) var(--sp-6);
  background:var(--ath-void); color:var(--ath-onDark); overflow:hidden; isolation:isolate;
  --ath-out:0;
  clip-path:ellipse(calc(420% - var(--ath-out) * 300%) calc(100% - var(--ath-out) * 8%) at 50% 0%);
}
.rd-hero .ath-plate{
  position:absolute; inset:0; z-index:-3;
  transform:scale(calc(1 + var(--ath-out) * .06));
  filter:blur(calc(var(--ath-out) * 6px));
  opacity:calc(1 - var(--ath-out) * .45);
  background-size:cover; background-position:center;
}
/* House rule on images: a colour treatment layer, then a scrim graded so
   the title always sits on the darkest part of the picture, ending on the
   page's exact ground so the plate dissolves rather than stopping. */
.rd-hero .ath-plate::after{
  content:""; position:absolute; inset:0; background:var(--ath-slate); mix-blend-mode:multiply; opacity:.5;
}
/* The coverless plate. Rings large enough to read as an engraving at hero
   scale rather than as the thumbnail texture scaled up. */
.rd-hero .ath-plate.is-drawn{
  background:
    repeating-radial-gradient(circle at 72% 28%, rgba(242,239,232,.055) 0 1px, transparent 1px 46px),
    linear-gradient(148deg, hsl(var(--h,210) 26% 21%), hsl(calc(var(--h,210) + 24) 24% 8%));
}
.rd-hero .ath-plate.is-drawn::after{opacity:.2}
.rd-hero::before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 800px 560px at 18% 88%, rgba(var(--ath-brass-rgb),.20) 0%, transparent 64%),
    linear-gradient(180deg, rgba(8,10,13,.72) 0%, rgba(8,10,13,.18) 30%, rgba(8,10,13,.88) 82%, var(--ath-void) 100%);
}
.rd-hero-in{position:relative; z-index:2; max-width:1000px}
.rd-hero .rs-back{margin-bottom:var(--sp-5)}
/* Bodoni for every piece of text inside a plate. Same rule as every other
   hero in the Athenaeum. */
.rd-hero, .rd-hero .rd-title, .rd-hero .rs-back{font-family:var(--ath-hero-face); font-optical-sizing:auto}
.rd-title{
  margin:0; font-family:var(--ath-hero-face); font-optical-sizing:auto; font-weight:500;
  font-size:clamp(34px, 4.6vw, 62px); line-height:1.04; letter-spacing:-.005em;
}
.rd-dek{
  margin:var(--sp-4) 0 0; max-width:720px; font-family:var(--ath-prose);
  font-size:17px; line-height:1.62; color:var(--ath-onDark-2);
}
.rd-byline{
  display:flex; align-items:center; gap:var(--sp-5); flex-wrap:wrap;
  margin-top:var(--sp-6);
}
.rd-person{display:flex; align-items:center; gap:var(--sp-3)}
.rd-person .rs-face{width:38px; height:38px; font-size:13px}
.rd-person b{display:block; font-family:var(--ath-ui); font-weight:500; font-size:13.5px; color:var(--ath-onDark)}
.rd-person span{font-family:var(--ath-ui); font-size:11.5px; color:var(--ath-onDark-3)}
.rd-acts{margin-left:auto; display:flex; gap:var(--sp-2); flex-wrap:wrap}
/* The rule under the byline carries the date on the left and the tags on
   the right, exactly as the reference does. */
.rd-strip{
  position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-5); flex-wrap:wrap; margin-top:var(--sp-6); padding-top:var(--sp-4);
  border-top:1px solid var(--ath-onDark-4);
}
.rd-strip .ath-micro{color:var(--ath-onDark-3)}

.rd-body{
  display:grid; grid-template-columns:250px minmax(0,1fr); gap:var(--sp-8);
  max-width:1180px; margin:0 auto; padding:var(--sp-8) var(--ath-gut) var(--sp-9); align-items:start;
}
@media (max-width:940px){ .rd-body{grid-template-columns:1fr; gap:var(--sp-6)} }

.rd-toc{position:sticky; top:var(--sp-5); display:grid; gap:var(--sp-4)}
@media (max-width:940px){ .rd-toc{position:static} }
.rd-toc h4{margin:0; font-family:var(--ath-ui); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-ink-3)}
.rd-toc-list{display:grid; gap:1px}
/* The active chapter is marked with a left rule, as in the reference. */
.rd-chap{
  position:relative; display:block; width:100%; text-align:left;
  padding:8px 0 8px var(--sp-4); margin-left:-1px;
  border-left:1px solid var(--ath-rule-soft);
  font-family:var(--ath-prose); font-size:14px; line-height:1.45; color:var(--ath-ink-4);
  transition:color .2s var(--ath-ease), border-color .2s var(--ath-ease);
}
.rd-chap:hover{color:var(--ath-ink-2); border-color:var(--ath-rule)}
.rd-chap.is-on{color:var(--ath-ink); border-color:var(--ath-brass-hi)}
.rd-chap.is-read::after{
  content:"✓"; position:absolute; right:0; top:8px; font-size:10px; color:var(--ath-verd-hi);
}
.rd-toc-foot{display:grid; gap:var(--sp-2); padding-top:var(--sp-3); border-top:1px solid var(--ath-rule-soft)}
.rd-progress{display:flex; align-items:center; gap:var(--sp-3)}
.rd-progress .lb-meter{flex:1; height:2px; background:var(--ath-rule-soft); border-radius:2px; overflow:hidden}
.rd-progress .lb-meter i{display:block; height:100%; background:var(--ath-verd-hi)}
.rd-progress span{font-family:var(--ath-prose); font-variant-numeric:lining-nums tabular-nums;
  font-size:11.5px; color:var(--ath-ink-4)}

.rd-main{min-width:0; max-width:74ch}
.rd-chap-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:var(--sp-5); margin-bottom:var(--sp-5);
}
.rd-chap-title{
  margin:0; font-family:var(--ath-display); font-weight:400;
  font-size:clamp(26px,3vw,36px); line-height:1.12; letter-spacing:.045em; text-transform:uppercase;
  color:var(--ath-ink);
}
.rd-chap-sub{margin:var(--sp-2) 0 0; font-family:var(--ath-prose); font-size:15px; color:var(--ath-ink-3)}
.rd-chap-meta{display:flex; gap:var(--sp-4); align-items:center; margin-top:var(--sp-3)}
.rd-chap-acts{display:flex; gap:var(--sp-2); flex:none; flex-wrap:wrap; justify-content:flex-end}

/* Notes sit in their own surface below the chapter, raised a step — the
   one thing on this page that is yours rather than the book's. */
.rd-notes{
  margin-top:var(--sp-8); padding:var(--sp-5); background:var(--ath-paper-2);
  border-radius:var(--ath-r); box-shadow:var(--ath-lift);
}
.rd-notes h4{
  margin:0 0 var(--sp-3); font-family:var(--ath-ui); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-brass-hi);
}
.rd-notes .rs-rich{font-size:15.5px; line-height:1.7}

/* =====================================================================
   §PAGE — Papers, Courses, Articles, People, Datasets, Tools.
   Reference 3: a centred title with tag pills under it, a wide plate, and
   then a narrow rail of facts beside the prose with an accented lede.
   ===================================================================== */
.pg-wrap{max-width:1060px; margin:0 auto; padding:112px var(--ath-gut) var(--sp-9)}
.pg-top{text-align:center; display:grid; gap:var(--sp-5); justify-items:center}
/* The way back and the two controls share one rule above the title, so the
   title arrives clean. Centring Edit and Delete under the headline made
   them the second thing on the page, which they are not. */
.pg-bar{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-4); margin-bottom:var(--sp-3);
}
.pg-bar-acts{display:flex; gap:var(--sp-2)}
.pg-title{
  margin:0; max-width:22ch; font-family:var(--ath-display); font-weight:400;
  font-size:clamp(30px, 4vw, 50px); line-height:1.12; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ath-ink);
}
.pg-kind{
  font-family:var(--ath-ui); font-size:10.5px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ath-brass-hi);
}
.pg-plate{
  position:relative; margin:var(--sp-7) 0 0; aspect-ratio:16/7; overflow:hidden;
  border-radius:var(--ath-r); background:var(--ath-paper-2); box-shadow:var(--ath-lift-2);
}
.pg-plate img{width:100%; height:100%; object-fit:cover}
.pg-plate::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 52%, rgba(8,10,13,.55) 100%);
}
.pg-plate .lb-plate span{font-size:64px}
/* A Person gets a portrait plate, not a landscape one — a face wants its
   own proportion. */
.pg-plate.is-portrait{aspect-ratio:auto; width:min(300px,60vw); margin-left:auto; margin-right:auto}
.pg-plate.is-portrait::before{content:""; display:block; padding-top:125%}
.pg-plate.is-portrait img{position:absolute; inset:0}

.pg-body{
  display:grid; grid-template-columns:186px minmax(0,1fr); gap:var(--sp-7);
  margin-top:var(--sp-8); align-items:start;
}
@media (max-width:860px){ .pg-body{grid-template-columns:1fr; gap:var(--sp-5)} }
/* Tight on purpose: reference 3's margin carries two facts, ours carries
   eight, and at the reference's rhythm the last of them would sit level
   with the middle of the article. */
.pg-meta{position:sticky; top:var(--sp-5); display:grid; gap:var(--sp-3)}
@media (max-width:860px){ .pg-meta{position:static; grid-template-columns:repeat(auto-fit,minmax(140px,1fr))} }
.pg-mrow{display:grid; gap:4px; padding-bottom:var(--sp-3); border-bottom:1px solid var(--ath-rule-soft)}
.pg-mrow:last-child{border-bottom:0; padding-bottom:0}
.pg-mrow > span{font-family:var(--ath-ui); font-size:9.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-ink-4)}
.pg-mrow b{font-family:var(--ath-prose); font-weight:400; font-size:14px; color:var(--ath-ink-2);
  font-variant-numeric:lining-nums tabular-nums}
.pg-mperson{display:flex; align-items:center; gap:10px}
.pg-mperson .rs-face{width:30px; height:30px; font-size:11px}
.pg-main{min-width:0; max-width:70ch}
/* The reference sets its opening paragraph in the accent colour. Ours is
   verdigris, and it is applied to the first paragraph only. */
.pg-main .rs-rich > p:first-of-type{color:var(--ath-verd-hi); font-size:18.5px; line-height:1.7}

/* Tails — the blocks a particular medium earns under its prose. */
.pg-tail{margin-top:var(--sp-8); padding-top:var(--sp-6); border-top:1px solid var(--ath-rule-soft)}
.pg-tail h4{
  margin:0 0 var(--sp-4); font-family:var(--ath-ui); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-brass-hi);
}
.pg-link{
  display:flex; align-items:center; gap:var(--sp-4); padding:var(--sp-4);
  background:var(--ath-paper-2); border-radius:var(--ath-r); box-shadow:var(--ath-lift);
  transition:transform .22s var(--ath-spring), box-shadow .22s var(--ath-ease);
}
.pg-link:hover{transform:translateY(-2px); box-shadow:var(--ath-lift-2)}
.pg-link-n{flex:1; min-width:0}
.pg-link-n b{display:block; font-family:var(--ath-display); font-weight:400; font-size:19px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ath-ink)}
.pg-link-n span{font-family:var(--ath-prose); font-size:13px; color:var(--ath-ink-4);
  font-variant-numeric:lining-nums tabular-nums}
.pg-works{display:grid; gap:var(--sp-5)}
.pg-workgroup > p{
  margin:0 0 var(--sp-3); font-family:var(--ath-ui); font-size:9.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-ink-4);
}
.pg-work{
  display:flex; align-items:center; gap:var(--sp-3); padding:10px 0;
  border-top:1px solid var(--ath-rule-soft);
  font-family:var(--ath-prose); font-size:15px; color:var(--ath-ink-2);
  transition:color .2s var(--ath-ease), padding-left .2s var(--ath-ease);
}
.pg-work:hover{color:var(--ath-brass-hi); padding-left:6px}
.pg-work i{margin-left:auto; font-style:normal; font-size:12px; color:var(--ath-ink-4);
  font-variant-numeric:lining-nums tabular-nums}

/* =====================================================================
   §MEDIA — Videos, Podcasts, Lectures. Reference 4: a dark rail of what
   is next, a player on a darker stage, a title row, a row of actions,
   and a panel of notes below.
   ===================================================================== */
.md-shell{
  display:grid; grid-template-columns:282px minmax(0,1fr); min-height:100vh; align-items:start;
}
@media (max-width:940px){ .md-shell{grid-template-columns:1fr} }
.md-queue{
  position:sticky; top:0; align-self:start; min-height:100vh;
  padding:96px var(--sp-5) var(--sp-6); background:var(--ath-ground);
  border-right:1px solid var(--ath-rule-soft);
}
@media (max-width:940px){ .md-queue{position:static; min-height:0; border-right:0;
  border-bottom:1px solid var(--ath-rule-soft); padding-top:96px} }
.md-queue h4{
  margin:var(--sp-6) 0 var(--sp-3); font-family:var(--ath-ui); font-size:9.5px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ath-ink-4);
}
.md-q{
  display:grid; grid-template-columns:64px minmax(0,1fr); gap:var(--sp-3); align-items:center;
  padding:9px 0; border-top:1px solid var(--ath-rule-soft);
}
.md-q:first-of-type{border-top:0}
.md-q-thumb{position:relative; width:64px; aspect-ratio:16/10; overflow:hidden;
  border-radius:var(--ath-r-sm); background:var(--ath-panel)}
.md-q-thumb img{width:100%; height:100%; object-fit:cover}
.md-q-n b{display:block; font-family:var(--ath-prose); font-weight:400; font-size:13px; line-height:1.35;
  color:var(--ath-ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.md-q-n span{font-family:var(--ath-ui); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ath-ink-4)}
.md-q:hover .md-q-n b{color:var(--ath-brass-hi)}
.md-q.is-on{padding-left:9px; border-left:1px solid var(--ath-brass-hi)}
.md-q.is-on .md-q-n b{color:var(--ath-ink)}

.md-main{min-width:0; padding:96px var(--ath-gut) var(--sp-9) var(--sp-6)}
@media (max-width:940px){ .md-main{padding:var(--sp-6) var(--ath-gut) var(--sp-9)} }
/* The stage. The reference floats the player on a darker ground with the
   frame's own imagery blurred out behind it; here that backdrop is the
   cover, so the stage takes its colour from the thing being played. */
.md-stage{
  position:relative; border-radius:var(--ath-r); overflow:hidden;
  background:var(--ath-ground); box-shadow:var(--ath-lift-dark);
}
.md-stage-bg{
  position:absolute; inset:-8%; background-size:cover; background-position:center;
  filter:blur(38px) saturate(1.15); opacity:.42;
}
/* The reference floats the player ON the stage rather than filling it, so
   the blurred backdrop shows around the frame and the video reads as an
   object sitting in a room. A full-bleed frame at desktop width is also
   simply too tall — it pushes the title, the actions and every note below
   the fold. */
.md-frame{
  position:relative; aspect-ratio:16/9; width:min(100%, 900px);
  margin:0 auto; display:block; border:0;
  box-shadow:0 30px 70px -34px rgba(0,0,0,.95);
}
.md-stage{padding:var(--sp-5) var(--sp-5)}
@media (max-width:700px){ .md-stage{padding:0} .md-frame{width:100%; box-shadow:none} }
.md-frame iframe,.md-frame video{position:absolute; inset:0; width:100%; height:100%; border:0}
.md-audio{position:relative; padding:var(--sp-7) var(--sp-6); display:grid; gap:var(--sp-4); justify-items:center}
.md-audio audio{width:100%; max-width:640px}
/* No embed: the cover, and one honest button. A dead frame is worse than
   a link that works. */
.md-nolink{
  position:relative; aspect-ratio:16/9; display:grid; place-items:center; gap:var(--sp-4);
  align-content:center; text-align:center; padding:var(--sp-6);
}
.md-nolink p{margin:0; font-family:var(--ath-prose); font-size:15px; color:var(--ath-ink-3); max-width:44ch}

.md-bar{
  display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-5);
  flex-wrap:wrap; margin-top:var(--sp-5);
}
.md-title{
  margin:0; font-family:var(--ath-display); font-weight:400;
  font-size:clamp(24px,2.8vw,34px); line-height:1.12; letter-spacing:.045em; text-transform:uppercase;
  color:var(--ath-ink);
}
.md-sub{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:var(--sp-3);
  font-family:var(--ath-ui); font-size:12px; color:var(--ath-ink-3)}
.md-acts{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--ath-rule-soft);
}
.md-acts .rs-face{width:30px; height:30px; font-size:11px}
.md-acts-person{display:flex; align-items:center; gap:10px; margin-right:auto;
  font-family:var(--ath-ui); font-size:13px; color:var(--ath-ink-2)}

.md-notes{margin-top:var(--sp-7)}
.md-notes > h4{
  margin:0 0 var(--sp-4); font-family:var(--ath-ui); font-size:10.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ath-brass-hi);
}
.md-mark{
  display:grid; grid-template-columns:78px minmax(0,1fr) auto; gap:var(--sp-4);
  align-items:start; padding:var(--sp-3) 0; border-top:1px solid var(--ath-rule-soft);
}
/* A note is one or two sentences, not an essay — it does not need the
   article measure's leading, and it must not push the next timestamp off
   the screen. */
.md-mark .rs-rich{font-size:15.5px; line-height:1.6}
.md-mark .rs-rich p{margin:0 0 .5em}
.md-mark .rs-rich > *:last-child{margin-bottom:0}
.md-at{
  font-family:var(--ath-prose); font-variant-numeric:lining-nums tabular-nums;
  font-size:14px; color:var(--ath-brass-hi); text-align:left; padding-top:2px;
  transition:color .2s var(--ath-ease);
}
button.md-at:hover{color:var(--ath-ink); text-decoration:underline; text-underline-offset:3px}
.md-at.is-loose{color:var(--ath-ink-4)}
.md-mark-x{opacity:0; transition:opacity .2s var(--ath-ease)}
.md-mark:hover .md-mark-x, .md-mark:focus-within .md-mark-x{opacity:1}

/* ---------- shared small pieces -------------------------------------- */
.rs-face{
  flex:none; width:22px; height:22px; border-radius:50%;
  display:grid; place-items:center; font-family:var(--ath-ui);
  font-size:10px; font-weight:600; color:#0A0C0F;
  background:linear-gradient(150deg, hsl(var(--h,210) 30% 74%), hsl(calc(var(--h,210) + 26) 26% 52%));
}
.lb-plate{
  position:absolute; inset:0;
  background:
    repeating-radial-gradient(circle at 62% 34%, rgba(242,239,232,.10) 0 1px, transparent 1px 13px),
    linear-gradient(148deg, hsl(var(--h,210) 22% 26%), hsl(calc(var(--h,210) + 22) 24% 12%));
}
.lb-plate span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--ath-display); font-size:26px; letter-spacing:.1em; color:rgba(242,239,232,.42);
}

.ath-empty{
  padding:var(--sp-8) var(--sp-5); text-align:center; border:1px dashed var(--ath-rule);
  font-family:var(--ath-prose); color:var(--ath-ink-3); font-size:16px;
}
.ath-empty b{display:block; font-family:var(--ath-display); font-size:22px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ath-ink-2); margin-bottom:var(--sp-2); font-weight:400}
.rs-missing{max-width:640px; margin:0 auto; padding:140px var(--ath-gut) var(--sp-9)}

#athToast{
  position:fixed; left:50%; bottom:var(--sp-5); transform:translate(-50%,20px); z-index:200;
  background:var(--ath-ink); color:var(--ath-paper); padding:11px 20px; border-radius:var(--ath-r-sm);
  font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .28s var(--ath-ease), transform .28s var(--ath-spring);
}
#athToast.show{opacity:1; transform:translate(-50%,0)}
#athToast.is-bad{background:var(--ath-bad)}

/* The small dialog this page owns (a chapter's title, a note's time).
   The resource form itself is athenaeum-resource-editor.js. */
.rs-dlg-bg{
  position:fixed; inset:0; z-index:130; background:rgba(12,14,18,.62); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:var(--sp-5);
}
@keyframes ath-fade{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
.rs-dlg-bg.show{display:flex; animation:ath-fade .24s var(--ath-ease)}
.rs-dlg{
  background:var(--ath-panel); width:min(620px,100%); max-height:88vh; overflow:auto;
  border:1px solid var(--ath-rule); border-radius:var(--ath-r);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.4);
}
.rs-dlg-head{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
  padding:var(--sp-5) var(--sp-5) var(--sp-4); border-bottom:1px solid var(--ath-rule-soft)}
.rs-dlg-body{padding:var(--sp-5); display:grid; gap:var(--sp-4)}
.rs-dlg-foot{display:flex; justify-content:flex-end; gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-5) var(--sp-5); border-top:1px solid var(--ath-rule-soft)}
.ath-field{display:grid; gap:7px}
.ath-field-label{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ath-ink-3)}
.ath-field-hint{margin:0; font-size:12.5px; color:var(--ath-ink-3); font-family:var(--ath-prose)}
.ath-input,.ath-textarea{
  width:100%; padding:10px 12px; background:var(--ath-paper-2); color:var(--ath-ink);
  border:1px solid var(--ath-rule); border-radius:var(--ath-r-sm); font:inherit; font-size:14px;
}
.ath-textarea{font-family:var(--ath-prose); font-size:15px; line-height:1.6; resize:vertical}
.ath-input:focus,.ath-textarea:focus{outline:none; border-color:var(--ath-verd-hi); background:var(--ath-panel)}
/* Phone: a field under 16px makes iOS Safari zoom the page in on focus and
   never zoom back out, so one tap on a form leaves the page magnified. This
   is the page you read a whole book in — being left zoomed matters here. */
@media (max-width:768px){
  .ath-input,.ath-textarea{font-size:16px; padding:12px}
  .rs-rich{font-size:16px}
}
/* The paste target in the bulk-chapter dialog: a real editable surface, so
   what you see there is exactly what will be saved. */
.rs-paste{
  min-height:220px; max-height:44vh; overflow:auto; padding:var(--sp-4);
  background:var(--ath-paper-2); border:1px solid var(--ath-rule); border-radius:var(--ath-r-sm);
}
.rs-paste .rs-rich{font-size:15px; line-height:1.6}
</style>
