<body>

<div class="ath-grain" aria-hidden="true"></div>
<div class="rs-shell" id="rsShell"><div id="rsPage"></div></div>

<div class="rs-dlg-bg" id="rsDlgBg"><div class="rs-dlg" id="rsDlg" role="dialog" aria-modal="true"></div></div>
<div id="athToast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=3"></script>
<script src="photo-store.js"></script>
<script src="athenaeum-data.js"></script>
<script src="athenaeum-drafts.js"></script>
<script src="athenaeum-resource-editor.js"></script>
<script src="topbar.js?v=4" defer></script>
<script src="athenaeum-nav.js" defer></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // §UTIL
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function D() { return window.Athenaeum; }
  function esc(s) { return D().esc(s); }

  function runSafely(fn, label) {
    try { return fn(); } catch (e) {
      try { console.error('[Athenaeum] ' + (label || 'error'), e); } catch (e2) {}
      toast('Something went wrong — see the console', true);
    }
  }
  var toastTimer = null;
  function toast(msg, bad) {
    var el = $('athToast');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('is-bad', !!bad);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  var bound = {};
  function on(hostId, evt, sel, fn, capture) {
    var key = hostId + '|' + evt + '|' + sel;
    if (bound[key]) return;
    bound[key] = 1;
    var host = $(hostId);
    if (!host) return;
    host.addEventListener(evt, function (e) {
      var t = e.target.closest ? e.target.closest(sel) : null;
      if (t && host.contains(t)) fn(e, t);
    }, !!capture);
  }
  function hueOf(seed) {
    var s = String(seed || ''), n = 0;
    for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) % 360;
    return n;
  }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function face(name, seed) {
    return '<span class="rs-face" style="--h:' + hueOf(seed || name) + '" aria-hidden="true">' +
      esc(initials(name)) + '</span>';
  }

  // ============================================================
  // §STATE
  // ============================================================
  var S = { id: '', chapterId: '' };

  var TEMPLATE_OF = {
    Book: 'reader',
    Paper: 'page', Course: 'page', Article: 'page', Person: 'page', Dataset: 'page', Tool: 'page', Other: 'page',
    Video: 'media', Podcast: 'media', Lecture: 'media'
  };

  function res() { return D().Resources.get(S.id); }
  function href(r) { return 'athenaeum-resource.html?id=' + encodeURIComponent(r.id); }
  function backLink(onPaper) {
    return '<a class="rs-back' + (onPaper ? ' on-paper' : '') + '" href="athenaeum-resources.html">' +
      '<span aria-hidden="true">←</span> The Library</a>';
  }
  function tagChips(r, onDark) {
    if (!(r.tags || []).length) return '';
    return '<div class="rs-tags">' + r.tags.map(function (t) {
      return '<a class="rs-tag' + (onDark ? ' on-dark' : '') +
        '" href="athenaeum-resources.html">' + esc(t) + '</a>';
    }).join('') + '</div>';
  }
  function creditedPeople(r) {
    var d = D();
    return (r.personIds || []).map(function (id) { return d.Resources.get(id); }).filter(Boolean);
  }
  function coverHtml(r, cls, extra) {
    var hue = r.hue || hueOf(r.id);
    if (r.cover) {
      return '<div class="' + cls + '"' + (extra || '') + '><img src="' + esc(r.cover) + '" alt="" ' +
        'style="object-position:' + esc(r.coverPos || '50% 50%') + '"></div>';
    }
    return '<div class="' + cls + '"' + (extra || '') + '><span class="lb-plate" style="--h:' + hue + '">' +
      '<span>' + esc(String(r.title || '?').trim().charAt(0).toUpperCase() || '?') + '</span></span></div>';
  }

  // ============================================================
  // §RICH — a contenteditable that preserves what you paste.
  //
  // Ported from promptarium.html. The whole point of this page for a book:
  // paste a chapter out of anywhere and keep its headings, emphasis,
  // blockquotes and lists — while `style` and `class` are stripped, so it
  // arrives on this page's ground instead of dragging a white one with it.
  // ============================================================
  var RICH_MAX = 1200000;
  var richFocus = { key: '', composing: false };
  var commitTimer = null;

  /* data-rich="<collection>:<id>:<field>" — the field list is a whitelist
     because the models are whitelists: a typo here would write a key the
     model drops on the next save, and the text would vanish later rather
     than now. */
  var RICH_FIELDS = {
    chapter: ['bodyHtml', 'notesHtml'],
    resource: ['bodyHtml'],
    mark: ['bodyHtml']
  };

  function markEmpty(el) {
    var text = D().htmlToText(el.innerHTML);
    el.classList.toggle('is-empty', !text && !el.querySelector('img'));
  }
  function insertRich(html) {
    try { if (document.execCommand('insertHTML', false, html)) return true; } catch (e) {}
    try {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return false;
      var r = sel.getRangeAt(0);
      r.deleteContents();
      var tpl = document.createElement('div');
      tpl.innerHTML = html;
      var frag = document.createDocumentFragment(), node;
      while ((node = tpl.firstChild)) frag.appendChild(node);
      r.insertNode(frag);
      sel.collapseToEnd();
      return true;
    } catch (e) { return false; }
  }
  function commitRich(el, force) {
    if (!el || (richFocus.composing && !force)) return;
    var d = D(), key = el.getAttribute('data-rich');
    if (!key) return;
    var value = el.innerHTML;
    if (value.length > RICH_MAX) {
      toast('That is too large to save — link the image instead of pasting it', true);
      return;
    }
    var parts = key.split(':');
    var kind = parts[0], id = parts[1], field = parts[2];
    if (!RICH_FIELDS[kind] || RICH_FIELDS[kind].indexOf(field) < 0) return;
    var patch = {};
    patch[field] = value;
    if (kind === 'chapter') d.Chapters.update(id, patch);
    else if (kind === 'resource') d.Resources.update(id, patch);
    else if (kind === 'mark') d.Marks.update(id, patch);
    // Committed for real — the keystroke-level draft is no longer needed.
    if (window.AthDraft) AthDraft.clear('rich:' + key);
  }

  /* Two tiers, because the expensive part and the urgent part are not the
     same part.
     - URGENT, every keystroke: the raw innerHTML goes to a draft. No
       sanitising, no model, no collection — one synchronous string write,
       cheap enough to do on every input.
     - EXPENSIVE, debounced: the real commit, which re-runs sanitizeHtml
       over the whole chapter and re-models the record.
     Before this, a refresh inside the 700ms window took everything typed in
     it. Now the worst case is the handful of milliseconds since the last
     keystroke. */
  function scheduleCommit(el) {
    var key = el.getAttribute('data-rich');
    if (key && window.AthDraft) {
      AthDraft.put('rich:' + key, { __rich0: el.innerHTML });
    }
    clearTimeout(commitTimer);
    commitTimer = setTimeout(function () { commitRich(el); }, 700);
  }

  /* A draft only wins if it actually differs from what was committed —
     otherwise every reopened chapter would announce a rescue that did not
     happen. */
  function restoreRichDrafts() {
    if (!window.AthDraft) return;
    var recovered = 0;
    document.querySelectorAll('#rsPage [data-rich]').forEach(function (el) {
      var key = el.getAttribute('data-rich');
      var d = AthDraft.get('rich:' + key);
      if (!d || !d.fields || typeof d.fields.__rich0 !== 'string') return;
      if (d.fields.__rich0 === el.innerHTML) { AthDraft.clear('rich:' + key); return; }
      el.innerHTML = d.fields.__rich0;
      markEmpty(el);
      // Write it through to the record immediately, so the draft and the
      // truth stop disagreeing the moment the reader sees it.
      commitRich(el, true);
      recovered++;
    });
    if (recovered) {
      toast(recovered === 1
        ? 'Recovered what you were writing'
        : 'Recovered ' + recovered + ' unsaved edits');
    }
  }
  /* Anything focused must be written down before the page can be rebuilt,
     or a repaint eats it. Called before every render. */
  function commitPending() {
    var a = document.activeElement;
    if (a && a.getAttribute && a.getAttribute('data-rich')) commitRich(a, true);
  }

  function handleRichPaste(el, e) {
    var d = D();
    var dt = e.clipboardData || e.dataTransfer;
    if (!dt) return;
    e.preventDefault();      // always — the browser never inserts raw markup

    // 1. Images first: a screenshot paste carries both an image and, often,
    //    a junk text/html wrapper that would win otherwise.
    if (dt.items) {
      for (var i = 0; i < dt.items.length; i++) {
        var it = dt.items[i];
        if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
          var file = it.getAsFile();
          if (!file) continue;
          var reader = new FileReader();
          reader.onload = function (ev) {
            d.compressImageDataUrl(String(ev.target.result), 1400, 0.82).then(function (small) {
              el.focus();
              insertRich('<img src="' + small + '" alt="Pasted image">');
              commitRich(el, true);
              markEmpty(el);
              if (window.PhotoStore && PhotoStore.upload) {
                PhotoStore.upload(small, function (url) {
                  if (!url) return;                  // offline / no bucket → the data URL stays
                  el.innerHTML = el.innerHTML.split(small).join(url);
                  commitRich(el, true);
                });
              }
            });
          };
          reader.readAsDataURL(file);
          return;
        }
      }
    }

    // 2. Real markup. This is the branch that keeps a chapter's formatting.
    var html = dt.getData ? dt.getData('text/html') : '';
    if (html) { insertRich(d.sanitizeHtml(html)); markEmpty(el); scheduleCommit(el); return; }

    // 3. Plain text — blank lines become paragraphs, single ones a break.
    var text = dt.getData ? dt.getData('text/plain') : '';
    if (!text) return;
    insertRich(text.split(/\n{2,}/).map(function (p) {
      return '<p>' + d.esc(p).replace(/\n/g, '<br>') + '</p>';
    }).join(''));
    markEmpty(el);
    scheduleCommit(el);
  }

  function wireRich() {
    on('rsPage', 'paste', '[data-rich]', function (e, el) { handleRichPaste(el, e); });
    on('rsPage', 'drop', '[data-rich]', function (e, el) { handleRichPaste(el, e); });
    on('rsPage', 'input', '[data-rich]', function (e, el) { markEmpty(el); scheduleCommit(el); });
    on('rsPage', 'blur', '[data-rich]', function (e, el) {
      richFocus.key = ''; commitRich(el, true); markEmpty(el);
    }, true);
    on('rsPage', 'focus', '[data-rich]', function (e, el) {
      richFocus.key = el.getAttribute('data-rich');
    }, true);
    on('rsPage', 'compositionstart', '[data-rich]', function () { richFocus.composing = true; });
    on('rsPage', 'compositionend', '[data-rich]', function (e, el) {
      richFocus.composing = false; commitRich(el, true);
    });
  }
  function richBox(key, html, placeholder, cls) {
    var empty = !D().htmlToText(html);
    return '<div class="rs-rich ' + (cls || '') + (empty ? ' is-empty' : '') + '" contenteditable="true" ' +
      'data-rich="' + esc(key) + '" data-ph="' + esc(placeholder) + '" spellcheck="true">' + html + '</div>';
  }

  // ============================================================
  // §DIALOG — the small one this page owns.
  // ============================================================
  var dlgCtx = null;
  var dlgDraft = null;
  function fText(label, key, val, ph) {
    return '<div class="ath-field"><label class="ath-field-label" for="d_' + key + '">' + esc(label) + '</label>' +
      '<input class="ath-input" id="d_' + key + '" data-f="' + key + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"></div>';
  }
  function fHint(t) { return '<p class="ath-field-hint">' + esc(t) + '</p>'; }
  function openDlg(cfg) {
    dlgCtx = cfg;
    $('rsDlg').innerHTML =
      '<div class="rs-dlg-head"><h3 class="ath-h3">' + esc(cfg.title) + '</h3>' +
        '<button class="ath-btn-icon" type="button" data-close aria-label="Close">✕</button></div>' +
      '<div class="rs-dlg-body">' + cfg.body + '</div>' +
      '<div class="rs-dlg-foot">' +
        '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-close>Cancel</button>' +
        '<button class="ath-btn ath-btn-solid ath-btn-sm" type="button" data-save>' + esc(cfg.saveLabel || 'Save') + '</button>' +
      '</div>';
    $('rsDlgBg').classList.add('show');

    // Autosave this dialog too. `Paste chapters` in particular can hold an
    // entire book that has not been written anywhere yet.
    var scope = 'dlg:' + S.id + ':' + (cfg.draftKey || cfg.title);
    dlgDraft = window.AthDraft ? AthDraft.bind(scope, $('rsDlg'), {
      onRestore: function (when) { toast('Put back what you had typed ' + when); }
    }) : null;

    var first = $('rsDlg').querySelector('[data-f], [contenteditable]');
    if (first) setTimeout(function () { first.focus(); }, 40);
  }
  /* Cancel, Escape and the backdrop are a decision to discard; a refresh is
     not, so only the explicit paths clear the draft. */
  function closeDlg(discard) {
    $('rsDlgBg').classList.remove('show');
    if (dlgDraft) { if (discard) dlgDraft.clear(); else dlgDraft.save(); }
    dlgDraft = null;
    dlgCtx = null;
  }
  function dlgValues() {
    var out = {};
    $('rsDlg').querySelectorAll('[data-f]').forEach(function (n) { out[n.getAttribute('data-f')] = n.value; });
    return out;
  }

  // ============================================================
  // §READER — Books.
  //
  // A book is the one medium here whose text you actually keep, so this
  // template is built around getting it IN: a chapter is a paste target
  // that preserves formatting, and the table of contents is the reference's
  // own left column.
  // ============================================================
  function currentChapter(r) {
    var list = D().chaptersFor(r.id);
    if (!list.length) return null;
    var found = S.chapterId && list.filter(function (c) { return c.id === S.chapterId; })[0];
    if (found) return found;
    // Default to the first UNREAD chapter — reopening a book should land
    // where reading stopped, not back at the beginning.
    var next = list.filter(function (c) { return !c.read; })[0];
    return next || list[0];
  }

  function renderReader(r) {
    var d = D();
    var chapters = d.chaptersFor(r.id);
    var cur = currentChapter(r);
    if (cur) S.chapterId = cur.id;
    var people = creditedPeople(r);
    var who = people[0];
    var pct = d.resourceProgress(r);
    var readCount = chapters.filter(function (c) { return c.read; }).length;
    var hue = r.hue || hueOf(r.id);

    // No cover is not the same as no hero. A drawn plate — engraved rings
    // over the book's own tint, the same device the Library's thumbnails
    // use — keeps its identity and stops the top of the page reading as a
    // hole in the ground.
    var plate = r.cover
      ? '<div class="ath-plate" aria-hidden="true" style="background-image:url(' +
          esc(r.cover).replace(/"/g, '') + '); background-position:' + esc(r.coverPos || '50% 50%') + '"></div>'
      : '<div class="ath-plate is-drawn" aria-hidden="true" style="--h:' + hue + '"></div>';

    var hero =
      '<header class="rd-hero" data-plate>' +
        plate +
        '<div class="rd-hero-in">' +
          backLink() +
          '<h1 class="rd-title">' + esc(r.title || 'Untitled') + '</h1>' +
          (r.summary ? '<p class="rd-dek">' + esc(r.summary) + '</p>' : '') +
          '<div class="rd-byline">' +
            (who || r.author
              ? '<div class="rd-person">' +
                  face(who ? who.title : r.author, who ? who.id : r.author) +
                  '<span>' +
                    (who
                      ? '<b><a href="' + esc(href(who)) + '">' + esc(who.title) + '</a></b>'
                      : '<b>' + esc(r.author) + '</b>') +
                    '<span>' + esc([r.source, r.year].filter(Boolean).join(' · ') || 'Author') + '</span>' +
                  '</span></div>'
              : '') +
            '<div class="rd-acts">' +
              (r.url ? '<a class="ath-btn ath-btn-light ath-btn-sm" href="' + esc(r.url) + '" target="_blank" rel="noopener">Open at source</a>' : '') +
              '<button class="ath-btn ath-btn-light ath-btn-sm" type="button" data-act="edit-resource">Edit</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="rd-strip">' +
          '<p class="ath-micro">' + esc(r.type) +
            (r.lengthText ? ' · ' + esc(r.lengthText) : '') +
            ' · Added ' + esc(d.fmtDate(r.createdAt)) + '</p>' +
          tagChips(r, true) +
        '</div>' +
      '</header>';

    var toc =
      '<aside class="rd-toc">' +
        '<h4>Contents</h4>' +
        (chapters.length
          ? '<div class="rd-toc-list">' + chapters.map(function (c) {
              return '<button class="rd-chap' + (cur && c.id === cur.id ? ' is-on' : '') +
                (c.read ? ' is-read' : '') + '" type="button" data-chapter="' + esc(c.id) + '">' +
                esc(c.title || 'Untitled chapter') + '</button>';
            }).join('') + '</div>'
          : '<p class="ath-field-hint">Nothing in yet.</p>') +
        '<div class="rd-toc-foot">' +
          (chapters.length
            ? '<div class="rd-progress"><span class="lb-meter"><i style="width:' + pct + '%"></i></span>' +
              '<span>' + readCount + '/' + chapters.length + '</span></div>'
            : '') +
          '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="add-chapter">Add a chapter</button>' +
          '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="paste-chapters">Paste chapters</button>' +
        '</div>' +
      '</aside>';

    var main;
    if (!cur) {
      main = '<div class="rd-main"><div class="ath-empty"><b>The book is empty</b>' +
        'Add a chapter, then paste it in — headings, emphasis, blockquotes and lists all survive the paste. ' +
        'Or use <b style="display:inline">Paste chapters</b> to drop the whole thing in at once and split it at its own headings.' +
        '<div style="margin-top:var(--sp-5)">' +
          '<button class="ath-btn ath-btn-solid ath-btn-sm" type="button" data-act="paste-chapters">Paste chapters</button>' +
        '</div></div></div>';
    } else {
      var mins = d.readingMinutes(cur.bodyHtml);
      main =
        '<div class="rd-main">' +
          '<div class="rd-chap-head">' +
            '<div>' +
              '<h2 class="rd-chap-title">' + esc(cur.title || 'Untitled chapter') + '</h2>' +
              (cur.subtitle ? '<p class="rd-chap-sub">' + esc(cur.subtitle) + '</p>' : '') +
              '<div class="rd-chap-meta">' +
                '<span class="ath-micro">' + (mins ? mins + ' min read' : 'Empty') + '</span>' +
                '<span class="ath-micro">' + (cur.read ? 'Read' : 'Unread') + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="rd-chap-acts">' +
              '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="toggle-read" data-id="' + esc(cur.id) + '">' +
                (cur.read ? 'Mark unread' : 'Mark read') + '</button>' +
              '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="rename-chapter" data-id="' + esc(cur.id) + '">Rename</button>' +
              '<button class="ath-btn ath-btn-danger ath-btn-sm" type="button" data-act="del-chapter" data-id="' + esc(cur.id) + '">Delete</button>' +
            '</div>' +
          '</div>' +
          richBox('chapter:' + cur.id + ':bodyHtml', cur.bodyHtml,
            'Paste the chapter here. Its headings, bold, italics, blockquotes and lists are kept; its colours and fonts are not, so it arrives in the Athenaeum’s own hand.') +
          '<section class="rd-notes">' +
            '<h4>Notes on this chapter</h4>' +
            richBox('chapter:' + cur.id + ':notesHtml', cur.notesHtml,
              'What you actually took from it. Yours, not the book’s.') +
          '</section>' +
        '</div>';
    }

    $('rsPage').innerHTML = hero + '<div class="rd-body">' + toc + main + '</div>';
  }

  /* Splitting a pasted book. The headings are the only structure a pasted
     document reliably carries, so they are what a chapter break is inferred
     from — and the split is SHOWN before anything is written, because
     guessing wrong on a whole book is not a small mistake. */
  function splitIntoChapters(html) {
    var doc;
    try { doc = new DOMParser().parseFromString('<!doctype html><body>' + html, 'text/html'); }
    catch (e) { return []; }
    var kids = [].slice.call(doc.body.children);
    // sanitizeHtml renames h1 to h2, so h2 is the top level by the time it
    // gets here. h3 is only used as a break if there are no h2s at all.
    var level = kids.some(function (n) { return n.tagName === 'H2'; }) ? 'H2'
      : (kids.some(function (n) { return n.tagName === 'H3'; }) ? 'H3' : '');
    if (!level) return [];
    var out = [], cur = null;
    kids.forEach(function (n) {
      if (n.tagName === level) {
        if (cur) out.push(cur);
        cur = { title: (n.textContent || '').trim() || 'Untitled chapter', body: '' };
        return;
      }
      if (!cur) return;                    // anything before the first heading is front matter
      cur.body += n.outerHTML;
    });
    if (cur) out.push(cur);
    return out.filter(function (c) { return c.title; });
  }

  function openPasteChapters() {
    var r = res();
    if (!r) return;
    openDlg({
      title: 'Paste chapters',
      saveLabel: 'Add chapters',
      body:
        '<p class="ath-field-hint">Paste as much of the book as you like below. Formatting is kept. ' +
        'If it carries its own headings, each one becomes a chapter; if it does not, the whole paste becomes a single chapter.</p>' +
        '<div class="rs-paste"><div class="rs-rich" contenteditable="true" spellcheck="false" ' +
          'data-ph="Paste here (Ctrl+V)"></div></div>' +
        fText('If it is all one chapter, call it', 'title', '', 'Chapter One'),
      onSave: function (v) {
        var d = D(), html = d.sanitizeHtml(v.__html || '');
        if (!d.htmlToText(html)) { toast('Nothing was pasted', true); return; }
        var parts = splitIntoChapters(html);
        var base = d.nextOrder(d.chaptersFor(r.id));
        if (!parts.length) {
          d.Chapters.add({ resourceId: r.id, title: v.title || 'Untitled chapter', bodyHtml: html, order: base });
          toast('Chapter added');
          S.chapterId = '';
          return;
        }
        parts.forEach(function (p, i) {
          d.Chapters.add({ resourceId: r.id, title: p.title, bodyHtml: p.body, order: base + i });
        });
        toast(parts.length + ' chapters added');
        S.chapterId = '';
      }
    });
  }

  function wireReader() {
    on('rsPage', 'click', '[data-chapter]', function (e, t) {
      commitPending();
      S.chapterId = t.getAttribute('data-chapter');
      // Which chapter you were on is worth keeping too: a refresh should
      // put you back on the page you were reading, not at chapter one.
      D().setUiState({ lastChapter: S.id + ':' + S.chapterId });
      render({ top: true });
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
    on('rsPage', 'click', '[data-act="add-chapter"]', function () {
      var r = res();
      if (!r) return;
      openDlg({
        title: 'New chapter',
        saveLabel: 'Add chapter',
        body: fText('Title', 'title', '', 'Chapter One') +
          fText('Subtitle', 'subtitle', '', 'Optional') +
          fHint('You can paste the text straight into the page once the chapter exists.'),
        onSave: function (v) {
          var d = D();
          if (!String(v.title).trim()) { toast('A chapter needs a title', true); return; }
          var made = d.Chapters.add({
            resourceId: r.id, title: v.title, subtitle: v.subtitle,
            order: d.nextOrder(d.chaptersFor(r.id))
          });
          S.chapterId = made.id;
          toast('Chapter added');
        }
      });
    });
    on('rsPage', 'click', '[data-act="paste-chapters"]', openPasteChapters);
    on('rsPage', 'click', '[data-act="rename-chapter"]', function (e, t) {
      var d = D(), c = d.Chapters.get(t.getAttribute('data-id'));
      if (!c) return;
      openDlg({
        title: 'Rename chapter',
        body: fText('Title', 'title', c.title, '') + fText('Subtitle', 'subtitle', c.subtitle, ''),
        onSave: function (v) { d.Chapters.update(c.id, { title: v.title, subtitle: v.subtitle }); toast('Renamed'); }
      });
    });
    on('rsPage', 'click', '[data-act="toggle-read"]', function (e, t) {
      var d = D(), c = d.Chapters.get(t.getAttribute('data-id'));
      if (!c) return;
      commitPending();
      d.Chapters.update(c.id, { read: !c.read });
      render({ top: false });
    });
    on('rsPage', 'click', '[data-act="del-chapter"]', function (e, t) {
      var d = D(), c = d.Chapters.get(t.getAttribute('data-id'));
      if (!c) return;
      if (!confirm('Delete “' + (c.title || 'Untitled chapter') + '”?\n\nIts text and its notes go with it. The book keeps its other chapters.')) return;
      d.Chapters.remove(c.id);
      S.chapterId = '';
      toast('Chapter deleted');
      render({ top: false });
    });
  }

  // ============================================================
  // §PAGE — Papers, Courses, Articles, People, Datasets, Tools.
  //
  // One centred title, the tags under it, a wide plate, then facts in the
  // margin and the writing beside them. What differs by medium is only the
  // block underneath: a course points at the curriculum built from it, a
  // person lists their works, a paper states its citation.
  // ============================================================
  function metaRow(label, value) {
    if (!value) return '';
    return '<div class="pg-mrow"><span>' + esc(label) + '</span><b>' + value + '</b></div>';
  }

  function pageTail(r) {
    var d = D();

    if (r.type === 'Person') {
      var works = d.resourcesCrediting(r.id);
      if (!works.length) {
        return '<div class="pg-tail"><h4>Works in the library</h4>' +
          '<p class="ath-field-hint">Nothing is credited to them yet. Open any resource, edit it, and pick this person under <b>Credited people</b>.</p></div>';
      }
      var groups = {};
      works.forEach(function (w) { (groups[w.type] = groups[w.type] || []).push(w); });
      return '<div class="pg-tail"><h4>Works in the library</h4><div class="pg-works">' +
        Object.keys(groups).sort().map(function (k) {
          return '<div class="pg-workgroup"><p>' + esc(k) + '</p>' +
            groups[k].map(function (w) {
              return '<a class="pg-work" href="' + esc(href(w)) + '">' + esc(w.title || 'Untitled') +
                (w.year ? '<i>' + esc(w.year) + '</i>' : '') + '</a>';
            }).join('') + '</div>';
        }).join('') + '</div></div>';
    }

    if (r.type === 'Course') {
      var c = r.curriculumId ? d.Curricula.get(r.curriculumId) : null;
      if (c) {
        var mods = d.Modules.list().filter(function (m) { return m.curriculumId === c.id; }).length;
        var lessons = d.Lessons.list().filter(function (l) { return l.curriculumId === c.id; });
        var done = lessons.filter(function (l) { return l.done; }).length;
        return '<div class="pg-tail"><h4>Studied as</h4>' +
          '<a class="pg-link" href="athenaeum-curriculum.html?id=' + encodeURIComponent(c.id) + '">' +
            '<span class="pg-link-n"><b>' + esc(c.title || 'Untitled curriculum') + '</b>' +
            '<span>' + mods + (mods === 1 ? ' module' : ' modules') + ' · ' +
              lessons.length + (lessons.length === 1 ? ' lesson' : ' lessons') +
              (lessons.length ? ' · ' + Math.round((done / lessons.length) * 100) + '% done' : '') +
            '</span></span>' +
            '<span aria-hidden="true" style="font-size:18px;color:var(--ath-ink-4)">→</span></a>' +
          '<p class="ath-field-hint" style="margin-top:var(--sp-3)">The curriculum owns its modules and lessons. This is the way back to it.</p></div>';
      }
      return '<div class="pg-tail"><h4>Studied as</h4>' +
        '<p class="ath-field-hint">This course has not been turned into a curriculum yet. Edit it and pick one under <b>Studied as</b> — the curriculum is where the modules, the lessons and the schedule live.</p></div>';
    }

    if (r.type === 'Paper' && (r.source || r.year)) {
      return '<div class="pg-tail"><h4>Citation</h4>' +
        // Newsreader, never Italiana: Italiana's zero is indistinguishable
        // from a capital O, so a year set in it reads as "2o17".
        '<p class="rs-rich ath-num" style="font-size:15px">' +
          (r.author ? esc(r.author) + '. ' : '') +
          '<em>' + esc(r.title) + '</em>' +
          (r.source ? '. ' + esc(r.source) : '') +
          (r.year ? ', ' + esc(r.year) : '') + '.' +
        '</p></div>';
    }
    return '';
  }

  function renderPage(r) {
    var d = D();
    var people = creditedPeople(r);
    var fields = d.resFields(r).map(function (id) {
      var s = d.Subjects.get(id);
      return s ? '<a href="athenaeum-subject.html?id=' + encodeURIComponent(s.id) + '">' + esc(s.name) + '</a>' : '';
    }).filter(Boolean);
    var mins = d.readingMinutes(r.bodyHtml);
    var isPerson = r.type === 'Person';

    var meta =
      '<aside class="pg-meta">' +
        (people.length
          ? '<div class="pg-mrow"><span>' + (isPerson ? 'Also' : 'Contributor') + '</span>' +
            people.map(function (p) {
              return '<a class="pg-mperson" href="' + esc(href(p)) + '">' + face(p.title, p.id) +
                '<b style="font-family:var(--ath-ui);font-size:13px">' + esc(p.title) + '</b></a>';
            }).join('') + '</div>'
          : (r.author ? '<div class="pg-mrow"><span>Contributor</span><div class="pg-mperson">' +
              face(r.author, r.author) + '<b style="font-family:var(--ath-ui);font-size:13px">' + esc(r.author) + '</b></div></div>' : '')) +
        metaRow('Added', esc(d.fmtDate(r.createdAt))) +
        (mins ? metaRow(isPerson ? 'Length' : 'Reading time', mins + ' min') : '') +
        metaRow(isPerson ? 'Lived' : 'Published', esc(r.year)) +
        metaRow('Source', esc(r.source)) +
        metaRow('Length', esc(r.lengthText)) +
        (fields.length ? metaRow(fields.length === 1 ? 'Field' : 'Fields', fields.join('<br>')) : '') +
        metaRow('Shelf', esc(d.labelFrom(d.RESOURCE_BUCKETS, r.bucket, ''))) +
        (r.rating ? metaRow('Rating', '<span style="color:var(--ath-brass-hi)">' + '★'.repeat(r.rating) + '</span>') : '') +
        (r.url ? '<div class="pg-mrow"><span>Source</span><a class="ath-btn ath-btn-ghost ath-btn-sm" href="' +
          esc(r.url) + '" target="_blank" rel="noopener">Open at source</a></div>' : '') +
      '</aside>';

    $('rsPage').innerHTML =
      '<div class="pg-wrap">' +
        '<div class="pg-top">' +
          '<div class="pg-bar">' + backLink(true) +
            '<span class="pg-bar-acts">' +
              '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="edit-resource">Edit</button>' +
              '<button class="ath-btn ath-btn-danger ath-btn-sm" type="button" data-act="del-resource">Delete</button>' +
            '</span>' +
          '</div>' +
          '<p class="pg-kind">' + esc(r.type) + '</p>' +
          '<h1 class="pg-title">' + esc(r.title || 'Untitled') + '</h1>' +
          tagChips(r) +
        '</div>' +
        coverHtml(r, 'pg-plate' + (isPerson ? ' is-portrait' : ''), ' data-plate') +
        '<div class="pg-body">' +
          meta +
          '<div class="pg-main">' +
            (r.summary ? '<p class="ath-lede" style="margin-bottom:var(--sp-5)">' + esc(r.summary) + '</p>' : '') +
            richBox('resource:' + r.id + ':bodyHtml', r.bodyHtml,
              isPerson
                ? 'Who they are, what they argued, and why they are on this shelf. Paste from anywhere — the formatting survives.'
                : 'Paste the article, the abstract, or your own write-up. Headings, emphasis, blockquotes and lists are all kept.') +
            pageTail(r) +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function wirePage() { /* every control here is handled by the shared wiring */ }

  // ============================================================
  // §MEDIA — Videos, Podcasts, Lectures.
  //
  // A queue on the left, the player on its stage, and notes with times
  // under it. What can be driven from the page depends entirely on what is
  // playing: a native <video>/<audio> can be seeked, a YouTube frame can
  // once its API loads, and a Spotify embed cannot be touched at all. The
  // page says which it is rather than offering a control that does nothing.
  // ============================================================
  var ytPlayer = null, ytReady = false;

  function embedHtml(r) {
    var d = D(), em = d.embedFor(r.url);
    var bg = r.cover ? '<div class="md-stage-bg" style="background-image:url(' + esc(r.cover).replace(/"/g, '') + ')"></div>' : '';
    if (em.kind === 'youtube') {
      return '<div class="md-stage">' + bg + '<div class="md-frame">' +
        '<iframe id="mdYT" src="' + esc(em.src) + '" title="' + esc(r.title) + '" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
        '</div></div>';
    }
    if (em.kind === 'vimeo' || em.kind === 'spotify' || em.kind === 'apple' || em.kind === 'soundcloud') {
      var tall = (em.kind === 'spotify' || em.kind === 'apple' || em.kind === 'soundcloud');
      return '<div class="md-stage">' + bg +
        '<div class="md-frame"' + (tall ? ' style="aspect-ratio:auto;height:232px"' : '') + '>' +
        '<iframe src="' + esc(em.src) + '" title="' + esc(r.title) + '" ' +
        'allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>' +
        '</div></div>';
    }
    if (em.kind === 'video') {
      return '<div class="md-stage">' + bg + '<div class="md-frame">' +
        '<video id="mdMedia" controls preload="metadata"' + (r.cover ? ' poster="' + esc(r.cover) + '"' : '') +
        ' src="' + esc(em.src) + '"></video></div></div>';
    }
    if (em.kind === 'audio') {
      return '<div class="md-stage">' + bg + '<div class="md-audio">' +
        coverHtml(r, 'lb-cont-thumb', ' style="width:160px;border-radius:var(--ath-r)"') +
        '<audio id="mdMedia" controls preload="metadata" src="' + esc(em.src) + '"></audio></div></div>';
    }
    // Nothing playable. Show the cover and one honest button — a dead frame
    // would be worse than a link that works.
    return '<div class="md-stage">' + bg + '<div class="md-nolink">' +
      '<p>' + (r.url
        ? 'This one does not embed. It plays at its source, and your notes stay here.'
        : 'No link yet. Add one and it plays here — YouTube, Vimeo, Spotify, Apple Podcasts, SoundCloud, or a direct audio or video file.') + '</p>' +
      (r.url
        ? '<a class="ath-btn ath-btn-solid" href="' + esc(r.url) + '" target="_blank" rel="noopener">Open at source</a>'
        : '<button class="ath-btn ath-btn-solid" type="button" data-act="edit-resource">Add a link</button>') +
      '</div></div>';
  }

  /* The queue is what you would actually reach for next: the same person
     first, then the same medium, then the same field. */
  function queueFor(r) {
    var d = D();
    var mine = d.resFields(r);
    return d.Resources.list().filter(function (o) {
      if (o.id === r.id) return false;
      var t = TEMPLATE_OF[o.type];
      return t === 'media';
    }).map(function (o) {
      var score = 0;
      if ((r.personIds || []).some(function (p) { return (o.personIds || []).indexOf(p) >= 0; })) score += 4;
      if (o.type === r.type) score += 2;
      if (d.resFields(o).some(function (f) { return mine.indexOf(f) >= 0; })) score += 1;
      return { r: o, score: score };
    }).sort(function (a, b) {
      return b.score - a.score || String(b.r.createdAt).localeCompare(String(a.r.createdAt));
    }).slice(0, 8).map(function (x) { return x.r; });
  }

  function renderMedia(r) {
    var d = D();
    var people = creditedPeople(r);
    var who = people[0];
    var marks = d.marksFor(r.id);
    var em = d.embedFor(r.url);
    var queue = queueFor(r);

    var rail =
      '<aside class="md-queue">' +
        backLink(true) +
        '<h4>Up next</h4>' +
        (queue.length
          ? queue.map(function (o) {
              return '<a class="md-q" href="' + esc(href(o)) + '">' +
                coverHtml(o, 'md-q-thumb') +
                '<span class="md-q-n"><b>' + esc(o.title || 'Untitled') + '</b>' +
                '<span>' + esc(o.type) + (o.lengthText ? ' · ' + esc(o.lengthText) : '') + '</span></span></a>';
            }).join('')
          : '<p class="ath-field-hint">Nothing else to watch or listen to yet.</p>') +
      '</aside>';

    var main =
      '<div class="md-main">' +
        embedHtml(r) +
        '<div class="md-bar">' +
          '<div style="min-width:0">' +
            '<h1 class="md-title">' + esc(r.title || 'Untitled') + '</h1>' +
            '<div class="md-sub">' +
              '<span class="ath-micro" style="color:var(--ath-brass-hi)">' + esc(r.type) + '</span>' +
              (r.source ? '<span>·</span><span>' + esc(r.source) + '</span>' : '') +
              (r.year ? '<span>·</span><span class="ath-num">' + esc(r.year) + '</span>' : '') +
              (r.lengthText ? '<span>·</span><span class="ath-num">' + esc(r.lengthText) + '</span>' : '') +
              (r.rating ? '<span>·</span><span style="color:var(--ath-brass-hi)">' + '★'.repeat(r.rating) + '</span>' : '') +
            '</div>' +
          '</div>' +
          tagChips(r) +
        '</div>' +
        (r.summary ? '<p class="ath-lede" style="margin-top:var(--sp-4); max-width:70ch">' + esc(r.summary) + '</p>' : '') +
        '<div class="md-acts">' +
          (who
            ? '<a class="md-acts-person" href="' + esc(href(who)) + '">' + face(who.title, who.id) + esc(who.title) + '</a>'
            : (r.author ? '<span class="md-acts-person">' + face(r.author, r.author) + esc(r.author) + '</span>' : '<span class="md-acts-person"></span>')) +
          '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="watched">' +
            (r.bucket === 'completed' ? 'Watched' : 'Mark watched') + '</button>' +
          '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="add-mark">Add a note</button>' +
          (em.seekable
            ? '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="capture">Note at this moment</button>'
            : '') +
          (r.url ? '<a class="ath-btn ath-btn-ghost ath-btn-sm" href="' + esc(r.url) + '" target="_blank" rel="noopener">Source</a>' : '') +
          '<button class="ath-btn ath-btn-ghost ath-btn-sm" type="button" data-act="edit-resource">Edit</button>' +
          '<button class="ath-btn ath-btn-danger ath-btn-sm" type="button" data-act="del-resource">Delete</button>' +
        '</div>' +
        '<section class="md-notes">' +
          '<h4>Notes</h4>' +
          (marks.length
            ? marks.map(function (m) {
                var at = m.at >= 0 ? d.fmtClock(m.at) : '—';
                // A time is only a BUTTON when the page can actually act on
                // it. On an embed it cannot be seeked, so it links out with
                // ?t= instead; on nothing playable it is just a label.
                var timeEl = (m.at >= 0 && em.seekable)
                  ? '<button class="md-at" type="button" data-seek="' + m.at + '">' + at + '</button>'
                  : (m.at >= 0 && r.url
                      ? '<a class="md-at" href="' + esc(r.url) + (r.url.indexOf('?') >= 0 ? '&' : '?') + 't=' + m.at +
                        '" target="_blank" rel="noopener">' + at + '</a>'
                      : '<span class="md-at is-loose">' + at + '</span>');
                return '<div class="md-mark">' + timeEl +
                  richBox('mark:' + m.id + ':bodyHtml', m.bodyHtml, 'What happened here.') +
                  '<button class="ath-btn ath-btn-ghost ath-btn-sm md-mark-x" type="button" ' +
                    'data-act="del-mark" data-id="' + esc(m.id) + '">Remove</button>' +
                '</div>';
              }).join('')
            : '<div class="ath-empty"><b>No notes yet</b>' +
              (em.seekable
                ? 'Press <b style="display:inline">Note at this moment</b> while it is playing and the time is filled in for you.'
                : 'Add a note and give it a time like <b style="display:inline">12:40</b>.') +
              '</div>') +
        '</section>' +
      '</div>';

    $('rsPage').innerHTML = '<div class="md-shell">' + rail + main + '</div>';
    mountYouTube();
  }

  /* The YouTube iframe API is loaded only when there is a YouTube frame on
     the page, and everything that uses it degrades if it never arrives. */
  function mountYouTube() {
    var frame = $('mdYT');
    ytPlayer = null;
    if (!frame) return;
    function make() {
      try {
        ytPlayer = new window.YT.Player('mdYT', {
          events: { onReady: function () { ytReady = true; } }
        });
      } catch (e) { ytPlayer = null; }
    }
    if (window.YT && window.YT.Player) { make(); return; }
    if (!document.getElementById('ytApi')) {
      var s = document.createElement('script');
      s.id = 'ytApi';
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof prev === 'function') try { prev(); } catch (e) {}
      make();
    };
  }

  function currentTime() {
    var el = $('mdMedia');
    if (el && isFinite(el.currentTime)) return Math.floor(el.currentTime);
    if (ytPlayer && ytPlayer.getCurrentTime) {
      try { return Math.floor(ytPlayer.getCurrentTime() || 0); } catch (e) {}
    }
    return -1;
  }
  function seekTo(secs) {
    var el = $('mdMedia');
    if (el) { try { el.currentTime = secs; el.play(); return true; } catch (e) {} }
    if (ytPlayer && ytPlayer.seekTo) {
      try { ytPlayer.seekTo(secs, true); ytPlayer.playVideo(); return true; } catch (e) {}
    }
    return false;
  }

  function openMarkDialog(at) {
    var r = res();
    if (!r) return;
    var d = D();
    openDlg({
      title: at >= 0 ? ('Note at ' + d.fmtClock(at)) : 'New note',
      saveLabel: 'Add note',
      body:
        fText('Time', 'at', at >= 0 ? d.fmtClock(at) : '', 'e.g. 12:40 — leave empty for a note with no time') +
        '<div class="ath-field"><span class="ath-field-label">Note</span>' +
          '<div class="rs-paste" style="min-height:120px"><div class="rs-rich" contenteditable="true" ' +
          'data-ph="What happened here."></div></div></div>',
      onSave: function (v) {
        var html = d.sanitizeHtml(v.__html || '');
        if (!d.htmlToText(html)) { toast('The note is empty', true); return; }
        d.Marks.add({ resourceId: r.id, at: d.parseClock(v.at), bodyHtml: html });
        toast('Note added');
      }
    });
  }

  function wireMedia() {
    on('rsPage', 'click', '[data-act="add-mark"]', function () { openMarkDialog(-1); });
    on('rsPage', 'click', '[data-act="capture"]', function () {
      var t = currentTime();
      if (t < 0) { toast('Start it playing first, then the time fills itself in'); }
      openMarkDialog(t);
    });
    on('rsPage', 'click', '[data-seek]', function (e, t) {
      if (!seekTo(parseInt(t.getAttribute('data-seek'), 10) || 0)) {
        toast('That player will not take a cue from this page', true);
      }
    });
    on('rsPage', 'click', '[data-act="del-mark"]', function (e, t) {
      var d = D(), m = d.Marks.get(t.getAttribute('data-id'));
      if (!m) return;
      if (!confirm('Remove this note?')) return;
      d.Marks.remove(m.id);
      toast('Note removed');
      render({ top: false });
    });
    on('rsPage', 'click', '[data-act="watched"]', function () {
      var d = D(), r = res();
      if (!r) return;
      var done = r.bucket === 'completed';
      d.Resources.update(r.id, {
        bucket: done ? 'active' : 'completed',
        progress: done ? r.progress : 100,
        finishedAt: done ? '' : d.todayISO()
      });
      toast(done ? 'Back on the active shelf' : 'Marked watched');
      render({ top: false });
    });
  }

  // ============================================================
  // §RENDER
  // ============================================================
  function renderMissing() {
    $('rsPage').innerHTML =
      '<div class="rs-missing">' + backLink(true) +
      '<div class="ath-empty" style="margin-top:var(--sp-5)"><b>No such resource</b>' +
      'This page needs a resource id in its address, like <code>athenaeum-resource.html?id=…</code>. ' +
      'Everything on the shelf is reachable from the Library.' +
      '<div style="margin-top:var(--sp-5)"><a class="ath-btn ath-btn-sm" href="athenaeum-resources.html">Back to the Library</a></div>' +
      '</div></div>';
  }

  function render(opts) {
    opts = opts || {};
    var y = window.scrollY;
    var r = res();
    // NOT terminal: the first paint can legitimately find nothing, because
    // the cloud pull may not have landed yet. onApplied re-runs this.
    if (!r) { renderMissing(); return; }
    document.title = (r.title || 'Resource') + ' — The Athenaeum';
    var template = TEMPLATE_OF[r.type] || 'page';
    if (template === 'reader') renderReader(r);
    else if (template === 'media') renderMedia(r);
    else renderPage(r);
    wirePlates();
    // Every repaint re-creates the editors, so anything a refresh (or a
    // cloud pull) interrupted has to be put back into the new nodes.
    runSafely(restoreRichDrafts, 'restoreRichDrafts');
    if (!opts.top) window.scrollTo({ top: y, behavior: 'auto' });
  }

  /* A cloud pull must never wipe what is being typed, and must never
     scroll. isContentEditable is in the guard because a rich editor is not
     an INPUT — without it, a sync repaint eats a half-written chapter. */
  function refreshCurrentView() {
    if ($('rsDlgBg').classList.contains('show')) return;
    if (window.AthResourceEditor && AthResourceEditor.isOpen()) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return;
    runSafely(render, 'refresh');
  }

  function wirePlates() {
    var plates = [].slice.call(document.querySelectorAll('#rsPage [data-plate]'));
    if (!plates.length || wirePlates.done) { wirePlates.done = true; }
    if (!plates.length) return;
    if (!wirePlates.bound) {
      wirePlates.bound = true;
      var queued = false;
      function tick() {
        queued = false;
        var live = [].slice.call(document.querySelectorAll('#rsPage [data-plate]'));
        var rects = live.map(function (p) { return p.getBoundingClientRect(); });
        live.forEach(function (p, i) {
          var rc = rects[i];
          var out = rc.height ? Math.min(1, Math.max(0, -rc.top / rc.height)) : 0;
          p.style.setProperty('--ath-out', out.toFixed(3));
        });
      }
      function req() { if (!queued) { queued = true; requestAnimationFrame(tick); } }
      window.addEventListener('scroll', req, { passive: true });
      window.addEventListener('resize', req);
      wirePlates.tick = tick;
    }
    if (wirePlates.tick) wirePlates.tick();
  }

  function openEditor() {
    var r = res();
    if (!window.AthResourceEditor) { toast('The editor did not load', true); return; }
    AthResourceEditor.open(r, { toast: toast, onSaved: function () { render({ top: false }); } });
  }

  function deleteResource() {
    var d = D(), r = res();
    if (!r) return;
    var chapters = d.chaptersFor(r.id).length, marks = d.marksFor(r.id).length;
    var extra = [];
    if (chapters) extra.push(chapters + (chapters === 1 ? ' chapter' : ' chapters'));
    if (marks) extra.push(marks + (marks === 1 ? ' note' : ' notes'));
    if (!confirm('Delete “' + (r.title || 'Untitled') + '”?\n\n' +
      (extra.length ? 'Its ' + extra.join(' and ') + ' go with it. ' : '') +
      'Anything crediting it keeps its own text — only the link is removed.')) return;
    d.removeResource(r.id);
    navigateAfterWrites('athenaeum-resources.html');
  }

  /* §DURABLE-NAV. local-store-idb.js's setItem returns as soon as the
     in-memory map is updated; the IndexedDB transaction it fires is still
     in flight. Leaving the document in the same tick can lose it. Opening
     our own readwrite transaction on the same store and waiting for it to
     complete guarantees everything queued before it has committed. */
  function navigateAfterWrites(url) {
    var go = function () { location.href = url; };
    try {
      var req = indexedDB.open('personal-dashboard-kv');
      req.onsuccess = function () {
        var db = req.result;
        try {
          var tx = db.transaction('kv', 'readwrite');
          tx.oncomplete = go; tx.onerror = go; tx.onabort = go;
          tx.objectStore('kv').get('__flush__');
        } catch (e) { go(); }
      };
      req.onerror = go;
      setTimeout(go, 600);           // never hang on a browser that refuses
    } catch (e) { go(); }
  }

  // ============================================================
  // §WIRING
  // ============================================================
  function wire() {
    wireRich();
    on('rsPage', 'click', '[data-act="edit-resource"]', openEditor);
    on('rsPage', 'click', '[data-act="del-resource"]', deleteResource);

    on('rsDlgBg', 'click', '[data-close]', function () { closeDlg(true); });
    $('rsDlgBg').addEventListener('click', function (e) { if (e.target === $('rsDlgBg')) closeDlg(true); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $('rsDlgBg').classList.contains('show')) closeDlg(true);
    });
    on('rsDlgBg', 'click', '[data-save]', function () {
      if (!dlgCtx || !dlgCtx.onSave) { closeDlg(true); return; }
      var cb = dlgCtx.onSave, v = dlgValues();
      // The dialog's own rich surface has to be read BEFORE it is torn down.
      var richEl = $('rsDlg').querySelector('[contenteditable]');
      v.__html = richEl ? richEl.innerHTML : '';
      closeDlg(true);
      runSafely(function () { cb(v); render({ top: false }); }, 'dialog save');
    });
    on('rsDlgBg', 'paste', '[contenteditable]', function (e, el) { handleRichPaste(el, e); });

    wireReader();
    wireMedia();
    wirePage();
  }

  // ============================================================
  // §BOOT
  // ============================================================
  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'athenaeum',
      syncedPrefixes: ['ath:'],
      // Five documents share this one row, which is precisely the shape
      // §HANDOFF was written for. Without it the next document boots with an
      // empty dirty set, its opening pull treats the row as authoritative, and
      // applyRemote overwrites what this document just wrote and had no time to
      // push — then pushes the erasure back as truth. See sync.js §HANDOFF.
      handoff: true,
      onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
    });
  }

  /* §HIDE-FLUSH — switching apps is not a blur.
     A rich field commits on a 700ms debounce and on blur. Backgrounding the
     page on a phone fires neither: the field keeps focus, and the OS may
     discard the document before the debounce runs. AthDraft's keystroke
     draft means nothing is truly lost, but it would surface as a "Recovered
     what you were writing" toast on the next visit rather than as text that
     had simply been saved. Commit properly instead. */
  function flushRich() {
    document.querySelectorAll('#rsPage [data-rich]').forEach(function (el) {
      runSafely(function () { commitRich(el, true); }, 'hide flush');
    });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushRich();
  });
  window.addEventListener('pagehide', flushRich);

  function boot() {
    var d = D();
    if (!d) { console.error('[Athenaeum] athenaeum-data.js did not load'); return; }
    // Snapshot BEFORE anything else this session does, and pinned: this is
    // the copy that answers "what did this device hold when I opened it",
    // which is the only question worth asking after a bad sync. boot() also
    // installs the shrink watch, so a pull that deletes a collection leaves
    // a pinned copy of the state as it was a moment earlier.
    // Lives under the registry's prefix for 'athenaeum', outside every synced
    // prefix — see snapshots.js.
    if (window.Snapshots) { try { window.Snapshots.forApp('athenaeum').boot(); } catch (e) { try { console.error('[snapshots]', e); } catch (e2) {} } }
    try {
      var p = new URLSearchParams(location.search);
      S.id = p.get('id') || '';
      S.chapterId = p.get('c') || '';
    } catch (e) { S.id = ''; }
    if (!S.chapterId) {
      var last = String(d.getUiState().lastChapter || '');
      if (last.indexOf(S.id + ':') === 0) S.chapterId = last.slice(S.id.length + 1);
    }
    wire();
    render({ top: true });
    d.maybeSeedAfterSyncAttempt(remoteRef, function () { refreshCurrentView(); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(function () { runSafely(boot, 'boot'); });
    } else {
      runSafely(boot, 'boot');
    }
  });
})();
</script>
</body>
