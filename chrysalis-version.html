<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Chrysalis — The Becoming</title>

<!-- MUST be first and never deferred: it replaces window.localStorage
     before any other script reads it. -->
<script src="local-store-idb.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrysalis-theme.css">

<style>
/* ============================================================
   THE BECOMING — page-specific only.
   Order is fixed and deliberate: you should SEE the person before
   you read about them, and read about them before you measure the
   distance. Image board, then portrait, then timeline.
   ============================================================ */

.chr-route{ padding-top:max(var(--chr-band), 96px) }
[hidden]{ display:none !important }

/* The image board, its drop zone and its lightbox now live in
   chrysalis-theme.css — Today shows the same gallery, and a pattern
   that appears twice is a component. */

/* ---------- portrait ---------- */
.chr-q{ padding:clamp(26px,4.4vh,44px) 0; border-top:1px solid var(--chr-hair) }
.chr-q:first-of-type{ border-top:0 }
.chr-q__label{
  display:block; margin:0 0 4px;
  font-family:var(--chr-display); font-weight:400;
  font-size:clamp(1.15rem,2.2vw,1.55rem);
  letter-spacing:.05em; color:var(--chr-ink);
}
.chr-q__hint{ display:block; margin:0 0 14px; color:var(--chr-ink-mute); font-size:14.5px }
.chr-q__field{
  width:100%; min-height:104px;
  border:0; border-bottom:1px solid var(--chr-hair);
  background:transparent; color:var(--chr-ink);
  font-family:var(--chr-body); font-weight:300;
  font-size:16px; line-height:1.8;
  padding:8px 2px 14px; resize:vertical;
  transition:border-color var(--chr-quick) var(--chr-ease);
}
.chr-q__field::placeholder{ color:var(--chr-ink-mute); opacity:.55 }
.chr-q__field:hover{ border-bottom-color:var(--chr-hair-warm) }
.chr-q__field:focus{ outline:none; border-bottom-color:var(--chr-rose) }

/* ---------- timeline ---------- */
.chr-tl{ overflow-x:auto; overflow-y:hidden; padding-bottom:6px }
.chr-tl svg{ display:block; min-width:640px; width:100% }
.chr-tl-list{ list-style:none; margin:clamp(24px,4vh,40px) 0 0; padding:0 }
.chr-tl-list li{
  display:flex; gap:clamp(12px,2vw,26px); align-items:baseline;
  padding:14px 0; border-top:1px solid var(--chr-hair);
}
.chr-tl-list__when{ flex:none; width:clamp(96px,14vw,150px); color:var(--chr-rose) }
.chr-tl-list__what{ flex:1 1 auto; min-width:0 }
.chr-tl-list__what p{ margin:4px 0 0; color:var(--chr-ink-mute); font-size:14.5px }

.chr-form{ display:grid; gap:clamp(16px,2.6vh,24px); max-width:var(--chr-field-w); margin-top:clamp(22px,4vh,34px) }
.chr-form__row{ display:grid; gap:6px }
.chr-form__two{ display:grid; grid-template-columns:1fr 2fr; gap:clamp(16px,2.6vw,26px) }

.chr-readonly{
  margin-bottom:clamp(26px,4vh,40px);
  padding:16px 0;
  border-block:1px solid var(--chr-hair-warm);
  color:var(--chr-rose-hi);
  font-size:14.5px;
}

@media (max-width:640px){
  .chr-form__two{ grid-template-columns:1fr }
  .chr-tl-list li{ flex-wrap:wrap; gap:2px }
  .chr-tl-list__when{ width:100% }
}
</style>
</head>
<body>

<div class="chr-grain" aria-hidden="true"></div>

<header class="chr-reel chr-reel--short">
  <div class="chr-reel__stage">
    <div class="chr-reel__bg" aria-hidden="true">
      <video id="chrHeroVideo" autoplay muted loop playsinline preload="metadata"
             poster="images_by_admin/chrysalis/hero-poster.jpg">
        <source src="images_by_admin/chrysalis/hero.mp4" type="video/mp4">
      </video>
      <img id="chrHeroImg" alt="" hidden>
      <div class="chr-reel__crush"></div>
      <div class="chr-reel__wine"></div>
      <div class="chr-reel__glow"></div>
      <div class="chr-reel__edge"></div>
    </div>
    <div class="chr-reel__copy">
      <div class="chr-cell">
        <div class="chr-hero__inner">
          <p class="chr-eyebrow" id="chrHeroEyebrow">The Becoming</p>
          <h1 class="chr-hero__title" id="chrHeroTitle">&nbsp;</h1>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="chrRoot"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="photo-store.js"></script>
<script src="chrysalis-data.js"></script>
<!-- Keystroke-durable drafts. The file is named for the Athenaeum but
     the mechanism is general: it writes to REAL localStorage through a
     hidden iframe, under an unsynced prefix, because a flush at unload
     is documented in this repo as often never committing. -->
<script src="athenaeum-drafts.js"></script>
<script src="chrysalis-board.js"></script>
<script src="chrysalis-nav.js"></script>
<script src="topbar.js" defer></script>

<script>
/* ============================================================
   THE BECOMING — one version's own page.
   Section order is fixed: image board, written portrait, timeline.
   See the person, then read them, then measure the distance.
   ============================================================ */
(function () {
  'use strict';

  var DB = window.ChrysalisDB;
  var root = document.getElementById('chrRoot');
  if (!DB || !root) { console.error('[Chrysalis] chrysalis-data.js did not load'); return; }

  var versionId = new URLSearchParams(location.search).get('id') || '';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'chrysalis',
      syncedPrefixes: ['chr:'],
      onApplied: function () { remoteRef.applied = true; repaint(); }
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function dayNum(iso) {
    var d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
    return isNaN(d) ? null : d.getTime();
  }

  /* Two different things, deliberately not one function.
     refresh() — the reader just did something. Always render.
     repaint() — something arrived from outside (a cloud pull, another
     tab). Defer it while the caret is in a field, because re-rendering
     under someone's hands drops their focus and caret mid-sentence.
     Conflating them swallows the reader's own updates: a caption still
     focused made every later action look like "someone is typing". */
  function refresh() {
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  var repaintQueued = false;
  function isTyping() {
    var a = document.activeElement;
    return !!(a && root.contains(a) && /INPUT|TEXTAREA/.test(a.tagName));
  }
  function repaint() {
    if (isTyping()) { repaintQueued = true; return; }
    refresh();
  }
  document.addEventListener('focusout', function () {
    if (!repaintQueued) return;
    window.setTimeout(function () {
      if (isTyping()) return;
      repaintQueued = false; refresh();
    }, 0);
  });

  // ============================================================
  // RENDER
  // ============================================================
  var draftBinding = null;

  function render() {
    var v = DB.Versions.get(versionId);

    if (!v) {
      document.getElementById('chrHeroTitle').textContent = 'Not found';
      root.innerHTML =
        '<section class="chr-band chr-route"><div class="chr-band__inner">' +
          '<h2 class="chr-h2">No such version</h2>' +
          '<p class="chr-lede">This page needs a version to describe. It may have been deleted.</p>' +
          '<p><a class="chr-act" href="chrysalis.html#/versions">All versions</a></p>' +
        '</div></section>';
      return;
    }

    var readOnly = v.status === 'archived';
    document.getElementById('chrHeroTitle').textContent = v.name || 'Untitled version';
    document.getElementById('chrHeroEyebrow').textContent =
      readOnly ? 'Graduated · ' + fmt(v.graduatedAt) : 'The person you are becoming';

    /* This hero shows the VERSION's cover image when there is one —
       the whole point of the page is to look at the person. The footage
       is what plays when no cover has been chosen yet, rather than a
       frozen poster frame. Only one of the two is ever in the layer. */
    var anchor = DB.Images.anchorFor(versionId);
    var heroImg = document.getElementById('chrHeroImg');
    var heroVid = document.getElementById('chrHeroVideo');
    if (anchor && anchor.url) {
      heroImg.src = anchor.url;
      heroImg.hidden = false;
      heroVid.hidden = true;
      heroVid.pause();
    } else {
      heroImg.hidden = true;
      heroImg.removeAttribute('src');
      heroVid.hidden = false;
      if (!reduce.matches) {
        var p = heroVid.play();
        if (p && p.catch) p.catch(function () {});
      }
    }

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<p class="chr-label"><a class="chr-link" href="chrysalis.html#/versions">All versions</a></p>' +
        (readOnly
          ? '<p class="chr-readonly">This version has graduated, so it is read-only. ' +
            'The past self stays exactly as it was written — that is the point of keeping it.</p>'
          : '') +
        (v.intent ? '<p class="chr-lede">' + esc(v.intent) + '</p>' : '') +
      '</div></section>' +

      seam() +
      sectionBoard(readOnly) +
      seam() +
      sectionPortrait(v, readOnly) +
      seam() +
      sectionTimeline(v, readOnly);

    wireBoard(readOnly);
    wirePortrait(v, readOnly);
    wireTimeline(v, readOnly);
  }

  function seam() {
    return '<div class="chr-seam" aria-hidden="true">' +
      '<span class="chr-seam__rule"></span><span class="chr-seam__thread"></span>' +
      '<span class="chr-knot"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width=".9">' +
      '<circle cx="20" cy="20" r="5.4"/><circle cx="20" cy="20" r="1.6" fill="currentColor" stroke="none"/>' +
      '<path d="M14.6 14.6l-4 -4M25.4 14.6l4 -4M14.6 25.4l-4 4M25.4 25.4l4 4" stroke-opacity=".45"/>' +
      '</svg></span></div>';
  }

  var ICON = window.ChrBoard.ICON;

  // ============================================================
  // 1 · IMAGE BOARD
  //
  // Markup, wiring, upload and lightbox all live in
  // chrysalis-board.js now: Today shows the same gallery, over the
  // same records, and two hand-copied versions would have drifted.
  // ============================================================
  function sectionBoard(readOnly) {
    return window.ChrBoard.section({
      versionId: versionId,
      readOnly: readOnly,
      label: 'One',
      title: 'The Image Board'
    });
  }

  function wireBoard(readOnly) {
    window.ChrBoard.wire(root, { versionId: versionId, readOnly: readOnly }, refresh);
  }

  // ============================================================
  // 2 · WRITTEN PORTRAIT
  // ============================================================
  function sectionPortrait(v, readOnly) {
    var p = DB.Portraits.forVersionOrNew(versionId);
    var qs = DB.PORTRAIT_FIELDS.map(function (f) {
      var val = p.fields[f.key] || '';
      return '<div class="chr-q">' +
        '<label class="chr-q__label" for="q-' + f.key + '">' + esc(f.label) + '</label>' +
        '<span class="chr-q__hint">' + esc(f.hint) + '</span>' +
        (readOnly
          ? '<p class="chr-prose" style="white-space:pre-wrap;color:var(--chr-ink)">' +
            (val ? esc(val) : '<span style="color:var(--chr-ink-mute)">Left unanswered.</span>') + '</p>'
          : '<textarea class="chr-q__field" id="q-' + f.key + '" data-field="' + f.key + '" ' +
            'placeholder="Write as though it is already true.">' + esc(val) + '</textarea>') +
      '</div>';
    }).join('');

    return '<section class="chr-band" aria-labelledby="portrait-h"><div class="chr-band__inner">' +
      '<p class="chr-label">Two</p>' +
      '<h2 class="chr-h2" id="portrait-h">The Written Portrait</h2>' +
      '<p class="chr-lede">Six questions about <em>character</em>, not circumstance. ' +
      'Your schedule and surroundings already have a home in the Morning Ritual; ' +
      'this asks who you are inside them.</p>' +
      '<div id="chrPortrait">' + qs + '</div>' +
      '<p class="chr-meta" id="chrPortraitSaved" style="margin-top:20px">' +
        (p.updatedAt ? 'Last written ' + fmt(p.updatedAt) : 'Not started yet') +
      '</p>' +
      '</div></section>';
  }

  function wirePortrait(v, readOnly) {
    if (readOnly) return;
    var wrap = root.querySelector('#chrPortrait');
    var stamp = root.querySelector('#chrPortraitSaved');
    if (!wrap) return;

    /* Keystroke-durable drafts, restored if a refresh beat the save. */
    if (window.AthDraft) {
      if (draftBinding && draftBinding.save) draftBinding.save();
      draftBinding = window.AthDraft.bind('chrysalis-portrait-' + versionId, wrap, {
        onRestore: function () {
          stamp.textContent = 'Restored unsaved writing from your last visit.';
        }
      });
    }

    /* DB.autosave commits while typing AND on blur, so leaving the
       page mid-answer cannot lose the answer. */
    wrap.querySelectorAll('[data-field]').forEach(function (ta) {
      DB.autosave(ta, function (value) {
        DB.Portraits.write(versionId, ta.getAttribute('data-field'), value);
        stamp.textContent = 'Last written ' + fmt(new Date().toISOString());
        if (draftBinding && draftBinding.clear) {
          draftBinding.clear();
          draftBinding = window.AthDraft
            ? window.AthDraft.bind('chrysalis-portrait-' + versionId, wrap, { skipRestore: true })
            : null;
        }
      });
    });
  }

  // ============================================================
  // 3 · TIMELINE OF BECOMING
  // Hand-rolled SVG, no charting library. The SVG is decorative; the
  // list beneath it is the real, readable content.
  // ============================================================
  function timelineEvents(v) {
    var ev = [];
    if (v.startDate) ev.push({ date: v.startDate, title: 'This version begins', kind: 'start' });
    DB.Milestones.forVersionByDate(versionId).forEach(function (m) {
      if (!m.date) return;
      ev.push({ date: m.date, title: m.title || 'Untitled milestone', note: m.note, kind: 'milestone', id: m.id });
    });

    /* Evidence threads through, clustered by the week it landed in.
       One node per week rather than per entry: a busy fortnight should
       read as weight on the spine, not as a wall of pins. */
    var weeks = DB.Evidence.byWeek(DB.Evidence.forVersionId(versionId));
    Object.keys(weeks).forEach(function (monday) {
      var list = weeks[monday];
      var acted = list.filter(function (e) { return e.kind === 'acted'; }).length;
      var fell = list.length - acted;
      ev.push({
        date: monday,
        title: list.length + (list.length === 1 ? ' entry' : ' entries'),
        note: [acted ? acted + ' acting as the new self' : '',
               fell ? fell + ' falling back' : ''].filter(Boolean).join(', '),
        kind: 'evidence',
        count: list.length
      });
    });
    /* The weekly paragraph, which is the point of sitting down to the
       review at all: the only prose in the system about a stretch of
       time rather than a moment, and what makes a graduated version
       still readable in a year. */
    DB.Reviews.writtenForVersion(versionId).forEach(function (r) {
      ev.push({ date: r.weekOf, title: 'The week, written', note: r.paragraph, kind: 'review' });
    });

    if (v.graduatedAt) ev.push({ date: v.graduatedAt.slice(0, 10), title: 'Graduated', kind: 'end' });
    else if (v.targetDate) ev.push({ date: v.targetDate, title: 'Target', kind: 'target' });
    return ev.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  }

  function sectionTimeline(v, readOnly) {
    var ev = timelineEvents(v);
    return '<section class="chr-band" aria-labelledby="tl-h"><div class="chr-band__inner">' +
      '<p class="chr-label">Three</p>' +
      '<h2 class="chr-h2" id="tl-h">The Timeline of Becoming</h2>' +
      '<p class="chr-lede">How far you have actually come — the version\'s own dates, the marks you ' +
      'put on it, the weeks you <em>wrote</em>, and the weeks your evidence landed in, drawn as ' +
      'weight on the spine.</p>' +
      (ev.length
        ? '<div class="chr-tl">' + timelineSvg(ev) + '</div>' +
          '<ol class="chr-tl-list">' + ev.map(function (e) {
            return '<li><span class="chr-tl-list__when chr-meta">' + esc(fmt(e.date)) + '</span>' +
              '<span class="chr-tl-list__what"><strong style="font-weight:400">' + esc(e.title) + '</strong>' +
              (e.note ? '<p>' + esc(e.note) + '</p>' : '') + '</span></li>';
          }).join('') + '</ol>'
        : '<p class="chr-prose">Nothing to draw yet — give the version a start date, or add a milestone.</p>') +
      (readOnly ? '' :
        '<form class="chr-form" id="chrMilestone">' +
          '<p class="chr-label" style="margin:0">Add a milestone</p>' +
          '<div class="chr-form__two">' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="msDate">When</label>' +
              '<input class="chr-field" id="msDate" name="date" type="date" required>' +
            '</div>' +
            '<div class="chr-form__row">' +
              '<label class="chr-meta" for="msTitle">What happened</label>' +
              '<input class="chr-field" id="msTitle" name="title" type="text" required ' +
                'placeholder="Something that marks the change" maxlength="160">' +
            '</div>' +
          '</div>' +
          '<div class="chr-form__row">' +
            '<label class="chr-meta" for="msNote">Why it counts</label>' +
            '<input class="chr-field" id="msNote" name="note" type="text" maxlength="1200" ' +
              'placeholder="Optional">' +
          '</div>' +
          '<p><button class="chr-act" type="submit">Add milestone</button></p>' +
        '</form>' +
        (DB.Milestones.forVersion(versionId).length
          ? '<p class="chr-meta" style="margin-top:26px">Remove a milestone</p>' +
            '<ul class="chr-tl-list" style="margin-top:8px">' +
            DB.Milestones.forVersionByDate(versionId).map(function (m) {
              return '<li><span class="chr-tl-list__when chr-meta">' + esc(fmt(m.date)) + '</span>' +
                '<span class="chr-tl-list__what">' + esc(m.title || 'Untitled') + '</span>' +
                '<button class="chr-tick chr-tick--danger" type="button" data-act="delms" ' +
                  'data-id="' + m.id + '" aria-label="Delete milestone">' + ICON.del + '</button></li>';
            }).join('') + '</ul>'
          : '')) +
      '</div></section>';
  }

  function timelineSvg(ev) {
    var W = 1000, H = 150, padX = 60, y = 74;
    var times = ev.map(function (e) { return dayNum(e.date); }).filter(function (t) { return t !== null; });
    if (!times.length) return '';
    var now = Date.now();
    var min = Math.min.apply(null, times.concat([now]));
    var max = Math.max.apply(null, times.concat([now]));
    var span = Math.max(1, max - min);
    var x = function (t) { return padX + ((t - min) / span) * (W - padX * 2); };

    var COLOUR = { start: '#C08A72', milestone: '#E8C0AC', target: '#8E8681',
                   end: '#B08D57', evidence: '#8E6A58', review: '#C08A72' };

    var parts = [
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-hidden="true" focusable="false">',
      '<line x1="' + padX + '" y1="' + y + '" x2="' + (W - padX) + '" y2="' + y + '" ' +
        'stroke="rgba(192,138,114,.30)" stroke-width="1"/>'
    ];

    // today
    var tx = x(now);
    parts.push('<line x1="' + tx + '" y1="' + (y - 26) + '" x2="' + tx + '" y2="' + (y + 26) + '" ' +
      'stroke="rgba(237,231,225,.22)" stroke-width="1" stroke-dasharray="2 4"/>');
    parts.push('<text x="' + tx + '" y="' + (y + 44) + '" text-anchor="middle" ' +
      'fill="#8E8681" font-family="Inter,sans-serif" font-size="9" letter-spacing="2">TODAY</text>');

    /* Evidence weeks sit ON the spine as weight, unlabelled — the dated
       marks are what carry meaning, and labelling every week would bury
       them. The list beneath names all of it either way. */
    ev.filter(function (e) { return e.kind === 'evidence'; }).forEach(function (e) {
      var t = dayNum(e.date); if (t === null) return;
      var r = Math.min(9, 2.6 + e.count * 1.1);
      parts.push('<circle cx="' + x(t) + '" cy="' + y + '" r="' + r + '" ' +
        'fill="' + COLOUR.evidence + '" fill-opacity=".26" stroke="' + COLOUR.evidence + '" stroke-width=".8"/>');
    });

    var labelled = ev.filter(function (e) { return e.kind !== 'evidence'; });
    labelled.forEach(function (e, i) {
      var t = dayNum(e.date); if (t === null) return;
      var cx = x(t);
      var up = i % 2 === 0;
      var ly = up ? y - 22 : y + 22;
      var col = COLOUR[e.kind] || COLOUR.milestone;
      parts.push('<line x1="' + cx + '" y1="' + y + '" x2="' + cx + '" y2="' + ly + '" stroke="' + col + '" stroke-opacity=".5" stroke-width="1"/>');
      parts.push('<circle cx="' + cx + '" cy="' + y + '" r="' + (e.kind === 'milestone' ? 3.4 : 5) + '" ' +
        'fill="none" stroke="' + col + '" stroke-width="1.1"/>');
      if (e.kind !== 'milestone') {
        parts.push('<circle cx="' + cx + '" cy="' + y + '" r="1.6" fill="' + col + '"/>');
      }
      parts.push('<text x="' + cx + '" y="' + (up ? ly - 8 : ly + 14) + '" text-anchor="middle" ' +
        'fill="#EDE7E1" font-family="Cormorant Garamond,serif" font-size="15">' +
        esc(e.title.length > 26 ? e.title.slice(0, 25) + '…' : e.title) + '</text>');
    });

    parts.push('</svg>');
    return parts.join('');
  }

  function wireTimeline(v, readOnly) {
    if (readOnly) return;
    var f = root.querySelector('#chrMilestone');
    if (f) f.addEventListener('submit', function (e) {
      e.preventDefault();
      var title = f.title.value.trim();
      var date = f.date.value;
      if (!title || !date) return;
      DB.Milestones.add({ versionId: versionId, date: date, title: title, note: f.note.value.trim() });
      refresh();
    });
    root.querySelectorAll('[data-act="delms"]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this milestone?')) return;
        DB.Milestones.remove(b.getAttribute('data-id'));
        refresh();
      });
    });
  }

  // ============================================================
  // BOOT
  // ============================================================
  DB.onChange(repaint);

  function boot() {
    if (window.ChrNav) window.ChrNav.mount({ page: 'becoming' });
    render();
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(boot);
    } else { boot(); }
  });
})();
</script>
