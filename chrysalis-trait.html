<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Chrysalis — Trait</title>

<!-- MUST be first and never deferred: it replaces window.localStorage
     before any other script reads it. -->
<script src="local-store-idb.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrysalis-theme.css">

<style>
/* ============================================================
   A TRAIT — the permanent record. Page-specific only.
   ============================================================ */
.chr-route{ padding-top:max(var(--chr-band), 96px) }
[hidden]{ display:none !important }

/* --- old self → new self, symmetrical by design --- */
.chr-pair{
  display:grid; grid-template-columns:1fr auto 1fr;
  gap:clamp(16px,3vw,40px); align-items:start;
  margin-top:clamp(20px,3vh,32px);
}
.chr-pair__arrow{
  align-self:center; color:var(--chr-rose);
  font-family:var(--chr-display); font-size:1.6rem;
}
.chr-pair__side h3{
  margin:0 0 10px; font-family:var(--chr-body);
  font-size:10.5px; font-weight:400; letter-spacing:.3em;
  text-transform:uppercase; color:var(--chr-ink-mute);
}
.chr-pair__field{
  width:100%; min-height:92px;
  border:0; border-bottom:1px solid var(--chr-hair);
  background:transparent; color:var(--chr-ink);
  font-family:var(--chr-body); font-weight:300;
  font-size:15.5px; line-height:1.75; padding:6px 2px 12px; resize:vertical;
  transition:border-color var(--chr-quick) var(--chr-ease);
}
.chr-pair__field:hover{ border-bottom-color:var(--chr-hair-warm) }
.chr-pair__field:focus{ outline:none; border-bottom-color:var(--chr-rose) }
.chr-pair__field::placeholder{ color:var(--chr-ink-mute); opacity:.55 }

/* .chr-ladder, .chr-ev and .chr-capture now live in chrysalis-theme.css — the daily
   surface logs evidence too, and a pattern that appears twice is a
   component, not a copy. */

.chr-note{
  margin-top:clamp(26px,4vh,40px); padding-top:18px;
  border-top:1px solid var(--chr-hair);
  color:var(--chr-ink-mute); font-size:14.5px;
}

@media (max-width:700px){
  .chr-pair{ grid-template-columns:1fr }
  .chr-pair__arrow{ transform:rotate(90deg); justify-self:start }
}
</style>
</head>
<body>

<div class="chr-grain" aria-hidden="true"></div>

<header class="chr-reel chr-reel--short">
  <div class="chr-reel__stage">
    <div class="chr-reel__bg" aria-hidden="true">
      <video autoplay muted loop playsinline preload="metadata"
             poster="images_by_admin/chrysalis/hero-poster.jpg">
        <source src="images_by_admin/chrysalis/hero.mp4" type="video/mp4">
      </video>
      <div class="chr-reel__crush"></div>
      <div class="chr-reel__wine"></div>
      <div class="chr-reel__glow"></div>
      <div class="chr-reel__edge"></div>
    </div>
    <div class="chr-reel__copy">
      <div class="chr-cell">
        <div class="chr-hero__inner">
          <p class="chr-eyebrow">I am someone who</p>
          <h1 class="chr-hero__title" id="chrHeroTitle">&nbsp;</h1>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="chrRoot"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js"></script>
<script src="chrysalis-data.js"></script>
<script src="athenaeum-drafts.js"></script>
<script src="chrysalis-nav.js"></script>
<script src="topbar.js" defer></script>

<script>
/* ============================================================
   A TRAIT — permanent. Old self → new self, the embodiment ladder,
   and every piece of evidence ever logged against it.
   Evidence is ADDITIVE ONLY: a fall-back is recorded as information,
   never as failure, and nothing here is scored or streaked.
   ============================================================ */
(function () {
  'use strict';

  var DB = window.ChrysalisDB;
  var root = document.getElementById('chrRoot');
  if (!DB || !root) { console.error('[Chrysalis] chrysalis-data.js did not load'); return; }

  var traitId = new URLSearchParams(location.search).get('id') || '';

  var remoteRef = { applied: false };
  if (typeof window.initCloudSync === 'function' && window.supabase) {
    window.initCloudSync({
      appKey: 'chrysalis',
      syncedPrefixes: ['chr:'],
      onApplied: function () { remoteRef.applied = true; repaint(); }
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* Two different things, deliberately not one function.
     refresh() — the reader just did something. Always render.
     repaint() — something arrived from outside (a cloud pull, another
     tab). Defer it while the caret is in a field, because re-rendering
     under someone's hands drops their focus and caret mid-sentence.
     Conflating the two swallows the reader's own updates: logging
     evidence re-focuses the capture box, which then looked like
     "someone is typing" and silently skipped the render. */
  function refresh() {
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  var repaintQueued = false;
  function isTyping() {
    var a = document.activeElement;
    return !!(a && root.contains(a) && /INPUT|TEXTAREA/.test(a.tagName));
  }
  function repaint() {
    if (isTyping()) { repaintQueued = true; return; }
    refresh();
  }
  document.addEventListener('focusout', function () {
    if (!repaintQueued) return;
    window.setTimeout(function () {
      if (isTyping()) return;
      repaintQueued = false; refresh();
    }, 0);
  });

  function seam() {
    return '<div class="chr-seam" aria-hidden="true">' +
      '<span class="chr-seam__rule"></span><span class="chr-seam__thread"></span>' +
      '<span class="chr-knot"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width=".9">' +
      '<circle cx="20" cy="20" r="5.4"/><circle cx="20" cy="20" r="1.6" fill="currentColor" stroke="none"/>' +
      '<path d="M14.6 14.6l-4 -4M25.4 14.6l4 -4M14.6 25.4l-4 4M25.4 25.4l4 4" stroke-opacity=".45"/>' +
      '</svg></span></div>';
  }

  var DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  function render() {
    var t = DB.Traits.get(traitId);

    if (!t) {
      document.getElementById('chrHeroTitle').textContent = 'Not found';
      root.innerHTML = '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<h2 class="chr-h2">No such trait</h2>' +
        '<p class="chr-lede">It may have been deleted.</p>' +
        '<p><a class="chr-act" href="chrysalis.html#/traits">All traits</a></p>' +
      '</div></section>';
      return;
    }

    document.getElementById('chrHeroTitle').textContent = t.statement || 'untitled';

    var ev = DB.Evidence.forTrait(t.id);
    var chasing = DB.Versions.chasing(t.id);
    var acted = ev.filter(function (e) { return e.kind === 'acted'; }).length;
    var fell = ev.length - acted;

    root.innerHTML =
      '<section class="chr-band chr-route"><div class="chr-band__inner">' +
        '<p class="chr-label"><a class="chr-link" href="chrysalis.html#/traits">All traits</a></p>' +
        '<div id="chrPair">' +
          '<div class="chr-pair">' +
            '<div class="chr-pair__side">' +
              '<h3>The old self</h3>' +
              '<textarea class="chr-pair__field" data-field="oldSelf" ' +
                'placeholder="What you have done instead, until now.">' + esc(t.oldSelf) + '</textarea>' +
            '</div>' +
            '<div class="chr-pair__arrow" aria-hidden="true">→</div>' +
            '<div class="chr-pair__side">' +
              '<h3>The new self</h3>' +
              '<textarea class="chr-pair__field" data-field="newSelf" ' +
                'placeholder="What this person does instead.">' + esc(t.newSelf) + '</textarea>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:clamp(24px,4vh,38px)">' +
            '<h3 style="margin:0 0 10px;font-family:var(--chr-body);font-size:10.5px;font-weight:400;' +
              'letter-spacing:.3em;text-transform:uppercase;color:var(--chr-ink-mute)">Why it matters</h3>' +
            '<textarea class="chr-pair__field" data-field="why" ' +
              'placeholder="What changes in your life if this becomes true.">' + esc(t.why) + '</textarea>' +
          '</div>' +
        '</div>' +
        (chasing.length
          ? '<p class="chr-note">Chased by ' + chasing.map(function (v) {
              return '<a class="chr-link" href="chrysalis-version.html?id=' + encodeURIComponent(v.id) + '">' +
                esc(v.name) + '</a>' + (v.status === 'archived' ? ' (graduated)' : '');
            }).join(', ') + '.</p>'
          : '<p class="chr-note">No version is chasing this trait yet. ' +
            '<a class="chr-link" href="chrysalis.html#/traits">Attach it to the current one.</a></p>') +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="rung-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Embodiment</p>' +
        '<h2 class="chr-h2" id="rung-h">Where You Are With It</h2>' +
        '<p class="chr-lede">Named rungs, not a score. Move it when it is true, not when you wish it were.</p>' +
        '<div class="chr-ladder" role="group" aria-label="Embodiment rung">' +
          DB.RUNGS.map(function (r, i) {
            var at = DB.RUNGS.indexOf(t.rung);
            var cls = i === at ? 'is-at' : (i < at ? 'is-below' : '');
            return '<button type="button" class="' + cls + '" data-rung="' + esc(r) + '" ' +
              'aria-pressed="' + (i === at) + '">' + esc(r) + '</button>';
          }).join('') +
        '</div>' +
        (t.rungLog.length
          ? '<ul class="chr-ev" aria-label="Rung history">' + t.rungLog.slice().reverse().map(function (r) {
              return '<li><span class="chr-ev__when chr-meta">' + esc(fmt(r.at)) + '</span>' +
                '<span class="chr-ev__what"><p>Moved to ' + esc(r.rung) + '</p></span></li>';
            }).join('') + '</ul>'
          : '<p class="chr-note">No movement recorded yet.</p>') +
      '</div></section>' +

      seam() +

      '<section class="chr-band" aria-labelledby="ev-h"><div class="chr-band__inner">' +
        '<p class="chr-label">Evidence</p>' +
        '<h2 class="chr-h2" id="ev-h">The Proof</h2>' +
        '<p class="chr-lede">' +
          (ev.length
            ? esc(acted + (acted === 1 ? ' time you acted as this person' : ' times you acted as this person')) +
              (fell ? esc(', and ' + fell + ' you did not. Both are information.') : '.')
            : 'Nothing logged yet. The first entry is the hardest and the most useful.') +
        '</p>' +

        '<form class="chr-capture" id="chrCapture">' +
          '<label class="chr-meta" for="evText">What happened</label>' +
          '<input class="chr-field chr-field--display" id="evText" name="text" type="text" required ' +
            'maxlength="2000" placeholder="One line. What you actually did.">' +
          '<div class="chr-capture__row">' +
            '<label class="chr-meta" for="evKind" style="flex:none">This was</label>' +
            '<select class="chr-field" id="evKind" name="kind" style="flex:0 1 220px">' +
              '<option value="acted">acting as the new self</option>' +
              '<option value="fellback">falling back to the old self</option>' +
            '</select>' +
            '<button class="chr-act" type="submit">Log it</button>' +
          '</div>' +
        '</form>' +

        (ev.length
          ? '<ul class="chr-ev">' + ev.map(function (e) {
              var v = e.versionId ? DB.Versions.get(e.versionId) : null;
              return '<li>' +
                '<span class="chr-ev__when chr-meta">' + esc(fmt(e.at)) + '</span>' +
                '<span class="chr-ev__what">' +
                  '<span class="chr-ev__kind ' + esc(e.kind) + '">' +
                    (e.kind === 'acted' ? 'Acted as the new self' : 'Fell back') +
                    (v ? ' · ' + esc(v.name) : '') +
                  '</span>' +
                  '<p>' + esc(e.text) + '</p>' +
                '</span>' +
                '<button class="chr-tick chr-tick--danger" type="button" data-del="' + e.id + '" ' +
                  'aria-label="Delete this entry">' + DEL + '</button>' +
              '</li>';
            }).join('') + '</ul>'
          : '') +

        '<p class="chr-note">Deleting this trait removes its evidence too. ' +
          '<button class="chr-act chr-act--small" type="button" id="chrDelTrait">Delete this trait</button></p>' +
      '</div></section>';

    wire(t);
  }

  function wire(t) {
    /* Keystroke-durable drafts for the long fields. */
    var pair = root.querySelector('#chrPair');
    if (window.AthDraft && pair) {
      window.AthDraft.bind('chrysalis-trait-' + traitId, pair, { skipRestore: false });
    }

    /* DB.autosave writes while typing AND on blur, so clicking a link
       mid-sentence cannot lose the sentence. */
    root.querySelectorAll('[data-field]').forEach(function (ta) {
      DB.autosave(ta, function (value) {
        var patch = {};
        patch[ta.getAttribute('data-field')] = value;
        DB.Traits.update(traitId, patch);
      });
    });

    root.querySelectorAll('[data-rung]').forEach(function (b) {
      b.addEventListener('click', function () {
        DB.Traits.setRung(traitId, b.getAttribute('data-rung'));
        refresh();
      });
    });

    var cap = root.querySelector('#chrCapture');
    if (cap) cap.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = cap.text.value.trim();
      if (!text) return;
      var cur = DB.Versions.current();
      DB.Evidence.add({
        traitId: traitId,
        versionId: cur ? cur.id : '',
        text: text,
        kind: cap.kind.value
      });
      cap.text.value = '';
      refresh();
      var f = root.querySelector('#evText');
      if (f) f.focus();
    });

    root.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Delete this entry? Evidence is meant to accumulate.')) return;
        DB.Evidence.remove(b.getAttribute('data-del'));
        refresh();
      });
    });

    var del = root.querySelector('#chrDelTrait');
    if (del) del.addEventListener('click', function () {
      if (!window.confirm('Delete "' + (t.statement || 'this trait') +
        '" and all ' + DB.Evidence.countFor(traitId) + ' of its evidence entries?')) return;
      DB.Traits.removeCascade(traitId);
      // removeCascade writes to four collections — evidence, practices,
      // versions, traits. local-store-idb.js commits those asynchronously, so
      // leaving in the same tick tore the page down mid-flight and the delete
      // silently did not stick. Wait for the commit, then go.
      if (window.LocalStoreIDB && window.LocalStoreIDB.navigate) {
        window.LocalStoreIDB.navigate('chrysalis.html#/traits');
      } else {
        location.href = 'chrysalis.html#/traits';
      }
    });
  }

  DB.onChange(repaint);

  function boot() {
    if (window.ChrNav) window.ChrNav.mount({ page: 'trait' });
    render();
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) {
      window.LocalStoreIDB.ready().then(boot);
    } else { boot(); }
  });
})();
</script>

</body>
</html>
