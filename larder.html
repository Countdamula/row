  // ============================================================
  // §SEARCH
  // ============================================================
  function openFind() {
    var box = $('hdFind');
    box.hidden = false;
    // hidden -> false, THEN the class, or there is no transition to run.
    requestAnimationFrame(function () { box.classList.add('is-on'); });
    document.body.classList.add('asc-locked');
    $('hdFindIn').value = q;
    $('hdFindIn').focus();
    paintFind(q);
  }
  function closeFind() {
    var box = $('hdFind');
    box.classList.remove('is-on');
    document.body.classList.remove('asc-locked');
    setTimeout(function () { box.hidden = true; }, 220);
  }
  function paintFind(text) {
    var out = $('hdFindOut');
    var needle = String(text || '').trim().toLowerCase();
    if (!needle) {
      out.innerHTML = '<p class="hd-find__hint">Type to search names, ingredients and tags.</p>';
      return;
    }
    var rows = L().Recipes.list().filter(function (r) { return matchesQuery(r, needle); }).slice(0, 8);
    if (!rows.length) {
      out.innerHTML = '<p class="hd-find__hint">Nothing matches &ldquo;' + esc(needle) + '&rdquo;.</p>';
      return;
    }
    out.innerHTML = '<p class="hd-find__n">' + U().plural(rows.length, 'match') + '</p>' +
      rows.map(function (r) {
        var cat = L().catById(r.groupId);
        var t = totalMin(r);
        return '<a class="hd-find__row" href="#/r/' + esc(r.id) + '" data-act="find-go" ' +
          'style="--lar-tint:' + esc(cat.hue) + '">' +
          '<span class="lar-chip__mark">' + catMark(r.groupId, 20) + '</span>' +
          '<span><b>' + esc(r.title) + '</b><i>' + esc(cat.label) +
            (t ? ' &middot; ' + esc(minsLabel(t)) : '') + '</i></span>' +
        '</a>';
      }).join('');
  }

  // ============================================================
  // §RENDER
  // ============================================================
  function render() {
    var res = resolve();
    route = res.view === 'recipe' ? (route === 'kept' ? 'kept' : 'recipes')
          : res.view === 'library' ? 'recipes' : res.view;
    paintNav();

    if (res.view === 'recipe') { viewRecipe(res.id); retryLocalUploads(res.id); }
    else if (res.view === 'grocery') viewGrocery();
    else if (res.view === 'kept') viewKept();
    else if (res.view === 'settings') viewSettings();
    else viewLibrary();

    if (readScroll) readScroll(true);
  }

  /* Repaints the current view WITHOUT navigating, and RESTORES the
     scroll. Scroll-to-top belongs to navigation and only to
     navigation — a repaint that bounced the page to the top is
     exactly the bug the sync layer already had once.

     It also refuses to run while a field has focus or a sheet is
     open: a cloud pull does not get to rebuild the DOM under
     someone's hands. It gets its turn on the next navigation. */
  function refreshCurrentView() {
    if (!U().safeToRepaint()) return;
    if (!$('hdFind').hidden) return;
    var y = window.scrollY;
    runSafely(render, 'refresh');
    window.scrollTo(0, y);
  }

  // ============================================================
  // §WIRING
  // ============================================================
  var readScroll = null;

  function wire() {
    var app = $('larApp');

    // — navigation and generic —
    on(app, '[data-go]', 'click', function () { go(this.dataset.go); });
    on(app, '[data-back]', 'click', function () {
      go(route === 'kept' ? '#/kept' : '#/');
    });

    // — the rail —
    on(app, '[data-cat]', 'click', function () {
      ui.cat = this.dataset.cat; saveUi();
      // A category chip in the hero is a link to #/ as well, so a
      // click from a detail route lands in the library filtered.
      if (resolve().view !== 'library') { go('#/'); return; }
      refreshList();
    });
    on(app, '[data-time]', 'click', function () {
      ui.time = ui.time === this.dataset.time ? '' : this.dataset.time; saveUi(); refreshList();
    });
    on(app, '[data-tag]', 'click', function () {
      ui.tag = ui.tag === this.dataset.tag ? '' : this.dataset.tag; saveUi(); refreshList();
    });
    on(app, '[data-fav-only]', 'click', function () {
      ui.favOnly = !ui.favOnly; saveUi(); refreshList();
    });
    on(app, '[data-clearall]', 'click', function () {
      ui.cat = 'all'; ui.time = ''; ui.tag = ''; ui.favOnly = false; saveUi(); refreshList();
    });
    /* Clears the SEARCH only. Reusing "clear all" here would switch
       off the category too, which is not what a token with the
       query written on it says it does. */
    on(app, '[data-clearq]', 'click', function () { q = ''; refreshList(); });
    on(app, '[data-railtoggle]', 'click', function () {
      ui.railOpen = !ui.railOpen; refreshList();
    });
    // A <select> reports a keyboard choice as `change` and never as
    // a click, which is also why it can be a native control at all.
    on(app, '[data-sort]', 'change', function () { ui.sort = this.value; saveUi(); refreshList(); });
    on(app, '[data-strip]', 'click', function () {
      var strip = $('larStrip');
      if (strip) strip.scrollBy({ left: Number(this.dataset.strip) * 260, behavior: 'smooth' });
    });

    // — recipes —
    on(app, '[data-fav]', 'click', function () {
      var r = L().Recipes.get(this.dataset.fav);
      if (!r) return;
      L().Recipes.update(r.id, { isFavorite: !r.isFavorite });
      refreshList();
    });
    on(app, '[data-new]', 'click', function () { openRecipeEditor(null); });
    on(app, '[data-edit]', 'click', function () { openRecipeEditor(this.dataset.edit); });
    on(app, '[data-del]', 'click', function () { confirmDeleteRecipe(this.dataset.del); });
    on(app, '[data-cover]', 'click', function () {
      var id = this.dataset.cover;
      pickFile(function (f) { setCover(id, f); });
    });
    on(app, '[data-togrocery]', 'click', function () {
      var r = L().Recipes.get(this.dataset.togrocery);
      if (!r) return;
      var rows = L().RecipeIngredients.list()
        .filter(function (x) { return x.recipeId === r.id; })
        .map(function (x) {
          return { name: x.name, quantity: Number(x.amount) || 1, unit: x.unit };
        });
      var n = addNamesToGrocery(rows, { fromRecipeId: r.id });
      toast(n ? U().plural(n, 'thing') + ' added to the list'
              : 'Everything is already on the list');
    });

    // — the method —
    on(app, '[data-addstep]', 'click', function () { addStep(this.dataset.addstep); });
    on(app, '[data-delstep]', 'click', function () {
      var host = $('larMethod');
      if (host) deleteStep(host.dataset.recipe, this.dataset.delstep);
    });
    on(app, '[data-delshot]', 'click', function () {
      var host = $('larMethod');
      if (host) deletePhoto(host.dataset.recipe, this.dataset.delshot, Number(this.dataset.n));
    });
    on(app, '[data-shot]', 'change', function () {
      var host = $('larMethod');
      var f = this.files && this.files[0];
      // The input is re-used across repaints; clearing it means the
      // same file can be chosen twice in a row.
      this.value = '';
      if (host && f) addPhoto(host.dataset.recipe, this.dataset.shot, f);
    });
    on(app, '[data-steptext]', 'input', function () {
      var host = $('larMethod');
      if (!host) return;
      // Grow to fit as you type. Height must be reset before it is
      // read or the box can only ever get taller.
      this.style.height = 'auto';
      this.style.height = Math.max(28, this.scrollHeight) + 'px';
      queueStepText(host.dataset.recipe, this.dataset.steptext, this.value);
    });
    /* FOCUSOUT, NOT BLUR. `blur` does not bubble, so a delegated
       handler on the host never hears it — the debounced save would
       then be the ONLY thing that ever wrote, and leaving a step and
       immediately navigating would lose the edit. `focusout` is the
       bubbling twin and is what delegation needs. */
    on(app, '[data-steptext]', 'focusout', function () {
      var host = $('larMethod');
      if (host) flushStepText(host.dataset.recipe, this.dataset.steptext, this.value);
    });

    // — grocery —
    on(app, '[data-gotick]', 'click', function () {
      // HIDES. Never deletes. See §THE GROCERY LIST.
      L().GroceryItems.update(this.dataset.gotick, { checked: true });
      refreshCurrentView();
    });
    on(app, '[data-godel]', 'click', function () {
      var it = L().GroceryItems.get(this.dataset.godel);
      if (!it) return;
      if (!window.confirm('Delete "' + it.name + '" from the list for good?')) return;
      L().GroceryItems.remove(it.id);
      toast('Deleted');
      refreshCurrentView();
    });
    on(app, '[data-groreset]', 'click', function () {
      var n = L().resetGroceryList();
      toast(n ? U().plural(n, 'item') + ' back on the list' : 'Nothing to bring back');
      refreshCurrentView();
    });
    on(app, '[data-shelf]', 'click', function () {
      var k = 'shelf:' + this.dataset.shelf;
      ui.shut[k] = !ui.shut[k];
      saveUi();
      refreshCurrentView();
    });
    on(app, '[data-newstore]', 'click', function () { openStoreEditor(); });
    on(app, '[data-delstore]', 'click', function () {
      var s = L().Stores.get(this.dataset.delstore);
      if (!s) return;
      if (!window.confirm('Delete the shop "' + s.name + '"? Its items stay on the list.')) return;
      L().Stores.remove(s.id);
      refreshCurrentView();
    });
    $('larApp').addEventListener('submit', function (e) {
      if (!e.target || e.target.id !== 'larGroceryForm') return;
      e.preventDefault();
      var name = ($('larGroName').value || '').trim();
      if (!name) return;
      L().GroceryItems.add({
        name: name,
        quantity: Number($('larGroQty').value) || 1,
        storeId: ($('larGroStore') || {}).value || null
      });
      refreshCurrentView();
      var f = $('larGroName');
      if (f) f.focus();
    });

    // — settings —
    on(app, '[data-newgroup]', 'click', function () { openGroupEditor(null); });
    on(app, '[data-editgroup]', 'click', function () { openGroupEditor(this.dataset.editgroup); });
    on(app, '[data-delgroup]', 'click', function () { confirmDeleteGroup(this.dataset.delgroup); });
    on(app, '[data-export]', 'click', function () {
      if (window.DataExport && window.DataExport.download) { window.DataExport.download('larder'); }
      else if (window.LarSync && window.LarSync.download) { window.LarSync.download(); }
      else toast('The export module did not load');
    });
    on(app, '[data-snapshot]', 'click', function () {
      if (!B()) { toast('The backup module did not load'); return; }
      var id = B().snapshot('by hand');
      toast(id ? 'Snapshot taken' : 'Nothing to snapshot');
      refreshCurrentView();
    });
    on(app, '[data-restore]', 'click', function () { confirmRestore(this.dataset.restore); });
    on(app, '[data-grorestore]', 'click', function () { openGroceryRestore(); });
    on(app, '[data-gropurge]', 'click', function () {
      var n = L().groceryCheckedCount();
      if (!n) return;
      if (!window.confirm('Permanently delete the ' + n + ' ticked-off ' +
          (n === 1 ? 'item' : 'items') + '? Reset the list would have brought them back.')) return;
      L().deleteCheckedGrocery();
      toast('Deleted');
      refreshCurrentView();
    });

    wireChrome();
  }

  /* Re-paints the LIST without navigating. Folding the rail or
     choosing a category is not a route change and must not scroll. */
  function refreshList() {
    var y = window.scrollY;
    var v = resolve().view;
    if (v === 'kept') viewKept(); else viewLibrary();
    if (readScroll) readScroll(true);
    window.scrollTo(0, y);
  }

  function confirmRestore(snapId) {
    if (!B()) return;
    var snap = B().get(snapId);
    if (!snap) { toast('That snapshot is gone'); return; }
    var html =
      '<h2 class="hd-title" style="font-size:24px;margin:0 0 16px">Restore this snapshot?</h2>' +
      '<p class="asc-body">' + esc(snapLabel(snap)) + '</p>' +
      '<p class="asc-body">Anything written since it was taken will be replaced by what it holds.</p>' +
      '<div class="asc-sheet__acts">' +
        '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Cancel</button>' +
        '<button type="button" class="asc-btn asc-btn--primary" data-save="1">Restore it</button>' +
      '</div>';
    U().openSheet(html);
    U().sheetEl().querySelector('[data-save]').addEventListener('click', function () {
      var n = B().restore(snapId);
      U().closeSheet();
      toast('Restored ' + (n ? U().plural(n, 'record') : ''));
      refreshCurrentView();
    });
  }

  /* The grocery list's own restore, which reads BOTH lar: and the
     retired nutrition: key — a pre-migration snapshot holds the old
     one — and merges by name so running it twice is safe. */
  function openGroceryRestore() {
    var snaps = L().groceryInSnapshots ? L().groceryInSnapshots() : [];
    if (!snaps.length) {
      toast('No snapshot on this device holds a grocery list');
      return;
    }
    var html =
      '<h2 class="hd-title" style="font-size:24px;margin:0 0 16px">Restore the grocery list</h2>' +
      '<p class="asc-body">Items are merged back by name, so running this twice is safe.</p>' +
      '<div class="lar-list">' + snaps.slice(0, 10).map(function (s) {
        return '<div class="lar-list__row">' +
          '<span class="lar-list__n">' + esc(snapLabel(s)) +
            ' &mdash; ' + esc(U().plural(s.items, 'item')) +
            (s.fromOldKey ? ' <i style="color:var(--hd-fg-3)">(pre-migration)</i>' : '') + '</span>' +
          '<button type="button" class="lar-list__b" data-grofrom="' + esc(s.id) + '">Use this</button>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="asc-sheet__acts">' +
        '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Close</button>' +
      '</div>';
    U().openSheet(html);
    U().sheetEl().addEventListener('click', function (e) {
      var hit = e.target.closest('[data-grofrom]');
      if (!hit) return;
      var snap = B() ? B().get(hit.dataset.grofrom) : null;
      if (!snap) { toast('That snapshot is gone'); return; }
      // It returns {items, stores}, not a count — and it MERGES BY
      // NAME, which is what makes running this twice harmless.
      var res = L().restoreGroceryFrom(snap);
      U().closeSheet();
      toast(res.items
        ? U().plural(res.items, 'item') + ' restored'
        : 'Everything in that snapshot is already on the list');
      refreshCurrentView();
    });
  }

  // ============================================================
  // §CHROME WIRING — the pill, the search, the keys, the scroll.
  //
  // These hosts are OUTSIDE #larApp and outside every repaint, so
  // they are bound once here and never again. They are NAMED, never
  // `document`: topbar.js, trash.js, save-state.js and
  // shrink-banner.js all inject chrome of their own into this page,
  // and a document-wide handler that preventDefaults anything with
  // a data-act on it is a trap laid for whichever of them adopts
  // the attribute next.
  // ============================================================
  function wireChrome() {
    var top = $('hdTop'), find = $('hdFind'), foot = $('larFoot');

    on(top, '[data-act="find"]', 'click', function () { openFind(); });
    on(find, '[data-act="find-close"]', 'click', function () { closeFind(); });
    // A result is a real link, so it navigates on its own; this only
    // has to get the overlay out of the way first.
    on(find, '[data-act="find-go"]', 'click', function () { closeFind(); });
    on(foot, '[data-go]', 'click', function () { go(this.dataset.go); });

    /* THE PILL BECOMES A MENU below 900px: the links do not fit
       beside the wordmark and must not shrink into illegibility, so
       they drop under it and the pill grows into a card. */
    on(top, '[data-act="menu"]', 'click', function () {
      var open = document.body.classList.toggle('hd-menu-on');
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    var findTimer = 0;
    $('hdFindIn').addEventListener('input', function (e) {
      var v = e.target.value;
      clearTimeout(findTimer);
      findTimer = setTimeout(function () { paintFind(v); }, 130);
    });
    $('hdFindIn').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      /* Enter hands the query to the LIBRARY, where it becomes a
         token you can see and clear. A search that only ever lived
         in an overlay would leave you looking at a filtered page
         with no way to tell it from an empty one. */
      q = e.target.value;
      closeFind();
      var v = resolve().view;
      if (v === 'recipe' || v === 'settings' || v === 'grocery') go('#/');
      else refreshList();
    });

    $('addFab').onclick = function () { openRecipeEditor(null); };

    addEventListener('keydown', function (e) {
      // Escape first: it has to work FROM INSIDE the search field.
      if (e.key === 'Escape' && !$('hdFind').hidden) { e.preventDefault(); return closeFind(); }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if ($('ascSheetBg').classList.contains('is-on')) return;
      if (e.key === '/') { e.preventDefault(); return openFind(); }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); return openRecipeEditor(null); }
    });

    // ══ SCROLL: THE PILL, AND THE PARALLAX ═══════════════════
    // ONE handler for both, in one rAF. Two listeners reading the
    // same scroll position on the same frame is two layout reads
    // where one would do.
    //
    // NOT `animation-timeline: scroll()` — scroll-driven CSS
    // animations only reached iOS in Safari 26, and this has to
    // work on Damian's phone today.
    //
    // The hero is the first element of #larView and #larView starts
    // at y=0, so the hero's top is the document's top. A REPAINT
    // REPLACES THAT NODE, which is why readScroll(true) is called
    // from every paint path rather than the node being cached once.
    var stuck = null, ticking = false, heroEl = null, heroH = 0;

    readScroll = function (remeasure) {
      if (remeasure) {
        heroEl = $('larView').querySelector('[data-parallax]');
        heroH = heroEl ? heroEl.offsetHeight : 0;
      }
      ticking = false;
      var y = window.scrollY || document.documentElement.scrollTop || 0;

      var want = y > 24;
      if (want !== stuck) { stuck = want; $('hdTop').classList.toggle('is-stuck', want); }

      if (!heroEl || !heroH) return;
      // Past the hero there is nothing to move, so this costs one
      // comparison per frame for the rest of the page. The parked
      // case still runs ONCE, to leave the properties at their end
      // values rather than mid-travel.
      if (y > heroH + 40) {
        if (heroEl.dataset.parked !== '1') {
          heroEl.dataset.parked = '1';
          heroEl.style.setProperty('--hd-par', '0px');
          heroEl.style.setProperty('--hd-lift', '0px');
          heroEl.style.setProperty('--hd-fade', '0');
        }
        return;
      }
      heroEl.dataset.parked = '0';
      if (U().reducedMotion()) return;   // a still photograph, and nothing writes

      var pr = y / heroH;
      // The picture lags the page; the words leave before it does,
      // which is what reads as depth rather than as a stuck image.
      heroEl.style.setProperty('--hd-par', (y * 0.34).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-lift', (y * -0.06).toFixed(1) + 'px');
      heroEl.style.setProperty('--hd-fade', Math.max(0, 1 - pr / 0.62).toFixed(3));
    };

    addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { readScroll(false); });
    }, { passive: true });
    addEventListener('resize', function () { readScroll(true); }, { passive: true });
  }

  // ============================================================
  // §STORAGE HEALTH
  // ============================================================
  function checkStorageBackend() {
    var el = $('larHealth');
    if (!el || !window.LocalStoreIDB || !window.LocalStoreIDB.backend) return;
    if (window.LocalStoreIDB.backend() !== 'memory-only') return;
    el.hidden = false;
    el.innerHTML = '<b>This browser is not storing anything.</b>' +
      'Private browsing, or site data is blocked. Nothing you write here will survive ' +
      'closing the tab, and it will not reach your phone.';
  }

  // ============================================================
  // §THE UNDO NOTICE
  // ============================================================
  var undoDismissed = false;
  function renderUndo() {
    var el = $('larUndo');
    if (!el || !B() || !B().pendingUndo) return;
    var pend = undoDismissed ? null : B().pendingUndo();
    if (!pend) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<b>The old Nutrition Studio was removed.</b>' +
      'Meal logging, foods, saved meals, the plan, goals, supplements and notes are gone. ' +
      'A snapshot was taken first and can be restored for thirty days.' +
      '<div style="margin-top:9px">' +
        '<button type="button" data-restore="' + esc(pend.snapId) + '">Restore it</button>' +
        '<button type="button" id="larUndoDismiss">Dismiss</button>' +
      '</div>';
  }

  // ============================================================
  // §BOOT
  // ============================================================
  window.addEventListener('hashchange', function () {
    /* A navigation RE-ARMS the entrance; a repaint does not. That is
       the whole distinction the reveal clock exists to draw — see
       introAttrs() in asclepion-ui.js, which hands a re-created
       element a negative --t so a cloud pull resumes the animation
       instead of replaying it. */
    U().introArrive();
    // Any pending step edit belongs to the recipe being left.
    flushAllSteps();
    // The phone menu is open over the page it just navigated away from.
    document.body.classList.remove('hd-menu-on');
    var b = $('hdBurger'); if (b) b.setAttribute('aria-expanded', 'false');
    runSafely(render, 'hashchange');
    // Scroll-to-top belongs to navigation, and ONLY to navigation.
    window.scrollTo(0, 0);
    if (readScroll) readScroll(true);
  });
  window.addEventListener('online', function () { refreshCurrentView(); });
  window.addEventListener('offline', function () { refreshCurrentView(); });
  // A debounced step edit that is still pending when the page goes
  // away is an edit that was never saved.
  window.addEventListener('pagehide', flushAllSteps);
  window.addEventListener('beforeunload', flushAllSteps);

  var remoteRef = { applied: false, pulled: false };

  /* §THE WIPE — run once, and only from onPulled.
     pushNow() sends collect() as the row's ENTIRE data column, so a
     write that beats the opening select erases every key this
     device lacks and then pushes the erasure as truth. Waiting for
     the pull is not a nicety; it is the difference between removing
     the old Nutrition Studio and removing whatever else happens to
     be in the row.

     THE RECOVERY PATH IS BUILT BEFORE THE DESTRUCTIVE ONE: it
     refuses to run at all unless a snapshot was taken, and the only
     exception is a device with nothing worth snapshotting — which
     is also a device with nothing to lose. */
  var wipeRan = false;
  function runWipeOnce() {
    if (wipeRan) return;
    wipeRan = true;
    if (L().wipeDone()) return;
    var b = B();
    if (!b) {
      try { console.error('[The Larder] backup module missing; the rebuild was skipped'); } catch (e) {}
      return;
    }
    var snapId = b.snapshot('before the rebuild');
    // A null id means there was nothing worth snapshotting, which
    // also means there is nothing to lose — that, and only that, is
    // when the wipe may proceed without one.
    var res = L().wipeLegacy({ snapshotted: !!snapId, force: !snapId });
    if (!res.ran) return;
    if (snapId && b.markWipe) { b.markWipe(snapId); renderUndo(); }
    try {
      console.info('[The Larder] rebuilt: removed ' + res.removed.length + ' legacy key(s)');
    } catch (e) {}
    refreshCurrentView();
  }

  function boot() {
    if (!L()) {
      document.body.innerHTML =
        '<p style="padding:40px;font-family:sans-serif;color:#ccc">larder-data.js failed to load.</p>';
      return;
    }

    loadUi();
    wire();
    U().bindSheet();
    U().introArrive();
    /* Writes the eight categories out the first time this device
       runs the new build, so Settings and the editor's select are
       editing something real rather than a list that exists only in
       memory. AFTER LocalStoreIDB.ready() with everything else in
       boot, and BEFORE cloud sync mounts — a seed pushed on top of a
       row that already has categories would be the wrong way round,
       and seedGroupList only ever fills in what is missing. */
    L().ensureGroups();
    checkStorageBackend();

    /* The snapshot store starts BEFORE cloud sync. The opening pull
       can change or delete local keys, and the whole point of the
       boot snapshot is that it records what was here before the
       cloud got a vote. */
    if (B() && B().init) B().init();
    renderUndo();
    $('larUndo').addEventListener('click', function (e) {
      if (e.target && e.target.id === 'larUndoDismiss') { undoDismissed = true; renderUndo(); }
      var r = e.target && e.target.closest ? e.target.closest('[data-restore]') : null;
      if (r) confirmRestore(r.dataset.restore);
    });

    /* The two rows this page owns, mounted by the table that owns
       them. Never inline — larder-sync.js is the only place that
       says which prefix belongs to which row.

       THE ORDER AFTER THE PULL IS LOAD-BEARING: migrate, then wipe.
       migrateNutritionKeys() moves a device that has not opened this
       page since 2026-08-26 off its nutrition:* keys, and the wipe
       must not run before records have finished arriving where they
       belong.

       mountAndSeed's `ref` is what makes "both rows have spoken" a
       single question. Waiting on one row would be wrong twice over:
       the wipe removes keys from BOTH (lar: and larlog:), and it is
       the library row that carries the recipes it must not touch. */
    if (window.LarSync && window.LarSync.mountAndSeed) {
      var state = window.LarSync.mountAndSeed({
        onApplied: function () { remoteRef.applied = true; refreshCurrentView(); }
      });
      /* seedAfterSyncAttempt runs the migrations once both rows have
         pulled, and carries its own 8-second backstop for the case
         where a row never answers at all — an empty row and a dead
         request look identical from here. */
      L().seedAfterSyncAttempt(state.ref, function () {
        remoteRef.pulled = true;
        runWipeOnce();
        refreshCurrentView();
      });
    } else {
      // No cloud at all (offline file, blocked CDN). Local-only is a
      // legitimate way to use this page, the rebuild still needs to
      // happen once, and there is no row to race.
      try { L().runMigrations(); } catch (e) {}
      runWipeOnce();
    }

    if (L().onChange) L().onChange(function () { refreshCurrentView(); });

    runSafely(render, 'boot');
  }

  /* local-store-idb.js hydrates localStorage from IndexedDB
     ASYNCHRONOUSLY, and until it resolves every read returns
     nothing. Booting before that is not merely a flash of an empty
     page — it is three worse things here:

       1. larder-backup.js would snapshot an empty store, so the copy
          taken "before anything is deleted" would be worthless at
          exactly the moment it is needed.
       2. wipeLegacy() would see no legacy keys, call the device a
          fresh install, and stamp the schema — leaving the old data
          in place forever once hydration finished.
       3. initCloudSync would pull and apply into an empty store. */
  function whenReady() {
    if (window.LocalStoreIDB && window.LocalStoreIDB.ready) window.LocalStoreIDB.ready().then(boot, boot);
    else boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();

})();
</script>
</body>
</html>
