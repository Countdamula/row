<!-- =============================================================
     THE LARDER — the Nutrition Studio.

     REBUILT 2026-09-08 as two things and only two things: a
     RECIPE BOOK and a GROCERY LIST. It used to carry thirteen
     routes — Today, Meals, Foods, Recipes, Plan, Grocery,
     Progress, Kept, goals, supplements, notes, data. Damian asked
     for the other eleven removed and their data deleted rather
     than hidden; see §THE WIPE in larder-data.js for what goes,
     what stays, and why no PREFIX is ever removed.

     IT WEARS HOUSE DAMULA, by linking `vault-theme.css` rather
     than copying it — the same house as the Entertainment Studio
     and Prompt Studio, and the third page to join it this way.
     That file is NOT edited here; everything this studio needs
     that the house has no equivalent for is in larder-theme.css.

     THE RECIPE BOOK'S TWO SHAPES came from references:
       the library — a filter rail, a featured strip, a card grid
       a recipe   — an editorial cookbook spread: a kicker rule,
                    a display title, a "makes" chip, the intro,
                    then INGREDIENTS between hairlines
     With one deliberate departure from the second: the METHOD
     runs down the page as step blocks you edit in place and hang
     photographs on. See §THE METHOD.

     Routes:
       #/            the Recipe Book
       #/r/<id>      one recipe
       #/grocery     the shopping list
       #/kept        favourites
       #/settings    categories, your data, backup
     Aliases kept alive on purpose, because a year of notes and a
     phone shortcut point at them:
       #/recipes     -> #/
       #/recipes/<id> -> #/r/<id>

     ONE ROW KEY, AND IT IS STILL 'nutrition'. That is deliberate
     and is not a leftover — renaming a Supabase row key orphans
     the row. larder-sync.js's header explains it.
     ============================================================= -->

<!-- Loaded here, and NOT deferred. The inline script below

     larder-backup.js comes BEFORE larder-data.js so §THE WIPE's

<script>
(function () {
  'use strict';

  // ============================================================
  // §UTIL
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function L() { return window.Lar; }
  function U() { return window.AscUI; }
  function B() { return window.LarBackup || null; }
  function esc(s) { return U().esc(s); }
  function escLines(s) { return U().escLines(s); }
  function toast(m) { return U().toast(m); }
  function go(h) { location.hash = h; }

  /* Delegated binding. Every renderer below paints innerHTML and
     re-binds, so handlers must never be attached to nodes that are
     about to be replaced — they attach to the HOST.

     The host survives those repaints, so binding blindly would
     stack a fresh listener on every render and fire one click N
     times. Each (event, selector) pair is therefore registered once
     per host. The cost of that: a handler must never close over
     view data, because it outlives the view. Read from the store
     inside the handler. */
  function on(root, sel, evt, fn) {
    if (!root) return;
    root.__larOn = root.__larOn || {};
    var k = evt + '|' + sel;
    if (root.__larOn[k]) return;
    root.__larOn[k] = true;
    root.addEventListener(evt, function (e) {
      var hit = e.target.closest ? e.target.closest(sel) : null;
      if (!hit || !root.contains(hit)) return;
      if (hit.tagName !== 'SELECT' && hit.tagName !== 'INPUT') e.preventDefault();
      fn.call(hit, e);
    });
  }

  /* A view that throws must not leave a blank page behind. It
     leaves the message instead, which is the difference between a
     bug you can report and a page that "just stopped working". */
  function runSafely(fn, where) {
    try { fn(); }
    catch (err) {
      try { console.error('[The Larder] ' + where, err); } catch (e) {}
      var host = $('larView');
      if (host) {
        host.innerHTML = band('<div class="hd-empty"><strong>Something in this view broke.</strong>' +
          'The data is safe — this is a rendering fault, not a lost record. ' +
          esc(String(err && err.message || err)) + '</div>');
      }
    }
  }

  function mark(id, size) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' +
      (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') +
      '><use href="#' + id + '"></use></svg>';
  }
  /* A category's drawn mark. The eight seeded ids have one; a
     category Damian creates does not, and falls back to the ring
     rather than to a blank — the ring says "a category" and the
     colour says which. */
  var SEEDED_MARKS = {
    breakfast: 1, lunch: 1, dinner: 1, sides: 1, baking: 1, drinks: 1, sauces: 1, other: 1
  };
  function catMark(id, size) {
    return mark(SEEDED_MARKS[id] ? 'lar-' + id : 'lar-other', size);
  }
  function hueOf(id) { return L().catById(id).hue; }

  /**
   * The reveal's style attribute, with this page's extra custom
   * properties folded INTO it.
   *
   * AscUI.rvlStyle() returns a complete `style="--i:…"` attribute of
   * its own. Pasting a second `style="--lar-tint:…"` onto the same
   * tag is silently lossy — the browser keeps the FIRST and discards
   * the rest — so every card's category hue was being thrown away
   * and the coloured spine rendered at 0px. asclepion-ui.js's own
   * header warns about this ("the caller pasted both into the same
   * tag"); it is easy to hit anyway, because both calls look like
   * they are contributing rather than competing.
   *
   * One attribute, built once, is the fix.
   */
  function rvlAttrs(i, extra) {
    var t = U().introAttrs().t;
    return ' style="--i:' + Math.round(i || 0) +
      (t ? ';--t:' + t + 'ms' : '') +
      (extra ? ';' + extra : '') + '"';
  }

  function totalMin(r) { return (r.prepTimeMin || 0) + (r.cookTimeMin || 0); }
  function minsLabel(n) {
    if (!n) return '';
    if (n < 60) return n + ' min';
    var h = Math.floor(n / 60), m = n % 60;
    return h + 'h' + (m ? ' ' + m : '');
  }
  /* The card's headline number, where the reference puts a price.
     Minutes ONLY up to an hour: a stock is "4h 15", never "255 MIN",
     and a number nobody converts in their head is a number nobody
     reads. The units are marked up so they can be set small — the
     figure is the thing being compared down a grid. */
  function bigTime(t) {
    if (!t) return '&mdash;';
    if (t < 60) return t + '<i>MIN</i>';
    var h = Math.floor(t / 60), m = t % 60;
    return h + '<i>H</i>' + (m ? ' ' + m + '<i>M</i>' : '');
  }

  // ============================================================
  // §UI STATE
  //
  // What is persisted, and what is deliberately not.
  //
  // The filters ARE persisted: coming back to the book still
  // filtered to Dinner is a preference, and re-choosing it every
  // visit is a chore.
  //
  // THE SEARCH QUERY IS NOT. A search term is about this minute,
  // and restoring one on the next visit would make the page look
  // empty for no reason anybody could see.
  // ============================================================
  var ui = {
    cat: 'all', time: '', tag: '', favOnly: false, sort: 'recent',
    shut: {}, railOpen: false
  };
  var q = '';              // the live query — memory only
  var route = 'recipes';   // NOT in ui: settings is a place, not a filter

  function loadUi() {
    var raw = null;
    try { raw = localStorage.getItem(L().KEYS.uiState); } catch (e) {}
    var v = null;
    try { v = raw ? JSON.parse(raw) : null; } catch (e) {}
    if (!v || typeof v !== 'object') return;
    if (typeof v.cat === 'string') ui.cat = v.cat;
    if (typeof v.time === 'string') ui.time = v.time;
    if (typeof v.tag === 'string') ui.tag = v.tag;
    if (typeof v.sort === 'string' && SORTS[v.sort]) ui.sort = v.sort;
    ui.favOnly = v.favOnly === true;
    if (v.shut && typeof v.shut === 'object') ui.shut = v.shut;
  }
  function saveUi() {
    try {
      localStorage.setItem(L().KEYS.uiState, JSON.stringify({
        cat: ui.cat, time: ui.time, tag: ui.tag, sort: ui.sort,
        favOnly: ui.favOnly, shut: ui.shut
      }));
    } catch (e) {}
  }

  var SORTS = {
    recent: { label: 'Recently added' },
    az:     { label: 'Name' },
    quick:  { label: 'Quickest first' }
  };

  var TIMES = [
    { id: '15', label: 'Under 15', max: 15 },
    { id: '30', label: 'Under 30', max: 30 },
    { id: '60', label: 'Under 1h', max: 60 },
    { id: 'long', label: 'Over 1h', min: 61 }
  ];

  // ============================================================
  // §ROUTING
  //
  // The hash, split. The OLD hashes are aliased rather than
  // dropped: #/recipes is in topbar.js's drawer, in main-nav.js, in
  // nutrition.html's redirect stub and in a year of Damian's notes.
  // Two lines here keeps every one of them working.
  // ============================================================
  function parts() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    return h.split('/').filter(function (s) { return s !== ''; });
  }
  function resolve() {
    var p = parts();
    if (!p.length) return { view: 'library' };
    if (p[0] === 'recipes') {
      // The alias. #/recipes -> the book, #/recipes/<id> -> a recipe.
      return p[1] ? { view: 'recipe', id: p[1] } : { view: 'library' };
    }
    if (p[0] === 'r' && p[1]) return { view: 'recipe', id: p[1] };
    if (p[0] === 'grocery') return { view: 'grocery' };
    if (p[0] === 'kept') return { view: 'kept' };
    if (p[0] === 'settings') return { view: 'settings' };
    return { view: 'library' };
  }

  var NAV = [
    { href: '#/',         label: 'Recipes',  tab: 'recipes'  },
    { href: '#/grocery',  label: 'Grocery',  tab: 'grocery'  },
    { href: '#/kept',     label: 'Kept',     tab: 'kept'     },
    { href: '#/settings', label: 'Settings', tab: 'settings' }
  ];

  /* A recipe lights RECIPES — a detail route lights its parent,
     because `route` has been set from the hash by the time this
     runs. Settings gets its own tab id for the same reason: without
     one it would light Recipes. */
  function paintNav() {
    var link = function (n) {
      var isOn = route === n.tab;
      return '<a href="' + n.href + '"' + (isOn ? ' class="is-on" aria-current="page"' : '') + '>' +
        esc(n.label) + '</a>';
    };
    var half = Math.ceil(NAV.length / 2);
    var l = $('hdNavL'), r = $('hdNavR');
    if (l) l.innerHTML = NAV.slice(0, half).map(link).join('');
    if (r) r.innerHTML = NAV.slice(half).map(link).join('');
  }

  // ============================================================
  // §THE HERO
  //
  // The house component, on every view. Its anatomy is the vault's:
  //
  //     ┌───────────────────────────────────────────────┐
  //     │              ( floating pill nav )            │
  //     │  HEADLINE                        ┌──────────┐ │
  //     │                                  │ the card │ │
  //     │  the copy                        ( chips )    │
  //     └───────────────────────────────────────────────┘
  //
  // FULL-BLEED, AND NO BOUNDARIES: the plate runs to all four edges
  // of the display, so there is no edge to see; only the bottom
  // fades, into the band beneath.
  //
  // `short` is for a recipe. A recipe you are about to cook from
  // should not sit under 82vh of atmosphere — same picture, same
  // parallax, a quarter of the height.
  // ============================================================
  var HERO_IMG = 'images_by_admin/larder/hero-lantern.webp';

  function pageHero(o) {
    var feat = o.short ? null : (o.card === undefined ? featuredCard() : o.card);
    return '<header class="hd-phero' + (o.short ? ' hd-phero--short' : '') + '" data-parallax>' +
      '<div class="hd-phero__art" aria-hidden="true">' +
        '<img class="hd-phero__img" src="' + HERO_IMG + '" alt="" ' +
          'width="1170" height="1516" fetchpriority="high" decoding="async">' +
        '<span class="hd-phero__glow"></span>' +
        '<span class="hd-phero__veil"></span>' +
      '</div>' +
      '<div class="hd-phero__in">' +
        '<div class="hd-phero__say">' +
          (o.back ? '<button type="button" class="hd-phero__back" data-back="1">' +
            esc(o.back) + '</button>' : '') +
          (o.eyebrow ? '<p class="hd-phero__e">' + esc(o.eyebrow) + '</p>' : '') +
          '<h1 class="hd-phero__t">' + esc(o.title) + '</h1>' +
        '</div>' +
        (feat ? heroCard(feat) : '') +
        (o.caption ? '<p class="hd-phero__c">' + esc(o.caption) + '</p>' : '') +
        (o.short ? '' :
          '<span class="hd-phero__scroll" aria-hidden="true"><i></i>Scroll</span>' + heroChips()) +
      '</div>' +
      '<span class="hd-phero__rule" aria-hidden="true"></span>' +
    '</header>';
  }

  /* THE FLOATING CARD is the thing you reach for most. The vault
     fills it with cover art so every page opens on something real
     out of the collection rather than on decoration; a recipe often
     HAS a photograph, so it gets one — and falls back to its
     category's mark on the tint when it does not, which keeps the
     card's geometry identical.

     Deterministic: ties break on the name, so the hero does not
     reshuffle itself between two repaints. */
  function featuredCard() {
    var all = L().Recipes.list();
    if (!all.length) return null;
    var r = all.slice().sort(function (a, b) {
      if (a.isFavorite !== b.isFavorite) return a.isFavorite ? -1 : 1;
      return (b.order || 0) - (a.order || 0) || a.title.localeCompare(b.title);
    })[0];
    return r ? {
      id: r.id, name: r.title, cat: r.groupId, img: r.imageUrl,
      eyebrow: r.isFavorite ? 'Kept' : 'Latest'
    } : null;
  }
  function heroCard(d) {
    return '<a class="hd-hcard" style="--lar-tint:' + esc(hueOf(d.cat)) + '" href="#/r/' + esc(d.id) + '">' +
      '<span class="hd-hcard__art">' +
        (d.img
          ? '<img src="' + esc(d.img) + '" alt="" loading="lazy" decoding="async">'
          : '<span class="hd-hcard__none">' + catMark(d.cat) + '</span>') +
      '</span>' +
      '<span class="hd-hcard__in">' +
        '<span class="hd-hcard__e">' + esc(d.eyebrow) + '</span>' +
        '<span class="hd-hcard__t">' + esc(d.name) + '</span>' +
        '<span class="hd-hcard__go">Open it &#8594;</span>' +
      '</span>' +
    '</a>';
  }
  /* The chips are the categories that actually hold something. A
     chip for an empty category is a control that leads to an empty
     screen. */
  function heroChips() {
    var counts = L().groupCounts();
    var list = L().catList().filter(function (c) { return counts[c.id]; }).slice(0, 6);
    if (!list.length) return '';
    return '<div class="hd-chips">' + list.map(function (c) {
      return '<a class="hd-chip2" style="--lar-tint:' + esc(c.hue) + '" href="#/" data-cat="' + esc(c.id) + '">' +
        '<span class="lar-chip__mark">' + catMark(c.id, 14) + '</span>' +
        esc(c.label) + '<i>' + counts[c.id] + '</i></a>';
    }).join('') + '</div>';
  }

  /* One band, so no view can accidentally grow a second ground. */
  function band(inner, extra) {
    return '<section class="hd-band hd-night' + (extra ? ' ' + extra : '') + '">' + inner + '</section>';
  }
  function detailHero(eyebrow, title, caption) {
    return pageHero({
      short: true, eyebrow: eyebrow, title: title, caption: caption,
      back: route === 'kept' ? 'Kept' : 'Recipes'
    });
  }
  function emptyState(head, body, action) {
    return '<div class="hd-empty"><strong>' + esc(head) + '</strong>' + esc(body) +
      (action ? '<div style="margin-top:20px">' + action + '</div>' : '') + '</div>';
  }

  // ============================================================
  // §SELECTING — one funnel, so a count can never disagree with a
  // list. Everything that asks "which recipes" asks this.
  // ============================================================
  function matchesQuery(r, needle) {
    if (!needle) return true;
    var hay = (r.title + ' ' + r.description + ' ' + (r.tags || []).join(' ')).toLowerCase();
    if (hay.indexOf(needle) !== -1) return true;
    // Ingredients too: "what can I make with fennel" is the question
    // a recipe book is actually asked.
    var ings = L().RecipeIngredients.list();
    for (var i = 0; i < ings.length; i++) {
      if (ings[i].recipeId === r.id && ings[i].name.toLowerCase().indexOf(needle) !== -1) return true;
    }
    return false;
  }
  function selected(opts) {
    opts = opts || {};
    var needle = q.trim().toLowerCase();
    var rows = L().Recipes.list().filter(function (r) {
      if (opts.favOnly || ui.favOnly) { if (!r.isFavorite) return false; }
      if (!opts.ignoreCat && ui.cat !== 'all' && r.groupId !== ui.cat) return false;
      if (!opts.ignoreTag && ui.tag && (r.tags || []).indexOf(ui.tag) === -1) return false;
      if (!opts.ignoreTime && ui.time) {
        var t = totalMin(r), band2 = null, i;
        for (i = 0; i < TIMES.length; i++) if (TIMES[i].id === ui.time) band2 = TIMES[i];
        if (band2) {
          if (band2.max && (!t || t > band2.max)) return false;
          if (band2.min && t < band2.min) return false;
        }
      }
      return matchesQuery(r, needle);
    });
    return sortRows(rows);
  }
  function sortRows(rows) {
    return rows.slice().sort(function (a, b) {
      if (ui.sort === 'az') return a.title.localeCompare(b.title);
      if (ui.sort === 'quick') {
        // A recipe with no timings is not "instant" — it is unknown,
        // and unknown sorts last rather than winning the list.
        var ta = totalMin(a) || 1e9, tb = totalMin(b) || 1e9;
        return ta - tb || a.title.localeCompare(b.title);
      }
      return (b.order || 0) - (a.order || 0) || a.title.localeCompare(b.title);
    });
  }
  function isFiltering() {
    return !!(q.trim() || ui.cat !== 'all' || ui.time || ui.tag || ui.favOnly);
  }
  function activeFilterCount() {
    var n = 0;
    if (ui.cat !== 'all') n++;
    if (ui.time) n++;
    if (ui.tag) n++;
    if (ui.favOnly) n++;
    return n;
  }
  /* Every tag actually in use, most-used first. A closed vocabulary
     would be wrong here: Damian's tags are his own. */
  function allTags() {
    var counts = {};
    L().Recipes.list().forEach(function (r) {
      (r.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    return Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });
  }

  // ============================================================
  // §THE LIBRARY
  // ============================================================
  function viewLibrary() {
    var host = $('larView');
    var all = L().Recipes.list();
    var hero = pageHero({
      eyebrow: 'The Larder',
      title: 'Things you know how to make',
      caption: 'Everything you have written down, with the method and the ' +
        'photographs you took while you were working it out.'
    });

    if (!all.length) {
      host.innerHTML = hero + band(emptyState(
        'No recipes yet.',
        'Anything you cook more than once is worth writing down. A recipe needs a name, ' +
        'what goes in it, and the steps — the photographs can come later, while you cook it.',
        '<button type="button" class="asc-btn asc-btn--primary" data-new="1">Write the first one</button>'));
      return;
    }

    var rows = selected();
    host.innerHTML = hero + band(
      '<div class="lar-shell">' +
        railHTML() +
        '<div class="lar-results">' +
          (isFiltering() ? '' : featuredHTML()) +
          utilLine(rows.length) +
          (rows.length
            ? '<div class="hd-grid">' + rows.map(cardHTML).join('') + '</div>'
            : emptyState('Nothing matches that.',
                'Try a wider filter, or clear them and start again.',
                '<button type="button" class="asc-btn" data-clearall="1">Clear the filters</button>')) +
        '</div>' +
      '</div>');
    mountStrip();
  }

  /* The strip's arrows mean something only when it actually
     overflows. Drawn unconditionally they are two controls that do
     nothing, which teaches you to stop trusting the row they sit in.
     Measured after the paint, because scrollWidth is a layout read. */
  function mountStrip() {
    var strip = $('larStrip');
    var nav = document.querySelector('.lar-feat__nav');
    if (!strip || !nav) return;
    nav.hidden = strip.scrollWidth <= strip.clientWidth + 4;
  }

  /* THE RAIL. Four questions, in the order they get asked: what
     kind of thing, how long have I got, what sort of thing is it,
     and do I already love it. */
  function railHTML() {
    var counts = L().groupCounts();
    var cats = L().catList().filter(function (c) { return counts[c.id] || ui.cat === c.id; });
    var tags = allTags();
    var nOn = activeFilterCount();

    var out = '<aside class="lar-rail' + (ui.railOpen ? ' is-open' : '') + '" aria-label="Filters">';
    // The phone disclosure. It carries the active count so a
    // collapsed rail can never hide the fact that it IS filtering.
    out += '<button type="button" class="lar-rail__toggle" data-railtoggle="1" aria-expanded="' +
      (ui.railOpen ? 'true' : 'false') + '">Filters' +
      (nOn ? '<span class="lar-rail__on">' + nOn + '</span>' : '') +
      mark('lar-chev') + '</button>';

    out += '<div class="lar-rail__in">';
    out += '<div class="lar-rail__head"><h2>Filters</h2>' +
      (nOn ? '<button type="button" class="lar-rail__clear" data-clearall="1">Clear all &times;</button>' : '') +
      '</div>';

    out += '<div class="lar-fset"><p class="lar-fset__t">Category</p><div class="lar-cats">';
    out += '<button type="button" class="lar-cat' + (ui.cat === 'all' ? ' is-on' : '') +
      '" data-cat="all" style="--lar-tint:var(--hd-fg-3)">' +
      '<span class="lar-cat__dot"></span><span class="lar-cat__n">Everything</span>' +
      '<span class="lar-cat__c">' + L().Recipes.list().length + '</span></button>';
    cats.forEach(function (c) {
      out += '<button type="button" class="lar-cat' + (ui.cat === c.id ? ' is-on' : '') +
        '" data-cat="' + esc(c.id) + '" style="--lar-tint:' + esc(c.hue) + '">' +
        '<span class="lar-cat__dot"></span>' +
        '<span class="lar-cat__n">' + esc(c.label) + '</span>' +
        '<span class="lar-cat__c">' + (counts[c.id] || 0) + '</span></button>';
    });
    out += '</div></div>';

    out += '<div class="lar-fset"><p class="lar-fset__t">Total time</p><div class="lar-fchips">';
    TIMES.forEach(function (t) {
      out += '<button type="button" class="lar-fchip' + (ui.time === t.id ? ' is-on' : '') +
        '" data-time="' + esc(t.id) + '">' + esc(t.label) + '</button>';
    });
    out += '</div></div>';

    if (tags.length) {
      out += '<div class="lar-fset"><p class="lar-fset__t">Tagged</p><div class="lar-fchips">';
      tags.slice(0, 14).forEach(function (t) {
        out += '<button type="button" class="lar-fchip' + (ui.tag === t ? ' is-on' : '') +
          '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
      });
      out += '</div></div>';
    }

    out += '<div class="lar-fset">' +
      '<button type="button" class="lar-fsw' + (ui.favOnly ? ' is-on' : '') +
      '" data-fav-only="1" aria-pressed="' + (ui.favOnly ? 'true' : 'false') + '">' +
      mark('lar-heart') + 'Kept only</button></div>';

    out += '</div></aside>';
    return out;
  }

  /* THE FEATURED STRIP. Drawn only on an unfiltered library: the
     moment you are looking for something specific, a band of
     things you were not looking for is in the way. */
  function featuredHTML() {
    var rows = sortRows(L().Recipes.list().filter(function (r) { return r.isFavorite; }));
    if (rows.length < 3) {
      rows = L().Recipes.list().slice().sort(function (a, b) {
        return (b.order || 0) - (a.order || 0);
      });
    }
    rows = rows.slice(0, 8);
    /* THREE, not two. The strip is a tinted panel the width of the
       results column; two cards in it leave two-thirds of that panel
       empty, and a band of air is a worse answer than no band. Below
       three, the grid says everything the strip would have. */
    if (rows.length < 3) return '';
    var kept = rows.every(function (r) { return r.isFavorite; });
    return '<div class="lar-feat">' +
      '<div class="lar-feat__top">' +
        '<h2 class="lar-feat__t">' + mark('lar-flame') +
          (kept ? 'The ones you keep' : 'Recently written') + '</h2>' +
        '<div class="lar-feat__nav">' +
          '<button type="button" class="hd-chip" data-strip="-1" aria-label="Scroll back">&#8249;</button>' +
          '<button type="button" class="hd-chip" data-strip="1" aria-label="Scroll on">&#8250;</button>' +
        '</div>' +
      '</div>' +
      '<div class="lar-feat__strip" id="larStrip">' + rows.map(cardHTML).join('') + '</div>' +
    '</div>';
  }

  /* THE UTILITY LINE. The count, the query as a clearable token,
     and the sort. Category and the rest live in the rail — two
     controls saying the same thing is one too many. */
  function utilLine(n) {
    var out = '<div class="hd-util">';
    out += '<span class="hd-util__n">' + U().plural(n, 'recipe') + '</span>';
    if (q.trim()) {
      out += '<button type="button" class="hd-token" data-clearq="1">&ldquo;' +
        esc(q.trim()) + '&rdquo; <i aria-hidden="true">&times;</i></button>';
    }
    out += '<span class="hd-util__sp"></span>';
    out += '<label class="hd-util__sel"><span class="hd-sr">Sort</span><select data-sort="1">';
    Object.keys(SORTS).forEach(function (k) {
      out += '<option value="' + k + '"' + (ui.sort === k ? ' selected' : '') + '>' +
        esc(SORTS[k].label) + '</option>';
    });
    out += '</select></label>';
    out += '</div>';
    return out;
  }

  /* THE CARD. .hd-card--grid gives the shape, the art, the hover
     and the kept control; the badge, the facts grid and the footer
     are this studio's, from the reference. */
  function cardHTML(r, i) {
    var cat = L().catById(r.groupId);
    var t = totalMin(r);
    /* A card with no photograph gets a SHORTER plate. 16:10 is right
       for a picture and wrong for a 30px glyph floating in 230px of
       empty ground — and until Damian has photographed a recipe,
       every card is that. Set as a class rather than with :has(),
       which is newer than some of the phones this has to work on. */
    return '<article class="hd-card hd-card--grid lar-card' +
      (r.imageUrl ? '' : ' lar-card--noart') + ' ' + U().rvlClass() + '"' +
      rvlAttrs(i || 0, '--lar-tint:' + esc(cat.hue)) + '>' +
      '<a class="hd-card__hit" href="#/r/' + esc(r.id) + '">' +
        '<span class="hd-card__art">' +
          (r.imageUrl
            ? '<img class="hd-card__img" src="' + esc(r.imageUrl) + '" alt="" loading="lazy" decoding="async">'
            : '<span class="hd-card__none">' + catMark(r.groupId, 30) + '</span>') +
          '<span class="lar-card__badge">' + esc(cat.label) + '</span>' +
        '</span>' +
        '<span class="hd-card__body">' +
          '<span class="hd-card__title">' + esc(r.title) + '</span>' +
          /* NO CLOCK HERE. The total time is the big number in the
             footer, and a card that says "45 min" twice is a card
             using half its facts row to repeat itself. */
          '<span class="lar-card__facts">' +
            fact('lar-serves', U().plural(r.servings, 'serving')) +
            fact('lar-book', (r.steps || []).length
              ? U().plural(r.steps.length, 'step') : 'No method') +
          '</span>' +
          '<span class="lar-card__foot">' +
            '<span class="lar-card__time">' + bigTime(t) + '</span>' +
            '<span class="lar-card__go">Open ' + mark('lar-arrow') + '</span>' +
          '</span>' +
        '</span>' +
      '</a>' +
      '<span class="hd-card__acts">' +
        '<button type="button" class="hd-chip' + (r.isFavorite ? ' is-on' : '') +
          '" data-fav="' + esc(r.id) + '" aria-pressed="' + (r.isFavorite ? 'true' : 'false') +
          '" aria-label="' + (r.isFavorite ? 'Stop keeping ' : 'Keep ') + esc(r.title) + '">' +
          mark('lar-heart') + '</button>' +
      '</span>' +
    '</article>';
  }
  function fact(icon, text) {
    return '<span class="lar-card__fact">' + mark(icon) + '<span>' + esc(text) + '</span></span>';
  }

  // ============================================================
  // §KEPT
  // ============================================================
  function viewKept() {
    var host = $('larView');
    var rows = sortRows(L().Recipes.list().filter(function (r) { return r.isFavorite; }))
      .filter(function (r) { return matchesQuery(r, q.trim().toLowerCase()); });
    var hero = pageHero({
      eyebrow: 'Kept', title: 'The ones you come back to',
      caption: 'A recipe earns its place here by being cooked twice.',
      card: null
    });
    host.innerHTML = hero + band(
      (rows.length
        ? utilLine(rows.length) + '<div class="hd-grid">' + rows.map(cardHTML).join('') + '</div>'
        : emptyState('Nothing kept yet.',
            'The heart on a recipe card puts it here. It is for the ones you actually make, ' +
            'not the ones you mean to.',
            '<button type="button" class="asc-btn" data-go="#/">Back to the book</button>')));
  }

  // ============================================================
  // §A RECIPE — the editorial spread
  // ============================================================
  function viewRecipe(id) {
    var host = $('larView');
    var r = L().Recipes.get(id);
    if (!r) {
      host.innerHTML = detailHero('Not found', 'That recipe is gone') +
        band(emptyState('That recipe is gone',
          'It was deleted, here or on another device.',
          '<button type="button" class="asc-btn" data-go="#/">Back to the book</button>'));
      return;
    }
    var cat = L().catById(r.groupId);
    var ings = L().RecipeIngredients.list()
      .filter(function (x) { return x.recipeId === r.id; })
      .sort(function (a, b) { return a.order - b.order; });
    var t = totalMin(r);
    // The recipe's number in the book, oldest first — so it is
    // stable, the way a printed page number is. The reference puts
    // one in the running head and it is the detail that makes the
    // page feel like a book rather than a record.
    var order = L().Recipes.list().slice()
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
      .map(function (x) { return x.id; }).indexOf(r.id) + 1;

    var out = '<div style="--lar-tint:' + esc(cat.hue) + '">';

    // ── the kicker: the reference's running head ──
    out += '<div class="lar-kicker">' +
      '<span>' + esc(cat.label) + '</span>' +
      '<span>Recipe ' + (order < 10 ? '0' + order : order) + '</span>' +
    '</div>';

    out += '<div class="lar-spread">';

    // ── the text page ──
    out += '<div class="lar-spread__text">';
    out += '<div class="lar-makes">' +
      '<b>' + esc(U().plural(r.servings, 'serving')) + '</b>' +
      (t ? '<i>&middot;</i><span>' + esc(minsLabel(t)) + '</span>' : '') +
      (r.kcal ? '<i>&middot;</i><span>' + Math.round(r.kcal) + ' cal each</span>' : '') +
    '</div>';

    if (r.description) out += '<p class="lar-intro">' + escLines(r.description) + '</p>';

    out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>Ingredients</span>' +
      (ings.length
        ? '<button type="button" class="lar-sect__do" data-togrocery="' + esc(r.id) + '">Add to the list</button>'
        : '') +
      '</h2></div>';
    if (!ings.length) {
      out += '<p class="hd-note" style="color:var(--hd-fg-3)">None written down yet. ' +
        '<button type="button" class="lar-sect__do" data-edit="' + esc(r.id) + '">Add them</button></p>';
    } else {
      out += '<ul class="lar-ings">';
      ings.forEach(function (x) {
        var amt = (String(x.amount || '') + ' ' + (x.unit || '')).trim();
        out += '<li><span class="lar-ings__amt">' + esc(amt || '&mdash;') + '</span>' +
          '<span class="lar-ings__n">' + esc(x.name) + '</span></li>';
      });
      out += '</ul>';
    }

    if (r.tags && r.tags.length) {
      out += '<div class="lar-fchips" style="margin-top:22px">' +
        r.tags.map(function (tg) {
          return '<span class="lar-fchip">' + esc(tg) + '</span>';
        }).join('') + '</div>';
    }
    out += '</div>';

    // ── the facing page: the photograph ──
    out += '<figure class="lar-spread__fig">' +
      (r.imageUrl
        ? '<img src="' + esc(r.imageUrl) + '" alt="' + esc(r.title) + '" decoding="async">'
        : '<button type="button" class="lar-spread__none" data-cover="' + esc(r.id) + '">' +
            mark('lar-cam') + 'Add a photograph</button>') +
    '</figure>';

    out += '</div>'; // /lar-spread

    // ── the method ──
    out += methodHTML(r);

    if (r.notes) {
      out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>Notes</span></h2></div>' +
        '<p class="lar-intro">' + escLines(r.notes) + '</p>';
    }

    out += '<div class="hd-util" style="margin-top:44px">' +
      '<span class="hd-util__sp"></span>' +
      '<button type="button" class="hd-util__b" data-edit="' + esc(r.id) + '">Edit the details</button>' +
      '<button type="button" class="hd-util__b" data-del="' + esc(r.id) + '">Delete</button>' +
    '</div>';

    out += '</div>';

    host.innerHTML = detailHero(cat.label, r.title) + band(out);
    mountMethod();
  }

  // ============================================================
  // §THE METHOD — step blocks on a thread
  //
  // Damian asked for the instructions to run down the page the way
  // a Notion document does: a step at a time, with a photograph at
  // any of them. Three consequences, and each shaped the code:
  //
  //   1. IT IS EDITED IN PLACE. There is no steps field in the
  //      recipe sheet any more, and that is not only a nicety — the
  //      old sheet round-tripped steps through a textarea as PLAIN
  //      STRINGS, so recipeStepModel reset every step's image to
  //      null and one Edit-and-Save silently wiped every photograph
  //      on the recipe. Removing the field fixes that by
  //      construction: the sheet cannot destroy what it never
  //      touches.
  //
  //   2. IT SAVES ON A DEBOUNCE, 1200ms. Every storeSet trips
  //      sync.js's schedulePush(), which re-uploads the whole row.
  //      Typing a method with a per-keystroke save would push a few
  //      hundred times.
  //
  //   3. IT NEVER REPAINTS ITSELF WHILE YOU TYPE. Re-rendering the
  //      method would destroy the textarea holding the caret. Text
  //      edits write to the store and stop; only structural changes
  //      (add, delete, reorder, photo) re-render.
  // ============================================================
  function methodHTML(r) {
    var steps = r.steps || [];
    var out = '<div class="lar-sect"><h2 class="lar-sect__t"><span>Method</span>' +
      '<span class="lar-sect__do" style="color:var(--hd-fg-3)">' +
        (steps.length ? U().plural(steps.length, 'step') : '') + '</span>' +
      '</h2></div>';
    out += '<div class="lar-method" id="larMethod" data-recipe="' + esc(r.id) +
      '" data-steps="' + steps.length + '">';
    steps.forEach(function (s, i) { out += stepHTML(r.id, s, i); });
    out += '</div>';
    out += '<button type="button" class="lar-addstep" data-addstep="' + esc(r.id) + '">' +
      '<span class="lar-addstep__m">' + mark('lar-plus') + '</span>' +
      '<span>' + (steps.length ? 'Add another step' : 'Write the first step') + '</span>' +
    '</button>';
    return out;
  }

  function stepHTML(recipeId, s, i) {
    var sid = s.id;
    return '<div class="lar-step" data-step="' + esc(sid) + '">' +
      '<div class="lar-step__n">' + (i + 1) + '</div>' +
      '<div class="lar-step__body">' +
        '<textarea class="lar-step__t" rows="1" data-steptext="' + esc(sid) + '" ' +
          'aria-label="Step ' + (i + 1) + '" ' +
          'placeholder="What happens at this step?">' + esc(s.text) + '</textarea>' +
      '</div>' +
      '<button type="button" class="lar-step__grip" data-grip="1" aria-label="Drag to reorder step ' +
        (i + 1) + '">' + mark('lar-grip') + '</button>' +
      '<div class="lar-step__do">' +
        '<label class="lar-step__b" for="larShot_' + esc(sid) + '">' +
          mark('lar-cam') + 'Photo' +
          '<input class="lar-step__file" type="file" accept="image/*" ' +
            'id="larShot_' + esc(sid) + '" data-shot="' + esc(sid) + '">' +
        '</label>' +
        '<button type="button" class="lar-step__b lar-step__b--del" data-delstep="' + esc(sid) + '">' +
          mark('lar-trash') + 'Delete' +
        '</button>' +
      '</div>' +
      '<div class="lar-step__media">' +
        (s.images || []).map(function (url, n) {
          var local = url.indexOf('data:') === 0;
          return '<div class="lar-shot' + (local ? ' is-local' : '') + '">' +
            '<img src="' + esc(url) + '" alt="Step ' + (i + 1) + ', photo ' + (n + 1) + '" ' +
              'loading="lazy" decoding="async">' +
            '<button type="button" class="lar-shot__x" data-delshot="' + esc(sid) +
              '" data-n="' + n + '" aria-label="Remove this photo">&times;</button>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  /* Textareas grow to their content, and Sortable is attached to
     the method. Both have to happen after every structural paint,
     never inside the string builders. */
  function mountMethod() {
    var host = $('larMethod');
    if (!host) return;
    // READ EVERY HEIGHT, THEN WRITE EVERY HEIGHT. Interleaving them
    // forces one layout per textarea; batched it is one.
    var boxes = host.querySelectorAll('.lar-step__t');
    var want = [];
    Array.prototype.forEach.call(boxes, function (b) { want.push([b, b.scrollHeight]); });
    want.forEach(function (p) { p[0].style.height = Math.max(28, p[1]) + 'px'; });

    if (typeof window.Sortable === 'undefined') return;
    if (host.__sortable) return;
    host.__sortable = window.Sortable.create(host, {
      animation: 150,
      // THE GRIP, NEVER THE ROW. A row-wide handle means the text
      // cannot be selected and Delete cannot be pressed.
      handle: '.lar-step__grip',
      draggable: '.lar-step',
      ghostClass: 'is-dragging',
      onEnd: function () {
        var ids = Array.prototype.map.call(
          host.querySelectorAll('.lar-step'), function (n) { return n.dataset.step; });
        reorderSteps(host.dataset.recipe, ids);
      }
    });
  }

  function stepsOf(rid) {
    var r = L().Recipes.get(rid);
    return r ? (r.steps || []).slice() : [];
  }
  function writeSteps(rid, steps) { L().Recipes.update(rid, { steps: steps }); }

  function reorderSteps(rid, ids) {
    var steps = stepsOf(rid), by = {}, out = [];
    steps.forEach(function (s) { by[s.id] = s; });
    ids.forEach(function (id) { if (by[id]) { out.push(by[id]); delete by[id]; } });
    // A drag that misses a step must not be able to delete it.
    Object.keys(by).forEach(function (id) { out.push(by[id]); });
    writeSteps(rid, out);
    repaintRecipe(rid);
  }
  function addStep(rid) {
    var steps = stepsOf(rid);
    if (steps.length >= 60) { toast('Sixty steps is the limit'); return; }
    steps.push({ text: '', images: [] });
    writeSteps(rid, steps);
    repaintRecipe(rid);
    // Put the caret in the step that was just made. Adding a step
    // and then having to click it is two actions for one intent.
    setTimeout(function () {
      var all = document.querySelectorAll('.lar-step__t');
      var last = all[all.length - 1];
      if (last) { try { last.focus({ preventScroll: false }); } catch (e) { last.focus(); } }
    }, 0);
  }
  function deleteStep(rid, sid) {
    var steps = stepsOf(rid).filter(function (s) { return s.id !== sid; });
    writeSteps(rid, steps);
    repaintRecipe(rid);
  }

  /* Repaints ONE recipe view without navigating, and restores the
     scroll. Adding a step near the bottom of a long method must not
     throw you back to the title. */
  function repaintRecipe(rid) {
    var y = window.scrollY;
    viewRecipe(rid);
    if (readScroll) readScroll(true);
    window.scrollTo(0, y);
  }

  // ── the per-step text autosave ────────────────────────────
  // ONE TIMER PER STEP, never a shared one: typing in step 2 and
  // then step 3 inside the debounce window would clear step 2's
  // timer and lose the edit. That was a real bug on The Chrysalis.
  var stepTimers = {};
  function queueStepText(rid, sid, text) {
    clearTimeout(stepTimers[sid]);
    stepTimers[sid] = setTimeout(function () {
      var steps = stepsOf(rid), hit = false;
      steps.forEach(function (s) { if (s.id === sid) { s.text = text; hit = true; } });
      if (hit) writeSteps(rid, steps);
    }, 1200);
  }
  /* Blur and unload flush immediately: a debounce that is still
     pending when the page goes away is an edit that was never
     saved. */
  function flushStepText(rid, sid, text) {
    clearTimeout(stepTimers[sid]);
    var steps = stepsOf(rid), hit = false;
    steps.forEach(function (s) { if (s.id === sid && s.text !== text) { s.text = text; hit = true; } });
    if (hit) writeSteps(rid, steps);
  }
  function flushAllSteps() {
    var host = $('larMethod');
    if (!host) return;
    var rid = host.dataset.recipe;
    Array.prototype.forEach.call(host.querySelectorAll('.lar-step__t'), function (b) {
      flushStepText(rid, b.dataset.steptext, b.value);
    });
  }

  // ============================================================
  // §PHOTOS
  //
  // The house pipeline, and the ORDER IS THE POINT:
  //
  //   read -> compress -> SAVE LOCALLY -> upload -> swap in the URL
  //
  // Saving before uploading is what makes this work on a train. The
  // compressed image goes into the record immediately as a data URL
  // and the photograph is on the page; PhotoStore.upload() then
  // replaces it with a ~100-byte link when it lands. If it never
  // lands — offline, or the dashboard-photos bucket missing —
  // upload() resolves null and the local copy simply stays.
  //
  // THE RISK THAT MAKES THIS WORTH READING TWICE: lar:recipes is a
  // SYNCED key, and pushNow() re-uploads the row's entire data
  // column on every save. A data URL left sitting in a step would
  // therefore be re-uploaded in full on every subsequent edit of
  // any recipe. So:
  //   · four images per step, capped in the model
  //   · a local image is drawn with a warm border, so "not shared
  //     yet" is visible rather than silent
  //   · retryLocalUploads() sweeps them on every recipe view, so a
  //     photo taken offline is promoted the next time the page
  //     loads with a connection
  // ============================================================
  function addPhoto(rid, sid, file) {
    if (!file) return;
    var steps = stepsOf(rid), target = null;
    steps.forEach(function (s) { if (s.id === sid) target = s; });
    if (!target) return;
    if ((target.images || []).length >= 4) { toast('Four photographs is the limit for one step'); return; }

    L().readFileAsDataUrl(file).then(function (dataUrl) {
      if (!dataUrl) { toast('That file could not be read'); return; }
      return L().compressImageDataUrl(dataUrl, 1400, 0.82).then(function (small) {
        var cur = stepsOf(rid), hit = null;
        cur.forEach(function (s) { if (s.id === sid) hit = s; });
        if (!hit) return;
        hit.images = (hit.images || []).concat([small]).slice(0, 4);
        writeSteps(rid, cur);
        repaintRecipe(rid);
        uploadAndSwap(rid, sid, small);
      });
    });
  }
  /* Replaces a local data URL with the hosted one, IN PLACE and by
     value — the step may have been reordered, and another photo may
     have been added, between the upload starting and finishing. */
  function uploadAndSwap(rid, sid, localUrl) {
    if (!window.PhotoStore || !window.PhotoStore.upload) return;
    window.PhotoStore.upload(localUrl, function (hosted) {
      if (!hosted) return;
      var cur = stepsOf(rid), changed = false;
      cur.forEach(function (s) {
        if (s.id !== sid) return;
        s.images = (s.images || []).map(function (u) {
          if (u !== localUrl) return u;
          changed = true;
          return hosted;
        });
      });
      if (!changed) return;
      writeSteps(rid, cur);
      if (currentRecipeId() === rid) repaintRecipe(rid);
    });
  }
  /* Every data: URL still sitting in this recipe gets one more go at
     the store. Runs once per recipe view, and only when there is
     something to do. */
  function retryLocalUploads(rid) {
    if (!window.PhotoStore || !window.PhotoStore.upload) return;
    stepsOf(rid).forEach(function (s) {
      (s.images || []).forEach(function (u) {
        if (u.indexOf('data:') === 0) uploadAndSwap(rid, s.id, u);
      });
    });
  }
  function deletePhoto(rid, sid, n) {
    var cur = stepsOf(rid);
    cur.forEach(function (s) {
      if (s.id === sid) s.images = (s.images || []).filter(function (_, i) { return i !== n; });
    });
    writeSteps(rid, cur);
    repaintRecipe(rid);
  }
  /* The cover. Same pipeline, one image, on the record rather than
     on a step. */
  function setCover(rid, file) {
    if (!file) return;
    L().readFileAsDataUrl(file).then(function (dataUrl) {
      if (!dataUrl) { toast('That file could not be read'); return; }
      return L().compressImageDataUrl(dataUrl, 1600, 0.82).then(function (small) {
        L().Recipes.update(rid, { imageUrl: small });
        repaintRecipe(rid);
        if (window.PhotoStore && window.PhotoStore.upload) {
          window.PhotoStore.upload(small, function (hosted) {
            if (!hosted) return;
            var r = L().Recipes.get(rid);
            if (!r || r.imageUrl !== small) return;
            L().Recipes.update(rid, { imageUrl: hosted });
            if (currentRecipeId() === rid) repaintRecipe(rid);
          });
        }
      });
    });
  }
  function currentRecipeId() {
    var res = resolve();
    return res.view === 'recipe' ? res.id : null;
  }
  /* One hidden input, re-used, because a file input per card is a
     lot of DOM for something only ever used one at a time. */
  function pickFile(cb) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (f) cb(f);
    });
    inp.click();
  }

  // ============================================================
  // §THE GROCERY LIST
  //
  // RE-DRESSED, NEVER REBUILT. Every selector behind this markup is
  // the code that was restored after this list was destroyed once,
  // on 2026-08-27, by a "Clear ticked" button that deleted instead
  // of hiding. The rules that came out of that are absolute:
  //
  //   · TICKING HIDES. Lar.groceryRemaining() is the only filter;
  //     the item stays in storage until Reset brings it back.
  //   · NOTHING ON THIS SCREEN MAY BULK-REMOVE. The only deletion
  //     here is the per-item x, and it names the item in a confirm.
  //     Lar.deleteCheckedGrocery() exists and lives on Settings.
  //   · THE BANNER IS LOAD-BEARING. A list that empties as you tick
  //     it looks exactly like a list that is deleting things.
  // ============================================================
  function viewGrocery() {
    var host = $('larView');
    var remaining = L().groceryRemaining();
    var ticked = L().groceryCheckedCount();
    var groups = L().groceryByStore();
    var stores = L().Stores.list();

    var out = '';
    out += '<form class="lar-add" id="larGroceryForm">' +
      '<input class="asc-input" id="larGroName" placeholder="Add something" ' +
        'autocomplete="off" aria-label="What to add">' +
      '<input class="asc-input asc-input--qty" id="larGroQty" type="number" min="0" step="any" ' +
        'value="1" aria-label="How many">' +
      (stores.length
        ? '<select class="asc-select" id="larGroStore" aria-label="Which shop">' +
            '<option value="">Anywhere</option>' +
            stores.map(function (s) {
              return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>';
            }).join('') +
          '</select>'
        : '') +
      '<button class="asc-btn asc-btn--primary" type="submit">Add</button>' +
    '</form>';

    if (ticked) {
      out += '<div class="lar-banner">' + mark('lar-basket') +
        '<span><b>' + U().plural(ticked, 'item') + ' ticked off.</b> ' +
        'They are kept, not deleted &mdash; Reset the list brings them all back for the next shop.</span>' +
      '</div>';
    }

    if (!remaining.length) {
      out += emptyState(
        ticked ? 'Everything is ticked off.' : 'The list is empty.',
        ticked
          ? 'Nothing has been deleted. Reset the list and the whole thing comes back.'
          : 'Add what you need above, or open a recipe and send its ingredients here.',
        ticked
          ? '<button type="button" class="asc-btn asc-btn--primary" data-groreset="1">Reset the list</button>'
          : '<button type="button" class="asc-btn" data-go="#/">Open the recipe book</button>');
    } else {
      // groceryByStore() returns each shelf as { id, name, color, rows }
      // — `rows`, and it carries the colour itself, so nothing here
      // needs to go back to Stores.get().
      groups.forEach(function (g) {
        var shut = ui.shut['shelf:' + (g.id || 'none')];
        out += '<section class="lar-shelf' + (shut ? ' is-shut' : '') +
          '" style="--lar-tint:' + esc(g.color || 'var(--hd-acc)') + '">' +
          '<button type="button" class="lar-shelf__t" data-shelf="' + esc(g.id || 'none') + '" ' +
            'aria-expanded="' + (shut ? 'false' : 'true') + '">' +
            '<span class="lar-shelf__dot"></span>' +
            '<span class="lar-shelf__n">' + esc(g.name) + '</span>' +
            '<span class="lar-shelf__c">' + g.rows.length + '</span>' +
            '<span class="lar-shelf__fold">' + mark('lar-chev') + '</span>' +
          '</button>' +
          '<div class="lar-shelf__body">';
        g.rows.forEach(function (it, i) {
          out += '<div class="lar-item ' + U().rvlClass() + '"' + U().rvlStyle(i) + '>' +
            '<button type="button" class="lar-tick" data-gotick="' + esc(it.id) + '" ' +
              'aria-label="Tick off ' + esc(it.name) + '">' + mark('lar-check') + '</button>' +
            '<span class="lar-item__n">' + esc(it.name) +
              (groceryOrigin(it) ? '<span class="lar-item__from">' + esc(groceryOrigin(it)) + '</span>' : '') +
            '</span>' +
            '<span class="lar-item__q">' + esc(qtyLabel(it)) + '</span>' +
            '<button type="button" class="lar-item__x" data-godel="' + esc(it.id) + '" ' +
              'aria-label="Delete ' + esc(it.name) + '">&times;</button>' +
          '</div>';
        });
        out += '</div></section>';
      });
    }

    out += '<div class="hd-util" style="margin-top:36px">' +
      '<span class="hd-util__n">' + U().plural(remaining.length, 'thing') + ' to buy</span>' +
      '<span class="hd-util__sp"></span>' +
      (ticked ? '<button type="button" class="hd-util__b" data-groreset="1">Reset the list</button>' : '') +
      '<button type="button" class="hd-util__b" data-newstore="1">Add a shop</button>' +
    '</div>';

    host.innerHTML = pageHero({
      eyebrow: 'Grocery', title: 'What to buy',
      caption: 'A standing list. Ticking something off hides it until you reset for the next shop.',
      card: null
    }) + band('<div class="lar-grocery">' + out + '</div>');
  }
  function qtyLabel(it) {
    var q2 = it.quantity == null ? '' : String(it.quantity);
    return (q2 + ' ' + (it.unit || '')).trim();
  }
  function groceryOrigin(it) {
    if (it.fromRecipeId) {
      var r = L().Recipes.get(it.fromRecipeId);
      if (r) return 'from ' + r.title;
    }
    return '';
  }
  /* The ONE funnel for "ingredients to the list", kept exactly as it
     was: de-duped case-insensitively against the UNCHECKED items
     only, so something you ticked off this morning can be added
     again this afternoon. */
  function addNamesToGrocery(rows, meta) {
    var have = {};
    L().groceryRemaining().forEach(function (it) { have[it.name.toLowerCase()] = true; });
    var n = 0;
    rows.forEach(function (row) {
      var name = String(row.name || '').trim();
      if (!name || have[name.toLowerCase()]) return;
      var rec = { name: name, quantity: row.quantity, unit: row.unit, storeId: row.storeId || null };
      if (meta) for (var k in meta) rec[k] = meta[k];
      L().GroceryItems.add(rec);
      have[name.toLowerCase()] = true;
      n++;
    });
    return n;
  }

  // ============================================================

    var stores = L().Stores.list();
    out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>Shops</span>' +

    if (!stores.length) {

    } else {

          '<span class="lar-list__dot"></span>' +
          '<span class="lar-list__n">' + esc(s.name) + '</span>' +
          '<button type="button" class="lar-list__b" data-delstore="' + esc(s.id) + '">Delete</button>' +
        '</div>';
      });
      out += '</div>';
      out += '<p class="hd-note" style="color:var(--hd-fg-3);margin-top:12px">' +
        'Deleting a shop empties its shelf, it does not throw the shopping away.</p>';
    }

    // ── the rebuild ──
    if (legacy.length) {
      out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>The old Nutrition Studio</span></h2></div>';
      out += '<p class="hd-note" style="color:var(--hd-fg-2);line-height:1.7">' +
        'This page used to carry meal logging, a food table, saved meals, a meal plan, ' +
        'nutrition goals, supplements and notes. They are gone from the interface. ' +
        'Their records are still on this device:</p>';
      out += '<ul class="lar-ings" style="margin:14px 0 18px">' + legacy.map(function (c) {
        return '<li><span class="lar-ings__amt">' + c.n + '</span>' +
          '<span class="lar-ings__n">' + esc(c.label) + '</span></li>';
      }).join('') + '</ul>';
      out += '<p class="hd-note" style="color:var(--hd-fg-3)">A snapshot is taken before anything ' +
        'is removed, and it can be restored for thirty days.</p>';
    }

    // ── your data ──
    out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>Your data</span></h2></div>';
    out += '<div class="lar-add" style="margin-bottom:26px">' +
      '<button type="button" class="asc-btn" data-export="1">Download everything</button>' +
      '<button type="button" class="asc-btn" data-snapshot="1">Take a snapshot</button>' +
    '</div>';

    if (snaps.length) {
      out += '<p class="lar-fset__t">Snapshots on this device</p><div class="lar-list">';
      snaps.slice(0, 10).forEach(function (s) {
        out += '<div class="lar-list__row">' +
          '<span class="lar-list__n">' + esc(snapLabel(s)) + '</span>' +
          '<button type="button" class="lar-list__b" data-restore="' + esc(s.id) + '">Restore</button>' +
        '</div>';
      });
      out += '</div>';
      out += '<p class="hd-note" style="color:var(--hd-fg-3);margin-top:12px">' +
        'Snapshots are local to this browser and never sync, so a restore can only be run ' +
        'on the device where something was lost.</p>';
    }

    // ── the grocery escape hatches, deliberately here and not there ──
    var ticked = L().groceryCheckedCount();
    out += '<div class="lar-sect"><h2 class="lar-sect__t"><span>The grocery list</span></h2></div>';
    out += '<div class="lar-add">' +
      '<button type="button" class="asc-btn" data-grorestore="1">Restore it from a snapshot</button>' +
      (ticked
        ? '<button type="button" class="asc-btn asc-btn--danger" data-gropurge="1">Delete the ' +
          ticked + ' ticked-off ' + (ticked === 1 ? 'item' : 'items') + '</button>'
        : '') +
    '</div>';
    out += '<p class="hd-note" style="color:var(--hd-fg-3);margin-top:12px">' +
      'Nothing on the Grocery screen itself can bulk-delete. That is on purpose: ' +
      'a list that empties as you tick it looks exactly like a list that is deleting things.</p>';

    host.innerHTML = pageHero({
      eyebrow: 'Settings', title: 'How the book is filed',
      caption: 'Categories, shops, and every way of getting your data back out.',
      card: null, short: true, back: 'Recipes'
    }) + band(out);

    mountGroupSort();
  }
  function snapLabel(s) {
    var when = s.at ? new Date(s.at) : null;
    var stamp = when ? when.toLocaleString(undefined, {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
    }) : 'unknown';
    var counts = s.counts || {};
    var bits = Object.keys(counts).map(function (k) { return counts[k] + ' ' + k; });
    return stamp + (bits.length ? '  ' + bits.join(', ') : '') + (s.reason ? '  (' + s.reason + ')' : '');
  }
  function mountGroupSort() {
    var el = $('larGroups');
    if (!el || typeof window.Sortable === 'undefined') return;
    window.Sortable.create(el, {
      animation: 150,
      // The grip, not the row — Edit and Delete must stay pressable.
      handle: '.lar-list__grip',
      draggable: '.lar-list__row',
      onEnd: function () {
        var ids = Array.prototype.map.call(
          el.querySelectorAll('[data-group]'), function (n) { return n.dataset.group; });
        L().reorderGroups(ids);
        toast('Order saved');
        refreshCurrentView();
      }
    });
  }

  }
  function input(name, value, opts) {
    opts = opts || {};

      (opts.type ? ' type="' + opts.type + '"' : '') +
      (opts.min != null ? ' min="' + opts.min + '"' : '') +
      (opts.step ? ' step="' + opts.step + '"' : '') +

  function readFields(root) {
    var out = {};

      out[el.getAttribute('data-f')] = el.value;

  function openRecipeEditor(id) {
    var r = id ? L().Recipes.get(id) : null;
    var groups = L().catList();
    var ings = r
      ? L().RecipeIngredients.list().filter(function (x) { return x.recipeId === r.id; })
          .sort(function (a, b) { return a.order - b.order; })
          .map(function (x) { return ((String(x.amount || '') + ' ' + (x.unit || '')).trim() + ' ' + x.name).trim(); })
          .join('\n')
      : '';

    /* NOTE WHAT IS NOT IN THIS SHEET: the steps. The method is
       edited on the page, and keeping it out of here is what makes
       the old photo-wiping bug impossible rather than merely fixed —
       a sheet cannot destroy what it never reads. */
    var html =
      '<h2 class="hd-title" style="font-size:26px;margin:0 0 20px">' +
        (r ? 'Edit ' + esc(r.title) : 'A new recipe') + '</h2>' +
      fieldRow('Name', input('title', r ? r.title : '', { placeholder: 'Braised short rib ragu', autofocus: true })) +
      fieldRow('Category',
        '<select class="asc-select" data-f="groupId">' +
          groups.map(function (g) {
            return '<option value="' + esc(g.id) + '"' +
              ((r ? r.groupId : groups[0].id) === g.id ? ' selected' : '') + '>' + esc(g.label) + '</option>';
          }).join('') +
          '<option value="__new">&#65291; New category&hellip;</option>' +
        '</select>') +
      fieldRow('What it is', textarea('description', r ? r.description : '',
        { placeholder: 'A sentence about why you make it.' })) +
      '<div class="lar-add">' +
        '<div style="flex:1 1 90px">' + fieldRow('Serves',
          input('servings', r ? r.servings : 2, { type: 'number', min: 1 })) + '</div>' +
        '<div style="flex:1 1 90px">' + fieldRow('Prep (min)',
          input('prepTimeMin', r ? r.prepTimeMin : '', { type: 'number', min: 0 })) + '</div>' +
        '<div style="flex:1 1 90px">' + fieldRow('Cook (min)',
          input('cookTimeMin', r ? r.cookTimeMin : '', { type: 'number', min: 0 })) + '</div>' +
      '</div>' +
      fieldRow('Ingredients &mdash; one per line',
        textarea('ings', ings, { tall: true, placeholder: '500 g beef short rib\n2 carrots, diced\na handful of parsley' })) +
      fieldRow('Tags &mdash; comma separated',
        input('tags', r ? (r.tags || []).join(', ') : '', { placeholder: 'quick, make-ahead' })) +
      fieldRow('Notes', textarea('notes', r ? r.notes : '',
        { placeholder: 'What you would do differently next time.' })) +
      '<div class="asc-sheet__acts">' +
        '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Cancel</button>' +
        '<button type="button" class="asc-btn asc-btn--primary" data-save="1">' +
          (r ? 'Save' : 'Write it') + '</button>' +
      '</div>';

    U().openSheet(html);
    wireNewGroupDoor(U().sheetEl());

    U().sheetEl().querySelector('[data-save]').addEventListener('click', function () {
      var f = readFields(U().sheetEl());
      var title = String(f.title || '').trim();
      if (!title) { toast('It needs a name'); return; }
      if (f.groupId === '__new') f.groupId = L().FALLBACK_GROUP;

      var patch = {
        title: title,
        groupId: f.groupId,
        description: f.description,
        servings: Number(f.servings) || 1,
        prepTimeMin: Number(f.prepTimeMin) || 0,
        cookTimeMin: Number(f.cookTimeMin) || 0,
        notes: f.notes,
        tags: String(f.tags || '').split(',').map(function (s) { return s.trim(); })
          .filter(Boolean)
      };
      var rec = r ? L().Recipes.update(r.id, patch) : L().Recipes.add(patch);
      if (!rec) { toast('That did not save'); return; }
      writeIngredients(rec.id, f.ings);
      U().closeSheet();
      toast(r ? 'Saved' : 'Written down');
      if (r) repaintRecipe(rec.id); else go('#/r/' + rec.id);
    });
  }

  /* Ingredients are REPLACED wholesale from the textarea, which is
     how this has always worked. The parse is deliberately loose:
     "1/2 tsp salt", "a handful of parsley" and "salt" all have to
     land somewhere sensible, so anything that does not start with a
     quantity is simply a name. */
  function writeIngredients(recipeId, text) {
    L().RecipeIngredients.list().forEach(function (x) {
      if (x.recipeId === recipeId) L().RecipeIngredients.remove(x.id);
    });
    String(text || '').split('\n').forEach(function (line, i) {
      line = line.trim();
      if (!line) return;
      var m = line.match(/^([\d./]+)\s*([a-zA-Z]+)?\s+(.*)$/);
      var amount = '', unit = '', name = line;
      if (m) {
        amount = m[1];
        // "2 carrots" — carrots is the name, not the unit. A word is
        // only a unit if it is one we know.
        if (m[2] && L().UNITS.indexOf(m[2].toLowerCase()) !== -1) { unit = m[2]; name = m[3]; }
        else { name = ((m[2] || '') + ' ' + m[3]).trim(); }
      }
      L().RecipeIngredients.add({
        recipeId: recipeId, name: name, amount: amount, unit: unit, order: i
      });
    });
  }

  /* "＋ New category…" IS NOT A VALUE, IT IS A DOOR. Caught on
     change so the category exists by the time anything is saved,
     and the select is put back on a real one rather than left
     showing the door. */
  function wireNewGroupDoor(root) {
    var sel = root.querySelector('[data-f="groupId"]');
    if (!sel) return;
    sel.__prev = sel.value;
    sel.addEventListener('change', function () {
      if (sel.value !== '__new') { sel.__prev = sel.value; return; }
      var name = window.prompt('Name the new category');
      var back = sel.__prev;
      if (name && name.trim()) {
        var made = L().addGroup(name.trim(), L().GROUP_HUES[4].hue);
        var opt = document.createElement('option');
        opt.value = made.id; opt.textContent = made.label;
        sel.insertBefore(opt, sel.lastElementChild);
        back = made.id;
        toast('Added ' + made.label);
      }
      sel.value = back;
      sel.__prev = back;
    });
  }

  function openGroupEditor(id) {

        '<button type="button" class="asc-btn asc-btn--primary" data-save="1">Save</button>' +

    var root = U().sheetEl();

    root.querySelector('#larHues').addEventListener('click', function (e) {

      });

      var f = readFields(root);
      var label = String(f.label || '').trim();
      if (!label) { toast('It needs a name'); return; }
      if (g) L().updateGroup(g.id, { label: label, hue: f.hue });
      else L().addGroup(label, f.hue);
      U().closeSheet();
      toast('Saved');
      refreshCurrentView();
    });
  }

  /* Deleting a category ALWAYS asks where its recipes go. It never
     silently un-files them, and it never offers to delete them:
     a category is a label, and removing a label is not a reason to
     lose the thing it was on. */
  function confirmDeleteGroup(id) {
    var g = L().catById(id);
    var n = L().groupCounts()[id] || 0;
    var others = L().catList().filter(function (c) { return c.id !== id; });
    var html =
      '<h2 class="hd-title" style="font-size:24px;margin:0 0 16px">Delete ' + esc(g.label) + '?</h2>' +
      '<p class="asc-body">' +
        (n ? 'The ' + U().plural(n, 'recipe') + ' in it will be re-filed. Nothing is deleted but the category itself.'
           : 'Nothing is filed under it.') +
      '</p>' +
      (n ? fieldRow('Move them to',
        '<select class="asc-select" data-f="dest">' + others.map(function (c) {
          return '<option value="' + esc(c.id) + '"' +
            (c.id === L().FALLBACK_GROUP ? ' selected' : '') + '>' + esc(c.label) + '</option>';
        }).join('') + '</select>') : '') +
      '<div class="asc-sheet__acts">' +
        '<button type="button" class="asc-btn asc-btn--quiet" data-act="sheet-close">Keep it</button>' +
        '<button type="button" class="asc-btn asc-btn--danger" data-save="1">Delete the category</button>' +
