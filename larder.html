    refresh();
  };

  function setPlan(date, slot, value) {
    var plan = L._store.get(L.KEYS.plan) || {};
    if (!plan[date]) plan[date] = {};
    if (value) plan[date][slot] = { kind: value.kind, id: value.id, label: value.label };
    else delete plan[date][slot];
    if (!Object.keys(plan[date]).length) delete plan[date];
    // Trimmed the way every dated store here is, so the key cannot
    // grow forever.
    var keys = Object.keys(plan).sort();
    if (keys.length > 240) keys.slice(0, keys.length - 240).forEach(function (k) { delete plan[k]; });
    L._store.set(L.KEYS.plan, plan);
  }

  /** Tapping a slot on the Plan screen: choose a meal, a recipe, or type one. */
  ACTIONS['plan-set'] = function (el) {
    var date = el.getAttribute('data-date');
    var slot = el.getAttribute('data-slot');
    var meals = L.Meals.list(), recipes = L.Recipes.list();
    var html = '<div class="lar-sheet__head">' +
      '<div><p class="lar-eyebrow">' + esc(U.dateLabel(date)) + ' &middot; ' +
        esc(L.SLOT_LABELS[slot]) + '</p><h2 class="lar-h2">What are you having?</h2></div>' +
      '<button class="lar-sheet__close" data-act="sheet-close" aria-label="Close">&times;</button></div>' +
      '<input type="hidden" id="larPlanDate" value="' + esc(date) + '">' +
      '<input type="hidden" id="larPlanSlot" value="' + esc(slot) + '">' +
      '<div class="lar-field"><label class="lar-label" for="larPlanFree">Type it</label>' +
      '<div class="lar-toolbar"><input class="lar-input" id="larPlanFree" placeholder="Tacos" data-autofocus>' +
      '<button class="lar-btn lar-btn--go" data-act="plan-free">Set</button></div></div>';
    if (meals.length) {
      html += '<p class="lar-label">Saved meals</p><div class="lar-chips">' +
        meals.map(function (m) {
          return '<button class="lar-chip" data-act="plan-put" data-kind="meal" ' +
            'data-id="' + esc(m.id) + '" data-label="' + esc(m.name) + '">' + esc(m.name) + '</button>';
        }).join('') + '</div>';
    }
    if (recipes.length) {
      html += '<p class="lar-label" style="margin-top:var(--lar-s3)">Recipes</p><div class="lar-chips">' +
        recipes.map(function (r) {
          return '<button class="lar-chip" data-act="plan-put" data-kind="recipe" ' +
            'data-id="' + esc(r.id) + '" data-label="' + esc(r.title) + '">' + esc(r.title) + '</button>';
        }).join('') + '</div>';
    }
    html += '<button class="lar-btn lar-btn--ghost lar-btn--wide" data-act="plan-clear" ' +
      'style="margin-top:var(--lar-s3)">Clear this meal</button>';
    U.openSheet(html);
  };
  function planTarget() {
    return {
      date: (document.getElementById('larPlanDate') || {}).value,
      slot: (document.getElementById('larPlanSlot') || {}).value
    };
  }
  ACTIONS['plan-put'] = function (el) {
    var t = planTarget();
    setPlan(t.date, t.slot, {
      kind: el.getAttribute('data-kind'),
      id: el.getAttribute('data-id'),
      label: el.getAttribute('data-label')
    });
    U.closeSheet(); refresh();
  };
  ACTIONS['plan-free'] = function () {
    var t = planTarget();
    var v = ((document.getElementById('larPlanFree') || {}).value || '').trim();
    if (!v) return;
    setPlan(t.date, t.slot, { kind: 'free', id: '', label: v });
    U.closeSheet(); refresh();
  };
  ACTIONS['plan-clear'] = function () {
    var t = planTarget();
    setPlan(t.date, t.slot, null);
    U.closeSheet(); refresh();
  };

  // ---- grocery ---------------------------------------------
  ACTIONS['grocery-add'] = function () {
    var name = ((document.getElementById('larGroName') || {}).value || '').trim();
    if (!name) return;
    L.GroceryItems.add({
      name: name,
      quantity: Number((document.getElementById('larGroQty') || {}).value) || 1,
      storeId: (document.getElementById('larGroStore') || {}).value || null
    });
    refresh();
    var el = document.getElementById('larGroName');
    if (el) el.focus();
  };
  ACTIONS['grocery-toggle'] = function (el) {
    var x = L.GroceryItems.get(el.getAttribute('data-id'));
    if (!x) return;
    // Ticking HIDES. It does not delete. The item stays in
    // storage with checked:true until the next reset.
    L.GroceryItems.update(x.id, { checked: true });
    refresh();
  };

  ACTIONS['grocery-reset'] = function () {
    var n = L.resetGroceryList();
    U.toast(n ? n + ' ' + U.plural(n, 'item') + ' back on the list' : 'Nothing was ticked');
    refresh();
  };

  // The only path that removes a grocery item, and it names the
  // item it is about to remove. There is deliberately no bulk
  // delete in this toolbar — that is what took the list out.
  ACTIONS['grocery-del'] = function (el) {
    var x = L.GroceryItems.get(el.getAttribute('data-id'));
    if (!x) return;
    if (!confirm('Delete "' + x.name + '" from the list for good?\n\n' +
                 'To just tick it off for this shop, use the checkbox instead.')) return;
    L.GroceryItems.remove(x.id);
    U.toast('Deleted ' + x.name);
    refresh();
  };

  ACTIONS['shelf-toggle'] = function (el) {
    var key = el.getAttribute('data-store');
    if (collapsedStores[key]) delete collapsedStores[key];
    else collapsedStores[key] = true;
    refresh();
  };
  ACTIONS['store-new'] = function () {
    U.openSheet('<div class="lar-sheet__head">' +
      '<div><p class="lar-eyebrow">Grocery</p><h2 class="lar-h2">Add a store</h2></div>' +
      '<button class="lar-sheet__close" data-act="sheet-close" aria-label="Close">&times;</button></div>' +
      '<div class="lar-field"><label class="lar-label" for="larStoreName">Name</label>' +
      '<input class="lar-input" id="larStoreName" data-autofocus></div>' +
      '<button class="lar-btn lar-btn--go lar-btn--wide" data-act="store-save">Add store</button>');
  };
  ACTIONS['store-save'] = function () {
    var name = ((document.getElementById('larStoreName') || {}).value || '').trim();
    if (name) L.Stores.add({ name: name });
    U.closeSheet(); refresh();
  };

  // ---- supplements -----------------------------------------
  ACTIONS['supp-new'] = function () {
    U.openSheet('<div class="lar-sheet__head">' +
      '<div><p class="lar-eyebrow">Supplements</p><h2 class="lar-h2">Add one</h2></div>' +
      '<button class="lar-sheet__close" data-act="sheet-close" aria-label="Close">&times;</button></div>' +
      '<div class="lar-field"><label class="lar-label" for="larSuppName">Name</label>' +
      '<input class="lar-input" id="larSuppName" data-autofocus></div>' +
      '<div class="lar-field"><label class="lar-label" for="larSuppDose">Dose</label>' +
      '<input class="lar-input" id="larSuppDose" placeholder="2 capsules"></div>' +
      '<div class="lar-field"><label class="lar-label" for="larSuppSlot">When</label>' +
      '<select class="lar-select" id="larSuppSlot">' +
      L.SUPPLEMENT_SLOTS.map(function (s) {
        return '<option value="' + s + '">' + esc(slotLabel(s)) + '</option>';
      }).join('') + '</select></div>' +
      '<button class="lar-btn lar-btn--go lar-btn--wide" data-act="supp-save">Add</button>');
  };
  ACTIONS['supp-save'] = function () {
    var name = ((document.getElementById('larSuppName') || {}).value || '').trim();
    if (!name) { U.toast('Give it a name'); return; }
    L.Supplements.add({
      name: name,
      dose: (document.getElementById('larSuppDose') || {}).value || '',
      slot: (document.getElementById('larSuppSlot') || {}).value || 'morning'
    });
    U.closeSheet(); refresh();
  };
  ACTIONS['supp-del'] = function (el) {
    L.Supplements.remove(el.getAttribute('data-id'));
    refresh();
  };

  // ---- notes -----------------------------------------------
  ACTIONS['note-del'] = function (el) {
    L.Notes.remove(el.getAttribute('data-id'));
    refresh();
  };

  // ---- targets ---------------------------------------------
  ACTIONS['targets-save'] = function () {
    var unit = (document.getElementById('larT_unit') || {}).value || 'oz';
    L.setTargets({
      kcal: numVal('larT_kcal'), protein: numVal('larT_protein'), carbs: numVal('larT_carbs'),
      fat: numVal('larT_fat'), fibre: numVal('larT_fibre'),
      waterUnit: unit,
      waterMl: U.unitToMl(numVal('larT_water'), unit),
      waterSteps: ((document.getElementById('larT_steps') || {}).value || '')
        .split(',').map(function (s) { return Number(s.trim()); }).filter(function (n) { return n > 0; }),
      vegTarget: numVal('larT_veg'), fruitTarget: numVal('larT_fruit')
    });
    U.toast('Goals saved');
    refresh();
  };

  // ---- data ------------------------------------------------
  ACTIONS['data-download'] = function () {
    if (window.LarSync) { window.LarSync.download(); U.toast('Backup downloaded'); }
  };
  ACTIONS['data-snapshot'] = function () {
    if (window.LarBackup) {
      window.LarBackup.snapshot('manual', { force: true, pinned: true });
      U.toast('Snapshot taken');
      refresh();
    }
  };
  ACTIONS['data-restore'] = function (el) {
    if (!window.LarBackup) return;
    if (!confirm('Roll everything back to this snapshot?\n\n' +
                 'Foods, meals, recipes and the food log are replaced too. ' +
                 'The current state is snapshotted first, so this is reversible.')) return;
    var r = window.LarBackup.restore(el.getAttribute('data-id'));
    U.toast(r.ok ? 'Restored ' + r.written + ' keys' : 'That snapshot is gone');
    refresh();
  };

  ACTIONS['grocery-restore'] = function (el) {
    if (!window.LarBackup) return;
    var snap = window.LarBackup.get(el.getAttribute('data-id'));
    if (!snap) { U.toast('That snapshot is gone'); return; }
    var r = L.restoreGroceryFrom(snap);
    if (!r.items && !r.stores) U.toast('Everything in it is already on your list');
    else U.toast(r.items + ' ' + U.plural(r.items, 'item') + ' back on the list');
    refresh();
  };

  ACTIONS['grocery-purge'] = function () {
    var n = L.groceryCheckedCount();
    if (!n) return;
    if (!confirm('Delete ' + n + ' ticked ' + U.plural(n, 'item') + ' for good?\n\n' +
                 'This cannot be undone from here. To put them back on the list ' +
                 'instead, use Reset list.')) return;
    L.deleteCheckedGrocery();
    U.toast(n + ' deleted');
    refresh();
  };

  ACTIONS['noop'] = function () {};

  // The food search is a field, not a button, so it cannot go
  // through the click delegate. One listener, re-bound each
  // render because the field is destroyed with the view.
  function bindFoodSearch() {
    var el = document.getElementById('larFoodSearch');
    if (!el) return;
    el.addEventListener('input', function () {
      foodQuery = el.value;
      var at = el.selectionStart;
      refresh();
      // refresh() rebuilt the field, so put the caret back.
      var next = document.getElementById('larFoodSearch');
      if (next) { next.focus(); try { next.setSelectionRange(at, at); } catch (e) {} }
    });
  }

  // ==========================================================
  // BOOT
  // ==========================================================
  function bootError(what, err) {
    var bar = document.createElement('div');
    bar.setAttribute('style',
      'position:fixed;left:0;right:0;top:0;z-index:3200;padding:10px 14px;' +
      'background:#5a1410;color:#ffd9d4;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;');
    bar.textContent = what + ' failed to start: ' + (err && err.message ? err.message : String(err));
    document.body.appendChild(bar);
    if (window.console) console.error(what, err);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var ready = (window.LocalStoreIDB && window.LocalStoreIDB.ready)
      ? window.LocalStoreIDB.ready() : Promise.resolve();

    ready.then(function () {
      L = window.Lar;
      P = window.Pal || null;
      if (!L) { bootError('The Larder', new Error('larder-data.js did not load')); return; }

      // The local snapshot floor, taken BEFORE the opening pull so
      // it records what this device held when it was opened.
      if (window.LarBackup) window.LarBackup.boot();

      U.bindSheet();
      U.delegate(root, ACTIONS);
      U.delegate(document.getElementById('larSheetBg'), ACTIONS);
      U.delegate(document.getElementById('larRoutes'), ACTIONS);

      // The hero lives OUTSIDE #larRoot, so the root's delegated
      // listener cannot see its card. It gets its own, on the same
      // ACTIONS map — one dispatch table, three hosts.
      if (window.LarHero) {
        window.LarHero.mount({ before: root });
        U.delegate(window.LarHero.el(), ACTIONS);
      }

      U.introArrive();
      shownRoute = current().hash;
      render();

      window.addEventListener('hashchange', navigate);
      L.onChange(function () { repaint(); });

      // The palaestra row, for pal:levels and nothing else. Mounted
      // through MainSync because main-sync.js is where the `pal:`
      // prefix is declared — see the head comment.
      if (window.MainSync) {
        window.MainSync.mount(['palaestra'], { onApplied: function () { repaint(); } });
      }

      // The Larder's own two rows, then the migrations and the
      // seed, both gated on the cloud having had its say.
      if (window.LarSync) {
        var state = window.LarSync.mountAndSeed({ onApplied: function () { repaint(); } });
        L.seedAfterSyncAttempt(state.ref, function (changed) { if (changed) refresh(); });
      } else {
        L.seedAfterSyncAttempt(null, function (changed) { if (changed) refresh(); });
      }
    }).catch(function (err) { bootError('The Larder', err); });
  });
})();
</script>
